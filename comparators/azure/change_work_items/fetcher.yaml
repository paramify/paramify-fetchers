name: azure_change_work_items
version: 0.1.0
description: >-
  Shows whether each direct edit or manual deployment in Azure is recorded by an Azure DevOps work item, and whether
  that record is approved.
category: azure

depends_on:
  - azure_change_provenance
  - azure_devops_work_items

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_change_work_items.json

secrets: []

config_schema:
  origins:
    type: string
    required: false
    default: direct,manual_deployment
    env: CHANGE_RECORD_ORIGINS
    description: >
      Comma-separated azure_change_provenance origins that need a record. direct is an edit made outside any
      deployment or pipeline; manual_deployment is an ARM deployment a person ran, from the CLI or through the
      Portal's create wizards.
  excluded_callers:
    type: string
    required: false
    env: CHANGE_RECORD_EXCLUDED_CALLERS
    description: >
      Comma-separated callers (application ids or user principal names) whose changes need no record, such
      as a Microsoft service that manages resources on your behalf. Matched without regard to case.
  environments:
    type: string
    required: false
    env: CHANGE_RECORD_ENVIRONMENTS
    description: >
      Comma-separated azure_change_provenance environment target labels to check. Leave empty to check every
      target.
  record_types:
    type: string
    required: false
    env: CHANGE_RECORD_TYPES
    description: >
      Comma-separated work item types that record a change. Leave empty to use the types
      azure_devops_work_items selected (its work_item_types setting).
  emergency_types:
    type: string
    required: false
    default: Hotfix
    env: CHANGE_RECORD_EMERGENCY_TYPES
    description: >
      Comma-separated record types for emergency changes, which may be filed after the change they record
      (see emergency_hours_before). "none" names no type.
  record_people:
    type: string
    required: false
    default: assigned_to,created_by,closed_by
    env: CHANGE_RECORD_PEOPLE
    description: >
      Which people on a work item count as the person who made the change: any of assigned_to, created_by,
      changed_by (who last changed it), resolved_by, closed_by, state_history (anyone who moved it between
      states) and approver. A change matches when its caller's user principal name equals one of their logins.
  hours_before:
    type: integer
    required: false
    default: 24
    env: CHANGE_RECORD_HOURS_BEFORE
    description: >
      How many hours before a work item was created a change it records can be made.
  emergency_hours_before:
    type: integer
    required: false
    default: 72
    env: CHANGE_RECORD_EMERGENCY_HOURS_BEFORE
    description: >
      How many hours before an emergency work item (emergency_types) was created a change it records can be
      made, for a record filed after the change. The larger of this and hours_before applies.
  hours_after:
    type: integer
    required: false
    default: 24
    env: CHANGE_RECORD_HOURS_AFTER
    description: >
      How many hours after a work item was finished a change it records can be made.
  open_item_days:
    type: integer
    required: false
    default: 30
    env: CHANGE_RECORD_OPEN_ITEM_DAYS
    description: >
      How many days after a work item that is still open, or whose state the fetcher couldn't place, was
      created or last changed a change it records can be made. Keeps an item left open from recording every
      later change.

ksis:
  - KSI-CMT-RMV      # changes made outside a pipeline, each traced to the work item that records it or flagged
  - KSI-CMT-LMC      # each change recorded in the change log (a work item), with its approval
  - KSI-SVC-ACM      # configuration changes made outside automation are accounted for

evidence_set:
  reference_id: EVD-AZURE-CHANGE-WORK-ITEMS
  name: Azure Changes Outside a Pipeline and Their Work Items
  instructions: |
    Script: azure/change_work_items/fetcher.py

    Access: None of its own. It reads azure_change_provenance and azure_devops_work_items evidence from the same run, which need their own access.

    Commands Executed:
    - Read azure_change_provenance from the same run — every Azure change with its origin, caller, time and deployment
    - Read azure_devops_work_items from the same run — each work item's type, state, people, dates and approval

    Output: azure_change_work_items.json — each Azure change made outside a pipeline with its status, the work items that record it, and whether they are approved.

    Summary fields:

    What was checked?
    - changes_read — Number of changes read from azure_change_provenance, of any origin, on the targets the environments setting picks
    - change_lookback_days — Number of days of change history read: the shortest lookback of the azure_change_provenance files read; null if none was read or one doesn't give it
    - origins — List of azure_change_provenance origins checked, as configured (direct edits and manual deployments by default)
    - changes_checked — Number of changes whose origin is in origins
    - changes_excluded — Number of checked changes made by an excluded caller (the excluded_callers setting), which need no record
    - changes_excluded_by_caller — Number of excluded changes for each excluded caller
    - changes_by_application — Number of checked changes made by an application or other identity that isn't a user and isn't excluded; a work item can't name one, so these need no record and are reported apart
    - changes_by_application_by_caller — Number of application changes for each application id
    - changes_needing_record — Number of checked changes that need a record: changes_checked minus changes_excluded minus changes_by_application
    - changes_needing_record_by_origin — Number of changes needing a record for each checked origin
    - record_types — List of work item types that record a change: the record_types setting, or else the types azure_devops_work_items selected
    - record_types_not_selected — List of record types azure_devops_work_items didn't select by type, so it collected them only when they carried one of its tags
    - record_work_items — Number of collected work items of a record type that aren't Removed (cancelled)
    - work_items_cover_changes — True if the work items cover the whole change window: every work items file's collection window starts at least hours_after hours before the earliest change needing a record; false if not

    Is each change recorded by a work item?
    - changes_matched — Number of changes recorded by exactly one work item. A work item records a change when the change's caller, a person, is one of the item's people (the record_people setting, matched by login) and the change was made between hours_before hours before the item was created (emergency_hours_before for an emergency type) and hours_after hours after it was finished, or, for an item still open or in a state the fetcher couldn't place, open_item_days days after it was created or last changed
    - changes_ambiguous — Number of changes recorded by more than one work item, none picked
    - changes_unmatched — Number of changes made by a person that no work item records
    - changes_without_caller — Number of changes Azure recorded no caller for, with no named change to the same resource within 10 minutes, or in the same deployment, to take one from
    - changes_recorded — Number of changes recorded by one or more work items: changes_matched plus changes_ambiguous
    - changes_without_record — Number of changes needing a record that no work item records: changes_unmatched plus changes_without_caller
    - changes_without_record_by_origin — Number of changes without a record for each checked origin
    - changes_without_record_by_caller — Number of changes without a record for each caller, with unknown for no caller
    - percent_recorded — Percentage of changes needing a record that a work item records = changes_recorded / changes_needing_record × 100 (a whole number, 0–100); 0 when changes_needing_record is 0

    Are the records approved?
    - changes_recorded_without_approval — Number of recorded changes whose record isn't approved (moved into an approval state or given an approval comment, as azure_devops_work_items reads it); a change several items could record counts as approved only if every one is approved
    - changes_without_approved_record — Number of changes needing a record with no approved work item: changes_without_record plus changes_recorded_without_approval
    - changes_without_approved_record_by_origin — Number of changes without an approved record for each checked origin
