key: openscap_targets_scanned
name: 'OpenSCAP: At Least One Target Scanned'
type: AUTOMATED
role: completeness
statement: >
  At least one target has an OpenSCAP benchmark result (targets_scanned is above 0). Fails when no
  result file was found, any file could not be read, or the count appears other than exactly once.
  Does not check that every target that should be scanned was; see 'Every Expected Target Scanned'.
  Does not check whether the collection run succeeded.

regex: '"targets_scanned":\s*(?<targets_scanned>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # targets_scanned
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OPENSCAP-BENCHMARK-RESULTS
