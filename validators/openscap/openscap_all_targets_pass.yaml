key: openscap_all_targets_pass
name: 'OpenSCAP: Every Target Passes Its Benchmark'
type: AUTOMATED
role: configuration
statement: >
  No target's latest OpenSCAP result has a failed, error or unknown rule (all_targets_pass is
  true). A waived rule counts by its new result. Fails when any rule fails or could not be judged,
  any result file could not be read, no target was scanned, or the field appears other than
  exactly once. Does not show the profile evaluated is the one required. Does not check whether the
  collection run succeeded.

regex: '"all_targets_pass":\s*true\b'
rules_summary: MATCH_COUNT EQUALS 1
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }

evidence_sets:
  - EVD-OPENSCAP-BENCHMARK-RESULTS
