key: loki_expected_sources_configured
name: 'Loki Log Ingestion: Expected Sources Set'
type: AUTOMATED
role: completeness
source: community
statement: >
  At least one expected log source was set and checked (expected_sources_count is above 0). Fails
  when none is set or the count appears other than exactly once. Which sources should be expected
  is the organization's decision; this does not check that every source it relies on is listed.
  Does not check whether the collection run succeeded.

regex: '"expected_sources_count":\s*(?<expected_sources_count>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # expected_sources_count
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-LOKI-LOG-INGESTION
