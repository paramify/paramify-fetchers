key: alertmanager_default_route_delivers
name: 'Alertmanager: Default Route Reaches a Receiver That Delivers'
type: AUTOMATED
role: configuration
source: community
statement: >
  The top-level route's receiver, used by every alert no child route matches, has at least one
  integration such as a webhook, email or paging service (default_receiver_has_integrations is true),
  so an unmatched alert is not dropped. A configured integration is not proof that notifications are
  delivered or received. Does not check whether the collection run succeeded.

regex: '"default_receiver_has_integrations":\s*true\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-ALERTMANAGER-ALERT-DELIVERY
