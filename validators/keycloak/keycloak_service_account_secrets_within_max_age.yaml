key: keycloak_service_account_secrets_within_max_age
name: 'Keycloak: No Service Account Secret Is Older Than the Adopted Maximum'
type: AUTOMATED
role: configuration
source: community
statement: >
  No enabled service account's shared secret is older than max_secret_age_days
  (service_account_secrets_over_max_age is 0). Fails while max_secret_age_days is unset, since no
  maximum has been adopted, and while any shared secret has no recorded creation time. Service
  accounts that sign in with a key or certificate have no shared secret and pass. Does not check
  whether the collection run succeeded.

regex: '"service_account_secrets_over_max_age":\s*(?<service_account_secrets_over_max_age>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # service_account_secrets_over_max_age
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-SERVICE-ACCOUNTS
