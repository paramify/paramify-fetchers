key: keycloak_users_and_roles_read
name: 'Keycloak: Users and Their Roles Were Read'
type: AUTOMATED
role: integrity
source: community
statement: >
  The realm's users and every user's effective roles were read, so privileged_users is a number
  rather than null. Says nothing about whether any user is privileged or has a second factor. Does
  not check whether the collection run succeeded.

regex: '"privileged_users":\s*\d+'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-USERS-AND-ROLES
