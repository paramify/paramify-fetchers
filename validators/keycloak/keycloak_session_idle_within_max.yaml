key: keycloak_session_idle_within_max
name: 'Keycloak: Idle Sessions End Within the Adopted Maximum'
type: AUTOMATED
role: configuration
statement: >
  An idle sign-in session ends within the organization's adopted maximum (sso_session_idle_within_max is
  true: the realm's idle timeout is above 0 and at most max_idle_timeout_minutes). Fails while no maximum
  is set, so an unadopted value is never judged; the actual timeout is in the evidence either way. Does
  not show how applications behave when a session expires. Supports KSI-IAM-SUS. Does not check whether
  the collection run succeeded.

regex: '"sso_session_idle_within_max":\s*true\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-REALM-SECURITY
