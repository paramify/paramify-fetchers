key: keycloak_local_sign_in_phishing_resistant
name: 'Keycloak: Local Sign-In Requires a Phishing-Resistant Authenticator'
type: AUTOMATED
role: configuration
statement: >
  Every local way through the realm's browser flow passes a phishing-resistant authenticator, such as a
  WebAuthn security key or passkey or an X.509 client certificate
  (local_sign_in_requires_phishing_resistant is true), judged by Keycloak's flow rules. Leaves out session
  reuse and the federated path: what an external identity provider enforces is not visible to Keycloak and
  needs its own evidence. Account recovery is a separate check. Supports KSI-IAM-APM. Does not check
  whether the collection run succeeded.

regex: '"local_sign_in_requires_phishing_resistant":\s*true\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-REALM-SECURITY
