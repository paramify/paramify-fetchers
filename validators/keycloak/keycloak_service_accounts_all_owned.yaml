key: keycloak_service_accounts_all_owned
name: 'Keycloak: Every Service Account Has an Owner'
type: AUTOMATED
role: configuration
statement: >
  Every enabled service-account client records an owner in the client attribute set as
  owner_attribute (service_accounts_without_owner is 0). Fails while owner_attribute is unset. A
  recorded owner is a name, not proof that the person or team still exists or reviews the account.
  Does not check whether the collection run succeeded.

regex: '"service_accounts_without_owner":\s*(?<service_accounts_without_owner>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # service_accounts_without_owner
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-SERVICE-ACCOUNTS
