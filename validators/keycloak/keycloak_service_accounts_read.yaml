key: keycloak_service_accounts_read
name: 'Keycloak: Service-Account Clients Were Read'
type: AUTOMATED
role: integrity
source: community
statement: >
  The realm's clients were read, so service_account_clients is a number rather than null. Says
  nothing about any service account's secret, owner or roles. Does not check whether the collection
  run succeeded.

regex: '"service_account_clients":\s*\d+'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-SERVICE-ACCOUNTS
