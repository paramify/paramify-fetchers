key: keycloak_service_accounts_machine_only
name: 'Keycloak: No Service Account Lets a Person Sign In Through It'
type: AUTOMATED
role: configuration
statement: >
  No enabled service-account client also allows the standard (browser), implicit or direct access
  grant (password) flow (service_accounts_with_other_flows is 0), so each one is used only by a
  machine signing in as itself. Does not check whether the collection run succeeded.

regex: '"service_accounts_with_other_flows":\s*(?<service_accounts_with_other_flows>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # service_accounts_with_other_flows
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-SERVICE-ACCOUNTS
