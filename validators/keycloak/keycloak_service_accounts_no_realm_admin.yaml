key: keycloak_service_accounts_no_realm_admin
name: 'Keycloak: No Service Account Holds Realm-Admin'
type: AUTOMATED
role: configuration
statement: >
  No enabled service account holds realm-admin, directly, through a group or through a composite
  role (service_accounts_with_realm_admin is 0). Fails while any service account's roles are unread.
  Other admin roles are counted in privileged_service_accounts and not judged here. Does not check
  whether the collection run succeeded.

regex: '"service_accounts_with_realm_admin":\s*(?<service_accounts_with_realm_admin>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # service_accounts_with_realm_admin
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KEYCLOAK-SERVICE-ACCOUNTS
