key: azure_frontdoor_waf_rate_limit_rules
name: Front Door WAF Policies Have Rate-Limit Rules
type: AUTOMATED
role: configuration
statement: >
  Every Front Door (Standard/Premium) WAF policy has at least one enabled rate-limit custom rule,
  and there is at least one policy. Partially supports KSI-CNA-RVP, the precondition only: rate
  limiting is in place to alert on. It does not assert that any alert fires on rate-limit hits or
  availability, or that alerts route to an active action group (Azure Monitor alert evidence), nor
  that the thresholds are sensible.

# Rows: waf_policies_with_rate_limit_rules equals total_waf_policies, which is above 0.
regex: '"total_waf_policies":\s*(?<total_waf_policies>\d+),[\s\S]*?"waf_policies_with_rate_limit_rules":\s*(?<waf_policies_with_rate_limit_rules>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]; MATCH_GROUP[1] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # waf_policies_with_rate_limit_rules
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 1 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # total_waf_policies
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-FRONTDOOR-WAF
