key: azure_endpoint_availability_tests_fully_measured
name: 'Azure Endpoint Availability: No Test Missing an Hour of Results'
type: AUTOMATED
role: configuration
source: community
statement: >
  No enabled availability test has an hour of the lookback without a result
  (availability_tests_with_missing_measurements is 0), so the measured availability covers the whole
  period. These are inputs to availability reporting; they do not replace the availability reporting
  itself. Does not check whether the collection run succeeded.

regex: '"availability_tests_with_missing_measurements":\s*(?<availability_tests_with_missing_measurements>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # availability_tests_with_missing_measurements
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
