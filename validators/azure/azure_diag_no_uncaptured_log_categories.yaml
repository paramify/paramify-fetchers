key: azure_diag_no_uncaptured_log_categories
name: No Azure Log Category Left Unexported
type: AUTOMATED
role: configuration
statement: >
  Every log category every resource emits is exported by an enabled diagnostic setting (by name, by
  category group, or allLogs): zero resources with a non-empty uncaptured_log_categories. Supports
  KSI-MLA-OSM, including security categories outside Azure's audit group, and KSI-MLA-LET, taking
  every available category as required. Does not prove a narrower per-type required list or the
  organization's documented exclusions (a documented exclusion still fails here), or the
  destination. Counts violations, so azure_diag_uncaptured_category_lists_present must pass
  alongside it.

regex: '"uncaptured_log_categories":\s*\[\s*"'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-DIAG-SETTINGS
