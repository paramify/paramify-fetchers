key: azure_resource_locks_protected_resources_locked
name: 'Azure Resource Locks: Every Protected Resource Is Locked Against Deletion'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every resource of a protected type (protected_types setting, or the default list) has a
  CanNotDelete or ReadOnly lock in effect, placed on the resource, its resource group or the
  subscription (all_protected_resources_locked is true). Fails when the lock or resource list could
  not be read or no protected resource exists. A lock acts on the management plane only: data inside
  a locked resource, such as blobs or log rows, is not protected by it. Does not check whether the
  collection run succeeded.

regex: '"all_protected_resources_locked":\s*true\b'
rules_summary: MATCH_COUNT EQUALS 1
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }

evidence_sets:
  - EVD-AZURE-RESOURCE-LOCKS
