key: azure_data_explorer_event_hubs_not_open_to_all_networks
name: Azure Data Explorer And Event Hubs Not Open To All Networks
type: AUTOMATED
role: configuration
statement: >
  No Data Explorer cluster has public network access on without an allowed-IP list, no Event Hubs
  namespace has public network access on with a network rule set defaulting to Allow, and no
  namespace's network exposure is unknown. Does not assert that allow-listed ranges or virtual
  network rules are approved. Supports Coverage row 104 (Trusted Connection Review / KSI-CNA-RNT)
  (proposed mapping, not yet audited).

regex: '"data_explorer_clusters_open_to_all_networks":\s*(?<data_explorer_clusters_open_to_all_networks>\d+)[\s\S]*?"event_hub_namespaces_network_exposure_unknown":\s*(?<event_hub_namespaces_network_exposure_unknown>\d+)[\s\S]*?"event_hub_namespaces_open_to_all_networks":\s*(?<event_hub_namespaces_open_to_all_networks>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DATA-SERVICES-CONFIG
