key: azure_velero_no_unresolved_failed_backups
name: 'Azure Velero: No Current Failed Backups'
type: AUTOMATED
role: configuration
source: community
statement: >
  No Failed or PartiallyFailed backup is current: every one has a later Completed backup of the same
  schedule (backups_failed_unresolved is 0). Resolved failures and deliberate failure tests (names
  matching deliberate_failure_tests) stay in the totals, so history is kept without failing this
  check. Does not check whether the collection run succeeded.

regex: '"backups_failed_unresolved":\s*(?<backups_failed_unresolved>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # backups_failed_unresolved
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-VELERO-BACKUPS
