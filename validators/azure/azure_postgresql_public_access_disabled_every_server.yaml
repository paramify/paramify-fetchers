key: azure_postgresql_public_access_disabled_every_server
name: 'Azure PostgreSQL: Public Network Access Disabled on Every Server'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every in-scope PostgreSQL server has public network access Disabled, so it is reached only through
  a virtual network or private endpoint (public_network_access_disabled_servers equals
  total_postgresql_servers, and there is at least one server). Fails when the server list was not
  read, a server's setting could not be read, or the counts appear other than exactly once. Does not
  check whether the collection run succeeded.

regex: '"public_network_access_disabled_servers":\s*(?<public_network_access_disabled_servers>\d+)(?:(?!"public_network_access_disabled_servers")[\s\S])*?"total_postgresql_servers":\s*(?<total_postgresql_servers>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]; MATCH_GROUP[2] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # public_network_access_disabled_servers
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }            # total_postgresql_servers
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # total_postgresql_servers
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POSTGRESQL-CONFIG
