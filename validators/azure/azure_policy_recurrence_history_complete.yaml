key: azure_policy_recurrence_history_complete
name: Azure Policy Recurrence History Fully Read
type: AUTOMATED
role: integrity
statement: >
  The 30-day Azure Policy history behind the recurrence count was read, and neither the
  grouped history nor the per-pair timelines were cut short, so zero recurring pairs
  means none recurred rather than that some went unread. Not a compliance claim.

# Anchored at the document start, one lookahead per key; every key is summary-only.
regex: '^\s*\{(?=[\s\S]*?"history_collected":\s*(?<history_collected>true|false|null))(?=[\s\S]*?"history_truncated":\s*(?<history_truncated>true|false|null))(?=[\s\S]*?"recurrence_pairs_truncated":\s*(?<recurrence_pairs_truncated>true|false|null))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true; MATCH_GROUP[2] EQUALS false; MATCH_GROUP[3] EQUALS false
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # history_collected
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # history_truncated
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # recurrence_pairs_truncated
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }

evidence_sets:
  - EVD-AZURE-POLICY-COMPLIANCE
