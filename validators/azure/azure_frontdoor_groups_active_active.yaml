key: azure_frontdoor_groups_active_active
name: Front Door Serving Groups All Active-Active Across Regions
type: AUTOMATED
role: configuration
statement: >
  Every serving Front Door origin group has enabled origins in two or more
  regions at its active priority (multi_region_active_active), and there is at
  least one serving group. The "active-active operation in two locations" claim
  of the alternate processing site narrative, held to every group (KSI-CNA-OFA).
  A group whose second region is only a lower-priority failover origin fails. It
  does not assert which regions, live origin health, or the App Service plans
  behind the origins.

# Lookahead captures persist, so the backreference compares the two summary counts in either key order.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*false)(?=[\s\S]*?"serving_origin_groups":\s*(?<serving_origin_groups>[1-9]\d*)\b)(?=[\s\S]*?"serving_groups_multi_region_active_active":\s*\k<serving_origin_groups>(?!\d))'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-FRONTDOOR-ORIGINS
