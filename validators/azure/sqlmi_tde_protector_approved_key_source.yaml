key: sqlmi_tde_protector_approved_key_source
name: Azure SQL MI TDE Protector Uses An Approved Key Source
type: AUTOMATED
role: configuration
statement: >
  Every SQL Managed Instance's TDE protector is one of the approved key sources, ServiceManaged
  (Microsoft-managed) or AzureKeyVault (customer-managed); an unread protector or any other type
  fails. Supports KSI-SVC-SIN for SQL MI key sources. The allowlist holds both protector types Azure
  offers, so this only fails on an unread or unknown protector unless the list is narrowed. Does not
  prove key rotation, that a customer-managed key's Key Vault key is reachable and valid, or that
  the organization's Cryptographic Modules Table approves both sources; drop ServiceManaged from the
  regex to require customer-managed keys.

# Counts violations; sqlmi_encryption_fields_present proves the key was there.
regex: '"encryption_protector":\s*null|"server_key_type":\s*(?:null|"(?!(?:ServiceManaged|AzureKeyVault)")[^"]*")'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SQLMI-ENCRYPTION
