key: sentinel_every_workspace_ingesting
name: Azure Sentinel Every Workspace Ingesting
type: AUTOMATED
role: configuration
statement: >
  Every collected Sentinel workspace has at least one log source (a table other than Sentinel's own
  and housekeeping tables) that ingested data inside the ingestion window (default 14 days). The
  fetcher's minimum across workspaces must be 1 or more; null (not collected) fails. Substantiates
  that connectors are connected in the sense that data is arriving.

regex: '"min_sources_ingesting":\s*[1-9]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SENTINEL-DATA-SOURCES
