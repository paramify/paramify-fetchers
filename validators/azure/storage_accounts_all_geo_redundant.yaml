key: storage_accounts_all_geo_redundant
name: Azure Storage Accounts All Geo-Redundant
type: AUTOMATED
role: configuration
statement: >
  Every storage account in the subscription replicates to a paired region (SKU GRS, RA-GRS, GZRS or
  RA-GZRS), and there is at least one account. Supports KSI-CNA-OFA and KSI-RPL-ABO for storage.
  Every account counts, including diagnostic and log accounts. It does not assert that the secondary
  is in sync or within an RPO, that failover was tested, or the redundancy of SQL MI, Redis, App
  Service or other data stores.

# Rows: geo_redundant_accounts equals total_storage_accounts, which is above 0.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"geo_redundant_accounts":\s*(?<geo_redundant_accounts>\d+))(?=[\s\S]*?"total_storage_accounts":\s*(?<total_storage_accounts>\d+))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS MATCH_GROUP[3]; MATCH_GROUP[3] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # geo_redundant_accounts
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 3 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # total_storage_accounts
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-STORAGE-ENC
