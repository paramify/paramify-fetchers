key: azure_endpoint_availability_expected_responses_checked
name: 'Azure Endpoint Availability: Tests Expect the Listed Responses'
type: AUTOMATED
role: configuration
source: community
statement: >
  For every expected endpoint listed with an HTTP status code, an enabled, in-scope test requesting that
  URL expects that code (expected_responses_unchecked is 0), such as 401 from an endpoint that requires
  credentials. A test counts a run as available only when the response has the code it expects, so this
  shows the availability measured is of the intended response. Fails while no expected response is
  listed. Does not check whether the collection run succeeded.

regex: '"expected_responses_unchecked":\s*(?<expected_responses_unchecked>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # expected_responses_unchecked
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
