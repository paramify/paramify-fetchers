key: azure_private_dns_records_and_links_fully_readable
name: Azure Private DNS Records And Links Fully Readable
type: AUTOMATED
role: configuration
statement: >
  Nothing the private DNS assertions depend on was left unread: summary
  links_to_unreadable_virtual_networks, links_virtual_network_unknown, privatelink_records_unknown
  and privatelink_records_unverified (IP outside every VNet the credential can read) are all 0.
  Unknown is never compliant, so a stale-record count of 0 only means something when every record
  could be checked. Does not assert the records are backed (see the stale-record validator).
  Supports KSI-CNA-RNT.

regex: '"links_to_unreadable_virtual_networks":\s*(?<links_to_unreadable_virtual_networks>\d+)[\s\S]*?"links_virtual_network_unknown":\s*(?<links_virtual_network_unknown>\d+)[\s\S]*?"privatelink_records_unknown":\s*(?<privatelink_records_unknown>\d+)[\s\S]*?"privatelink_records_unverified":\s*(?<privatelink_records_unverified>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1..4] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-PRIVATE-DNS-ZONE-CONFIG
