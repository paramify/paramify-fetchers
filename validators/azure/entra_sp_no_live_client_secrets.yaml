key: entra_sp_no_live_client_secrets
name: Entra Non-User Accounts Hold No Live Client Secrets
type: AUTOMATED
role: configuration
statement: >-
  No enabled service principal in the tenant holds an unexpired client secret, whether
  on its application registration or on the service principal itself (a service
  principal password counts unless it is a SAML signing key's "CN=" password). The
  count is tenant-wide, so a secret on an app unrelated to the system still fails.
  Substantiates the shared-secret part of authenticating machine connections without
  shared secrets (KSI-SVC-VCM). Does not cover Front Door origins or certificate-name
  validation.

# Counts violations, so entra_sp_credential_fields_present must pass beside it.
regex: '\{(?=(?:"(?:[^"\\]|\\.)*"|[^{}"]|\{(?:"(?:[^"\\]|\\.)*"|[^{}"])*\})*?"account_enabled":\s*true)(?:(?=(?:"(?:[^"\\]|\\.)*"|[^{}"]|\{(?:"(?:[^"\\]|\\.)*"|[^{}"])*\})*?\{(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"held_on":\s*"application")(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"expired":\s*false)(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"credential_type":\s*"password"))|(?=(?:"(?:[^"\\]|\\.)*"|[^{}"]|\{(?:"(?:[^"\\]|\\.)*"|[^{}"])*\})*?\{(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"held_on":\s*"service_principal")(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"platform_managed":\s*false)(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"expired":\s*false)(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"credential_type":\s*"password")(?!(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"display_name":\s*"CN=))|(?!(?:"(?:[^"\\]|\\.)*"|[^{}"]|\{(?:"(?:[^"\\]|\\.)*"|[^{}"])*\})*?\{(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"usage":\s*"Sign")(?=(?:"(?:[^"\\]|\\.)*"|[^{}"]|\{(?:"(?:[^"\\]|\\.)*"|[^{}"])*\})*?\{(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"held_on":\s*"service_principal")(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"platform_managed":\s*false)(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"expired":\s*false)(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"credential_type":\s*"password")))'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-SERVICE-PRINCIPALS
