key: sqlmi_instances_all_in_failover_group
name: Azure SQL MI Every Instance In A Failover Group
type: AUTOMATED
role: configuration
statement: >
  Every SQL Managed Instance in the collected subscription belongs to an instance
  failover group; an instance in no group, or whose group list could not be read,
  fails. Substantiates the multi-site recovery claim (KSI-CNA-OFA).
  Does not prove the group is synchronized (sqlmi_failover_groups_all_synchronized),
  that failover was tested, or that the RTO is met.

# Counts violations; sqlmi_backups_failover_fields_present proves the key was there.
regex: '"in_failover_group":\s*(?:false|null)'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SQLMI-BACKUPS
