key: azure_endpoint_availability_tests_all_judged
name: 'Azure Endpoint Availability: Every Test Was Judged Against the Target'
type: AUTOMATED
role: configuration
statement: >
  Every enabled availability test was judged against the target: none is missing an hour of the
  lookback or unread (availability_tests_not_judged is 0). Passes while no target is configured; that
  case fails 'Availability Target Is Configured' instead. These are inputs to availability reporting;
  they do not replace the availability reporting itself. Does not check whether the collection run
  succeeded.

regex: '"availability_tests_not_judged":\s*(?:0|null)\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
