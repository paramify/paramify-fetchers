key: azure_velero_restore_test_interval_set
name: 'Azure Velero: Restore-Test Interval Is Configured'
type: AUTOMATED
role: configuration
source: community
statement: >
  A restore-test interval is configured (restore_test_interval_days is a whole number above 0). Fails
  while it is not set, which marks the interval as undecided rather than a restore as failed. Does not
  check whether the collection run succeeded.

regex: '"restore_test_interval_days":\s*(?<restore_test_interval_days>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-VELERO-BACKUPS
