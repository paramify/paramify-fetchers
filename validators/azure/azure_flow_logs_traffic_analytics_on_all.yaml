key: azure_flow_logs_traffic_analytics_on_all
name: Azure Flow Logs All Send To Traffic Analytics
type: AUTOMATED
role: configuration
statement: >
  At least one flow log is enabled, and every enabled flow log has Traffic Analytics on, so its
  records are sent to a Log Analytics workspace for analysis. Does not assert which workspace, the
  processing interval, or that every network is covered (see
  azure_flow_logs_all_vnets_fully_covered). Supports KSI-MLA-OSM, KSI-MLA-LET and KSI-CNA-ULN.

regex: '"enabled_flow_logs":\s*(?<enabled_flow_logs>[1-9]\d*)[\s\S]*?"enabled_flow_logs_with_traffic_analytics":\s*(?<enabled_flow_logs_with_traffic_analytics>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 1 }

evidence_sets:
  - EVD-AZURE-NETWORK-FLOW-LOGS
