key: azure_availability_health_check_all_apps
name: Azure App Service Health Check on Every App
type: AUTOMATED
role: configuration
statement: >-
  The subscription was read with no partial failure, there is at least one in-scope App Service app,
  and every one, web and function apps alike, has a health check path set, so App Service probes each
  instance, takes unhealthy ones out of rotation on apps with two or more instances and replaces an
  instance that stays unhealthy (all_apps_have_health_check is true; it is null when an app's
  configuration couldn't be read or there are no apps). A single-instance app is never taken out of
  rotation. Supports KSI-RPL-TRC with a
  recovery mechanism that runs continuously. Does not prove: that the health checks pass (the
  hourly results are in the evidence but not asserted); that the path exercises the app's
  dependencies; regional failover; deployment slots; or that a recovery exercise was run and
  recorded.

regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"all_apps_have_health_check":\s*(?<all_apps_have_health_check>true|false|null))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # all_apps_have_health_check
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-AZURE-SERVICE-AVAILABILITY
