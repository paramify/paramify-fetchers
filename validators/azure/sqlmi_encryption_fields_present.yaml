key: sqlmi_encryption_fields_present
name: Azure SQL MI Encryption Fields Were Read
type: AUTOMATED
role: integrity
statement: >
  The per-instance all_user_databases_tde_enabled flag and at least one TDE
  protector's server_key_type are present, so zero violations from the two SQL MI
  encryption validators reflect posture rather than a renamed key or an empty
  collection.

# One match at the document start when every lookahead finds its key anywhere in the file.
regex: '^\s*\{(?=[\s\S]*?"all_user_databases_tde_enabled":\s*(?:true|false|null))(?=[\s\S]*?"server_key_type":\s*(?:null|"))'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SQLMI-ENCRYPTION
