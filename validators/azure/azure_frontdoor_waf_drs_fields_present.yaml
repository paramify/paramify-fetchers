key: azure_frontdoor_waf_drs_fields_present
name: Front Door WAF Rule Set Version Fields Present
type: AUTOMATED
role: integrity
statement: >
  At least one Front Door WAF policy record carries a quoted
  default_rule_set_latest_version and default_rule_set_version, so
  azure_frontdoor_waf_drs_current's zero means every policy is current rather
  than renamed fields, no policies, or no readable rule-set definitions.

regex: '"default_rule_set_latest_version":\s*"[^"]+",[^{}\[\]]*?"default_rule_set_version":\s*"[^"]+"'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-FRONTDOOR-WAF
