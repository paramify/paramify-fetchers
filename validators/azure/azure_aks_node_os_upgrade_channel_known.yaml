key: azure_aks_node_os_upgrade_channel_known
name: 'Azure AKS: Every Cluster''s Node OS Upgrade Channel Is Known'
type: AUTOMATED
role: integrity
source: community
statement: >
  Azure returned a node OS upgrade channel for every cluster (node_os_upgrade_channel_unknown_clusters
  is 0), so no cluster is left out of the automatic-patching count. Does not check whether the
  collection run succeeded.

regex: '"node_os_upgrade_channel_unknown_clusters":\s*(?<node_os_upgrade_channel_unknown_clusters>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # node_os_upgrade_channel_unknown_clusters
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-AKS-CONFIG
