key: azure_inventory_no_untagged_resources
name: Azure Resources All Carry Tags
type: AUTOMATED
role: configuration
statement: >
  Every resource in the subscription's Resource Graph inventory carries at least one tag, and the
  inventory is not empty. Supports KSI-CNA-MAT for untagged resources. Any tag counts: it does not
  assert an Owner, Classification or other required tag key, or that a tag's value is right.

regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*false)(?=[\s\S]*?"total_resources":\s*[1-9])(?=[\s\S]*?"untagged_resources":\s*0\b)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-INVENTORY
