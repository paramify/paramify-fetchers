key: azure_inventory_no_untagged_resources
name: Azure Resources All Carry Tags
type: AUTOMATED
role: configuration
statement: >
  Every resource in the subscription's Resource Graph inventory carries at least one tag, and the
  inventory is not empty. Supports KSI-CNA-MAT for untagged resources. Any tag counts: it does not
  assert an Owner, Classification or other required tag key, or that a tag's value is right.

regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"total_resources":\s*(?<total_resources>\d+))(?=[\s\S]*?"untagged_resources":\s*(?<untagged_resources>null|\d+(?:\.\d+)?))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] GREATER_THAN 0; MATCH_GROUP[3] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # total_resources
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # untagged_resources
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-INVENTORY
