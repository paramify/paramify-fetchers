key: azure_diag_inventory_fully_assessed
name: Azure Resource Inventory Fully Assessed for Logging
type: AUTOMATED
role: configuration
statement: >
  Every resource Azure Resource Graph lists for the subscription appears in the logging
  inventory with a verdict: the resources read equal Resource Graph's reported total (at least
  one), and no resource's diagnostic-settings read failed. Substantiates KSI-MLA-LET
  (Audit Logging Criteria): "every resource in the Azure inventory appears in
  the logging inventory". Does not prove that a logging inventory kept outside
  Azure matches, that subscriptions not targeted are covered, or that the inventory
  review is current.

# The three summary keys are adjacent in the fetcher's sorted output; a reorder stops the match and fails, never passes.
regex: '"resource_graph_total_records":\s*(?<resource_graph_total_records>[1-9]\d*),[^{}]*?"resources_enumerated":\s*(?<resources_enumerated>\d+),\s*"resources_errored":\s*(?<resources_errored>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]; MATCH_GROUP[3] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-DIAG-SETTINGS
