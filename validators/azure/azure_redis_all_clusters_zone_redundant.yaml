key: azure_redis_all_clusters_zone_redundant
name: Azure Managed Redis All Clusters Zone Redundant
type: AUTOMATED
role: configuration
statement: >
  No Azure Managed Redis cluster in the evidence has high_availability other than Enabled or
  redundancy_mode other than ZR (zone redundant); a null value counts as a violation, so unknown is
  never compliant. Counted per cluster from the raw API values. Supports KSI-CNA-OFA: fails
  single-zone cache dependencies. Does NOT assert cross-region replication (see
  azure_redis_all_databases_geo_replicated) or that operations continued through an actual outage.
  Paired with azure_redis_redundancy_fields_present so renamed keys cannot read as zero violations.

regex: '"high_availability":(?!\s*"Enabled")|"redundancy_mode":(?!\s*"ZR")'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-MANAGED-REDIS-CONFIG
