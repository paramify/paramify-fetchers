key: azure_scheduled_query_rules_run_hourly
name: Azure Scheduled-Query Alert Rules Evaluate at Least Hourly
type: AUTOMATED
role: configuration
statement: >
  Every enabled scheduled-query (log search) alert rule, LogToMetric rules aside,
  evaluates at least hourly (evaluation_frequency PT1M to PT60M, or PT1H). Substantiates
  the scheduled-query half of KSI-MLA-RVL (Audit Log Collection and Alerts): rules "run
  at the approved
  frequency", with hourly as a placeholder until the organization names its approved frequency
  (change the lookahead to tighten it). Does not prove Sentinel analytics rule schedules,
  the lookback window, or that runs succeed. Counts violations, so
  azure_scheduled_query_rules_enabled_present must pass alongside it.

regex: '"enabled":\s*true,\s*"evaluation_frequency":\s*"(?!(?:PT(?:[1-9]|[1-5]\d|60)M|PT1H)")[^"]*",\s*"id":\s*"[^"]*/[Mm]icrosoft\.[Ii]nsights/[Ss]cheduled[Qq]uery[Rr]ules/[^"]*",\s*"is_alerting_rule":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ALERT-RULES
