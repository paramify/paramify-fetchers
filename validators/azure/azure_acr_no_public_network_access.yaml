key: azure_acr_no_public_network_access
name: 'Azure Container Registry: No Public Network Access'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every in-scope container registry has public network access Disabled
  (public_network_access_registries is 0); a registry that does not return the setting counts as
  public. Only Premium registries can turn public access off. Fails when no registry is in scope,
  the registry list was not read, or the counts appear other than exactly once. Does not check
  whether the collection run succeeded.

regex: '"in_scope_registries":\s*(?<in_scope_registries>[1-9]\d*)(?:(?!"in_scope_registries")[\s\S])*?"public_network_access_registries":\s*(?<public_network_access_registries>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[2] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # public_network_access_registries
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ACR-CONFIG
