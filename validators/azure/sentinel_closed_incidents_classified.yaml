key: sentinel_closed_incidents_classified
name: Azure Sentinel Closed Incidents Classified
type: AUTOMATED
role: configuration
statement: >
  No closed incident in scope is left without a determination: every closed incident is classified
  True Positive, Benign Positive or False Positive, not Undetermined or empty. Supports incident
  classification for KSI-MLA-RVL, and that closed incidents were investigated for KSI-CNA-ULN.
  Counts violations, so it relies on sentinel_incident_closure_counts_present.

regex: '"closed_undetermined":\s*[1-9]'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SENTINEL-INCIDENTS
