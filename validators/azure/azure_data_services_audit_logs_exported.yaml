key: azure_data_services_audit_logs_exported
name: Azure Data Services Audit Logs Exported
type: AUTOMATED
role: configuration
statement: >
  Every Data Explorer cluster (Command, Query, Journal, audit or allLogs), Event Hubs namespace
  (RuntimeAuditLogs, audit or allLogs) and MongoDB vCore cluster (vCoreMongoRequests, audit or
  allLogs) has a diagnostic setting exporting audit logs to a destination, and no diagnostic
  settings were unreadable. Does not assert the destination, retention, or review of the logs.
  Supports KSI-MLA-LET.

regex: '"data_explorer_clusters_audit_logs_exported":\s*(?<data_explorer_clusters_audit_logs_exported>\d+)[\s\S]*?"data_explorer_clusters_audit_logs_unknown":\s*(?<data_explorer_clusters_audit_logs_unknown>\d+)[\s\S]*?"event_hub_namespaces_audit_logs_exported":\s*(?<event_hub_namespaces_audit_logs_exported>\d+)[\s\S]*?"event_hub_namespaces_audit_logs_unknown":\s*(?<event_hub_namespaces_audit_logs_unknown>\d+)[\s\S]*?"mongo_clusters_audit_logs_exported":\s*(?<mongo_clusters_audit_logs_exported>\d+)[\s\S]*?"mongo_clusters_audit_logs_unknown":\s*(?<mongo_clusters_audit_logs_unknown>\d+)[\s\S]*?"total_data_explorer_clusters":\s*(?<total_data_explorer_clusters>\d+)[\s\S]*?"total_event_hub_namespaces":\s*(?<total_event_hub_namespaces>\d+)[\s\S]*?"total_mongo_clusters":\s*(?<total_mongo_clusters>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[7]; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] EQUALS MATCH_GROUP[8]; MATCH_GROUP[4] EQUALS 0; MATCH_GROUP[5] EQUALS MATCH_GROUP[9]; MATCH_GROUP[6] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 7 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 8 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 5 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 9 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 6 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DATA-SERVICES-CONFIG
