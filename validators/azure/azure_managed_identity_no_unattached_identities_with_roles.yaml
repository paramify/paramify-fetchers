key: azure_managed_identity_no_unattached_identities_with_roles
name: Azure Managed Identity No Ownerless Identities Holding Roles
type: AUTOMATED
role: configuration
statement: >
  No user-assigned managed identity that no resource in the subscription names still holds a role
  assignment (standing access with no visible owner). Does not assert that attached identities are
  least privilege, and cannot see a resource in another subscription that may use the identity.
  Supports KSI-IAM-ELP.

regex: '"unattached_identities_with_roles":\s*(?<unattached_identities_with_roles>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-MANAGED-IDENTITY-CONFIG
