key: azure_rate_limit_alert_routed
name: Azure Rate-Limit Alert Enabled and Routed
type: AUTOMATED
role: configuration
statement: >
  At least one enabled rate-limit alert routes to an active action group and no processing rule
  suppresses it. Rate-limit alert: a metric alert on WAF request counts
  (WebApplicationFirewallRequestCount, AzwafCustomRule) or a RateLimit/Throttle metric, or a log
  search alert whose query reads WAF logs or mentions rate limiting, throttling or HTTP 429.
  Supports the rate-limit half of KSI-CNA-RVP. Does not prove the alert filters on the rate-limit
  rule itself: the evidence has no metric dimensions, so any alert on WAF matches counts. Does not
  prove the WAF rate-limit rules exist (Front Door WAF fetcher).

regex: '(?:"metricName":\s*"[^"]*(?:[Ww]eb[Aa]pplication[Ff]irewall[Rr]equest[Cc]ount|[Aa]zwaf[Cc]ustom[Rr]ule|[Rr]ate[Ll]imit|[Tt]hrottl)[^"]*"|"query":\s*"(?:[^"\\]|\\.)*?(?:[Rr]ate[ _-]?[Ll]imit|[Tt]hrottl|(?<![0-9])429(?![0-9])|[Ww]eb[Aa]pplication[Ff]irewall[Ll]og|AGWFirewallLogs|[Aa]pplication[Gg]ateway[Ff]irewall[Ll]og))(?:(?!"action_group_ids")[\s\S])*?"enabled":\s*(?<enabled>true|false|null),\s*"evaluation_frequency"(?:(?!"action_group_ids")[\s\S])*?"routes_to_enabled_receiver":\s*(?<routes_to_enabled_receiver>true|false|null),(?:(?!"action_group_ids")[\s\S])*?"suppressed":\s*(?<suppressed>true|false|null)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true; MATCH_GROUP[2] EQUALS true; MATCH_GROUP[3] EQUALS false
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # enabled
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # routes_to_enabled_receiver
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # suppressed
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }

evidence_sets:
  - EVD-AZURE-ALERT-RULES
