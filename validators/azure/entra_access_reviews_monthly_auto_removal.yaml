key: entra_access_reviews_monthly_auto_removal
name: Entra Access Reviews Run Monthly With Automatic Removal
type: AUTOMATED
role: configuration
statement: >-
  Every active Entra ID access review series recurs at least monthly, denies a review left unanswered
  and applies its decisions automatically, so unconfirmed access is removed without an admin; at least
  one active series reviews group membership; and every review series, run and latest-cycle decision
  was read. Substantiates monthly access certification of Entra groups with automatic removal
  (KSI-IAM-AAM, KSI-IAM-ELP, KSI-MLA-ALA). Fails when no series is active, when any active series
  misses one of the three settings (an active one-time review counts as not monthly), or when the
  tenant has no Entra ID P2 or ID Governance licence. Does NOT prove which groups are reviewed, that
  the reviewed groups are the ones that grant access to the system, that reviewers acted on the
  questions, or reviews of Azure resource roles, which Graph does not hold.

# One series without monthly auto-removal fails the whole set; the failing names are in active_definitions_without_monthly_auto_removal.
regex: '"partial_failure":\s*false[\s\S]*?"active_definitions_by_scope_type":\s*\{[^{}]*?"group_membership":\s*(?<group_membership>[1-9]\d*)[^{}]*\}[\s\S]*?"all_active_definitions_monthly_auto_removal":\s*(?<all_active_definitions_monthly_auto_removal>true|false)[\s\S]*?"collection_complete":\s*(?<collection_complete>true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS true; MATCH_GROUP[3] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # all_active_definitions_monthly_auto_removal
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # collection_complete
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-AZURE-ENTRA-ACCESS-REVIEWS
