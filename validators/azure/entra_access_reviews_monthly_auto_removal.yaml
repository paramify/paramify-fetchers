key: entra_access_reviews_monthly_auto_removal
name: Entra Access Reviews Run Monthly With Automatic Removal
type: AUTOMATED
role: configuration
statement: >-
  Every active Entra ID access review series recurs at least every 31 days (the longest active
  recurrence period, max_active_recurrence_period_days), denies a review left unanswered and applies
  its decisions automatically (all_active_definitions_auto_removal), so unconfirmed access is removed
  without an admin; at least one active series reviews group membership; and every review series, run
  and latest-cycle decision was read. Substantiates monthly access certification of Entra groups with
  automatic removal (KSI-IAM-AAM, KSI-IAM-ELP, KSI-MLA-ALA). The 31 days is a placeholder for the
  organization's review period. Fails when no series is active, when any active series lacks default
  deny or automatic apply, when any active series recurs less often or is one-time (no period), or when
  the tenant has no Entra ID P2 or ID Governance licence. Does NOT prove which groups are reviewed, that
  the reviewed groups are the ones that grant access to the system, that reviewers acted on the
  questions, or reviews of Azure resource roles, which Graph does not hold.

# Reads the cadence-free fields, so the period is set here rather than by the fetcher's monthly flag.
# Threshold in the regex: max_active_recurrence_period_days at most 31 (placeholder). A null max (one-time series, no active series) fails.
# The failing series are named in active_definitions_without_monthly_auto_removal (at a 31-day bar) and by their auto_removal flag.
regex: '"partial_failure":\s*false[\s\S]*?"active_definitions_by_scope_type":\s*\{[^{}]*?"group_membership":\s*(?<group_membership>[1-9]\d*)[^{}]*\}[\s\S]*?"all_active_definitions_auto_removal":\s*(?<all_active_definitions_auto_removal>true|false)[\s\S]*?"collection_complete":\s*(?<collection_complete>true|false)[\s\S]*?"max_active_recurrence_period_days":\s*(?<max_active_recurrence_period_days>[1-9]|[12]\d|3[01])(?![\d.])'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS true; MATCH_GROUP[3] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # all_active_definitions_auto_removal
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # collection_complete
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-AZURE-ENTRA-ACCESS-REVIEWS
