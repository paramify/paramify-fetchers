key: azure_frontdoor_no_region_unhealthy_last_hour
name: Front Door No Serving Region Unhealthy In Last Hour
type: AUTOMATED
role: configuration
statement: >
  No serving Front Door origin group had an enabled region whose origins were below the health
  threshold in the last hour with health data, and origin health metrics were read for at least one
  serving group. Supports KSI-CNA-OFA for origin health. "Last hour" is the latest hour with health
  data, if it falls within the last 3 hours. A group with no health data (no probe, or no traffic)
  reads unknown and is not judged; it does not assert health over the whole metrics window, or that
  both regions were serving.

# Positive lookaheads; with_health_data >= 1 keeps an unread metrics query from passing on unhealthy = 0.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"serving_groups_region_unhealthy_last_hour":\s*(?<serving_groups_region_unhealthy_last_hour>null|\d+(?:\.\d+)?))(?=[\s\S]*?"serving_groups_with_health_data":\s*(?<serving_groups_with_health_data>\d+))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # serving_groups_region_unhealthy_last_hour
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # serving_groups_with_health_data
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-FRONTDOOR-ORIGINS
