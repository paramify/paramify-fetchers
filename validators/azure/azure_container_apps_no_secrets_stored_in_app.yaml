key: azure_container_apps_no_secrets_stored_in_app
name: Azure Container Apps And Jobs No In-App Secrets
type: AUTOMATED
role: configuration
statement: >
  No Container App or Container Apps job holds a secret in its own configuration; every secret is a
  Key Vault reference. Does not assert anything about plain environment variables with secret-like
  names, nor the storage account keys held by Container Instances Azure Files volumes. Supports
  KSI-IAM-SNU.

regex: '"workloads_with_secrets_stored_in_app":\s*(?<workloads_with_secrets_stored_in_app>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-CONTAINER-WORKLOADS-CONFIG
