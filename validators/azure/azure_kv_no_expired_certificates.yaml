key: azure_kv_no_expired_certificates
name: Key Vault And App Service Certificates Not Expired
type: AUTOMATED
role: configuration
statement: >
  No Key Vault certificate and no App Service certificate is past its expiry date. Supports
  KSI-SVC-SIN and KSI-SVC-VRI for expired certificates. Needs azure_key_vault_key_rotation 0.5.0
  or later: it then reports expired_certificates as null when any in-scope vault's certificates
  could not be listed, and this validator fails on null. Earlier evidence reads 0 for such a vault,
  and only azure_kv_certificates_readable_all_vaults catches that. It does not prove that a certificate with no expiry date is valid (such a
  certificate is not counted as expired), and does not assert renewal policy, certificates expiring
  soon, or certificates held outside Key Vault and App Service.

# expired_certificates is null when any vault's certificates were unreadable, which the EQUALS 0 row rejects.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"expired_certificates":\s*(?<expired_certificates>null|\d+(?:\.\d+)?))(?=[\s\S]*?"expired_app_service_certificates":\s*(?<expired_app_service_certificates>null|\d+(?:\.\d+)?))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # expired_certificates
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # expired_app_service_certificates
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-KEYVAULT-ROTATION
