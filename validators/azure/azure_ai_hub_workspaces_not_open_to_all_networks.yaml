key: azure_ai_hub_workspaces_not_open_to_all_networks
name: Azure AI Hub Workspaces Not Open To All Networks
type: AUTOMATED
role: configuration
statement: >
  No AI hub, project or Machine Learning workspace is open to all networks: each either disables
  public network access or limits it with an IP allow-list. Does not assert that an allow-list
  contains only approved addresses, nor that workspace compute outbound traffic is restricted.
  Supports KSI-CNA-RNT.

regex: '"workspaces_open_to_all_networks":\s*(?<workspaces_open_to_all_networks>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-AI-HUB-CONFIG
