key: aks_rbac_enabled
name: AKS Kubernetes RBAC Enabled
type: AUTOMATED
role: configuration
statement: Kubernetes RBAC is enabled on every collected AKS cluster.

regex: '"rbac_enabled_clusters":\s*(?<rbac_enabled>\d+)[\s\S]*?"total_clusters":\s*(?<total>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }

evidence_sets:
  - EVD-AZURE-AKS-CONFIG
