key: front_door_origins_not_served_outside_front_door
name: Front Door Origins Serve No Traffic That Bypassed Front Door
type: AUTOMATED
role: configuration
statement: >-
  At least one App Service app is a Front Door origin, every such app sends its HTTP logs to a Log
  Analytics workspace, every app's records were read and classified against the AzureFrontDoor.Backend
  service-tag ranges, and over the window no app served (status under 400) a request from a public
  address outside Front Door's ranges. Substantiates that public traffic reaches the origins only
  through Front Door and its WAF (KSI-CNA-ULN). Does NOT prove anything about origins that aren't App
  Service apps (storage, custom hosts, virtual machines), Kudu (scm) sites, requests refused by the app
  (status 400 or above, which is lockdown working), private or internal callers, or that the app's
  access restrictions admit only this profile's Front Door id (azure_front_door_origins). Azure's own
  public callers outside Front Door's ranges, such as availability tests, count as bypass. An approved
  exception is the organization's own record and isn't read; any served request from outside Front Door fails.

regex: '"summary":\s*\{[^{}]*?"origin_apps":\s*(?<origin_apps>[1-9]\d*)[^{}]*?"origin_apps_bypass_unknown":\s*(?<origin_apps_bypass_unknown>\d+)[^{}]*?"origin_apps_served_outside_front_door":\s*(?<origin_apps_served_outside_front_door>\d+)[^{}]*?"origin_apps_without_http_log_export":\s*(?<origin_apps_without_http_log_export>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] EQUALS 0; MATCH_GROUP[4] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # origin_apps_bypass_unknown
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # origin_apps_served_outside_front_door
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }   # origin_apps_without_http_log_export
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-NETWORK-TRAFFIC-ACTIVITY
