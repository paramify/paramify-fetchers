key: sqlmi_entra_only_authentication_all_instances
name: Azure SQL MI Entra-Only Authentication On Every Instance
type: AUTOMATED
role: configuration
statement: >
  Every SQL Managed Instance enforces Microsoft Entra-only authentication, so SQL
  logins (shared passwords) are refused and every connection authenticates through
  Entra; false or an unread setting fails. Substantiates "SQL MI uses Entra
  authentication" (KSI-SVC-VCM). Does not prove which identities connect, that
  applications use managed identities, or anything about network paths.

# Counts violations; sqlmi_configuration_fields_present proves the key was there.
regex: '"azure_ad_only_authentication":\s*(?:false|null)'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SQLMI-CONFIG
