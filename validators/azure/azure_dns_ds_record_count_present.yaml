key: azure_dns_ds_record_count_present
name: Azure DNS Zone DS Record Count Present
type: AUTOMATED
role: integrity
statement: >
  At least one public zone record carries a zone-level delegation_signer_records count immediately
  followed by its dnssec_enabled flag, so a zero count in azure_dns_signed_zones_have_ds_records
  reflects posture rather than a renamed or reordered field. Fails on a subscription with no public
  DNS zones.

regex: '"delegation_signer_records":\s*\d+\s*,\s*"dnssec_enabled":'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DNS-CONFIG
