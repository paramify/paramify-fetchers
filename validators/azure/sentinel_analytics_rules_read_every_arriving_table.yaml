key: sentinel_analytics_rules_read_every_arriving_table
name: Azure Sentinel Enabled Rules Read Every Arriving Table With Data
type: AUTOMATED
role: configuration
statement: >
  Across every Sentinel workspace, each table that received data in the ingestion window is read by at
  least one enabled analytics rule (ingesting_tables_not_read is 0), every enabled rule that reads a
  table with no data is a quiet incident-creation rule (enabled_rules_missing_data equals
  enabled_rules_quiet), at least one rule is enabled, and the collection had no partial failure. A quiet
  incident-creation rule creates incidents from one Microsoft product's alerts, that product sent no
  alert in the window, and a data connection that sends its alerts (its own, or Defender XDR's) has
  alerts enabled: no alert is normal for these. A rule whose product has no connection with alerts
  enabled is not quiet and fails, since nothing will send its alerts, as does any rule reading another
  table that got nothing. The counts are null, and fail, when no workspace could be checked or a
  workspace's data connectors could not be read. Stricter than
  sentinel_analytics_rules_read_required_tables: every arriving source, not a required list.
  Substantiates KSI-MLA-RVL (Continuous Monitoring; Continuous Monitoring Strategy; Security Event
  Notifications): "enabled analytics rules cover the required log sources". Does not count rules whose
  tables cannot be worked out (Fusion, ML and threat intelligence rules, parser-only queries), which are
  neither covering nor missing data here, or Basic and Auxiliary tables, which the window query skips.

regex: '"partial_failure":\s*false\b[\s\S]*?"enabled_rules_missing_data":\s*(?<enabled_rules_missing_data>\d+),\s*"enabled_rules_quiet":\s*(?<enabled_rules_quiet>\d+),\s*"enabled_rules_tables_unknown":\s*\d+,\s*"enabled_rules_total":\s*[1-9]\d*,\s*"ingesting_tables_not_read":\s*0\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }

evidence_sets:
  - EVD-AZURE-SENTINEL-ANALYTICS-RULES
