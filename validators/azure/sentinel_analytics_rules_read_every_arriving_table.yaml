key: sentinel_analytics_rules_read_every_arriving_table
name: Azure Sentinel Enabled Rules Read Every Arriving Table With Data
type: AUTOMATED
role: configuration
statement: >
  Across every Sentinel workspace, each table that received data in the ingestion window is read by
  at least one enabled analytics rule (ingesting_tables_not_read is 0), every enabled rule that
  reads a table with no data is a quiet incident-creation rule (enabled_rules_missing_data equals
  enabled_rules_quiet), at least one rule is enabled, and the collection had no partial failure. A
  quiet incident-creation rule creates incidents from one Microsoft product's alerts, that product
  sent no alert in the window, and a connection that sends its alerts has alerts enabled: the
  product's own, Defender XDR's, or one the tenant confirmed. A rule quiet through a confirmed
  connection (confirmed_by_configuration) counts as quiet; that confirmation comes from the
  fetcher's configuration, not from the API, so it is the tenant's statement and not something the
  evidence shows. A rule whose product has no connection with alerts enabled, read or confirmed, is
  not quiet and fails, since nothing will send its alerts, as does any rule reading another table
  that got nothing. The counts are null, and fail, when no workspace could be checked, or when a
  workspace's data connectors could not be read and a rule there is not quiet through the
  connections that were read or confirmed. Stricter than
  sentinel_analytics_rules_read_required_tables: every arriving source, not a required list.
  Supports KSI-MLA-RVL. Does not count rules whose tables cannot be worked out (Fusion, ML and
  threat intelligence rules, parser-only queries), which are neither covering nor missing data here,
  or Basic and Auxiliary tables, which the window query skips.

# Each value is read from the summary, in any order; enabled_rules_total of at least 1 stays in the regex.
regex: '^\s*\{(?=[\s\S]*?"summary":\s*\{[\s\S]*?"ingesting_tables_not_read":\s*(?<ingesting_tables_not_read>\d+|null))(?=[\s\S]*?"summary":\s*\{[\s\S]*?"enabled_rules_missing_data":\s*(?<enabled_rules_missing_data>\d+|null))(?=[\s\S]*?"summary":\s*\{[\s\S]*?"enabled_rules_quiet":\s*(?<enabled_rules_quiet>\d+|null))(?=[\s\S]*?"summary":\s*\{[\s\S]*?"enabled_rules_total":\s*[1-9]\d*\b)(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] NOT_EQUALS null; MATCH_GROUP[2] EQUALS MATCH_GROUP[3]; MATCH_GROUP[4] EQUALS false
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # ingesting_tables_not_read
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # enabled_rules_missing_data (null when it could not be measured)
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "null" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # enabled_rules_missing_data
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 3 }            # enabled_rules_quiet
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }

evidence_sets:
  - EVD-AZURE-SENTINEL-ANALYTICS-RULES
