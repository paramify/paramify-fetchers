key: entra_sp_credential_fields_present
name: Entra Service Principal Credential Fields Were Read
type: AUTOMATED
role: integrity
statement: >-
  The service principal evidence carries the account_enabled,
  uses_federated_credential, held_on, credential_type, usage, platform_managed and
  expired fields that entra_sp_mi_or_federated and entra_sp_no_live_client_secrets
  count on, so their zero violations reflect posture rather than a renamed or
  unreadable payload.

regex: '"service_principals":\s*\[(?=[\s\S]*?"account_enabled":\s*(?:true|false))(?=[\s\S]*?"uses_federated_credential":\s*(?:true|false))(?=[\s\S]*?"held_on":\s*"(?:application|service_principal)")(?=[\s\S]*?"credential_type":\s*"(?:password|certificate)")(?=[\s\S]*?"usage":\s*(?:null|"))(?=[\s\S]*?"platform_managed":\s*(?:true|false))(?=[\s\S]*?"expired":\s*(?:true|false))'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-SERVICE-PRINCIPALS
