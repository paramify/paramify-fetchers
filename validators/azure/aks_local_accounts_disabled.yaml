key: aks_local_accounts_disabled
name: AKS Local Admin Accounts Disabled
type: AUTOMATED
role: configuration
statement: Local certificate-based admin accounts are disabled on every collected AKS cluster.

regex: '"local_accounts_disabled_clusters":\s*(?<disabled>\d+)[\s\S]*?"total_clusters":\s*(?<total>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }

evidence_sets:
  - EVD-AZURE-AKS-CONFIG
