key: azure_frontdoor_prod_web_apps_regional_twin_ready
name: Production Web Apps Have A Ready Regional Twin
type: AUTOMATED
role: configuration
statement: >
  Every production App Service web app (narrowed by the fetcher's production tag
  when set) is behind Front Door, shares a serving origin group with an enabled
  origin in another region, and that twin's plan has at least as many instances
  or is platform-scaled; there is at least one production web app. Substantiates
  "every production App Service has a matching regional deployment and adequate
  plan capacity" (KSI-CNA-OFA). An app not behind Front Door fails, because a
  twin is only detectable through a shared origin group. It does not cover
  function apps, autoscale settings, or whether the twin runs the same code.

# Backreference: regional_twin_ready must equal a non-zero production_web_apps.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*false)(?=[\s\S]*?"production_web_apps":\s*(?<production_web_apps>[1-9]\d*)\b)(?=[\s\S]*?"production_web_apps_regional_twin_ready":\s*\k<production_web_apps>(?!\d))'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-FRONTDOOR-ORIGINS
