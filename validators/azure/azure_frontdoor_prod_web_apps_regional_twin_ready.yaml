key: azure_frontdoor_prod_web_apps_regional_twin_ready
name: Production Web Apps Have A Ready Regional Twin
type: AUTOMATED
role: configuration
statement: >
  Every production App Service web app (narrowed by the fetcher's production tag when set) is behind
  Front Door, shares a serving origin group with an enabled origin in another region, and that
  twin's plan has at least as many instances or is platform-scaled; there is at least one production
  web app. Supports KSI-CNA-OFA. An app not behind Front Door fails, because a twin is only
  detectable through a shared origin group. It does not cover function apps, autoscale settings, or
  whether the twin runs the same code.

# Backreference: regional_twin_ready must equal a non-zero production_web_apps.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"production_web_apps":\s*(?<production_web_apps>\d+))(?=[\s\S]*?"production_web_apps_regional_twin_ready":\s*(?<production_web_apps_regional_twin_ready>\d+))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] GREATER_THAN 0; MATCH_GROUP[3] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # production_web_apps
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # production_web_apps_regional_twin_ready
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }

evidence_sets:
  - EVD-AZURE-FRONTDOOR-ORIGINS
