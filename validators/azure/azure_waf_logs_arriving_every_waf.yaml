key: azure_waf_logs_arriving_every_waf
name: Azure Every WAF's Log Arrives in a Workspace
type: AUTOMATED
role: configuration
statement: >-
  The subscription was read with no partial failure, it holds at least one WAF resource, and every
  one exports its WAF log to a Log Analytics workspace that was read and holds its records in the
  lookback (waf_resources_with_waf_events equals waf_resources), so the WAF's activity is recorded
  where it can be reviewed. A WAF that matched no request in the lookback, or whose workspace couldn't
  be read or is on a Basic-plan table that wasn't queried, fails. Supports the part of KSI-CNA-RVP
  this evidence can see. Does not prove: that a DoS or WAF effectiveness test was run or reviewed,
  which stays a customer record; that the WAF blocks (the Front Door WAF policy validators); or that
  anyone reviews the records.

regex: '"partial_failure":\s*false\b[\s\S]*?"waf_resources":\s*(?<waf_resources>[1-9]\d*),[\s\S]*?"waf_resources_with_waf_events":\s*(?<waf_resources_with_waf_events>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # waf_resources_with_waf_events
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 1 }

evidence_sets:
  - EVD-AZURE-WAF-DDOS-ACTIVITY
