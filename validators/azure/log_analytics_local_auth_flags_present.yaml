key: log_analytics_local_auth_flags_present
name: Azure Log Analytics Local Auth Flags Present
type: AUTOMATED
role: integrity
statement: >
  At least one workspace reports a boolean local_auth_disabled, so no workspace with local auth
  enabled reflects the workspaces rather than a renamed field. Integrity partner of
  log_analytics_local_auth_disabled.

regex: '"local_auth_disabled":\s*(?:true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-LOG-ANALYTICS
