key: azure_backup_vault_all_meet_rpo
name: 'Azure Backup Vaults: Every Protected Resource Meets the Recovery Point Objective'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every applicable backup instance's newest recovery point is no older than the defined recovery
  point objective (all_backup_instances_meet_recovery_point_objective is true). Fails while
  recovery_point_objective_hours is unset, since no objective has been adopted, and when any
  instance is unknown or there are none. Does not check whether the collection run succeeded.

regex: '"all_backup_instances_meet_recovery_point_objective":\s*true\b'
rules_summary: MATCH_COUNT EQUALS 1
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }

evidence_sets:
  - EVD-AZURE-BACKUP-VAULT-PROTECTION
