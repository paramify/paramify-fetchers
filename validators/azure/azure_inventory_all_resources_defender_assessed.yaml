key: azure_inventory_all_resources_defender_assessed
name: Every Inventoried Resource Assessed by Defender for Cloud
type: AUTOMATED
role: configuration
statement: >
  Every resource in the subscription's Resource Graph inventory whose type Defender for
  Cloud assesses anywhere in the subscription has at least one Healthy or Unhealthy
  Defender assessment (NotApplicable does not count), and the only resource types with no
  Defender assessment on any resource are on the approved list (default: Marketplace SaaS
  resources, microsoft.saas/resources). Substantiates the Defender half of "every deployed
  resource is assessed by Defender and Azure Policy" (KSI-MLA-EVC), "every in-scope Azure
  resource appears in Defender assessment results" and "fail resources with no assessment"
  (KSI-CNA-EIS), and the per-resource Defender coverage half of KSI-SVC-EIS. A failed
  Defender query (null flag), an empty inventory, or Defender covering nothing fails. Does
  NOT prove the findings are healthy, which Defender plans are on (azure_defender_plans),
  that the inventory equals the system boundary (every resource in the subscription is
  treated as in scope), resource groups or the subscription itself (Resource Graph keeps
  them outside the Resources table), or other subscriptions (one artifact per subscription).

# Form A over the summary: the flag must read true and the uncovered-types map may hold only allowlisted types.
regex: '^\s*\{(?=[\s\S]*?"all_assessable_resources_assessed_by_defender":\s*true)(?=[\s\S]*?"types_without_defender_assessment":\s*\{(?:\s*"(?:microsoft\.saas/resources)":\s*\d+\s*,?)*\s*\})'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-INVENTORY
