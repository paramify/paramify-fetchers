key: azure_inventory_expected_resources_present
name: 'Azure Resource Inventory: Every Expected Resource Is Present'
type: AUTOMATED
role: completeness
statement: >
  Every pattern in the expected_resources list matches at least one in-scope resource in the
  subscription's Resource Graph inventory (expected_resources_missing is 0), so nothing the boundary
  is expected to hold is missing, and no pattern is mistyped. Fails while no expected list is set or
  the inventory could not be read. Does not judge resources outside the list; see 'No Unexpected
  Resources'. Does not check whether the collection run succeeded.

regex: '"expected_resources_missing":\s*(?<expected_resources_missing>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # expected_resources_missing
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-INVENTORY
