key: azure_nsg_subnet_fields_present
name: Azure Subnet NSG Associations Were Read
type: AUTOMATED
role: integrity
statement: >
  At least one subnet record carries both fields azure_nsg_workload_subnets_all_filtered
  reads (platform_subnet and nsg_id), so a zero count of unfiltered workload subnets
  reflects the subnets rather than a renamed field. Fails when the subscription has
  no subnet at all.

regex: '\{(?=[^{}]*"platform_subnet":\s*(?:true|false))(?=[^{}]*"nsg_id":)[^{}]*\}'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-NSG
