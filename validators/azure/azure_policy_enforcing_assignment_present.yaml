key: azure_policy_enforcing_assignment_present
name: Azure Policy Has an Enforcing Assignment
type: AUTOMATED
role: configuration
statement: >
  At least one Azure Policy assignment in effect on the subscription actually enforces:
  it carries a deny, denyAction, modify, deployIfNotExists, append, mutate,
  addToNetworkGroup or enforceSetting effect AND its enforcementMode is Default, so noncompliant requests are refused or changed and
  missing configuration is deployed. Substantiates the KSI-CNA-EIS claim that the
  intended state is automatically enforced, not only audited. Does NOT prove which
  resources the enforcing policies cover, that they are the right policies for the
  baseline, or that they have acted (azure_policy_no_noncompliant_enforcing_effects
  on the compliance set covers that).

# Form A on the summary rollup. The [1-9] prefix encodes ">= 1" in the regex, so zero
# enforcing assignments and a renamed key both leave nothing to match and FAIL.
regex: '"actually_enforcing_assignments":\s*(?<actually_enforcing_assignments>[1-9][0-9]*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POLICY-ASSIGN
