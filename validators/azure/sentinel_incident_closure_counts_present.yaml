key: sentinel_incident_closure_counts_present
name: Azure Sentinel Incident Closure Counts Present
type: AUTOMATED
role: integrity
statement: >
  A workspace's incidents were collected with all three closure counts numeric, so zero unclassified
  or untimed closed incidents reflects the incidents rather than renamed or uncollected counts.
  Integrity partner of sentinel_closed_incidents_classified and
  sentinel_closed_incidents_have_close_time.

regex: '"closed_close_time_not_retained":\s*\d+,[^{}]*?"closed_missing_close_time":\s*\d+,[^{}]*?"closed_undetermined":\s*\d'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SENTINEL-INCIDENTS
