key: azure_backup_vault_redundancy_fields_present
name: Recovery Services Vault Redundancy Fields Present
type: AUTOMATED
role: integrity
statement: >
  There is at least one Recovery Services vault, and a vault record carries the
  cross_region_restore_enabled flag followed by its total_protected_items count,
  the path azure_backup_vaults_cross_region_restore reads. Without it, a renamed
  flag reads as no vault without Cross Region Restore. Integrity partner for
  azure_backup_vaults_cross_region_restore.

# Same tempered path as the violation regex, any values.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*false)(?=[\s\S]*?"total_recovery_services_vaults":\s*[1-9])(?=[\s\S]*?"cross_region_restore_enabled":\s*(?:true|false),(?:(?!"cross_region_restore_(?:enabled|vaults)")[\s\S])*?"total_protected_items":\s*\d)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-BACKUP-RECOVERY
