key: azure_container_workloads_no_public_exposure
name: Azure Container Workloads No Unrestricted Public Exposure
type: AUTOMATED
role: configuration
statement: >
  No Container Instances group has a public IP address and no internet-facing Container App
  (external ingress in a non-internal environment) lacks client IP restriction rules on its ingress.
  Does NOT assert that the allow-listed ranges are approved, nor the network exposure of a Container
  Apps environment that hosts no internet-facing app. Passes with zero workloads. Supports Coverage
  row 84 (Policy Enforcement Point Exceptions / KSI-CNA-RNT) (proposed mapping, not yet audited).

regex: '"container_apps_without_ip_restrictions":\s*(?<container_apps_without_ip_restrictions>\d+)[\s\S]*?"container_groups_public_ip":\s*(?<container_groups_public_ip>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-CONTAINER-WORKLOADS-CONFIG
