key: entra_app_creds_validity_within_interval
name: Entra App Registration Credentials Expire Within The Approved Interval
type: AUTOMATED
role: configuration
statement: >-
  No client secret or certificate on any Microsoft Entra ID app registration has more than 365 days of
  validity left at collection time. Checked on every collection, a credential issued for longer than
  365 days fails until it is within 365 days of its expiry. Substantiates that no app credential
  currently outlives the approved interval (KSI-SVC-ASM). Counts violations, so
  entra_app_creds_expiry_fields_present must pass beside it. Does NOT prove a credential's issued
  lifetime: one issued for longer than 365 days passes once it is inside its last 365 days (a 3-year
  certificate passes all of its third year), because the fetcher records start and end dates but no
  lifetime field and a regex cannot subtract dates. Nor does it prove that a tenant app management
  policy caps credential lifetimes, credentials without an expiry date
  (entra_app_creds_none_expired_or_never_expiring), that a replacement was issued or that the old
  credential was removed, credentials held on service principals, or Key Vault and storage rotation.

# The interval is the 366+ alternation; change it to the approved number of days.
regex: '"days_until_expiry":\s*(?<days_until_expiry>36[6-9]|3[7-9]\d|[4-9]\d\d|[1-9]\d{3,})(?![\d.])'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-APP-CREDS
