key: azure_flow_logs_no_legacy_nsg_flow_logs
name: Azure Flow Logs Use VNet Flow Logs Not Legacy NSG
type: AUTOMATED
role: configuration
statement: >
  No flow log targets a network security group: traffic is recorded with virtual network flow logs,
  the type the Coverage row names, rather than legacy NSG flow logs, which Microsoft is retiring.
  Does not assert coverage or Traffic Analytics. Supports Coverage rows 8 (Audit Log Collection and
  Alerts / KSI-MLA-OSM), 10 (Audit Logging Criteria / KSI-MLA-LET) and 76 (Logged Event Type
  Inventory / KSI-MLA-LET) (proposed mapping, not yet audited).

regex: '"legacy_nsg_flow_logs":\s*(?<legacy_nsg_flow_logs>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-NETWORK-FLOW-LOGS
