key: azure_appgw_tls_versions_known
name: "Application Gateway: Every Encrypted Listener's TLS Version Is Known"
type: AUTOMATED
role: integrity
source: community
statement: >
  Every encrypted listener's effective minimum TLS version could be determined from a set or
  reported policy with a known predefined name (listeners_tls_version_unknown is 0), so the TLS 1.2
  check above judged every listener. Fails if the count appears other than exactly once. Does not
  check whether the collection run succeeded.

regex: '"listeners_tls_version_unknown":\s*(?<listeners_tls_version_unknown>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # listeners_tls_version_unknown
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPGW-TLS-LISTENERS
