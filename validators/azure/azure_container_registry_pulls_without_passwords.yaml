key: azure_container_registry_pulls_without_passwords
name: Azure Container Registry Pulls Without Passwords
type: AUTOMATED
role: configuration
statement: >
  No Container App, Container Apps job or Container Instances group pulls images from a registry
  with a stored username/password; every registry credential uses a managed identity. Passes when no
  private registry is configured. Does not assert which registries are approved (image_registries is
  not judged). Supports KSI-IAM-SNU.

regex: '"container_groups_registries_password_based":\s*(?<container_groups_registries_password_based>\d+)[\s\S]*?"workloads_registries_password_based":\s*(?<workloads_registries_password_based>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-CONTAINER-WORKLOADS-CONFIG
