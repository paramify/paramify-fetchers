key: azure_dns_resolver_policy_present
name: 'Azure DNS Security Policy: At Least One Policy in Scope'
type: AUTOMATED
role: completeness
statement: >
  At least one DNS security policy was read and is in scope (in_scope_dns_resolver_policies is
  above 0). Fails when the policy list could not be read or the subscription has none. Says nothing
  about what the policies block. Does not check whether the collection run succeeded.

regex: '"in_scope_dns_resolver_policies":\s*[1-9]\d*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DNS-RESOLVER-POLICY
