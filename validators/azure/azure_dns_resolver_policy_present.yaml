key: azure_dns_resolver_policy_present
name: 'Azure DNS Security Policy: At Least One Policy in Scope'
type: AUTOMATED
role: completeness
statement: >
  At least one DNS security policy was read and is in scope (in_scope_dns_resolver_policies is
  above 0). Fails when the policy list could not be read, the subscription has none, or the count appears other than exactly once. Says nothing
  about what the policies block. Does not check whether the collection run succeeded.

regex: '"in_scope_dns_resolver_policies":\s*(?<in_scope_dns_resolver_policies>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # in_scope_dns_resolver_policies
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DNS-RESOLVER-POLICY
