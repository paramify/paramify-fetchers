key: azure_vpn_gateways_zone_redundant_sku
name: Azure VPN Gateways Zone Redundant SKU
type: AUTOMATED
role: configuration
statement: >
  No VPN-type virtual network gateway runs on a SKU without availability-zone support: every gateway
  with gateway_type Vpn has an AZ SKU (VpnGw1AZ to VpnGw5AZ), so its instances are spread across
  availability zones. Basic and non-AZ VpnGw SKUs count as violations. ExpressRoute gateways are not
  judged. Supports KSI-CNA-OFA. Does NOT assert active-active mode (see
  azure_vpn_gateways_active_active), a second region, or a tested failover. Paired with
  azure_vpn_gateway_sku_present so a renamed key cannot read as zero violations.

regex: '"gateway_type":\s*"Vpn"(?:(?!"gateway_type")[\s\S])*?"sku_name":\s*"(?!VpnGw\d+AZ")'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-VPN-GATEWAY-CONFIG
