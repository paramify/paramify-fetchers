key: entra_app_creds_no_client_secrets
name: Entra App Registrations Hold No Client Secrets
type: AUTOMATED
role: configuration
statement: >-
  No Microsoft Entra ID app registration in the tenant holds a client secret (password credential),
  live or expired, so every app that authenticates with a stored credential uses a certificate, and the
  app registrations were read without a failure. Substantiates non-user accounts not relying on shared
  secrets (KSI-IAM-SNU). The count is tenant-wide, so an approved secret, or a secret on an app outside
  the system, still fails here and must be justified outside this evidence. Does NOT prove secrets held
  on service principals rather than app registrations (azure_entra_service_principals), that an app
  uses managed identity or federation instead, that an app has an owner, or how a certificate's
  private key is protected.

regex: '"partial_failure":\s*false[\s\S]*?"password_credentials":\s*(?<password_credentials>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # password_credentials
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-APP-CREDS
