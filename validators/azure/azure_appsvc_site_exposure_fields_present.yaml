key: azure_appsvc_site_exposure_fields_present
name: App Service Site Exposure Fields Present
type: AUTOMATED
role: integrity
statement: >
  At least one web app record carries main_site_allows_all_traffic,
  scm_site_allows_all_traffic and public_network_access in the shape
  azure_appsvc_no_public_allow_all_apps counts, so its zero means no open app
  rather than renamed fields. Per-app gaps (configuration not collected) fail
  the run and are caught by collection_succeeded.

regex: '"main_site_allows_all_traffic":\s*(?:true|false)(?:(?!"authentication":)[\s\S])*?"scm_site_allows_all_traffic":\s*(?:true|false)(?:(?!"authentication":)[\s\S])*?"public_network_access":\s*(?:null|"[^"]*")'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPSVC-CONFIG
