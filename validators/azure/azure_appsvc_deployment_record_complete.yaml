key: azure_appsvc_deployment_record_complete
name: Azure App Service Deployment Record Complete
type: AUTOMATED
role: integrity
statement: >-
  The subscription was read with no partial failure, at least one web app is in scope, the whole
  Activity Log window was read (activity_log_complete is true), and every web app's and slot's Kudu
  deployment records and deployment source were read, so no app's deployment evidence is unknown.
  Supports KSI-CMT-RMV by showing the record of how and by whom each web app was deployed is complete
  for the window, so a missing deployment can't hide behind a failed read. Does not prove: that
  deployments were redeployments rather than direct changes
  (azure_appsvc_no_publish_profile_downloads); that any change was approved or recorded (the
  comparator's validators); function apps; requests on deleted apps; or anything older than the
  window.

regex: '"partial_failure":\s*(?<partial_failure>true|false|null)[\s\S]*?"summary":\s*\{(?=[\s\S]*?"in_scope_web_apps":\s*(?<in_scope_web_apps>\d+))(?=[\s\S]*?"activity_log_complete":\s*(?<activity_log_complete>true|false|null))(?=[\s\S]*?"apps_kudu_deployment_records_unknown":\s*(?<apps_kudu_deployment_records_unknown>null|\d+(?:\.\d+)?))(?=[\s\S]*?"apps_source_control_unknown":\s*(?<apps_source_control_unknown>null|\d+(?:\.\d+)?))(?=[\s\S]*?"slots_source_control_unknown":\s*(?<slots_source_control_unknown>null|\d+(?:\.\d+)?))(?=[\s\S]*?"apps_deployment_evidence_unknown":\s*(?<apps_deployment_evidence_unknown>null|\d+(?:\.\d+)?))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] GREATER_THAN 0; MATCH_GROUP[3] EQUALS true; MATCH_GROUP[4] EQUALS 0; MATCH_GROUP[5] EQUALS 0; MATCH_GROUP[6] EQUALS 0; MATCH_GROUP[7] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # in_scope_web_apps
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # activity_log_complete
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }   # apps_kudu_deployment_records_unknown
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 5 }   # apps_source_control_unknown
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 6 }   # slots_source_control_unknown
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 7 }   # apps_deployment_evidence_unknown
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPSVC-DEPLOYMENTS
