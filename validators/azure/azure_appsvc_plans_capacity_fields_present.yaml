key: azure_appsvc_plans_capacity_fields_present
name: App Service Plan Capacity Fields Present
type: AUTOMATED
role: integrity
statement: >
  At least one App Service plan record carries elastic_scale_enabled,
  maximum_elastic_worker_count, multi_instance, platform_scaled and its sites
  list in the shape azure_appsvc_plans_no_single_instance counts, so its zero
  means no under-provisioned plan rather than renamed fields or an empty plan
  list.

regex: '"elastic_scale_enabled":\s*(?:true|false),[^{}\[\]]*?"maximum_elastic_worker_count":\s*(?:null|\d+),[^{}\[\]]*?"multi_instance":\s*(?:true|false),[^{}\[\]]*?"platform_scaled":\s*(?:true|false),[^{}\[\]]*?"sites":\s*\['
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPSVC-PLANS
