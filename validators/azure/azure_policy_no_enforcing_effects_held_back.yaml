key: azure_policy_no_enforcing_effects_held_back
name: Azure Policy Enforcing Effects Not Held Back
type: AUTOMATED
role: configuration
statement: >
  No Azure Policy assignment holds back an enforcing effect: none pairs a deny,
  denyAction, modify, deployIfNotExists, append, mutate, addToNetworkGroup or
  enforceSetting effect with enforcementMode DoNotEnforce, which evaluates the policy
  but never acts on it. Substantiates the KSI-CNA-EIS claim that noncompliant states
  are denied, modified or deployed as intended, and is the DoNotEnforce part of the
  KSI-SVC-EIS check that fails disabled controls. Does NOT prove that a DoNotEnforce assignment is unapproved (an approved
  exception in the organization's Configuration Management Plan is not in this evidence), or
  whether another Default-mode assignment of the same policy enforces it anyway; and
  it counts only effects the fetcher resolved (azure_policy_assignment_effects_resolved
  and azure_policy_member_effects_resolved guard that).

# Form A on the summary rollup: the MATCH_COUNT rule proves the field was there,
# the group rule requires zero held-back assignments.
regex: '"enforcing_effects_not_enforced_assignments":\s*(?<enforcing_effects_not_enforced_assignments>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POLICY-ASSIGN
