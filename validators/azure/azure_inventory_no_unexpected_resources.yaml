key: azure_inventory_no_unexpected_resources
name: 'Azure Resource Inventory: No Unexpected Resources'
type: AUTOMATED
role: completeness
statement: >
  Every in-scope resource in the subscription's Resource Graph inventory matches a pattern in the
  expected_resources list (unexpected_resources is 0), so the deployed population holds nothing the
  boundary does not account for. Resources left out of scope by resource_exclusions are not judged.
  Fails while no expected list is set or the inventory could not be read. Does not show that each
  resource is configured correctly. Does not check whether the collection run succeeded.

regex: '"unexpected_resources":\s*(?<unexpected_resources>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # unexpected_resources
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-INVENTORY
