key: entra_admin_mfa_coverage_complete
name: Entra Admin MFA Coverage Is Complete
type: AUTOMATED
role: configuration
statement: >-
  Every administrator in the Entra tenant is MFA-capable. Substantiates KSI-IAM-APM
  ("phishing-resistant MFA is used") for the highest-risk subset: admin accounts carry the
  most privilege per account, and a single admin without MFA contradicts the narrative
  regardless of overall coverage. Does NOT assert coverage over non-admin users (that is
  entra_mfa_coverage_meets_threshold). Fails when no admin was found, and when directory
  role membership couldn't be read (the admin counts read null). An admin with no row in
  the registration report counts as without MFA.

# admin_users must be at least 1; admin_users_without_mfa counts admins that are not MFA-capable.
regex: '"admin_users":\s*(?<admin_users>[1-9]\d*)[\s\S]*?"admin_users_without_mfa":\s*(?<admin_users_without_mfa>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # admin_users_without_mfa
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-MFA
