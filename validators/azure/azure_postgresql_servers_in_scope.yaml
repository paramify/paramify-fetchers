key: azure_postgresql_servers_in_scope
name: 'Azure PostgreSQL: At Least One Server in Scope'
type: AUTOMATED
role: completeness
source: community
statement: >
  At least one PostgreSQL flexible server was read and is in scope (in_scope_postgresql_servers is
  above 0). Fails when there are none, resource_exclusions took out every server, the server list
  was not read, or the count appears other than exactly once. Does not check whether the collection
  run succeeded.

regex: '"in_scope_postgresql_servers":\s*(?<in_scope_postgresql_servers>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # in_scope_postgresql_servers
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POSTGRESQL-CONFIG
