key: azure_endpoint_availability_lbs_all_judged
name: 'Azure Endpoint Availability: Every Load Balancer Was Judged Against the Target'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every Standard load balancer with load-balancing rules or health probes was judged against the
  target: none is missing an hour of a metric that applies or unread (load_balancers_not_judged is 0).
  Also fails while no target is configured (see 'Availability Target Is Configured' for the cause), so
  an undecided or unread value is never reported as a pass. These are inputs to availability
  reporting; they do not replace the availability reporting itself. Does not check whether the
  collection run succeeded.

regex: '"load_balancers_not_judged":\s*(?<load_balancers_not_judged>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # load_balancers_not_judged
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
