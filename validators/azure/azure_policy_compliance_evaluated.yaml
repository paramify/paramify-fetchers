key: azure_policy_compliance_evaluated
name: Azure Policy Compliance Evaluated Resources
type: AUTOMATED
role: integrity
statement: >
  Azure Policy evaluated at least one resource on the subscription in the latest
  window, so zero noncompliant states means nothing failed rather than nothing was
  assessed. When resource exclusions are set, the count covers in-scope resources
  only, and needs azure_policy_compliance 0.5.0 or later; 0.3.0 and 0.4.0 evidence
  reads null there and fails. Fails on a subscription with Microsoft.PolicyInsights
  unregistered, no evaluations, or an in-scope count that could not be read in full
  (null). Not a compliance claim.

regex: '"resources_evaluated":\s*(?<resources_evaluated>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # resources_evaluated
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POLICY-COMPLIANCE
