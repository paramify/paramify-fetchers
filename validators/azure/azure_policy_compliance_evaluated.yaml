key: azure_policy_compliance_evaluated
name: Azure Policy Compliance Evaluated Resources
type: AUTOMATED
role: integrity
statement: >
  Azure Policy evaluated at least one resource on the subscription in the latest
  window, so zero noncompliant states means nothing failed rather than nothing was
  assessed. When resource exclusions are set, the count covers in-scope resources
  only. Fails on a subscription with Microsoft.PolicyInsights unregistered, no
  evaluations, or an evaluated count that could not be read in full (null). Not a
  compliance claim.

regex: '"resources_evaluated":\s*(?<resources_evaluated>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POLICY-COMPLIANCE
