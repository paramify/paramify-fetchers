key: azure_flexible_server_backups_servers_read
name: 'Azure PostgreSQL and MySQL Backups: Every Server''s Backups Read'
type: AUTOMATED
role: integrity
source: community
statement: >
  At least one PostgreSQL or MySQL flexible server that takes its own backups (not a read replica) is
  in scope, and every one had its backup list read (backup_servers_read equals backup_servers). Does
  not check whether the collection run succeeded.

regex: '"backup_servers":\s*(?<backup_servers>[1-9]\d*)[\s\S]*?"backup_servers_read":\s*(?<backup_servers_read>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # backup_servers
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }            # backup_servers_read

evidence_sets:
  - EVD-AZURE-FLEXIBLE-SERVER-BACKUPS
