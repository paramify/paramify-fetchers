key: azure_alert_rules_reach_person_groups_deliverable
name: Azure Alert Rules Reach a Person and Action Groups Deliverable
type: AUTOMATED
role: configuration
statement: >
  Every enabled metric, log search and smart detector alert rule reaches a person
  (all_enabled_rules_reach_human is true, which is false when no rule is enabled and null when any
  is unknown), every action group in the subscription (at least one) is deliverable: enabled, with
  an enabled receiver (deliverable_action_groups equals action_groups), and the collection had no
  partial failure. Supports KSI-MLA-ALA, read as alerting. Does not prove which security events have
  a rule (the required list is the organization's), that rules are enabled
  (azure_scheduled_query_rules_none_disabled), or anything about access to log data.

regex: '"partial_failure":\s*false\b[\s\S]*?"action_groups":\s*(?<action_groups>[1-9]\d*),[\s\S]*?"all_enabled_rules_reach_human":\s*true,[\s\S]*?"deliverable_action_groups":\s*(?<deliverable_action_groups>\d+),'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # action_groups
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }            # deliverable_action_groups

evidence_sets:
  - EVD-AZURE-ALERT-RULES
