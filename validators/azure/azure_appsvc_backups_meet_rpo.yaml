key: azure_appsvc_backups_meet_rpo
name: App Service Web Apps Backed Up Within RPO
type: AUTOMATED
role: configuration
statement: >
  The fetcher's recovery point objective (AZURE_APP_SERVICE_RPO_HOURS) is set, every App Service web
  app has a restore point, and every app's newest restore point and largest gap between restore
  points are within that RPO. Fails until an RPO is configured. Supports KSI-RPL-ABO for App
  Service. It does not check that the configured RPO is the approved one, that a restore was ever
  tested, the RTO, function apps, or other data stores.

# all_web_apps_meet_recovery_point_objective is null, not true, while no RPO is set or no apps were found.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"recovery_point_objective_hours":\s*(?<recovery_point_objective_hours>\d+))(?=[\s\S]*?"all_web_apps_backed_up":\s*(?<all_web_apps_backed_up>true|false|null))(?=[\s\S]*?"all_web_apps_meet_recovery_point_objective":\s*(?<all_web_apps_meet_recovery_point_objective>true|false|null))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] GREATER_THAN 0; MATCH_GROUP[3] EQUALS true; MATCH_GROUP[4] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # recovery_point_objective_hours
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # all_web_apps_backed_up
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }   # all_web_apps_meet_recovery_point_objective
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-AZURE-APPSVC-BACKUPS
