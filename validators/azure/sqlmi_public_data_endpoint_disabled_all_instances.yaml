key: sqlmi_public_data_endpoint_disabled_all_instances
name: Azure SQL MI Public Data Endpoint Disabled On Every Instance
type: AUTOMATED
role: configuration
statement: >
  Every SQL Managed Instance has its public data endpoint disabled, leaving its
  virtual network and private endpoints as the only paths in; enabled or an unread
  setting fails. Substantiates "backends are reachable only through approved paths"
  for SQL MI. Does not prove the subnet's NSG rules, VNet peering, or
  which private endpoints are approved, and has no list of approved exceptions.
  Other backends are not covered here: storage accounts are
  storage_accounts_public_network_restricted, App Service is not in this evidence.

# Counts violations; sqlmi_configuration_fields_present proves the key was there.
regex: '"public_data_endpoint_enabled":\s*(?:true|null)'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SQLMI-CONFIG
