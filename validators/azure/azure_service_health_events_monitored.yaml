key: azure_service_health_events_monitored
name: Azure Service Health Events Monitored Over At Least 90 Days
type: AUTOMATED
role: configuration
statement: >-
  Microsoft's Service Health notices to the subscription were read in full: the event list covered at
  least the last 90 days (lookback_days of 90 or more), the events Resource Graph still holds were read
  too (events_from_resource_graph is a number), the event count is a number (0 is a quiet subscription,
  not a gap), and the run had no partial failure. The evidence therefore lists every service issue,
  planned maintenance, health advisory (retirements included) and security advisory Microsoft reported,
  with its status, deadline and recommended action. Supports KSI-CNA-IBP (provider advisories are
  compared against the provider's guidance) and KSI-SCR-MON (the upstream provider's notices are
  monitored automatically). Does NOT prove that anyone reviewed an advisory, decided whether it applies,
  or tracked a configuration change to completion: those dispositions are the organization's own record
  and aren't read. Microsoft names impacted resources only for some events, so a missing resource list
  does not mean an advisory doesn't apply.

regex: '"partial_failure":\s*false\b[\s\S]*?"summary":\s*\{[\s\S]*?"events":\s*\d+,[\s\S]*?"events_from_resource_graph":\s*\d+,[\s\S]*?"lookback_days":\s*(?:9\d|[1-9]\d{2,})\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SERVICE-HEALTH
