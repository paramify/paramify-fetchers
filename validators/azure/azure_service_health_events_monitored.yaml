key: azure_service_health_events_monitored
name: Azure Service Health Events Monitored Over At Least 90 Days
type: AUTOMATED
role: configuration
statement: >-
  Microsoft's Service Health notices to the subscription were listed in full for the lookback window: the
  event list covered at least the last 90 days (lookback_days of 90 or more), the older events Resource
  Graph still holds were read too (events_from_resource_graph is a number and
  events_in_resource_graph_not_found is 0), Microsoft.ResourceHealth is registered (so 0 events means none,
  not unreadable), the event count is a number (0 is a quiet subscription, not a gap), and the run had no
  partial failure. The evidence therefore lists every service issue, planned maintenance, health advisory
  (retirements included) and security advisory Microsoft reported that was last updated within the
  lookback window or that Resource Graph still holds, with its status, deadline and recommended action.
  Supports KSI-CNA-IBP (provider advisories are compared against the provider's guidance) and KSI-SCR-MON
  (the upstream provider's notices are monitored automatically). Does NOT prove that anyone reviewed an
  advisory, decided whether it applies, or tracked a configuration change to completion: those
  dispositions are the organization's own record and aren't read. Does NOT cover an advisory last updated
  before the window that Resource Graph no longer holds. Does NOT check that a sensitive event's details or
  a security advisory's resource list could be read: without the optional actions those reads are refused
  and the fields read unknown, and this validator still passes. Microsoft names impacted resources only
  for some events, so a missing resource list does not mean an advisory doesn't apply.

regex: '"partial_failure":\s*(?<partial_failure>true|false|null)[\s\S]*?"summary":\s*\{[\s\S]*?"events":\s*\d+,[\s\S]*?"events_from_resource_graph":\s*\d+,[\s\S]*?"events_in_resource_graph_not_found":\s*(?<events_in_resource_graph_not_found>null|\d+(?:\.\d+)?)[\s\S]*?"lookback_days":\s*(?:9\d|[1-9]\d{2,})\b[\s\S]*?"provider_registration_status":\s*(?<provider_registration_status>"(?:[^"\\]|\\.)*"|null|true|false|-?\d+(?:\.\d+)?)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] EQUALS "registered"
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # events_in_resource_graph_not_found
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # provider_registration_status
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "\"registered\"" }

evidence_sets:
  - EVD-AZURE-SERVICE-HEALTH
