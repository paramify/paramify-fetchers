key: network_traffic_no_denied_flow_spikes
name: Network Traffic Shows No Denied Flow Spikes
type: AUTOMATED
role: configuration
statement: >-
  Traffic Analytics was read in full, the prior window (the same number of days before the window) has
  flows to compare against, and no day in the window had more denied flows than the fetcher's spike
  factor (default 3) times the larger of the prior window's daily average and 100 flows (300 at the
  default factor). The average spans the prior-window days that hold records.
  Substantiates that blocked traffic is watched for sudden increases that point to scanning or an
  attack (KSI-CNA-ULN). Does NOT prove that the spike factor is the approved threshold (it is the
  fetcher's configuration), that a day under the threshold is benign, that traffic on subnets without a
  flow log or without Traffic Analytics was steady, or that anyone reviewed the denied flows. Without a
  baseline (Traffic Analytics newer than the prior window, or retention shorter than twice the window)
  it fails, because a spike can't be judged. An approved explanation for a spike is the organization's own record and
  isn't read; any spike day fails.

regex: '"summary":\s*\{[^{}]*?"denied_spike_days_count":\s*(?<denied_spike_days_count>\d+|null)[^{}]*?"traffic_baseline_available":\s*(?<traffic_baseline_available>true|false|null)[^{}]*?"traffic_read_in_full":\s*(?<traffic_read_in_full>true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] EQUALS true; MATCH_GROUP[3] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # denied_spike_days_count
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # traffic_baseline_available
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # traffic_read_in_full
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-AZURE-NETWORK-TRAFFIC-ACTIVITY
