key: azure_ai_hub_connections_no_stored_secrets
name: Azure AI Hub Connections Without Stored Secrets
type: AUTOMATED
role: configuration
statement: >
  Every connection listing on every AI hub, project and Machine Learning workspace authenticates to
  its target with Entra ID or a managed identity: none keeps a stored secret (API key, custom keys,
  PAT, username/password, access key, SAS, account key, service principal secret or OAuth2), none
  uses auth type None, none has an auth type the fetcher does not recognise, and every workspace's
  connections were read. Counts connection listings, so a project repeating its hub's connection is
  counted again. Does not assert who the connection is shared with, or that the target service
  itself is locked down. Supports KSI-IAM-SNU.

regex: '"connections_auth_type_unrecognized":\s*(?<connections_auth_type_unrecognized>\d+)[\s\S]*?"connections_unauthenticated":\s*(?<connections_unauthenticated>\d+)[\s\S]*?"connections_using_stored_secrets":\s*(?<connections_using_stored_secrets>\d+)[\s\S]*?"workspaces_connections_unknown":\s*(?<workspaces_connections_unknown>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] EQUALS 0; MATCH_GROUP[4] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-AI-HUB-CONFIG
