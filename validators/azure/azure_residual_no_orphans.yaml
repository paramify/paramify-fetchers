key: azure_residual_no_orphans
name: Azure No Orphaned Resources Or Assignments
type: AUTOMATED
role: configuration
statement: >
  The subscription has no orphaned resources (unattached disks, NICs, NSGs, public IPs and NAT
  gateways, disconnected private endpoints, empty App Service plans and resource groups, unused
  user-assigned identities, stale deployment slots) and no role assignments to deleted principals,
  and the principal lookup completed. Supports KSI-CNA-MAT for orphaned resources. It does not
  assert ownership, tags, or approval of resources that are in use.

# principal_check "complete" keeps an unrun lookup from reading as zero deleted-principal assignments.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"principal_check":\s*(?<principal_check>"(?:[^"\\]|\\.)*"|null|true|false|-?\d+(?:\.\d+)?))(?=[\s\S]*?"total_orphans":\s*(?<total_orphans>null|\d+(?:\.\d+)?))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS "complete"; MATCH_GROUP[3] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # principal_check
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "\"complete\"" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # total_orphans
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESIDUAL-RESOURCES
