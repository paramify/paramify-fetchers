key: azure_scheduled_query_rules_enabled_present
name: Enabled Azure Scheduled-Query Alert Rules Present
type: AUTOMATED
role: integrity
statement: >
  At least one enabled scheduled-query (log search) alert rule is present with the enabled /
  evaluation_frequency / id structure the two scheduled-query validators read, so their zero counts
  reflect posture, not renamed keys or an empty rule list. Integrity partner for the scheduled-query
  checks of KSI-MLA-RVL; on its own it shows only that scheduled-query alerting is in use.

regex: '"enabled":\s*(?<enabled>true|false|null),\s*"evaluation_frequency":\s*(?:null|"[^"]*"),\s*"id":\s*"[^"]*/[Mm]icrosoft\.[Ii]nsights/[Ss]cheduled[Qq]uery[Rr]ules/[^"]*",\s*"is_alerting_rule":\s*(?<is_alerting_rule>true|false|null)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true; MATCH_GROUP[2] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # enabled
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # is_alerting_rule
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-AZURE-ALERT-RULES
