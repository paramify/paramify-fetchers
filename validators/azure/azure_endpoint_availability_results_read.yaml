key: azure_endpoint_availability_results_read
name: 'Azure Endpoint Availability: Every Test''s Results Read'
type: AUTOMATED
role: integrity
source: community
statement: >
  Every enabled availability test's results were read (availability_tests_results_unread is 0), so the
  availability checks are judged on complete data. Does not check whether the collection run
  succeeded.

regex: '"availability_tests_results_unread":\s*(?<availability_tests_results_unread>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # availability_tests_results_unread
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
