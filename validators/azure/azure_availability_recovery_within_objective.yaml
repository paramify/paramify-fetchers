key: azure_availability_recovery_within_objective
name: Azure App Service and SQL MI Outages Within the Recovery Time Objective
type: AUTOMATED
role: configuration
statement: >-
  The subscription was read with no partial failure, a recovery time objective is configured, and
  every in-scope App Service app and SQL Managed Instance met it over the lookback (up to the 30 days
  Resource Health keeps): no outage, ongoing ones included, ran longer than the objective, and none
  is unknown (all_resources_meet_recovery_time_objective is true; it is null when no objective is set,
  there are no resources, or an Unknown health period or an outage joined to one runs longer than the
  objective). Supports KSI-RPL-RRO with measured outage lengths. Does not prove: that the configured
  objective is the approved one; recovery point or data loss; Front Door, storage or other resource
  types; outages older than the lookback; or that recovery was tested.

regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*false\b)(?=[\s\S]*?"all_resources_meet_recovery_time_objective":\s*true\b)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SERVICE-AVAILABILITY
