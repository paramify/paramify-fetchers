key: azure_endpoint_availability_tests_check_application
name: 'Azure Endpoint Availability: Every Test Checks the Application Works'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every enabled availability test (at least one) checks both an expected HTTP status code and the
  response content, so a pass shows the application answered correctly and not only that the endpoint
  was reachable. These are inputs to availability reporting; they do not replace the availability
  reporting itself. Does not check whether the collection run succeeded.

regex: '"availability_tests_checking_application":\s*(?<tests_checking_app>\d+)[\s\S]*?"availability_tests_enabled":\s*(?<tests_enabled>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # availability_tests_checking_application
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }            # availability_tests_enabled

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
