key: azure_container_apps_internet_facing_require_auth
name: Azure Container Apps Internet Facing Require Sign In
type: AUTOMATED
role: configuration
statement: >
  No internet-facing Container App (external ingress in a non-internal environment) lets callers
  through without sign-in: each has Easy Auth on and set to redirect or reject unauthenticated
  callers, and no app's authentication state is unknown. Passes with zero Container Apps. Does not
  assert IP restrictions, nor authentication implemented inside the container itself, and does not
  cover Container Instances. Supports KSI-CNA-RNT.

regex: '"container_apps_auth_unknown":\s*(?<container_apps_auth_unknown>\d+)[\s\S]*?"container_apps_internet_facing_without_auth":\s*(?<container_apps_internet_facing_without_auth>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-CONTAINER-WORKLOADS-CONFIG
