key: azure_waf_alerts_reach_person_every_waf
name: Azure Every WAF Covered by an Alert That Reaches a Person
type: AUTOMATED
role: configuration
statement: >-
  The subscription was read with no partial failure, it holds at least one WAF resource (a Front Door
  profile with a WAF policy or a WAF-tier App Gateway), and every one is covered by an enabled WAF
  alert rule that reaches a person: an enabled action group with an email, SMS, voice, push, ARM role
  or ITSM receiver and no alert processing rule that always suppresses it
  (waf_resources_with_alert_reaching_person equals waf_resources; null when the alert rules can't be
  read). An action group that can't be resolved doesn't count, so it fails. Supports KSI-CNA-RVP.
  Does not prove: what the alert's threshold or query is; that anyone acts on it; DDoS attack alerts; or
  that the WAF blocks.

regex: '"partial_failure":\s*false\b[\s\S]*?"waf_resources":\s*(?<waf_resources>[1-9]\d*),[\s\S]*?"waf_resources_with_alert_reaching_person":\s*(?<waf_resources_with_alert_reaching_person>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # waf_resources_with_alert_reaching_person
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 1 }

evidence_sets:
  - EVD-AZURE-WAF-DDOS-ACTIVITY
