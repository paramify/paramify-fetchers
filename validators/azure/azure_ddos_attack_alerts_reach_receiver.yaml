key: azure_ddos_attack_alerts_reach_receiver
name: Azure DDoS Attack Alerts Reach an Enabled Receiver
type: AUTOMATED
role: configuration
statement: >-
  The subscription was read with no partial failure, at least one attached public IP is protected by
  DDoS Protection (IP Protection on the IP, or Network Protection from a DDoS plan on its virtual
  network), every attached IP's protection could be determined, and every protected IP has an attack
  alert (an enabled alert rule on IfUnderDDoSAttack or a DDoS log category) that routes to an enabled
  receiver (protected_ips_with_attack_alert_reaching_receiver equals protected_public_ips, and
  public_ips_protection_unknown is 0; the alert figure is null when no attached IP is protected or the
  alert rules can't be read). Supports KSI-CNA-RVP. Fails when no protected IP has such an alert, when
  any protected IP lacks one, or when an IP's virtual network couldn't be found. Does not prove:
  unprotected IPs; WAF alerts (azure_waf_alerts_reach_person_every_waf); that the receiver is a person;
  that an attack happened or was mitigated; or that the DDoS protection was tested.

regex: '"partial_failure":\s*false\b[\s\S]*?"protected_ips_with_attack_alert_reaching_receiver":\s*(?<protected_ips_with_attack_alert_reaching_receiver>\d+)[\s\S]*?"protected_public_ips":\s*(?<protected_public_ips>[1-9]\d*)[\s\S]*?"public_ips_protection_unknown":\s*0\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # protected_ips_with_attack_alert_reaching_receiver
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }

evidence_sets:
  - EVD-AZURE-WAF-DDOS-ACTIVITY
