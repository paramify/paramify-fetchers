key: azure_collection_succeeded
name: Azure Evidence Collection Succeeded
type: AUTOMATED
role: completeness
statement: The fetcher run that produced this artifact completed successfully and the evidence envelope is intact.

# Same check as common/collection_succeeded, kept separate because sync links a
# validator to its sets only when it creates it: a workspace that already holds
# "Evidence Collection Succeeded" would leave these sets without a completeness check.
regex: '"exit_code":\s*(?<exit_code>-?\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # exit_code
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
