key: azure_service_health_no_open_high_severity_advisories
name: Azure Service Health No Open High-Severity Advisories
type: AUTOMATED
role: configuration
statement: >-
  No health or security advisory Microsoft reported to the subscription that was last updated within the
  lookback window, or that Resource Graph still holds, is open at level Critical or Error:
  open_high_severity_advisories is 0, every older event Resource Graph holds was found
  (events_in_resource_graph_not_found is 0), Microsoft.ResourceHealth is registered (so 0 means none open,
  not unreadable), and the run had no partial failure. Open follows Microsoft's own rule (an advisory
  stays open until its impact end time, such as a retirement date, passes), so an open high-severity
  advisory is one still asking for attention. Supports KSI-SCR-MON (upstream advisories are monitored and
  none of high severity is left standing). Fails while any such advisory is open; an advisory the
  organization has dispositioned (accepted, mitigated or excepted) still fails here, because that record
  is the organization's own and isn't read. Does NOT prove anything about Warning or Informational
  advisories, service issues or planned maintenance, an advisory last updated before the window that
  Resource Graph no longer holds, or that advisories Microsoft did not send were absent. Fails when the
  count is unknown (the event list could not be read), when the run had a partial failure (an event could
  not be read, so the count may be short), or when the provider is not registered or its registration is
  unknown.

regex: '"partial_failure":\s*false\b[\s\S]*?"events_in_resource_graph_not_found":\s*0\b[\s\S]*?"open_high_severity_advisories":\s*(?<open_high_severity_advisories>\d+)[\s\S]*?"provider_registration_status":\s*"registered"'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # open_high_severity_advisories
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SERVICE-HEALTH
