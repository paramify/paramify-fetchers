key: azure_dns_resolver_policy_query_logs_exported
name: 'Azure DNS Security Policy: Every Policy Exports Its Query Logs'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every in-scope DNS security policy has a diagnostic setting sending an enabled log category to a
  workspace, storage account, event hub or partner (policies_without_query_logs_exported is 0).
  Fails while any policy's diagnostic settings are unread. Passes with no policies in scope, which
  azure_dns_resolver_policy_present catches. Shows logs are sent, not that they arrive or are
  reviewed. Does not check whether the collection run succeeded.

regex: '"policies_without_query_logs_exported":\s*(?<policies_without_query_logs_exported>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # policies_without_query_logs_exported
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DNS-RESOLVER-POLICY
