key: sqlmi_configuration_fields_present
name: Azure SQL MI Configuration Fields Were Read
type: AUTOMATED
role: integrity
statement: >
  The per-instance minimal_tls_version, azure_ad_only_authentication and
  public_data_endpoint_enabled keys are all present, so zero violations from the
  three SQL MI configuration validators reflect posture rather than a renamed key
  or an empty collection.

# One match at the document start when every lookahead finds its key anywhere in the file.
regex: '^\s*\{(?=[\s\S]*?"minimal_tls_version":\s*(?:null|"))(?=[\s\S]*?"azure_ad_only_authentication":\s*(?:true|false|null))(?=[\s\S]*?"public_data_endpoint_enabled":\s*(?:true|false|null))'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SQLMI-CONFIG
