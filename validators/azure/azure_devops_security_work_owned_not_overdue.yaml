key: azure_devops_security_work_owned_not_overdue
name: Azure DevOps Security Work Owned and Not Overdue at High Priority
type: AUTOMATED
role: configuration
statement: >-
  At least one project's work items were listed, at least one tag marks security work, and no open
  security-tagged item is unassigned or past its planned date at priority or severity 1 or 2
  (tagged_items_open_unassigned and tagged_items_overdue_high_priority are empty lists; both are null
  when a project's items couldn't be listed). No open security work at all also passes. Supports
  KSI-PIY-RES with an owner on every open security item and high-priority security work on time.
  Does not prove: that security work is tagged consistently; lower-priority overdue items
  (tagged_items_overdue); items with no planned date; a primary and backup per responsibility; on-call
  coverage or training; or projects the collecting identity can't see.

regex: '"summary":\s*\{(?=[\s\S]*?"projects_collected":\s*[1-9]\d*)(?=[\s\S]*?"tagged_items_open_unassigned":\s*\[\s*\])(?=[\s\S]*?"tagged_items_overdue_high_priority":\s*\[\s*\])(?=[\s\S]*?"work_item_tags":\s*\[\s*")'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DEVOPS-WORK-ITEMS
