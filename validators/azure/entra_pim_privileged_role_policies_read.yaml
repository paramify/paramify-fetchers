key: entra_pim_privileged_role_policies_read
name: Entra PIM Privileged Role Policies Read
type: AUTOMATED
role: integrity
statement: >-
  The tenant-wide PIM policy of at least one privileged Entra ID directory role was read, and the
  collection was complete. Integrity partner of
  entra_pim_activation_requires_mfa_approval_justification: with no privileged policy read, the
  fetcher's activation lists read [] and would look compliant. Asserts nothing about posture.

regex: '"partial_failure":\s*(?<partial_failure>true|false|null)[\s\S]*?"collection_complete":\s*(?<collection_complete>true|false|null)[\s\S]*?"privileged_role_policies":\s*(?<privileged_role_policies>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS true; MATCH_GROUP[3] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # collection_complete
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # privileged_role_policies
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-PIM-ASSIGNMENTS
