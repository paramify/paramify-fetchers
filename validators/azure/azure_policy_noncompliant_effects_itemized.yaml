key: azure_policy_noncompliant_effects_itemized
name: Azure Policy Noncompliant Effects Itemized
type: AUTOMATED
role: integrity
statement: >
  The per-policy effect that azure_policy_no_noncompliant_enforcing_effects counts is
  present whenever there is anything to count: either at least one noncompliant
  member policy carries an "effect", or the summary reports zero noncompliant
  assignments. A renamed effect key on a subscription with noncompliant policies
  therefore fails here instead of reading as zero violations. Not a compliance claim.

# Either alternative proves the count is readable. "non_compliant_assignments" exists
# only in the summary, so a compliant per-assignment record cannot satisfy it.
regex: '"effect":\s*"[A-Za-z]+"|"non_compliant_assignments":\s*0(?![0-9])'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POLICY-COMPLIANCE
