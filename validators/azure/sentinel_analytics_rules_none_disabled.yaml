key: sentinel_analytics_rules_none_disabled
name: Azure Sentinel Analytics Rules None Disabled
type: AUTOMATED
role: configuration
statement: >
  No Microsoft Sentinel workspace has a disabled analytics (detection) rule: every workspace reports
  disabled_rules 0. Supports KSI-MLA-RVL, that the detections the organization relies on are
  switched on, and KSI-IAM-SUS, failing on a disabled detection rule. It does not say which rules
  the organization requires; a required rule that was deleted rather than disabled is not seen.
  Counts violations, so it relies on sentinel_analytics_rule_counts_present to prove the count was
  there.

regex: '"disabled_rules":\s*[1-9]'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SENTINEL-ANALYTICS-RULES
