key: azure_defender_assessments_no_open_high_sql_resources
name: No Open High-Severity Defender Findings on Azure SQL Instances, Servers and Databases
type: AUTOMATED
role: configuration
statement: >
  No Defender for Cloud recommendation is open (Unhealthy) at High severity, High being Defender's
  top severity, on an Azure SQL Managed Instance or SQL server or on any resource under it: its
  databases and its settings, such as Microsoft Entra-only authentication. Defender reports each SQL
  vulnerability assessment rule as its own recommendation on the database, so every SQL
  vulnerability assessment finding is covered. An instance or server with vulnerability assessment or
  Defender for SQL turned off fails through Defender's own High recommendation on it. A rule approved
  into a database's vulnerability assessment baseline reports Healthy, and an exempted recommendation
  reports NotApplicable, so a treated finding does not fail this check. Supports KSI-SCR-MIT (critical
  vulnerabilities are not left without treatment) for Azure SQL. Does NOT read other resource types,
  including SQL virtual clusters, or Medium and Low findings. It doesn't measure how long a finding has
  been open. It doesn't cover end-of-support
  components or supplier risk, or prove that a baseline approval or exemption was itself approved:
  those records are the organization's. It relies on Defender raising a High recommendation for an
  instance it doesn't scan.

# Counts violations, so it cannot guard itself: azure_defender_assessments_sql_findings_readable
# is its integrity partner. Each match is one assessment record on a SQL instance or server, or a
# resource under it; the object fence skips braces inside strings, and provider segments match any case.
regex: '\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"resource_id":\s*"[^"]*/[pP][rR][oO][vV][iI][dD][eE][rR][sS]/[mM][iI][cC][rR][oO][sS][oO][fF][tT]\.[sS][qQ][lL]/(?:[mM][aA][nN][aA][gG][eE][dD][iI][nN][sS][tT][aA][nN][cC][eE][sS]|[sS][eE][rR][vV][eE][rR][sS])/[^"/]+(?:/[^"]*)?")(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"severity":\s*"[hH]igh")(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"status_code":\s*"[uU]nhealthy")(?:[^{}"]|"(?:[^"\\]|\\.)*")*\}'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DEFENDER-ASSESSMENTS
