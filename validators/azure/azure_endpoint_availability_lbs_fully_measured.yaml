key: azure_endpoint_availability_lbs_fully_measured
name: 'Azure Endpoint Availability: No Load Balancer Missing an Hour of Metrics'
type: AUTOMATED
role: configuration
source: community
statement: >
  No Standard load balancer is missing an hour of data-path or health-probe data over the lookback
  (load_balancers_with_missing_measurements is 0). These are inputs to availability reporting; they do
  not replace the availability reporting itself. Does not check whether the collection run succeeded.

regex: '"load_balancers_with_missing_measurements":\s*(?<load_balancers_with_missing_measurements>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # load_balancers_with_missing_measurements
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
