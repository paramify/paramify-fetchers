key: azure_devops_checkin_override_only_admin_groups
name: Azure DevOps Check-In Validation Override Held Only by Admin Groups and Build Services
type: AUTOMATED
role: configuration
statement: >-
  Every delivery-related security namespace was read and the identities in its permission entries
  looked up with no partial failure, at least one Build permission entry allows overriding check-in
  validation, and none allows it, set on the entry or inherited and not denied there, to anyone other
  than the built-in admin groups and the build service accounts with their Project Collection Build
  Service Accounts group (checkin_validation_override_grants_outside_admin_groups is 0), so only they
  can check in to TFVC without a gated build first building the change. Supports KSI-IAM-ELP for
  Azure DevOps. Covers the Build permissions the collecting identity can read. An identity looked up
  with no result counts as outside the admin groups. Does not prove: who is in the admin groups or
  the build service accounts group (azure_devops_identities); that any build is gated, so the right
  may grant nothing; or that a holder has an approved exception, so an approved holder still fails.

# The override fields read null when the Build permissions or an identity couldn't be read, so \d+ fails
# rather than reading unknown as 0; a run with no override grant at all fails too.
regex: '"partial_failure":\s*false\b[\s\S]*?"checkin_validation_override_grants":\s*[1-9]\d*,[\s\S]*?"checkin_validation_override_grants_outside_admin_groups":\s*(?<checkin_validation_override_grants_outside_admin_groups>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # checkin_validation_override_grants_outside_admin_groups
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DEVOPS-PERMISSIONS
