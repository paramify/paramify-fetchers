key: azure_kv_app_service_certificates_not_expiring_30_days
name: App Service Certificates Not Expiring Within 30 Days
type: AUTOMATED
role: configuration
source: community
statement: >
  No in-scope App Service certificate that has not yet expired expires within 30 days of the run,
  and the App Service certificate list was read. With no App Service certificates it passes. Does
  not assert certificates already expired, Key Vault certificates, renewal settings, or whether the
  collection run succeeded. Fails when the count is above 0, or when the certificate list couldn't
  be read (in_scope_app_service_certificates is null; the count itself reads 0 then). Supports
  KSI-SVC-ASM.

# in_scope_app_service_certificates is the precondition: it is null when the list wasn't read.
regex: '"app_service_certificates_expiring_within_30_days":\s*(?<expiring_within_30_days>\d+)[\s\S]*?"in_scope_app_service_certificates":\s*\d+'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-KEYVAULT-ROTATION
