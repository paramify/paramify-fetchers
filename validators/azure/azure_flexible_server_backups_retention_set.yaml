key: azure_flexible_server_backups_retention_set
name: 'Azure PostgreSQL and MySQL Backups: Required Retention Is Configured'
type: AUTOMATED
role: configuration
source: community
statement: >
  The authorized backup retention is configured (required_retention_days is a whole number above 0).
  Fails while it is not set, which marks the retention as undecided rather than a server as wrong.
  Does not check whether the collection run succeeded.

regex: '"required_retention_days":\s*(?<required_retention_days>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-FLEXIBLE-SERVER-BACKUPS
