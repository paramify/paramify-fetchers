key: azure_endpoint_availability_lbs_meet_target
name: 'Azure Endpoint Availability: Every Load Balancer Met the Target'
type: AUTOMATED
role: configuration
source: community
statement: >
  No Standard load balancer with every hour measured had an average data-path availability or
  health-probe status below availability_target_percentage (load_balancers_below_target is 0). Only
  the metrics that apply are judged: data path when the load balancer has load-balancing rules, health
  probe when it has probes; one with neither (outbound-only) is not judged. Also fails while no target
  is configured (see 'Availability Target Is Configured' for the cause), so an undecided or unread
  value is never reported as a pass. These are inputs to availability reporting; they do not replace
  the availability reporting itself. Does not check whether the collection run succeeded.

regex: '"load_balancers_below_target":\s*(?<load_balancers_below_target>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # load_balancers_below_target
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
