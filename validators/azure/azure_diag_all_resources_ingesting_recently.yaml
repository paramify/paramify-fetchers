key: azure_diag_all_resources_ingesting_recently
name: Azure Log Analytics-Bound Resources All Ingesting Recently
type: AUTOMATED
role: configuration
statement: >
  Every log-emitting resource that exports to Log Analytics has a record in a destination workspace
  within the ingestion lookback (7 days by default): all_log_analytics_resources_ingesting is true,
  none is unknown or without records, at least one resource is ingesting, and the collection had no
  partial failure. A destination that refused the read, or an unqueried Basic or Auxiliary table
  that could hold the logs, reads unknown and fails. Supports KSI-MLA-OSM. Does not prove resources
  with no Log Analytics setting are covered (see azure_diag_log_analytics_coverage_complete) or that
  the workspace is approved. An idle resource whose logs are event-driven writes nothing and fails
  here too.

regex: '"partial_failure":\s*(?<partial_failure>true|false|null)[\s\S]*?"all_log_analytics_resources_ingesting":\s*(?<all_log_analytics_resources_ingesting>true|false|null),[\s\S]*?"resources_ingestion_unknown":\s*(?<resources_ingestion_unknown>null|\d+(?:\.\d+)?),[\s\S]*?"resources_with_recent_ingestion":\s*(?<resources_with_recent_ingestion>\d+),\s*"resources_without_recent_ingestion":\s*(?<resources_without_recent_ingestion>null|\d+(?:\.\d+)?)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS true; MATCH_GROUP[3] EQUALS 0; MATCH_GROUP[4] GREATER_THAN 0; MATCH_GROUP[5] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # all_log_analytics_resources_ingesting
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # resources_ingestion_unknown
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }   # resources_with_recent_ingestion
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 5 }   # resources_without_recent_ingestion
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RESOURCE-DIAG-SETTINGS
