key: azure_appgw_gateways_complete
name: 'Application Gateway: Every Gateway Was Read'
type: AUTOMATED
role: completeness
source: community
statement: >
  The application gateway list was read and its count matches Azure Resource Graph's count of
  gateways in the subscription (completeness_match is true), so the verdicts above cover every
  gateway. Fails when either count could not be read or they differ. Does not check whether the
  collection run succeeded.

regex: '"completeness_match":\s*true\b'
rules_summary: MATCH_COUNT EQUALS 1
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }

evidence_sets:
  - EVD-AZURE-APPGW-WAF
  - EVD-AZURE-APPGW-TLS-LISTENERS
  - EVD-AZURE-APPGW-BACKEND-TLS
