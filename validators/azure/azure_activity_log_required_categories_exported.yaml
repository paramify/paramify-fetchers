key: azure_activity_log_required_categories_exported
name: Azure Activity Log Exported With Required Categories
type: AUTOMATED
role: configuration
statement: >-
  The subscription's diagnostic settings were read with no partial failure, at least one exports the
  Activity Log, and together they export the four control-plane audit categories Administrative,
  Security, Policy and Alert (activity_log_exported and all_required_log_categories_covered are both
  true) out of the Activity Log, to a storage account, Log Analytics workspace, event hub or partner
  solution. Supports KSI-MLA-OSM and KSI-MLA-LET for the subscription's control-plane log. Does not
  prove: that the records are kept past the Activity Log's own 90 days, as an event hub keeps nothing
  and other destinations keep them as long as they are set to; that the categories reach a Log
  Analytics workspace (azure_activity_log_required_categories_to_log_analytics); the other Activity
  Log categories; resource-level or Entra ID diagnostic settings; that records arrive; or other
  subscriptions.

regex: '"partial_failure":\s*(?<partial_failure>true|false|null)[\s\S]*?"summary":\s*\{(?=[\s\S]*?"activity_log_exported":\s*(?<activity_log_exported>true|false|null))(?=[\s\S]*?"all_required_log_categories_covered":\s*(?<all_required_log_categories_covered>true|false|null))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS true; MATCH_GROUP[3] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # activity_log_exported
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # all_required_log_categories_covered
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-AZURE-DIAG-SETTINGS
