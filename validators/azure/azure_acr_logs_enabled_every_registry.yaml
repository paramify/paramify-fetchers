key: azure_acr_logs_enabled_every_registry
name: 'Azure Container Registry: Logs Enabled on Every Registry'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every in-scope container registry has a diagnostic setting with at least one log category on
  (registries_with_enabled_logs equals total_registries, and there is at least one registry). Shows
  the logs are exported, not which categories or where they are reviewed. Fails when the registry
  list was not read or the counts appear other than exactly once. Does not check whether the
  collection run succeeded.

regex: '"registries_with_enabled_logs":\s*(?<registries_with_enabled_logs>\d+)(?:(?!"registries_with_enabled_logs")[\s\S])*?"total_registries":\s*(?<total_registries>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]; MATCH_GROUP[2] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # registries_with_enabled_logs
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }            # total_registries
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # total_registries
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ACR-CONFIG
