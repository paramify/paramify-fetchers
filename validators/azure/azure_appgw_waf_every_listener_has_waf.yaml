key: azure_appgw_waf_every_listener_has_waf
name: 'Application Gateway WAF: Every Web Listener Has a WAF'
type: AUTOMATED
role: configuration
source: community
statement: >
  No web listener, public or private, is without a WAF policy or legacy WAF configuration
  (listeners_without_waf is 0). Says nothing about whether each WAF is in Prevention mode; see
  'Every Public Web Listener Blocks Attacks'. Fails if the count appears other than exactly once.
  Does not check whether the collection run succeeded.

regex: '"listeners_without_waf":\s*(?<listeners_without_waf>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # listeners_without_waf
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPGW-WAF
