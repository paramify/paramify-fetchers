key: azure_vpn_all_tunnels_ikev2
name: Azure VPN All Tunnels IKEv2
type: AUTOMATED
role: configuration
statement: >
  Every site-to-site (IPsec) and VNet-to-VNet tunnel on the subscription's VPN gateways negotiates
  with IKEv2, and at least one tunnel exists. Reads the summary rollups ikev2_connections =
  ipsec_connections, which also leaves no IKEv1 or unknown-version tunnel. Does NOT assert the IPsec
  algorithms (see azure_vpn_no_weak_ipsec_algorithms), CMVP validation, or Virtual WAN gateways
  (separate evidence set). Supports KSI-SVC-SIN, and the IPsec security requirements of boundary
  links in KSI-CNA-RNT; it does not show those links were approved or reviewed.

regex: '"ikev2_connections":\s*(?<ikev2_connections>\d+)[\s\S]*?"ipsec_connections":\s*(?<ipsec_connections>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }

evidence_sets:
  - EVD-AZURE-VPN-GATEWAY-CONFIG
