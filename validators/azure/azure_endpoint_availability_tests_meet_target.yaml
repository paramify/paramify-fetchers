key: azure_endpoint_availability_tests_meet_target
name: 'Azure Endpoint Availability: Every Tested Endpoint Met the Target'
type: AUTOMATED
role: configuration
statement: >
  No enabled availability test with every hour measured averaged below availability_target_percentage
  over the lookback (availability_tests_below_target is 0). Passes while no target is configured; that
  case fails 'Availability Target Is Configured' instead. Tests that could not be judged are checked
  by 'Every Test Was Judged'. Supports KSI-CNA-OFA. These are inputs to availability reporting; they
  do not replace the availability reporting itself. Does not check whether the collection run
  succeeded.

regex: '"availability_tests_below_target":\s*(?:0|null)\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
