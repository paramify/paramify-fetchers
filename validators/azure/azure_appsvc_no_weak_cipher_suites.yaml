key: azure_appsvc_no_weak_cipher_suites
name: App Service Web Apps Allow No CBC Or Static-RSA Ciphers
type: AUTOMATED
role: configuration
statement: >
  No App Service web app still allows a CBC-mode TLS cipher suite or a static-RSA
  (TLS_RSA_*, no forward secrecy) suite, judged from each app's minimum TLS
  version and minimum cipher suite; every app's cipher verdict was computed, and
  there is at least one web app. The "weak TLS/ciphers" part of rows 14 and 106
  for App Service (KSI-SVC-SIN, KSI-SVC-VRI). An app with no minimum cipher suite
  set allows every suite and fails; TLS 1.3 or a minimum suite at or above
  TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384 passes. It does not judge the SCM site,
  Front Door, SQL MI or storage ciphers, or FIPS validation of the modules.

# Summary counts at 0, plus per-app verdicts present and none null (a null verdict or config is not counted in the rollups).
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*false)(?=[\s\S]*?"total_web_apps":\s*[1-9])(?=[\s\S]*?"cbc_cipher_suites_allowed_apps":\s*0\b)(?=[\s\S]*?"non_forward_secret_cipher_suites_allowed_apps":\s*0\b)(?=[\s\S]*?"allows_cbc_cipher_suites":\s*false)(?![\s\S]*?"(?:allows_cbc_cipher_suites|allows_non_forward_secret_cipher_suites|configuration)":\s*null)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPSVC-CONFIG
