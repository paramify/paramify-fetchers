key: azure_defender_assessments_no_open_high_sql_findings
name: No Open High-Severity Defender Findings on SQL Databases
type: AUTOMATED
role: configuration
statement: >
  No Defender for Cloud recommendation on an Azure SQL database (a database on a SQL Managed
  Instance or on a SQL server) is open (Unhealthy) at High severity, High being Defender's top
  severity. Defender reports each SQL vulnerability assessment rule as its own recommendation on
  the database, so this covers every SQL vulnerability assessment finding, plus any other Defender
  recommendation on a database. A rule approved into the database's vulnerability assessment
  baseline reports Healthy, and an exempted recommendation reports NotApplicable, so a treated
  finding does not fail this check. Supports KSI-SCR-MIT (critical vulnerabilities are not left
  without treatment) for SQL databases. Does NOT read findings on the instance or server itself or
  on any other resource type, Medium or Low findings, how long a finding has been open (no SLA),
  end-of-support components or supplier risk, or whether a baseline approval or exemption was
  itself approved: those records are the organization's.

# Counts violations, so it cannot guard itself: azure_defender_assessments_sql_findings_readable
# is its integrity partner. Each match is one assessment record whose resource_id is a database.
regex: '\{(?=[^{}]*"resource_id":\s*"[^"]*/[pP]roviders/[mM]icrosoft\.[sS]ql/(?:[mM]anaged[iI]nstances|[sS]ervers)/[^"/]+/[dD]atabases/[^"/]+")(?=[^{}]*"severity":\s*"[hH]igh")(?=[^{}]*"status_code":\s*"[uU]nhealthy")[^{}]*\}'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DEFENDER-ASSESSMENTS
