key: entra_priv_roles_holders_all_approved
name: Entra Privileged Directory Roles Held Only By Approved Principals
type: AUTOMATED
role: configuration
source: community
statement: >-
  azure_entra_privileged_roles reports an approved list as set (its approved_principal_ids setting) and
  counts 0 principals (users, groups or service principals) actively holding a privileged Entra ID
  directory role whose object id is not on it. Privileged roles are Global Administrator, Privileged Role
  Administrator and the other admin and tenant-wide reader roles the fetcher flags. Active means a
  permanent assignment or a PIM activation open at collection time. A group that holds a role is matched
  by its own id. The count reads null, so this validator fails, when no list is set, an entry is not an
  object id, or the role list or a privileged role's members or service principals could not be read;
  evidence from fetcher versions before 0.3.0 has no count and fails too. Substantiates standing
  privileged role holders being limited to the approved ones (KSI-IAM-JIT). Does NOT prove that the list
  matches the organization's approval record (the evidence shows the ids it compared, in
  results.approved_principal_ids), who is in a group that holds a role, PIM-eligible assignments not
  activated at collection time, roles scoped to an administrative unit, Azure resource roles, or custom
  directory roles and built-in roles outside the fetcher's list (results.privileged_role_names_checked).
  Does not check whether the collection run succeeded; azure_collection_succeeded does.

regex: '"approved_principals_configured":\s*true[\s\S]*?"unapproved_privileged_principals":\s*(?<unapproved_privileged_principals>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # unapproved_privileged_principals
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-PRIV-ROLES
