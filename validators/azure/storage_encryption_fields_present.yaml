key: storage_encryption_fields_present
name: Azure Storage Encryption Fields Were Read
type: AUTOMATED
role: integrity
statement: >
  The per-account minimum_tls_version, enable_https_traffic_only, encryption_type
  and allow_shared_key_access keys are all present, so zero violations from the
  three storage validators reflect posture rather than a renamed key or an empty
  collection.

# One match at the document start when every lookahead finds its key anywhere in the file.
regex: '^\s*\{(?=[\s\S]*?"minimum_tls_version":\s*(?:null|"))(?=[\s\S]*?"enable_https_traffic_only":\s*(?:true|false|null))(?=[\s\S]*?"encryption_type":\s*(?:null|"))(?=[\s\S]*?"allow_shared_key_access":\s*(?:true|false|null))'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-STORAGE-ENC
