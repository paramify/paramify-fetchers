key: azure_redis_cache_all_private_only
name: Azure Cache for Redis All Caches Private Only
type: AUTOMATED
role: configuration
statement: >
  Every classic Azure Cache for Redis cache in the evidence is private-only (summary
  private_only_caches equals total_caches, with at least one cache): public network access is
  Disabled and the cache has an Approved private endpoint or is VNet-injected. A cache whose
  public_network_access Azure did not return counts as not disabled, so unknown is never compliant,
  and summary.exceptions.unknown_state must be empty. Supports KSI-CNA-RNT: fails public backend
  access. Does NOT assert which systems connect, approval of the paths, or a monthly review.

regex: '"unknown_state":\s*\[\s*\][\s\S]*?"private_only_caches":\s*(?<private_only_caches>\d+)[\s\S]*?"total_caches":\s*(?<total_caches>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }

evidence_sets:
  - EVD-AZURE-REDIS-CACHE-CONFIG
