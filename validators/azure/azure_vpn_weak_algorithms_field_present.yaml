key: azure_vpn_weak_algorithms_field_present
name: Azure VPN Weak Algorithms Field Present
type: AUTOMATED
role: integrity
statement: >
  At least one connection, site link or server configuration in the evidence carries a
  weak_ipsec_algorithms list, so the zero count in azure_vpn_no_weak_ipsec_algorithms reflects
  posture rather than a renamed field. Fails when the subscription has no VPN connections. Supports
  Coverage row 14 (Authorized Cryptographic Modules / KSI-SVC-SIN) for the VPN gateway and Virtual
  WAN sets.

regex: '"weak_ipsec_algorithms":\s*\['
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-VPN-GATEWAY-CONFIG
  - EVD-AZURE-VIRTUAL-WAN-CONFIG
