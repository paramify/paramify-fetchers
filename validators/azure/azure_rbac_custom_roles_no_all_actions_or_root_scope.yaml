key: azure_rbac_custom_roles_no_all_actions_or_root_scope
name: Azure RBAC No Custom Role Grants All Actions Or Tenant-Wide Scope
type: AUTOMATED
role: configuration
statement: >-
  The subscription's role definitions were listed without an API failure (built-in roles were
  returned, so an empty custom-role list is real), and no custom Azure RBAC role grants every
  control-plane action (an actions entry of exactly *, which makes it Owner- or
  Contributor-equivalent whatever its notActions take away) or is assignable at the tenant root (/).
  A subscription with no custom roles passes. Substantiates that privileges are strictly defined rather than granted wholesale (KSI-CNA-DFP,
  KSI-IAM-ELP). An approved exception still fails here and must be justified outside this evidence.
  Does NOT prove that provider-scoped wildcards (such as Microsoft.Web/*) or data-plane wildcards
  are narrow enough, who holds these roles (azure_rbac_role_assignments), or anything about
  built-in roles; custom roles defined only at a management group may not be listed.

# Built-in roles always exist, so builtin_role_definitions of 0 means the list failed: the regex
# needs 1 or more there, and a failed read never matches.
regex: '"partial_failure":\s*false[\s\S]*?"builtin_role_definitions":\s*(?<builtin_role_definitions>[1-9]\d*)[\s\S]*?"custom_roles_with_all_actions_wildcard":\s*(?<custom_roles_with_all_actions_wildcard>\d+)[\s\S]*?"custom_roles_with_root_assignable_scope":\s*(?<custom_roles_with_root_assignable_scope>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS 0; MATCH_GROUP[3] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # custom_roles_with_all_actions_wildcard
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # custom_roles_with_root_assignable_scope
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-RBAC-CUSTOM-ROLES
