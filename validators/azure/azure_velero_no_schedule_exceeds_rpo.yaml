key: azure_velero_no_schedule_exceeds_rpo
name: 'Azure Velero: No Schedule Exceeds the Recovery Point Objective'
type: AUTOMATED
role: configuration
statement: >
  No schedule has gone longer than rpo_hours without a Completed backup (schedules_exceeding_rpo is
  0). Passes while rpo_hours is not set; that case fails 'Recovery Point Objective Is Configured'
  instead. Supports KSI-RPL-ABO. Does not check whether the collection run succeeded.

regex: '"schedules_exceeding_rpo":\s*(?:0|null)\b'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-VELERO-BACKUPS
