key: azure_velero_no_schedule_exceeds_rpo
name: 'Azure Velero: No Schedule Exceeds the Recovery Point Objective'
type: AUTOMATED
role: configuration
source: community
statement: >
  No schedule has gone longer than rpo_hours without a Completed backup (schedules_exceeding_rpo is
  0). Also fails while rpo_hours is not set (see 'Recovery Point Objective Is Configured' for the
  cause), so an undecided or unread value is never reported as a pass. Does not check whether the
  collection run succeeded.

regex: '"schedules_exceeding_rpo":\s*(?<schedules_exceeding_rpo>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # schedules_exceeding_rpo
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-VELERO-BACKUPS
