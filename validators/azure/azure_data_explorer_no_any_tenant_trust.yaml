key: azure_data_explorer_no_any_tenant_trust
name: Azure Data Explorer No Trust Of Any Tenant
type: AUTOMATED
role: configuration
statement: >
  No Data Explorer cluster lists "*" among its trusted external tenants, so users, groups or apps
  from an Entra tenant that has not been approved cannot be granted access. Does NOT assert that the
  tenants it does trust are approved interconnections, or who holds database roles. Zero clusters
  passes vacuously. Supports KSI-CNA-RNT.

regex: '"data_explorer_clusters_trusting_any_tenant":\s*(?<data_explorer_clusters_trusting_any_tenant>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DATA-SERVICES-CONFIG
