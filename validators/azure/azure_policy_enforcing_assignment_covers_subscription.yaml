key: azure_policy_enforcing_assignment_covers_subscription
name: Azure Policy Enforcing Assignment Covers the Subscription
type: AUTOMATED
role: configuration
statement: >
  At least one Azure Policy assignment that actually enforces (an enforcing effect under
  enforcementMode Default) is scoped to the whole subscription, directly or inherited
  from a management group, with no excluded (notScopes) scopes, so enforcement reaches
  every resource group. The assignments part of the KSI-SVC-EIS check that every
  in-scope resource has applicable enforcing Policy coverage. Does NOT prove that each
  resource has an enforcing policy applicable to its type, that every resource was
  evaluated (the resource-inventory coverage validators), or Defender coverage.

# One assignment record, in the fetcher's sorted key order: actually_enforces (first key)
# < excluded_scope_count < scope_kind (last key). The tempered token stops at the next
# record, so an enforcing record cannot splice onto another record's scope.
regex: '"actually_enforces":\s*true,(?:(?!"actually_enforces")[\s\S])*?"excluded_scope_count":\s*0,(?:(?!"actually_enforces")[\s\S])*?"scope_kind":\s*"(?:subscription|management_group)"'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-POLICY-ASSIGN
