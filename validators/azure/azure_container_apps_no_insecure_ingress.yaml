key: azure_container_apps_no_insecure_ingress
name: Azure Container Apps No Plain HTTP Ingress
type: AUTOMATED
role: configuration
statement: >
  No Container App's ingress accepts plain HTTP (allowInsecure is off on every app). Passes with
  zero Container Apps. Does not assert the TLS version, whether ingress is external, or anything
  about Container Instances. Supports KSI-SVC-SIN.

regex: '"container_apps_allow_insecure":\s*(?<container_apps_allow_insecure>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-CONTAINER-WORKLOADS-CONFIG
