key: azure_event_hubs_minimum_tls_1_2
name: Azure Event Hubs Namespaces Minimum TLS 1.2
type: AUTOMATED
role: configuration
statement: >
  No Event Hubs namespace sets a minimum TLS version below 1.2 (1.0 or 1.1). An unset minimum TLS
  version is not counted as below 1.2 by the fetcher. Does not assert FIPS validation of the
  modules, encryption at rest, or TLS on MongoDB or Data Explorer (MongoDB vCore has no setting to
  weaken TLS 1.2). Supports Coverage row 14 (Authorized Cryptographic Modules / KSI-SVC-SIN)
  (proposed mapping, not yet audited).

regex: '"event_hub_namespaces_tls_below_1_2":\s*(?<event_hub_namespaces_tls_below_1_2>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-DATA-SERVICES-CONFIG
