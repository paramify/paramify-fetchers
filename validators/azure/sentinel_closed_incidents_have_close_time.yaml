key: sentinel_closed_incidents_have_close_time
name: Azure Sentinel Closed Incidents Have Close Time
type: AUTOMATED
role: configuration
statement: >
  Every closed incident in scope has a proven close time from the SecurityIncident table. A close
  time that is missing, or no longer retained because SecurityIncident keeps less than the lookback,
  counts against it: an unprovable closure time is not a pass. Supports the closure time for
  KSI-MLA-RVL and the response timestamps for KSI-INR-RIR. Counts violations, so it relies on
  sentinel_incident_closure_counts_present.

regex: '"closed_(?:missing_close_time|close_time_not_retained)":\s*[1-9]'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SENTINEL-INCIDENTS
