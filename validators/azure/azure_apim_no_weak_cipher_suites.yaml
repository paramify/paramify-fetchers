key: azure_apim_no_weak_cipher_suites
name: Azure API Management No Weak Cipher Suites
type: AUTOMATED
role: configuration
statement: >
  No API Management service has a weak cipher suite on (a CBC-mode suite, one without forward
  secrecy, or 3DES); Azure leaves the CBC and RSA key-exchange suites on until they are explicitly
  turned off. Does not assert protocol versions or FIPS validation; zero API Management services
  passes vacuously. Supports KSI-SVC-SIN.

regex: '"services_with_weak_ciphers_enabled":\s*(?<services_with_weak_ciphers_enabled>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-API-MANAGEMENT-CONFIG
