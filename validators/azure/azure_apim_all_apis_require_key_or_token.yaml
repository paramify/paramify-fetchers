key: azure_apim_all_apis_require_key_or_token
name: Azure API Management Every API Stops Keyless Callers
type: AUTOMATED
role: configuration
statement: >
  Every API on every API Management service stops a caller without a subscription key or token (it
  requires a key, has an OAuth 2.0 or OpenID Connect server, or a validate-jwt or
  validate-azure-ad-token policy applies), and no API's access control is unknown. Does not assert
  network restriction of the gateway; zero APIs passes vacuously (nothing to protect yet). API
  Management is a policy enforcement point, so an API it lets through without a key or token is an
  exception to its policy. Supports Coverage row 84 (Policy Enforcement Point Exceptions /
  KSI-CNA-RNT); it shows access control, not network limits (see
  azure_apim_no_public_network_access) (proposed mapping, not yet audited).

regex: '"apis_access_control_unknown":\s*(?<apis_access_control_unknown>\d+)[\s\S]*?"apis_without_access_control":\s*(?<apis_without_access_control>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0; MATCH_GROUP[2] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-API-MANAGEMENT-CONFIG
