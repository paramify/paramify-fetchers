key: entra_auth_methods_cba_trusted_cas_current
name: Entra Certificate Sign-In Trusts Only Current CAs With a CRL
type: AUTOMATED
role: configuration
statement: >-
  With the X.509 certificate method enabled, both trust stores (the classic
  certificate-based authentication configuration and the PKI-based store) were read,
  and no certificate authority they trust is expired, has an unreadable expiry, or
  lacks a certificate revocation list URL. Passes when the X.509 method is disabled,
  since no authority is then trusted for sign-in. Substantiates that certificate-based
  sign-in trusts only current authorities that publish revocation (KSI-IAM-APM).
  Does not check that the revocation list is reachable or current, or that a delta
  list is published, and fails when either store could not be read, since a missing
  optional grant reads null, not zero.

# The CA counts are null unless both stores were read, so an unread store fails.
regex: '"summary":\s*\{(?:(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"x509_certificate_enabled":\s*false)|(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"expired_certificate_authorities":\s*0\s*[,}])(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"certificate_authorities_expiry_unknown":\s*0\s*[,}])(?=(?:"(?:[^"\\]|\\.)*"|[^{}"])*?"certificate_authorities_without_crl":\s*0\s*[,}]))'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-AUTH-METHODS-POLICY
