key: azure_flexible_server_backups_retention_as_required
name: 'Azure PostgreSQL and MySQL Backups: Every Server Keeps Backups for the Required Period'
type: AUTOMATED
role: configuration
source: community
statement: >
  No backup server keeps backups for fewer days than required_retention_days, the minimum authorized
  retention; keeping them longer meets it (servers_retention_below_required is 0). Also fails while
  required_retention_days is not set (see 'Required Retention Is Configured' for the cause), so an
  undecided or unread value is never reported as a pass. Does not check whether the collection run
  succeeded.

regex: '"servers_retention_below_required":\s*(?<servers_retention_below_required>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # servers_retention_below_required
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-FLEXIBLE-SERVER-BACKUPS
