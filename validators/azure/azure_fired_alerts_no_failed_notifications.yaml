key: azure_fired_alerts_no_failed_notifications
name: 'Azure Fired Alerts: No Notification Failed'
type: AUTOMATED
role: configuration
source: community
statement: >
  No alert fired in the window has an action group failure in its history
  (alerts_with_failed_notifications is 0). Fails while any alert's history is unread, since the
  count is then unknown. A window with no fired alerts passes and says nothing about delivery. An
  action group that ran shows the notification was sent, not that a person received or read it.
  Does not check whether the collection run succeeded.

regex: '"alerts_with_failed_notifications":\s*(?<alerts_with_failed_notifications>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # alerts_with_failed_notifications
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-MONITOR-FIRED-ALERTS
