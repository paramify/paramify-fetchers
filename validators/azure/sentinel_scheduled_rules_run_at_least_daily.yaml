key: sentinel_scheduled_rules_run_at_least_daily
name: Azure Sentinel Scheduled Rules Run At Least Daily
type: AUTOMATED
role: configuration
statement: >
  No analytics rule runs less often than once a day: no query_frequency longer than P1D (24 hours),
  compound forms such as PT24H30M or PT23H120M included. Fail-closed: a frequency not written as one
  unit up to 24 hours (P1D, PT24H, PT1440M, PT86400S) or as hours under 24 with minutes and seconds
  under 60 counts as a violation. The approved frequency is assumed to be daily; the organization
  sets the real value. Counts violations, so it relies on sentinel_scheduled_query_rule_enabled to
  prove query_frequency is present.

regex: '"query_frequency":\s*"(?!(?:P1D|PT24H|PT1440M|PT86400S|PT(?:\d{1,3}|1[0-3]\d\d|14[0-3]\d)M|PT(?:\d{1,4}|[1-7]\d{4}|8[0-5]\d{3}|86[0-3]\d\d)(?:\.\d+)?S|PT(?=\d)(?:(?:[01]?\d|2[0-3])H)?(?:[0-5]?\dM)?(?:[0-5]?\d(?:\.\d+)?S)?)")[^"]*"'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-SENTINEL-ANALYTICS-RULES
