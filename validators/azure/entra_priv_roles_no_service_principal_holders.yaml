key: entra_priv_roles_no_service_principal_holders
name: Entra No Service Principal Holds A Privileged Directory Role
type: AUTOMATED
role: configuration
statement: >-
  No service principal (an app's or a managed identity's) actively holds a privileged Entra ID
  directory role (Global Administrator, Privileged Role Administrator, Application Administrator,
  Global Reader and the other admin and tenant-wide reader roles azure_entra_privileged_roles flags),
  every role's members were read, and the roles read include the Global Administrator role, so an
  empty read cannot pass. Substantiates non-user accounts holding only least-privilege directory
  roles (KSI-IAM-SNU). An approved integration that needs one of these roles still fails here and must
  be justified outside this evidence. Does NOT prove Microsoft Graph or other API permissions granted
  to service principals (azure_entra_service_principals), Azure resource roles, that a service
  principal is enabled only when required, a service principal reaching a role through a group, or
  roles scoped to an administrative unit. Custom directory roles and built-in roles outside the
  fetcher's list (results.privileged_role_names_checked) are not counted.

regex: '"partial_failure":\s*false[\s\S]*?"global_administrator_role_activated":\s*true[\s\S]*?"service_principals_in_privileged_roles":\s*(?<service_principals_in_privileged_roles>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # service_principals_in_privileged_roles
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENTRA-PRIV-ROLES
