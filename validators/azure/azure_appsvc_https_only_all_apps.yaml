key: azure_appsvc_https_only_all_apps
name: App Service Web Apps Refuse Plain HTTP
type: AUTOMATED
role: configuration
statement: >
  Every App Service web app in the subscription has HTTPS Only set, so plain HTTP requests are
  redirected rather than served, and there is at least one web app. Supports KSI-SVC-SIN for plain
  HTTP on App Service. It does not assert the TLS floor (azure_appsvc_min_tls_12_all_apps), cipher
  suites, FTP, the SCM site, function apps, or Front Door routes that accept HTTP.

# Rows: https_only_apps equals total_web_apps, which is above 0.
regex: '^\s*\{(?=[\s\S]*?"partial_failure":\s*(?<partial_failure>true|false|null))(?=[\s\S]*?"https_only_apps":\s*(?<https_only_apps>\d+))(?=[\s\S]*?"total_web_apps":\s*(?<total_web_apps>\d+))'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS false; MATCH_GROUP[2] EQUALS MATCH_GROUP[3]; MATCH_GROUP[3] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # partial_failure
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "false" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # https_only_apps
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 3 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # total_web_apps
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPSVC-CONFIG
