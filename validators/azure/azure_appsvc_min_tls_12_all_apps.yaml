key: azure_appsvc_min_tls_12_all_apps
name: App Service Web Apps Enforce TLS 1.2+
type: AUTOMATED
role: configuration
statement: >
  Every App Service web app in the subscription has a minimum inbound TLS version
  of 1.2 or 1.3, and there is at least one web app. Substantiates "customer
  information in transit is encrypted" (KSI-SVC-SIN) for the App Service share of
  the TLS 1.2+ check. It does not assert that plain HTTP is refused (https_only),
  the SCM site's own TLS floor, cipher suites, or certificate validity, and it
  does not cover function apps (a separate evidence set).

# Backreference: matches only when the TLS 1.2+ count equals a non-zero total_web_apps, so it guards itself.
regex: '"minimum_tls_1_2_apps":\s*(?<minimum_tls_1_2_apps>[1-9]\d*),[^{}]*?"total_web_apps":\s*\k<minimum_tls_1_2_apps>(?!\d)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPSVC-CONFIG
