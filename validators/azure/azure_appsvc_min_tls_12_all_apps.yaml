key: azure_appsvc_min_tls_12_all_apps
name: App Service Web Apps Enforce TLS 1.2+
type: AUTOMATED
role: configuration
statement: >
  Every App Service web app in the subscription has a minimum inbound TLS version of 1.2 or 1.3, and
  there is at least one web app. Supports KSI-SVC-SIN for TLS 1.2+ on App Service. It does not
  assert that plain HTTP is refused (https_only), the SCM site's own TLS floor, cipher suites, or
  certificate validity, and it does not cover function apps (a separate evidence set).

# Backreference: matches only when the TLS 1.2+ count equals a non-zero total_web_apps, so it guards itself.
regex: '"minimum_tls_1_2_apps":\s*(?<minimum_tls_1_2_apps>\d+),[^{}]*?"total_web_apps":\s*(?<total_web_apps>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] GREATER_THAN 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # minimum_tls_1_2_apps
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # total_web_apps
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 1 }

evidence_sets:
  - EVD-AZURE-APPSVC-CONFIG
