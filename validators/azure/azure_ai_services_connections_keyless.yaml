key: azure_ai_services_connections_keyless
name: Azure AI Foundry Connections Use Keyless Sign In
type: AUTOMATED
role: configuration
statement: >
  No Foundry or OpenAI account or project connection keeps a stored credential (API key, PAT,
  password, SAS, account key, service principal secret or OAuth2) or sends no credential at all,
  every connection's sign-in type is recognised, and every account's connections were read;
  connections sign in with Microsoft Entra ID or managed identity. Does not assert what the
  connections reach; zero connections passes vacuously. Supports KSI-IAM-SNU.

regex: '"connections_auth_type_unrecognized":\s*(?<connections_auth_type_unrecognized>\d+)[\s\S]*?"connections_unauthenticated":\s*(?<connections_unauthenticated>\d+)[\s\S]*?"connections_unknown_accounts":\s*(?<connections_unknown_accounts>\d+)[\s\S]*?"connections_using_stored_secrets":\s*(?<connections_using_stored_secrets>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1..4] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-AI-SERVICES-CONFIG
