key: azure_appgw_tls_no_plaintext_listeners
name: 'Application Gateway: No Listener Accepts Plaintext'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every listener on an in-scope application gateway uses HTTPS or TLS, or is an HTTP listener that
  only redirects to HTTPS (plaintext_listeners is 0). A TCP listener counts as plaintext even when
  the client's TLS passes through, since the gateway does not terminate it. Fails if the count
  appears other than exactly once. Does not check whether the collection run succeeded.

regex: '"plaintext_listeners":\s*(?<plaintext_listeners>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # plaintext_listeners
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-APPGW-TLS-LISTENERS
