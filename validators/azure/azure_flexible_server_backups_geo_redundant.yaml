key: azure_flexible_server_backups_geo_redundant
name: 'Azure PostgreSQL and MySQL Backups: Every Server Has Geo-Redundant Backup'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every backup server has geo-redundant backup enabled, so Azure keeps a copy of its backups in the
  paired region. Does not show a restore from the paired region was tested. Does not check whether the
  collection run succeeded.

regex: '"backup_servers":\s*(?<backup_servers>[1-9]\d*)[\s\S]*?"servers_geo_redundant_backup":\s*(?<servers_geo_redundant_backup>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS MATCH_GROUP[2]
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # backup_servers
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 2 }            # servers_geo_redundant_backup

evidence_sets:
  - EVD-AZURE-FLEXIBLE-SERVER-BACKUPS
