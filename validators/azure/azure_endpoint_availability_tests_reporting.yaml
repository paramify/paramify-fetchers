key: azure_endpoint_availability_tests_reporting
name: 'Azure Endpoint Availability: Every Test Reported Results'
type: AUTOMATED
role: configuration
source: community
statement: >
  No enabled availability test went the whole lookback without a result
  (availability_tests_without_data is 0). These are inputs to availability reporting; they do not
  replace the availability reporting itself. Does not check whether the collection run succeeded.

regex: '"availability_tests_without_data":\s*(?<availability_tests_without_data>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # availability_tests_without_data
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-ENDPOINT-AVAILABILITY
