key: azure_ai_hub_workspace_logs_exported
name: Azure AI Hub Workspace Diagnostic Logs Exported
type: AUTOMATED
role: configuration
statement: >
  Every AI hub, project and Machine Learning workspace has a diagnostic setting that exports at
  least one log category or category group to a destination, and no workspace's diagnostic settings
  were unreadable. Does not assert which categories are exported, the destination, or retention.
  Supports KSI-MLA-LET.

regex: '"total_workspaces":\s*(?<total_workspaces>\d+)[\s\S]*?"workspaces_diagnostic_logs_exported":\s*(?<workspaces_diagnostic_logs_exported>\d+)[\s\S]*?"workspaces_diagnostic_logs_unknown":\s*(?<workspaces_diagnostic_logs_unknown>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]; MATCH_GROUP[3] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 1 }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-AZURE-AI-HUB-CONFIG
