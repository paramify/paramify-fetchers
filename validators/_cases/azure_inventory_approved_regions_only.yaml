validator: azure_inventory_approved_regions_only
cases:
  - name: us_regions_and_global
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"metadata": {"partial_failure": false}, "summary": {"resources_by_location": {"eastus": 6, "global": 2, "westus2": 2}, "tagged_resources": 10, "total_resources": 10, "untagged_resources": 0}}}'

  - name: us_regions_and_global_pretty
    expect: PASS
    artifact: |
      {
        "metadata": {
          "exit_code": 0,
          "status": "success"
        },
        "payload": {
          "metadata": {
            "partial_failure": false
          },
          "summary": {
            "resources_by_location": {
              "centralus": 1,
              "eastus": 5,
              "global": 3,
              "usgovvirginia": 1
            },
            "tagged_resources": 10,
            "total_resources": 10,
            "untagged_resources": 0
          }
        }
      }

  - name: one_canadian_resource
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"metadata": {"partial_failure": false}, "summary": {"resources_by_location": {"canadaeast": 1, "eastus": 7, "global": 2}, "tagged_resources": 10, "total_resources": 10, "untagged_resources": 0}}}'

  - name: last_key_out_of_region
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"metadata": {"partial_failure": false}, "summary": {"resources_by_location": {"eastus": 7, "global": 2, "westeurope": 1}, "tagged_resources": 10, "total_resources": 10, "untagged_resources": 0}}}'

  - name: location_unknown
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"metadata": {"partial_failure": false}, "summary": {"resources_by_location": {"eastus": 9, "unknown": 1}, "tagged_resources": 10, "total_resources": 10, "untagged_resources": 0}}}'

  - name: empty_inventory
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"metadata": {"partial_failure": false}, "summary": {"resources_by_location": {}, "tagged_resources": 10, "total_resources": 0, "untagged_resources": 0}}}'

  - name: partial_failure
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"metadata": {"partial_failure": true}, "summary": {"resources_by_location": {"eastus": 6, "global": 2, "westus2": 2}, "tagged_resources": 10, "total_resources": 10, "untagged_resources": 0}}}'

  - name: locations_key_renamed
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"metadata": {"partial_failure": false}, "summary": {"locations": {"eastus": 6, "global": 2, "westus2": 2}, "tagged_resources": 10, "total_resources": 10, "untagged_resources": 0}}}'
