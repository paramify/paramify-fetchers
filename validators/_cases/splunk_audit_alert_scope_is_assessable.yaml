validator: splunk_audit_alert_scope_is_assessable
# Every artifact here puts `summary` BEFORE `audit_scope`, as the fetcher emits
# them, and gives the summary the values the sandbox actually produced across
# all 174 of Splunk's own saved searches. That is what makes the fence testable:
# an unfenced pattern reads the summary and answers a question about the vendor's
# alerting instead of the customer's.
cases:
  - name: scope_has_alerts_and_is_assessable
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"any_alert_configured":true,"alerts_enabled":7,"every_configured_alert_is_enabled":false},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alert_apps_named_but_absent":[],"saved_searches_in_scope":9,"alerts_configured":4,"alerts_configured_names":["Privileged Command Executed","Audit Index Stopped Receiving","Failed Logon Burst","Audit Config Changed"],"any_alert_configured":true,"alerts_enabled":4,"every_configured_alert_is_enabled":true,"alerts_with_notification_action":4,"every_enabled_alert_notifies":true,"scope_is_assessable":true}}}'

  # THE vacuity guard, and the reason this validator exists. The scope resolves
  # to apps that contain no alerts at all, so "every configured alert is
  # enabled" and "every enabled alert notifies" are both true of nothing. The
  # non-zero threshold lives in the pattern (`[1-9][0-9]*`), so `0` simply does
  # not match and the MATCH_COUNT rule fails. Note the summary reports 15 alerts
  # on the deployment: unfenced, this artifact would pass.
  - name: scope_contains_no_alerts_at_all
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"any_alert_configured":true,"alerts_enabled":7,"every_configured_alert_is_enabled":false},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alert_apps_named_but_absent":[],"saved_searches_in_scope":3,"alerts_configured":0,"alerts_configured_names":[],"any_alert_configured":false,"alerts_enabled":0,"every_configured_alert_is_enabled":false,"alerts_with_notification_action":0,"every_enabled_alert_notifies":false,"scope_is_assessable":false}}}'

  # Alerts were found, but an app named in SPLUNK_ALERT_APPS is not installed on
  # the deployment — so the population measured is not the population claimed.
  # The count rule passes here; the assessability rule is what fails.
  - name: named_alert_app_absent_from_deployment
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_configured_alert_is_enabled":false},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting","soc_playbooks"],"alert_apps_named_but_absent":["soc_playbooks"],"saved_searches_in_scope":9,"alerts_configured":4,"any_alert_configured":false,"alerts_enabled":4,"every_configured_alert_is_enabled":false,"alerts_with_notification_action":4,"every_enabled_alert_notifies":false,"scope_is_assessable":false}}}'

  # SPLUNK_ALERT_APPS was never set. The fetcher then omits the whole
  # summarize() roll-up from audit_scope, so there is no in-scope alert count to
  # read at all — and the all-deployment summary, which IS populated, must not
  # be allowed to stand in for it.
  - name: alert_scope_never_configured
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"any_alert_configured":true,"alerts_enabled":7,"every_configured_alert_is_enabled":false},"audit_scope":{"alert_apps_configured":false,"alert_apps_named":[],"alert_apps_named_but_absent":[],"saved_searches_in_scope":0,"scope_is_assessable":false}}}'

  # Direction 3: the envelope is intact and the posture reads compliant, but the
  # assessability key has been renamed upstream. It must not pass.
  - name: assessability_key_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_configured_alert_is_enabled":false},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alert_apps_named_but_absent":[],"alerts_configured":4,"alerts_enabled":4,"every_configured_alert_is_enabled":true,"every_enabled_alert_notifies":true,"scope_assessable":true}}}'

  # Direction 3 again, one level up: the count key is renamed, so there is
  # nothing to prove the population was non-empty.
  - name: alert_count_key_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_configured_alert_is_enabled":false},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alert_apps_named_but_absent":[],"alert_count":4,"alerts_enabled":4,"every_configured_alert_is_enabled":true,"every_enabled_alert_notifies":true,"scope_is_assessable":true}}}'

  - name: audit_scope_block_renamed
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_configured_alert_is_enabled":false},"auditScope":{"alert_apps_configured":true,"alerts_configured":4,"every_configured_alert_is_enabled":true,"every_enabled_alert_notifies":true,"scope_is_assessable":true}}}'
