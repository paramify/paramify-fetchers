validator: splunk_log_access_least_privileged
cases:
  - name: no_in_scope_role_holds_wildcard
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_roles":9,"no_role_has_wildcard_index_access":true},"audit_scope":{"audit_indexes_configured":true,"roles_in_scope":["svc_soc_reader"],"roles_with_wildcard_index_access_names":[],"no_role_has_wildcard_index_access":true,"scope_is_assessable":true}}}'
  # The fence is the whole point of this validator's regex. Splunk ships admin,
  # power and splunk-system-role with `*` by design, so the all-roles summary
  # reads false on a perfectly healthy deployment. MATCH_GROUP takes the first
  # match and `summary` is written first, so an unfenced pattern would read that
  # false and fail here.
  - name: summary_false_but_audit_scope_true
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_roles":9,"roles_with_wildcard_index_access_names":["admin","power","splunk-system-role"],"no_role_has_wildcard_index_access":false},"audit_scope":{"audit_indexes_configured":true,"roles_exempted":["admin","power","splunk-system-role"],"roles_in_scope":["svc_soc_reader"],"roles_with_wildcard_index_access_names":[],"no_role_has_wildcard_index_access":true,"scope_is_assessable":true}}}'
  - name: in_scope_role_holds_wildcard
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_roles":9,"no_role_has_wildcard_index_access":true},"audit_scope":{"audit_indexes_configured":true,"roles_in_scope":["user"],"roles_with_wildcard_index_access_names":["user"],"no_role_has_wildcard_index_access":false,"scope_is_assessable":true}}}'
  # Anti-vacuity. The fetcher currently AND-s scope_is_assessable into the
  # verdict itself, so this combination cannot arise from today's fetcher — the
  # case is here so that removing that AND upstream turns this red rather than
  # silently reopening the green-wash path (exempt every role, assess nothing,
  # read as compliant).
  - name: scope_assessed_nothing
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_roles":9,"no_role_has_wildcard_index_access":false},"audit_scope":{"audit_indexes_configured":true,"non_exempt_roles_evaluated":0,"roles_in_scope":[],"no_role_has_wildcard_index_access":true,"scope_is_assessable":false}}}'
  - name: verdict_key_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_roles":9,"no_role_has_wildcard_index_access":true},"audit_scope":{"audit_indexes_configured":true,"roles_in_scope":["svc_soc_reader"],"no_wildcard":true,"scope_is_assessable":true}}}'
  - name: assessability_guard_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_roles":9,"no_role_has_wildcard_index_access":true},"audit_scope":{"audit_indexes_configured":true,"roles_in_scope":["svc_soc_reader"],"no_role_has_wildcard_index_access":true,"assessable":true}}}'
  - name: audit_scope_block_renamed
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_roles":9,"no_role_has_wildcard_index_access":true},"auditScope":{"audit_indexes_configured":true,"no_role_has_wildcard_index_access":true,"scope_is_assessable":true}}}'
