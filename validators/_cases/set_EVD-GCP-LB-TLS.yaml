# Set-level: every validator naming EVD-GCP-LB-TLS, combined the way Paramify
# combines them (ERROR > FAIL > PASS). This is where the integrity partners earn
# their place — a count-based validator cannot cover its own drift, so only the
# set can. Each of the three rename cases below is built so that the ONLY thing
# failing is one integrity validator: delete that validator and the case goes
# green while the evidence proves nothing.
#
# All artifacts are synthetic. Proxy, policy and certificate names are invented.
evidence_set: EVD-GCP-LB-TLS
cases:
  - name: fully_hardened
    expect: PASS
    note: >
      Both front ends pinned to a project-owned policy, every policy at TLS 1.2 or
      better on a non-permissive profile. The summary decoys ride along:
      `default_min_tls_version_when_no_policy` says TLS_1_0 on every run whatever
      the posture, and must never be mistaken for a finding.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[{"name":"front-a","type":"target_https_proxy","ssl_policy":"policy-strict","uses_default_ssl_policy":false,"ssl_policy_resolved":true,"effective_min_tls_version":"TLS_1_2","effective_profile":"MODERN","meets_tls_floor":true},{"name":"front-b","type":"target_ssl_proxy","ssl_policy":"policy-strictest","uses_default_ssl_policy":false,"ssl_policy_resolved":true,"effective_min_tls_version":"TLS_1_3","effective_profile":"RESTRICTED","meets_tls_floor":true}],"ssl_policies":[{"name":"policy-strict","min_tls_version":"TLS_1_2","profile":"MODERN","permissive_profile":false},{"name":"policy-strictest","min_tls_version":"TLS_1_3","profile":"RESTRICTED","permissive_profile":false}]},"summary":{"compute_api_readable":true,"tls_floor":"TLS_1_2","default_min_tls_version_when_no_policy":"TLS_1_0","ssl_policy_min_tls_versions":["TLS_1_2","TLS_1_3"],"ssl_policy_profiles":["MODERN","RESTRICTED"],"total_proxies":2,"proxies_with_ssl_policy":2,"proxies_on_default_ssl_policy":0,"proxies_meeting_tls_floor":2,"tls_floor_percentage":100,"proxies_with_weak_tls":0,"total_ssl_policies":2,"weak_ssl_policies":0,"permissive_profile_ssl_policies":0}}}'

  - name: proxy_inherits_the_gcp_default_and_a_weak_policy_sits_unattached
    expect: FAIL
    note: >
      The shape of the real posture collected when these were authored. Two
      distinct failures the set catches separately: one front end has no SSL
      policy and therefore negotiates GCP's default TLS 1.0 even though no policy
      in the project says TLS 1.0, and a second policy is defined at TLS 1.0 on the
      COMPATIBLE profile while attached to nothing. Four configuration validators
      go red; all three integrity partners stay green, which is what says the
      failure is posture and not drift.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[{"name":"front-a","type":"target_https_proxy","ssl_policy":"policy-strict","uses_default_ssl_policy":false,"ssl_policy_resolved":true,"effective_min_tls_version":"TLS_1_2","effective_profile":"MODERN","meets_tls_floor":true},{"name":"front-b","type":"target_https_proxy","ssl_policy":null,"uses_default_ssl_policy":true,"ssl_policy_resolved":true,"effective_min_tls_version":"TLS_1_0","effective_profile":"COMPATIBLE","meets_tls_floor":false}],"ssl_policies":[{"name":"policy-strict","min_tls_version":"TLS_1_2","profile":"MODERN","permissive_profile":false},{"name":"policy-legacy","min_tls_version":"TLS_1_0","profile":"COMPATIBLE","permissive_profile":true}]},"summary":{"compute_api_readable":true,"tls_floor":"TLS_1_2","default_min_tls_version_when_no_policy":"TLS_1_0","ssl_policy_min_tls_versions":["TLS_1_0","TLS_1_2"],"ssl_policy_profiles":["COMPATIBLE","MODERN"],"total_proxies":2,"proxies_with_ssl_policy":1,"proxies_on_default_ssl_policy":1,"proxies_meeting_tls_floor":1,"tls_floor_percentage":50,"proxies_with_weak_tls":1,"total_ssl_policies":2,"weak_ssl_policies":1,"permissive_profile_ssl_policies":1}}}'

  - name: proxy_effective_version_key_renamed_upstream
    expect: FAIL
    note: >
      Everything readable says compliant and one front end is quietly on TLS 1.0.
      gcp_lbtls_no_proxy_below_tls_floor counts zero violations and reports PASS,
      because zero matches is its pass condition.
      gcp_lbtls_proxy_effective_tls_version_present is the only validator that
      fails. Delete it and this case goes green over hidden TLS 1.0.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[{"name":"front-a","ssl_policy":"policy-strict","uses_default_ssl_policy":false,"negotiated_min_tls_version":"TLS_1_0","effective_profile":"COMPATIBLE"}],"ssl_policies":[{"name":"policy-strict","min_tls_version":"TLS_1_2","profile":"MODERN","permissive_profile":false}]},"summary":{"compute_api_readable":true,"tls_floor":"TLS_1_2","default_min_tls_version_when_no_policy":"TLS_1_0","total_proxies":1,"proxies_on_default_ssl_policy":0,"total_ssl_policies":1,"weak_ssl_policies":0,"permissive_profile_ssl_policies":0}}}'

  - name: ssl_policy_minimum_key_renamed_upstream
    expect: FAIL
    note: >
      Same trap one array over. A TLS 1.0 policy is present under a renamed key, so
      gcp_lbtls_no_weak_ssl_policy_minimums counts zero and passes. Only
      gcp_lbtls_ssl_policy_minimum_version_present fails. The proxy records are
      untouched and still carry `effective_min_tls_version`, which proves the
      policy-side guard is not being satisfied by the proxy-side field.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[{"name":"front-a","ssl_policy":"policy-legacy","uses_default_ssl_policy":false,"effective_min_tls_version":"TLS_1_2","effective_profile":"MODERN"}],"ssl_policies":[{"name":"policy-legacy","minimum_tls_version":"TLS_1_0","profile":"MODERN","permissive_profile":false}]},"summary":{"compute_api_readable":true,"tls_floor":"TLS_1_2","default_min_tls_version_when_no_policy":"TLS_1_0","total_proxies":1,"proxies_on_default_ssl_policy":0,"total_ssl_policies":1,"permissive_profile_ssl_policies":0}}}'

  - name: default_ssl_policy_flag_renamed_upstream
    expect: FAIL
    note: >
      Deliberately the version of this that stays realistic. Suppose GCP raised its
      unmanaged default to TLS 1.2 — an unpinned front end would then meet the
      floor and the only signal that its posture is not the project's to control is
      the flag itself. Renamed, gcp_lbtls_no_proxy_on_default_ssl_policy counts zero
      and passes; gcp_lbtls_default_ssl_policy_flag_present is the only failure.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[{"name":"front-b","ssl_policy":null,"on_default_ssl_policy":true,"effective_min_tls_version":"TLS_1_2","effective_profile":"MODERN"}],"ssl_policies":[{"name":"policy-strict","min_tls_version":"TLS_1_2","profile":"MODERN","permissive_profile":false}]},"summary":{"compute_api_readable":true,"tls_floor":"TLS_1_2","default_min_tls_version_when_no_policy":"TLS_1_0","total_proxies":1,"total_ssl_policies":1,"weak_ssl_policies":0,"permissive_profile_ssl_policies":0}}}'

  - name: collection_failed
    expect: FAIL
    note: >
      ERROR is the semantically right verdict — credentials expired, so the posture
      is unknown rather than bad — but the API discards disposition, so FAIL is the
      best reachable answer today. What matters is that it does not PASS.
    artifact: '{"metadata":{"exit_code":1,"status":"failed","error":"could not obtain application default credentials"},"payload":{}}'
