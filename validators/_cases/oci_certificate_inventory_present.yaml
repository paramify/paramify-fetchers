validator: oci_certificate_inventory_present
cases:
  - name: certificates_collected
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"total_certificates": 4}}'

  - name: none_collected
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"total_certificates": 0}}'

  - name: summary_key_renamed
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"certificate_count": 4}}'
