validator: gcp_secret_no_overdue_rotation
cases:
  - name: no_schedule_has_lapsed
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"secrets_with_rotation":1,"secrets_with_overdue_rotation":0}}}'

  - name: one_schedule_overdue
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"secrets_with_rotation":2,"secrets_with_overdue_rotation":1}}}'

  - name: rollup_renamed
    expect: FAIL
    note: the presence rule catches this; without it the threshold rule would read nothing and pass vacuously
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"secrets_with_rotation":2,"overdue_rotations":1}}}'
