validator: oci_password_policies_meet_cis
cases:
  - name: oci_password_policies_meet_cis_passes
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"all_policies_meet_cis": true}}'

  - name: oci_password_policies_meet_cis_fails
    expect: FAIL
    note: >
      Either a policy misses a threshold or nothing was evaluated; the evidence's
      policies_below_* lists say which.
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"all_policies_meet_cis": false}}'

  - name: summary_key_renamed
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"all-policies-meet-cis": true}}'
