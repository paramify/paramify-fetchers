validator: gcp_lbtls_default_ssl_policy_flag_present
cases:
  - name: flags_present
    expect: PASS
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[{"name":"front-a","uses_default_ssl_policy":false,"effective_min_tls_version":"TLS_1_2"}]},"summary":{"total_proxies":1}}}'

  - name: flag_key_renamed
    expect: FAIL
    note: this is the failure that covers gcp_lbtls_no_proxy_on_default_ssl_policy
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[{"name":"front-b","on_default_ssl_policy":true,"effective_min_tls_version":"TLS_1_2"}]},"summary":{"total_proxies":1}}}'

  - name: summary_rollup_alone_does_not_satisfy_it
    expect: FAIL
    note: >
      `proxies_on_default_ssl_policy` is present but the per-proxy flag is not, so
      there is nothing to count. The anchor must not slacken into matching the
      rollup key.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"proxies":[]},"summary":{"total_proxies":0,"proxies_with_ssl_policy":0,"proxies_on_default_ssl_policy":0}}}'

  - name: payload_emptied
    expect: FAIL
    artifact: '{"metadata":{"exit_code":1,"status":"failed"},"payload":{}}'
