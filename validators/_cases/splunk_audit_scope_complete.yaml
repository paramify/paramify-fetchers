validator: splunk_audit_scope_complete
cases:
  - name: scope_configured_and_all_present
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"audit_scope":{"configured":true,"indexes_named":["_audit","audit_prod"],"indexes_named_but_absent":[],"searchable_retention_days_required":90,"all_indexes_meet_requirement":true}}}'
  # An empty scope satisfies "every index in scope meets the floor" vacuously.
  - name: scope_never_configured
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"audit_scope":{"configured":false,"indexes_named":[],"indexes_named_but_absent":[]}}}'
  # So does a scope naming indexes that do not exist.
  - name: named_index_absent_from_deployment
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"audit_scope":{"configured":true,"indexes_named":["_audit","audit_prod"],"indexes_named_but_absent":["audit_prod"],"searchable_retention_days_required":90,"all_indexes_meet_requirement":true}}}'
  - name: absence_key_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"audit_scope":{"configured":true,"indexes_named":["_audit"],"missing":[],"searchable_retention_days_required":90,"all_indexes_meet_requirement":true}}}'
