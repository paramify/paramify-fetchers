validator: gcp_secret_public_access_flags_present
cases:
  - name: flags_present
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","publicly_accessible":false}]}}}'

  - name: flags_renamed
    expect: FAIL
    note: this is the failure that covers gcp_secret_no_publicly_accessible_secrets
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","is_publicly_accessible":true}]}}}'

  - name: flag_reshaped_to_null
    expect: FAIL
    note: a nulled or re-objected value silences the violation counter just as a rename does
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","publicly_accessible":null}]}}}'

  - name: no_secrets_in_project
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[]},"summary":{"total_secrets":0}}}'
