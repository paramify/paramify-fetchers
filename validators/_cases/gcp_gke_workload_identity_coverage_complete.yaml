# Synthetic artifacts only — invented cluster names, no project or tenant data.
validator: gcp_gke_workload_identity_coverage_complete
cases:
  - name: every_cluster_uses_workload_identity
    expect: PASS
    note: the posture collected from the live project these validators were authored against.
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_clusters":2,"workload_identity_clusters":2,"workload_identity_percentage":100}}}'

  - name: half_the_clusters_use_node_credentials
    expect: FAIL
    note: >
      50 is not 100, and the threshold is written as EQUALS on the literal rather
      than a comparison operator — the criteria are not documented as numeric,
      and "50" > "100" holds lexicographically.
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_clusters":2,"workload_identity_clusters":1,"workload_identity_percentage":50}}}'

  - name: no_cluster_uses_workload_identity
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_clusters":2,"workload_identity_clusters":0,"workload_identity_percentage":0}}}'

  - name: rollup_renamed_upstream
    expect: FAIL
    note: >
      The unreadable direction. The read-a-value form covers this on its own: the
      MATCH_COUNT presence rule finds nothing and fails, so no integrity partner
      is needed. Without that rule the MATCH_GROUP comparison would compare
      nothing to nothing and pass vacuously.
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_clusters":2,"workload_identity_clusters":2,"wi_percentage":100}}}'
