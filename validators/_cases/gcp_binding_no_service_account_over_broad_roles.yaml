# Synthetic artifacts only. Invented principals on example.com; nothing here
# comes from a real project.
validator: gcp_binding_no_service_account_over_broad_roles
cases:
  - name: only_a_human_holds_the_primitive_role
    expect: PASS
    note: >
      The line this validator deliberately draws. roles/owner is held, and the
      binding is flagged over_broad_role and primitive_role — but the holder is
      a person, and a project needs an owner. Only a SERVICE ACCOUNT holding
      such a role is asserted against, so this artifact passes.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"bindings":[{"role":"roles/owner","members":["user:ada@example.com"],"over_broad_role":true,"primitive_role":true,"service_account_granted_over_broad_role":false},{"role":"roles/logging.logWriter","members":["serviceAccount:app-runner@example-project.iam.gserviceaccount.com"],"over_broad_role":false,"primitive_role":false,"service_account_granted_over_broad_role":false}]},"summary":{"total_bindings":2,"service_account_bindings_with_over_broad_roles":0}}}'

  - name: a_service_account_holds_editor
    expect: FAIL
    note: >
      The live posture the set was authored against, in miniature: a service
      account carrying roles/editor on the whole project. A non-human identity
      with project-wide write is a standing escalation path.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"bindings":[{"role":"roles/owner","members":["user:ada@example.com"],"over_broad_role":true,"primitive_role":true,"service_account_granted_over_broad_role":false},{"role":"roles/editor","members":["serviceAccount:build-agent@example-project.iam.gserviceaccount.com"],"over_broad_role":true,"primitive_role":true,"service_account_granted_over_broad_role":true}]},"summary":{"total_bindings":2,"service_account_bindings_with_over_broad_roles":1}}}'

  - name: flag_renamed_upstream
    expect: PASS
    note: >
      Direction 3, expecting PASS for the reason every violation counter does:
      no key, no matches, no violations — even though the artifact still shows a
      service account on roles/editor. Covered at the set level by
      gcp_binding_service_account_role_flags_present.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"bindings":[{"role":"roles/editor","members":["serviceAccount:build-agent@example-project.iam.gserviceaccount.com"],"over_broad_role":true,"primitive_role":true,"sa_over_broad":true}]},"summary":{"total_bindings":1,"service_account_bindings_with_over_broad_roles":0}}}'
