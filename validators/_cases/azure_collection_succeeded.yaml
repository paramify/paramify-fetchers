validator: azure_collection_succeeded
cases:
  - name: run_succeeded
    expect: PASS
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{}}}'

  - name: run_failed
    expect: FAIL
    note: an expired token or a partial read; compliance is unknown, not fine
    artifact: '{"metadata":{"exit_code":1,"status":"failed","error":"AuthorizationFailed"},"payload":{"metadata":{"partial_failure":true}}}'

  - name: envelope_restructured
    expect: FAIL
    note: the exit_code anchor is gone; without the MATCH_COUNT rule this would read as healthy
    artifact: '{"metadata":{"exitCode":0,"status":"success"},"payload":{"results":{}}}'
