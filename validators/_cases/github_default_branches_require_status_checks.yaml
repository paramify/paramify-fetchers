validator: github_default_branches_require_status_checks
cases:
- name: compliant
  expect: PASS
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"without_status_checks":[]}}}'
- name: listed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"without_status_checks":["example-repo"]}}}'
- name: unread
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"without_status_checks":null}}}'
- name: renamed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"without_status_checks_renamed":[]}}}'
