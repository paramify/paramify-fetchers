validator: gcp_secret_rotation_flags_present
cases:
  - name: flags_present
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","rotation_configured":true,"rotation_overdue":false}]}}}'

  - name: flags_renamed
    expect: FAIL
    note: this is the failure that keeps a zero overdue-rotation rollup honest
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","rotation_configured":true,"overdue":false}]}}}'

  - name: no_secrets_in_project
    expect: FAIL
    note: >
      A zero overdue-rotation rollup is also what an empty population produces.
      This is the validator that separates the two.
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[]},"summary":{"secrets_with_overdue_rotation":0}}}'
