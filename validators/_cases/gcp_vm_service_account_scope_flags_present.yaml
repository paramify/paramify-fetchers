# Cases for gcp_vm_service_account_scope_flags_present, the integrity partner to
# gcp_vm_no_default_sa_with_full_api_access. Artifacts are synthetic.
validator: gcp_vm_service_account_scope_flags_present
cases:
  - name: service_account_flags_present
    expect: PASS
    note: >
      Direction 1. Every attached service account carries both flags in the
      same record, so the partner validator's zero count means posture rather
      than an unreadable payload.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"instances":[{"can_ip_forward":false,"gke_managed":true,"integrity_monitoring":true,"name":"vm-node-a","os_login_enabled":true,"service_accounts":[{"default_compute_service_account":true,"email":"node-pool@example.invalid","full_api_access":false,"scopes":["https://www.googleapis.com/auth/devstorage.read_only"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"},{"can_ip_forward":false,"gke_managed":false,"integrity_monitoring":true,"name":"vm-app-b","os_login_enabled":true,"service_accounts":[{"default_compute_service_account":false,"email":"app-runtime@example.invalid","full_api_access":true,"scopes":["https://www.googleapis.com/auth/cloud-platform"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"},{"can_ip_forward":false,"gke_managed":false,"integrity_monitoring":true,"name":"vm-app-c","os_login_enabled":true,"service_accounts":[{"default_compute_service_account":false,"email":"vm-app-c-runtime@example.invalid","full_api_access":false,"scopes":["https://www.googleapis.com/auth/devstorage.read_only"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"}]},"summary":{"default_service_account_full_api_access_instances":0,"ip_forwarding_instances":0,"os_login_percentage":100,"shielded_vm_percentage":100,"total_instances":3}}}'

  - name: service_account_flags_renamed_upstream
    expect: FAIL
    note: >
      Direction 3 for the pair, and the whole reason this validator exists.
      Both flags are renamed with the envelope intact and three instances
      still reported. gcp_vm_no_default_sa_with_full_api_access passes on this
      artifact; this one fails, so the evidence set fails. Delete this file
      and the drift goes green.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"instances":[{"can_ip_forward":false,"gke_managed":true,"integrity_monitoring":true,"name":"vm-node-a","os_login_enabled":true,"service_accounts":[{"is_default_sa":true,"email":"node-pool@example.invalid","has_cloud_platform_scope":false,"scopes":["https://www.googleapis.com/auth/devstorage.read_only"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"},{"can_ip_forward":false,"gke_managed":false,"integrity_monitoring":true,"name":"vm-app-b","os_login_enabled":true,"service_accounts":[{"is_default_sa":false,"email":"app-runtime@example.invalid","has_cloud_platform_scope":true,"scopes":["https://www.googleapis.com/auth/cloud-platform"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"},{"can_ip_forward":false,"gke_managed":false,"integrity_monitoring":true,"name":"vm-app-c","os_login_enabled":true,"service_accounts":[{"is_default_sa":false,"email":"vm-app-c-runtime@example.invalid","has_cloud_platform_scope":false,"scopes":["https://www.googleapis.com/auth/devstorage.read_only"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"}]},"summary":{"default_service_account_full_api_access_instances":0,"ip_forwarding_instances":0,"os_login_percentage":100,"shielded_vm_percentage":100,"total_instances":3}}}'

  - name: service_account_record_key_order_reversed
    expect: FAIL
    note: >
      Direction 2. The evidence is written with sorted keys, so
      default_compute_service_account precedes full_api_access inside a
      service-account record and both this validator and its partner depend on
      that ordering. If the ordering ever changed, the partner would silently
      stop counting violations — this validator fails at the same moment and
      turns a silent false pass into a loud one.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"instances":[{"can_ip_forward":false,"gke_managed":true,"integrity_monitoring":true,"name":"vm-node-a","os_login_enabled":true,"service_accounts":[{"full_api_access":false,"email":"node-pool@example.invalid","default_compute_service_account":true,"scopes":["https://www.googleapis.com/auth/devstorage.read_only"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"},{"can_ip_forward":false,"gke_managed":false,"integrity_monitoring":true,"name":"vm-app-b","os_login_enabled":true,"service_accounts":[{"full_api_access":true,"email":"app-runtime@example.invalid","default_compute_service_account":false,"scopes":["https://www.googleapis.com/auth/cloud-platform"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"},{"can_ip_forward":false,"gke_managed":false,"integrity_monitoring":true,"name":"vm-app-c","os_login_enabled":true,"service_accounts":[{"full_api_access":false,"email":"vm-app-c-runtime@example.invalid","default_compute_service_account":false,"scopes":["https://www.googleapis.com/auth/devstorage.read_only"]}],"shielded_vm_enabled":true,"vtpm":true,"zone":"us-central1-a"}]},"summary":{"default_service_account_full_api_access_instances":0,"ip_forwarding_instances":0,"os_login_percentage":100,"shielded_vm_percentage":100,"total_instances":3}}}'

  - name: project_holds_no_instances
    expect: PASS
    note: >
      A project with no Compute instances has no service-account records to
      read. The total_instances branch keeps that vacuous case from reading as
      drift.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"instances":[]},"summary":{"default_service_account_full_api_access_instances":0,"ip_forwarding_instances":0,"os_login_percentage":0,"shielded_vm_percentage":0,"total_instances":0}}}'
