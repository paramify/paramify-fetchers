validator: azure_redis_geo_replication_field_present
cases:
  - name: field_present
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: every_list_empty
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":null,"geo_replication_linked_databases":[]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: field_renamed
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geoReplicationLinkedDatabases":["db-a","db-b"],"geo_replication_group":"grp1"}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: no_databases
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[]},"summary":{"total_clusters":0}}}'

  - name: one_id_is_enough
    expect: PASS
    note: 'Integrity only: a single id is a violation for azure_redis_all_databases_geo_replicated, not here.'
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a"]},{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":[]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'
