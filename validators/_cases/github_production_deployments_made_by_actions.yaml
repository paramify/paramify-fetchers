validator: github_production_deployments_made_by_actions
cases:
- name: compliant
  expect: PASS
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"production_deployments_not_by_actions":[]}}}'
- name: listed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"production_deployments_not_by_actions":["example-repo"]}}}'
- name: unread
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"production_deployments_not_by_actions":null}}}'
- name: renamed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"production_deployments_not_by_actions_renamed":[]}}}'
