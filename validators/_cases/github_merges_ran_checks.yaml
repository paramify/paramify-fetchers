validator: github_merges_ran_checks
cases:
- name: compliant
  expect: PASS
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"merged_without_checks":0}}}'
- name: nonzero
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"merged_without_checks":2}}}'
- name: unread
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"merged_without_checks":null}}}'
- name: renamed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"merged_without_checks_renamed":0}}}'
