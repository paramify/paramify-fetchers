# Synthetic artifacts only — invented cluster names, no project or tenant data.
validator: gcp_gke_shielded_nodes_flag_recorded
cases:
  - name: flags_present
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"clusters":[{"name":"cluster-alpha","shielded_nodes_enabled":true}]}}}'

  - name: flags_present_and_non_compliant
    expect: PASS
    note: readability, not posture — a cluster with shielded nodes off still reads fine.
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"clusters":[{"name":"cluster-alpha","shielded_nodes_enabled":false}]}}}'

  - name: flags_renamed
    expect: FAIL
    note: this is the failure that covers gcp_gke_shielded_nodes_enabled.
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"clusters":[{"name":"cluster-alpha","shielded_node_vms":false}]}}}'

  - name: payload_emptied
    expect: FAIL
    artifact: '{"metadata":{"exit_code":1},"payload":{}}'
