validator: oci_cloud_guard_enabled
cases:
  - name: oci_cloud_guard_enabled_passes
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"cloud_guard_enabled": true}}'

  - name: oci_cloud_guard_enabled_fails
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"cloud_guard_enabled": false}}'

  - name: summary_key_renamed
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"cloud-guard-enabled": true}}'
