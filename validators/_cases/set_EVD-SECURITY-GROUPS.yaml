# Set-level: every validator naming EVD-SECURITY-GROUPS, combined the way
# Paramify combines them (ERROR > FAIL > PASS). This is the assertion that
# matters — a count-based validator cannot cover its own drift, so only the set
# can.
evidence_set: EVD-SECURITY-GROUPS
cases:

  - name: only_https_open_to_internet
    expect: PASS
    note: >
      The compliant shape the "Policy Enforcement Points: Amazon Security Groups"
      capability describes. Both validators hold: no open non-443 inbound rule, and
      the rule fields were readable.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":[{"GroupId":"sg-aaa","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":443,"ToPort":443,"CIDRs":"0.0.0.0/0","IPv6CIDRs":""}]},{"GroupId":"sg-bbb","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":5432,"ToPort":5432,"CIDRs":"10.0.0.0/8","IPv6CIDRs":""}]}]}}'

  - name: ssh_open_to_the_world
    expect: FAIL
    note: >
      the real posture collected from the demo account when these were authored
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":[{"GroupId":"sg-aaa","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":443,"ToPort":443,"CIDRs":"10.0.0.0/8","IPv6CIDRs":""}]},{"GroupId":"sg-ccc","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":22,"ToPort":22,"CIDRs":"0.0.0.0/0","IPv6CIDRs":""}]}]}}'

  - name: all_traffic_open_to_the_world
    expect: FAIL
    note: >
      The worst inbound rule, and the one evidence from before aws_security_groups
      0.3.0 could not show.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":[{"GroupId":"sg-aaa","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":443,"ToPort":443,"CIDRs":"10.0.0.0/8","IPv6CIDRs":""}]},{"GroupId":"sg-iii","Rules":[{"Direction":"INBOUND RULES","Protocol":"-1","FromPort":null,"ToPort":null,"CIDRs":"0.0.0.0/0","IPv6CIDRs":""}]}]}}'

  - name: ssh_open_to_ipv6_internet
    expect: FAIL
    note: open only over IPv6; invisible before aws_security_groups 0.3.0
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":[{"GroupId":"sg-aaa","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":443,"ToPort":443,"CIDRs":"10.0.0.0/8","IPv6CIDRs":""}]},{"GroupId":"sg-jjj","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":22,"ToPort":22,"CIDRs":"","IPv6CIDRs":"::/0"}]}]}}'

  - name: rule_shape_renamed_upstream
    expect: FAIL
    note: >
      The case the whole integrity role exists for. sg_no_open_inbound_except_https
      counts inbound rules open to the internet and finds none, so ALONE it reports
      PASS on an artifact that hides SSH open to the world.
      sg_inbound_rule_fields_present fails because the key run it proves is gone,
      and the set therefore fails. Delete the integrity validator and this case goes
      green while the evidence proves nothing — exactly the silent false pass.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":[{"GroupId":"sg-aaa","Rules":[{"Dir":"INBOUND RULES","Protocol":"tcp","FromPort":443,"ToPort":443,"CIDRs":"10.0.0.0/8","IPv6CIDRs":""}]},{"GroupId":"sg-ccc","Rules":[{"Dir":"INBOUND RULES","Protocol":"tcp","FromPort":22,"ToPort":22,"CIDRs":"0.0.0.0/0","IPv6CIDRs":""}]}]}}'

  - name: evidence_from_before_0_3_0
    expect: FAIL
    note: >
      Old evidence with a clean-looking posture. It lacks IPv6CIDRs and could not
      show all-traffic rules, so the set must not report it as compliant.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":[{"GroupId":"sg-aaa","Rules":[{"Direction":"INBOUND RULES","Protocol":"tcp","FromPort":443,"ToPort":443,"CIDRs":"0.0.0.0/0"}]}]}}'

  - name: collection_failed
    expect: FAIL
    note: >
      ERROR is the semantically right verdict, but the API discards disposition, so
      FAIL is the best reachable answer today. What matters is that it does not
      PASS. Here it is the integrity validator carrying that weight, because this
      set has no completeness validator.
    artifact: '{"metadata":{"exit_code":1,"status":"failed","error":"ExpiredToken"},"payload":{"results":[]}}'
