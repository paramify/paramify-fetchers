validator: github_workflow_files_all_parsed
cases:
- name: compliant
  expect: PASS
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"workflow_files_unparsed":[]}}}'
- name: listed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"workflow_files_unparsed":["example-repo"]}}}'
- name: unread
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"workflow_files_unparsed":null}}}'
- name: renamed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"workflow_files_unparsed_renamed":[]}}}'
