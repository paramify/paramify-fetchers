# Set-level: every validator naming EVD-GCP-VPC-CONFIG, combined the way
# Paramify combines them (ERROR > FAIL > PASS). This is the assertion that
# matters — a count-based validator cannot cover its own drift, so only the set
# can. Synthetic artifacts only: invented network and subnet names, no real
# project, region or CIDR data.
evidence_set: EVD-GCP-VPC-CONFIG
cases:
  - name: hardened_project
    expect: PASS
    note: >
      The target posture: the default network deleted, one purpose-built
      custom-mode network, and flow logs on every subnet. Two subnets stand in
      for a real project's list — the assertions are per-item counts, so the
      length does not change the verdict.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"networks":[{"name":"net-alpha","legacy":false,"is_default_network":false,"subnet_count":2}],"subnets":[{"name":"subnet-one","network":"net-alpha","flow_logs_enabled":true,"flow_log_sampling":1.0},{"name":"subnet-two","network":"net-alpha","flow_logs_enabled":true,"flow_log_sampling":0.5}]},"summary":{"total_networks":1,"legacy_networks":0,"default_network_present":false,"networks_without_subnets":[],"total_subnets":2,"subnets_with_flow_logs":2,"flow_log_percentage":100}}}'

  - name: default_network_present_and_subnets_unlogged
    expect: FAIL
    note: >
      The shape of the posture collected when these validators were authored.
      Two validators fail together and for one underlying reason: the auto-mode
      `default` network exists, and it auto-creates a subnet per region with
      flow logs off. gcp_vpc_default_network_absent names the cause,
      gcp_vpc_all_subnets_have_flow_logs names the consequence.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"networks":[{"name":"default","legacy":false,"is_default_network":true,"subnet_count":2},{"name":"net-alpha","legacy":false,"is_default_network":false,"subnet_count":1}],"subnets":[{"name":"subnet-one","network":"net-alpha","flow_logs_enabled":true,"flow_log_sampling":0.5},{"name":"default","network":"default","flow_logs_enabled":false,"flow_log_sampling":null},{"name":"default","network":"default","flow_logs_enabled":false,"flow_log_sampling":null}]},"summary":{"total_networks":2,"legacy_networks":0,"default_network_present":true,"networks_without_subnets":[],"total_subnets":3,"subnets_with_flow_logs":1,"flow_log_percentage":33}}}'

  - name: subnet_flow_log_flags_renamed_upstream
    expect: FAIL
    note: >
      The case gcp_vpc_subnet_flow_log_flags_present exists for. Two of the
      three subnets are unlogged, but the per-subnet key is renamed, so
      gcp_vpc_all_subnets_have_flow_logs counts zero violations and ALONE
      reports PASS. Everything else here is deliberately compliant, so the
      integrity partner is the only thing that can fail — delete it and this
      case goes green while the evidence proves nothing, which is exactly the
      silent false pass.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"networks":[{"name":"net-alpha","legacy":false,"is_default_network":false,"subnet_count":3}],"subnets":[{"name":"subnet-one","network":"net-alpha","logging_enabled":true},{"name":"subnet-two","network":"net-alpha","logging_enabled":false},{"name":"subnet-three","network":"net-alpha","logging_enabled":false}]},"summary":{"total_networks":1,"legacy_networks":0,"default_network_present":false,"networks_without_subnets":[],"total_subnets":3,"subnets_with_flow_logs":1,"flow_log_percentage":33}}}'

  - name: network_legacy_flags_renamed_upstream
    expect: FAIL
    note: >
      The same trap on the other pair. A legacy network is present but the
      per-network key is renamed, so gcp_vpc_no_legacy_networks counts zero and
      ALONE reports PASS; gcp_vpc_network_legacy_flags_present is the only
      failure. Flow logs and the default-network rollup are kept compliant so
      the case cannot pass for the wrong reason.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"networks":[{"name":"net-alpha","legacy_mode":false,"is_default_network":false,"subnet_count":1},{"name":"net-legacy","legacy_mode":true,"is_default_network":false,"subnet_count":1}],"subnets":[{"name":"subnet-one","network":"net-alpha","flow_logs_enabled":true},{"name":"subnet-two","network":"net-legacy","flow_logs_enabled":true}]},"summary":{"total_networks":2,"legacy_networks":0,"default_network_present":false,"networks_without_subnets":[],"total_subnets":2,"subnets_with_flow_logs":2,"flow_log_percentage":100}}}'

  - name: subnet_enumeration_incomplete
    expect: FAIL
    note: >
      Subnets arrive from one aggregatedList call, so a partial read leaves
      every network in networks_without_subnets while the envelope stays clean.
      gcp_vpc_every_network_has_subnets is what catches it — the per-subnet
      counts would otherwise read an empty subnet list as zero violations.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"networks":[{"name":"net-alpha","legacy":false,"is_default_network":false,"subnet_count":0}],"subnets":[{"name":"subnet-one","network":"net-alpha","flow_logs_enabled":true}]},"summary":{"total_networks":1,"legacy_networks":0,"default_network_present":false,"networks_without_subnets":["net-alpha"],"total_subnets":0,"subnets_with_flow_logs":0,"flow_log_percentage":0}}}'

  - name: collection_failed
    expect: FAIL
    note: >
      ERROR is the semantically right verdict, but the API discards
      disposition, so FAIL is the best reachable answer today. What matters is
      that it does not PASS. See docs/validators_design.md.
    artifact: '{"metadata":{"exit_code":1,"status":"failed","error":"PermissionDenied"},"payload":{}}'
