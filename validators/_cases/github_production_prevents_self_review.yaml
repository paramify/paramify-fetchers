  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"production_allowing_self_review":null}}}'
- name: renamed
  expect: FAIL
  artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"production_allowing_self_review_renamed":[]}}}'
