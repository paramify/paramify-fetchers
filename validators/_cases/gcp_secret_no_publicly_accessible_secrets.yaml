validator: gcp_secret_no_publicly_accessible_secrets
cases:
  - name: all_secrets_private
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","public_access_members":[],"publicly_accessible":false},{"name":"beta","public_access_members":[],"publicly_accessible":false}]}}}'

  - name: one_secret_public
    expect: FAIL
    note: allUsers on a secret IAM policy is the top-severity finding this set exists to catch
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","public_access_members":[],"publicly_accessible":false},{"name":"beta","public_access_members":["allUsers"],"publicly_accessible":true}]}}}'

  - name: summary_rollup_does_not_satisfy_the_pattern
    expect: PASS
    note: >
      Guards the anchor itself. The summary key `publicly_accessible_secrets`
      shares a prefix with the per-secret flag; the closing quote in the pattern
      is what keeps a rollup of 1 from being read as a per-secret false. The
      per-secret flags below are all false, so PASS is the right answer here and
      the rollup is correctly ignored.
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","publicly_accessible":false}]},"summary":{"publicly_accessible_secrets":1}}}'

  - name: flag_renamed_ALONE_THIS_PASSES
    expect: PASS
    note: >
      Deliberate, and the reason `integrity` exists. Counting violations cannot
      distinguish "no public secrets" from "the key I count is gone" — zero
      matches is this validator pass condition. On its own it reports PASS on an
      artifact hiding a world-readable secret. Its partner
      gcp_secret_public_access_flags_present is what fails; see the set-level
      case in set_EVD-GCP-SECRETMGR-CONFIG.yaml, which is the assertion that
      actually matters. Note `public_access_members` is [] in the compliant case
      too, so a regex over that list could not tell these apart either.
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"secrets":[{"name":"alpha","is_publicly_accessible":false},{"name":"beta","is_publicly_accessible":true}]}}}'
