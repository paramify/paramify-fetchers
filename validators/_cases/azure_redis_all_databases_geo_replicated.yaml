validator: azure_redis_all_databases_geo_replicated
cases:
  - name: all_geo_replicated
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"},{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":2}}}'

  - name: group_null
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"},{"databases":[{"client_protocol":"Encrypted","geo_replication_group":null,"geo_replication_linked_databases":[]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":2}}}'

  - name: group_with_only_itself
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: keys_renamed_reads_as_zero_alone
    expect: PASS
    note: 'Form B cannot guard itself; its integrity partner fails here, as the set-level case shows.'
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geoReplicationGroup":null,"geoReplicationLinkedDatabases":[]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'
