validator: gcp_secret_manager_api_readable
cases:
  - name: api_answered
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"secret_manager_api_readable":true,"total_secrets":2}}}'

  - name: api_disabled_on_project
    expect: FAIL
    note: >
      The fetcher records a disabled Secret Manager API as not readable and
      exits 0, so the envelope is intact and collection health passes. This is
      the validator that says the population was never collected.
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"secret_manager_api_readable":false,"total_secrets":0}}}'

  - name: readability_key_renamed
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"api_readable":true,"total_secrets":2}}}'
