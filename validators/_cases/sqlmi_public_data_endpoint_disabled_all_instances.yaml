validator: sqlmi_public_data_endpoint_disabled_all_instances
cases:
  - name: all_instances_private_only
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"managed_instances":[{"name":"mi-a","public_data_endpoint_enabled":false,"private_access_only":true},{"name":"mi-b","public_data_endpoint_enabled":false,"private_access_only":true}]},"summary":{"instances_public_data_endpoint_enabled":0}}}'

  - name: one_instance_public_endpoint_on
    expect: FAIL
    note: a common non-compliant shape.
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"managed_instances":[{"name":"mi-a","public_data_endpoint_enabled":false},{"name":"mi-b","public_data_endpoint_enabled":true}]},"summary":{"instances_public_data_endpoint_enabled":1}}}'

  - name: setting_omitted_by_azure
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"managed_instances":[{"name":"mi-a","public_data_endpoint_enabled":null,"private_access_only":null}]}}}'

  - name: key_renamed_ALONE_THIS_PASSES
    expect: PASS
    note: >
      Deliberate. sqlmi_configuration_fields_present fails here; see
      set_EVD-AZURE-SQLMI-CONFIG.yaml.
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"managed_instances":[{"name":"mi-a","public_endpoint_enabled":true}]}}}'
