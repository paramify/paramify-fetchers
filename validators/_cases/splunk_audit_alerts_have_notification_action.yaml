validator: splunk_audit_alerts_have_notification_action
# `summary` before `audit_scope`, as the fetcher emits them.
cases:
  # The fence matters here for a different reason than on the retention
  # validators: the all-deployment summary counts Splunk's own telemetry jobs,
  # which carry a real `alert_type` and deliberately notify nobody, so it reads
  # false on every healthy deployment. MATCH_GROUP takes the first match.
  - name: every_enabled_scoped_alert_notifies_though_summary_false
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"alerts_enabled":7,"alerts_with_notification_action":0,"every_enabled_alert_notifies":false,"notification_actions_in_use":[]},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alert_apps_named_but_absent":[],"alerts_configured":4,"alerts_enabled":4,"every_configured_alert_is_enabled":true,"alerts_with_notification_action":4,"every_enabled_alert_notifies":true,"enabled_alerts_without_notification_action_names":[],"notification_actions_in_use":["email","pagerduty"],"scope_is_assessable":true}}}'

  # The real sandbox posture: not one saved search anywhere on the deployment
  # carries a notification action. Alerts that notify nothing fire into nothing.
  - name: no_scoped_alert_notifies_anything
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"alerts_with_notification_action":0,"every_enabled_alert_notifies":false},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["splunk_monitoring_console"],"alert_apps_named_but_absent":[],"alerts_configured":8,"alerts_enabled":0,"every_configured_alert_is_enabled":false,"alerts_with_notification_action":0,"every_enabled_alert_notifies":false,"notification_actions_in_use":[],"scope_is_assessable":true}}}'

  # One enabled alert writes to a summary index and tells no one. summary_index,
  # populate_lookup and outputtelemetry are the three actions the fetcher counts
  # as non-notifying — they write results back into Splunk.
  - name: one_enabled_alert_only_writes_a_summary_index
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_enabled_alert_notifies":true},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alert_apps_named_but_absent":[],"alerts_configured":4,"alerts_enabled":4,"every_configured_alert_is_enabled":true,"alerts_with_notification_action":3,"every_enabled_alert_notifies":false,"enabled_alerts_without_notification_action_names":["Audit Config Changed"],"notification_actions_in_use":["email"],"scope_is_assessable":true}}}'

  # Vacuity, as the fetcher emits it: no alerts in scope means nothing enabled,
  # so `bool(enabled) and ...` is false and the scope guard is false too. The
  # summary says true — unfenced, this would pass.
  - name: scope_contains_no_alerts_at_all
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_enabled_alert_notifies":true},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alert_apps_named_but_absent":[],"saved_searches_in_scope":3,"alerts_configured":0,"alerts_enabled":0,"every_configured_alert_is_enabled":false,"alerts_with_notification_action":0,"every_enabled_alert_notifies":false,"scope_is_assessable":false}}}'

  - name: alert_scope_never_configured
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_enabled_alert_notifies":true},"audit_scope":{"alert_apps_configured":false,"alert_apps_named":[],"alert_apps_named_but_absent":[],"saved_searches_in_scope":0,"scope_is_assessable":false}}}'

  # Direction 3: envelope intact, compliance key renamed upstream.
  - name: notification_verdict_key_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_enabled_alert_notifies":true},"audit_scope":{"alert_apps_configured":true,"alert_apps_named":["security_alerting"],"alerts_configured":4,"alerts_enabled":4,"every_configured_alert_is_enabled":true,"all_enabled_alerts_notify":true,"scope_is_assessable":true}}}'

  - name: audit_scope_block_renamed
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"alerts_configured":15,"every_enabled_alert_notifies":true},"auditScope":{"alert_apps_configured":true,"alerts_configured":4,"every_enabled_alert_notifies":true,"scope_is_assessable":true}}}'
