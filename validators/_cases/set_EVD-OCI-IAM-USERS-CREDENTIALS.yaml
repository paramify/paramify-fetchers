# Set-level: every validator naming this reference_id, combined the way
# Paramify combines them. A validator that reads a zero cannot prove the
# zero was measured — only the set, with its integrity partner, can.
evidence_set: EVD-OCI-IAM-USERS-CREDENTIALS
cases:
  - name: mfa_everywhere_and_no_admin_keys
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"summary": {"console_capable_users": 3, "mfa_percentage_of_console_users": 100, "tenancy_admins": 2, "tenancy_admins_with_api_keys": 0}}}'

  - name: admin_holds_an_api_key
    expect: FAIL
    note: >
      The live tenancy's own posture: the collecting administrator holds the key the fetchers authenticate with. Cloud Guard raises USER_HAS_API_KEYS for it.
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"summary": {"console_capable_users": 2, "mfa_percentage_of_console_users": 100, "tenancy_admins": 1, "tenancy_admins_with_api_keys": 1}}}'

  - name: a_console_user_without_mfa
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"summary": {"console_capable_users": 2, "mfa_percentage_of_console_users": 50, "tenancy_admins": 1, "tenancy_admins_with_api_keys": 0}}}'

  - name: collection_failed
    expect: FAIL
    note: >
      The envelope carries a non-zero exit code, so collection_succeeded fails however good the summary looks.
    artifact: '{"metadata": {"exit_code": 1, "status": "error"}, "payload": {"summary": {"console_capable_users": 3, "mfa_percentage_of_console_users": 100, "tenancy_admins": 1, "tenancy_admins_with_api_keys": 0}}}'
