validator: betterstack_status_page_components_operational
cases:
  - name: all_components_operational
    expect: PASS
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","lowest_reported_availability":{"public_name":"API","status_page_resource_id":"1","availability":0.999961},"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":0,"availability":0.999961,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Dashboard","explanation":"app.example.com","position":1,"availability":1,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'

  - name: one_component_degraded
    expect: FAIL
    note: >
      A live degraded component. The artifact also carries a status_history row
      with status "degraded", and the selected-component block right above it —
      the anchor requires an `availability` value immediately followed by
      `status`, so neither is miscounted, and this FAIL comes from the
      component's current status alone.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","lowest_reported_availability":{"public_name":"API","status_page_resource_id":"1","availability":0.999961},"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":0,"availability":0.999961,"status":"degraded","status_history":[{"day":"2026-09-24","status":"degraded","downtime_duration":16200,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Dashboard","explanation":"app.example.com","position":1,"availability":1,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'

  - name: status_key_renamed_ALONE_THIS_PASSES
    expect: PASS
    note: >
      Deliberate, and the reason `integrity` exists. Counting violations cannot
      distinguish "no violations" from "the key I count is gone" — zero matches is
      this validator's pass condition. On its own it reports PASS on an artifact
      where a component is degraded. Its partner
      betterstack_status_page_components_present is what fails; see the set-level
      case, which is the assertion that actually matters.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","lowest_reported_availability":{"public_name":"API","status_page_resource_id":"1","availability":0.999961},"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":0,"availability":0.999961,"status_history":[{"day":"2026-09-24","status":"degraded","downtime_duration":16200,"maintenance_duration":0}],"state":"degraded"}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Dashboard","explanation":"app.example.com","position":1,"availability":1,"status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}],"state":"operational"}}]}}'
