# Set-level: every validator naming this reference_id, combined the way
# Paramify combines them. One validator that is false both for a weak policy and for no policy at all.
evidence_set: EVD-OCI-IAM-PASSWORD-POLICY
cases:
  - name: every_policy_meets_cis
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"summary": {"policies_evaluated": 2, "all_policies_meet_cis": true}}}'

  - name: a_policy_below_a_threshold
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"summary": {"policies_evaluated": 2, "all_policies_meet_cis": false}}}'

  - name: no_policy_evaluated
    expect: FAIL
    note: >
      The fetcher writes false when nothing was evaluated, so the validator carries its own integrity.
    artifact: '{"metadata": {"exit_code": 0, "status": "success"}, "payload": {"summary": {"policies_evaluated": 0, "all_policies_meet_cis": false}}}'
