# Set-level: every validator naming EVD-GCP-GKE-CONFIG, combined the way Paramify
# combines them (ERROR > FAIL > PASS). This is where the two integrity validators
# earn their place — half of the configuration validators count violations, and a
# count-based validator cannot cover its own drift.
#
# Synthetic artifacts only. Invented cluster and node pool names; nothing here
# comes from a real project.
evidence_set: EVD-GCP-GKE-CONFIG
cases:
  - name: hardened_baseline
    expect: PASS
    note: >
      The target posture: RBAC only, shielded nodes on, Workload Identity
      everywhere, every node pool auto-upgrading.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"clusters":[{"name":"cluster-alpha","legacy_abac_enabled":false,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-a","auto_upgrade":true}]},{"name":"cluster-beta","legacy_abac_enabled":false,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-b","auto_upgrade":true}]}]},"summary":{"total_clusters":2,"total_node_pools":2,"legacy_abac_clusters":0,"shielded_nodes_clusters":2,"workload_identity_clusters":2,"workload_identity_percentage":100,"auto_upgrade_node_pools":2,"auto_upgrade_percentage":100}}}'

  - name: one_cluster_runs_legacy_abac
    expect: FAIL
    note: >
      Only gcp_gke_legacy_abac_disabled fails; everything else reads compliant,
      so the case cannot pass for the wrong reason.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"clusters":[{"name":"cluster-alpha","legacy_abac_enabled":false,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-a","auto_upgrade":true}]},{"name":"cluster-beta","legacy_abac_enabled":true,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-b","auto_upgrade":true}]}]},"summary":{"total_clusters":2,"total_node_pools":2,"legacy_abac_clusters":1,"shielded_nodes_clusters":2,"workload_identity_clusters":2,"workload_identity_percentage":100,"auto_upgrade_node_pools":2,"auto_upgrade_percentage":100}}}'

  - name: one_cluster_has_shielded_nodes_off
    expect: FAIL
    note: Isolated to gcp_gke_shielded_nodes_enabled.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"clusters":[{"name":"cluster-alpha","legacy_abac_enabled":false,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-a","auto_upgrade":true}]},{"name":"cluster-beta","legacy_abac_enabled":false,"shielded_nodes_enabled":false,"workload_identity_enabled":true,"node_pools":[{"name":"pool-b","auto_upgrade":true}]}]},"summary":{"total_clusters":2,"total_node_pools":2,"legacy_abac_clusters":0,"shielded_nodes_clusters":1,"workload_identity_clusters":2,"workload_identity_percentage":100,"auto_upgrade_node_pools":2,"auto_upgrade_percentage":100}}}'

  - name: one_cluster_authenticates_pods_as_the_node
    expect: FAIL
    note: >
      Workload Identity off on one cluster. Isolated to
      gcp_gke_workload_identity_coverage_complete, which reads the rollup.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"clusters":[{"name":"cluster-alpha","legacy_abac_enabled":false,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-a","auto_upgrade":true}]},{"name":"cluster-beta","legacy_abac_enabled":false,"shielded_nodes_enabled":true,"workload_identity_enabled":false,"node_pools":[{"name":"pool-b","auto_upgrade":true}]}]},"summary":{"total_clusters":2,"total_node_pools":2,"legacy_abac_clusters":0,"shielded_nodes_clusters":2,"workload_identity_clusters":1,"workload_identity_percentage":50,"auto_upgrade_node_pools":2,"auto_upgrade_percentage":100}}}'

  - name: one_node_pool_pinned_off_auto_upgrade
    expect: FAIL
    note: Isolated to gcp_gke_node_auto_upgrade_coverage_complete.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"clusters":[{"name":"cluster-alpha","legacy_abac_enabled":false,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-a","auto_upgrade":true},{"name":"pool-b","auto_upgrade":false}]}]},"summary":{"total_clusters":1,"total_node_pools":2,"legacy_abac_clusters":0,"shielded_nodes_clusters":1,"workload_identity_clusters":1,"workload_identity_percentage":100,"auto_upgrade_node_pools":1,"auto_upgrade_percentage":50}}}'

  - name: legacy_abac_flags_renamed_upstream
    expect: FAIL
    note: >
      legacy_abac_enabled renamed while a cluster still runs ABAC, and every other
      reading compliant. Alone, gcp_gke_legacy_abac_disabled counts zero violations
      and reports PASS on an artifact that hides an RBAC bypass;
      gcp_gke_legacy_abac_flag_recorded fails because the key it proves is gone, so
      the set fails. Delete that integrity validator and this case goes green while
      the evidence proves nothing — the silent false pass the role exists for.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"clusters":[{"name":"cluster-alpha","abac_enabled_legacy":false,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-a","auto_upgrade":true}]},{"name":"cluster-beta","abac_enabled_legacy":true,"shielded_nodes_enabled":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-b","auto_upgrade":true}]}]},"summary":{"total_clusters":2,"total_node_pools":2,"shielded_nodes_clusters":2,"workload_identity_clusters":2,"workload_identity_percentage":100,"auto_upgrade_node_pools":2,"auto_upgrade_percentage":100}}}'

  - name: shielded_nodes_flags_renamed_upstream
    expect: FAIL
    note: >
      shielded_nodes_enabled renamed while a cluster has shielded nodes off.
      gcp_gke_shielded_nodes_enabled counts zero violations and would PASS alone;
      gcp_gke_shielded_nodes_flag_recorded is what fails.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"clusters":[{"name":"cluster-alpha","legacy_abac_enabled":false,"shielded_node_vms":true,"workload_identity_enabled":true,"node_pools":[{"name":"pool-a","auto_upgrade":true}]},{"name":"cluster-beta","legacy_abac_enabled":false,"shielded_node_vms":false,"workload_identity_enabled":true,"node_pools":[{"name":"pool-b","auto_upgrade":true}]}]},"summary":{"total_clusters":2,"total_node_pools":2,"legacy_abac_clusters":0,"workload_identity_clusters":2,"workload_identity_percentage":100,"auto_upgrade_node_pools":2,"auto_upgrade_percentage":100}}}'

  - name: collection_failed
    expect: FAIL
    note: >
      ERROR is the semantically right verdict — compliance is unknown, not bad —
      but the API discards disposition, so FAIL is the best reachable answer
      today. What matters is that it does not PASS. collection_succeeded is what
      catches this; none of the GKE validators anchor on exit_code.
    artifact: '{"metadata":{"exit_code":1,"status":"failed","error":"PermissionDenied"},"payload":{}}'
