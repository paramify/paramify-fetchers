# Set-level: every validator naming EVD-GCP-SECRETMGR-CONFIG, combined the way
# Paramify combines them (ERROR > FAIL > PASS). This is the assertion that
# matters — a count-based validator cannot cover its own drift, so only the set
# can. Artifacts are synthetic and minimal: no project ids, secret names, KMS
# keys or IAM members from any real tenant.
evidence_set: EVD-GCP-SECRETMGR-CONFIG
cases:
  - name: clean_project
    expect: PASS
    note: >
      Two secrets, neither public, one on a live rotation schedule and neither
      lapsed. Mirrors the shape of the posture these validators were authored
      against (a project where public exposure, overdue rotation and destroyed
      versions were all zero).
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"secrets":[{"name":"alpha","public_access_members":[],"publicly_accessible":false,"rotation_configured":true,"rotation_overdue":false},{"name":"beta","public_access_members":[],"publicly_accessible":false,"rotation_configured":false,"rotation_overdue":false}]},"summary":{"secret_manager_api_readable":true,"total_secrets":2,"secrets_with_rotation":1,"secrets_with_overdue_rotation":0,"publicly_accessible_secrets":0,"non_public_secret_percentage":100}}}'

  - name: one_secret_world_readable
    expect: FAIL
    note: >
      The finding this set exists for: allUsers on one secret IAM policy. The
      rollup and the per-secret counter both fail, which is the intended
      redundancy — either alone would be enough to catch it.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"secrets":[{"name":"alpha","public_access_members":[],"publicly_accessible":false,"rotation_configured":true,"rotation_overdue":false},{"name":"beta","public_access_members":["allUsers"],"publicly_accessible":true,"rotation_configured":false,"rotation_overdue":false}]},"summary":{"secret_manager_api_readable":true,"total_secrets":2,"secrets_with_rotation":1,"secrets_with_overdue_rotation":1,"publicly_accessible_secrets":1,"non_public_secret_percentage":50}}}'

  - name: public_access_flag_renamed_upstream
    expect: FAIL
    note: >
      The case the whole integrity role exists for, and the trap specific to this
      fetcher. gcp_secret_no_publicly_accessible_secrets counts
      "publicly_accessible": true and finds none, so ALONE it reports PASS on an
      artifact hiding a world-readable secret — and `public_access_members` is []
      in the clean case too, so a regex over that list is blind in exactly the
      same way. Only gcp_secret_public_access_flags_present separates "no public
      secrets" from "the key is gone", and it is what fails here. Every other
      validator on the set is kept green on purpose: the summary still reports
      100% non-public, so this case can only go red for the one right reason.
      Delete the integrity validator and it turns green while the evidence proves
      nothing.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"secrets":[{"name":"alpha","public_access_members":[],"is_publicly_accessible":false,"rotation_configured":true,"rotation_overdue":false},{"name":"beta","public_access_members":[],"is_publicly_accessible":true,"rotation_configured":false,"rotation_overdue":false}]},"summary":{"secret_manager_api_readable":true,"total_secrets":2,"secrets_with_rotation":1,"secrets_with_overdue_rotation":0,"publicly_accessible_secrets":0,"non_public_secret_percentage":100}}}'

  - name: rotation_schedule_lapsed
    expect: FAIL
    note: a configured next-rotation time in the past — the control was set up and has stopped firing
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"secrets":[{"name":"alpha","public_access_members":[],"publicly_accessible":false,"rotation_configured":true,"rotation_overdue":true},{"name":"beta","public_access_members":[],"publicly_accessible":false,"rotation_configured":false,"rotation_overdue":false}]},"summary":{"secret_manager_api_readable":true,"total_secrets":2,"secrets_with_rotation":1,"secrets_with_overdue_rotation":1,"publicly_accessible_secrets":0,"non_public_secret_percentage":100}}}'

  - name: rotation_overdue_flag_renamed_upstream
    expect: FAIL
    note: >
      The same drift on the rotation half. The summary still reports zero overdue
      rotations, so gcp_secret_no_overdue_rotation passes; only
      gcp_secret_rotation_flags_present fails, because the per-secret field the
      rollup is computed from is no longer readable.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"secrets":[{"name":"alpha","public_access_members":[],"publicly_accessible":false,"rotation_configured":true,"overdue":false}]},"summary":{"secret_manager_api_readable":true,"total_secrets":1,"secrets_with_rotation":1,"secrets_with_overdue_rotation":0,"publicly_accessible_secrets":0,"non_public_secret_percentage":100}}}'

  - name: secret_manager_api_disabled
    expect: FAIL
    note: >
      The fetcher records a project with the Secret Manager API disabled as not
      readable and exits 0, so the envelope is intact and collection health
      passes. Nothing was collected, so nothing may read as compliant: the
      readability guard, both per-secret integrity guards and the non-public
      rollup (0% on an empty denominator) all fail.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"secrets":[]},"summary":{"secret_manager_api_readable":false,"total_secrets":0,"secrets_with_rotation":0,"secrets_with_overdue_rotation":0,"publicly_accessible_secrets":0,"non_public_secret_percentage":0}}}'

  - name: collection_failed
    expect: FAIL
    note: >
      ERROR is the semantically right verdict, but the API discards disposition,
      so FAIL is the best reachable answer today. What matters is that it does
      not PASS. See docs/validators_design.md.
    artifact: '{"metadata":{"exit_code":1,"status":"failed","error":"PermissionDenied"},"payload":{}}'
