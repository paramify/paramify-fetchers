# Synthetic artifacts only. Invented principals on example.com; nothing here
# comes from a real project.
validator: gcp_binding_service_account_role_flags_present
cases:
  - name: flags_present
    expect: PASS
    note: >
      Every binding records the flag, so a zero count of service accounts on
      over-broad roles reflects posture. The value is irrelevant here — false on
      both bindings still passes.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"bindings":[{"role":"roles/owner","over_broad_role":true,"service_account_granted_over_broad_role":false},{"role":"roles/logging.logWriter","over_broad_role":false,"service_account_granted_over_broad_role":false}]},"summary":{"total_bindings":2,"service_account_bindings_with_over_broad_roles":0}}}'

  - name: flag_renamed_upstream
    expect: FAIL
    note: >
      The failure this validator exists for. The flag is now sa_over_broad and
      reads true, so a service account really is on roles/editor, yet
      gcp_binding_no_service_account_over_broad_roles finds nothing to count and
      reports compliance. This validator is what turns that into a set-level
      failure.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"bindings":[{"role":"roles/editor","over_broad_role":true,"sa_over_broad":true}]},"summary":{"total_bindings":1,"service_account_bindings_with_over_broad_roles":0}}}'

  - name: neighbouring_breadth_flag_does_not_stand_in
    expect: FAIL
    note: >
      Fencing check. over_broad_role is a different, weaker fact — the role is
      broad, with nothing said about who holds it. The leading quote in the
      anchor keeps this validator from accepting it as proof the
      service-account flag was read.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"results":{"bindings":[{"role":"roles/editor","over_broad_role":true,"primitive_role":true}]},"summary":{"total_bindings":1}}}'
