validator: gcp_secret_non_public_coverage_complete
cases:
  - name: no_public_secrets
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_secrets":2,"publicly_accessible_secrets":0,"non_public_secret_percentage":100}}}'

  - name: one_secret_public
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_secrets":2,"publicly_accessible_secrets":1,"non_public_secret_percentage":50}}}'

  - name: rollup_renamed
    expect: FAIL
    note: the presence rule catches this; without it the threshold rule would read nothing and pass vacuously
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_secrets":2,"publicly_accessible_secrets":1,"non_public_pct":50}}}'

  - name: no_secrets_in_project
    expect: FAIL
    note: >
      coverage_percentage returns 0 for an empty denominator, so a project with
      no secrets — including one whose Secret Manager API is disabled — fails
      here rather than reading as 100% compliant. Deliberate: an evidence set
      that proves no posture should not read as compliant.
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"total_secrets":0,"publicly_accessible_secrets":0,"non_public_secret_percentage":0}}}'
