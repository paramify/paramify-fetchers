validator: oci_network_reachability_resolved
cases:
  - name: oci_network_reachability_resolved_passes
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"reachable_internet_ingress_rules": 0, "internet_ingress_rules_with_unknown_reachability": 0}}'

  - name: oci_network_reachability_resolved_fails
    expect: FAIL
    note: >
      One open rule sits on a subnet whose route table was outside the walked
      scope; the reachable count reads 0 and proves nothing. Point the target at a
      common parent.
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"reachable_internet_ingress_rules": 0, "internet_ingress_rules_with_unknown_reachability": 1}}'

  - name: summary_key_renamed
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"reachable_internet_ingress_rules": 0, "internet-ingress-rules-with-unknown-reachability": 0}}'
