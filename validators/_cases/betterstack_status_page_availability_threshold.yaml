validator: betterstack_status_page_availability_threshold
cases:
  - name: lowest_component_above_baseline
    expect: PASS
    note: >
      The weakest component is deliberately NOT first in `included` — Homepage at
      1.0 comes before API at 0.999961. Anchoring on lowest_reported_availability
      is what makes the rule read API; the old per-component anchor read Homepage
      and would have passed whatever API reported.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","lowest_reported_availability":{"public_name":"API","status_page_resource_id":"2","availability":0.999961},"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Homepage","explanation":"www.example.com","position":0,"availability":1.0,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":1,"availability":0.999961,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'

  - name: lowest_component_below_baseline
    expect: FAIL
    note: >
      Same page, the weakest component down to 0.996211. The figure compared is
      Better Stack's own; nothing recomputes it on either side.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","lowest_reported_availability":{"public_name":"API","status_page_resource_id":"2","availability":0.996211},"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Homepage","explanation":"www.example.com","position":0,"availability":1.0,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":1,"availability":0.996211,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'

  - name: availability_in_exponent_notation
    expect: FAIL
    note: >
      Python serializes a small float in exponent form, so an availability of
      1e-05 — 0.001% uptime — reaches the evidence as `1e-05`. A bare `[\d.]+`
      captures "1" out of that and scores 1 > 0.999 PASS. The `[0-9][0-9.]*`
      class plus the `(?![0-9.eE])` lookahead makes the pattern miss instead,
      and a miss fails here rather than passing.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","lowest_reported_availability":{"public_name":"API","status_page_resource_id":"2","availability":1e-05},"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Homepage","explanation":"www.example.com","position":0,"availability":1.0,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":1,"availability":1e-05,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'

  - name: availability_key_renamed_upstream
    expect: FAIL
    note: >
      The regex matches nothing, so MATCH_GROUP[2] reads nothing — but the
      comparison is against a CUSTOM_TEXT rather than another capture group, so
      it is "" > "0.999", which is false, and the verdict is FAIL. That is why
      this validator needs no separate presence rule; a group-versus-group
      comparison would have compared nothing to nothing and passed.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","lowest_reported_availability":{"public_name":"API","status_page_resource_id":"2","uptime":0.996211},"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Homepage","explanation":"www.example.com","position":0,"availability":1.0,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":1,"availability":0.996211,"status":"operational","status_history":[{"day":"2026-09-25","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'
