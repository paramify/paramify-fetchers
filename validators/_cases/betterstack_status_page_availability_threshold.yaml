validator: betterstack_status_page_availability_threshold
cases:
  - name: worst_component_above_baseline
    expect: PASS
    note: >
      The first entry in availability_derived is the WORST component, so a pass here
      is a pass for every component on the page. Two components, neither below
      0.999.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","availability_derived":[{"status_page_resource_id":"1","public_name":"API","history_days":90,"downtime_seconds":300.0,"degraded_seconds":0.0,"maintenance_seconds":0.0,"effective_availability":0.999961},{"status_page_resource_id":"2","public_name":"Dashboard","history_days":90,"downtime_seconds":0.0,"degraded_seconds":0.0,"maintenance_seconds":0.0,"effective_availability":1.0}],"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":0,"availability":0.999961,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Dashboard","explanation":"app.example.com","position":1,"availability":1,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'

  - name: worst_component_below_baseline
    expect: FAIL
    note: >
      The real posture of status.paramify.com on 2026-09-24, reduced to two
      components. Better Stack reports that component at 0.999915 because its own
      figure counts only downtime days; two degraded days totalling 28,800 seconds
      in the same 90-day window bring the effective figure to 0.996211. Asserting
      on the reported number would have passed this.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","availability_derived":[{"status_page_resource_id":"1","public_name":"API","history_days":90,"downtime_seconds":660.420754,"degraded_seconds":28800.0,"maintenance_seconds":2540.907053,"effective_availability":0.996211},{"status_page_resource_id":"2","public_name":"Dashboard","history_days":90,"downtime_seconds":0.0,"degraded_seconds":0.0,"maintenance_seconds":0.0,"effective_availability":1.0}],"data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":0,"availability":0.999961,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Dashboard","explanation":"app.example.com","position":1,"availability":1,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}]}}'

  - name: derived_block_renamed
    expect: FAIL
    note: >
      The presence rule catches this. Without it the threshold rule would read
      nothing, compare nothing to nothing, and PASS — the silent false pass this
      whole guard exists for.
    artifact: '{"metadata":{"exit_code":0,"status":"success"},"payload":{"source_url":"https://status.example.com/index.json","data":{"id":"100","type":"status_page","attributes":{"company_name":"Example, Inc.","subdomain":"example","custom_domain":"status.example.com","aggregate_state":"operational"},"relationships":{"resources":{"data":[{"id":"1","type":"status_page_resource"},{"id":"2","type":"status_page_resource"}]}}},"included":[{"id":"1","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"API","explanation":"api.example.com","position":0,"availability":0.999961,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}},{"id":"2","type":"status_page_resource","attributes":{"resource_type":"Monitor","public_name":"Dashboard","explanation":"app.example.com","position":1,"availability":1,"status":"operational","status_history":[{"day":"2026-09-24","status":"operational","downtime_duration":0,"maintenance_duration":0}]}}],"derived_availability":[{"status_page_resource_id":"1","public_name":"API","history_days":90,"downtime_seconds":300.0,"degraded_seconds":0.0,"maintenance_seconds":0.0,"effective_availability":0.999961},{"status_page_resource_id":"2","public_name":"Dashboard","history_days":90,"downtime_seconds":0.0,"degraded_seconds":0.0,"maintenance_seconds":0.0,"effective_availability":1.0}]}}'
