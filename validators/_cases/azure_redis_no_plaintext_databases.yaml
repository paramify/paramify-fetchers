validator: azure_redis_no_plaintext_databases
cases:
  - name: all_encrypted
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"},{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":2}}}'

  - name: one_plaintext
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"},{"databases":[{"client_protocol":"Plaintext","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":2}}}'

  - name: key_renamed_reads_as_zero_alone
    expect: PASS
    note: 'Form B cannot guard itself; its integrity partner fails here, as the set-level case shows.'
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"clientProtocol":"Plaintext","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: one_protocol_null
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]},{"client_protocol":null,"geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: one_protocol_other_value
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]},{"client_protocol":"Unknown","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'
