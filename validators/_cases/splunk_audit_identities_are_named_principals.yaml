validator: splunk_audit_identities_are_named_principals
cases:
  # Direction 1 — compliant. Every record carrying the `user` field names a real
  # principal, so the two counters agree and the count is non-zero.
  - name: every_present_identity_names_a_real_principal
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":4,"events_observed":900,"all_assessed_elements_fully_covered":true,"identity_field_present_events":900,"identity_meaningful_events":900,"scope_is_assessable":true},"privileged_command_scope":{"identity_field_present_events":360,"identity_meaningful_events":40,"scope_is_assessable":true}}}'

  # Direction 2, and THE case this validator exists for. `user` is present on
  # 100% of records and holds a real principal on 13.5% of them — Splunk writes
  # the literal string `n/a` on records with no principal, and its own
  # filesystem-change audit of $SPLUNK_HOME/etc is most of the volume. A
  # validator keyed on `identity_field_present_events` alone would read 12434 of
  # 12434 and report that every audit record carries an associated identity,
  # which is exactly wrong about the element the narrative rests on. Note the
  # roll-up verdict in this artifact reads TRUE: the payload is built so that
  # this validator is the only thing standing between a lying roll-up and a
  # green control.
  - name: identity_present_on_every_record_but_meaningful_on_thirteen_percent
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":38,"events_observed":12434,"all_assessed_elements_fully_covered":true,"identity_field_present_events":12434,"identity_meaningful_events":1679,"scope_is_assessable":true},"privileged_command_scope":{"identity_field_present_events":360,"identity_meaningful_events":360,"scope_is_assessable":true}}}'

  # Strict equality, not a threshold. One placeholder identity in nine hundred
  # records is still a record that repudiates nothing.
  - name: a_single_placeholder_identity_still_fails
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":4,"events_observed":900,"all_assessed_elements_fully_covered":false,"identity_field_present_events":900,"identity_meaningful_events":899,"scope_is_assessable":true},"privileged_command_scope":{"identity_field_present_events":360,"identity_meaningful_events":360,"scope_is_assessable":true}}}'

  # Direction 3 — counters renamed upstream, envelope intact. Without the
  # MATCH_COUNT presence rule this is a silent PASS: the engine compares an
  # undefined group to an undefined group and EQUALS holds.
  - name: identity_counters_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":4,"events_observed":900,"all_assessed_elements_fully_covered":true,"identity_present_events":900,"identity_named_events":900,"scope_is_assessable":true},"privileged_command_scope":{"identity_field_present_events":360,"identity_meaningful_events":360,"scope_is_assessable":true}}}'

  # Direction 3, the fence variant. The summary pair is renamed while
  # `privileged_command_scope` still carries an intact and AGREEING pair. An
  # untempered `"summary":\s*\{[\s\S]*?` span would run past the end of the
  # summary block, read 360 == 360 out of the privileged scope, and report that
  # every identity on the deployment is a named principal.
  - name: summary_counters_renamed_but_scope_counters_agree
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":38,"events_observed":12434,"all_assessed_elements_fully_covered":true,"identity_present_events":12434,"identity_named_events":1679,"scope_is_assessable":true},"privileged_command_scope":{"identity_field_present_events":360,"identity_meaningful_events":360,"scope_is_assessable":true}}}'

  # The vacuity trap. 0 == 0 is true, and an empty result set is what a
  # misspelled index name or an under-privileged service account produces. The
  # non-vacuity guard is in the regex — the present-count group is `[1-9][0-9]*`
  # — so a zero population does not match at all and the presence rule fails it.
  - name: no_events_observed_so_both_counters_are_zero
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":0,"events_observed":0,"all_assessed_elements_fully_covered":false,"identity_field_present_events":0,"identity_meaningful_events":0,"scope_is_assessable":false},"privileged_command_scope":{"privileged_event_types_configured":true,"scope_is_assessable":false}}}'
