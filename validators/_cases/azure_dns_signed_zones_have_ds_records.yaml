validator: azure_dns_signed_zones_have_ds_records
cases:
  - name: signed_zones_have_ds
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"public_zones":[{"delegation_signer_records":2,"dnssec_enabled":true},{"delegation_signer_records":0,"dnssec_enabled":false}]},"summary":{"total_public_zones":2}}}'

  - name: signed_zone_without_ds
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"public_zones":[{"delegation_signer_records":0,"dnssec_enabled":true}]},"summary":{"total_public_zones":1}}}'

  - name: key_renamed_reads_as_zero_alone
    expect: PASS
    note: 'Form B cannot guard itself; its integrity partner fails here, as the set-level case shows.'
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"public_zones":[{"dnssec_enabled":true,"ds_records":0}]},"summary":{"total_public_zones":1}}}'
