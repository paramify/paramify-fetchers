validator: azure_redis_redundancy_fields_present
cases:
  - name: fields_present
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Enabled","redundancy_mode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: fields_present_even_if_violating
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"high_availability":"Disabled","redundancy_mode":"LR"}]},"summary":{"total_clusters":1}}}'

  - name: fields_renamed
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[{"databases":[{"client_protocol":"Encrypted","geo_replication_group":"grp1","geo_replication_linked_databases":["db-a","db-b"]}],"highAvailability":"Enabled","redundancyMode":"ZR"}]},"summary":{"total_clusters":1}}}'

  - name: no_clusters
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"results":{"redis_clusters":[]},"summary":{"total_clusters":0}}}'
