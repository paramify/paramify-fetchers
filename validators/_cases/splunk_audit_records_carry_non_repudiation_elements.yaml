validator: splunk_audit_records_carry_non_repudiation_elements
cases:
  # Direction 1 — compliant. Note `privileged_command_scope` reads FALSE here on
  # purpose: this validator must read the deployment-wide `summary` verdict and
  # nothing else, and a case where both blocks agree would not show that.
  - name: every_assessed_element_covered_on_every_event_type
    expect: PASS
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":4,"events_observed":900,"all_assessed_elements_fully_covered":true,"identity_field_present_events":900,"identity_meaningful_events":900,"scope_is_assessable":true},"privileged_command_scope":{"all_assessed_elements_fully_covered":false,"scope_is_assessable":true}}}'

  # Direction 2 — non-compliant. The mirror of the case above: the summary
  # verdict is false while the scope verdict is true, so a validator reading the
  # wrong block would pass here.
  - name: an_element_is_not_covered_on_every_event_type
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":4,"events_observed":900,"elements_not_fully_covered":["source"],"all_assessed_elements_fully_covered":false,"identity_field_present_events":900,"identity_meaningful_events":900,"scope_is_assessable":true},"privileged_command_scope":{"all_assessed_elements_fully_covered":true,"scope_is_assessable":true}}}'

  # Direction 3 — the compliance key renamed upstream, envelope intact. THIS is
  # the case the tempered fence exists for. `privileged_command_scope` still
  # carries an identically-named key reading `true`; an untempered
  # `"summary":\s*\{[\s\S]*?` span would run straight past the end of the
  # summary block, bind to it, and report a green control on a payload where the
  # deployment-wide verdict is no longer readable at all.
  - name: summary_verdict_key_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":4,"events_observed":900,"all_assessed_elements_covered":true,"identity_field_present_events":900,"identity_meaningful_events":900,"scope_is_assessable":true},"privileged_command_scope":{"all_assessed_elements_fully_covered":true,"scope_is_assessable":true}}}'

  - name: summary_block_renamed_upstream
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"rollup":{"event_types_observed":4,"events_observed":900,"all_assessed_elements_fully_covered":true},"privileged_command_scope":{"all_assessed_elements_fully_covered":true,"scope_is_assessable":true}}}'

  # The vacuity trap, which is live here because every verdict in this evidence
  # set asserts a POSITIVE: "every event type carries a user field" is true of no
  # event types. An empty result set is what a misspelled index name or a role
  # without `srchIndexesAllowed` over `_audit` produces, and it must never read
  # as a pass. The fetcher pre-ANDs `scope_is_assessable` into the key this
  # validator reads, which is why the artifact below reads false rather than the
  # vacuous true.
  - name: search_returned_nothing_so_scope_is_not_assessable
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":0,"events_observed":0,"all_assessed_elements_fully_covered":false,"identity_field_present_events":0,"identity_meaningful_events":0,"scope_is_assessable":false},"privileged_command_scope":{"privileged_event_types_configured":true,"scope_is_assessable":false}}}'

  # PRESENT vs MEANINGFUL. `user` is present on 100% of records and holds a real
  # principal on 13.5% of them, because Splunk writes the literal `n/a` where
  # there was no principal. The fetcher's roll-up scores identity on the
  # MEANINGFUL counter, so the deployment-wide verdict is false and this
  # validator fails — which is the correct outcome. It fails here only because
  # the fetcher got the counter right, though: this validator reads a verdict
  # the fetcher computes, not the two counters. The case that holds when the
  # roll-up itself claims coverage is in
  # validators/_cases/set_EVD-SPLUNK-AUDIT-EVENT-TYPES.yaml, and the validator
  # that catches it is splunk_audit_identities_are_named_principals.
  - name: identity_present_on_every_record_but_meaningful_on_few
    expect: FAIL
    artifact: '{"metadata":{"exit_code":0},"payload":{"summary":{"event_types_observed":38,"events_observed":12434,"elements_not_fully_covered":["identity"],"all_assessed_elements_fully_covered":false,"identity_field_present_events":12434,"identity_meaningful_events":1679,"scope_is_assessable":true},"privileged_command_scope":{"all_assessed_elements_fully_covered":true,"scope_is_assessable":true}}}'
