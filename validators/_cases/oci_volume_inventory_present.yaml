validator: oci_volume_inventory_present
cases:
  - name: oci_volume_inventory_present_passes
    expect: PASS
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"volumes_with_oracle_managed_key": 0, "total_volumes": 3}}'

  - name: oci_volume_inventory_present_fails
    expect: FAIL
    note: >
      The point of the validator: its partners' zeros are only meaningful when
      something was counted.
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"volumes_with_oracle_managed_key": 0, "total_volumes": 0}}'

  - name: summary_key_renamed
    expect: FAIL
    artifact: '{"metadata": {"exit_code": 0}, "summary": {"volumes_with_oracle_managed_key": 0, "total-volumes": 3}}'
