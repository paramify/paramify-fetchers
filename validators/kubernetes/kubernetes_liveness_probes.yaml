key: kubernetes_liveness_probes
name: 'Kubernetes: Liveness Probes Configured'
type: AUTOMATED
role: configuration
statement: >
  Every container in every workload has a liveness probe (workloads_without_liveness_probe is empty), so a
  hung container is restarted. A probe being configured is not proof it tests the right thing. Covers
  Deployments and StatefulSets outside the excluded namespaces. Supports KSI-CNA-OFA. Does not check
  whether the collection run succeeded.

regex: '"workloads_without_liveness_probe":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KUBERNETES-WORKLOAD-RESILIENCE
