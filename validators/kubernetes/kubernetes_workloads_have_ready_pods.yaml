key: kubernetes_workloads_have_ready_pods
name: 'Kubernetes: Workloads Have Ready Pods'
type: AUTOMATED
role: configuration
statement: >
  Every workload with replicas set has at least one ready pod (workloads_without_ready_pods is empty).
  Covers Deployments and StatefulSets outside the excluded namespaces. Supports KSI-CNA-OFA. Does not
  check whether the collection run succeeded.

regex: '"workloads_without_ready_pods":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KUBERNETES-WORKLOAD-RESILIENCE
