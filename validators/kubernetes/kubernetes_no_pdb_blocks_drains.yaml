key: kubernetes_no_pdb_blocks_drains
name: 'Kubernetes: No Disruption Budget Blocks Node Drains'
type: AUTOMATED
role: configuration
statement: >
  No PodDisruptionBudget refuses every eviction (maxUnavailable 0, or minAvailable at least the replicas
  or 100%) (workloads_with_pdb_blocking_drains is empty), so nodes can be drained for maintenance and
  patching. Covers Deployments and StatefulSets outside the excluded namespaces. Does not check whether
  the collection run succeeded.

regex: '"workloads_with_pdb_blocking_drains":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KUBERNETES-WORKLOAD-RESILIENCE
