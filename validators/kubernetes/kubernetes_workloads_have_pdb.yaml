key: kubernetes_workloads_have_pdb
name: 'Kubernetes: Multi-Replica Workloads Have Disruption Budgets'
type: AUTOMATED
role: configuration
statement: >
  Every multi-replica workload has a PodDisruptionBudget matching its pods (workloads_without_pdb is
  empty), so node drains keep a minimum running. Covers Deployments and StatefulSets outside the excluded
  namespaces. Supports KSI-CNA-OFA. Does not check whether the collection run succeeded.

regex: '"workloads_without_pdb":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KUBERNETES-WORKLOAD-RESILIENCE
