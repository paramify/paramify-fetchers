key: kubernetes_readiness_probes
name: 'Kubernetes: Readiness Probes Configured'
type: AUTOMATED
role: configuration
statement: >
  Every container in every workload has a readiness probe (workloads_without_readiness_probe is empty), so
  traffic reaches a pod only once it is ready. A probe being configured is not proof it tests the right
  thing. Covers Deployments and StatefulSets outside the excluded namespaces. Does not check whether the
  collection run succeeded.

regex: '"workloads_without_readiness_probe":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-KUBERNETES-WORKLOAD-RESILIENCE
