key: checkov_tfvc_latest_changeset_scanned
name: Checkov Scanned The Latest TFVC Changeset's ARM Templates
type: AUTOMATED
role: configuration
statement: >
  The Checkov scan read a TFVC source at the newest changeset (tfvc_version latest, with the
  changeset number recorded), found at least one ARM template, and finished with status success: at
  least one check ran and every file parsed. Supports KSI-CMT-VTD. "Newest" is the project's newest
  changeset, which may touch another folder. It does not assert freshness within the collection
  window (Paramify's evidence frequency covers that), that failed checks were fixed or excepted, or
  the Azure Policy half of the bullet.

# Positive lookaheads; "status": "success" followed by "message" is the payload's own status, not the envelope's.
regex: '^\s*\{(?=[\s\S]*?"source_type":\s*(?<source_type>"(?:[^"\\]|\\.)*"|null|true|false|-?\d+(?:\.\d+)?))(?=[\s\S]*?"requested_version":\s*(?<requested_version>"(?:[^"\\]|\\.)*"|null|true|false|-?\d+(?:\.\d+)?))(?=[\s\S]*?"changeset":\s*(?<changeset>\d+))(?=[\s\S]*?"arm_templates":\s*(?<arm_templates>\d+))(?=[\s\S]*?"status":\s*(?<status>"(?:[^"\\]|\\.)*"|null|true|false|-?\d+(?:\.\d+)?),\s*"message":)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS "tfvc"; MATCH_GROUP[2] EQUALS "latest"; MATCH_GROUP[3] GREATER_THAN 0; MATCH_GROUP[4] GREATER_THAN 0; MATCH_GROUP[5] EQUALS "success"
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # source_type
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "\"tfvc\"" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # requested_version
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "\"latest\"" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 3 }   # changeset
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 4 }   # arm_templates
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 5 }   # status
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "\"success\"" }

evidence_sets:
  - EVD-CHECKOV-BICEP
