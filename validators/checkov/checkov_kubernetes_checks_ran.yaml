key: checkov_kubernetes_checks_ran
name: 'Checkov Kubernetes: Checks Ran Against the Manifests'
type: AUTOMATED
role: completeness
source: community
statement: >
  Checkov ran at least one check against the repository's Kubernetes manifests (total_checks is
  above 0). Fails when the repository has no manifests, the clone or scan failed, or the count
  appears other than exactly once. Checks listed in the skip list are not run and appear nowhere.
  Does not check whether the collection run succeeded.

regex: '"total_checks":\s*(?<total_checks>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] GREATER_THAN 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # total_checks
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-CHECKOV-KUBERNETES
