key: checkov_kubernetes_manifests_parsed
name: 'Checkov Kubernetes: Every Manifest Parsed'
type: AUTOMATED
role: integrity
source: community
statement: >
  Checkov parsed every Kubernetes manifest it found (parsing_errors is 0), so no manifest was left
  unchecked because it could not be read. Fails when the scan did not run, since Checkov then
  reports no parsing count, or the count appears other than exactly once. Does not check whether the
  collection run succeeded.

regex: '"parsing_errors":\s*(?<parsing_errors>\d+)'
rules_summary: MATCH_COUNT EQUALS 1; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "1" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # parsing_errors
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-CHECKOV-KUBERNETES
