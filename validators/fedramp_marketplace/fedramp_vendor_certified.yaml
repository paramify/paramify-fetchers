key: fedramp_vendor_certified
name: Third-Party Vendors Are FedRAMP Certified
type: AUTOMATED
role: configuration
statement: Every third-party vendor package checked is currently FedRAMP certified on the FedRAMP Marketplace.

# Strict option: Ready, In Process, In Remediation, delisted, not-listed and unknown-status vendors all fail. Use fedramp_vendor_certified_or_in_process instead to accept vendors still working toward certification.
#
# Reads the fetcher's own count in `summary`, which is written ahead of the
# vendor list, so MATCH_GROUP's first match is always the summary. The
# presence rule makes a missing summary (failed run, renamed key) fail rather
# than pass vacuously.
regex: '"vendors_not_certified":\s*(?<vendors_not_certified>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # vendors_not_certified
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-FEDRAMP-VENDOR-CERTIFICATION
  - EVD-FEDRAMP-WORKSPACE-VENDOR-CERTIFICATION
