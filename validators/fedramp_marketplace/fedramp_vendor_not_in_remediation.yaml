key: fedramp_vendor_not_in_remediation
name: No Third-Party Vendor Is In FedRAMP Remediation
type: AUTOMATED
role: configuration
statement: No third-party vendor package checked is listed as FedRAMP Certified (In Remediation).

# In Remediation is published only in the status changelog. FedRAMP publishes no corrective action plan (CAP) status, so this is the closest signal available.
#
# Reads the fetcher's own count in `summary`, which is written ahead of the
# vendor list, so MATCH_GROUP's first match is always the summary. The
# presence rule makes a missing summary (failed run, renamed key) fail rather
# than pass vacuously.
regex: '"vendors_in_remediation":\s*(?<vendors_in_remediation>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # vendors_in_remediation
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-FEDRAMP-VENDOR-CERTIFICATION
  - EVD-FEDRAMP-WORKSPACE-VENDOR-CERTIFICATION
