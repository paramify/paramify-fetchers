key: splunk_audit_indexes_have_an_enabled_input
name: Splunk Audit Indexes Have A Feeding Input
type: AUTOMATED
role: configuration
statement: >-
  Every Splunk index named as holding audit or security data — excluding the
  Splunk-internal ones, which splunkd writes directly and which never have a
  data input — is the destination of at least one ENABLED data input.
  Substantiates the "Log Management on all production components" half of the
  Audit Log Collection and Alerts capability, and KSI-MLA-LET's requirement that
  the logging named in the list actually occurs: an index configured with
  retention and reachable by roles proves nothing if nothing writes to it.

  The assertion is keyed on the INDEX, not on the input, which is what makes it
  answerable at all — "does anything write to the indexes the claim depends on?"
  cannot be answered by an input-keyed roll-up.

  Does NOT assert: that events have actually arrived in those indexes (an
  enabled input can be misconfigured or its source silent — see
  EVD-SPLUNK-AUDIT-EVENT-TYPES, which measures arrival independently through a
  different API); that the inputs cover every production component, since an
  input names a destination and rarely names a source host (see
  splunk_inputs_name_a_collection_host); that retention on those indexes is
  adequate (see splunk_audit_indexes_meet_retention); nor anything at all about
  `_audit` or any other Splunk-internal index, which are reported under
  `indexes_internal_not_assessed` and deliberately left out of the verdict —
  scoring them as missing a data input would report a platform fact as a
  finding.

# Fenced to the `audit_scope` block, and the fence is load-bearing twice over.
# (1) `summary` is the OTHER roll-up in this payload and it is serialized FIRST;
# it shares key names with `audit_scope` (`scope_is_assessable` most notably).
# MATCH_GROUP reads the FIRST match only, so an unfenced pattern that drifted
# onto a shared key would silently read the input-keyed roll-up instead of the
# index-keyed one — a different question with a different answer.
# (2) It documents which of the two blocks this validator's verdict comes from,
# which is not otherwise recoverable from the key name.
#
# The source field is already AND-ed with `audit_scope.scope_is_assessable` by
# the fetcher, so this POSITIVE assertion cannot pass vacuously over an empty
# assessed scope. splunk_audit_input_scope_is_assessable asserts that guard
# independently, so the pairing does not depend on the fetcher keeping the
# pre-AND.
regex: '"audit_scope":\s*\{[\s\S]*?"every_assessed_audit_index_has_an_enabled_input":\s*(?<every_assessed_audit_index_has_an_enabled_input>true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true
validation_rules:
  # Presence, and load-bearing rather than ceremonial: a MATCH_GROUP comparison
  # over a regex that never matched compares nothing to nothing and evaluates
  # TRUE, so without this rule a renamed key reads as compliant.
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-SPLUNK-DATA-INPUTS
