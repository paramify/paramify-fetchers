key: splunk_audit_retention_floor_is_ninety
name: Splunk Audit Retention Floor Is Ninety Days
type: AUTOMATED
role: integrity
statement: >-
  The searchable-retention floor the evidence measured each audit index against
  is 90 days — the figure in the SIEM capability narrative.

  Why this exists: the floor is operator-configurable
  (SPLUNK_SEARCHABLE_RETENTION_DAYS). Without this validator, lowering it to 1
  would make splunk_audit_indexes_meet_retention pass on a deployment whose
  retention had just been cut — the compliance validator compares against
  whatever floor it was handed, so the floor itself has to be pinned. This is
  the integrity partner for that comparison.

  Does NOT assert: anything about the retention actually configured on any
  index. It pins the yardstick, not the measurement.

# Fenced to audit_scope for the same reason as its partner: the all-index
# summary carries the same key.
regex: '"audit_scope":\s*\{[\s\S]*?"searchable_retention_days_required":\s*(?<searchable_retention_days_required>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 90
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  # EQUALS, not GREATER_THAN_OR_EQUALS: the comparison operators are not
  # documented as numeric, and "8" >= "14" holds as a string. An exact match is
  # the only reading where both interpretations agree.
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "90" }

evidence_sets:
  - EVD-SPLUNK-INDEX-RETENTION
