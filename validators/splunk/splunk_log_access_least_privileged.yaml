key: splunk_log_access_least_privileged
name: Splunk Log Access Is Least Privileged
type: AUTOMATED
role: configuration
statement: >-
  No non-exempt Splunk role that can reach the configured audit indexes holds
  wildcard index access, and the scope that verdict was computed over was
  itself assessable. Substantiates the LEAST-PRIVILEGED element of KSI-MLA-ALA
  ("Authorizing Log Access", si-11), asserted per role over the effective
  (direct UNION imported) allowed-index set rather than over the direct field
  alone — a role that inherits `*` from a parent is a wildcard role.

  Does NOT assert: that the roles which do hold access hold the RIGHT access —
  an explicit list naming every audit index is narrow by this measure and broad
  in fact. Nor that the exemption list is reasonable: `SPLUNK_EXEMPT_ROLES`
  (default admin, power, splunk-system-role) is an operator judgement, and
  exempting a role removes it from this verdict entirely, which is why
  `audit_scope.exempt_roles_named` must be read alongside a pass. Nor that any
  human account is assigned these roles — /services/authentication/users is
  unread, so this proves the access MODEL, not its membership. Nor the
  "persistently reviewed" clause of the KSI, which is a process fact no Splunk
  endpoint exposes. Nor the attribute-based and just-in-time elements (see
  splunk_log_access_attribute_scoped and splunk_log_access_time_bounded), nor
  that the collection succeeded (see collection_succeeded).

# Fenced to `audit_scope` on purpose, and the fence is load-bearing. Every key
# below also appears, identically named, in the all-roles `summary` block that
# is written EARLIER in the payload — where it is false on any healthy Splunk,
# because Splunk ships admin / power / splunk-system-role with `*` by design.
# MATCH_GROUP reads the FIRST match only, so an unfenced pattern would read the
# summary verdict and fail every deployment, including a compliant one.
#
# Group 2 is the anti-vacuity guard. `scope_is_assessable` is true only when
# audit indexes were named, the role list came back whole
# (roles_reported_total == roles_returned), at least one non-exempt role was
# evaluated, and no named exempt role was absent. The fetcher already AND-s it
# into group 1 (fetcher.py:376), so reading it again is belt-and-braces here —
# but it is what makes the FAILING read unambiguous, and it keeps this file
# identical in shape to its two siblings, where the guard is NOT pre-AND-ed and
# is the only thing standing between an empty scope and a green check.
#
# The two groups are spanned with `[\s\S]*?` and so depend on
# `no_role_has_wildcard_index_access` preceding `scope_is_assessable` within the
# block, which it does: the fetcher writes the roll-up first and appends the
# guard last. If either key is dropped or renamed the pattern matches nothing at
# all, MATCH_COUNT is 0, and rule 1 fails — the safe direction.
regex: '"audit_scope":\s*\{[\s\S]*?"no_role_has_wildcard_index_access":\s*(?<no_role_has_wildcard_index_access>true|false)[\s\S]*?"scope_is_assessable":\s*(?<scope_is_assessable>true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true; MATCH_GROUP[2] EQUALS true
validation_rules:
  # Presence, and load-bearing rather than ceremonial: a MATCH_GROUP comparison
  # over a regex that never matched compares nothing to nothing and evaluates
  # TRUE, so without this rule a renamed key reads as compliant.
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-SPLUNK-ROLE-INDEX-ACCESS
