key: splunk_audit_identities_are_named_principals
name: Splunk Audit Identities Name Real Principals
type: AUTOMATED
role: configuration
statement: >-
  Every audit record on which the Splunk `user` field is PRESENT also holds a
  real principal rather than a placeholder: the deployment-wide count of records
  whose identity is meaningful equals the count on which the field merely
  exists, and that count is greater than zero. Substantiates the "associated
  identities" element of the Audit Logging Criteria narrative — the element the
  claim of non-repudiation rests on most directly, since a record that cannot be
  attributed to anyone repudiates nothing.

  This validator exists because presence and meaning diverge here and nowhere
  else so sharply. Splunk writes the literal string `n/a` into `user` on records
  that had no principal — its own filesystem-change audit of
  `$SPLUNK_HOME/etc`, for one — so the field is present on effectively 100% of
  records while identifying nobody on most of them. A validator keyed on the
  presence counter would report "every audit record carries an associated
  identity" and be exactly wrong. It therefore reads BOTH counters and asserts
  they are equal, which is the only form in which the gap is visible in the
  result: the evaluator prints both sides, so a failure names the size of the
  placeholder population instead of merely saying `false`.

  Does NOT assert: that the principals named are the right ones, that they are
  humans rather than service accounts, that they were authorised to do what the
  record shows, or that the identity is unforgeable. Nor does it assert anything
  about the other six non-repudiation elements (see
  splunk_audit_records_carry_non_repudiation_elements), or about records on
  which the `user` field is ABSENT ENTIRELY — those are outside both counters,
  and the sibling validator's `identity` element is what catches them.

  Deliberately NOT subsumed by the roll-up validator. That one reads
  `all_assessed_elements_fully_covered`, a verdict the fetcher itself computes
  over whichever elements it currently assesses; if `identity` were ever dropped
  from that element map upstream, the roll-up would go green with the
  placeholder population untouched. This reads the two raw counters directly and
  would not.

# Fenced to the DEPLOYMENT-WIDE `summary` roll-up. Both `summary` and
# `privileged_command_scope` emit an `identity_field_present_events` /
# `identity_meaningful_events` pair, and `summary` is emitted first. The fence
# is TEMPERED so the span cannot run past the end of the summary block into the
# scope block's pair — see splunk_audit_records_carry_non_repudiation_elements
# for why a plain lazy span is not enough.
#
# The two keys are matched as an ADJACENT PAIR because `summarize()` emits them
# adjacently, in that order. If that ever changes the pattern stops matching
# entirely, which the presence rule below turns into a failure — it fails
# closed, not open.
#
# NON-VACUITY, in the regex rather than in a rule: the present-count group is
# `[1-9][0-9]*`, so zero does not match at all. Without it, `0 == 0` on a
# deployment where the search returned nothing would read as perfect identity
# coverage — the exact vacuous pass `scope_is_assessable` exists to stop.
regex: '"summary":\s*\{(?:(?!"privileged_command_scope")[\s\S])*?"identity_field_present_events":\s*(?<identity_field_present_events>[1-9][0-9]*),\s*"identity_meaningful_events":\s*(?<identity_meaningful_events>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]
validation_rules:
  # Presence. Without it a renamed counter leaves both operands undefined, and
  # the engine's `undefined EQUALS undefined` evaluates TRUE — a silent pass on
  # an unreadable payload.
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  # meaningful == present. Both sides parse as numbers, so EQUALS compares them
  # numerically and the numeric/lexicographic ambiguity that rules out the
  # ordering operators does not arise.
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # identity_meaningful_events
    criteria: EQUALS
    value: { type: MATCH_GROUP, groupNumber: 1 }            # identity_field_present_events

evidence_sets:
  - EVD-SPLUNK-AUDIT-EVENT-TYPES
