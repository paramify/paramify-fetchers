key: splunk_audit_indexes_meet_retention
name: Splunk Audit Indexes Meet Searchable Retention
type: AUTOMATED
role: configuration
statement: >-
  Every Splunk index named as holding audit or security data is configured with
  a searchable retention (frozenTimePeriodInSecs) at or above the required
  floor. Substantiates the SIEM capability's claim that 90 days of searchable
  audit information are retained, asserted per index rather than globally.

  Does NOT assert: the 280-day ARCHIVAL half of the same narrative — splunkd
  exposes archival only as a destination (coldToFrozenDir), never as a duration,
  so no archival retention figure is readable from this evidence at all. Nor
  does it assert that the right indexes were named as in scope (see
  splunk_audit_scope_complete), that the floor itself was not lowered (see
  splunk_audit_retention_floor_is_ninety), or that any data is actually being
  written to these indexes — retention is configuration, not proof of ingest.

# Fenced to the `audit_scope` block on purpose. The identical key
# `all_indexes_meet_requirement` also appears in the all-index `summary` earlier
# in the payload, where it is routinely false: Splunk's own internal indexes
# (_internal at 30d, _thefishbucket at 28d) sit below any audit floor by design.
# MATCH_GROUP reads the FIRST match only, so without the fence this validator
# would read the summary figure and fail on every healthy deployment.
regex: '"audit_scope":\s*\{[\s\S]*?"all_indexes_meet_requirement":\s*(?<all_indexes_meet_requirement>true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true
validation_rules:
  # Presence, and load-bearing rather than ceremonial: a MATCH_GROUP comparison
  # over a regex that never matched compares nothing to nothing and evaluates
  # TRUE, so without this rule a renamed audit_scope key reads as compliant.
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-SPLUNK-INDEX-RETENTION
