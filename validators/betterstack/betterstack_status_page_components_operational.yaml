key: betterstack_status_page_components_operational
name: All Status Page Components Operational
type: AUTOMATED
role: configuration
statement: Every component published on the status page reports a current status of operational.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `betterstack_status_page_components_present` is its mandatory
# integrity partner; without it a renamed `status` key reads as zero violations.
#
# The anchor is the `availability` value immediately preceding `status`, which
# is what distinguishes a component's CURRENT status from the several other
# `status` keys in a Better Stack document — every status_history row carries
# one, and so does each affected_resources entry on a status report. A bare
# `"status":` count would read a single downtime day 80 days ago as a live
# outage.
#
# ECMAScript: `g` and `s` are applied, `m` is not. The negative lookahead is
# `(?!operational")` rather than `(?!operational)` so a future status value that
# merely starts with the word is still counted as a violation.
#
# The availability pattern is `[0-9][0-9.eE+-]*` rather than `[0-9.]+` so that
# exponent notation still matches. Python serializes a small float that way, so
# a component at 1e-05 would slip past a digits-and-dots anchor entirely — and
# a component this validator cannot see is a component whose non-operational
# status is never counted. Measured: with `[0-9.]+` a degraded component at
# 1e-05 scored PASS.
regex: '"availability":\s*[0-9][0-9.eE+-]*,\s*"status":\s*"(?!operational")[^"]*"'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-BETTERSTACK-PUBLIC-STATUS-PAGE
