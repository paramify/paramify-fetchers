key: betterstack_status_page_availability_threshold
name: Status Page Availability Meets Baseline
type: AUTOMATED
role: configuration
statement: The status page reports component availability above 0.999.

# THE FIGURE THIS READS IS BETTER STACK'S OWN.
# `availability` is copied into the evidence out of the status page response
# unchanged — the same number the status page UI renders, where 0.999915 reads
# as "99.991% uptime". Neither the fetcher nor this validator recomputes it.
# Better Stack counts HARD DOWNTIME ONLY in that figure: degraded and
# maintenance periods are excluded. See the fetcher's
# evidence_set.instructions.
#
# GENERIC ACROSS STATUS PAGES. The regex anchors on the shape of a
# status_page_resource — `explanation`, then `position`, then `availability` —
# and names no component, so it holds for any customer's page. The
# `component` group captures the resource's `explanation` (the operator-typed
# host, e.g. "app.paramify.com") so a reader can see which component was
# compared; nothing asserts on it.
#
# ECMAScript, not Python: Paramify applies `g` and `s` and never `m`, and
# named groups are `(?<name>…)`. Naming does not renumber anything, so
# `availability` is still groupNumber 2 — `component` is 1.
#
# NOTE FOR WHOEVER TUNES THIS: `MATCH_GROUP` reads the FIRST match only, so
# the rule compares whichever component appears first in the payload rather
# than the weakest one. On status.paramify.com that is Homepage at 1.0, while
# Paramify Platform's 0.999915 is never read. The evidence also carries
# `lowest_reported_availability`, which names the weakest component, if this
# should assert over the whole page instead.
regex: '"explanation":\s*"(?<component>[^"]+)",\s*"position":\s*\d+,\s*"availability":\s*(?<availability>[\d.]+)'
rules_summary: MATCH_GROUP[2] GREATER_THAN 0.999
validation_rules:
  - regexOperation: { type: MATCH_GROUP, groupNumber: 2 }   # availability
    criteria: GREATER_THAN
    value: { type: CUSTOM_TEXT, customText: "0.999" }
    disposition: PASS

# Collection health is asserted once for this set by
# validators/common/collection_succeeded.yaml, which is the set's single
# `completeness` validator and where EVD-BETTERSTACK-PUBLIC-STATUS-PAGE is
# listed. This file carries only the availability assertion.
evidence_sets:
  - EVD-BETTERSTACK-PUBLIC-STATUS-PAGE
