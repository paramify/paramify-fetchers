key: betterstack_status_page_components_present
name: Status Page Components Were Read
type: AUTOMATED
role: integrity
statement: The status page evidence contains at least one published component carrying both a reported availability and a current status, so a zero count of non-operational components reflects posture rather than an unreadable payload.

# Integrity partner to `betterstack_status_page_components_operational`, which
# counts components whose status is not "operational" and passes on zero. That
# validator therefore cannot tell "every component is up" from "the keys I
# search for are gone" — rename `status`, drop the component list, or collect a
# page with no components at all and it reports compliance over nothing.
#
# This one anchors one level up: the `public_name` / `availability` / `status`
# triple of a status_page_resource. Generic by construction — it names no
# component, so it holds for any customer's status page.
#
# The availability pattern matches its partner's exactly, exponent notation
# included. The two have to see the same set of components: if this one could
# read a component that the violation count cannot, the integrity guard would
# stop covering the thing it exists to cover.
regex: '"public_name":\s*"(?<public_name>[^"]*)",\s*"explanation":[\s\S]*?"availability":\s*(?<availability>[0-9][0-9.eE+-]*),\s*"status":\s*"(?<status>[^"]+)"'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-BETTERSTACK-PUBLIC-STATUS-PAGE
