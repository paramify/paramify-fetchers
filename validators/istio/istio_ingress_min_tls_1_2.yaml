key: istio_ingress_min_tls_1_2
name: 'Istio: Ingress TLS 1.2 or Later'
type: AUTOMATED
role: configuration
statement: >
  No Istio Gateway server allows a minimum TLS version below 1.2 (gateway_servers_weak_tls is empty); a
  server with no minimum set uses Istio's default of 1.2. Supports KSI-SVC-SIN. Does not check whether the
  collection run succeeded.

regex: '"gateway_servers_weak_tls":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-ISTIO-MESH-SECURITY
