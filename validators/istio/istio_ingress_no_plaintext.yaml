key: istio_ingress_no_plaintext
name: 'Istio: No Plaintext Ingress'
type: AUTOMATED
role: configuration
source: community
statement: >
  No Istio Gateway server takes HTTP or TCP without TLS and without an HTTPS redirect
  (gateway_servers_plaintext is empty). Covers Istio Gateways only, not other ingress paths. Does not
  check whether the collection run succeeded.

regex: '"gateway_servers_plaintext":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-ISTIO-MESH-SECURITY
