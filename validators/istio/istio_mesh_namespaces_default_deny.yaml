key: istio_mesh_namespaces_default_deny
name: 'Istio: In-Mesh Namespaces Deny by Default'
type: AUTOMATED
role: configuration
source: community
statement: >
  Every in-mesh namespace is covered by an allow-nothing AuthorizationPolicy, its own or the mesh-wide one
  (namespaces_in_mesh_without_default_deny is empty), so requests are denied unless a policy allows them.
  Configuration evidence: it does not show requests actually denied. Does not check whether the collection
  run succeeded.

regex: '"namespaces_in_mesh_without_default_deny":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-ISTIO-MESH-SECURITY
