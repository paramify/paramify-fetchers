key: istio_no_allow_all_policies
name: 'Istio: No Allow-All Authorization Rules'
type: AUTOMATED
role: configuration
statement: >
  No ALLOW AuthorizationPolicy has an empty rule, which would match every request to the workloads it
  selects (authorization_policies_allowing_all is empty). Supports KSI-CNA-MAT and KSI-IAM-ELP. Does not
  check whether the collection run succeeded.

regex: '"authorization_policies_allowing_all":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-ISTIO-MESH-SECURITY
