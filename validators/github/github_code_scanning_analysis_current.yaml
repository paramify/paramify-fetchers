key: github_code_scanning_analysis_current
name: GitHub Code Scanning Analysis Current
type: AUTOMATED
role: configuration
source: community
statement: >-
  No repository's newest default-branch analysis is older than the configured maximum age. Passes with
  nothing to judge for a repository never analysed; pair with GitHub Code Scanning Covers All Repositories.
regex: '"repositories_analysis_stale":\s*\[\s*\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-CODE-SCANNING
