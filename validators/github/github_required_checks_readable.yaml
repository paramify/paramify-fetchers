key: github_required_checks_readable
name: GitHub Required Checks Readable
type: AUTOMATED
role: integrity
source: community
statement: >-
  The required checks of every repository in scope were read. A repository whose required checks could
  not be read fails, because its merges cannot be judged against them.
regex: '"required_checks_unreadable":\s*\[\s*\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-PR-CHECKS
