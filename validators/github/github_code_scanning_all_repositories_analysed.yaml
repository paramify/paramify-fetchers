key: github_code_scanning_all_repositories_analysed
name: GitHub Code Scanning Covers All Repositories
type: AUTOMATED
role: configuration
source: community
statement: >-
  Every repository in scope has at least one code scanning analysis on its default branch, from any tool.
  A repository where code scanning is unavailable or was never run fails.
regex: '"repositories_not_analysed":\s*\[\s*\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-CODE-SCANNING
