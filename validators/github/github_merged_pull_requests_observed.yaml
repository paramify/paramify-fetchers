key: github_merged_pull_requests_observed
name: GitHub Merged Pull Requests Observed
type: AUTOMATED
role: completeness
source: community
statement: >-
  At least one pull request merged into a default branch in the window was read, so the review checks
  judge real merges. A window with no merges fails rather than passing with nothing to judge.
regex: '"merged_pull_requests":\s*(?<merged_pull_requests>[1-9]\d*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-PR-CHECKS
