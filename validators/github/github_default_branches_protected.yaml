key: github_default_branches_protected
name: GitHub Default Branches Protected
type: AUTOMATED
role: configuration
source: community
statement: >-
  Every repository in scope has at least one rule enforced on its default branch, from an active ruleset
  or classic branch protection. Does not assert which rules.
regex: '"unprotected":\s*\[\s*\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-BRANCH-PROTECTION
