key: github_production_requires_reviewers
name: GitHub Production Environments Require Reviewers
type: AUTOMATED
role: configuration
source: community
statement: >-
  Every production environment requires a named reviewer to approve a deployment before it runs.
regex: '"production_without_required_reviewers":\s*\[\s*\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-DEPLOYMENT-CONTROLS
