key: github_default_branches_require_status_checks
name: GitHub Default Branches Require Status Checks
type: AUTOMATED
role: configuration
source: community
statement: >-
  Every repository in scope requires at least one status check to pass before a change reaches its default
  branch. Does not assert which checks are required or that they test anything.
regex: '"without_status_checks":\s*\[\s*\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-BRANCH-PROTECTION
