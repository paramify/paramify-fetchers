key: github_merges_passed_required_checks
name: GitHub Merges Passed Required Checks
type: AUTOMATED
role: configuration
source: community
statement: >-
  No pull request merged in the window had a required check failing or missing on its merged commit. Passes
  with nothing to judge when no check is required; pair with GitHub Default Branches Require Status Checks.
regex: '"merged_with_failed_required_checks":\s*(?<merged_with_failed_required_checks>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
- regexOperation:
    type: MATCH_GROUP
    groupNumber: 1
  criteria: EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-PR-CHECKS
