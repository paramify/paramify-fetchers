key: github_production_restricts_deployment_branches
name: GitHub Production Environments Restrict Branches
type: AUTOMATED
role: configuration
source: community
statement: >-
  No production environment accepts deployments from any branch: each limits them to protected or named
  branches or tags.
regex: '"production_deployable_from_any_branch":\s*\[\s*\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
evidence_sets:
- EVD-GITHUB-DEPLOYMENT-CONTROLS
