key: github_default_branches_require_signed_commits
name: GitHub Default Branches Require Signed Commits
type: AUTOMATED
role: configuration
source: community
statement: >-
  Every repository in scope requires signed commits on its default branch: the count requiring them equals
  the count of repositories read. Does not assert whose keys sign.
regex: '"repositories_total":\s*(?<repositories_total>\d+)[\s\S]*?"requiring_signed_commits":\s*(?<requiring_signed_commits>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[2] EQUALS MATCH_GROUP[1]
validation_rules:
- regexOperation:
    type: MATCH_COUNT
  criteria: NOT_EQUALS
  value:
    type: CUSTOM_TEXT
    customText: '0'
- regexOperation:
    type: MATCH_GROUP
    groupNumber: 2
  criteria: EQUALS
  value:
    type: MATCH_GROUP
    groupNumber: 1
evidence_sets:
- EVD-GITHUB-BRANCH-PROTECTION
