key: oci_no_unconditional_any_principal_grants
name: OCI No Unconditional any-user or any-group Grants
type: AUTOMATED
role: configuration
statement: >
  No active policy statement grants any-user or any-group a permission without
  a where clause. Oracle's own managed service policies use any-user with a
  narrowly conditioned clause, and those are counted apart as conditional;
  only a grant with no condition at all fails here. Pair with
  oci_policy_inventory_present. Fails when any such statement exists, and when
  the summary key is renamed.
regex: '"unconditional_any_principal_statements":\s*(?<unconditional_any_principal_statements>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-IAM-POLICIES
