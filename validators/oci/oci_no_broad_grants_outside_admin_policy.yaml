key: oci_no_broad_grants_outside_admin_policy
name: OCI No manage all-resources Grants Outside the Default Admin Policy
type: AUTOMATED
role: configuration
statement: >
  No active policy statement other than Oracle's default Tenant Admin Policy
  grants `manage all-resources in tenancy`. The default policy is recognised
  by what it is — in the tenancy root, holding exactly Oracle's one default
  statement — not by its name, so renaming a broad policy does not exempt it.
  Does NOT assert anything about compartment-scoped manage grants, which the
  evidence counts separately. Pair with oci_policy_inventory_present. Fails
  when any such statement exists, and when the summary key is renamed.
regex: '"manage_all_resources_in_tenancy_outside_default_admin_policy":\s*(?<manage_all_resources_in_tenancy_outside_default_admin_policy>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-IAM-POLICIES
