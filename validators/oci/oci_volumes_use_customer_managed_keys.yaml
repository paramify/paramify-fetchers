key: oci_volumes_use_customer_managed_keys
name: OCI Volumes Encrypted With Customer-Managed Keys
type: AUTOMATED
role: configuration
statement: >
  Every live block and boot volume is encrypted under a key the customer holds
  in Vault rather than one Oracle manages. OCI encrypts every volume at rest
  regardless, so this asserts control of the key, which is what lets the
  customer revoke access to the bytes. Does NOT assert anything about backups
  or in-transit encryption; both are in the evidence beside it. Pair with
  oci_volume_inventory_present. Fails when any volume uses an Oracle-managed
  key, and when the summary key is renamed.
regex: '"volumes_with_oracle_managed_key":\s*(?<volumes_with_oracle_managed_key>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-BLOCK-VOLUME-ENCRYPTION
