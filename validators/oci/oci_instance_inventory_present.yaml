key: oci_instance_inventory_present
name: OCI Instance Inventory Present
type: AUTOMATED
role: integrity
statement: >
  At least one live compute instance was collected. Its partner concludes from
  a zero — no instance with the legacy metadata endpoint — and a zero is
  equally what an empty collection produces. Does NOT assert anything about
  posture. Fails when the summary key is renamed and when the scope holds no
  instance.
regex: '"total_instances":\s*(?<total_instances>[1-9][0-9]*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-COMPUTE-INSTANCES
