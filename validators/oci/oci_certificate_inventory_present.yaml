key: oci_certificate_inventory_present
name: OCI Certificate Inventory Present
type: AUTOMATED
role: integrity
statement: >
  At least one certificate was collected. Its partner concludes from a zero —
  no certificate needing manual renewal — and a zero is equally what an empty
  collection produces. Does NOT assert anything about posture. Fails when the
  summary key is renamed and when the tenancy genuinely holds none.
regex: '"total_certificates":\s*(?<total_certificates>[1-9][0-9]*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-CERTIFICATES
