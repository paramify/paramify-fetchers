key: oci_bastions_restrict_client_ips
name: OCI Bastions Restrict Client IPs
type: AUTOMATED
role: configuration
statement: >
  No bastion admits connections from the whole internet. An empty allow-list
  counts as open — OCI reads no allow-list as no restriction — and so does any
  set of entries that together cover the address space, such as 0.0.0.0/1 plus
  128.0.0.0/1. Judged over bastions whose detail was read; pair with
  oci_bastion_detail_read and oci_bastion_inventory_present. Fails when the
  summary key is renamed.
regex: '"bastions_open_to_any_client_ip":\s*(?<bastions_open_to_any_client_ip>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-BASTION-JIT
