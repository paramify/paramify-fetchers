key: oci_instances_disable_legacy_metadata_endpoint
name: OCI Instances Disable the Legacy Metadata Endpoint
type: AUTOMATED
role: configuration
statement: >
  No live instance still serves the IMDSv1-style legacy metadata endpoint,
  which hands instance credentials to any process that can reach
  169.254.169.254 without a token. Counts an instance only when the setting is
  explicitly false; an absent setting is reported in
  instances_with_unknown_metadata_endpoint_setting rather than passed. Does
  NOT assert secure boot or public exposure, which the evidence reports
  separately. Pair with oci_instance_inventory_present. Fails when any
  instance keeps the legacy endpoint, and when the summary key is renamed.
regex: '"instances_with_legacy_metadata_endpoint":\s*(?<instances_with_legacy_metadata_endpoint>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-COMPUTE-INSTANCES
