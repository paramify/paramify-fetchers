key: oci_change_categories_all_monitored
name: OCI All Change Categories Monitored by an Events Rule
type: AUTOMATED
role: configuration
statement: >
  Every one of the twelve change categories CIS and Prowler expect an Events
  rule for — IAM policy, group, user, identity provider and IdP mapping
  changes, local authentication, VCN, route table, security list, NSG and
  gateway changes, and Cloud Guard problems — is matched by at least one
  enabled, ACTIVE rule. Wildcard and single-string conditions count, as Oracle
  defines them. Does NOT assert that the rule reaches a person;
  notifying_change_categories and active_rules_notifying_nobody carry that.
  Fails when any category is unmonitored (the list is non-empty), and when the
  summary key is renamed.
regex: '"unmonitored_change_categories":\s*\[\]'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-AUDIT-LOGGING-EVENTS
