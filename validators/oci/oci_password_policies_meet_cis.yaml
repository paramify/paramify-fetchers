key: oci_password_policies_meet_cis
name: OCI Password Policies Meet the CIS Thresholds
type: AUTOMATED
role: configuration
statement: >
  Every identity domain's own password policy — Oracle's Standard and Simple
  templates excluded, as Prowler excludes them — requires at least 14
  characters, remembers at least 24 previous passwords and expires passwords
  within 365 days. The fetcher writes false when any policy misses a threshold
  AND when no policy was evaluated at all, so the validator carries its own
  integrity: a run that read no domain cannot pass it. Does NOT assert
  lockout, which is reported beside it. Fails when the summary key is renamed.
regex: '"all_policies_meet_cis":\s*(?<all_policies_meet_cis>true)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-IAM-PASSWORD-POLICY
