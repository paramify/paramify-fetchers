key: oci_volume_inventory_present
name: OCI Volume Inventory Present
type: AUTOMATED
role: integrity
statement: >
  At least one live block or boot volume was collected. Its partner concludes
  from a zero — no volume under an Oracle-managed key — and a zero is equally
  what an empty collection produces. Does NOT assert anything about posture.
  Fails when the summary key is renamed and when the scope genuinely holds no
  volume.
regex: '"total_volumes":\s*(?<total_volumes>[1-9][0-9]*)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-OCI-BLOCK-VOLUME-ENCRYPTION
