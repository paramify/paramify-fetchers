key: gcp_sa_key_expiry_flags_present
name: GCP Service Account Key Expiry Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Per-key expiry flags are present in the evidence, so a zero count of
  never-expiring keys reflects posture rather than an unreadable payload. Does
  not assert what any flag's value is.

# Integrity partner to `gcp_sa_no_never_expiring_keys`. Anchors one level up from
# the violation: that validator counts `"never_expires": true`, this one proves
# the `never_expires` key exists at all, on any key, with any value.
regex: '"never_expires":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-IAM-SA
