key: gcp_gcs_uniform_access_flag_recorded
name: Cloud Storage Uniform Access Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Per-bucket uniform bucket-level access flags are present in the evidence with
  a boolean value, so a zero count of non-uniform buckets reflects posture
  rather than an unreadable payload. Does NOT assert what those flags say.

# Integrity partner to `gcp_gcs_uniform_bucket_level_access_enforced`. Anchors
# one level up from the violation: that validator counts the value `false`,
# this one proves the key exists AND still carries a bare boolean — a value
# reshaped to a string or an object would silence the violation regex too.
# It also fails on a project reporting zero buckets, where there is no posture
# to read.
regex: '"uniform_bucket_level_access":\s*(?:true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-STORAGE-ENC
