key: gcp_lbtls_no_weak_ssl_policy_minimums
name: No Weak Minimum TLS Version In GCP SSL Policies
type: AUTOMATED
role: configuration
statement: >
  No SSL policy defined in the project sets a minimum TLS version below 1.2. This
  covers policies that are defined but not currently attached to any front end,
  which the per-proxy check cannot see and which become a live weakness the moment
  someone attaches one. Does not assert that a policy is attached, that its cipher
  profile is strong, or that every proxy uses one.

# INVERTED POLARITY: zero is compliant.
#
# WHY THIS IS NOT A DUPLICATE OF `gcp_lbtls_no_proxy_below_tls_floor`. That one
# reads the version each proxy actually negotiates; this one reads the versions
# the project has DEFINED. The two diverge in both directions: a weak policy
# attached to nothing fails here and passes there, and a proxy inheriting GCP's
# TLS 1.0 default fails there while every defined policy here is clean. The live
# evidence these were authored from is exactly that shape — one weak policy sitting
# unattached, and one proxy weak by inheritance from a policy that does not exist.
#
# `"min_tls_version":` matches only the per-policy field. The leading quote keeps
# it off the proxy field `effective_min_tls_version` and off the summary rollups
# `default_min_tls_version_when_no_policy` / `ssl_policy_min_tls_versions`, where
# the same characters appear but never after a quote.
#
# Bad values enumerated, not compared — see the note in
# gcp_lbtls_no_proxy_below_tls_floor. `null` is a violation because the fetcher's
# own floor test treats an unreadable version as below the floor.
regex: '"min_tls_version":\s*(?:"TLS_1_0"|"TLS_1_1"|null)'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

# Counts violations, so it CANNOT guard itself.
# `gcp_lbtls_ssl_policy_minimum_version_present` is its mandatory integrity
# partner; without it a renamed `min_tls_version` key reads as zero weak policies.
evidence_sets:
  - EVD-GCP-LB-TLS
