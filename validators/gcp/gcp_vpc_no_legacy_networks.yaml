key: gcp_vpc_no_legacy_networks
name: No Legacy GCP VPC Networks
type: AUTOMATED
role: configuration
statement: >
  No VPC network in the project is a legacy (pre-subnet) network. A legacy
  network carries a single flat IPv4 range with no subnets, so it cannot be
  regionally segmented, cannot carry Private Google Access and cannot carry VPC
  flow logs at all. Does not assert that the remaining networks are segmented
  well — only that none of them is structurally incapable of segmentation.

# INVERTED POLARITY: zero is compliant. The regex matches only the bad state.
#
# Per-network assertion, so it cannot use MATCH_GROUP (which reads the first
# match only) — it is inverted into a violation count, which means it CANNOT
# guard itself: zero matches is its pass condition.
# `gcp_vpc_network_legacy_flags_present` is its mandatory integrity partner;
# without it a renamed `legacy` key reads as zero legacy networks and this
# validator reports compliance on an unreadable payload.
#
# The trailing quote-colon in the anchor keeps it off the sibling key
# `legacy_ipv4_range`.
regex: '"legacy":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-VPC-CONFIG
