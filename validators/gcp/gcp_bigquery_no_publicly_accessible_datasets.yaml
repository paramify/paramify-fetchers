key: gcp_bigquery_no_publicly_accessible_datasets
name: No Publicly Accessible BigQuery Datasets
type: AUTOMATED
role: configuration
statement: >
  No individual BigQuery dataset is flagged publicly accessible — that flag is
  set when the dataset ACL names allUsers or allAuthenticatedUsers, matched
  exactly rather than by substring. The per-dataset counterpart to the rollup in
  `gcp_bigquery_non_public_dataset_coverage_complete`. Does NOT assert that the
  remaining ACL entries are least-privilege, only that none of them is public.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `gcp_bigquery_public_access_flags_present` is its mandatory
# integrity partner; without it a renamed per-dataset flag reads as zero public
# datasets. The key is matched with its closing quote, so the summary rollup
# `publicly_accessible_datasets` cannot satisfy this pattern.
regex: '"publicly_accessible":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-BIGQUERY-CONFIG
