key: gcp_secret_rotation_flags_present
name: Secret Manager Rotation Overdue Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Per-secret rotation-overdue flags are present in the evidence and still carry a
  boolean, so a zero count of overdue rotations reflects secrets that were
  examined rather than an empty or unreadable population. Does NOT assert what
  those flags say, nor that any secret has a rotation schedule.

# Integrity partner to `gcp_secret_no_overdue_rotation`. That validator reads a
# summary rollup, so it catches its own key being renamed — but a rollup of zero
# is also what an empty `secrets` list produces, and no rollup rule can tell the
# two apart. This anchors the per-secret field the rollup is computed from, so
# "no overdue rotations" means secrets were read and none had lapsed.
regex: '"rotation_overdue":\s*(?:true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-SECRETMGR-CONFIG
