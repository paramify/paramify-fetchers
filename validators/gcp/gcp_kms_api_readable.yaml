key: gcp_kms_api_readable
name: Cloud KMS API Was Readable
type: AUTOMATED
role: integrity
statement: >
  The Cloud KMS API answered for this project, so the key and key-ring counts in
  this evidence are a real population rather than the empty result of a disabled
  or unreadable service.

# The broad integrity guard for the whole set, and the reason it is not redundant
# with collection health: the fetcher exits 0 when the KMS API is disabled on a
# project, so `collection_succeeded` sees an intact envelope while every
# count-based validator on this set reads its violations as zero and passes. That
# is the "uncountable must never read as zero" failure at the service level rather
# than the field level.
#
# Today the rotation rollup also catches it (coverage_percentage returns 0 for an
# empty denominator), but that is incidental: a refactor treating an empty project
# as vacuously 100% compliant would silently green the whole set. This asserts the
# fact directly instead of relying on that coincidence.
#
# Form A, so it guards itself — a renamed key drops MATCH_COUNT to 0 and fails.
regex: '"kms_api_readable":\s*(?<kms_api_readable>true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-GCP-KMS-KEYS
