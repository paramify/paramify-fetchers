key: gcp_lbtls_default_ssl_policy_flag_present
name: GCP Load Balancer Default SSL Policy Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Every load balancer proxy record in the evidence carries the flag saying whether
  it runs on GCP's default SSL policy, so a zero count of unpinned front ends
  reflects posture rather than an unreadable payload. Does not assert what any
  flag's value is.

# Integrity partner to `gcp_lbtls_no_proxy_on_default_ssl_policy`. Anchors on the
# key that validator counts: it matches `"uses_default_ssl_policy": true`, this
# one proves the key exists at all, on any proxy, with either value.
#
# BOUNDARY: as with the other proxy-scoped integrity check, a project with no
# HTTPS/SSL load balancers has no proxy records and this fails — "nothing to
# measure", not "posture is bad".
regex: '"uses_default_ssl_policy":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-LB-TLS
