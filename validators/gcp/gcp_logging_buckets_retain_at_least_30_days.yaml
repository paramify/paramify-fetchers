key: gcp_logging_buckets_retain_at_least_30_days
name: Log Buckets All Retain At Least 30 Days
type: AUTOMATED
role: configuration
statement: >
  No Cloud Logging bucket in the project retains logs for fewer than 30 days,
  so no bucket has been shortened below the platform default. Does NOT assert
  that 30 days satisfies any particular framework's audit-retention period (the
  immutable `_Required` bucket is what carries the long tail), that retention is
  locked against later shortening, or anything about where the logs are copied.

# Form B (counts violations), so it CANNOT guard itself — zero matches is its
# pass condition. `gcp_logging_bucket_retention_days_present` is its mandatory
# integrity partner; without it a renamed `retention_days` key reads as zero
# short-retention buckets and this validator reports compliance on evidence that
# proves nothing. No exit_code anchor — collection health is asserted once for
# the set by `collection_succeeded`.
#
# THE THRESHOLD LIVES IN THE REGEX. It matches only values BELOW the floor:
# `\d` covers 0-9 and `[12]\d` covers 10-29, and the `(?![\d.])` lookahead stops
# it biting the first digits of a longer number (without it, "400" would match
# on "4" and every compliant bucket would read as a violation). Verified at the
# boundary: 29 matches, 30 does not.
#
# The leading quote in `"retention_days"` keeps the summary rollups
# `shortest_retention_days` / `longest_retention_days` out of the count — those
# are one number for the whole project, not per-bucket postures.
regex: '"retention_days":\s*(?:\d|[12]\d)(?![\d.])'
rules_summary: MATCH_COUNT EQUALS 0 (the < 30 threshold is encoded in the regex)
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-LOGGING-CONFIG
