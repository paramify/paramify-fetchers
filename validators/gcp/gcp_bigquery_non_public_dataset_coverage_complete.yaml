key: gcp_bigquery_non_public_dataset_coverage_complete
name: BigQuery Non-Public Dataset Coverage Is Total
type: AUTOMATED
role: configuration
statement: >
  Every BigQuery dataset in the project is non-public: the rollup reports 100% of
  datasets with no ACL grant to allUsers or allAuthenticatedUsers. Does NOT assert
  anything about who else is on the ACL, about customer-managed encryption keys,
  or about table expiration — BigQuery is always encrypted at rest and key
  custody and retention are tenant choices, not this control.

# Reads a value, so it guards itself: the MATCH_COUNT rule proves the rollup was
# present before the threshold rule reads it. No exit_code anchor — collection
# health is asserted once for the set by `collection_succeeded`.
#
# The fetcher computes this percentage as (datasets - public) / datasets with
# integer math that yields 0 when the project has no datasets, so a project with
# nothing to measure FAILS here rather than passing vacuously. That is deliberate:
# an evidence set that proves no posture should not read as compliant.
regex: '"non_public_dataset_percentage":\s*(?<non_public_dataset_percentage>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 100
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "100" }

evidence_sets:
  - EVD-GCP-BIGQUERY-CONFIG
