key: gcp_secret_no_publicly_accessible_secrets
name: No Publicly Accessible Secret Manager Secrets
type: AUTOMATED
role: configuration
statement: >
  No individual Secret Manager secret is flagged publicly accessible — that flag
  is set when the secret's own IAM policy names allUsers or allAuthenticatedUsers,
  matched exactly rather than by substring. The per-secret counterpart to the
  rollup in `gcp_secret_non_public_coverage_complete`. Does NOT assert that the
  remaining bindings are least-privilege, and does not see project-level or
  folder-level grants.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `gcp_secret_public_access_flags_present` is its mandatory integrity
# partner; without it a renamed per-secret flag reads as zero public secrets.
#
# WHY THE BOOLEAN AND NOT `public_access_members`. The obvious anchor is the
# member list, but it is an EMPTY LIST on a clean project, so a pattern over its
# contents matches nothing whether the project is clean or the key was renamed —
# the two states are indistinguishable to a violation counter. The boolean is
# derived from the same bindings and its integrity partner can prove it was read.
#
# The key is matched with its closing quote, so the summary rollup
# `publicly_accessible_secrets` cannot satisfy this pattern.
regex: '"publicly_accessible":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-SECRETMGR-CONFIG
