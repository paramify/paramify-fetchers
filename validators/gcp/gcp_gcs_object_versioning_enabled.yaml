key: gcp_gcs_object_versioning_enabled
name: Cloud Storage Buckets All Have Object Versioning Enabled
type: AUTOMATED
role: configuration
statement: >
  No Cloud Storage bucket in the project has object versioning disabled, so an
  overwritten or deleted object can be recovered from a noncurrent version
  (KSI-RPL-ABO). Does NOT assert a retention or lifecycle policy on those
  noncurrent versions, nor that any copy exists outside the bucket.

# Counts violations, so it CANNOT guard itself. Mandatory integrity partner:
# `gcp_gcs_versioning_flag_recorded`.
regex: '"versioning_enabled":\s*false'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-STORAGE-ENC
