key: gcp_sa_keys_within_rotation_age
name: GCP Service Account Keys Are Within Rotation Age
type: AUTOMATED
role: configuration
statement: >
  No user-managed service account key has aged past the rotation interval the
  fetcher measures against — neither the project rollup nor any individual
  service account reports a key past that age. Does not assert what the rotation
  interval is set to, and says nothing about system-managed keys, which Google
  rotates.

# INVERTED POLARITY: zero is compliant; any positive count is a stale key.
#
# `user_managed_keys_past_rotation_age` appears BOTH in payload.summary and on
# every service account, and the per-account copies come first in the file. A
# MATCH_GROUP form would therefore read the first service account's count and
# silently ignore the rest — the first-match trap. Counting the non-zero form
# instead covers the rollup and every account at once, with the threshold
# encoded in the regex rather than left to an undocumented numeric comparison.
#
# Violation-count form, so it cannot guard itself:
# `gcp_sa_key_rotation_age_counts_present` is its mandatory integrity partner.
regex: '"user_managed_keys_past_rotation_age":\s*[1-9][0-9]*'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-IAM-SA
