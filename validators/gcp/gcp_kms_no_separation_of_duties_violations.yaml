key: gcp_kms_no_separation_of_duties_violations
name: No Cloud KMS Key Combines Admin And Use Roles
type: AUTOMATED
role: configuration
statement: >
  No Cloud KMS key or key ring grants the same principal both an administrative
  role (roles/cloudkms.admin) and a cryptographic-use role, so whoever manages a
  key cannot also use it. It asserts nothing about whether the admin and use
  roles are each scoped to the right people.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `gcp_kms_separation_of_duties_flags_present` is its mandatory
# integrity partner; without it a renamed upstream key reads as zero violations.
regex: '"separation_of_duties_violated":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-KMS-KEYS
