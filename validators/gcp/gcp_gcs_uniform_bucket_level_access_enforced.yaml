key: gcp_gcs_uniform_bucket_level_access_enforced
name: Cloud Storage Buckets All Enforce Uniform Bucket-Level Access
type: AUTOMATED
role: configuration
statement: >
  No Cloud Storage bucket in the project leaves uniform bucket-level access
  disabled, so object access is governed by IAM alone and cannot be widened by
  per-object ACLs. Does NOT assert that the IAM policy itself is least
  privilege, nor anything about encryption keys.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `gcp_gcs_uniform_access_flag_recorded` is its mandatory integrity
# partner; without it a renamed `uniform_bucket_level_access` key reads as zero
# violations. No exit_code anchor — collection health is asserted once for the
# set by `collection_succeeded`.
regex: '"uniform_bucket_level_access":\s*false'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-STORAGE-ENC
