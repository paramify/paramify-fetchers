key: gcp_gke_shielded_nodes_flag_recorded
name: GKE Shielded Nodes Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Each cluster in the evidence carries a shielded-nodes flag, so a zero count of
  clusters with shielded nodes off reflects the collected posture rather than a
  payload the regex could no longer read. Says nothing about the flag's value.

# Integrity partner to `gcp_gke_shielded_nodes_enabled`. That validator counts
# '"shielded_nodes_enabled": false' and passes on zero matches; this one proves
# the key exists at all. Deliberately matches the key with ANY value, so it holds
# on a non-compliant-but-readable payload and fails only on drift.
regex: '"shielded_nodes_enabled":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-GKE-CONFIG
