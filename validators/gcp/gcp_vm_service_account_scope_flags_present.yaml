key: gcp_vm_service_account_scope_flags_present
name: GCP Compute Instance Service Account Scope Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Each instance's attached service account carries both the
  default-service-account flag and the full-API-access flag, so a zero count of
  instances pairing the two reflects posture rather than an unreadable payload.
  Does NOT assert what either flag's value is — that is
  `gcp_vm_no_default_sa_with_full_api_access`.

# Integrity partner to `gcp_vm_no_default_sa_with_full_api_access`, and it
# deliberately mirrors that validator's fence and key ordering: it proves BOTH
# keys are present in the SAME service-account record, which is precisely the
# structure the violation counter reads. Anchoring on only one of the two, or on
# the per-instance rollup `default_service_account_with_full_api_access`, would
# leave the false pass open — the rollup is computed from these same flags, so a
# rename drives it to false and it stays present, and the violation counter would
# still report zero.
#
# The `"total_instances":\s*0` branch keeps a project with no Compute instances
# from failing: there are no service-account records to read, and that is the
# most compliant posture there is, not a drifted payload.
#
# BOUNDARY: a project where EVERY instance runs with no service account attached
# would also have no records to read and would fail here. That posture is
# recorded separately as `instances_without_service_account` and is rare enough
# to be worth the loud failure rather than a wider anchor that stops proving the
# structure.
regex: '"default_compute_service_account":\s*(?:true|false)[^}]*?"full_api_access":\s*(?:true|false)|"total_instances":\s*0(?![0-9])'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-VM-CONFIG
