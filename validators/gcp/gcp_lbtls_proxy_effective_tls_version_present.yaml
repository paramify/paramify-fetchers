key: gcp_lbtls_proxy_effective_tls_version_present
name: GCP Load Balancer Proxy Effective TLS Version Was Read
type: AUTOMATED
role: integrity
statement: >
  Every load balancer proxy record in the evidence carries a resolved effective
  minimum TLS version, so a zero count of weak proxies reflects posture rather
  than an unreadable payload. Does not assert what any version is.

# Integrity partner to `gcp_lbtls_no_proxy_below_tls_floor`. Anchors on the key
# that validator counts: it matches `"effective_min_tls_version": "TLS_1_0"` and
# friends, this one proves `effective_min_tls_version` exists at all, on any
# proxy, with any value — including null.
#
# `"effective_min_tls_version":` cannot collide with the summary rollup
# `default_min_tls_version_when_no_policy`, nor with the per-policy
# `min_tls_version`: the leading quote pins the whole key name.
#
# BOUNDARY: a project with no HTTPS/SSL load balancers at all has no proxy
# records, so this validator fails on genuinely-empty evidence. That is the same
# trade every count-based set makes — it fails loudly rather than reporting a
# vacuous pass — but read it as "nothing to measure", not "posture is bad".
regex: '"effective_min_tls_version":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-LB-TLS
