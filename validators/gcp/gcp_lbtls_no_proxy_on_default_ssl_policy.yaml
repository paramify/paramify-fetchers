key: gcp_lbtls_no_proxy_on_default_ssl_policy
name: No GCP Load Balancer Proxy Left On The Default SSL Policy
type: AUTOMATED
role: configuration
statement: >
  Every HTTPS and SSL load balancer front end in the project has an SSL policy
  explicitly attached, so none of them falls through to GCP's unmanaged default.
  Does not assert that the attached policy is any good — that is what the two
  minimum-version checks are for — only that the project's TLS posture is pinned
  by something the project owns.

# INVERTED POLARITY: zero is compliant. A proxy with no SSL policy is the
# violation.
#
# WHY THIS IS A SEPARATE ASSERTION FROM THE TLS FLOOR. Today GCP's default is
# TLS 1.0 + COMPATIBLE, so a proxy on the default also trips
# `gcp_lbtls_no_proxy_below_tls_floor` — but that coupling is Google's choice, not
# the project's. If the default were raised tomorrow, the floor check would go
# green while every front end's cipher and version posture still depended on a
# setting outside the project's control. This validator asserts the practice that
# makes the floor check durable: the posture is declared, not inherited.
regex: '"uses_default_ssl_policy":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

# Counts violations, so it CANNOT guard itself.
# `gcp_lbtls_default_ssl_policy_flag_present` is its mandatory integrity partner;
# without it a renamed `uses_default_ssl_policy` key reads as zero unpinned
# proxies.
evidence_sets:
  - EVD-GCP-LB-TLS
