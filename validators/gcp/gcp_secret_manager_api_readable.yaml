key: gcp_secret_manager_api_readable
name: Secret Manager API Was Readable
type: AUTOMATED
role: integrity
statement: >
  The Secret Manager API answered for this project, so the secret and version
  counts in this evidence are a real population rather than the empty result of a
  disabled or unreadable service. Does NOT assert anything about the secrets
  themselves.

# The broad integrity guard for the whole set, and the reason it is not redundant
# with collection health: the fetcher records a project whose Secret Manager API
# is disabled as NOT READABLE and exits 0, so `collection_succeeded` sees an
# intact envelope while every count-based validator on this set reads its
# violations as zero. That is "uncountable must never read as zero" at the
# service level rather than the field level, and it names the cause — "we could
# not look" is a different finding from "we looked and the posture is bad".
#
# Form A, so it guards itself: a renamed key drops MATCH_COUNT to 0 and fails,
# and a `false` value fails the group rule.
regex: '"secret_manager_api_readable":\s*(?<secret_manager_api_readable>true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-GCP-SECRETMGR-CONFIG
