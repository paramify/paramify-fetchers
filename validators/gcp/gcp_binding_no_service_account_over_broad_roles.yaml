key: gcp_binding_no_service_account_over_broad_roles
name: No Service Account Is Granted An Over-Broad Role In The Project IAM Policy
type: AUTOMATED
role: configuration
statement: >
  No binding in the project IAM policy grants a primitive or administrative
  project role — roles/owner, roles/editor and the like — to a service account.
  A non-human identity holding a project-wide write role is a standing
  privilege-escalation path, and unlike a human owner it has no operational
  justification a project cannot do without. Does NOT assert that no HUMAN holds
  roles/owner (a project requires an owner, so that is not a finding on its own),
  does not judge least privilege within the narrower roles that remain, and does
  not cover folder- or organization-level bindings, which this fetcher does not
  collect.

# INVERTED POLARITY: zero is compliant; each such binding is a violation.
#
# A per-binding assertion across a list, which MATCH_GROUP cannot express (it
# reads the first match only), so it is inverted into a violation count and
# therefore CANNOT guard itself.
# `gcp_binding_service_account_role_flags_present` is its mandatory integrity
# partner.
#
# Anchored on the fetcher's per-binding flag, which already encodes both halves
# of the finding (the role is over-broad AND a service account is among its
# members) — reconstructing that from role names and member prefixes in one
# regex would have to span two keys of the same object and could splice across
# neighbouring bindings.
#
# The leading quote keeps this off the neighbouring `over_broad_role` key, which
# is the role-breadth flag alone and carries no service-account condition.
regex: '"service_account_granted_over_broad_role":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-IAM-BINDINGS
