key: gcp_dns_zone_signing_strength_flags_present
name: Cloud DNS Zone Signing-Strength Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Per-zone signing-strength flags are present in the evidence, so a zero count of
  RSASHA1 zones reflects posture rather than an unreadable payload. Does not
  assert what any flag's value is. Correctly fails on a project with no managed
  zones at all: there is then no population to read, and the evidence proves
  nothing about the control in either direction.

# Integrity partner to `gcp_dns_no_weak_signing_algorithm_zones`. Anchors one
# level up from the violation: that validator counts
# `"uses_weak_signing_algorithm": true`, this one proves the key exists at all,
# on any zone, with any value. The fetcher emits it for every zone regardless of
# DNSSEC state, so it is a stable anchor even when nothing is signed.
regex: '"uses_weak_signing_algorithm":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-DNS
