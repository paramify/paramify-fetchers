key: gcp_sa_key_rotation_age_counts_present
name: GCP Service Account Key Rotation Age Counts Were Read
type: AUTOMATED
role: integrity
statement: >
  Past-rotation-age key counts are present in the evidence, so a zero count of
  stale keys reflects posture rather than an unreadable payload. Does not assert
  what any count's value is.

# Integrity partner to `gcp_sa_keys_within_rotation_age`. That validator counts
# only the non-zero form; this one proves the key exists at all, with any value.
regex: '"user_managed_keys_past_rotation_age":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-IAM-SA
