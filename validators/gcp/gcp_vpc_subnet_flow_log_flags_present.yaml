key: gcp_vpc_subnet_flow_log_flags_present
name: GCP VPC Subnet Flow Log Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Per-subnet flow-log enablement flags are present in the evidence, so a zero
  count of unlogged subnets reflects the project's posture rather than an
  unreadable payload. Does not assert what those flags say.

# Integrity partner to `gcp_vpc_all_subnets_have_flow_logs`. Anchors one level
# up from the violation: that validator counts '"flow_logs_enabled": false',
# this one proves the `flow_logs_enabled` key was emitted at all.
#
# Pinned to the boolean values rather than a bare colon so it cannot be
# satisfied by a null placeholder written when the subnet's logConfig could not
# be read.
regex: '"flow_logs_enabled":\s*(?:true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-VPC-CONFIG
