key: gcp_sa_no_never_expiring_keys
name: No Never-Expiring GCP Service Account Keys
type: AUTOMATED
role: configuration
statement: >
  No service account key in the project is issued without an expiry — every key
  in the inventory reports a validity window that ends. Does not assert that the
  remaining validity is short, that the key is unused, or that the key ought to
  exist at all.

# INVERTED POLARITY: zero is compliant. A never-expiring key is the finding this
# evidence set exists to surface, so the regex matches only the bad state and the
# rule requires none of it.
#
# Per-key assertion, so it cannot be done with MATCH_GROUP (which reads the first
# match only) — it is inverted into a violation count, which means it CANNOT
# guard itself: zero matches is its pass condition. `gcp_sa_key_expiry_flags_present`
# is its mandatory integrity partner; without it a renamed `never_expires` key
# reads as zero never-expiring keys and this validator reports compliance.
regex: '"never_expires":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-IAM-SA
