key: gcp_gke_node_auto_upgrade_coverage_complete
name: GKE Node Pool Auto-Upgrade Coverage Is Total
type: AUTOMATED
role: configuration
statement: >
  Every GKE node pool in the project has node auto-upgrade enabled, so nodes
  take Kubernetes and container-runtime patches on Google's schedule instead of
  waiting on a manual upgrade. Does not assert which release channel a cluster
  follows, how quickly upgrades land, that the control plane is current, or that
  node auto-repair is on.

# NORMAL POLARITY, read-a-value form (B1) over the per-node-pool rollup, so it is
# self-guarding and needs no integrity partner: the MATCH_COUNT rule proves the
# rollup was present, and an upstream rename makes the fetcher record the pool as
# not auto-upgrading, which drops the percentage and fails this validator.
#
# The rollup is the right anchor rather than the per-pool boolean because
# `auto_upgrade` also has to be true for pools added after the evidence was
# collected; a percentage states the coverage claim directly.
#
# No exit_code anchor — collection health is asserted once for the set by
# validators/common/collection_succeeded.yaml, so group 1 is the percentage.
regex: '"auto_upgrade_percentage":\s*(?<auto_upgrade_percentage>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 100
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "100" }

evidence_sets:
  - EVD-GCP-GKE-CONFIG
