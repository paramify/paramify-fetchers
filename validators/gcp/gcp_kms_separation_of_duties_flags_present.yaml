key: gcp_kms_separation_of_duties_flags_present
name: Cloud KMS Separation Of Duties Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  Per-key and per-key-ring separation-of-duties flags are present in the
  evidence, so a zero count of violating keys reflects posture rather than an
  unreadable payload.

# Integrity partner to `gcp_kms_no_separation_of_duties_violations`. Anchors one
# level up from the violation: that validator counts
# `"separation_of_duties_violated": true`, this one proves the key exists at all,
# with either value.
regex: '"separation_of_duties_violated":\s*(?:true|false)'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-KMS-KEYS
