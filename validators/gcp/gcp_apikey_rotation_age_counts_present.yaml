key: gcp_apikey_rotation_age_counts_present
name: GCP API Key Rotation Age Counts Were Read
type: AUTOMATED
role: integrity
statement: >
  The past-rotation-age key rollup is present in the evidence, so a zero count of
  stale API keys reflects posture rather than an unreadable payload. Does not
  assert what the count's value is.

# Integrity partner to `gcp_apikey_keys_within_rotation_age`. Anchored on the
# summary rollup, which is emitted on every run, rather than the per-key flag,
# which a project with no API keys legitimately has none of.
regex: '"keys_past_rotation_age":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-API-KEYS
