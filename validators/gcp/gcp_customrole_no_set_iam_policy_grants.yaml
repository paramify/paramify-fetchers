key: gcp_customrole_no_set_iam_policy_grants
name: No GCP Custom Role Definition Grants setIamPolicy
type: AUTOMATED
role: configuration
statement: >
  The evidence's own rollup reports zero custom role definitions granting a
  `*.setIamPolicy` permission. A role holding one can rewrite the IAM policy on
  the resource it applies to and therefore grant its holder any further
  permission — the plainest privilege-escalation path in GCP IAM, and the
  reason a custom role is reviewed at all. This is an independent reading of the
  same fact as `gcp_customrole_no_escalation_path_grants`, taken from the
  summary rather than the per-role classifications, so per-role drift and
  summary drift fail separately. Does NOT cover the other escalation paths
  (role management, key creation, actAs), does not assert least privilege
  generally, and does not cover organization-scoped custom roles when those were
  not readable.

# Reads a value, so it guards itself: the MATCH_COUNT rule proves the rollup was
# present before the value rule reads it, and a renamed rollup key fails on the
# first rule rather than reading as zero. No exit_code anchor — collection
# health is asserted once for the set by `collection_succeeded`.
#
# `roles_granting_set_iam_policy` appears only in payload.summary, so the first
# match is the only match. It is a count of roles, not a percentage, so it reads
# 0 correctly for a project that defines no custom roles at all — which is why
# `no_privilege_escalation_percentage` is NOT the anchor here: that field is
# computed as 0 when there are no roles, and would report the safest possible
# posture as total non-compliance.
regex: '"roles_granting_set_iam_policy":\s*(?<roles_granting_set_iam_policy>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-IAM-CUSTOM-ROLES
