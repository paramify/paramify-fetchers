key: gcp_vm_no_default_sa_with_full_api_access
name: No GCP Compute Instance Pairs The Default Service Account With Full API Access
type: AUTOMATED
role: configuration
statement: >
  No Compute Engine instance attaches the Compute Engine default service account
  with the cloud-platform (full API access) scope — the combination that lets
  anyone who reaches the instance act as a project-wide Editor. Does NOT assert
  that instances avoid the default service account altogether (a narrowly scoped
  default account is the GKE node-pool default and is out of scope here), does
  NOT assert that a dedicated service account avoids the cloud-platform scope
  (that is Google's own recommended shape, with access constrained by IAM
  roles), and says nothing about the IAM roles granted to the account.

# GKE-MANAGED NODES ARE DELIBERATELY NOT EXEMPTED. The fetcher already emits a
# per-instance rollup, `default_service_account_with_full_api_access`, which
# carries Prowler's `gke_managed` exemption — anchoring on that key would inherit
# the exemption for free, and it is the one place in this evidence set where a
# GKE exemption IS expressible, because the scoping happened in Python where
# per-object scoping exists. This validator reads the raw service-account record
# instead, on purpose: a GKE node pool created with the default account and the
# cloud-platform scope is a real privilege-escalation path, because every pod on
# that node can reach a project-Editor token through the metadata server, and the
# remediation — recreate the node pool with a dedicated, minimally scoped
# account — is available to the operator. On the project these validators were
# authored from the two readings agree (the GKE node holds the default account
# but only the narrow legacy scopes), so the stricter reading costs nothing there
# and differs only where it matters.
#
# COUNTS VIOLATIONS, so it CANNOT guard itself — zero matches is its pass
# condition. `gcp_vm_service_account_scope_flags_present` is its mandatory
# integrity partner; without it a renamed service-account flag reads as zero
# violations and this validator reports compliance on an unreadable payload.
#
# OBJECT BRIDGING. This pattern spans two keys, so it is fenced with `[^}]*?`
# rather than `[\s\S]*?`. Unfenced, an instance holding the default service
# account with narrow scopes, followed by an instance holding a DEDICATED account
# with the cloud-platform scope, splices into a false violation: neither instance
# is a finding, but the match crosses from one to the other. Both of those are
# ordinary, defensible configurations, so this is not a theoretical splice — the
# fence stops the match at the closing brace of the service-account record, and
# `bridging_hardened_next_to_broad_scope` in the case file proves it.
#
# The evidence is written with sorted keys, so within one service-account record
# `default_compute_service_account` always precedes `full_api_access` and the two
# are separated only by `email`, a string with no braces. If that ordering ever
# changed, this pattern would stop matching and read as compliant — but the
# integrity partner shares the same fence and ordering, so it fails at the same
# moment and the evidence set fails loudly instead.
#
# `"default_compute_service_account"` cannot match inside
# `"uses_default_compute_service_account"`, and `"full_api_access"` cannot match
# inside `"has_full_api_access_scope"`: the leading quote anchors both.
#
# No exit_code anchor — collection health is asserted once for the set by
# `collection_succeeded`.
regex: '"default_compute_service_account":\s*true[^}]*?"full_api_access":\s*true'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-VM-CONFIG
