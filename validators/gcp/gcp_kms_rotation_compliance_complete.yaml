key: gcp_kms_rotation_compliance_complete
name: Cloud KMS Key Rotation Compliance Is Total
type: AUTOMATED
role: configuration
statement: >
  Every rotation-eligible Cloud KMS key (symmetric ENCRYPT_DECRYPT) carries a
  rotation period no longer than the fetcher's 90-day interval AND has its next
  rotation scheduled within that interval. It asserts nothing about asymmetric or
  MAC keys, which cannot carry a rotation period and are correctly excluded from
  the denominator.

# Reads a value, so it guards itself: the MATCH_COUNT rule proves the rollup was
# present before the threshold rule reads it. No exit_code anchor — collection
# health is asserted once for the set by `collection_succeeded`.
#
# DELIBERATELY reads the fetcher's precomputed rollup instead of re-deriving a day
# threshold in the regex. `rotation_compliance_percentage` is
# keys_meeting_rotation_interval / rotation_eligible_keys, where
# meets_rotation_interval already ANDs both halves of the 90-day rule. Comparing
# rotation_period_days against 90 in a regex would need a numeric comparison the
# operators do not document ("8" >= "14" is true as a string); EQUALS "100" reads
# the same numerically and lexicographically, so there is no ambiguity here.
#
# Note the denominator: coverage_percentage returns 0 for an empty denominator, so
# a project with no rotation-eligible keys fails rather than passing vacuously.
regex: '"rotation_compliance_percentage":\s*(?<rotation_compliance_percentage>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 100
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "100" }

evidence_sets:
  - EVD-GCP-KMS-KEYS
