key: gcp_secret_non_public_coverage_complete
name: Secret Manager Non-Public Secret Coverage Is Total
type: AUTOMATED
role: configuration
statement: >
  Every Secret Manager secret in the project is non-public: the rollup reports
  100% of secrets with no IAM binding naming allUsers or allAuthenticatedUsers.
  Does NOT assert who else can read the secrets, that the payloads are wrapped
  with a customer-managed key, or that a rotation schedule exists — and it sees
  only bindings set ON the secret, so a project-level grant of
  roles/secretmanager.secretAccessor to a public principal is invisible here
  (that posture belongs to the IAM policy bindings evidence set).

# Reads a value, so it guards itself: the MATCH_COUNT rule proves the rollup was
# present before the threshold rule reads it. No exit_code anchor — collection
# health is asserted once for the set by `collection_succeeded`, so the capture
# group starts at 1.
#
# The rollup is the highest-value assertion on this fetcher: a secret readable by
# allUsers is a top-severity finding, and this is the one form that fails LOUDLY
# in every direction. `coverage_percentage` returns 0 for an empty denominator,
# so a project with no secrets — including one where the Secret Manager API is
# disabled and the fetcher still exits 0 — reports 0 and FAILS here rather than
# passing vacuously. Its per-secret counterpart is
# `gcp_secret_no_publicly_accessible_secrets`.
regex: '"non_public_secret_percentage":\s*(?<non_public_secret_percentage>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 100
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "100" }

evidence_sets:
  - EVD-GCP-SECRETMGR-CONFIG
