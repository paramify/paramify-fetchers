key: gcp_secret_no_overdue_rotation
name: No Overdue Secret Manager Rotation Schedules
type: AUTOMATED
role: configuration
statement: >
  No secret carrying a rotation schedule has let it lapse: every configured
  next-rotation time is still in the future, so a scheduled rotation that stopped
  firing is not being reported as healthy. Does NOT assert that any particular
  secret HAS a rotation schedule, what period it uses, or that the rotation
  actually replaced the material — only that no configured schedule is overdue.

# Reads a value, so it guards itself: the MATCH_COUNT rule proves the rollup was
# present before the threshold rule reads it. No exit_code anchor — collection
# health is asserted once for the set by `collection_succeeded`.
#
# WHY THE OVERDUE COUNT AND NOT `rotation_percentage`. Coverage is a tenant
# choice: secrets backing a third-party credential that must be rotated by hand
# legitimately carry no schedule, so demanding 100% would fail projects with
# defensible postures. A schedule that exists and has LAPSED is not a choice —
# it is a control that has stopped working — which is why this is the firmer
# ground. `gcp_secret_rotation_flags_present` proves the per-secret flag this
# rollup summarizes was actually read, so a zero here is not an empty population.
regex: '"secrets_with_overdue_rotation":\s*(?<secrets_with_overdue_rotation>\d+)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-SECRETMGR-CONFIG
