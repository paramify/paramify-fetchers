key: gcp_binding_service_account_role_flags_present
name: GCP Project IAM Binding Service Account Role Breadth Flags Were Read
type: AUTOMATED
role: integrity
statement: >
  The per-binding flag recording whether a service account was granted an
  over-broad role is present in the evidence, so a zero count of such bindings
  reflects the project's posture rather than an unreadable payload. Does not
  assert what any flag's value is, nor that every binding on the project was
  enumerated.

# Integrity partner to `gcp_binding_no_service_account_over_broad_roles`.
# Anchors one level up from the violation: that validator counts
# `"service_account_granted_over_broad_role": true`, this one proves the key
# exists at all, with any value. Rename the key upstream and the violation
# counter silently reports compliance; this validator is what turns that into a
# set-level failure.
regex: '"service_account_granted_over_broad_role":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-IAM-BINDINGS
