key: gcp_lbtls_ssl_policy_minimum_version_present
name: GCP SSL Policy Minimum TLS Version Was Read
type: AUTOMATED
role: integrity
statement: >
  Every SSL policy record in the evidence carries a minimum TLS version field, so
  a zero count of weak policies reflects posture rather than an unreadable
  payload. Does not assert what any version is.

# Integrity partner to `gcp_lbtls_no_weak_ssl_policy_minimums`. Anchors on the key
# that validator counts: it matches `"min_tls_version": "TLS_1_0"`, this one
# proves `min_tls_version` exists at all, on any policy, with any value.
#
# BOUNDARY: a project that defines no SSL policies has no policy records, so this
# fails on genuinely-empty evidence — "nothing to measure", not "posture is bad".
# The container anchor `"ssl_policies":\s*\[` would survive that case but would
# NOT catch a rename of `min_tls_version`, which is the drift this role exists to
# catch, so the key-level anchor is the right trade.
regex: '"min_tls_version":\s*'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-LB-TLS
