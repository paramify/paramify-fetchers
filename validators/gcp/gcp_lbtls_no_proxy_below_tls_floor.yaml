key: gcp_lbtls_no_proxy_below_tls_floor
name: GCP Load Balancer Proxies All Meet The TLS 1.2 Floor
type: AUTOMATED
role: configuration
statement: >
  No HTTPS or SSL load balancer front end in the project negotiates a minimum TLS
  version below 1.2. This reads each proxy's EFFECTIVE minimum — the version it
  actually negotiates once GCP's default has been applied — so a proxy with no SSL
  policy attached, which silently inherits TLS 1.0, is counted as a violation even
  though no SSL policy in the project says TLS 1.0. Does not assert the cipher
  profile, the certificate, the back end, or that any proxy exists at all.

# INVERTED POLARITY: zero is compliant. The regex matches only the bad state.
#
# WHY `effective_min_tls_version` AND NOT THE POLICY LIST. The proxy list and the
# SSL policy list are separate arrays, and the engine has no per-object scoping —
# joining them in one pattern would splice across neighbouring items. The fetcher
# already does that join and writes the answer per proxy, so this validator reads
# the resolved field. "No policy says TLS_1_0" is NOT the same claim as "no proxy
# negotiates TLS_1_0": a proxy with `ssl_policy: null` runs Google's default of
# TLS 1.0 + COMPATIBLE, and that is precisely the finding this evidence exists to
# surface. `gcp_lbtls_no_weak_ssl_policy_minimums` asserts the other half.
#
# WHY THE BAD VALUES ARE ENUMERATED RATHER THAN COMPARED. TLS_1_0 / TLS_1_1 /
# TLS_1_2 / TLS_1_3 are strings, and the criteria operators are not documented as
# numeric — a GREATER_THAN over these would be relying on lexicographic ordering
# that happens to agree today. The non-compliant space is a closed enum, so it is
# spelled out. `null` is in the alternation because the fetcher writes it when a
# proxy names an SSL policy that could not be read, and its own `tls_at_least()`
# treats unknown as below the floor — unreadable must not read as compliant.
regex: '"effective_min_tls_version":\s*(?:"TLS_1_0"|"TLS_1_1"|null)'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `gcp_lbtls_proxy_effective_tls_version_present` is its mandatory
# integrity partner; without it a renamed `effective_min_tls_version` key reads as
# zero weak proxies and this validator reports compliance.
#
# BOUNDARY: were GCP to add a minimum-version enum value weaker than TLS 1.0, this
# pattern would not match it. The enum is closed today (see TLS_VERSION_ORDER in
# the fetcher); widen the alternation if it grows.
evidence_sets:
  - EVD-GCP-LB-TLS
