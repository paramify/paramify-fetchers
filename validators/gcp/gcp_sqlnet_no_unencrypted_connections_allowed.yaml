key: gcp_sqlnet_no_unencrypted_connections_allowed
name: No Cloud SQL Instance Accepts Unencrypted Network Connections
type: AUTOMATED
role: configuration
statement: >
  No individual Cloud SQL instance record reports that unencrypted connections
  are accepted. This reads the per-instance fact rather than the project rollup,
  so an instance that the summary math missed still fails. Does NOT assert a
  minimum TLS version or the server CA mode.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `gcp_sqlnet_ssl_enforcement_flags_present` is its mandatory
# integrity partner; without it a renamed `ssl_required` key reads as zero
# violations and therefore as compliant.
#
# Single key, no span across keys: there is no per-object scoping in this engine,
# so a pattern reaching from one key to another can splice two neighbouring
# instances together. Nothing here can.
regex: '"ssl_required":\s*false'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-GCP-CLOUDSQL-NET
