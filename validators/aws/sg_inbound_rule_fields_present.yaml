key: sg_inbound_rule_fields_present
name: Security Group Inbound Rule Fields Were Read
type: AUTOMATED
role: integrity
statement: >-
  At least one security group inbound rule is present in the evidence with its
  full field shape intact (Direction, Protocol, FromPort, ToPort, CIDRs), so a
  zero count of open inbound rules reflects posture rather than an unreadable
  payload. Not a compliance claim on its own — it says the fields were there to
  count, not that what they say is good.

# Integrity partner to `sg_no_open_inbound_except_https`. Anchors one level up
# from the violation: that validator counts inbound rules whose CIDRs admit
# 0.0.0.0/0, this one proves the inbound rule shape it reads exists at all.
#
# Deliberately mirrors the partner's key sequence rather than probing a single
# key such as '"CIDRs":\s*"'. The violation regex depends on the whole ordered
# run of keys, so renaming any one of them — or reordering them — silently sends
# its count to zero; only a partner that reads the same sequence fails loudly.
#
# CORRECT FAILURE ON AN EMPTY TENANT: an account with no inbound rules at all
# fails this validator. That is intended, not a false alarm — a payload with zero
# inbound rules is indistinguishable from one whose Direction key was renamed,
# and "no bad inbound rules" cannot be proved from evidence containing no inbound
# rules. It needs a human look either way.
regex: '"Direction":\s*"INBOUND RULES"\s*,\s*"Protocol":\s*"[^"]*"\s*,\s*"FromPort":\s*(?<from_port>\d+|null)\s*,\s*"ToPort":\s*(?<to_port>\d+|null)\s*,\s*"CIDRs":\s*"'
rules_summary: MATCH_COUNT NOT_EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-SECURITY-GROUPS
