key: organizations_scp_guardrails_in_place
name: Organizations SCP Guardrails In Place
type: AUTOMATED
role: configuration
statement: Service control policies are enabled on the organization root and at least one customer-managed SCP exists beyond the AWS-managed FullAWSAccess.

# Reads a value, so it guards itself: the MATCH_COUNT rule proves a
# customer-managed SCP (AwsManaged false) and the ScpsEnabled flag were both
# present before the group rule reads the flag. Groups: 1 scps_enabled.
#
# ScpsEnabled follows ServiceControlPolicies in the record, so the lazy span
# lands on this record's flag. A denied read has null lists and
# "ScpsEnabled": null and fails here too; organizations_scp_policy_read_ok says
# why. No exit_code anchor: collection health is collection_succeeded's.
regex: '"AwsManaged":\s*false[\s\S]*?"ScpsEnabled":\s*(?<scps_enabled>true|false|null)'
rules_summary: MATCH_COUNT NOT_EQUALS 0; MATCH_GROUP[1] EQUALS true
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: NOT_EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }
  - regexOperation: { type: MATCH_GROUP, groupNumber: 1 }   # scps_enabled
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "true" }

evidence_sets:
  - EVD-ORGANIZATIONS-SCP
