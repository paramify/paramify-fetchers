key: sg_no_open_inbound_except_https
name: No Open Inbound Security Group Rules Except HTTPS
type: AUTOMATED
role: configuration
statement: >-
  No security group inbound rule admits traffic from 0.0.0.0/0 or ::/0 on any
  port other than exactly 443. Substantiates the "Policy Enforcement Points:
  Amazon Security Groups" capability claim that "only HTTPS on port 443 is
  allowed in" (KSI-CNA-RNT; sc-7.5 deny-by-default). Counts "All traffic"
  (protocol -1, no ports) and ICMP rules as violations. It does NOT assert
  anything about outbound traffic, about rules whose source is another security
  group or a prefix list, or about which groups are internet-exposed. Needs
  aws_security_groups 0.3.0 or later: earlier versions dropped all-traffic rules
  and never read IPv6 ranges.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `sg_inbound_rule_fields_present` is its mandatory integrity partner;
# without it a renamed Direction/FromPort/CIDRs key reads as zero violations.
#
# Reads the rule object's fixed key order (Direction, Protocol, FromPort, ToPort,
# CIDRs, IPv6CIDRs), which fetcher.sh emits from a literal jq object
# construction and only ever appends to. The explicit `,\s*"Key":` separators
# keep the pattern inside one rule object, so a compliant rule adjacent to a
# violating one cannot splice into a false match.
#
# The lookahead rejects exactly the one compliant pairing — FromPort 443 AND
# ToPort 443 — so a range such as 443-8443 open to the internet is still
# counted. Ports match `-?\d+|null`: null is an all-traffic rule (no ports) and
# -1 is ICMP's "all types", and both are open inbound rules.
#
# The open range is 0.0.0.0/0 in CIDRs OR ::/0 in IPv6CIDRs, one alternation, so
# a rule open on both counts once. Both lists are ", "-joined, so each is
# anchored at a list-element boundary: "10.0.0.0/8" and "110.0.0.0/0" contain
# the substring 0.0.0.0/0, and "2001:db8::/0" contains ::/0, and none of them
# may count.
regex: '"Direction":\s*"INBOUND RULES"\s*,\s*"Protocol":\s*"[^"]*"\s*,\s*"FromPort":\s*(?!443\s*,\s*"ToPort":\s*443\s*,)(?<from_port>-?\d+|null)\s*,\s*"ToPort":\s*(?<to_port>-?\d+|null)\s*,\s*"CIDRs":\s*"(?:(?:[^"]*,\s*)?0\.0\.0\.0/0(?:\s*,[^"]*)?"|[^"]*"\s*,\s*"IPv6CIDRs":\s*"(?:[^"]*,\s*)?::/0(?:\s*,[^"]*)?")'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

evidence_sets:
  - EVD-SECURITY-GROUPS
