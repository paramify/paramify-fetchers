key: sg_no_open_inbound_except_https
name: No Open Inbound Security Group Rules Except HTTPS
type: AUTOMATED
role: configuration
statement: >-
  No security group inbound rule admits traffic from 0.0.0.0/0 on any port other
  than exactly 443. Substantiates the "Policy Enforcement Points: Amazon Security
  Groups" capability claim that "only HTTPS on port 443 is allowed in"
  (KSI-CNA-RNT; sc-7.5 deny-by-default). It does NOT assert anything about
  outbound traffic, about IPv6 ::/0, about rules whose source is another security
  group, or about which groups are internet-exposed — and, because the collecting
  fetcher drops rules with null ports, it does NOT see "All traffic" (protocol
  -1) rules at all. See the blind-spot note below.

# Counts violations, so it CANNOT guard itself — zero matches is its pass
# condition. `sg_inbound_rule_fields_present` is its mandatory integrity partner;
# without it a renamed Direction/FromPort/CIDRs key reads as zero violations.
#
# Reads the rule object's fixed key order (Direction, Protocol, FromPort, ToPort,
# CIDRs), which fetcher.sh emits from a literal jq object construction. The
# explicit `,\s*"Key":` separators keep the pattern inside one rule object, so a
# compliant rule adjacent to a violating one cannot splice into a false match.
#
# The lookahead rejects exactly the one compliant pairing — FromPort 443 AND
# ToPort 443 — so a range such as 443-8443 from 0.0.0.0/0 is still counted.
# `\d+|null` matches a null port too, so the validator starts seeing all-traffic
# rules automatically if the fetcher's null-port drop is fixed.
#
# The CIDRs value is a ", "-joined list, so 0.0.0.0/0 is anchored at a list
# element boundary: "10.0.0.0/8" and "110.0.0.0/0" both contain the substring
# 0.0.0.0/0 and must not count.
regex: '"Direction":\s*"INBOUND RULES"\s*,\s*"Protocol":\s*"[^"]*"\s*,\s*"FromPort":\s*(?!443\s*,\s*"ToPort":\s*443\s*,)(?<from_port>\d+|null)\s*,\s*"ToPort":\s*(?<to_port>\d+|null)\s*,\s*"CIDRs":\s*"(?:[^"]*,\s*)?0\.0\.0\.0/0(?:\s*,[^"]*)?"'
rules_summary: MATCH_COUNT EQUALS 0
validation_rules:
  - regexOperation: { type: MATCH_COUNT }
    criteria: EQUALS
    value: { type: CUSTOM_TEXT, customText: "0" }

# KNOWN BLIND SPOT — fetchers/aws/security_groups/fetcher.sh:80 builds each rule
# with ($f|tonumber?); on a rule with no ports the AWS CLI renders FromPort as
# the text "None", tonumber? yields empty, and the whole rule object evaporates
# from the payload. Every protocol "-1" (All traffic) rule is therefore absent
# from the evidence — including an inbound All-traffic rule from 0.0.0.0/0, the
# single worst case this validator exists to catch. Until that is fixed, a PASS
# here means "no open inbound rule with numeric ports", not "no open inbound
# rule". The same drop is why no outbound rule survives collection, which is why
# the capability's two outbound claims have no validator.

evidence_sets:
  - EVD-SECURITY-GROUPS
