name: qualys_scan_coverage
version: 0.1.0
description: >-
  Shows, for every host in Qualys VMDR, when it was last scanned for
  vulnerabilities and last scanned with authentication, and which subscription
  IPs have no host record.
category: qualys

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 1800

output:
  type: json
  path: qualys_scan_coverage.json

secrets: []          # username / password, api_url and private_cloud_host come from _categories/qualys.yaml

ksis:
  - KSI-CNA-EIS
  - KSI-SVC-EIS

evidence_set:
  reference_id: EVD-QUALYS-SCAN-COVERAGE
  name: Qualys Scan Coverage
  instructions: |
    Script: qualys/scan_coverage/fetcher.py

    Access: A local Qualys user with the Reader role and API access, assigned the All asset group. A Reader sees only the hosts in its asset groups, so the evidence records which groups it sees. Assumed from the API guide, not seen on a live subscription: a user that sees the All group sees every asset. Under tag-based user scoping that may not hold, and then every count here is too low while scope_all still reads true.

    Commands Executed:
    - GET /api/2.0/fo/asset/group/?action=list — the asset groups the API user can see, to show whether its scope covers every asset
    - GET /api/5.0/fo/asset/host/?action=list&details=All (every page, following the next-page URL Qualys returns) — every scanned host with its last vulnerability scan and last authenticated scan dates
    - GET /api/2.0/fo/asset/ip/?action=list — the IPs and ranges in the subscription, to find addresses with no host record
    - GET /api/2.0/fo/asset/excluded_ip/?action=list — the IPs and ranges Qualys is set never to scan

    Output: qualys_scan_coverage.json — one item per host with its IPv4 and IPv6 address, DNS name, operating system, tracking method, last scan dates and days since each; the subscription's IPv4 ranges holding no host record, and its IPv6 ranges with no host record anywhere in them, both leaving out the excluded addresses; and the excluded ranges. Assumed from the API guide, not seen on a live subscription: tracking methods read IP, DNS, NETBIOS, an agent value or a cloud instance value (EC2, Azure, GCP, OCI); any other value lands in other in hosts_by_tracking_method and changes no other count. Also assumed: Qualys records a Cloud Agent scan as the host's authenticated scan date; if it does not, hosts_never_auth_scanned overstates the gap. A read that failed leaves its fields null and the run exits non-zero.

    Summary fields:

    Which hosts does Qualys track?
    - total_hosts — Number of hosts in the host list the API user can see
    - hosts_by_tracking_method — Number of hosts for each way Qualys tracks them:
      - ip (by IP address)
      - dns (by DNS name)
      - netbios (by NetBIOS name)
      - cloud_agent (by an installed Qualys Cloud Agent)
      - cloud_instance (by a cloud instance id, such as EC2, Azure VM or OCI)
      - other (a tracking method not listed here)
      - not_returned (Qualys gave no tracking method)

    Were they scanned recently?
    - scan_window_days — The window in days a scan must fall within, from the scan_window_days setting (default 31)
    - hosts_scanned_within_window — Number of hosts whose last vulnerability scan is within the window
    - hosts_not_scanned_within_window — Number of hosts whose last vulnerability scan is older than the window, or that have no vulnerability scan date
    - hosts_without_vm_scan_date — Number of hosts with no vulnerability scan date at all
    - hosts_scan_date_unreadable — Number of hosts whose scan date Qualys returned in a form that could not be read
    - max_days_since_vm_scan — Days since the oldest last vulnerability scan among the hosts

    Were the scans authenticated?
    - hosts_auth_scanned_within_window — Number of hosts whose last authenticated scan is within the window
    - hosts_auth_scan_older_than_window — Number of hosts whose last authenticated scan is older than the window
    - hosts_never_auth_scanned — Number of hosts with no authenticated scan date
    - hosts_auth_date_unreadable — Number of hosts whose authenticated scan date could not be read

    Which subscription IPs have no host record?
    - subscription_ipv4_addresses — Number of IPv4 addresses in the subscription's IP list the API user can see; null if the list could not be read
    - subscription_ipv4_addresses_without_host_record — Number of those IPv4 addresses with no host in the host list, either never scanned or with nothing found there; addresses on the excluded list are left out, since Qualys never scans them; null if the IP list or the excluded list could not be read
    - subscription_ipv6_ranges — Number of IPv6 entries (one address or a range) in the subscription's IP list; IPv6 is counted by range, not by address, because one /64 range alone holds 2^64 addresses; null if the list could not be read
    - subscription_ipv6_ranges_without_host_record — Number of those IPv6 entries with no host in the host list anywhere in them; addresses on the excluded list are left out, and an entry that is wholly excluded is not counted; null if the IP list or the excluded list could not be read
    - excluded_ipv4_addresses — Number of IPv4 addresses Qualys is set never to scan; null if the list could not be read
    - excluded_ipv6_ranges — Number of IPv6 entries Qualys is set never to scan; null if the list could not be read

    Does the API user see every asset?
    - scope_all — True if the built-in All asset group is among the groups the API user sees; false if not; null if the groups could not be read
    - visible_asset_groups — Number of asset groups the API user sees; null if they could not be read
  description: >-
    Shows, for every host in Qualys VMDR, when it was last scanned for
    vulnerabilities and last scanned with authentication, and which subscription
    IPs have no host record.
