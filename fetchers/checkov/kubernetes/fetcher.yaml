name: checkov_kubernetes
version: 0.2.0
description: >
  Runs Checkov IaC security scanning over the Kubernetes manifests in a repo.
  Clones the repo (generic git, any host) and scans its .yaml/.yml files with the
  kubernetes framework, emitting passed/failed/skipped checks plus an aggregate
  pass percentage. One repo per invocation; the runner fans out across repos.
category: checkov

supports_targets: true

runtime:
  type: bash
  entry: fetcher.sh
  timeout: 1800

output:
  type: json
  path: checkov_kubernetes.json
  aggregation: per_target

target_schema:
  repo_url:
    type: string
    required: true
    env: CHECKOV_REPO_URL
    description: Clone URL of the repo to scan (https://host/group/project.git).
  branch:
    type: string
    required: false
    default: main
    env: CHECKOV_CLONE_BRANCH
    description: >-
      Branch/ref to clone. If it cannot be cloned the repo's default branch is scanned
      instead; metadata.branch then names the default branch, metadata.requested_branch
      this value, and metadata.branch_fallback is true.

secrets:
  - name: clone_token
    env: GIT_CLONE_TOKEN
    per_target: true

config_schema:
  soft_fail:
    type: boolean
    default: true
    env: CHECKOV_SOFT_FAIL
    description: Findings do not fail the scan (findings are evidence, not a fetch failure).
  compact:
    type: boolean
    default: true
    env: CHECKOV_COMPACT
    description: Compact checkov output (omits code blocks).
  repo_id:
    type: string
    default: evidence-fetchers-kubernetes
    env: CHECKOV_REPO_ID
    description: Label only — appears in checkov's output.
  skip_checks:
    type: string
    env: CHECKOV_SKIP_CHECKS
    description: >-
      CSV of CKV_K8S_/CKV2_K8S_ check IDs to skip; added to _shared/skip-checks-k8s.default.txt
      unless use_default_skip_checks is false. Skipped checks do not appear in
      checkov's results; the effective list is recorded in metadata.skip_checks.
  use_default_skip_checks:
    type: boolean
    default: true
    env: CHECKOV_USE_DEFAULT_SKIP_CHECKS
    description: >-
      Include the shipped _shared/skip-checks-k8s.default.txt in the skip list. Set false
      to replace the defaults with skip_checks alone (or skip nothing if skip_checks is
      empty). metadata.default_skip_checks_applied records the choice.
  skip_paths:
    type: string
    env: CHECKOV_SKIP_PATHS
    description: CSV of paths to skip during the scan.
  checks:
    type: string
    env: CHECKOV_K8S_CHECKS
    description: CSV allowlist of check IDs to run (these are removed from the skip list).
  external_checks_dir:
    type: string
    env: CHECKOV_EXTERNAL_CHECKS_DIR
    description: Path to a custom checks directory.
  git_username:
    type: string
    default: oauth2
    env: CHECKOV_GIT_USERNAME
    description: Basic-auth username paired with GIT_CLONE_TOKEN (oauth2 works for GitLab/GitHub).

ksis:
  - KSI-MLA-EVC

evidence_set:
  reference_id: EVD-CHECKOV-KUBERNETES
  name: Checkov Kubernetes IaC Scan
  instructions: 'Script: checkov/kubernetes/fetcher.sh. Shallow-clones the target repo and runs the checkov CLI (--framework kubernetes) over its .yaml/.yml manifests, merging default + configured skip-checks, and records passed/failed/skipped checks with repo+commit provenance. metadata records the branch actually scanned (branch_fallback when the requested branch could not be cloned) and the effective skip-check list, since checks passed to --skip-check do not appear in the results.'
