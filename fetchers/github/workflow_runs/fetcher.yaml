name: github_workflow_runs
version: 0.3.0
description: >-
  GitHub Actions run history: every workflow run in the window with its
  workflow, trigger, branch, commit, who started it and its result, and the
  artifacts each run kept (metadata only, never the contents).
category: github

supports_targets: true

target_schema:
  org:
    type: string
    required: true
    env: GITHUB_ORG
    description: Organization login, as in github.com/<org>.
  api_url:
    type: string
    required: false
    default: https://api.github.com
    env: GITHUB_API_URL
    description: >-
      REST API base URL. https://api.github.com for github.com,
      https://api.<subdomain>.ghe.com for GHE.com, https://<host>/api/v3 for
      GitHub Enterprise Server.
  repositories:
    type: string
    required: false
    env: GITHUB_REPOSITORIES
    description: >-
      Comma-separated repository names to collect. Unset collects every
      repository the token can see; a name the token cannot see fails the run.
  exclude_repositories:
    type: string
    required: false
    env: GITHUB_EXCLUDE_REPOSITORIES
    description: >-
      Comma-separated repository names to leave out, matched without regard
      to case. Cannot be combined with repositories. The evidence lists the
      names it left out and any that matched no repository.
  include_archived:
    type: boolean
    required: false
    default: false
    env: GITHUB_INCLUDE_ARCHIVED
    description: Include archived repositories, which cannot change.

runtime:
  type: python
  entry: fetcher.py
  timeout: 1800

output:
  type: json
  path: github_workflow_runs.json
  aggregation: per_target

config_schema:
  days_back:
    type: integer
    required: false
    default: 30
    env: GITHUB_WORKFLOW_RUNS_DAYS_BACK
    description: Days of workflow run history to collect (1-366).
  max_runs:
    type: integer
    required: false
    default: 2000
    env: GITHUB_MAX_WORKFLOW_RUNS
    description: >-
      Most workflow runs read per repository; more in the window fails the
      run rather than cutting the history short.
  max_artifacts:
    type: integer
    required: false
    default: 2000
    env: GITHUB_MAX_ARTIFACTS
    description: >-
      Most artifacts read per repository; more in the window fails the run
      rather than cutting the list short.
  include_branch_names:
    type: boolean
    required: false
    default: true
    env: GITHUB_WORKFLOW_RUNS_INCLUDE_BRANCH_NAMES
    description: >-
      Include each run's branch name (head_branch). Set false to leave branch
      names out; on_default_branch is still worked out and reported.
  include_actors:
    type: boolean
    required: false
    default: true
    env: GITHUB_WORKFLOW_RUNS_INCLUDE_ACTORS
    description: >-
      Include who started each run (actor and triggering_actor). Set false to
      leave both out. Either way a scheduled run names no actor, because
      GitHub reports the user who last changed the schedule, not a person who
      started the run; a re-run of one still names who re-ran it.

secrets: []

ksis:
  - KSI-CMT-VTD
  - KSI-CMT-RMV

evidence_set:
  reference_id: EVD-GITHUB-WORKFLOW-RUNS
  name: GitHub Workflow Runs
  instructions: >-
    Script: github/workflow_runs/fetcher.py. Per repository, every GitHub
    Actions workflow run created in the window: workflow file, trigger event,
    branch and head repository, commit, actor and triggering actor (null on
    scheduled runs, which no person starts), attempt, status and conclusion,
    and the artifacts the run uploaded (name, size, digest, expiry; never the
    contents). Summary counts runs by outcome, scheduled runs, failed runs on
    the default branch, workflows whose newest default-branch run failed,
    reruns, and artifacts.
