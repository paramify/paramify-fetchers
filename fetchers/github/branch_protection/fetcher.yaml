name: github_branch_protection
version: 0.1.0
description: >-
  The protection GitHub actually enforces on each repository's default branch:
  required pull requests, approvals, status checks and signed commits, from
  rulesets and classic branch protection together.
category: github

supports_targets: true

target_schema:
  org:
    type: string
    required: true
    env: GITHUB_ORG
    description: Organization login, as in github.com/<org>.
  api_url:
    type: string
    required: false
    default: https://api.github.com
    env: GITHUB_API_URL
    description: >-
      REST API base URL. https://api.github.com for github.com,
      https://api.<subdomain>.ghe.com for GHE.com, https://<host>/api/v3 for
      GitHub Enterprise Server.
  repositories:
    type: string
    required: false
    env: GITHUB_REPOSITORIES
    description: >-
      Comma-separated repository names to collect. Unset collects every
      repository the token can see; a name the token cannot see fails the run.
  include_archived:
    type: boolean
    required: false
    default: false
    env: GITHUB_INCLUDE_ARCHIVED
    description: Include archived repositories, which cannot change.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: github_branch_protection.json
  aggregation: per_target

secrets: []

ksis:
  - KSI-CMT-VTD
  - KSI-CMT-LMC
  - KSI-SVC-VRI

evidence_set:
  reference_id: EVD-GITHUB-BRANCH-PROTECTION
  name: GitHub Default Branch Protection
  instructions: >-
    Per repository, the rules GitHub enforces on the default branch
    (rules/branches) merged with classic branch protection: `requires_approval`,
    `requires_status_checks` and the check names, signed commits, force-push
    and deletion blocks. Rulesets that exist but enforce nothing (disabled or
    evaluate) are listed in `rulesets_not_enforced`; rulesets whose bypass list
    allows always-bypass in `rulesets_with_always_bypass`.
