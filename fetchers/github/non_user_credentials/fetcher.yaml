name: github_non_user_credentials
version: 0.3.0
description: >-
  Credentials that are not a person: deploy keys, installed GitHub Apps and
  their permissions, approved fine-grained personal access tokens, Actions
  secrets with their age, and webhooks that skip TLS verification or are
  unsigned.
category: github

supports_targets: true

target_schema:
  org:
    type: string
    required: true
    env: GITHUB_ORG
    description: Organization login, as in github.com/<org>.
  api_url:
    type: string
    required: false
    default: https://api.github.com
    env: GITHUB_API_URL
    description: >-
      REST API base URL. https://api.github.com for github.com,
      https://api.<subdomain>.ghe.com for GHE.com, https://<host>/api/v3 for
      GitHub Enterprise Server.
  repositories:
    type: string
    required: false
    env: GITHUB_REPOSITORIES
    description: >-
      Comma-separated repository names to collect. Unset collects every
      repository the token can see; a name the token cannot see fails the run.
  exclude_repositories:
    type: string
    required: false
    env: GITHUB_EXCLUDE_REPOSITORIES
    description: >-
      Comma-separated repository names to leave out, matched without regard
      to case. Cannot be combined with repositories. The evidence lists the
      names it left out and any that matched no repository.
  include_archived:
    type: boolean
    required: false
    default: false
    env: GITHUB_INCLUDE_ARCHIVED
    description: Include archived repositories, which cannot change.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: github_non_user_credentials.json
  aggregation: per_target

config_schema:
  max_secret_age_days:
    type: integer
    required: false
    default: 365
    env: GITHUB_MAX_SECRET_AGE_DAYS
    description: An Actions secret not updated for longer than this is listed in actions_secrets_older_than_max.
  max_unused_days:
    type: integer
    required: false
    default: 90
    env: GITHUB_MAX_UNUSED_DAYS
    description: An approved fine-grained token unused for longer than this counts as unused.
  scope_to_repositories:
    type: boolean
    required: false
    default: false
    env: GITHUB_SCOPE_TO_REPOSITORIES
    description: >-
      Limit installed apps, fine-grained tokens and organization Actions
      secrets to those that can reach the collected repositories (the
      repositories target field, or every repository the token can see when it
      is unset). One is left out only when it is shown not to reach any of
      them: a secret or token whose repository list names none, a secret for
      private repositories when every collected repository is public, or a
      token with no repository access. One whose reach cannot be told stays
      in with reaches_collected_repositories null, such as an app installed on
      selected repositories (GitHub gives that list to the app alone) or a
      repository list that could not be read. Organization webhooks are not
      scoped. The metadata counts what was left out.

secrets: []

ksis:
  - KSI-IAM-SNU
  - KSI-SVC-ASM

evidence_set:
  reference_id: EVD-GITHUB-NON-USER-CREDENTIALS
  name: GitHub Non-User Credentials
  instructions: >-
    Script: github/non_user_credentials/fetcher.py. Deploy keys per repository (read-only or write, age, last use), installed
    apps with their permissions, approved fine-grained tokens with expiry and
    last use (GitHub App tokens only; null otherwise), Actions secrets by name
    and last update (values are never readable), and webhooks with TLS
    verification and signing; URLs reduced to host. With scope_to_repositories,
    apps, tokens and organization secrets are limited to those reaching the
    collected repositories or of unknown reach.
