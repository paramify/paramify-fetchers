name: jira_site_inventory
version: 0.2.0
description: >-
  Inventories a Jira Cloud site — deployment info, projects with leads and issue
  counts, issue types, priorities, statuses, Jira Service Management service
  desks — and summarizes recent issue activity by project, type, status and
  priority, including change and incident tickets and time to resolution.
category: jira

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 900

output:
  type: json
  path: jira_site_inventory.json

# JIRA_EMAIL / JIRA_API_TOKEN are declared once on the category
# (fetchers/_categories/jira.yaml), as is JIRA_BASE_URL.
secrets: []

config_schema:
  lookback_days:
    type: integer
    required: false
    env: JIRA_LOOKBACK_DAYS
    default: 90
    description: >-
      Collect issues updated within this many days. Ignored when `jql` is set.
  jql:
    type: string
    required: false
    env: JIRA_ISSUE_JQL
    description: >-
      Explicit JQL for the issue query, e.g. `project in (OPS, CHG) AND
      updated >= -30d`. Overrides lookback_days entirely when set.
  projects:
    type: string
    required: false
    env: JIRA_PROJECTS
    description: >-
      Comma-separated project keys or exact project names (case does not
      matter) to limit the inventory to. A value is matched as a key first and
      as a name only when it is no project's key; metadata.projects_selected
      lists the keys it matched. Projects, issue types, statuses,
      service desks and issues then cover only these projects; the other
      projects are left out and only counted (metadata.projects_left_out).
      Priorities stay site-wide. The issue query is limited to these projects
      even when `jql` names others. A name that matches no project the
      account can see fails the run as bad_config.
  max_issues:
    type: integer
    required: false
    env: JIRA_MAX_ISSUES
    default: 2000
    description: >-
      Stop collecting issues after this many. Hitting the cap sets
      metadata.issues_truncated and fails the run as partial, like every other
      Jira fetcher: raise the cap or narrow JIRA_ISSUE_JQL for a complete run.

evidence_set:
  reference_id: EVD-JIRA-SITE-INVENTORY
  name: Jira Site Inventory and Issue Activity
  instructions: >-
    Script: jira/site_inventory/fetcher.py. Authenticates to the Jira Cloud REST API with an account
    email + API token (basic auth). Reads GET /rest/api/3/serverInfo,
    /rest/api/3/myself, /rest/api/3/project/search (expand=lead,insight,issueTypes),
    /rest/api/3/issuetype, /rest/api/3/priority/search and /rest/api/3/status
    (or GET /rest/api/3/project/{id}/statuses per project when JIRA_PROJECTS is
    set); lists service desks via GET /rest/servicedeskapi/servicedesk when Jira
    Service Management is present; and pages recent issues through
    POST /rest/api/3/search/jql (nextPageToken). When JIRA_PROJECTS is set,
    projects, issue types, statuses, service desks and issues are limited to
    the named projects; metadata.projects_left_out counts the others.
    Priorities stay site-wide. Summary counts are null, not
    zero, for a section whose read failed or did not finish (projects, or the
    issue sample when the search failed or hit the cap). Output:
    jira_site_inventory.json
  description: >-
    The projects, issue schemes and recent ticket activity of a Jira site,
    evidencing that changes and incidents are tracked, assigned and resolved in a
    system of record.

ksis:
  - KSI-CMT-LMC
  - KSI-INR-RPI
