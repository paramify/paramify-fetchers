name: jira_remediation_items
version: 0.2.0
description: >-
  Collects the Jira tickets that track findings to resolution (contingency plan
  test findings, assessment findings, any JQL-selected remediation work) with
  owner, due date, current status, full status history, linked issues, and
  rollups of open, overdue, unassigned and time to close.
category: jira

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 900

output:
  type: json
  path: jira_remediation_items.json

# JIRA_EMAIL / JIRA_API_TOKEN / JIRA_BASE_URL are declared on the category.
secrets: []

config_schema:
  jql:
    type: string
    required: true
    env: JIRA_REMEDIATION_JQL
    description: >-
      JQL that selects the findings tickets, e.g. `project = OPS AND labels =
      cp-test-finding`. Include closed tickets: closure is part of the evidence.
  due_date_field:
    type: string
    required: false
    env: JIRA_REMEDIATION_DUE_DATE_FIELD
    description: >-
      Field that holds each ticket's due date when the project does not use the
      built-in Due date: a field name (e.g. `Target date`) or customfield_ ids
      separated by commas. Empty reads the built-in Due date.
  risk_accepted_statuses:
    type: string
    required: false
    env: JIRA_REMEDIATION_RISK_ACCEPTED_STATUSES
    description: >-
      Comma-separated status names that mean the risk was accepted, not fixed
      (e.g. `Risk Accepted`). Those tickets are flagged and counted apart from
      the other closed tickets. Empty turns this off.
  risk_accepted_resolutions:
    type: string
    required: false
    env: JIRA_REMEDIATION_RISK_ACCEPTED_RESOLUTIONS
    description: >-
      Comma-separated resolution names that mean the risk was accepted, for
      projects that record it as a resolution. A ticket matching either setting
      is flagged.
  max_items:
    type: integer
    required: false
    env: JIRA_REMEDIATION_MAX_ITEMS
    default: 2000
    description: >-
      Stop after this many tickets. metadata.items_truncated records whether the
      cap was hit.

evidence_set:
  reference_id: EVD-JIRA-REMEDIATION-ITEMS
  name: Jira Remediation Items Tracked to Resolution
  instructions: >-
    Script: jira/remediation_items/fetcher.py. Basic auth (account email + API token) to the Jira Cloud
    REST API. Reads GET /rest/api/3/myself (collector and its timezone), the
    done-category statuses with GET /rest/api/3/status, pages the tickets
    matching JIRA_REMEDIATION_JQL through POST /rest/api/3/search/jql
    (nextPageToken) with summary, project, type, status, priority, assignee,
    reporter, created, updated, resolutiondate, resolution, duedate, labels,
    components, parent and issuelinks (plus the field named by
    JIRA_REMEDIATION_DUE_DATE_FIELD, resolved through GET /rest/api/3/field,
    which then replaces duedate as the due date), then reads every ticket's full status
    history with POST /rest/api/3/changelog/bulkfetch (fieldIds=status, 1000
    issues per call, de-duplicated by history id). Per item: is_open, overdue
    (open and due date passed; a date without a time has passed once its day
    is over in the collector's timezone), risk_accepted (status or resolution
    is one of JIRA_REMEDIATION_RISK_ACCEPTED_STATUSES / _RESOLUTIONS; null when
    neither is set), closed_at with closed_at_source (resolutiondate,
    else the last entry into the done category by status id from the history,
    rendered in the collector's timezone, else unknown when the history read
    failed or the status catalog could not be read, see
    metadata.done_statuses_known), reopened, days_open, days_to_close and
    status_transitions (at, by, from, from_id, to, to_id).
    Summary: total, open, closed, open_overdue, open_unassigned,
    open_without_due_date, open_due_date_unparseable, closed_after_due_date,
    risk_accepted, closed_risk_accepted, closed_excluding_risk_accepted (null
    when no risk-accepted value is set), closed_without_close_time,
    closed_close_time_unknown, days_to_close and open_age_days stats; counts
    are null, not zero, when the search did not finish or hit the cap, and the
    due-date counts are null when the configured due-date field could not be
    resolved (metadata.due_date_known). Output:
    jira_remediation_items.json
  description: >-
    Findings recorded as Jira tickets, each with an owner and a due date, and
    their movement to closure, evidencing that test and assessment findings are
    tracked to resolution.

ksis:
  - KSI-RPL-TRC
