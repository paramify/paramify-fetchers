name: jira_remediation_items
version: 0.1.0
description: >-
  Collects the Jira tickets that track findings to resolution (contingency plan
  test findings, assessment findings, any JQL-selected remediation work) with
  owner, due date, current status, full status history, linked issues, and
  rollups of open, overdue, unassigned and time to close.
category: jira

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 900

output:
  type: json
  path: jira_remediation_items.json

# JIRA_EMAIL / JIRA_API_TOKEN / JIRA_BASE_URL are declared on the category.
secrets: []

config_schema:
  jql:
    type: string
    required: true
    env: JIRA_REMEDIATION_JQL
    description: >-
      JQL that selects the findings tickets, e.g. `project = OPS AND labels =
      cp-test-finding`. Include closed tickets: closure is part of the evidence.
  max_items:
    type: integer
    required: false
    env: JIRA_REMEDIATION_MAX_ITEMS
    default: 2000
    description: >-
      Stop after this many tickets. metadata.items_truncated records whether the
      cap was hit.

evidence_set:
  reference_id: EVD-JIRA-REMEDIATION-ITEMS
  name: Jira Remediation Items Tracked to Resolution
  instructions: >-
    Script: jira/remediation_items/fetcher.py. Basic auth (account email + API token) to the Jira Cloud
    REST API. Reads GET /rest/api/3/myself (collector), pages the tickets
    matching JIRA_REMEDIATION_JQL through POST /rest/api/3/search/jql
    (nextPageToken) with summary, project, type, status, priority, assignee,
    reporter, created, updated, resolutiondate, resolution, duedate, labels,
    components, parent and issuelinks, then reads every ticket's full status
    history with POST /rest/api/3/changelog/bulkfetch (fieldIds=status, 1000
    issues per call, de-duplicated by history id). Per item: is_open, overdue
    (open and due date passed), closed_at with closed_at_source (resolutiondate,
    else the last move into the current status from the history rendered in the
    ticket's own UTC offset, else unknown when the history read failed),
    days_open, days_to_close and status_transitions (at, by, from, to).
    Summary: total, open, closed, open_overdue, open_unassigned,
    open_without_due_date, closed_after_due_date, closed_without_close_time,
    closed_close_time_unknown, days_to_close and open_age_days stats; counts
    are null, not zero, when the search did not finish or hit the cap. Output:
    jira_remediation_items.json
  description: >-
    Findings recorded as Jira tickets, each with an owner and a due date, and
    their movement to closure, evidencing that test and assessment findings are
    tracked to resolution.

ksis:
  - KSI-RPL-TRC
