name: jira_audit_records
version: 0.1.0
description: >-
  Collects the Jira site audit log over a lookback window (permission, user,
  group, workflow, scheme, project and system changes) with who made each change,
  when, from where and what changed, plus rollups by category, object type and
  author. Requires an account with the Administer Jira global permission.
category: jira

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 900

output:
  type: json
  path: jira_audit_records.json

# JIRA_EMAIL / JIRA_API_TOKEN / JIRA_BASE_URL are declared on the category.
secrets: []

config_schema:
  lookback_days:
    type: integer
    required: false
    env: JIRA_AUDIT_LOOKBACK_DAYS
    default: 90
    description: Collect audit records created within this many days.
  filter:
    type: string
    required: false
    env: JIRA_AUDIT_FILTER
    description: >-
      Optional text filter passed to the API's `filter` parameter (matches
      summary, category, event source, object, changed values, remote address).
  max_records:
    type: integer
    required: false
    env: JIRA_AUDIT_MAX_RECORDS
    default: 20000
    description: >-
      Stop after this many records. metadata.records_truncated records whether
      the cap was hit.

evidence_set:
  reference_id: EVD-JIRA-AUDIT-RECORDS
  name: Jira Administrative Audit Log
  instructions: >-
    Script: fetcher.py. Basic auth (account email + API token) to the Jira Cloud
    REST API as an account holding the Administer Jira global permission (the
    calls are read-only; the endpoint has no lower permission). Reads GET
    /rest/api/3/myself (collector) and pages GET /rest/api/3/auditing/record
    with from/to set to the lookback window and offset/limit=1000 until the
    reported total is reached. Per record: id, created, category, summary,
    event_source, author_account_id, remote_address, object (type, name,
    parent), associated_items and changed_values (field, from, to). Summary:
    total, oldest_record, newest_record (shows retention covers the window),
    distinct_authors, by_category, by_object_type, by_author and
    sensitive_changes (permissions, user/group management, workflows, issue
    security, system, projects, fields, notification schemes, screens). Issue
    edits are not in this log; organization-level audit is not collected.
    Output: jira_audit_records.json
  description: >-
    The Jira site's own record of administrative and configuration changes,
    evidencing that privileged activity on the change and incident tracking
    system is logged with actor, time and change detail. Supporting evidence
    only: it logs changes to Jira itself, not to the cloud service offering.

# Not KSI-MLA-ALA: that KSI is about who may read log data, not whether
# changes are logged.
ksis:
  - KSI-CMT-LMC
