name: jira_incident_postmortems
version: 0.2.1
description: >-
  Collects Jira incident tickets with severity, category, detected and reported
  times (minutes to report against a reporting window and per-category
  notification targets, or the initial report against a due-date field, with
  next-update and final-report due times), response phase history, post-mortems
  (linked tickets or a field on the incident) and their action items (owner,
  due date, status), with per-incident findings such as reported late, resolved
  without a post-mortem, post-mortem without action items, and unassigned or
  overdue action items.
category: jira

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 900

output:
  type: json
  path: jira_incident_postmortems.json

# JIRA_EMAIL / JIRA_API_TOKEN / JIRA_BASE_URL are declared on the category.
secrets: []

config_schema:
  jql:
    type: string
    required: true
    env: JIRA_INCIDENT_JQL
    description: >-
      JQL that selects the incident tickets, e.g. `project = IR AND issuetype =
      Incident`. Include resolved incidents.
  field_names:
    type: string
    required: false
    env: JIRA_INCIDENT_FIELDS
    description: >-
      JSON object overriding the Jira field names for each role. Keys: severity,
      category, detected_at, reported_at, phase. Defaults: "Severity", "Incident
      Category", "Detected At", "Reported At", "Incident Phase" (the names used
      while building the fetcher, so a new site usually needs its own). A value
      may be a field id such as customfield_10054, or several ids
      (comma-separated or a JSON list) when team-managed projects each have
      their own copy of the field. An empty value turns that role's checks off;
      metadata.checks_disabled lists the findings that can then no longer be
      produced, and a setting that depends on the turned-off field
      (required severities, required phases, category targets, report window)
      is refused as bad_config. Names that match no field, or several fields,
      are listed in metadata.field_problems and fail the run as partial; for
      several, metadata.field_candidates lists the ids to choose from.
      Without a reported-at field the ticket's created time is used and counted
      in summary.reported_time_from_ticket_created.
      Optional keys, off unless named here: reportable (with reportable_values,
      limits the reporting checks to incidents holding one of those values),
      initial_report_due (the initial report is then judged against this due
      time instead of report_minutes, using only the reported_at field's own
      value, never the created time; setting report_minutes as well is refused
      as bad_config), next_update_due and final_report_due (both need
      last_report_sent), last_report_sent, and postmortem (a text field on the
      incident that holds the post-mortem; only whether it is filled in is
      recorded, never its text). phase may name the built-in Status field when
      the workflow statuses are the response phases.
  report_minutes:
    type: integer
    required: false
    env: JIRA_INCIDENT_REPORT_MINUTES
    description: >-
      Maximum minutes from detection to report before an incident is flagged as
      reported late; 60 when not set. It has no default here on purpose: a
      default would count as set, and setting it with detected_at turned off or
      with an initial_report_due field is refused as bad_config.
  category_targets:
    type: string
    required: false
    env: JIRA_INCIDENT_CATEGORY_TARGETS
    description: >-
      JSON object of notification targets in minutes per category, matched by
      exact name or longest whole-word prefix, case-insensitive, e.g. {"CAT 4":
      15, "CAT 1": 120}. With targets set, a category without one is flagged.
  reportable_values:
    type: string
    required: false
    env: JIRA_INCIDENT_REPORTABLE_VALUES
    description: >-
      Comma-separated values of the reportable field that mean the incident must
      be reported, e.g. Yes. Required with the reportable field and refused
      without it. Reporting checks then run only on incidents holding one of
      these values; an incident with another value, or none, gets none of them.
  action_item_issue_types:
    type: string
    required: false
    env: JIRA_ACTION_ITEM_ISSUE_TYPES
    description: >-
      Comma-separated issue types that count as action items when linked
      straight to an incident, for sites that do not track them as sub-tasks of
      a post-mortem ticket. May not overlap postmortem_issue_types.
  postmortem_issue_types:
    type: string
    required: false
    env: JIRA_POSTMORTEM_ISSUE_TYPES
    default: Post-mortem
    description: Comma-separated issue types that count as post-mortems when linked to an incident.
  postmortem_required_severities:
    type: string
    required: false
    env: JIRA_POSTMORTEM_REQUIRED_SEVERITIES
    description: >-
      Comma-separated severities whose resolved incidents must have a post-mortem.
      Empty means every resolved incident.
  required_phases:
    type: string
    required: false
    env: JIRA_INCIDENT_REQUIRED_PHASES
    description: >-
      Comma-separated phases every resolved incident must have passed through
      (from the phase field's history), e.g.
      Identification,Containment,Eradication,Recovery,Lessons Learned.
  no_postmortem_resolutions:
    type: string
    required: false
    env: JIRA_NO_POSTMORTEM_RESOLUTIONS
    default: Won't Do,Cancelled,Canceled,Duplicate,False Positive,Not an Incident
    description: Comma-separated resolutions of incidents that need no post-mortem.
  max_items:
    type: integer
    required: false
    env: JIRA_INCIDENT_MAX_ITEMS
    default: 1000
    description: >-
      Stop after this many incidents; hitting the cap fails the run as partial and
      sets metadata.incidents_truncated.

evidence_set:
  reference_id: EVD-JIRA-INCIDENT-POSTMORTEMS
  name: Jira Incidents, Post-mortems and Action Items
  instructions: >-
    Script: jira/incident_postmortems/fetcher.py. Basic auth (account email + API token) to the Jira Cloud
    REST API v3; Browse Projects on the incident project is enough. Reads GET
    /rest/api/3/myself, resolves the configured field names with GET
    /rest/api/3/field, pages POST /rest/api/3/search/jql for the incidents
    (summary, type, status, priority, assignee, created, resolutiondate,
    issuelinks and the resolved custom fields), reads status and phase history
    with POST /rest/api/3/changelog/bulkfetch, then reads linked issues of the
    configured post-mortem types and their sub-tasks (the action items), and
    linked issues of the configured action item types, with
    POST /rest/api/3/issue/bulkfetch. Per incident: minutes_to_report (detected
    to reported), category target, phases_seen, post-mortems and action items.
    With an initial_report_due field the initial report is judged against that
    due time (initial_report_late, or initial_report_not_recorded_past_due when
    the reported_at field is empty after the due time; the ticket's created
    time is never taken as the report) and the fixed-window findings are listed
    in metadata.checks_disabled. With next_update_due an open incident whose
    due time has passed with no report at or after it is update_overdue. With
    final_report_due, a passed due time with no report recorded is
    no_report_by_final_due, and a last report later than it is
    last_report_after_final_due. A due or report value that cannot be read as
    a time is report_deadline_unparseable. A due date without a time compares
    calendar days, and has passed once that day is over in the collector's
    Jira timezone. Because last_report_sent holds only the latest report,
    last_report_after_final_due cannot tell a late final report from a further
    report sent after an on-time one. Jira strips links to issues the collector
    cannot see, so linked action items in a project without Browse are not counted.
    With phase set to the Status field, a required phase that is itself a
    done-category status is checked on every resolved incident. With a reportable field these checks, reported_late and
    category targets run only where reporting_checks_apply is true. With a
    postmortem field, a filled field counts as the post-mortem
    (postmortem_field_filled); its text is not collected. A configured field
    that could not be resolved runs none of its checks
    (postmortem_field_not_read under unknown) and fails the run.
    Only links to the configured post-mortem types are followed. Jira strips
    links to issues the collector cannot see (measured: an issue in a project
    without Browse disappears from issuelinks and from bulkfetch without an
    issueErrors entry), so the collector must hold Browse Projects on the
    post-mortem project or the incident is reported as resolved_without_postmortem.
    A check that could not run because a read failed is listed per incident
    under unknown, never under findings: postmortem_not_visible and
    action_items_not_visible (a linked issue the bulk call failed to read) and
    phases_unknown (the history read failed, so past phases are unseen); such a
    run fails as partial and summary.action_items is null whenever any
    post-mortem or action item was not read.
    A detected or reported value that is a date without a time cannot measure
    minutes, so it is report_time_not_measurable, never late or on time.
    Findings: initial_report_late, initial_report_not_recorded_past_due,
    initial_report_due_not_set (an incident whose reportable field marks it as
    reportable has no initial report due time),
    update_overdue, no_report_by_final_due, last_report_after_final_due,
    report_deadline_unparseable, missing_detected_time, report_time_not_measurable,
    detected_or_reported_time_unparseable,
    reported_before_detected, reported_late,
    category_notification_target_missed, missing_severity, missing_category,
    category_without_target, phases_missing, resolved_without_postmortem,
    postmortem_without_action_items, unassigned_action_items,
    overdue_action_items. A finding is produced only when the field it reads
    is turned on; metadata.checks_disabled lists the rest, and
    summary.incidents_without_report_timing counts incidents whose report time
    could not be measured. Summary counts are null, not zero, when the search
    did not finish or hit the cap. metadata.partial_failure is true whenever
    the run is incomplete. Descriptions and comments are not collected. Output:
    jira_incident_postmortems.json
  description: >-
    Incident tickets with their reporting times, response phases and linked
    post-mortems with assigned action items, evidencing that incidents are
    reported on time, worked through defined phases, and reviewed afterward with
    lessons learned turned into tracked actions.

ksis:
  - KSI-INR-AAR
  - KSI-INR-RPI
