name: wiz_inventory
version: 0.1.0
description: >-
  Cloud resource inventory from Wiz (cloudResourcesV2), one record per
  resource with its account, region, tags, owners, IPs and OS, joined with the
  resource's open Inventory Management findings (tag enforcement, agent
  coverage, custom rules). Shaped for a Paramify inventory pipeline.
category: wiz

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 3600

output:
  type: json
  path: wiz_inventory.json

secrets:
  - name: client_id
    env: WIZ_CLIENT_ID
    description: Wiz service account Client ID (Custom Integration, read-only scopes).
  - name: client_secret
    env: WIZ_CLIENT_SECRET
    description: Wiz service account Client Secret.

config_schema:
  api_endpoint_url:
    type: string
    required: true
    env: WIZ_API_ENDPOINT_URL
    description: >-
      Tenant GraphQL endpoint from Wiz > User menu > Tenant Info > API Endpoint
      URL, e.g. https://api.us2.app.wiz.us/graphql (Wiz for Gov) or
      https://api.us17.app.wiz.io/graphql (commercial).
  auth_url:
    type: string
    required: false
    env: WIZ_AUTH_URL
    default: https://auth.app.wiz.us/oauth/token
    description: >-
      Token URL from Tenant Info > Authentication URL. Defaults to Wiz for Gov.
      Commercial tenants use https://auth.app.wiz.io/oauth/token.
  min_request_interval:
    type: string
    required: false
    env: WIZ_MIN_REQUEST_INTERVAL
    default: "1.0"
    description: Seconds between API calls. Wiz tenants share a rate limit with every other integration.
  page_size:
    type: integer
    required: false
    env: WIZ_PAGE_SIZE
    default: 100
    description: Records per GraphQL page (max 500).
  max_records:
    type: integer
    required: false
    env: WIZ_MAX_RECORDS
    default: 50000
    description: >-
      Safety cap on resources (and, separately, findings) pulled. Hitting it is
      reported as a failure, never silent truncation.
  resource_types:
    type: string
    required: false
    env: WIZ_INVENTORY_RESOURCE_TYPES
    default: >-
      VIRTUAL_MACHINE,CONTAINER,CONTAINER_IMAGE,KUBERNETES_CLUSTER,DB_SERVER,DATABASE,BUCKET,SERVERLESS,LOAD_BALANCER,GATEWAY,FIREWALL,VIRTUAL_NETWORK,SUBNET,VOLUME,ENCRYPTION_KEY,SECRET
    description: >-
      Comma-separated Wiz resource types (the Type column on Wiz > Inventory >
      Cloud Resources, e.g. VIRTUAL_MACHINE, DB_SERVER, BUCKET). ALL collects
      every type, which on most tenants is dominated by IAM policies and
      service accounts. A type Wiz does not know is refused before any paging.
  cloud_platforms:
    type: string
    required: false
    env: WIZ_INVENTORY_CLOUD_PLATFORMS
    default: ""
    description: >-
      Comma-separated cloud platforms to keep, e.g. AWS,Azure,GCP. Empty keeps
      every platform.
  cloud_account_ids:
    type: string
    required: false
    env: WIZ_INVENTORY_CLOUD_ACCOUNT_IDS
    default: ""
    description: >-
      Comma-separated cloud account external IDs (AWS account IDs, Azure
      subscription IDs, GCP project IDs) that make up the authorization
      boundary. Empty keeps every account the service account can see.
  project_ids:
    type: string
    required: false
    env: WIZ_INVENTORY_PROJECT_IDS
    default: ""
    description: >-
      Comma-separated Wiz project IDs to limit the inventory to. Empty keeps
      every project the service account can see. Also limits the findings.
  include_deleted:
    type: boolean
    required: false
    env: WIZ_INVENTORY_INCLUDE_DELETED
    default: false
    description: Also list resources Wiz has seen deleted. Off by default so the inventory reflects what exists now.
  include_inventory_findings:
    type: boolean
    required: false
    env: WIZ_INVENTORY_INCLUDE_FINDINGS
    default: true
    description: >-
      Join each resource with its Inventory Management findings (Wiz >
      Findings > Inventory Management Findings). Turn off if the service
      account cannot read them; a failed findings pull fails the run rather
      than sending an inventory that silently lacks them.
  finding_statuses:
    type: string
    required: false
    env: WIZ_INVENTORY_FINDING_STATUSES
    default: "OPEN,IN_PROGRESS"
    description: >-
      Inventory Management finding statuses to join (OPEN, IN_PROGRESS,
      RESOLVED, REJECTED). The default matches the Unresolved filter in the
      Wiz portal.
  environment_tag_keys:
    type: string
    required: false
    env: WIZ_ENVIRONMENT_TAG_KEYS
    default: "Environment,env"
    description: >-
      Resource tag keys (case-insensitive, first match wins) copied into each
      record's environment field, for pipeline rules such as "environment is
      prod, so criticality is high".
  owner_tag_keys:
    type: string
    required: false
    env: WIZ_OWNER_TAG_KEYS
    default: "Owner"
    description: >-
      Resource tag keys (case-insensitive, first match wins) copied into each
      record's owner field. When no tag matches, the first owner Wiz itself
      attributes to the resource is used.

evidence_set:
  reference_id: EVD-WIZ-INVENTORY
  name: Wiz Cloud Resource Inventory
  instructions: >-
    Script: fetcher.py. Read-only service account (scope read:resources, plus
    read access to Inventory Management findings). Pages cloudResourcesV2 with
    the configured type, platform, account and project filters, then pages
    inventoryFindings for the configured statuses and attaches each finding to
    the resource it names. Writes one record per resource under payload.data,
    which is the data path for a Paramify inventory pipeline attached to this
    evidence set.
  description: >-
    Automatically generated inventory of cloud resources in the authorization
    boundary as discovered by Wiz, with tag-governance and agent-coverage
    findings per resource.

ksis:
  - KSI-PIY-GIV
