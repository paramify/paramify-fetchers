name: datadog_log_pipelines
version: 0.1.0
description: Retrieves Datadog log processing pipeline configurations to prove defined event types are ingested and processed.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_log_pipelines.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
  description: >-
    Datadog API key, which identifies the organization (Organization Settings → API
    Keys).
- name: app_key
  env: DATADOG_APP_KEY
  description: >-
    Datadog application key of a service account with the Datadog Read Only role
    (Organization Settings → Service Accounts → the account → New Key).
- name: base_url
  env: DATADOG_BASE_URL
  required: false
  description: >-
    Datadog API base URL. Defaults to https://api.ddog-gov.com (Datadog for Government);
    set https://api.datadoghq.com for commercial US1, or your site's API host.

ksis:
  - KSI-MLA-LET

evidence_set:
  reference_id: EVD-DD-LOG-PIPELINES
  name: Datadog Log Pipelines
  instructions: 'Script: datadog/log_pipelines/fetcher.py. Calls GET /api/v1/logs/config/pipelines. Extracts pipeline name, type, enabled state, filter query, and processor count. Writes JSON pipeline config list.'
