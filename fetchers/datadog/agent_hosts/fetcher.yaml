name: datadog_agent_hosts
version: 0.1.0
description: Retrieves real-time inventory of all hosts reporting via the Datadog agent, including platform, cloud provider, agent version, and up/muted status.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_agent_hosts.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
  description: >-
    Datadog API key, which identifies the organization (Organization Settings → API
    Keys).
- name: app_key
  env: DATADOG_APP_KEY
  description: >-
    Datadog application key of a service account with the Datadog Read Only role
    (Organization Settings → Service Accounts → the account → New Key).
- name: base_url
  env: DATADOG_BASE_URL
  required: false
  description: >-
    Datadog API base URL. Defaults to https://api.ddog-gov.com (Datadog for Government);
    set https://api.datadoghq.com for commercial US1, or your site's API host.

ksis:
  - KSI-PIY-GIV

evidence_set:
  reference_id: EVD-DD-AGENT-HOSTS
  name: Datadog Agent Hosts
  instructions: 'Script: datadog/agent_hosts/fetcher.py. Calls GET /api/v1/hosts with pagination (start/count). Extracts host name, platform, agent version, cloud provider, aliases, and up/muted state. Writes JSON inventory.'
