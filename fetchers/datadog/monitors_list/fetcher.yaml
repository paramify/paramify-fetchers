name: datadog_monitors_list
version: 0.1.1
description: Retrieves Datadog monitor configurations to prove persistent alerting is defined for infrastructure and security events.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_monitors_list.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
  description: >-
    Datadog API key, which identifies the organization (Organization Settings → API
    Keys).
- name: app_key
  env: DATADOG_APP_KEY
  description: >-
    Datadog application key of a service account with the Datadog Read Only role
    (Organization Settings → Service Accounts → the account → New Key).
- name: base_url
  env: DATADOG_BASE_URL
  required: false
  description: >-
    Datadog API base URL. Defaults to https://api.ddog-gov.com (Datadog for Government);
    set https://api.datadoghq.com for commercial US1, or your site's API host.

ksis:
  - KSI-MLA-RVL

evidence_set:
  reference_id: EVD-DD-MONITORS
  name: Datadog Monitors List
  instructions: 'Script: datadog/monitors_list/fetcher.py. Calls GET /api/v1/monitor with pagination. Extracts monitor name, type, overall_state, the full query and message, the @-notification targets in the message, and thresholds, notify_no_data and no_data_timeframe from options. Writes JSON monitor list.'
