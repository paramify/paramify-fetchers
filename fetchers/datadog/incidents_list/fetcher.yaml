name: datadog_incidents_list
version: 0.2.0
description: Retrieves incident records from Datadog for after-action review and pattern analysis within a configurable lookback window.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_incidents_list.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
- name: app_key
  env: DATADOG_APP_KEY
- name: base_url
  env: DATADOG_BASE_URL
- name: incidents_lookback_days
  env: DATADOG_INCIDENTS_LOOKBACK_DAYS
ksis:
  - KSI-INR-RPI

evidence_set:
  reference_id: EVD-DD-INCIDENTS-LIST
  name: Datadog Incidents List
  instructions: 'Script: datadog/incidents_list/fetcher.py. Calls GET /api/v2/incidents with offset pagination. Lookback window controlled by DATADOG_INCIDENTS_LOOKBACK_DAYS (default 90). The date filter it sends is not documented, so the fetcher also drops each incident created before the window (summary.incidents_outside_lookback_dropped). Extracts title, severity, state, detected and resolved times (resolution_hours from the two), customer impact, and the commander from relationships.commander_user. Postmortems are incident attachments, which the fetcher does not read, so postmortem_id, incidents_with_postmortem and resolved_without_postmortem_ids are null (unknown). Writes JSON incident list.'
