name: datadog_incident_timelines
version: 0.2.0
description: Retrieves per-incident timeline entries from Datadog to support after-action reviews and incident response documentation.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_incident_timelines.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
- name: app_key
  env: DATADOG_APP_KEY
- name: base_url
  env: DATADOG_BASE_URL
- name: incidents_lookback_days
  env: DATADOG_INCIDENTS_LOOKBACK_DAYS
ksis:
  - KSI-INR-AAR

evidence_set:
  reference_id: EVD-DD-INCIDENT-TIMELINES
  name: Datadog Incident Timelines
  instructions: 'Script: datadog/incident_timelines/fetcher.py. Calls GET /api/v2/incidents with offset pagination, then GET /api/v2/incidents/{id}/relationships/timeline_cells for each incident. Lookback window controlled by DATADOG_INCIDENTS_LOOKBACK_DAYS (default 90); an incident created before the window is dropped. Keeps each timeline cell''s type, timestamps, author, important flag and content text. A failed timeline read gives timeline_cells null for that incident, an entry in metadata.api_failures and status partial_failure. Writes JSON timeline data.'
