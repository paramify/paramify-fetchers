name: datadog_siem_signals
version: 0.2.0
description: Retrieves Datadog security signals generated by SIEM detection rules to prove events are being detected and reviewed.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_siem_signals.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
  description: >-
    Datadog API key, which identifies the organization (Organization Settings → API
    Keys).
- name: app_key
  env: DATADOG_APP_KEY
  description: >-
    Datadog application key of a service account with the Datadog Read Only role
    (Organization Settings → Service Accounts → the account → New Key).
- name: base_url
  env: DATADOG_BASE_URL
  required: false
  description: >-
    Datadog API base URL. Defaults to https://api.ddog-gov.com (Datadog for Government);
    set https://api.datadoghq.com for commercial US1, or your site's API host.
- name: signals_lookback_days
  env: DATADOG_SIGNALS_LOOKBACK_DAYS
  required: false
  description: How many days back to collect Cloud SIEM signals. Defaults to 30.
ksis:
  - KSI-MLA-RVL

evidence_set:
  reference_id: EVD-DD-SIEM-SIGNALS
  name: Datadog SIEM Signals
  instructions: 'Script: datadog/siem_signals/fetcher.py. Calls POST /api/v2/security_monitoring/signals/search with a lookback window. Lookback controlled by DATADOG_SIGNALS_LOOKBACK_DAYS (default 30). Extracts each signal''s triage state (status), severity, timestamp and rule from attributes.attributes. Writes JSON signals list.'
