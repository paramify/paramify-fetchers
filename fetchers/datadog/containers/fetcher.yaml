name: datadog_containers
version: 0.1.0
description: Retrieves real-time inventory of all running containers across the organization, including image, state, host, and Kubernetes metadata.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_containers.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
  description: >-
    Datadog API key, which identifies the organization (Organization Settings → API
    Keys).
- name: app_key
  env: DATADOG_APP_KEY
  description: >-
    Datadog application key of a service account with the Datadog Read Only role
    (Organization Settings → Service Accounts → the account → New Key).
- name: base_url
  env: DATADOG_BASE_URL
  required: false
  description: >-
    Datadog API base URL. Defaults to https://api.ddog-gov.com (Datadog for Government);
    set https://api.datadoghq.com for commercial US1, or your site's API host.

ksis:
  - KSI-PIY-GIV

evidence_set:
  reference_id: EVD-DD-CONTAINERS
  name: Datadog Containers
  instructions: 'Script: datadog/containers/fetcher.py. Calls GET /api/v2/containers with cursor-based pagination. Extracts container name, image, state, host, tags. Writes JSON inventory.'
