name: datadog_log_archives
version: 0.1.1
description: Retrieves Datadog log archive configurations to prove logs are durably stored in long-term storage.
category: datadog

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: datadog_log_archives.json

secrets:
- name: api_key
  env: DATADOG_API_KEY
  description: >-
    Datadog API key, which identifies the organization (Organization Settings → API
    Keys).
- name: app_key
  env: DATADOG_APP_KEY
  description: >-
    Datadog application key of a service account with the Datadog Read Only role
    (Organization Settings → Service Accounts → the account → New Key).
- name: base_url
  env: DATADOG_BASE_URL
  required: false
  description: >-
    Datadog API base URL. Defaults to https://api.ddog-gov.com (Datadog for Government);
    set https://api.datadoghq.com for commercial US1, or your site's API host.

ksis:
  - KSI-MLA-OSM

evidence_set:
  reference_id: EVD-DD-LOG-ARCHIVES
  name: Datadog Log Archives
  instructions: 'Script: datadog/log_archives/fetcher.py. Calls GET /api/v2/logs/config/archives. Extracts archive name, destination type and location, state, include_tags, and filter query. summary.enabled_archives counts archives in state WORKING or WORKING_AUTH_LEGACY. Writes JSON archive config list.'
