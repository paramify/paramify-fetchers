name: aws_inspector_ecr_report
version: 0.3.0
description: Converts active Inspector ECR findings to a complete CSV for a Paramify vulnerability assessment, preserving finding and image identity, package details, severity and observation dates.
category: aws
kind: issue_report
supports_targets: true
runtime:
  type: python
  entry: fetcher.py
  timeout: 3600
output:
  type: csv
  path: aws_inspector_ecr_report.csv
  aggregation: per_target
secrets: []
target_schema:
  region:
    type: string
    required: false
    env: AWS_DEFAULT_REGION
    description: AWS region; defaults to the AWS CLI credential/configuration chain.
  profile:
    type: string
    required: false
    env: AWS_PROFILE
    description: AWS profile; omit for the ambient role or credentials.
config_schema:
  repositories:
    type: string
    default: '[]'
    env: AWS_INSPECTOR_REPOSITORIES
    description: JSON array of up to ten exact repository names. Empty selects all repositories in the account and region.
  image_tags:
    type: string
    default: '[]'
    env: AWS_INSPECTOR_IMAGE_TAGS
    description: JSON array of up to ten image tags, matched with OR. Empty includes untagged images too. An image matches by its own tags or by the tags of a multi-architecture index that points to it (read with ECR BatchGetImage). Tags do not prove deployment.
  in_use_only:
    type: boolean
    default: false
    env: AWS_INSPECTOR_IN_USE_ONLY
    description: Only images Inspector reports as running in Amazon ECS or EKS now (inUseCount of at least 1). Inspector decides usage, so an image it has no coverage record for is out of scope rather than a coverage gap.
  last_in_use_days:
    type: integer
    default: 0
    env: AWS_INSPECTOR_LAST_IN_USE_DAYS
    description: Only images Inspector saw running in ECS or EKS within this many days. 0 applies no filter. Like in_use_only, an image without Inspector coverage is out of scope.
  pushed_within_days:
    type: integer
    default: 0
    env: AWS_INSPECTOR_PUSHED_WITHIN_DAYS
    description: Only images pushed to ECR within this many days. 0 applies no filter.
  min_severity:
    type: string
    default: ''
    env: AWS_INSPECTOR_MIN_SEVERITY
    description: Only findings of this severity or higher (CRITICAL, HIGH, MEDIUM, LOW or INFORMATIONAL). UNTRIAGED findings are always included. Empty applies no filter.
  allow_empty:
    type: boolean
    default: false
    env: AWS_INSPECTOR_ALLOW_EMPTY
    description: Allow a header-only zero-finding report after successful collection and coverage checks. Does not allow disabled scanning or incomplete coverage; a scope that matches no images also needs allow_no_images.
  allow_no_images:
    type: boolean
    default: false
    env: AWS_INSPECTOR_ALLOW_NO_IMAGES
    description: Allow a scope that matches no images, such as a tag no image carries yet. Requires allow_empty, since such a report is header-only. A misspelled tag or a usage filter that Inspector cannot match also selects no images, so check the evidence's repository_image_count and image_count.
issue_report:
  assessment_type: VULNERABILITY
  title: Inspector ECR Vulnerability Findings
