name: aws_config_conformance_packs
version: 0.6.0
description: Shows AWS Config conformance pack deployment status, rule and resource compliance, and the FedRAMP and NIST SP 800-53 Revision 5 controls each rule maps to.
category: aws

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: aws_config_conformance_packs.json
  aggregation: per_target

config_schema:
  fedramp_pack:
    type: string
    required: true
    default: low
    env: FEDRAMP_PACK
    description: FedRAMP reference conformance pack to validate against. Supported values are low and moderate; defaults to low for compatibility with existing manifests.

target_schema:
  region:
    type: string
    required: false
    env: AWS_DEFAULT_REGION
    description: AWS region to collect from.
  profile:
    type: string
    required: false
    env: AWS_PROFILE
    description: AWS named profile (credentials resolved from ~/.aws / SSO).

secrets: []

ksis:
  - KSI-MLA-EVC
  - KSI-CNA-IBP

evidence_set:
  reference_id: EVD-CONFIG-PACKS
  name: AWS Config Conformance Packs
  instructions: |
    Script: aws/config_conformance_packs/fetcher.py

    Access: sts:GetCallerIdentity, config:DescribeConformancePacks, config:DescribeConformancePackStatus, config:DescribeConformancePackCompliance, config:DescribeConfigRules, config:GetConformancePackComplianceSummary and config:GetConformancePackComplianceDetails.

    Commands Executed:
    - STS GetCallerIdentity — record the account collected from
    - Config DescribeConformancePacks — list the conformance packs deployed in the region
    - Config DescribeConformancePackStatus (per pack) — read the pack's deployment state
    - Config DescribeConformancePackCompliance (per pack) — read each rule's compliance: compliant, non-compliant or insufficient data
    - Config DescribeConfigRules (per pack) — resolve the pack's generated rule names to their Source.SourceIdentifier, which links them to the FedRAMP and NIST SP 800-53 Revision 5 mappings
    - Config GetConformancePackComplianceDetails (per rule) — read the resource evaluations behind each rule's result
    - Config GetConformancePackComplianceSummary (per pack) — read AWS's own compliance summary for the pack

    Output: aws_config_conformance_packs_<profile>_<region>.json — for each conformance pack, its deployment state, every rule's compliance with its FedRAMP and NIST SP 800-53 Revision 5 controls, the non-compliant resources, control-level compliance rolled up from the mapped rules, and how the deployed rules compare with the selected FedRAMP reference pack, plus a per-pack summary of rule and control counts; any failed call fails the run.
