name: aws_config_conformance_packs
version: 0.4.0
description: Collects AWS Config conformance pack deployment status, rule and resource compliance, and maps Config rules to FedRAMP and NIST SP 800-53 Rev. 5 controls.
category: aws

supports_targets: true

runtime:
  type: bash
  entry: fetcher.sh

output:
  type: json
  path: aws_config_conformance_packs.json
  aggregation: per_target

config_schema:
  fedramp_pack:
    type: string
    required: true
    default: low
    env: FEDRAMP_PACK
    description: FedRAMP reference conformance pack to validate against. Supported values are low and moderate; defaults to low for compatibility with existing manifests.

target_schema:
  region:
    type: string
    required: false
    env: AWS_DEFAULT_REGION
    description: AWS region to collect from.
  profile:
    type: string
    required: false
    env: AWS_PROFILE
    description: AWS named profile (credentials resolved from ~/.aws / SSO).

secrets: []

ksis:
  - KSI-MLA-EVC
  - KSI-CNA-IBP

evidence_set:
  reference_id: EVD-CONFIG-PACKS
  name: AWS Config Conformance Packs
  instructions: 'Commands executed: aws configservice describe-conformance-packs, describe-conformance-pack-status, describe-conformance-pack-compliance, describe-config-rules, get-conformance-pack-compliance-summary, get-conformance-pack-compliance-details. Source.SourceIdentifier links generated conformance-pack rule names to the selected FedRAMP and NIST SP 800-53 Rev. 5 mappings.'
