name: aws_ecr_image_scanning
version: 0.3.0
description: Lists ECR repositories, effective scanning configuration and latest-image findings across basic, manual and enhanced scanning, preserving scan status, timestamps and every severity.
category: aws

supports_targets: true

runtime:
  type: bash
  entry: fetcher.sh
  # Enhanced scans are counted by reading every finding page (~90s per 10k findings).
  timeout: 3600

output:
  type: json
  path: aws_ecr_image_scanning.json
  aggregation: per_target

target_schema:
  region:
    type: string
    required: false
    env: AWS_DEFAULT_REGION
    description: Optional. AWS region to collect from; falls back to the ambient region (AWS_REGION / instance) when omitted.
  profile:
    type: string
    required: false
    env: AWS_PROFILE
    description: Optional. AWS named profile for multi-account fanout; falls back to the ambient identity (IRSA / instance role / SSO / env) when omitted.
secrets: []

ksis:
  - KSI-SCR-MON

evidence_set:
  reference_id: EVD-ECR-IMAGE-SCANNING
  name: ECR Image Scanning Configuration
  instructions: 'Script: aws/ecr_image_scanning/fetcher.sh. Commands executed: aws ecr describe-repositories, aws ecr get-registry-scanning-configuration, aws ecr batch-get-repository-scanning-configuration, aws ecr describe-images, aws ecr describe-image-scan-findings.'
