name: aws_ecr_image_scanning
version: 0.5.0
description: Lists ECR repositories, effective scanning configuration and latest-image findings across basic, manual and enhanced scanning, preserving scan status, timestamps and every severity.
category: aws

supports_targets: true

runtime:
  type: python
  entry: fetcher.py
  # Enhanced scans are counted by reading every finding page, 1,000 findings per request.
  timeout: 3600

output:
  type: json
  path: aws_ecr_image_scanning.json
  aggregation: per_target

target_schema:
  region:
    type: string
    required: false
    env: AWS_DEFAULT_REGION
    description: Optional. AWS region to collect from; falls back to the ambient region (AWS_REGION / AWS config) when omitted.
  profile:
    type: string
    required: false
    env: AWS_PROFILE
    description: Optional. AWS named profile for multi-account fanout; falls back to the ambient identity (IRSA / instance role / SSO / env) when omitted.
secrets: []

ksis:
  - KSI-SCR-MON

evidence_set:
  reference_id: EVD-ECR-IMAGE-SCANNING
  name: ECR Image Scanning Configuration
  instructions: |
    Script: aws/ecr_image_scanning/fetcher.py

    Access: sts:GetCallerIdentity, ecr:GetRegistryScanningConfiguration, ecr:DescribeRepositories, ecr:BatchGetRepositoryScanningConfiguration, ecr:DescribeImages and ecr:DescribeImageScanFindings. With enhanced scanning, also inspector2:ListCoverage and inspector2:ListFindings; without them, AWS denies the scan findings read.

    Commands Executed:
    - STS GetCallerIdentity — record the account collected from
    - ECR GetRegistryScanningConfiguration — read the registry scan type and its rules
    - ECR DescribeRepositories — list every repository
    - ECR BatchGetRepositoryScanningConfiguration — read each repository's effective scan frequency and the filters that apply to it
    - ECR DescribeImages (per repository) — find the most recently pushed image
    - ECR DescribeImageScanFindings (per repository) — read that image's scan status and count its findings by severity

    Output: aws_ecr_image_scanning_<profile>_<region>.json — the registry scan type and rules, and one record per repository with its scan frequency, applied scan filters, scan-on-push flag and its latest image's scan status, timestamps and severity counts. scan_collection_status says why a repository has no scan result; any failed call fails the run.
