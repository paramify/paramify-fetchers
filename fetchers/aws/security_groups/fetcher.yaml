name: aws_security_groups
version: 0.4.0
description: Lists EC2 security groups (ID, name, VPC) and per-group inbound/outbound rules (protocol, port range, IPv4 and IPv6 CIDRs, referenced security groups and prefix lists), including all-traffic rules that have no port range.
category: aws

supports_targets: true

runtime:
  type: bash
  entry: fetcher.sh

output:
  type: json
  path: aws_security_groups.json
  aggregation: per_target

target_schema:
  region:
    type: string
    required: false
    env: AWS_DEFAULT_REGION
    description: AWS region to collect from.
  profile:
    type: string
    required: false
    env: AWS_PROFILE
    description: AWS named profile (credentials resolved from ~/.aws / SSO).

secrets: []

ksis:
  - KSI-CNA-RNT
  - KSI-CNA-MAT

evidence_set:
  reference_id: EVD-SECURITY-GROUPS
  name: Security Groups
  instructions: 'Script: fetcher.sh. Commands executed: aws ec2 describe-security-groups'
