name: aws_detect_new_aws_resource
version: 0.1.0
description: Verifies the new-resource detection pipeline (AWS Config recorders, a configurable EventBridge rule and its targets/schedule, a configurable SNS topic and subscriptions) and validates enabled state, event-pattern presence and SNS target linkage. Monitoring intervals are checked only for scheduled rules.
category: aws

supports_targets: true

runtime:
  type: bash
  entry: fetcher.sh

output:
  type: json
  path: aws_detect_new_aws_resource.json
  aggregation: per_target

target_schema:
  region:
    type: string
    required: false
    env: AWS_DEFAULT_REGION
    description: AWS region to collect from.
  profile:
    type: string
    required: false
    env: AWS_PROFILE
    description: AWS named profile (credentials resolved from ~/.aws / SSO).

  rule_name:
    type: string
    required: false
    env: AWS_DETECT_NEW_RESOURCE_RULE_NAME
    description: Exact EventBridge rule name. Defaults to New-Resource-Launched-Alert-Rule.
  topic_name:
    type: string
    required: false
    env: AWS_DETECT_NEW_RESOURCE_TOPIC_NAME
    description: Exact SNS topic name. Defaults to New_AWS_Resource_Launch_Detected.

secrets: []

ksis:
  - KSI-PIY-GIV
  - KSI-CMT-LMC

evidence_set:
  reference_id: EVD-DETECT-NEW-RESOURCE
  name: Detect New AWS Resource
  instructions: 'Script: detect_new_aws_resource.sh. Commands executed: aws configservice describe-configuration-recorders, aws events list-rules, aws sns list-topics'
