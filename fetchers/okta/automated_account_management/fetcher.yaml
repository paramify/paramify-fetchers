name: okta_automated_account_management
version: 0.1.0
description: FedRAMP KSI-IAM-AAM evidence. Collects automated account management evidence from Okta.
category: okta

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: okta_automated_account_management.json

secrets:
- name: api_token
  env: OKTA_API_TOKEN
- name: org_url
  env: OKTA_ORG_URL

ksis:
  - KSI-IAM-AAM

evidence_set:
  reference_id: EVD-OKTA-KSI-IAM-07
  name: Okta Automated Account Management
  instructions: 'Script: okta/automated_account_management/fetcher.py. Uses Okta APIs to collect account lifecycle monitoring and health evidence. Output: okta_automated_account_management.json'
