name: okta_least_privilege
version: 0.1.0
description: FedRAMP KSI-IAM-ELP evidence. Collects least privilege evidence from Okta.
category: okta

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: okta_least_privilege.json

secrets:
- name: api_token
  env: OKTA_API_TOKEN
- name: org_url
  env: OKTA_ORG_URL

config_schema:
  known_super_admins:
    type: string
    default: ''
    env: OKTA_KNOWN_SUPER_ADMINS
    description: Optional comma-separated Okta logins/emails to treat as Super Admins on top of the role, group, and app detection methods. For tenants that grant Super Admin outside a discoverable group. Empty by default.

ksis:
  - KSI-IAM-ELP

evidence_set:
  reference_id: EVD-OKTA-KSI-IAM-05
  name: Okta Least Privilege
  instructions: 'Script: okta_least_privilege.py. Uses Okta APIs to identify admins and summarize privileged access. Output: okta_least_privilege.json'
