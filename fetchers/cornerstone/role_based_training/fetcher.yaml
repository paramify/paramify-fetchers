name: cornerstone_role_based_training
version: 0.1.0
description: >-
  Role-specific training for high-risk roles completion from Cornerstone Learning (Reporting API
  vw_rpt_training and vw_rpt_transcript), for the course(s) named in config:
  per user (Cornerstone numeric user id only) the latest registration status
  (completed / exempt / in_progress / not_started / overdue), last
  completion date and whether it falls inside the retraining interval, plus
  each course's version and last content change. A course name that matches
  nothing in the catalog reports every metric as null (not 0) and
  config_resolution names what did not resolve.
category: cornerstone

supports_targets: false

config_schema:
  courses:
    type: string
    required: true
    env: CSOD_ROLE_BASED_COURSES
    description: >-
      Comma-separated Cornerstone courses to measure, each matched exactly
      against the training title, the Training Reference Number or the Course
      Code, or given as the training object id (e.g. "Privileged User Security Training").
      Whitespace around each name is trimmed.
  retraining_interval_days:
    type: integer
    required: false
    default: 365
    env: CSOD_RETRAINING_INTERVAL_DAYS
    description: >-
      A user whose most recent completion is older than this many days (or who
      never completed) is reported as needs_retraining.
  content_review_interval_days:
    type: integer
    required: false
    default: 365
    env: CSOD_CONTENT_REVIEW_INTERVAL_DAYS
    description: >-
      A course whose catalog entry has not changed (last modified or new
      version effective) within this many days is flagged in
      courses[].trainings[].content_changed_within_review_interval.

runtime:
  type: python
  entry: fetcher.py
  timeout: 900

output:
  type: json
  path: cornerstone_role_based_training.json

# CSOD_CLIENT_ID / CSOD_CLIENT_SECRET and CSOD_PORTAL_URL are declared once on
# the category (fetchers/_categories/cornerstone.yaml).
secrets: []

ksis:
  - KSI-CED-RAT

evidence_set:
  reference_id: EVD-CORNERSTONE-ROLE-BASED-TRAINING
  name: Cornerstone Role-Based Training for High-Risk Roles
  instructions: >-
    Script: fetcher.py. Read-only Cornerstone Reporting API calls: POST
    /services/api/oauth2/token (client credentials), then GET
    /services/api/x/odata/api/views/vw_rpt_training (resolve the configured
    courses), vw_rpt_transcript (every registration for those courses).
    Each view is counted first ($count) and the collected rows are
    de-duplicated and checked against that count.
