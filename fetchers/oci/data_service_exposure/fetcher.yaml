name: oci_data_service_exposure
version: 0.1.0
description: >-
  Shows which Autonomous Databases, DB systems, file systems and Integration instances the internet can reach, whether mTLS is required, and whose key encrypts each.
category: oci

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: oci_data_service_exposure.json
  aggregation: per_target

target_schema:
  region:
    type: string
    required: false
    env: OCI_REGION
    description: >
      Region to collect from, e.g. us-ashburn-1. Optional — omit to use the
      credential's own region. Every list call here is regional, so a tenancy
      subscribed to several regions needs one target per region;
      metadata.regions_not_collected names any this run missed.
  compartment_id:
    type: string
    required: false
    env: OCI_COMPARTMENT_ID
    description: >
      Compartment OCID to collect data services from. Optional — omit to collect
      from the tenancy root; set one target per compartment to fan out.
  include_subcompartments:
    type: boolean
    required: false
    default: true
    env: OCI_INCLUDE_SUBCOMPARTMENTS
    description: >
      Walk compartments beneath the root as well. On by default — managed data
      services live in workload compartments.
  environment:
    type: string
    required: false
    env: OCI_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-compartment runs.

secrets: []

ksis:
  - KSI-SVC-SIN      # Encrypted and secured from unwanted access — keys, mTLS, endpoints
  - KSI-CNA-MAT      # Minimal attack surface — publicly reachable managed data services
  - KSI-CNA-RNT      # Inbound traffic limited — access control lists and NFS export sources

evidence_set:
  reference_id: EVD-OCI-DATA-SERVICE-EXPOSURE
  name: Managed Data Service Exposure and Encryption
  instructions: |
    Script: oci/data_service_exposure/fetcher.py

    Access: inspect and read all-resources in the compartments in scope.

    Commands Executed:
    - identity.list_compartments — the compartments beneath the target
    - identity.list_availability_domains — the region's availability domains, which File Storage is listed by
    - file_storage.list_mount_targets (per compartment and availability domain) — mount targets and their network security groups, joined to file systems by export set
    - database.list_autonomous_databases (per compartment) — Autonomous Databases with their network path, allow-list, mTLS setting and key
    - database.list_db_systems (per compartment) — DB systems
    - integration.list_integration_instances (per compartment) — Integration instances and their endpoint allow-lists
    - file_storage.list_file_systems (per compartment and availability domain) — file systems
    - file_storage.list_exports (per file system) — its NFS exports
    - file_storage.get_export (per export) — the export's client options, which the listing leaves out
    - identity.list_region_subscriptions — the regions this run did not cover

    Output: oci_data_service_exposure_<compartment>.json — every Autonomous Database, DB system, file system with its exports and mount targets, and Integration instance, each with its reachability and key.

    Summary fields:

    Could the services be read?
    - data_services_readable — True if the Autonomous Database listing was read in at least one compartment; false if every listing failed

    Which databases can the internet reach?
    - total_autonomous_databases — Number of live Autonomous Databases
    - autonomous_databases_in_vcn — Number of Autonomous Databases with a private endpoint in a subnet
    - autonomous_databases_with_access_control_list — Number of Autonomous Databases with at least one allow-list entry
    - autonomous_databases_publicly_reachable — Number of Autonomous Databases reachable from the whole internet: outside a VCN with no allow-list, or with an allow-list admitting 0.0.0.0/0 or ::/0
    - autonomous_databases_with_mtls_disabled — Number of Autonomous Databases that do not require mutual TLS, so a wallet alone opens a connection
    - autonomous_database_names_publicly_reachable — List of publicly reachable Autonomous Database names with the last characters of their OCID
    - total_db_systems — Number of live DB systems
    - db_systems_without_nsg — Number of DB systems in no network security group

    Who can mount the file systems?
    - total_file_systems — Number of live file systems
    - file_systems_with_unreadable_exports — Number of file systems whose exports could not be read; their exposure is unknown
    - file_systems_exporting_to_internet — Number of file systems (exports read) with an export whose client source is 0.0.0.0/0 or ::/0
    - internet_writable_unsquashed_exports — Number of exports open to the internet with READ_WRITE access and no root squash
    - mount_targets_without_nsg — Number of distinct mount targets serving these file systems that are in no network security group

    Which integration instances are open?
    - total_integration_instances — Number of live Integration instances
    - integration_instances_publicly_reachable — Number of Integration instances with a public endpoint and no IP or VCN allow-list

    Whose key encrypts the data?
    - resources_with_customer_managed_key — Number of databases, DB systems and file systems encrypted with a Vault key the customer holds (a real key OCID, not Oracle's ORACLE_MANAGED_KEY marker)
    - resources_with_oracle_managed_key — Number of those resources encrypted with a key Oracle manages
    - customer_managed_key_percentage — Percentage under a customer-managed key = resources_with_customer_managed_key / (resources_with_customer_managed_key plus resources_with_oracle_managed_key) × 100, a whole number; 0 when there are none

    What is reachable from the internet overall?
    - publicly_reachable_resources — Number of publicly reachable Autonomous Databases, internet-exporting file systems and publicly reachable Integration instances added together
