name: oci_bastion_sessions
version: 0.1.0
description: >
  Every OCI Bastion in scope with the settings that decide whether it provides
  genuinely just-in-time administrative access — maximum session lifetime,
  maximum concurrent sessions, the client CIDR allow-list, and whether any
  static jump hosts are configured — plus every session recorded against it,
  with its type, target resource and the operating-system account the operator
  assumed. Treats an absent or empty CIDR allow-list as unrestricted, which is
  how OCI treats it, so a permissive bastion is never reported as a locked-down
  one. Bastions whose detail call failed are counted separately rather than
  defaulting to a clean reading.
category: oci

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: oci_bastion_sessions.json
  aggregation: per_target

target_schema:
  region:
    type: string
    required: false
    env: OCI_REGION
    description: >
      Region to collect from, e.g. us-ashburn-1. Optional — omit to use the
      credential's own region. Every list call here is regional, so a tenancy
      subscribed to several regions needs one target per region;
      metadata.regions_not_collected names any this run missed.
  compartment_id:
    type: string
    required: false
    env: OCI_COMPARTMENT_ID
    description: >
      Compartment OCID to collect from. Optional — omit to collect from the
      tenancy root; set one target per compartment to fan out.
  include_subcompartments:
    type: boolean
    required: false
    default: true
    env: OCI_INCLUDE_SUBCOMPARTMENTS
    description: >
      Walk compartments beneath the root as well. On by default — bastions are
      created alongside the private subnets they serve, not in the tenancy root.
  environment:
    type: string
    required: false
    env: OCI_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-compartment runs.

secrets: []

ksis:
  - KSI-IAM-JIT
  - KSI-IAM-ELP

evidence_set:
  reference_id: EVD-OCI-BASTION-JIT
  name: Just-in-Time Administrative Access
  instructions: >
    Script: fetcher.py. OCI Python SDK calls: bastion.list_bastions(), then
    get_bastion() per bastion because the list summary omits the session-TTL and
    CIDR allow-list fields, then list_sessions() per bastion. Walked over every
    accessible compartment beneath the target. One evidence file per target.
