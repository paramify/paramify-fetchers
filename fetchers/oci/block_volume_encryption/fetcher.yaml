name: oci_block_volume_encryption
version: 0.1.0
description: >
  Every OCI block volume and boot volume in scope with the key that encrypts it
  (Oracle-managed or a customer-managed Vault key), every backup of those
  volumes with the key encrypting the backup, and every attachment with whether
  traffic between instance and volume is encrypted in transit. OCI always
  encrypts at rest, so the reported question is whose key — and backups carry a
  key of their own, so a customer-managed volume with Oracle-managed backups is
  counted as its own finding. Unattached volumes are counted because they still
  hold data. Backup-policy assignments are deliberately not collected; they
  answer a recovery question, not an encryption one.
category: oci

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: oci_block_volume_encryption.json
  aggregation: per_target

target_schema:
  region:
    type: string
    required: false
    env: OCI_REGION
    description: >
      Region to collect from, e.g. us-ashburn-1. Optional — omit to use the
      credential's own region. Every list call here is regional, so a tenancy
      subscribed to several regions needs one target per region;
      metadata.regions_not_collected names any this run missed.
  compartment_id:
    type: string
    required: false
    env: OCI_COMPARTMENT_ID
    description: >
      Compartment OCID to collect volumes from. Optional — omit to collect from
      the tenancy root; set one target per compartment to fan out.
  include_subcompartments:
    type: boolean
    required: false
    default: true
    env: OCI_INCLUDE_SUBCOMPARTMENTS
    description: >
      Walk compartments beneath the root as well. On by default — volumes live
      in the compartments of the workloads they serve.
  environment:
    type: string
    required: false
    env: OCI_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-compartment runs.

secrets: []

ksis:
  - KSI-SVC-SIN      # Information encrypted at rest (whose key) and in transit (the attachment)

evidence_set:
  reference_id: EVD-OCI-BLOCK-VOLUME-ENCRYPTION
  name: Volume Encryption Keys and In-Transit Encryption
  instructions: >
    Script: fetcher.py. Ported from Prowler's OCI blockstorage service
    (Apache-2.0), adding backups and in-transit encryption. OCI Python SDK
    calls per compartment: identity.list_availability_domains(),
    compute.list_volume_attachments() and list_boot_volume_attachments() per AD,
    blockstorage.list_volumes() and list_boot_volumes() per AD, then
    list_volume_backups() / list_boot_volume_backups() per volume. One evidence
    file per target.
