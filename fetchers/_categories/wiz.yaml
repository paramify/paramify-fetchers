---
description: >
  Wiz cloud security platform (CNAPP), commercial and Wiz for Government.
  Read-only GraphQL fetchers that collect cloud account scan coverage, posture
  issues, and host and container vulnerability findings, authenticated with a
  Wiz service account (OAuth2 client credentials). Every fetcher is an
  evidence fetcher except wiz_stig_compliance_report, an issue report
  assembled from the same read-only queries; none writes to Wiz.
