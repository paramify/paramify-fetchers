description: >
  Azure evidence fetchers (python, official azure-mgmt-* SDKs). Each fetcher
  authenticates with azure-identity's DefaultAzureCredential — there is no
  handed-over secret. A manifest target scopes a run to a specific subscription
  (multi-subscription fanout); when a target omits `subscription_id` (or a
  fetcher entry has no targets[] at all) the fetcher falls back to the first
  enabled subscription the ambient credential can see ("collect where deployed").

# Why the SDKs and not the az CLI: the fetchers are python, and the azure-mgmt-*
# clients are the same ones Prowler reads, so field projections port verbatim and
# pagination is handled by the SDK's ItemPaged. There is no `az` dependency and no
# shelling out — the runner only needs the pip deps.
#
# DefaultAzureCredential resolution order (azure.identity), and how each path is
# fed through the runner's env whitelist:
#   1. Environment service principal — AZURE_TENANT_ID + AZURE_CLIENT_ID +
#      AZURE_CLIENT_SECRET. A stored secret, so the least-preferred path; it is
#      listed below so a customer who already keeps an SP in their own secret
#      store can opt it in per run without the fetcher declaring a secret.
#   2. Workload identity federation — AZURE_TENANT_ID + AZURE_CLIENT_ID +
#      AZURE_FEDERATED_TOKEN_FILE (AKS workload identity). No stored secret;
#      recommended in-cluster.
#   3. Managed identity via IMDS — MSI_ENDPOINT / IDENTITY_ENDPOINT /
#      IDENTITY_HEADER (App Service, Container Apps, VM). No stored secret;
#      recommended on Azure compute.
#   4. Azure CLI / Azure Developer CLI / Azure PowerShell cached login — reads
#      the token cache under $HOME, which the runner already inherits. This is
#      the local dev-loop path (`az login`) and needs no env var at all.
#
# AZURE_AUTHORITY_HOST selects a sovereign cloud's AAD endpoint (Azure Government,
# China). AZURE_SUBSCRIPTION_ID is the ambient default subscription — it is also a
# per-fetcher target field, so a target's value overrides whatever is ambient.
#
# The runner strips ambient env by default; these opt the credential chain back
# in. They only take effect when actually set in the runner's environment, so
# listing them is safe.
# The service-principal path, declared so it is visible in `paramify describe`
# and the TUI instead of the category reporting that it needs nothing. All three
# are optional: supply them together to authenticate with a stored credential, or
# omit all three and DefaultAzureCredential falls through to workload identity
# federation, managed identity, or a cached `az login` — none of which hand over
# a secret.
#
# They remain in passthrough_env below, so exporting them in the runner's
# environment still works exactly as before; declaring them additionally lets a
# manifest name them as ${env:...} refs, which is what makes the runner resolve
# them from any source and mask them out of captured output.
secrets:
  - name: tenant_id
    env: AZURE_TENANT_ID
    required: false
    description: >
      Entra tenant (GUID). Required for the service-principal and
      workload-identity-federation paths; not a secret, but supplied alongside
      the client credentials.
  - name: client_id
    env: AZURE_CLIENT_ID
    required: false
    description: >
      Application (client) id of the service principal or user-assigned managed
      identity. Not a secret; identifies which principal to authenticate as.
  - name: client_secret
    env: AZURE_CLIENT_SECRET
    required: false
    description: >
      Service-principal client secret — the only stored credential Azure needs.
      Provide with tenant_id and client_id, or omit all three to use an ambient
      identity instead.

# No external CLI — these are python fetchers on the SDKs, so what has to be
# installed is pip distributions. Doctor checks each against the pin in
# requirements.txt, which is the single source of truth for versions; the pins
# matter because a wrong major here returns wrong or empty evidence rather than
# erroring (see the six documented breaks in requirements.txt).
requires:
  python_packages:
    - azure-identity
    - azure-keyvault-keys
    - azure-mgmt-authorization
    - azure-mgmt-compute
    - azure-mgmt-containerregistry
    - azure-mgmt-containerservice
    - azure-mgmt-cosmosdb
    - azure-mgmt-databricks
    - azure-mgmt-keyvault
    - azure-mgmt-monitor
    - azure-mgmt-network
    - azure-mgmt-postgresqlflexibleservers
    - azure-mgmt-rdbms
    - azure-mgmt-recoveryservices
    - azure-mgmt-recoveryservicesbackup
    - azure-mgmt-resource
    - azure-mgmt-resource-policy
    - azure-mgmt-resourcegraph
    - azure-mgmt-security
    - azure-mgmt-sql
    - azure-mgmt-storage
    - azure-mgmt-subscription
    - azure-mgmt-web
    - msgraph-sdk

auth:
  passthrough_env:
    - AZURE_TENANT_ID
    - AZURE_CLIENT_ID
    - AZURE_CLIENT_SECRET
    - AZURE_FEDERATED_TOKEN_FILE
    - AZURE_AUTHORITY_HOST
    - MSI_ENDPOINT
    - IDENTITY_ENDPOINT
    - IDENTITY_HEADER
