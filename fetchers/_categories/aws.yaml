description: >
  AWS evidence fetchers (bash, aws CLI + jq). Each fetcher authenticates with
  the standard AWS credential chain. A manifest target may scope a run to a
  specific (profile, region) for multi-account fanout; both are OPTIONAL — when a
  target omits them (or a fetcher entry has no targets[] at all) the CLI uses the
  ambient identity/region of wherever the runner is deployed ("collect here").

# AWS credentials follow the standard chain (env keys, ~/.aws profiles, SSO,
# IMDS instance roles, web identity). The runner strips ambient env by default;
# these passthrough vars opt the standard cred/region + cloud-identity vars back
# in so the ambient path works locally and in-cluster. They only take effect when
# actually set in the runner's environment, so listing them is safe; a target's
# profile/region still override the ambient values when provided.
# The static-key path, declared so it is visible in `paramify describe` and the
# TUI instead of the category reporting that it needs nothing. All three are
# optional: supply the pair to authenticate with stored keys, or omit them and
# the credential chain falls through to an EC2 instance role, EKS IRSA / Pod
# Identity, an ECS task role, SSO, or a ~/.aws profile — none of which hand over
# a secret. Prefer a role where possible; these exist for local dev and runners
# outside AWS.
#
# They remain in passthrough_env below, so exporting them still works exactly as
# before; declaring them additionally lets a manifest name them as ${env:...}
# refs, which is what makes the runner resolve them from any source and mask
# them out of captured output.
secrets:
  - name: access_key_id
    env: AWS_ACCESS_KEY_ID
    required: false
    description: >
      Access key id (AKIA… for a long-lived key, ASIA… for a temporary one). Not
      itself secret, but supplied as one unit with secret_access_key.
  - name: secret_access_key
    env: AWS_SECRET_ACCESS_KEY
    required: false
    description: >
      The stored credential half of the key pair. Provide with access_key_id, or
      omit both to use an instance role, IRSA, an ECS task role, SSO or a
      profile.
  - name: session_token
    env: AWS_SESSION_TOKEN
    required: false
    description: >
      Required in addition to the pair when the credentials are temporary (STS /
      assume-role / SSO-exported, access key beginning ASIA). Omit for a
      long-lived key pair.

# Every fetcher here is bash and shells out to these; `paramify doctor` checks
# them against PATH, but only when a manifest actually uses the category.
requires:
  tools:
    - aws
    - jq

auth:
  passthrough_env:
    # Explicit identity/region selection (set by the runner from a target, or
    # ambient from the deploy environment).
    - AWS_PROFILE
    - AWS_DEFAULT_REGION
    - AWS_REGION
    # Static keys (local dev / non-AWS runners; prefer a role where possible).
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_SESSION_TOKEN
    # Alternate config/credentials file locations.
    - AWS_CONFIG_FILE
    - AWS_SHARED_CREDENTIALS_FILE
    # Cloud-identity auth (EKS IRSA / Pod Identity / ECS / EC2 instance role).
    - AWS_WEB_IDENTITY_TOKEN_FILE
    - AWS_ROLE_ARN
    - AWS_ROLE_SESSION_NAME
    - AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
    - AWS_CONTAINER_CREDENTIALS_FULL_URI

  # A target that names `profile:` has stated WHICH identity to collect as, so
  # static keys must not travel with that invocation. botocore consults env
  # credentials BEFORE a profile's assume-role config whenever the profile comes
  # from AWS_PROFILE (the `--profile` FLAG suppresses them, the env var does
  # not), so a single stale key in the deployment silently defeats an entire
  # multi-account fanout: every profile goes unconsulted, the dead key signs
  # every call, and the operator sees InvalidClientTokenId on targets whose
  # ~/.aws/config is perfectly correct. Reproduced on ECS Fargate 2026-09-22.
  # These stay in passthrough_env above: a target-LESS entry still collects with
  # whatever the environment holds ("collect here"), which is the documented
  # local-dev and non-AWS-runner path.
  selector_env:
    - AWS_PROFILE
  credential_env:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_SESSION_TOKEN
