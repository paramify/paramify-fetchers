display_name: Zendesk
description: >-
  Zendesk Help Center and Support. Lists the public articles in a Help Center
  section anonymously, with each article's text and dates, and reads the
  ticket forms and fields behind "Submit a request" with an API token.

# No category-level secrets and no `auth:` block. zendesk_help_center_section
# calls the Help Center API as an anonymous user, which sees only public
# content, and that is the claim it supports. zendesk_request_form declares its
# own ZENDESK_EMAIL / ZENDESK_API_TOKEN secrets, so the section fetcher stays
# credential-free. No `requires:` block: `requests` is a core dependency and
# HTML is parsed by fetchers/_lib/html_text.py (standard library).
