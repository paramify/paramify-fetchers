name: gcp_bigquery_dataset_configuration
version: 0.1.0
description: >
  For each BigQuery dataset in the project, reports the default (dataset-level)
  CMEK encryption key, the access-control list with any public grant to allUsers
  or allAuthenticatedUsers called out, the default table expiration, and the
  dataset's location. BigQuery is always encrypted at rest, so the evidence that
  varies is CMEK vs Google-managed, who is on the ACL, and where the data lives.
  ACL entries naming a person or a group are counted, not copied.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_bigquery_dataset_configuration.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

ksis:
  - KSI-SVC-SIN
  - KSI-IAM-ELP

evidence_set:
  reference_id: EVD-GCP-BIGQUERY-CONFIG
  name: BigQuery Dataset Configuration
  instructions: >
    Script: gcp/bigquery_dataset_configuration/fetcher.py. Google Cloud client library calls: bigquery
    datasets.list(), then datasets.get() per dataset. One evidence file per
    project.
