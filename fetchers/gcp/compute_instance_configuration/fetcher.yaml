name: gcp_compute_instance_configuration
version: 0.1.1
description: >
  For each Compute Engine instance in the project, reports the per-instance
  hardening posture: Shielded VM (secure boot, vTPM, integrity monitoring),
  Confidential Computing, OS Login and its 2FA (counted as enabled only where
  OS Login is on, since the 2FA flag does nothing without it), serial-port access, IP
  forwarding, block-project-ssh-keys, the attached service account and its OAuth
  scopes (the default service account with cloud-platform being the classic
  finding), public-IP presence, and deletion protection. Also reports the
  project-wide metadata defaults those instance settings inherit from.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_compute_instance_configuration.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

ksis:
  - KSI-CNA-MAT
  - KSI-SVC-VRI
  - KSI-IAM-APM

evidence_set:
  reference_id: EVD-GCP-VM-CONFIG
  name: Compute Engine Instance Configuration
  instructions: >
    Script: gcp/compute_instance_configuration/fetcher.py. Google Cloud client library calls: compute
    instances.aggregatedList(), projects.get() for the project-wide metadata
    defaults instances inherit. One evidence file per project.
