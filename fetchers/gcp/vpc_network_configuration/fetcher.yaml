name: gcp_vpc_network_configuration
version: 0.1.0
description: >
  Network-segmentation evidence for the project: every VPC network with its
  subnet mode (legacy / auto / custom), routing mode, peerings and subnet count,
  and whether the auto-created `default` network still exists; plus every subnet
  with its CIDR range, Private Google Access, and VPC flow logs — enabled or not,
  and when enabled the aggregation interval, flow sampling rate, metadata setting
  and any capture filter.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_vpc_network_configuration.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

ksis:
  - KSI-CNA-ULN

evidence_set:
  reference_id: EVD-GCP-VPC-CONFIG
  name: VPC Network Configuration
  instructions: >
    Script: gcp/vpc_network_configuration/fetcher.py. Google Cloud client library calls: compute
    networks.list(), subnetworks.aggregatedList(). One evidence file per
    project.
