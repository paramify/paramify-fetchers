name: gcp_dns_configuration
version: 0.1.0
description: >
  Every Cloud DNS managed zone in the project: DNSSEC state (on / off /
  transferring), the key-signing and zone-signing algorithms — RSASHA1 in either
  position is the finding — zone visibility (public vs private, which decides
  whether DNSSEC applies at all), query logging, and the private-network,
  forwarding and peering topology. Also reports the project's DNS policies, where
  logging and inbound forwarding are configured per network.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_dns_configuration.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

ksis:
  - KSI-SVC-SIN

evidence_set:
  reference_id: EVD-GCP-DNS
  name: Cloud DNS Zone and DNSSEC Configuration
  instructions: >
    Script: gcp/dns_configuration/fetcher.py. Google Cloud client library calls: dns
    managedZones.list(), policies.list(). One evidence file per project.
