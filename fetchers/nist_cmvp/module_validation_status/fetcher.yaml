name: nist_cmvp_module_validation_status
version: 0.1.0
description: >-
  Shows whether each listed cryptographic module certificate is currently FIPS
  140-2 or FIPS 140-3 validated, with its status, sunset date and module details.

category: nist_cmvp

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: nist_cmvp_module_validation_status.json

secrets: []          # NIST CMVP certificate pages are public

config_schema:
  certificates:
    type: string
    required: true
    env: NIST_CMVP_CERTIFICATES
    description: >-
      Comma-separated CMVP certificate numbers, for example `4816, 4282`. A
      number can carry your own label as `Label=NUMBER`, for example
      `AWS-LC=4816`; the label is copied into the evidence so a reader knows
      what each module is.

ksis:
  - KSI-SVC-SIN
  - KSI-SVC-VRI

evidence_set:
  reference_id: EVD-NIST-CMVP-MODULE-VALIDATION
  name: NIST CMVP Module Validation Status
  instructions: |
    Script: nist_cmvp/module_validation_status/fetcher.py

    Access: None. The certificate pages on csrc.nist.gov are public.

    Commands Executed:
    - GET /projects/cryptographic-module-validation-program/certificate/<number> — reads the certificate page (per certificate)

    Output: nist_cmvp_module_validation_status.json — one record per certificate with its module name, vendor, standard, status, sunset date and verdict. A record's validated is null when the certificate could not be checked (parse_error or fetch_error).

    Summary fields:

    Is every listed module currently validated?
    - certificates_total — Number of certificates listed
    - certificates_validated — Number of certificates that are validated: the page is for that number, Status is Active, the standard is FIPS 140-2 or FIPS 140-3, and the sunset date is today or later. Null when any certificate could not be checked
    - certificates_not_validated — Number of certificates that are not validated. Null when any certificate could not be checked
    - not_validated_by_reason — Number of certificates for each reason. The verdict reasons (historical, revoked, sunset_passed, status_unknown, not_found) are null when any certificate could not be checked; parse_error and fetch_error are always counts:
      - historical (Status is Historical)
      - revoked (Status is Revoked)
      - sunset_passed (Status is Active but the sunset date is before today)
      - status_unknown (Status is missing or another value, or the standard is not FIPS 140-2 or 140-3)
      - not_found (NIST answered HTTP 404 or 410 for the number, or the page heading names another number)
      - parse_error (not checked: the page could not be read, for example a missing sunset date, or an HTTP 200 page with no Certificate heading and no Details rows, such as a maintenance page)
      - fetch_error (not checked: the page could not be fetched after retries, including HTTP 429 that persists)
