name: knowbe4_high_risk_training
version: 0.1.0
description: Validates completion of the role-specific training campaign(s) named in config for members of the high-risk groups named in config. Reports per-user status with summary metrics. Names are matched exactly; when one matches nothing in the tenant, every compliance metric is reported as null (not 0) and results.config_resolution names what did not resolve.
category: knowbe4

supports_targets: false

config_schema:
  high_risk_groups:
    type: string
    required: true
    env: KNOWBE4_HIGH_RISK_GROUPS
    description: Comma-separated KnowBe4 group names whose members are treated as high-risk (e.g. "Cloud Ops,IT,DevOps"). Matched exactly against the group titles in your tenant, not as substrings, so "IT" will not pull in "AUDIT". Whitespace around each name is trimmed.
  role_specific_campaigns:
    type: string
    required: true
    env: KNOWBE4_ROLE_SPECIFIC_CAMPAIGNS
    description: Comma-separated training campaign names those users are required to complete, matched exactly against the campaign titles in your tenant.

runtime:
  type: bash
  entry: fetcher.sh

output:
  type: json
  path: knowbe4_high_risk_training.json

secrets:
- name: api_key
  env: KNOWBE4_API_KEY
- name: region
  env: KNOWBE4_REGION

ksis:
  - KSI-CED-RAT

evidence_set:
  reference_id: EVD-HIGH-RISK-TRAINING
  name: KnowBe4 Role Specific Training for High Risk Users
  instructions: 'Script: knowbe4/high_risk_training/fetcher.sh. Commands executed: KnowBe4 API calls for role-specific training data'
