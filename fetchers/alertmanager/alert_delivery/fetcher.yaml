name: alertmanager_alert_delivery
version: 0.1.0
description: >-
  Shows whether Alertmanager routes alerts to receivers that can deliver them, what is firing or suppressed, and how many notifications were started and how many finally failed.
category: alertmanager
source: community

supports_targets: false

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: alertmanager_alert_delivery.json

secrets: []          # the optional token comes from the category (fetchers/_categories/alertmanager.yaml)

ksis:
  - KSI-INR-RIR   # alerts routed to receivers that deliver them, and delivery failures
  - KSI-MLA-OSM   # what is firing, silenced or inhibited

evidence_set:
  reference_id: EVD-ALERTMANAGER-ALERT-DELIVERY
  name: Alertmanager Alert Delivery
  description: >-
    Alertmanager's routing, receivers, active and suppressed alerts, silences, and the notifications started and finally
    failed per receiver or integration type.
  instructions: |
    Script: alertmanager/alert_delivery/fetcher.py

    Access: Network access to the Alertmanager API and its metrics endpoint. Alertmanager has no authentication of its own; set the optional token only when a proxy in front of it requires one. Every call is a GET: the fetcher never creates, changes or expires silences or alerts.

    Commands Executed:
    - GET /api/v2/status — the loaded configuration, cluster status and start time. Only receiver names, integration types and the route tree are kept; receiver settings, which hold webhook URLs and API keys, are never copied. Route matchers written with the older match and match_re keys are shown as name="value" and name=~"value"
    - GET /api/v2/alerts — every alert with its state, silences, inhibitions and receivers
    - GET /api/v2/silences — every silence with its state and end time
    - GET /metrics — notifications started and notifications that finally failed, per receiver when Alertmanager runs with receiver-name-in-metrics, otherwise per integration type

    Output: alertmanager_alert_delivery.json — receivers, routes, alerts, silences and notification counts. The counts do not show that an integration's API accepted a notification, and whether a person received it is not visible to Alertmanager. Both need their own evidence. A response that is not the shape Alertmanager documents is a failed read, not 0: a status without its configuration, a metrics page without alertmanager_build_info (such as a proxy's own page), a counter value that is not a number, only one of the two notification counters, or counters where only some carry receiver names. A failed read is listed in metadata.api_failures, leaves the fields that depend on it null, and the run exits 1.

    Summary fields:

    Is anything configured to deliver alerts?
    - config_read — True if the loaded configuration was read and parsed; false if the status had no configuration that could be parsed; null if the status could not be read. Every routing field below is null unless this is true
    - receivers_total — Number of receivers in the configuration
    - receivers_without_integrations — Number of receivers with no integration, so alerts sent to them go nowhere (often deliberate, such as a receiver for a heartbeat alert)
    - receivers_without_integrations_names — List of the names of those receivers
    - integration_types — List of the integration types configured across receivers, such as webhook, slack, email or pagerduty
    - default_receiver — Name of the receiver on the top-level route, used by any alert no child route matches
    - default_receiver_has_integrations — True if the default receiver has at least one integration; false if alerts matching no child route go nowhere
    - routes_total — Number of child routes below the top-level route
    - routes_to_receivers_without_integrations — Number of child routes whose receiver has no integration
    - inhibit_rules — Number of inhibition rules, which suppress some alerts while others fire

    What is firing, and where does it go?
    - alerts_active — Number of alerts firing and not suppressed; null if the alerts could not be read, as is every alert field below
    - alerts_suppressed — Number of alerts firing but suppressed by a silence or an inhibition
    - alerts_silenced — Number of suppressed alerts matched by a silence
    - alerts_inhibited — Number of suppressed alerts inhibited by another alert
    - alerts_active_to_receivers_without_integrations — Number of active alerts whose every receiver has no integration, so no notification is sent for them; null if the configuration or alerts could not be read
    - silences_active — Number of silences in effect; null if the silences could not be read

    Were notifications delivered?
    - notifications_attempted — Number of notifications Alertmanager started to send since counters_since (alertmanager_notifications_total). A notification counts when sending starts, before the integration answers. It is not the number the integration's API accepted: some may still be retrying, and a resolved-only notification to an integration with send_resolved off counts without a request. Null if the metrics could not be read, as is every field down to hours_since_counters_started
    - notifications_failed — Number of notifications that failed after all their retries since counters_since (alertmanager_notifications_failed_total). Each failed notification counts once, however many requests it took
    - notification_failures_by — receiver if the metrics name each receiver (receiver-name-in-metrics), otherwise integration, when failures can only be attributed to an integration type such as webhook
    - notification_failures — List of the receivers (or integration types) with at least one failed notification
    - process_started — When the Alertmanager process started; null if the status could not be read
    - counters_since — When the notification counts started. Without receiver names in the metrics, this is process_started, as only a restart resets them. With receiver names, Alertmanager also resets them on every successful configuration reload, so this is the last successful reload (alertmanager_config_last_reload_success_timestamp_seconds). Null when that time is not known
    - hours_since_counters_started — Hours since counters_since
    - cluster_status — ready, settling or disabled (a single instance); with high availability, each member keeps its own counters; null if the status could not be read
    - cluster_peers — Number of cluster members this instance sees; null if the status could not be read
