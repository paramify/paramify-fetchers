name: splunk_data_inputs
version: 0.2.0
description: >-
  What a Splunk instance is configured to collect, and every host, index and
  sourcetype the deployment receives.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: true
    env: SPLUNK_TARGET_NAME
    description: Label for this Splunk deployment, used in the evidence filename.
  base_url:
    type: string
    required: true
    env: SPLUNK_BASE_URL
    description: Management URL of the search head or standalone instance, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: boolean
    required: false
    default: true
    env: SPLUNK_VERIFY_SSL
    description: Verify the management port's TLS certificate. Set false only for a self-signed test instance.
  ca_bundle:
    type: string
    required: false
    env: SPLUNK_CA_BUNDLE
    description: >-
      Path to the CA bundle that signed the management port's certificate, for
      a deployment on a private CA. When set, TLS is verified against it and
      verify_ssl is ignored.

config_schema:
  indexes:
    type: string
    env: SPLUNK_INDEXES
    description: >-
      Comma-separated index names to read received data from, for example
      idx_aws,idx_sys. Each one must return events. Unset reads every index,
      which needs the index list that Splunk Cloud's REST API does not serve.
      Wildcards are not accepted.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_data_inputs.json
  aggregation: per_target

secrets: []

ksis:
  - KSI-MLA-LET

evidence_set:
  reference_id: EVD-SPLUNK-DATA-INPUTS
  name: Splunk Data Inputs
  instructions: >-
    Script: splunk/data_inputs/fetcher.py. What the queried instance is
    configured to collect (`inputs[]`) and what the deployment receives:
    `sourcetypes[]` per index and sourcetype, `received[]` per host. A row is
    `silent` past `max_silence_minutes`; a `sourcetypes[]` row only when every
    host is. `metadata.indexes` is the indexes read, or "all".
    `index_resolved` turns "default" into the instance's default index. Inputs
    on forwarders appear only as received data.
