name: splunk_data_inputs
version: 0.1.0
description: >-
  What a Splunk instance is configured to collect, and every host, index and
  sourcetype the deployment receives.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: true
    env: SPLUNK_TARGET_NAME
    description: Label for this Splunk deployment, used in the evidence filename.
  base_url:
    type: string
    required: true
    env: SPLUNK_BASE_URL
    description: Management URL of the search head or standalone instance, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: boolean
    required: false
    default: true
    env: SPLUNK_VERIFY_SSL
    description: Verify the management port's TLS certificate. Set false only for a self-signed test instance.
  ca_bundle:
    type: string
    required: false
    env: SPLUNK_CA_BUNDLE
    description: >-
      Path to the CA bundle that signed the management port's certificate, for
      a deployment on a private CA. When set, TLS is verified against it and
      verify_ssl is ignored.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_data_inputs.json
  aggregation: per_target

secrets: []

ksis:
  - KSI-MLA-LET

evidence_set:
  reference_id: EVD-SPLUNK-DATA-INPUTS
  name: Splunk Data Inputs
  instructions: >-
    What the queried instance is configured to collect (`inputs[]`: inputs.conf
    matched to Splunk's own list of running inputs) and every host, index and
    sourcetype the deployment actually receives (`received[]`, from tstats),
    each `silent` past `max_silence_minutes`. `index_resolved` turns "default"
    into the instance's default index. In a distributed deployment most inputs
    live on forwarders, which appear only in `received[]`.
