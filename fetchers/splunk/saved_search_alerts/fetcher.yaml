name: splunk_saved_search_alerts
version: 0.1.0
description: >-
  FedRAMP KSI-MLA-RVL evidence. Reads every saved search on a Splunk deployment
  across ALL app namespaces and records which are configured as alerts — trigger
  condition, severity, whether alerting is actually enabled, cron and dispatch
  window, the actions that fire and which of them notify anything, the owning
  app and owner from the ACL block, and the search string itself — so an
  audit-alerting claim can be asserted against configuration rather than prose.
  Records explicitly that this proves alerts are CONFIGURED and ENABLED, not
  that anyone reviews them. Single deployment per invocation; runner does
  fanout.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: false
    env: SPLUNK_TARGET_NAME
    description: Label for this deployment in the evidence, e.g. "prod-us-east". Defaults to the host.
  host:
    type: string
    required: true
    env: SPLUNK_HOST
    description: splunkd management URI, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: string
    required: false
    default: "true"
    env: SPLUNK_VERIFY_SSL
    description: >-
      Set to "false" ONLY for a sandbox with a self-signed certificate. Any
      deployment holding real audit data must leave this true.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_saved_search_alerts.json
  aggregation: per_target

secrets:
- name: token
  env: SPLUNK_TOKEN
  required: false
  per_target: true
  description: Splunk bearer token. Supply this OR username+password.
- name: username
  env: SPLUNK_USERNAME
  required: false
  per_target: true
  description: Username for HTTP basic auth. Supply with SPLUNK_PASSWORD, or use SPLUNK_TOKEN.
- name: password
  env: SPLUNK_PASSWORD
  required: false
  per_target: true
  description: Password for HTTP basic auth. Supply with SPLUNK_USERNAME, or use SPLUNK_TOKEN.

config_schema:
  alert_apps:
    type: string
    required: false
    env: SPLUNK_ALERT_APPS
    description: >-
      Comma-separated names of the Splunk apps that hold the organization's own
      audit and security alerting, e.g. "my_security_app,SplunkEnterpriseSecuritySuite".
      Splunk ships well over a hundred saved searches in its own apps
      (splunk_instrumentation, splunk_monitoring_console,
      SplunkDeploymentServerConfig, splunk_rapid_diag, search, …) whose alerting
      configuration is Splunk's business and not the customer's; counting them
      makes the roll-up describe the vendor's defaults rather than the control.
      Naming apps here produces a separate `audit_scope` roll-up over exactly
      those apps. Leave unset and only the all-searches `summary` is produced,
      and `audit_scope.scope_is_assessable` stays false — this roll-up asserts a
      POSITIVE (alerts exist and are enabled), which is vacuously true of an
      empty set, so an unconfigured scope must never read as a pass.

  audit_indexes:
    type: string
    required: false
    env: SPLUNK_AUDIT_INDEXES
    description: >-
      Comma-separated names of the indexes that hold audit and security data,
      e.g. "_audit,audit_prod,security_events". The SAME knob the
      splunk_index_retention and splunk_role_index_access fetchers take, and
      deliberately so. Used only to record, per saved search, which of those
      indexes its SPL appears to read — a text match for `index=<name>`, not a
      parse, so it misses indexes reached through macros, event types or
      lookups. Reported as context; no roll-up verdict depends on it.

ksis:
  - KSI-MLA-RVL

evidence_set:
  reference_id: EVD-SPLUNK-SAVED-SEARCH-ALERTS
  name: Splunk Saved Search Alerts
  instructions: >-
    Calls GET /servicesNS/-/-/saved/searches?output_mode=json&count=0 on the
    splunkd management port — the ALL-namespace form, because
    /services/saved/searches resolves to the caller's own namespace and returns
    the saved searches of a single app. Also calls GET
    /servicesNS/-/-/alerts/fired_alerts, GET
    /services/authentication/current-context and GET /services/server/info.
    Records per saved search: alert_type, alert_condition, alert_comparator,
    alert_threshold, alert.severity, alert.track, alert.suppress and
    alert.digest_mode; is_scheduled and disabled; cron_schedule,
    dispatch.earliest_time / latest_time, next_scheduled_time and
    schedule_window; the `actions` list plus every action.<name> enable flag;
    and app, owner, sharing and the read/write role lists from the entry's acl
    block. Derives whether each saved search is an ALERT (trigger condition, or
    alert tracking, or a notifying action), whether alerting is ENABLED
    (scheduled and not disabled), and which of its actions notify anything as
    opposed to writing results back into Splunk. Rolls up over all saved
    searches and, separately, over the apps named as holding the organization's
    audit alerting, with an anti-vacuity guard because that roll-up asserts a
    positive. Carries an explicit boundary statement that the evidence proves
    alerts are configured and enabled, not that anyone reviews them. Writes JSON.
