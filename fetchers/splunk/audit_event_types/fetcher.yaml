name: splunk_audit_event_types
version: 0.1.0
description: >-
  FedRAMP KSI-MLA-LET evidence. Runs SPL against the Splunk audit indexes and
  records the event types that are ACTUALLY being logged — every distinct
  `action` value observed, its volume, its first and last occurrence, the
  sourcetypes and indexes carrying it — and then measures, per event type, what
  fraction of its records carry each of the seven non-repudiation elements an
  audit record is claimed to enforce: event type, when, where, source, outcome,
  full text of privileged commands, and associated identities. Each element is
  measured from NAMED Splunk fields, and presence is distinguished from
  meaning — a `user` field holding the literal `n/a` is present but identifies
  nobody. Measured evidence over a real time window, not configuration.
  Single deployment per invocation; runner does fanout.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: false
    env: SPLUNK_TARGET_NAME
    description: Label for this deployment in the evidence, e.g. "prod-us-east". Defaults to the host.
  host:
    type: string
    required: true
    env: SPLUNK_HOST
    description: splunkd management URI, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: string
    required: false
    default: "true"
    env: SPLUNK_VERIFY_SSL
    description: >-
      Set to "false" ONLY for a sandbox with a self-signed certificate. Any
      deployment holding real audit data must leave this true.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_audit_event_types.json
  aggregation: per_target

secrets:
- name: token
  env: SPLUNK_TOKEN
  required: false
  per_target: true
  description: Splunk bearer token. Supply this OR username+password.
- name: username
  env: SPLUNK_USERNAME
  required: false
  per_target: true
  description: Username for HTTP basic auth. Supply with SPLUNK_PASSWORD, or use SPLUNK_TOKEN.
- name: password
  env: SPLUNK_PASSWORD
  required: false
  per_target: true
  description: Password for HTTP basic auth. Supply with SPLUNK_USERNAME, or use SPLUNK_TOKEN.

config_schema:
  audit_indexes:
    type: string
    required: false
    env: SPLUNK_AUDIT_INDEXES
    description: >-
      Comma-separated names of the indexes that hold audit and security data,
      e.g. "_audit,audit_prod,security_events". The SAME knob the
      splunk_index_retention, splunk_role_index_access and
      splunk_saved_search_alerts fetchers take, and deliberately so — this is
      its fourth consumer. Unlike the siblings this fetcher SEARCHES those
      indexes rather than reading their configuration, so a named index that
      holds no events is reported as such (`indexes_named_but_empty`), which is
      itself evidence: an index claimed to hold audit data and containing
      nothing is a finding, not an omission. Defaults to `_audit` when unset,
      because `_audit` is Splunk's own fixed-name audit index on every
      deployment and is not a guess about this one.

  privileged_event_types:
    type: string
    required: false
    env: SPLUNK_PRIVILEGED_EVENT_TYPES
    description: >-
      Comma-separated event types (`action` values) that represent PRIVILEGED
      COMMANDS, e.g. "search,edit_*,create_*,delete_*". Shell-style globs are
      accepted, because Splunk names its audit actions systematically
      (`edit_roles`, `edit_index`, `create_index`, `list_settings`) and
      enumerating them by hand goes stale. This produces a separate
      `privileged_command_scope` roll-up which is the only place the narrative's
      "full text of privileged commands" element is assessed — that element is
      meaningless for a filesystem-change record and measuring it across all
      event types would report a misleadingly tiny coverage figure for an
      element most records were never meant to carry. Leave unset and only the
      all-event-types `summary` is produced, and
      `privileged_command_scope.scope_is_assessable` stays false: this roll-up
      asserts POSITIVES (records carry these fields), which are vacuously true
      of an empty set, so an unconfigured or empty scope must never read as a
      pass.

  audit_search_window:
    type: string
    required: false
    default: "-7d"
    env: SPLUNK_AUDIT_SEARCH_WINDOW
    description: >-
      Splunk relative-time earliest bound for the search, e.g. "-7d", "-30d",
      "-24h". Latest is always `now`. The window REQUESTED and the window
      actually OBSERVED (the first and last event timestamps found) are both
      recorded, and they are not the same thing: a deployment whose audit index
      was created yesterday returns one day of events for a seven-day request,
      and an assessor reading "over the last 7 days" without the observed bounds
      would over-read the evidence.

  audit_search_timeout_secs:
    type: string
    required: false
    default: "300"
    env: SPLUNK_AUDIT_SEARCH_TIMEOUT_SECS
    description: >-
      Hard bound on the search, in seconds, applied BOTH as the HTTP read
      timeout and as Splunk's own server-side `max_time` on the job, so neither
      a hung socket nor a runaway search can block the run indefinitely. Keep it
      comfortably below `runtime.timeout` (600s by default) so the fetcher
      reports a search timeout as its own diagnosed failure rather than being
      killed by the runner with no reason recorded.

  include_command_samples:
    type: string
    required: false
    default: "false"
    env: SPLUNK_INCLUDE_COMMAND_SAMPLES
    description: >-
      Set "true" to include a small number of truncated sample command texts in
      the evidence. Default false and deliberately so: the full text of a
      privileged command is exactly the field most likely to contain data the
      evidence file should not carry off the deployment — an SPL string can
      embed account names, hostnames, ticket numbers or a `where` clause over
      sensitive values. With it off the fetcher still proves the element is
      captured, from the count of records carrying the field and from the
      character-length statistics of that text, without reproducing any of it.

ksis:
  - KSI-MLA-LET

evidence_set:
  reference_id: EVD-SPLUNK-AUDIT-EVENT-TYPES
  name: Splunk Audit Event Types and Non-Repudiation Field Coverage
  instructions: >-
    Runs one SPL search against the configured audit indexes by POSTing to
    /services/search/jobs with exec_mode=oneshot, which executes synchronously
    and returns the result rows in the same response — no job id, no
    dispatchState poll loop, and nothing left behind to clean up. Both
    output_mode=json and count=0 are passed on that POST, and the search is
    bounded by Splunk's own max_time as well as by the HTTP read timeout. The
    search aggregates by event type (`action`) and reports, for each: the event
    count, first and last occurrence, the sourcetypes and indexes carrying it,
    the number of distinct identities that appear in it, and — for each of ten
    named Splunk fields (action, timestamp, host, splunk_server, clientip, src,
    info, object, search, user) — how many of its records carry the field at all
    and how many carry a MEANINGFUL value, the second excluding placeholders
    such as the literal "n/a" that Splunk writes when no principal was involved.
    Those field counts are then mapped onto the seven non-repudiation elements
    the capability narrative names — event type, when, where, source, outcome,
    full text of privileged commands, associated identities — with the field or
    fields each element is read from stated explicitly in the payload, so no
    element is ever reported as covered without naming its source field. Rolls
    up over all observed event types and, separately, over the event types named
    as privileged commands, the latter with an anti-vacuity guard because every
    verdict here asserts a positive. Also calls GET
    /services/authentication/current-context and GET /services/server/info for
    the reader's identity and the deployment's version. Writes JSON.
