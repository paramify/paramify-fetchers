name: splunk_saved_searches
version: 0.1.0
description: >-
  Pulls every saved search and alert on a Splunk deployment with its schedule,
  alerting condition and notification actions — evidencing that logs are
  persistently reviewed, and naming the searches that are scheduled but
  switched off or that fire without notifying anyone.
category: splunk

supports_targets: false

runtime:
  type: python
  entry: fetcher.py
  timeout: 600

output:
  type: json
  path: splunk_saved_searches.json

# Either a token, or a username and password. All three are optional secrets:
# the fetcher needs one of the two mechanisms, and the runner injects only what
# the manifest supplies.
#
# The token is the credential to prefer — it carries the creating user's roles,
# can be given an expiry, and is revocable without changing anyone's password.
# The username/password path exists because token authentication is **off by
# default** in Splunk Enterprise (Settings > Tokens > Enable Token
# Authentication), so a fresh install cannot use a token until someone turns it
# on. The fetcher prefers the token when both are supplied.
secrets:
  - name: token
    env: SPLUNK_TOKEN
    required: false
    description: >-
      Splunk authentication token (a JWT). Preferred. Create at
      Settings > Tokens; token auth must be enabled there first.
  - name: username
    env: SPLUNK_USERNAME
    required: false
    description: >-
      Username for the session-login fallback. Use with password when token
      authentication is not enabled on the deployment.
  - name: password
    env: SPLUNK_PASSWORD
    required: false
    description: Password for the session-login fallback. Use with username.

config_schema:
  base_url:
    type: string
    required: false
    env: SPLUNK_BASE_URL
    description: >-
      Splunk management API base URL, including the port — the management port
      is 8089, not the 8000 web UI. Defaults to https://localhost:8089.
  ca_bundle:
    type: string
    required: false
    env: SPLUNK_CA_BUNDLE
    description: >-
      Path to the CA bundle that signed the Splunk certificate. Splunk ships a
      self-signed certificate, so set this to verify it properly.
  verify_ssl:
    type: boolean
    required: false
    env: SPLUNK_VERIFY_SSL
    description: >-
      Set false to skip TLS verification against a self-signed Splunk
      certificate. Whichever way this resolves is recorded in the evidence.

evidence_set:
  reference_id: EVD-SPLK-SAVED-SEARCHES
  name: Splunk Saved Searches and Alerts
  instructions: >-
    Script: fetcher.py. Authenticates with a bearer token (SPLUNK_TOKEN), or
    by POST /services/auth/login when only a username and password are set.
    Reads GET /services/server/info, then pages
    GET /servicesNS/-/-/saved/searches with output_mode=json and explicit
    count/offset. The /servicesNS/-/- namespace is required: plain
    /services/saved/searches is scoped to the caller's app context and returns
    only a fraction of the deployment's searches. Extracts per search:
    is_scheduled, disabled, cron_schedule, next_scheduled_time, alert_type,
    alert_comparator/alert_threshold, alert.severity, alert.track and the
    comma-separated actions list. Summarizes how many searches are actually
    running on a schedule, and names those that are scheduled but disabled,
    those that alert without notifying anyone, and those with no next run time.
  description: >-
    Saved search and alert configuration from a Splunk deployment, evidencing
    that log review is automated and running on a defined schedule rather than
    merely configured.

ksis:
  - KSI-MLA-RVL
