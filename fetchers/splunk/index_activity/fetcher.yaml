name: splunk_index_activity
version: 0.1.0
description: >-
  Every index on a Splunk deployment, whether it holds data, and whether it is
  still receiving any.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: true
    env: SPLUNK_TARGET_NAME
    description: Label for this Splunk deployment, used in the evidence filename.
  base_url:
    type: string
    required: true
    env: SPLUNK_BASE_URL
    description: Management URL of the search head or standalone instance, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: boolean
    required: false
    default: true
    env: SPLUNK_VERIFY_SSL
    description: Verify the management port's TLS certificate. Set false only for a self-signed test instance.
  ca_bundle:
    type: string
    required: false
    env: SPLUNK_CA_BUNDLE
    description: >-
      Path to the CA bundle that signed the management port's certificate, for
      a deployment on a private CA. When set, TLS is verified against it and
      verify_ssl is ignored.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_index_activity.json
  aggregation: per_target

secrets: []

ksis:
  - KSI-MLA-OSM

evidence_set:
  reference_id: EVD-SPLUNK-INDEX-ACTIVITY
  name: Splunk Index Activity
  instructions: >-
    Every index, event and metric, with whether it holds data and when it last
    received any (`last_received`). Event indexes use index time; metric
    indexes, which have none, use the newest data point. `stale` is true when an
    index holds no data, or its last data is more than `max_silence_minutes`
    from collection in either direction. Counts and sizes are summed across
    search peers. The collection fails unless the token can search every enabled
    index.
