name: splunk_role_index_access
version: 0.1.0
description: >-
  FedRAMP KSI-MLA-ALA evidence. Reads every role on a Splunk deployment and
  records what log data it can actually reach — effective (direct UNION
  imported) allowed/default/disallowed search indexes, the attribute-based
  search filter, the just-in-time search time window, granted capabilities and
  delegable roles — so a least-privileged log-access claim can be asserted per
  role rather than globally. Single deployment per invocation; runner does
  fanout.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: false
    env: SPLUNK_TARGET_NAME
    description: Label for this deployment in the evidence, e.g. "prod-us-east". Defaults to the host.
  host:
    type: string
    required: true
    env: SPLUNK_HOST
    description: splunkd management URI, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: string
    required: false
    default: "true"
    env: SPLUNK_VERIFY_SSL
    description: >-
      Set to "false" ONLY for a sandbox with a self-signed certificate. Any
      deployment holding real audit data must leave this true.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_role_index_access.json
  aggregation: per_target

secrets:
- name: token
  env: SPLUNK_TOKEN
  required: false
  per_target: true
  description: Splunk bearer token. Supply this OR username+password.
- name: username
  env: SPLUNK_USERNAME
  required: false
  per_target: true
  description: Username for HTTP basic auth. Supply with SPLUNK_PASSWORD, or use SPLUNK_TOKEN.
- name: password
  env: SPLUNK_PASSWORD
  required: false
  per_target: true
  description: Password for HTTP basic auth. Supply with SPLUNK_USERNAME, or use SPLUNK_TOKEN.

config_schema:
  audit_indexes:
    type: string
    required: false
    env: SPLUNK_AUDIT_INDEXES
    description: >-
      Comma-separated names of the indexes that actually hold audit and security
      data, e.g. "_audit,audit_prod,security_events". The SAME knob the
      splunk_index_retention fetcher takes, and deliberately so — KSI-MLA-ALA is
      about access to LOG data specifically, not to every index on the
      deployment, so the evidence reports a separate `audit_scope` roll-up over
      exactly the roles that can reach these indexes. Leave unset and only the
      all-roles `summary` is produced, which counts roles whose reach is
      confined to non-log indexes and so over-reports the control's exposure.

  exempt_roles:
    type: string
    required: false
    default: "admin,power,splunk-system-role"
    env: SPLUNK_EXEMPT_ROLES
    description: >-
      Comma-separated names of the roles whose broad access to log data is
      expected and accepted — Splunk's own built-in administrative and system
      roles, plus any organizationally approved break-glass role. These are
      excluded from the `audit_scope` roll-up but are still recorded in full
      under `roles`, with `exempt: true`, so nothing is hidden. Widening this
      list makes the assertion weaker, so keep it to roles the organization has
      actually accepted.

ksis:
  - KSI-MLA-ALA

evidence_set:
  reference_id: EVD-SPLUNK-ROLE-INDEX-ACCESS
  name: Splunk Role Access to Log Data
  instructions: >-
    Calls GET /services/authorization/roles?output_mode=json&count=0, GET
    /services/authentication/current-context and GET /services/server/info on
    the splunkd management port. Records per role: capabilities and
    imported_capabilities, imported_roles, srchIndexesAllowed /
    srchIndexesDefault / srchIndexesDisallowed and their imported_ variants,
    srchFilter, srchTimeWin, srchTimeEarliest and grantable_roles. Derives the
    EFFECTIVE index-access set as the union of the direct and imported allowed
    lists, flags wildcard index access, flags whether an attribute-based search
    filter and a just-in-time search time window are set, and resolves which of
    the configured audit indexes each role can reach. Rolls up over all roles
    and, separately, over the non-exempt roles that can reach audit data.
    Records the role the fetcher authenticated as, because splunkd and ACS both
    filter the role list by the caller's own role. Writes JSON.
