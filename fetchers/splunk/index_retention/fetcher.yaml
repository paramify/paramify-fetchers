name: splunk_index_retention
version: 0.1.0
description: >-
  FedRAMP KSI-MLA-OSM evidence. Reads every index on a Splunk deployment and
  records its configured searchable retention, size cap and archival
  destination, so the 90-day searchable-retention claim can be asserted per
  index rather than globally. Single deployment per invocation; runner does
  fanout.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: false
    env: SPLUNK_TARGET_NAME
    description: Label for this deployment in the evidence, e.g. "prod-us-east". Defaults to the host.
  host:
    type: string
    required: true
    env: SPLUNK_HOST
    description: splunkd management URI, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: string
    required: false
    default: "true"
    env: SPLUNK_VERIFY_SSL
    description: >-
      Set to "false" ONLY for a sandbox with a self-signed certificate. Any
      deployment holding real audit data must leave this true.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_index_retention.json
  aggregation: per_target

secrets:
- name: token
  env: SPLUNK_TOKEN
  required: false
  per_target: true
  description: Splunk bearer token. Supply this OR username+password.
- name: username
  env: SPLUNK_USERNAME
  required: false
  per_target: true
  description: Username for HTTP basic auth. Supply with SPLUNK_PASSWORD, or use SPLUNK_TOKEN.
- name: password
  env: SPLUNK_PASSWORD
  required: false
  per_target: true
  description: Password for HTTP basic auth. Supply with SPLUNK_USERNAME, or use SPLUNK_TOKEN.

config_schema:
  searchable_retention_days_required:
    type: string
    required: false
    default: "90"
    env: SPLUNK_SEARCHABLE_RETENTION_DAYS
    description: >-
      The searchable-retention floor each index is measured against, in days.
      Defaults to 90, the figure in the SIEM capability narrative. Changing it
      changes what the evidence reports as compliant, so keep it aligned with
      the control you are evidencing.

  audit_indexes:
    type: string
    required: false
    env: SPLUNK_AUDIT_INDEXES
    description: >-
      Comma-separated names of the indexes that actually hold audit and security
      data, e.g. "_audit,audit_prod,security_events". These are the indexes the
      retention claim is about, and the evidence reports a separate `audit_scope`
      roll-up over exactly them. Leave unset and only the all-indexes `summary`
      is produced, which mixes in Splunk's internal housekeeping indexes
      (_internal, _thefishbucket) that sit below any audit floor by design.

ksis:
  - KSI-MLA-OSM

evidence_set:
  reference_id: EVD-SPLUNK-INDEX-RETENTION
  name: Splunk Index Retention and Capacity
  instructions: >-
    Calls GET /services/data/indexes?output_mode=json&count=0 and GET
    /services/server/info on the splunkd management port. Records per index:
    frozenTimePeriodInSecs (searchable retention), maxTotalDataSizeMB (capacity),
    coldToFrozenDir/coldToFrozenScript (archival destination), event counts and
    disabled state. Derives searchable retention in days per index and compares
    each against the configured floor (default 90). Writes JSON.
