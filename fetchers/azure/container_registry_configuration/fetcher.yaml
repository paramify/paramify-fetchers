name: azure_container_registry_configuration
version: 0.2.1
description: >
  For every container registry in the subscription, reports who can reach it and who
  can pull from it: the SKU and login server, whether the shared admin account is
  enabled (a standing finding — it bypasses Entra ID, so pulls and pushes through it
  are not attributable), whether anonymous pull is on, public network access with the
  network rule set's default action and IP allow-list, the private endpoint
  connections and their approval state, customer-managed-key encryption and zone
  redundancy, the content-trust / quarantine / retention / export / ARM-audience
  policies, and the diagnostic settings that ship the registry's login and repository
  audit logs.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope,
      as case-insensitive glob patterns listed in the manifest, each with
      a prefix: rg:<resource group> (read from the resource id),
      location:<region> (the region's name without spaces, such as
      eastus2; a resource with no location never matches one) or
      id:<resource id> (also matches that resource's child resources). *
      matches any run of characters and ? one character. A matching
      container registry is listed under excluded with the pattern and
      left out of every count and verdict; its diagnostic settings are not
      read. A pattern without one of these prefixes fails the run. Set it
      once under platforms.azure.config for every Azure fetcher that has
      this field; fetchers without it ignore it. Each item is a pattern, or a pattern with a reason. Empty: every resource is
      in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_container_registry_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-VRI   # content-trust policy — image signing
  - KSI-CNA-MAT   # anonymous pull, public network access, private endpoints
  - KSI-IAM-ELP   # the shared admin account bypasses Entra ID, so pulls are not attributable
  - KSI-SVC-SIN   # customer-managed-key encryption

  # No SCR-MIT: a registry is a supply-chain control point, but this reports
  # registry configuration, not supply-chain risk identification. Honest gap.

evidence_set:
  reference_id: EVD-AZURE-ACR-CONFIG
  name: Azure Container Registry Configuration
  instructions: >
    Script: azure/container_registry_configuration/fetcher.py. Azure SDK calls: azure-mgmt-containerregistry
    ContainerRegistryManagementClient.registries.list(), then azure-mgmt-monitor
    MonitorManagementClient.diagnostic_settings.list(resource_uri) per registry,
    preceded by ResourceManagementClient.providers.get("Microsoft.ContainerRegistry").
    Registries the resource_exclusions patterns take out are listed under results.excluded
    instead, each with the pattern that matched; the summary gives resource_exclusion_patterns
    (the configured patterns, empty when none are set), resource_exclusion_patterns_unmatched
    (patterns that matched no registry, such as a mistyped name, or null when the registry list could not be read), excluded_registries (how many
    the patterns took out, null if the list couldn't be read; no other count includes them) and in_scope_registries (how many
    stayed; null if the list couldn't be read, and 0 means there are none or the patterns took out every registry).
