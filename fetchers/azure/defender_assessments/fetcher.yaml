name: azure_defender_assessments
version: 0.3.0
description: >
  Every Microsoft Defender for Cloud security assessment result on the
  subscription — one record per (resource, check) pair, each with its
  Healthy/Unhealthy/NotApplicable status and the assessment's own severity, read
  from Resource Graph because the subscription's metadata catalogue can rate a
  check lower than the assessment does. The catalogue's severity is only the
  fallback, for an assessment Resource Graph does not return (its index lags
  ARM, or the identity cannot read that row): severity_source says which one a
  record carries, and the summary counts the records, and the Unhealthy ones, on
  the fallback or with no severity. This is the per-resource
  pass/fail detail behind the secure score, not the score itself: it shows
  exactly which resources fail which checks. A subscription that never
  registered the Microsoft.Security resource provider reports
  provider_registration_status: not_registered, which is valid evidence ("not
  in use") rather than a collection failure. Needs Reader (or Security Reader).
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_defender_assessments.json
  aggregation: per_target

config_schema:
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. An assessment follows the resource it is about: one whose
      resource_id is in a matching resource group or is, or sits under, a matching
      id is listed under excluded with the pattern and left out of every count and
      percentage. An assessment carries no region, so location: patterns never
      match one, and assessments of the subscription itself stay in scope. A
      pattern without one of these prefixes fails the run. Set it once for every
      Azure fetcher under platforms.azure.config. Can be ${env:VAR}. Empty: every
      resource is in scope.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-EIS      # Automated services persistently assess resource security — the per-check results themselves
  - KSI-SVC-EIS      # Evaluate and improve security — unhealthy assessments are exactly what needs remediation

evidence_set:
  reference_id: EVD-AZURE-DEFENDER-ASSESSMENTS
  name: Microsoft Defender for Cloud Security Assessments
  instructions: >
    Script: azure/defender_assessments/fetcher.py. Azure SDK calls
    (azure-mgmt-security SecurityCenter):
    assessments.list(scope="subscriptions/<subscription_id>") for every security
    assessment result on the subscription, and
    assessments_metadata.list_by_subscription() for each check's categories,
    threats, type, user impact, implementation effort and policy definition id
    (the list call does not return metadata). Each assessment's own severity
    comes from azure-mgmt-resourcegraph ResourceGraphClient
    resources(QueryRequest(subscriptions=[<subscription_id>], query="SecurityResources
    | where type =~ 'microsoft.security/assessments' | project id, severity =
    tostring(properties.metadata.severity) | order by id asc",
    options=QueryRequestOptions(top=1000, skip_token=<previous page's $skipToken>,
    result_format="objectArray"))), repeated until no $skipToken is returned and
    joined on the assessment id. The catalogue's severity, which can be lower than
    the assessment's, is used only where Resource Graph has none, such as an
    assessment its index has not caught up with or a row the identity cannot read:
    severity_source is "assessment" or "catalogue" (null when neither has one),
    and the summary gives severity_from_catalogue_count and severity_unknown_count,
    and unhealthy_severity_from_catalogue_count and
    unhealthy_severity_unknown_count for Unhealthy records only. Assessments about
    a resource the resource_exclusions patterns take out are listed under
    results.excluded instead (the entry's id is that resource's id); the summary
    gives resource_exclusion_patterns (the configured patterns, empty when none are
    set), resource_exclusion_patterns_unmatched (patterns that matched no
    assessment, such as a mistyped name), excluded_assessments (how many the
    patterns took out; no other count includes them) and in_scope_assessments (how
    many stayed, the same as total_assessments).
