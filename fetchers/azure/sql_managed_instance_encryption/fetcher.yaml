name: azure_sql_managed_instance_encryption
version: 0.2.0
description: >
  For each Azure SQL Managed Instance in the subscription, reports how its data is
  encrypted at rest: the instance's TDE encryption protector (a service-managed key
  or a customer-managed Key Vault key, its key URI and whether auto-rotation is on),
  and Transparent Data Encryption state for every database on the instance.
category: azure

config_schema:
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that resource's
      child resources). * matches any run of characters and ? one character. A
      matching managed instance is listed under excluded with the pattern and left
      out of every count and verdict, with its databases (an id: pattern naming one
      database matches nothing). A pattern without one of these prefixes fails the
      run. Set it once for every Azure fetcher under platforms.azure.config. Can be
      ${env:VAR}. Empty: every resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sql_managed_instance_encryption.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # TDE per database, service- or customer-managed protector

evidence_set:
  reference_id: EVD-AZURE-SQLMI-ENCRYPTION
  name: Azure SQL Managed Instance Encryption
  instructions: >
    Script: azure/sql_managed_instance_encryption/fetcher.py. Azure SDK calls (azure-mgmt-sql SqlManagementClient, api
    2025-01-01, Reader is sufficient): managed_instances.list(),
    managed_instance_encryption_protectors.get(..., "current"),
    managed_databases.list_by_instance(), and
    managed_database_transparent_data_encryption.get(..., "current") per user
    database. Every list follows nextLink. Per instance: `state`;
    `encryption_protector` with `server_key_type` (ServiceManaged, or AzureKeyVault
    for a customer-managed key), `server_key_name`, `key_vault_key_uri`,
    `thumbprint` and `auto_rotation_enabled` (absent reads as false);
    `customer_managed_key`; null when the protector call failed.
    `databases_collected` is false when the database list call failed, and
    `total_user_databases` is then null. Per
    database: `is_system_database` (master, model, msdb, tempdb — kept in the
    evidence, not queried, left out of every count), `status`, `tde_state`
    (Enabled or Disabled) and `tde_enabled` (null when the TDE call failed, so an
    unanswered call is never read as unencrypted). `all_user_databases_tde_enabled`
    is false when any user database is known Disabled, null when any TDE call
    failed (and none is known Disabled) or the instance has no user databases,
    and true only when every user database answered Enabled. Instance and
    summary counts split user databases into TDE enabled, disabled and unknown;
    the summary's `total_user_databases` is null when any database list failed.
    Resources the resource_exclusions patterns take out are listed under `excluded`
    instead, each with the pattern that matched, and every count covers only the
    instances in scope. The summary echoes `resource_exclusion_patterns`, lists
    `resource_exclusion_patterns_unmatched` (patterns that matched no instance, such
    as a mistyped name), and counts `excluded_managed_instances` and
    `in_scope_managed_instances` (0 when none was read or the patterns took out
    every instance, which a check can catch by requiring more than 0).
