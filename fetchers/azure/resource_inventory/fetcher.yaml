name: azure_resource_inventory
version: 0.3.0
description: >
  An automatically generated inventory of every resource in the subscription, read
  from Azure Resource Graph's `Resources` table rather than service by service: each
  resource's id, name, type, location, resource group, tags, SKU and kind where the
  resource type has them, and its provisioning state. Each resource also carries its
  Defender for Cloud coverage (assessments that came back Healthy or Unhealthy,
  unhealthy assessments and unhealthy High/Critical assessments, from
  `SecurityResources`; NotApplicable assessments did not happen and are counted
  apart, never as coverage) and its Azure Policy coverage (policy states and
  non-compliant states, from `PolicyResources`); results on a child resource, such
  as a subnet, count for the inventoried parent. The summary
  gives the total count and the counts by resource type and by location, how many
  resources carry no tags, and for Defender and for Policy the resources not covered.
  A resource counts as not covered only when its type is covered on some other
  resource in the subscription; types the service covers on no resource (types it
  has no recommendations or assigned policies for, or a service not in use) are
  listed apart with their counts, and a service that covers nothing, or an empty
  inventory (what Resource Graph returns to a caller without Reader), never reads
  as complete. The unhealthy, High/Critical and non-compliant counts cover inventoried
  resources and their children only: assessments and policy states about the
  subscription itself, a resource group, or anything else not in the inventory (a
  deleted resource, a type Resource Graph keeps outside `Resources`) are counted
  apart, with their own unhealthy, unhealthy High/Critical and non-compliant totals,
  and broken down by the type of what they target (never its name) under
  results.coverage_queries. Assessments of AWS, GCP or on-premises machines (a
  `resourceDetails` source other than Azure) always count there, by source, even
  when their id sits under an inventoried resource such as a multicloud connector.
  Every query is paged to the end — a result Resource Graph reports as
  truncated, or a page count that disagrees with its own total, is a collection
  failure rather than a short list, and a failed coverage query leaves that
  service's counts null rather than every resource uncovered. Resource Graph indexes
  ARM resources only: resource groups and subscriptions live in its separate
  `ResourceContainers` table and are not counted here. Needs Reader.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_resource_inventory.json
  aggregation: per_target

config_schema:
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching resource is listed under excluded with the pattern
      and left out of every count, the by-type and by-location tallies and both
      coverage verdicts. Defender assessments and policy states are still joined
      against the whole inventory, then those about an excluded resource or its
      children, or about anything else a pattern names (such as an excluded
      resource group), are left out of every Defender and Policy count, including
      the outside-inventory ones. A pattern without one of these prefixes fails
      the run. Set it once for every Azure fetcher under platforms.azure.config.
      Can be ${env:VAR}. Empty: every resource is in scope.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-PIY-GIV      # Generating inventories — a complete, automatically generated resource inventory
  - KSI-MLA-EVC      # Evaluating configurations — which resources Azure Policy evaluates, and which it misses
  - KSI-CNA-EIS      # Enforcing intended state — which resources Defender for Cloud persistently assesses
  - KSI-SVC-EIS      # Evaluating and improving security — unhealthy High/Critical assessments on each resource

evidence_set:
  reference_id: EVD-AZURE-RESOURCE-INVENTORY
  name: Azure Resource Inventory
  instructions: >
    Script: azure/resource_inventory/fetcher.py. Azure SDK calls (azure-mgmt-resourcegraph ResourceGraphClient),
    each resources(QueryRequest(subscriptions=[<subscription_id>], query=...,
    options=QueryRequestOptions(top=1000, skip_token=<previous page's $skipToken>,
    result_format="objectArray"))) repeated until no $skipToken is returned:
    "Resources | project id, name, type, location, resourceGroup, tags, sku, kind,
    provisioningState = tostring(properties.provisioningState) | order by id asc";
    "SecurityResources | where type =~ 'microsoft.security/assessments' | project id,
    resourceDetails = properties.resourceDetails, status =
    tostring(properties.status.code), severity = tostring(properties.metadata.severity)
    | order by id asc"; and "PolicyResources | where type =~
    'microsoft.policyinsights/policystates' | project id, resourceId =
    tostring(properties.resourceId), complianceState =
    tostring(properties.complianceState) | order by id asc". The three are joined by
    resource id in the fetcher. Reader is sufficient — Resource Graph returns only
    the resources the caller can read. Every policy state, Exempt and Unknown
    included, counts toward policy_evaluations, so toward
    resources_evaluated_by_policy and policy_evaluated_percentage; only NonCompliant
    counts toward policy_non_compliant. Each query stops at 1,000 pages (1,000,000
    rows), a guard in the fetcher rather than a documented Resource Graph limit. A
    query past it is a collection failure, never a truncated result: the run exits
    1 with the error in metadata.api_failures. A failed SecurityResources or
    PolicyResources query leaves that service's counts null; a failed Resources
    query leaves the inventory empty, so its totals read 0 and both services'
    counts are null. PolicyResources, one state per resource, assignment and
    policy, is the query a large subscription can push past the guard. A query that
    long will usually hit the runner's default 600-second timeout first (exit 124,
    no evidence file). KSI-CNA-EIS and KSI-SVC-EIS are supporting evidence:
    Defender's coverage and unhealthy findings, not the enforcement or remediation
    itself. Resources the resource_exclusions patterns take out are listed under
    results.excluded instead, each with the pattern that matched; the summary gives
    resource_exclusion_patterns (the configured patterns, empty when none are set),
    resource_exclusion_patterns_unmatched (patterns that matched no resource, such
    as a mistyped name), excluded_resources (how many the patterns took out; no
    other count includes them) and in_scope_resources (how many stayed; 0 means
    none was read or the patterns took out every resource).
