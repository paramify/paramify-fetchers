name: azure_entra_diagnostic_settings
version: 0.1.0
description: >-
  Shows which Entra ID log categories the tenant exports, where each goes, and whether audit and sign-in logs reach a Sentinel workspace.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_entra_diagnostic_settings.json
  aggregation: per_target

target_schema:
  # Entra diagnostic settings are tenant-scoped: one target per tenant.
  tenant_id:
    type: string
    required: false
    env: AZURE_TENANT_ID
    description: >
      Entra tenant id to collect from, and the output filename's discriminator.
      Optional — omit to use the tenant the credential authenticates into. When
      set, a credential that lands in a different tenant fails the run.
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Optional and not used to scope collection. With an Azure CLI login it picks
      the account that holds this subscription, and it is recorded for correlation.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-MLA-OSM      # Operating SIEM capability — directory logs reach the SIEM
  - KSI-MLA-LET      # Logging event types — which Entra event categories are collected

evidence_set:
  reference_id: EVD-AZURE-ENTRA-DIAGNOSTIC-SETTINGS
  name: Azure Entra ID Diagnostic Settings
  instructions: |
    Script: azure/entra_diagnostic_settings/fetcher.py

    Access: Security Reader or Global Reader in Entra ID. Optional: Microsoft Sentinel Reader on the destination workspaces; without it, whether a category reaches Sentinel reads as unknown (null).

    Commands Executed:
    - GET /providers/microsoft.aadiam/diagnosticSettings — the tenant's diagnostic settings and the categories each exports
    - GET /providers/microsoft.aadiam/diagnosticSettingsCategories — every available category, so unexported ones show
    - GET Microsoft.SecurityInsights/onboardingStates (per destination workspace) — whether the workspace runs Sentinel

    Output: azure_entra_diagnostic_settings_<tenant>.json — the tenant's diagnostic settings (Log Analytics workspace, storage account or Event Hub destinations) and, for each log category, whether it is exported, where to, and whether it reaches a Sentinel workspace; destination workspaces this credential can't read are recorded with an unknown Sentinel state.

    Summary fields:

    Are Entra ID logs exported?
    - settings_total — Number of Entra ID diagnostic settings in the tenant
    - categories_exported — Number of log categories that at least one setting exports (a category counts when a setting lists it enabled)
    - categories_not_exported — List of log categories no setting exports; null if the list of available categories couldn't be read

    Do audit and sign-in logs reach Sentinel?
    - key_categories_to_sentinel — Whether each key category reaches a Sentinel workspace: true if any setting exporting it sends it to one; null if none does but a destination workspace couldn't be read; false otherwise, including when no setting exports it:
      - AuditLogs (directory changes)
      - SignInLogs (interactive user sign-ins)
    - audit_and_signin_logs_to_sentinel — True if both AuditLogs and SignInLogs reach Sentinel; false if either doesn't; null if neither is false and one is unknown
