name: azure_sql_managed_instance_backups
version: 0.4.1
description: >-
  Shows whether each SQL Managed Instance's databases keep enough backup retention, whether backup storage and compute survive a zone or region loss, and the failovers run recently.
category: azure

config_schema:
  failover_history_days:
    type: integer
    required: false
    default: 90
    env: AZURE_SQL_MI_FAILOVER_HISTORY_DAYS
    description: >
      How many days back failovers are read from the Activity Log, ending at the
      run; 1 to 90, the days the Activity Log keeps. A value above 90 is capped
      with a warning; one that isn't a whole number from 1 up fails the run as
      bad_config, and 90 is read. The number asked for is kept in the evidence as
      results.failover_history_window.days_requested (null when the value isn't a
      whole number).
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that resource's
      child resources). * matches any run of characters and ? one character. A
      matching managed instance is listed under excluded with the pattern and left
      out of every count and verdict; its databases and their retention are not
      read (an id: pattern naming one database matches nothing). An instance failover group
      leaves scope only when every instance it pairs in this subscription is
      excluded; failover groups are still matched against every instance, so an
      in-scope instance's verdict doesn't change when its partner is excluded. A
      failover follows the failover group or instance it moved, and one whose
      group or instance is no longer listed leaves only when a pattern matches its
      resource id. A pattern without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sql_managed_instance_backups.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-RPL-ABO   # short- and long-term backup retention, backup storage redundancy
  - KSI-CNA-OFA   # compute zone redundancy, instance failover groups
  - KSI-RPL-RRO   # failover duration, to compare with the recovery time objective
  - KSI-RPL-TRC   # failovers run, test failovers included

evidence_set:
  reference_id: EVD-AZURE-SQLMI-BACKUPS
  name: Azure SQL Managed Instance Backups
  instructions: |
    Script: azure/sql_managed_instance_backups/fetcher.py

    Access: Reader on the subscription, which also covers reading the Activity Log.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Sql") — tells "not registered" apart from "no instances"
    - managed_instances.list() — every managed instance with its state, backup storage redundancy and compute zone redundancy
    - instance_failover_groups.list_by_location() (once per resource group and region holding an instance, excluded instances' included) — the instance failover groups and their failover policy
    - managed_databases.list_by_instance() (per in-scope instance) — the databases on each instance and their earliest restore point
    - managed_backup_short_term_retention_policies.get() (per user database) — point-in-time-restore retention in days
    - managed_instance_long_term_retention_policies.get() (per user database) — weekly, monthly and yearly long-term retention
    - activity_logs.list() filtered to Microsoft.Sql events over the failover history window — failover requests, their results and durations

    Output: azure_sql_managed_instance_backups_<subscription>.json — each SQL Managed Instance with its state, backup storage redundancy, zone redundancy and failover groups, each user database's earliest restore point and short- and long-term retention, and each failover in the window with its result, duration and the region that took over; system databases (master, model, msdb, tempdb) are kept but not queried or counted, and resources left out of scope are listed with the pattern that matched.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no instance, failover group or failover, such as a mistyped name; null if the instance list couldn't be read or the failover history wasn't read in full
    - excluded_managed_instances — Number of managed instances left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, its databases and their retention are never read, and no other count includes it
    - excluded_instance_failover_groups — Number of instance failover groups left out of scope because every instance of the group in this subscription is excluded; each is listed under excluded, naming that instance in matched_id
    - excluded_failovers — Number of failovers of an excluded failover group or instance, or of one no longer listed whose resource id a pattern matches; null when the failover history wasn't read in full, since no failover was tested against the patterns
    - in_scope_managed_instances — Number of managed instances read and in scope; 0 means none was read or the patterns took out every instance, which a check can catch by requiring more than 0
    - in_scope_instance_failover_groups — Number of instance failover groups read and in scope; 0 means none was read or the patterns took out every group
    - in_scope_failovers — Number of failovers read and in scope; null when the failover history wasn't read in full

    What was checked?
    - total_managed_instances — Number of in-scope SQL Managed Instances
    - total_user_databases — Number of user databases on in-scope instances (system databases left out); null if any instance's database list couldn't be read
    - instances_stopped — Number of instances whose state is Stopped; Azure takes no backups while an instance is stopped, so read retention together with this
    - provider_registration_status — Whether the SQL provider (Microsoft.Sql) is registered on the subscription: registered, not_registered or unknown

    Do databases keep short-term (point-in-time-restore) backups long enough?
    - databases_retention_at_least_7_days — Number of user databases whose point-in-time-restore retention is 7 days or more (Azure's default is 7; the range is 1 to 35)
    - databases_retention_below_7_days — Number of user databases whose retention policy was read and is under 7 days
    - databases_missing_retention_policy — Number of user databases with no short-term retention policy (the read answered 404)
    - databases_retention_unknown — Number of user databases whose retention couldn't be judged because the policy read failed or returned no day count; a database with no policy is in databases_missing_retention_policy instead

    Are long-term backups kept?
    - databases_with_long_term_retention — Number of user databases with a weekly, monthly or yearly long-term retention tier on (a duration of PT0S or none means that tier is off)
    - databases_long_term_retention_unknown — Number of user databases whose long-term retention policy couldn't be read, so they count in neither field above nor as unconfigured

    Is backup storage redundant?
    - instances_by_current_backup_storage_redundancy — Number of instances for each backup storage redundancy currently in effect, keyed by the value Azure reports (Local, Zone, Geo or GeoZone), or unknown when it reports none; a change to the requested value applies only to future backups and can take up to 24 hours. Geo keeps its primary-region copies in a single availability zone
    - instances_backup_storage_zone_redundant — Number of instances whose current backup storage redundancy is Zone or GeoZone

    Does the instance survive a zone or region loss?
    - instances_zone_redundant — Number of instances with compute zone redundancy on, a setting separate from backup storage redundancy (Azure omits it when off, so absent counts as off)
    - instances_in_failover_group — Number of instances that are in an instance failover group
    - instances_failover_group_unknown — Number of instances whose failover group membership is unknown: the failover group list for their resource group and region failed and no other region's list showed them in a group
    - total_instance_failover_groups — Number of in-scope instance failover groups, each counted once although Azure lists it from every region it spans; null if a failover group list failed for a resource group and region holding an in-scope instance (a failed list where every instance is excluded is only logged as a warning, and the run doesn't fail)
    - failover_groups_manual_policy — Number of failover groups whose failover policy is Manual, so a failover needs someone to start it; null if a failover group list failed for a resource group and region holding an in-scope instance

    Have failovers been run, and how long did they take?
    - failover_history_days — Number of days back from the run that the Activity Log was read for failovers (1 to 90, the days the Activity Log keeps)
    - failover_history_read — True if the Activity Log was read in full for the window; false if the read failed or stopped at 200,000 events, in which case every failover field below is null, never 0
    - total_failovers — Number of failover requests in the window, one per correlation id and target; a failover Azure starts itself under an Automatic policy may leave no Activity Log entry
    - failover_group_failovers — Number of failover requests made to an instance failover group, planned or forced
    - forced_failovers_allowing_data_loss — Number of failover group failovers made with data loss allowed (a forced failover)
    - managed_instance_failovers — Number of failovers between one instance's own replicas
    - succeeded_failovers — Number of failovers whose final status is Succeeded
    - failed_failovers — Number of failovers whose final status is Failed (a Canceled or unfinished failover is in neither this nor succeeded_failovers)
    - failover_groups_with_succeeded_failover — Number of distinct failover groups with at least one Succeeded failover in the window, told apart by resource id, or by resource group and name for a group no longer listed
    - latest_succeeded_failover_time — Time of the most recent Succeeded failover in the window (UTC); null if none, or if the history wasn't read in full
    - days_since_latest_succeeded_failover — Days from that failover to the run, to one decimal; null if there is none
    - longest_succeeded_failover_minutes — Minutes the longest Succeeded failover took, from its first event to its final one, to compare with the recovery time objective; null if none
