name: azure_function_app_configuration
version: 0.2.0
description: >
  For each function app in the subscription, reports network exposure (public
  network access, VNet integration), transport posture (HTTPS-only, FTP/FTPS state,
  minimum TLS version, HTTP/2), the declared runtime, the managed identity, whether
  function access keys are configured, and which application settings exist. Access
  keys are reported as presence plus key names, and application settings as names
  only — no key material and no application-setting value is ever written to the
  evidence. Needs two permissions beyond Reader (see instructions); an app whose
  privileged calls are refused is reported with status not_authorized rather than
  failing the run.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope,
      as case-insensitive glob patterns listed in the manifest, each with
      a prefix: rg:<resource group> (read from the resource id),
      location:<region> (the region's name without spaces, such as
      eastus2; a resource with no location never matches one) or
      id:<resource id> (also matches that resource's child resources). *
      matches any run of characters and ? one character. A matching
      function app is listed under excluded with the pattern and left out
      of every count and verdict; it gets no configuration, key or
      application-setting reads. A
      pattern without one of these prefixes fails the run. Set it once
      under platforms.azure.config for every Azure fetcher that has this
      field; fetchers without it ignore it. Each item is a pattern, or a pattern with a reason. Empty: every resource is in
      scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_function_app_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-MAT
  - KSI-SVC-SIN

evidence_set:
  reference_id: EVD-AZURE-FUNCAPP-CONFIG
  name: Azure Function App Configuration
  instructions: >
    Script: azure/function_app_configuration/fetcher.py. Azure SDK calls: resource.providers.get("Microsoft.Web"), then
    azure-mgmt-web WebSiteManagementClient web_apps.list(), get_configuration(),
    list_host_keys() and list_application_settings() per function app. The last two are
    POST /action calls needing Microsoft.Web/sites/host/listkeys/action and
    Microsoft.Web/sites/config/list/Action beyond Reader; a refusal is reported per app as
    not_authorized. Key and application-setting values are never written.
    Function apps the resource_exclusions patterns take out are listed under results.excluded
    instead, each with the pattern that matched; the summary gives resource_exclusion_patterns
    (the configured patterns, empty when none are set), resource_exclusion_patterns_unmatched
    (patterns that matched no function app, such as a mistyped name), excluded_function_apps
    (how many the patterns took out; no other count includes them) and in_scope_function_apps
    (how many stayed; 0 means none was read or the patterns took out every app).
