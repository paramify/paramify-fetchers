name: azure_function_app_configuration
version: 0.2.1
description: >-
  Shows whether each function app enforces HTTPS and TLS 1.2 or later, blocks public network access, uses a managed identity, and sends telemetry to Application Insights.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope,
      as case-insensitive glob patterns listed in the manifest, each with
      a prefix: rg:<resource group> (read from the resource id),
      location:<region> (the region's name without spaces, such as
      eastus2; a resource with no location never matches one) or
      id:<resource id> (also matches that resource's child resources). *
      matches any run of characters and ? one character. A matching
      function app is listed under excluded with the pattern and left out
      of every count and verdict; it gets no configuration, key or
      application-setting reads. A
      pattern without one of these prefixes fails the run. Set it once
      under platforms.azure.config for every Azure fetcher that has this
      field; fetchers without it ignore it. Each item is a pattern, or a pattern with a reason. Empty: every resource is in
      scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_function_app_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-MAT
  - KSI-SVC-SIN

evidence_set:
  reference_id: EVD-AZURE-FUNCAPP-CONFIG
  name: Azure Function App Configuration
  instructions: |
    Script: azure/function_app_configuration/fetcher.py

    Access: Reader on the subscription. Optional: Microsoft.Web/sites/host/listkeys/action and Microsoft.Web/sites/config/list/Action; without them, an app whose call is refused reads not_authorized for its access keys or app settings and the run does not fail.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Web") — tells "App Service not in use" from "no function apps"
    - web_apps.list() — every site, keeping function apps (kind starts with functionapp) with their HTTPS, public access, VNet integration and identity settings
    - web_apps.get_configuration() (per app) — runtime, TLS, FTP and remote debugging settings
    - web_apps.list_host_keys() (per app) — the names of its access keys; key values are never written
    - web_apps.list_application_settings() (per app) — the names of its app settings; setting values are never written

    Output: azure_function_app_configuration_<subscription>.json — each function app's network exposure, HTTPS, TLS and FTP settings, runtime, managed identity and the names of its access keys and app settings, plus the apps left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no function app, such as a mistyped name; null when the function app list could not be read
    - excluded_function_apps — Number of function apps left out of scope because a pattern matched; each is listed under excluded with the pattern, and no other count includes it; null when the function app list could not be read
    - in_scope_function_apps — Number of function apps read and in scope; 0 means there are none or the patterns took out every app; null when the function app list could not be read

    What was checked?
    - total_function_apps — Number of in-scope function apps; web apps are left out
    - provider_registration_status — Whether the App Service provider (Microsoft.Web) is registered on the subscription: registered, not_registered or unknown

    Is each app reachable only privately?
    - publicly_accessible_apps — Number of function apps whose public network access is not Disabled, counting an app that returns no value as public; with a private endpoint an unset value can mean public access is off, so this can overcount
    - public_network_access_disabled_apps — Number of function apps whose public network access is Disabled
    - vnet_integrated_apps — Number of function apps connected to a virtual network subnet for their outbound traffic

    Is traffic to each app encrypted?
    - https_only_apps — Number of function apps with HTTPS only on, so plain HTTP requests are redirected
    - https_only_percentage — Percentage of function apps with HTTPS only on = https_only_apps / total_function_apps × 100 (rounded down to a whole number); 0 when total_function_apps is 0
    - minimum_tls_1_2_apps — Number of function apps whose minimum TLS version is 1.2 or 1.3; an app whose configuration could not be read does not count
    - ftp_deployment_disabled_apps — Number of function apps whose FTP state is Disabled, so neither FTP nor FTPS is accepted
    - ftp_encrypted_or_disabled_apps — Number of function apps whose FTP state is FtpsOnly or Disabled, so unencrypted FTP is refused
    - remote_debugging_enabled_apps — Number of function apps with remote debugging turned on

    How do apps sign in, and are their keys readable?
    - managed_identity_apps — Number of function apps with a managed identity, system-assigned, user-assigned or both
    - managed_identity_percentage — Percentage of function apps with a managed identity = managed_identity_apps / total_function_apps × 100 (rounded down to a whole number); 0 when total_function_apps is 0
    - access_keys_configured_apps — Number of function apps with at least one host-level function key, which Azure creates by default on new apps; an app whose keys could not be read does not count, so 0 is not proof that no app uses keys
    - access_keys_not_authorized_apps — Number of function apps whose access keys could not be read because the run lacks Microsoft.Web/sites/host/listkeys/action

    Is each app's runtime declared and monitoring set up?
    - apps_with_declared_runtime — Number of function apps whose configuration names a runtime stack: a Linux runtime, a Windows runtime or a .NET Framework version
    - functions_extension_version_configured_apps — Number of function apps with the FUNCTIONS_EXTENSION_VERSION app setting, which pins the Functions host version; its value is not recorded
    - application_insights_configured_apps — Number of function apps with an Application Insights app setting (APPINSIGHTS_INSTRUMENTATIONKEY or APPLICATIONINSIGHTS_CONNECTION_STRING), so they send telemetry
    - application_settings_not_authorized_apps — Number of function apps whose app settings could not be read because the run lacks Microsoft.Web/sites/config/list/Action
