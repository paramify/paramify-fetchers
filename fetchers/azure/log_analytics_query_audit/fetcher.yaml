name: azure_log_analytics_query_audit
version: 0.2.1
description: >-
  Shows whether query auditing is on for each Log Analytics workspace, where the audit logs go, and in which weeks people queried the logs.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_log_analytics_query_audit.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Log Analytics workspace in the
      subscription.

config_schema:
  query_audit_lookback_days:
    type: integer
    required: false
    default: 90
    env: QUERY_AUDIT_LOOKBACK_DAYS
    description: How many days of LAQueryLogs to summarize into weeks.

  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Log Analytics workspace is listed under excluded with the
      pattern and left out of every count; its diagnostic settings are not read
      and LAQueryLogs is not queried for it. An in-scope workspace whose audit
      goes to an excluded workspace is still queried there, so it keeps its
      verdict. A SENTINEL_WORKSPACES filter applies first, and a workspace it names that a
      pattern takes out fails the run as bad_config. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every resource is in scope.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-MLA-RVL      # Reviewing logs — people query and review the logs, week by week

evidence_set:
  reference_id: EVD-AZURE-LOG-ANALYTICS-QUERY-AUDIT
  name: Azure Log Analytics Query Audit
  instructions: |
    Script: azure/log_analytics_query_audit/fetcher.py

    Access: Reader on the subscription, and Log Analytics Reader on the workspace that receives the audit logs.

    Commands Executed:
    - GET /subscriptions — picks a subscription when none is set
    - GET Microsoft.OperationalInsights/workspaces — every workspace
    - GET Microsoft.SecurityInsights/onboardingStates (per workspace) — whether Sentinel is on
    - GET Microsoft.Insights/diagnosticSettings (per workspace) — whether the Audit category is exported, and where
    - GET the audit destination workspace and its tables/LAQueryLogs (per workspace with a workspace destination) — the audit table's retention
    - KQL on LAQueryLogs, run twice (per workspace with a workspace destination) — queries per week by people (a signed-in user, so AADEmail is set) and by applications, and queries per user; this fetcher's own queries are left out

    Output: azure_log_analytics_query_audit_<subscription>.json — for each workspace, whether query auditing is on and where it goes, queries per week split into people and applications, and each user who queried with a count and last query, plus the workspaces left out and why; weeks that start before LAQueryLogs' retention read null (not retained) and never count as weeks without human queries.

    Summary fields:

    How many workspaces were read?
    - workspaces_collected — Number of in-scope workspaces read, Sentinel or not
    - sentinel_workspaces — Number of in-scope workspaces read that have Microsoft Sentinel onboarded

    Is query auditing on?
    - workspaces_with_query_auditing — Number of workspaces with a diagnostic setting that exports the Audit category (or the audit or allLogs category group)
    - workspaces_without_query_auditing — Number of workspaces whose diagnostic settings were read and have no such setting; workspaces whose settings couldn't be read are in neither count

    Which workspaces are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every workspace is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no workspace, such as a mistyped name; null when the workspace list could not be read
    - excluded_workspaces — Number of workspaces left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes it; null when the workspace list could not be read
    - in_scope_workspaces — Number of workspaces found and in scope; 0 means none was found or the patterns took out every workspace, which a check can catch by requiring more than 0; null when the workspace list could not be read
