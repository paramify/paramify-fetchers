name: azure_front_door_tls
version: 0.3.0
description: >-
  Shows whether each in-scope Front Door route accepts only HTTPS, and each in-scope custom domain's TLS floor, certificate and expiry.
category: azure

config_schema:
  scope_exclusions:
    type: string
    required: false
    env: AZURE_FRONT_DOOR_SCOPE_EXCLUSIONS
    description: >
      Parts of Front Door to leave out of scope, as case-insensitive glob patterns
      separated by commas or spaces, matched against custom-domain and endpoint host
      names (* matches any run of characters, dots included, ? one character, and [
      ] one character from a set, such as [0-9]). A pattern starting route:
      (route:qa-*) matches route names instead; a pattern without it never matches a
      route's name. A route is out of scope when a route: pattern matches its name
      or every host it serves is out, and a certificate secret when only
      out-of-scope domains use it. Each is listed under excluded and left out of
      every count. Can be ${env:VAR}. Empty: everything is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_front_door_tls.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # traffic to the public entry points is encrypted: HTTPS-only routes, TLS 1.2+ floor
  - KSI-CNA-MAT   # routes still accepting plain HTTP and weak TLS floors are the exposed surface

evidence_set:
  reference_id: EVD-AZURE-FRONTDOOR-TLS
  name: Azure Front Door TLS
  instructions: |
    Script: azure/front_door_tls/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get() for Microsoft.Cdn — notes an unregistered provider
    - profiles.list() — Front Door Standard and Premium profiles
    - afd_endpoints.list_by_profile() and routes.list_by_endpoint() — each route, the protocols it accepts, its HTTPS redirect and the hosts it serves
    - afd_custom_domains.list_by_profile() — each custom domain's TLS settings and certificate
    - secrets.list_by_profile() — each certificate's type, issuer and expiry (metadata and a Key Vault reference, never key material)
    - rule_sets.list_by_profile() and rules.list_by_rule_set() — rules that redirect HTTP to HTTPS

    Output: azure_front_door_tls_<subscription>.json — each in-scope route with whether it accepts only HTTPS, each in-scope custom domain with its TLS floor and certificate, and the domains, endpoints, routes and certificate secrets left out of scope with the pattern or reason that took each out.

    Summary fields:

    What was checked?
    - total_front_door_profiles — Number of Front Door Standard and Premium profiles
    - premium_profiles — Number of Front Door Premium profiles
    - standard_profiles — Number of Front Door Standard profiles
    - skipped_profiles_by_sku — Number of classic CDN profiles skipped, for each SKU
    - total_routes — Number of in-scope routes across all profiles (out-of-scope ones are counted in excluded_routes)
    - serving_routes — Number of in-scope routes that serve traffic: the route and its endpoint are both enabled
    - total_custom_domains — Number of in-scope custom domains across all profiles
    - served_custom_domains — Number of in-scope custom domains that a serving route serves (a route out of scope still counts here, so a domain is never left out because of its route)
    - unrouted_custom_domains — Number of in-scope custom domains that no route lists
    - certificate_secrets — Number of in-scope certificate secrets (customer certificates and Front Door managed ones) across all profiles; a secret no custom domain uses counts as in scope
    - provider_registration_status — Whether Microsoft.Cdn is registered on the subscription: registered, not_registered or unknown

    Which parts of Front Door are left out of scope?
    - scope_exclusion_patterns — List of the configured scope_exclusions patterns: case-insensitive globs matched against custom-domain and endpoint host names (azurefd.net), or against route names when they start route:. A custom domain is in scope unless its host name matches one; a route is in scope unless a route: pattern matches its name or every host it serves matches (its custom domains, plus the endpoint's own host name when the route links it), and an in-scope route lists only its in-scope hosts; a certificate secret is in scope unless only out-of-scope custom domains use it. Empty when none are set, so everything is in scope
    - scope_exclusion_patterns_unmatched — List of configured patterns that matched no custom-domain host name, endpoint host name or route name, such as a mistyped name
    - excluded_custom_domains — Number of custom domains whose host name matches a pattern; each is listed under excluded with the pattern, and no other count includes them
    - excluded_endpoints — Number of endpoints whose own host name matches a pattern
    - excluded_routes — Number of routes out of scope: a route: pattern matches their name, or every host they serve is out of scope
    - excluded_secrets — Number of certificate secrets out of scope because only out-of-scope custom domains use them; each is listed under excluded with the custom domains that use it
    - in_scope_hosts — Number of custom domains and endpoints whose host name no pattern matches; 0 means the patterns took out every host, which a check can catch by requiring more than 0
    - in_scope_custom_domains — Number of custom domains whose host name no pattern matches
    - in_scope_endpoints — Number of endpoints whose own host name no pattern matches
    - in_scope_routes — Number of routes in scope
    - in_scope_secrets — Number of certificate secrets in scope

    Do serving routes accept only HTTPS?
    - serving_routes_https_only — Number of serving routes that only ever handle HTTPS: they accept only HTTPS, or they redirect plain HTTP to HTTPS (a route that sets no protocols accepts both, and one that sets no redirect doesn't redirect)
    - serving_routes_accepting_plain_http — Number of serving routes that answer plain HTTP without redirecting it to HTTPS
    - serving_routes_https_only_protocols — Number of serving routes that accept only HTTPS
    - serving_routes_https_redirect — Number of serving routes that accept HTTP and redirect it to HTTPS with the route's own HTTPS redirect setting
    - serving_routes_rule_set_redirect — Number of serving routes that accept HTTP and redirect it to HTTPS with a rule-set rule: one that redirects to HTTPS with no condition, or only a condition matching exactly HTTP requests, ahead of any rule that stops evaluation
    - serving_routes_on_endpoint_default_domain — Number of serving routes that also serve the endpoint's own azurefd.net host name while that host is in scope; it uses the platform's TLS policy rather than settings of its own

    Do served domains enforce TLS 1.2 or higher?
    - served_domains_below_tls12 — Number of served custom domains whose TLS floor is below TLS 1.2. The floor is set by the domain's cipher-suite set (TLS10_2019 means TLS 1.0; TLS12_2022 and TLS12_2023 mean TLS 1.2), or by its minimum TLS version when the set is Customized or not set
    - served_domains_minimum_tls13 — Number of served custom domains whose TLS floor is TLS 1.3
    - served_domains_tls_floor_unknown — Number of served custom domains whose TLS floor can't be read: an unknown cipher-suite set, or no set and no minimum version
    - domains_by_cipher_suite_set — Number of in-scope custom domains for each cipher-suite set:
      - TLS10_2019 (TLS 1.0 and up)
      - TLS12_2022 (TLS 1.2 and up)
      - TLS12_2023 (TLS 1.2 and up)
      - Customized (the domain's own cipher list and minimum version)
      - None (no set stored)

    Is each served domain's certificate valid and current?
    - served_domains_validation_not_approved — Number of served custom domains whose domain-ownership validation state isn't Approved
    - served_domains_certificate_missing — Number of served custom domains that don't use a Front Door managed certificate and whose certificate secret can't be found
    - served_domains_managed_certificate_without_secret — Number of served custom domains on a Front Door managed certificate that exposes no certificate secret, so its expiry can't be read (the platform renews it)
    - served_domains_certificate_expired — Number of served custom domains whose certificate's expiry date has passed
    - served_domains_certificate_expiring_soon — Number of served custom domains whose certificate expires within expiry_warning_days days and hasn't expired yet
    - served_domains_certificate_expiry_unknown — Number of served custom domains whose certificate expiry can't be read (no certificate secret found, or no date in it)
    - expiry_warning_days — Days before expiry that a certificate counts as expiring soon (30)
    - domains_by_certificate_type — Number of in-scope custom domains for each certificate type:
      - ManagedCertificate (issued and renewed by Front Door)
      - AzureFirstPartyManagedCertificate (an Azure first-party managed certificate)
      - CustomerCertificate (brought from Key Vault)
      - None (no type set)
