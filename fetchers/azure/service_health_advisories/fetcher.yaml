name: azure_service_health_advisories
version: 0.1.0
description: >-
  Lists the Microsoft service issues, planned maintenance, health and security
  advisories reported to the subscription, with their status, recommended
  actions and the in-scope resources they name.
category: azure

config_schema:
  lookback_days:
    type: integer
    required: false
    default: 180
    env: AZURE_SERVICE_HEALTH_LOOKBACK_DAYS
    description: >
      How many days back to list events, counted against each event's last
      update. At most 180: the event list answers 502 Bad Gateway for a
      270-day window, so a larger value is cut to 180 with a warning, and the
      value asked for is kept in the evidence as lookback_days_requested. Older
      events that Resource Graph still holds are read by their tracking id and
      added; one the event API can't find is counted in
      events_in_resource_graph_not_found.
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2) or id:<resource id>
      (also matches that resource's child resources). * matches any run of
      characters and ? one character. The patterns apply to the resources an
      event names: a matching resource is listed under excluded with the pattern
      and the event, and left out of every count. An event whose every named
      resource matches is listed under excluded too. A service-wide event that
      names no resources stays in scope, whatever regions it lists. A pattern
      without one of these prefixes fails the run. Set it once under
      platforms.azure.config for every Azure fetcher that has this field;
      fetchers without it ignore it. Can be ${env:VAR}. Empty: every resource is
      in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_service_health_advisories.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-IBP   # provider advisories and recommended actions, against the provider's guidance
  - KSI-SVC-PRR   # retirements and planned maintenance with their deadlines and the resources they name
  - KSI-SCR-MON   # Microsoft's security advisories and service issues, monitored as an upstream supplier

evidence_set:
  reference_id: EVD-AZURE-SERVICE-HEALTH
  name: Azure Service Health Advisories
  instructions: |
    Script: azure/service_health_advisories/fetcher.py

    Access: Reader on the subscription. Optional: Microsoft.ResourceHealth/events/fetchEventDetails/action for security advisory summaries and updates, and Microsoft.ResourceHealth/events/listSecurityAdvisoryImpactedResources/action for the resources a security advisory names (a custom role; Reader has neither); without them, those read unknown and the run does not fail.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get() for Microsoft.ResourceHealth — tells an unregistered provider from a quiet subscription
    - GET Microsoft.ResourceHealth/events — the Service Health events last updated within the lookback window
    - ServiceHealthResources where type is microsoft.resourcehealth/events — events Resource Graph still holds, with their last update, to catch older ones the window misses
    - GET Microsoft.ResourceHealth/events/{trackingId} (per event Resource Graph holds that the window missed, from the day before its last update) — its full record
    - POST Microsoft.ResourceHealth/events/{trackingId}/fetchEventDetails (per sensitive event) — the summary and updates the list leaves out
    - ServiceHealthResources where type is microsoft.resourcehealth/events/impactedresources — the resources each event names
    - POST Microsoft.ResourceHealth/events/{trackingId}/listSecurityAdvisoryImpactedResources (per security advisory) — the resources the advisory names

    Output: azure_service_health_advisories_<subscription>.json — each event with its type, status, level, title, summary, impacted services with their regions and the regions still active, impact start and end, published and last update times, latest update, recommended actions and the in-scope resources it names, plus limitations; resources the resource_exclusions patterns take out, and events whose every named resource they take out, are listed under excluded instead.

    Summary fields:

    What did Microsoft report to the subscription?
    - lookback_days — Number of days back the event list reaches, counted against each event's last update (180 by default, and at most 180)
    - events — Number of Service Health events in scope: those last updated within the window plus older ones Resource Graph still holds, billing communications left out; null, like every count below except the scope lists, when the event list could not be read
    - events_from_resource_graph — Number of events in scope that the windowed list left out and Resource Graph still holds, such as a retirement announced long ago, each read by its tracking id; null when Resource Graph's events could not be read
    - events_in_resource_graph_not_found — Number of events Resource Graph holds, outside the windowed list, that the event API did not find when read by tracking id; such an event is missing from every other count, so above 0 the evidence is short; null when Resource Graph's events could not be read
    - events_by_type — Number of events of each type; a type with none is left out:
      - ServiceIssue (an outage or degradation of an Azure service)
      - PlannedMaintenance (scheduled maintenance that may affect availability)
      - HealthAdvisory (a change that needs attention, such as a retirement)
      - SecurityAdvisory (a security notice for the subscription)
      - RCA (a post-incident review of an earlier service issue)
      - EmergingIssues (a broad issue Microsoft is still investigating)
    - events_by_status — Number of events in each status Microsoft gives: Active, Resolved, or unknown when Microsoft gives none
    - events_by_level — Number of events at each level Microsoft gives: Critical, Error, Warning, Informational, or unknown when Microsoft gives none
    - retirement_advisories — Number of health advisories that announce a retirement (sub-type Retirement)
    - billing_events_skipped — Number of billing communications left out of the evidence
    - provider_registration_status — Whether Microsoft.ResourceHealth is registered on the subscription: registered, not_registered or unknown (the lookup failed). Only registered makes 0 events mean none: with the provider not registered, the event list may come back empty without an error, so 0 events means unreadable, not quiet

    Which events are still open, and what do they ask for?
    - open_events — Number of open events. Open follows Microsoft's own rule for an active event: a service issue while its status is Active, and any other event until its impact mitigation time passes (or while its status is Active, when it has none)
    - open_events_by_type — Number of open events of each type; a type with none is left out
    - open_service_issues — Number of open service issues
    - open_security_advisories — Number of open security advisories
    - open_health_advisories — Number of open health advisories, retirements included
    - open_retirement_advisories — Number of open health advisories that announce a retirement
    - upcoming_planned_maintenance — Number of planned maintenance events whose maintenance has not ended
    - open_events_action_recommended — Number of open events that ask for action: Microsoft tagged them Action Recommended or listed recommended actions
    - open_high_severity_advisories — Number of open health or security advisories at level Critical or Error

    Which resources do the events name?
    - impacted_resources — Number of distinct in-scope resources named by any event; null while any event's resource list is unread
    - impacted_resources_by_type — Number of distinct in-scope resources named by any event, for each resource type; null while any event's resource list is unread
    - events_with_impacted_resources — Number of events that name at least one in-scope resource; null while any event's resource list is unread
    - open_events_with_impacted_resources — Number of open events that name at least one in-scope resource; null while any event's resource list is unread
    - events_impacted_resources_unread — Number of events whose resource list was refused or failed (Resource Graph's list, or a security advisory's own); above 0, the resource counts are null
    - events_impacted_resources_not_authorized — Number of security advisories whose resource list was refused (403) because the optional action is not granted

    Can the security advisories be read in full?
    - sensitive_events — Number of events Microsoft marks sensitive, whose summary and updates the event list leaves out
    - sensitive_event_details_read — Number of sensitive events whose summary and updates were read with fetchEventDetails
    - sensitive_event_details_not_authorized — Number of sensitive events whose details were refused (403) because the optional action is not granted; their summary and updates read null

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no resource an event names, such as a mistyped name
    - excluded_impacted_resources — Number of distinct resources named by events that a pattern took out by resource group, region or id; each is listed under excluded with the pattern, once for each event that names it, and no other count includes them; null while any event's resource list is unread
    - excluded_events — Number of events left out because a pattern took out every resource they name; each is listed under excluded
