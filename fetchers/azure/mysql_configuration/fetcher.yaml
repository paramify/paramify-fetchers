name: azure_mysql_configuration
version: 0.2.0
description: >
  For each Azure Database for MySQL flexible server in the subscription, reports the
  engine version, the full server-parameter set, and the posture derived from it:
  require_secure_transport, the comma-separated tls_version list of every ACCEPTED
  version (so a deprecated version still being accepted is visible), audit_log_enabled
  and the audit_log_events classes that show whether connections are recorded, plus
  public network access, geo-redundant backup and the high-availability mode. Every
  parameter is listed rather than read by name — the opposite of the PostgreSQL
  fetcher — because MySQL's audit configuration is spread across parameters that gate
  each other.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching MySQL flexible server is listed under excluded with the
      pattern and left out of every count and verdict; its server
      parameters are not read. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_mysql_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # require_secure_transport and the tls_version ACCEPTED list
  - KSI-CNA-MAT   # public network access
  - KSI-MLA-LET   # audit_log_enabled and the audit_log_events classes
  - KSI-RPL-ABO   # geo-redundant backup
  - KSI-CNA-OFA   # high-availability mode

evidence_set:
  reference_id: EVD-AZURE-MYSQL-CONFIG
  name: Azure MySQL Flexible Server Configuration
  instructions: >
    Script: azure/mysql_configuration/fetcher.py. Azure SDK calls (azure-mgmt-rdbms mysql_flexibleservers
    MySQLManagementClient): servers.list(), configurations.list_by_server(). Records
    each server's engine version, durability settings and every server parameter as a
    name-to-value map.

    Servers the resource_exclusions patterns take out are listed under results.excluded instead,
    each with the pattern that matched; they get no parameter reads and every count and percentage
    covers only the servers that stayed.

    Which resources are left out of scope?
      - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every server is in scope
      - resource_exclusion_patterns_unmatched — List of configured patterns that matched no MySQL server, such as a mistyped name
      - excluded_mysql_servers — Number of servers left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them; null if the list couldn't be read
      - in_scope_mysql_servers — Number of servers read and in scope; null if the list couldn't be read, and 0 means there are none or the patterns took out every server, which a check can catch by requiring more than 0
