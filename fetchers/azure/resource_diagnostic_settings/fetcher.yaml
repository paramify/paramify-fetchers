name: azure_resource_diagnostic_settings
version: 0.2.0
description: >-
  Shows which resources export their logs through a diagnostic setting, where those logs go, whether they actually arrive in Log Analytics, and which log categories nothing captures.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py
  timeout: 3600

output:
  type: json
  path: azure_resource_diagnostic_settings.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

config_schema:
  ingestion_lookback_days:
    type: integer
    required: false
    default: 7
    env: INGESTION_LOOKBACK_DAYS
    description: >
      Days of Log Analytics records to look back over for each resource's last
      record time. A resource with no record in the window reads
      ingested_in_window false.
  approved_log_workspaces:
    type: string
    required: false
    env: APPROVED_LOG_WORKSPACES
    description: >
      Comma-separated Log Analytics workspace resource ids or names that resource
      logs are meant to reach. Optional — when set, each setting says whether its
      workspace is approved and the summary counts the ones that are not.
  basic_logs_lookback_hours:
    type: integer
    required: false
    default: 0
    env: BASIC_LOGS_LOOKBACK_HOURS
    description: >
      Hours of Basic and Auxiliary plan tables to query, one table at a time. Off
      (0) by default, because Log Analytics bills these queries per GB scanned; a
      resource with no record in a workspace's other tables then reads
      ingested_in_window null rather than false. Set a short window to query them.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-MLA-LET
  - KSI-MLA-OSM

evidence_set:
  reference_id: EVD-AZURE-RESOURCE-DIAG-SETTINGS
  name: Azure Resource Diagnostic Settings
  instructions: |
    Script: azure/resource_diagnostic_settings/fetcher.py

    Access: Reader or Monitoring Reader on the subscription. Optional: Reader or Log Analytics Reader on destination workspaces in other subscriptions; without it, log arrival for resources sending there reads unknown.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Insights") — tells "not registered" from "no settings"
    - Resource Graph Resources query — every resource, checked against Resource Graph's total
    - diagnostic_settings_category.list() (per resource) — which log, audit and metric categories it emits
    - diagnostic_settings.list() (per log-emitting resource) — its settings and destinations
    - GET {workspace id} and GET {workspace id}/tables (per destination workspace) — its query id, and which tables are on the Basic or Auxiliary plan
    - KQL union * on each destination workspace, without AzureActivity and AzureMetrics — newest record and record count for each resource in the lookback
    - KQL on each Basic or Auxiliary table, only when basic_logs_lookback_hours is above 0 — newest record and record count for the tables union * skips; off by default because these queries bill per GB scanned

    Output: azure_resource_diagnostic_settings_<subscription>.json — each resource with its diagnostic settings, where its logs go, when its logs last arrived, and which log and audit categories aren't exported.

    Summary fields:

    Was every resource found and checked?
    - resources_enumerated — Number of resources Resource Graph returned
    - resource_graph_total_records — Number of resources Resource Graph reported in total; must equal resources_enumerated, which proves no resource was missed; null if Resource Graph gave no total
    - resource_graph_pages — Number of Resource Graph result pages read
    - child_services_synthesized — Number of storage blob, file, queue and table services added to the inventory (Resource Graph doesn't list them)
    - resources_evaluated — Number of resources checked, including the added storage services
    - resources_assessed — Number of resources whose diagnostic log categories were read
    - resources_unsupported — Number of resources whose type doesn't support diagnostic settings
    - resources_not_found — Number of resources deleted between being listed and being checked
    - resources_errored — Number of resources that couldn't be read (any makes the run fail)
    - provider_registration_status — Whether the Azure Monitor provider (Microsoft.Insights) is registered on the subscription: registered, not_registered or unknown

    Do resources export their logs?
    - resources_emitting_logs — Number of log-producing resources: those whose type produces resource logs
    - resources_with_enabled_log_setting — Number of log-producing resources with a diagnostic setting that exports at least one log category
    - resources_emitting_logs_without_setting — Number of log-producing resources with no diagnostic setting exporting any log category
    - log_setting_coverage_percentage — Percentage of log-producing resources that export their logs = resources_with_enabled_log_setting / resources_emitting_logs × 100 (a whole number, 0–100); 0 when resources_emitting_logs is 0
    - uncovered_by_type — Number of log-producing resources that don't export logs, for each resource type
    - all_log_emitting_resources_covered — True if every log-producing resource exports its logs and no resource read failed, including when there are none; false otherwise

    Do the logs reach Log Analytics?
    - resources_sending_to_log_analytics — Number of log-producing resources that export logs to a Log Analytics workspace
    - log_analytics_coverage_percentage — Percentage of log-producing resources that export logs to Log Analytics = resources_sending_to_log_analytics / resources_emitting_logs × 100 (a whole number, 0–100); 0 when resources_emitting_logs is 0

    Were the destination workspaces read?
    - ingestion_lookback_days — Number of days of records the workspace query looks back over
    - basic_logs_lookback_hours — Number of hours of records read from Basic and Auxiliary plan tables; 0, the default, when Basic and Auxiliary tables were skipped
    - log_analytics_destinations — Number of destination workspaces: distinct Log Analytics workspaces that diagnostic settings export logs to
    - log_analytics_destinations_queried — Number of destination workspaces whose records were read
    - log_analytics_destinations_not_authorized — Number of destination workspaces that refused the read
    - log_analytics_destinations_not_found — Number of destination workspaces that no longer exist, so logs sent there go nowhere
    - log_analytics_destinations_errored — Number of destination workspaces whose read failed for another reason (any makes the run fail)
    - log_analytics_destinations_with_unqueried_tables — Number of read destination workspaces with Basic or Auxiliary tables that were not queried

    Are the logs actually arriving?
    - resources_with_recent_ingestion — Number of log-producing resources exporting to Log Analytics with recent ingestion: at least one record, in any table except AzureActivity and AzureMetrics, whose time falls in the lookback in a destination workspace
    - resources_without_recent_ingestion — Number of log-producing resources exporting to Log Analytics with no record in the lookback, where every destination workspace was read in full or no longer exists
    - resources_ingestion_unknown — Number of log-producing resources exporting to Log Analytics with no record found, where a destination workspace refused the read, failed, or has Basic or Auxiliary tables that were not queried
    - recent_ingestion_percentage — Percentage of resources exporting to Log Analytics with recent ingestion = resources_with_recent_ingestion / resources_sending_to_log_analytics × 100 (a whole number, 0–100); 0 when resources_sending_to_log_analytics is 0. Resources counted in resources_ingestion_unknown are in the total but not the numerator
    - no_recent_ingestion_by_type — Number of resources without recent ingestion, for each resource type
    - all_log_analytics_resources_ingesting — True if every log-producing resource exporting to Log Analytics has recent ingestion; false if any has none or is unknown; true when none exports to Log Analytics

    Do logs go to an approved workspace?
    - approved_workspaces_configured — True if an approved workspace list (approved_log_workspaces) was set; false if not
    - settings_exporting_to_unapproved_workspace — Number of diagnostic settings exporting logs to a workspace not on the approved list; null when no list is set
    - resources_sending_to_approved_workspace — Number of log-producing resources with a diagnostic setting exporting logs to an approved workspace; null when no list is set
    - resources_exporting_to_unapproved_workspace — Number of resources with a diagnostic setting exporting logs to a workspace not on the approved list; null when no list is set

    Are all audit logs captured?
    - resources_with_audit_categories — Number of log-producing resources whose type has audit log categories
    - resources_capturing_all_audit_categories — Number of resources that export every audit log category their type has
