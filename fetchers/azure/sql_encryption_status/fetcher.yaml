name: azure_sql_encryption_status
version: 0.2.0
description: >
  For each Azure SQL logical server in the subscription, reports the transparent
  data encryption (TDE) key source — the encryption protector's server_key_type
  ("AzureKeyVault" = a customer-managed Key Vault key, "ServiceManaged" = the
  platform key), the bound key name and URI, and whether key auto-rotation is on —
  plus the per-database TDE state underneath it. TDE is enabled by default on Azure
  SQL, so the evidence that varies is the key source, not "encrypted: true/false";
  per-database state is still collected because a restored or explicitly disabled
  database can be unencrypted under an otherwise CMK-protected server. The
  Azure-managed `master` database is flagged and excluded from the user-database
  counts.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching SQL logical server is listed under excluded with the
      pattern and left out of every count and verdict; its databases
      leave with it and are not read. An in-scope server whose
      encryption key sits in an excluded Key Vault keeps its verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sql_encryption_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN

evidence_set:
  reference_id: EVD-AZURE-SQL-ENC
  name: Azure SQL Transparent Data Encryption
  instructions: >
    Script: azure/sql_encryption_status/fetcher.py. Azure SDK calls (azure-mgmt-sql SqlManagementClient):
    servers.list(), encryption_protectors.get(), databases.list_by_server(),
    transparent_data_encryptions.get(). Records each server's TDE key source and
    every database's TDE state.

    SQL servers the resource_exclusions patterns take out are listed under results.excluded instead,
    each with the pattern that matched; their databases follow them (never read, in no database
    count). The key vault a server's protector names is not a resource this fetcher reads, so
    excluding that vault does not change the server's verdict.

    Which resources are left out of scope?
      - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every server is in scope
      - resource_exclusion_patterns_unmatched — List of configured patterns that matched no SQL server, such as a mistyped name
      - excluded_sql_servers — Number of SQL servers left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them or their databases; null if the list couldn't be read
      - in_scope_sql_servers — Number of SQL servers read and in scope; null if the list couldn't be read, and 0 means there are none or the patterns took out every server, which a check can catch by requiring more than 0
