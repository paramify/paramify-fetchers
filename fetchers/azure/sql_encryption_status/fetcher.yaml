name: azure_sql_encryption_status
version: 0.1.0
description: >
  For each Azure SQL logical server in the subscription, reports the transparent
  data encryption (TDE) key source — the encryption protector's server_key_type
  ("AzureKeyVault" = a customer-managed Key Vault key, "ServiceManaged" = the
  platform key), the bound key name and URI, and whether key auto-rotation is on —
  plus the per-database TDE state underneath it. TDE is enabled by default on Azure
  SQL, so the evidence that varies is the key source, not "encrypted: true/false";
  per-database state is still collected because a restored or explicitly disabled
  database can be unencrypted under an otherwise CMK-protected server. The
  Azure-managed `master` database is flagged and excluded from the user-database
  counts.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sql_encryption_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN

evidence_set:
  reference_id: EVD-AZURE-SQL-ENC
  name: Azure SQL Transparent Data Encryption
  instructions: >
    Script: azure/sql_encryption_status/fetcher.py. Azure SDK calls (azure-mgmt-sql SqlManagementClient):
    servers.list(), encryption_protectors.get(), databases.list_by_server(),
    transparent_data_encryptions.get(). Records each server's TDE key source and
    every database's TDE state.
