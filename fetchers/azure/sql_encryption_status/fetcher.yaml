name: azure_sql_encryption_status
version: 0.2.1
description: >-
  Shows whether each Azure SQL server's transparent data encryption uses a customer-managed Key Vault key and whether every user database on it has encryption turned on.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching SQL logical server is listed under excluded with the
      pattern and left out of every count and verdict; its databases
      leave with it and are not read. An in-scope server whose
      encryption key sits in an excluded Key Vault keeps its verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sql_encryption_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN

evidence_set:
  reference_id: EVD-AZURE-SQL-ENC
  name: Azure SQL Transparent Data Encryption
  instructions: |
    Script: azure/sql_encryption_status/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Sql") — tells "not registered" apart from "no servers"
    - servers.list() — every logical server
    - encryption_protectors.get() (per in-scope server) — the TDE protector's key type, key name, Key Vault URI and auto-rotation setting
    - databases.list_by_server() (per in-scope server) — the databases on each server
    - transparent_data_encryptions.get() (per database) — whether transparent data encryption (TDE) is on

    Output: azure_sql_encryption_status_<subscription>.json — each Azure SQL logical server with the key that protects its transparent data encryption and the encryption state of every database on it; the master database is kept but marked as a system database; servers left out of scope are listed with the pattern that matched.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every server is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no SQL server, such as a mistyped name; null if the server list couldn't be read
    - excluded_sql_servers — Number of SQL servers left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, its databases are never read, and no other count includes it or its databases; null if the server list couldn't be read. The key vault a server's protector names isn't a resource this fetcher reads, so excluding that vault doesn't change the server's verdict
    - in_scope_sql_servers — Number of SQL servers read and in scope; null if the server list couldn't be read, and 0 means there are none or the patterns took out every server, which a check can catch by requiring more than 0

    What was checked?
    - total_sql_servers — Number of in-scope Azure SQL logical servers (SQL Managed Instances aren't included)
    - total_databases — Number of databases across in-scope servers, including master; a server whose database list couldn't be read adds 0
    - total_user_databases — Number of user databases across in-scope servers: every database except master, which Azure creates and manages
    - provider_registration_status — Whether the SQL provider (Microsoft.Sql) is registered on the subscription: registered, not_registered or unknown

    Is the encryption key customer-managed?
    - customer_managed_key_servers — Number of servers whose TDE protector is a customer-managed Key Vault key (server key type AzureKeyVault)
    - service_managed_key_servers — Number of servers not counted in customer_managed_key_servers: the protector is the Microsoft-managed (ServiceManaged) key, or the protector couldn't be read
    - cmk_percentage — Percentage of servers whose TDE protector is a customer-managed key = customer_managed_key_servers / total_sql_servers × 100 (a whole number, 0–100; reads 0 when total_sql_servers is 0). Servers whose protector couldn't be read count in the total but not as customer-managed. TDE is on by default, so the key source is what varies
    - key_auto_rotation_servers — Number of servers with key auto-rotation on, so the protector moves to the newest key version in Key Vault automatically; a server whose protector couldn't be read counts as off

    Is every user database encrypted?
    - tde_enabled_user_databases — Number of user databases with TDE Enabled
    - tde_disabled_user_databases — Number of user databases with TDE Disabled, for example a database restored or switched off under a server with a customer-managed key
    - tde_unknown_user_databases — Number of user databases whose TDE state couldn't be read
    - tde_percentage — Percentage of user databases with TDE on = tde_enabled_user_databases / total_user_databases × 100 (a whole number, 0–100; reads 0 when total_user_databases is 0). Databases whose state is unknown count in the total but not as encrypted, so they lower it
    - servers_with_a_tde_disabled_user_database — Number of servers with at least one user database whose TDE is Disabled
