name: azure_diagnostic_settings
version: 0.1.0
description: >
  The subscription-scope diagnostic settings that export the Azure Activity Log — the
  Azure analogue of AWS CloudTrail configuration. For each setting: which log
  categories and category groups are enabled (Administrative, Security, ServiceHealth,
  Alert, Recommendation, Policy, Autoscale, ResourceHealth), the legacy per-setting
  retention policy, and where the records land (storage account, Log Analytics
  workspace, event hub or partner solution). Summarized as which categories any
  setting covers, which of the four required for control-plane audit are missing, and
  whether the Activity Log is exported at all — without a setting it is kept for 90
  days and then discarded.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_diagnostic_settings.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-MLA-LET
  - KSI-MLA-OSM
  - KSI-CMT-LMC

evidence_set:
  reference_id: EVD-AZURE-DIAG-SETTINGS
  name: Azure Activity Log Diagnostic Settings
  instructions: >
    Script: azure/diagnostic_settings/fetcher.py. Azure SDK calls (azure-mgmt-monitor<7 MonitorManagementClient):
    diagnostic_settings.list(resource_uri="subscriptions/<id>/"), at subscription scope.
