name: azure_residual_resources
version: 0.1.0
description: >
  Residual elements left behind in the subscription after changes: managed disks
  attached to nothing, network interfaces with no VM or private endpoint, network
  security groups on no subnet or NIC, public IPs bound to nothing, resource groups
  holding no resources, user-assigned managed identities nothing uses, App Service
  deployment slots that are stopped or long untouched, and role assignments whose
  principal no longer exists in Entra ID. Each orphan is listed with its kind, and the summary counts them by
  kind. This is evidence that the state of the environment is reviewed after
  changes and unwanted leftovers are removed.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_residual_resources.json
  aggregation: per_target

config_schema:
  stale_slot_days:
    type: integer
    required: false
    default: 90
    env: AZURE_STALE_SLOT_DAYS
    description: >
      A deployment slot not modified for this many days counts as stale, as does a
      slot that is not running.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-PRR      # Reviewing residual elements after changes — orphaned resources and stale access

evidence_set:
  reference_id: EVD-AZURE-RESIDUAL-RESOURCES
  name: Azure Residual Resources
  instructions: >
    Script: fetcher.py. Needs Reader on the subscription and, for the principal
    check, directory read in Microsoft Graph (a signed-in member user has it by
    default; an application needs Directory.Read.All). Every query is an Azure
    Resource Graph query (azure-mgmt-resourcegraph ResourceGraphClient.resources,
    subscriptions=[<subscription_id>]). Each is paged with $skipToken to the end,
    and the run fails if Resource Graph returns fewer rows than it counted. The
    queries are recorded in results.sources. The orphan kinds are:
    unattached_disk, a compute disk whose diskState is Unattached;
    unattached_nic, a network interface with no virtualMachine, privateEndpoint or
    privateLinkService and no hostedWorkloads;
    unattached_nsg, a network security group with no networkInterfaces and no
    subnets;
    unattached_public_ip, a public IP with no ipConfiguration and no natGateway;
    empty_resource_group, a resource group from ResourceContainers with no row in
    Resources (hidden resource types that Resource Graph does not index are not
    counted);
    stale_deployment_slot, an App Service or Function App slot (microsoft.web/sites/slots)
    whose properties.state is not Running (`stale_reasons: not_running`), or whose
    properties.lastModifiedTimeUtc is older than `stale_slot_days`
    (`not_modified_in_<n>_days`), with state and last_modified recorded;
    unused_identity, a user-assigned managed identity
    (microsoft.managedidentity/userassignedidentities) whose resource id appears in no
    resource's identity or properties (attached_resources, the number of resources
    naming it; matched by regex, because Bot Service, Database Watcher, storage
    encryption and others name the identity inside properties rather than under
    identity.userAssignedIdentities), whose principalId holds no
    role assignment (role_assignments), and that has no federated identity
    credential (federated_credentials). A federated credential means an outside
    workload, such as a pipeline using workload identity federation, signs in as the
    identity. Resource Graph does not index federated credentials, so they are read
    with ARM GET <identity id>/federatedIdentityCredentials?api-version=2023-01-31,
    only for identities with no attachment and no role. Attachments and roles are
    read in this subscription only: an identity used solely by a resource or a role
    assignment in another subscription or a management group reads as unused.
    summary.identities_checked and summary.slots_checked count every identity and
    slot read.
    Role assignments come from authorizationresources (type
    microsoft.authorization/roleassignments: principalId, principalType,
    roleDefinitionId, scope, createdOn), with role names from azure-mgmt-authorization
    AuthorizationManagementClient.role_definitions.list(scope=/subscriptions/<id>),
    because Resource Graph does not index built-in roles. Only assignments made at
    the subscription or below are listed; assignments inherited from a management
    group or the tenant root belong to that scope and are not reviewed here. Every
    distinct principalId is looked up through Microsoft Graph POST
    /directoryObjects/getByIds, in batches of 1000. An id Graph does not return
    has `principal_exists: false` and `orphan_kind: deleted_principal_assignment`.
    ARM keeps the assignment and its stored principalType after the principal is
    deleted, so only the directory lookup can tell. If the lookup fails,
    principal_exists is null, summary.principal_check reads "failed", and the run
    fails. A principal created in the last few minutes can still be replicating
    and read as missing; created_on lets a reviewer rule that out.
    summary.total_orphans counts every orphan of every kind.
