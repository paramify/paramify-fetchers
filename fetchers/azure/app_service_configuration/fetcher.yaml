name: azure_app_service_configuration
version: 0.2.0
description: >
  For each App Service web app in the subscription, reports the transport and
  identity posture — HTTPS-only, minimum TLS version, HTTP/2, FTP/FTPS deployment
  state, client certificate mode (the effective mode, not the stale raw field),
  App Service Authentication ("Easy Auth") and whether unauthenticated callers are
  rejected, managed identity, VNet integration and public network access — together
  with the declared language runtime versions (linux_fx_version, windows_fx_version,
  java / php / python / node / .NET), which is what a supported-runtime control is
  evidenced from. Also the access restrictions on the main site and the SCM
  (deployment) site — every rule, the default action, whether SCM inherits the main
  site's rules, and whether each site lets every caller through — and each app's
  diagnostic settings (which log categories are exported, and where). Function apps are excluded; they are collected by
  azure_function_app_configuration, whose calls need more than Reader.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_app_service_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # HTTPS-only, minimum TLS version, FTP/FTPS state
  - KSI-CNA-MAT   # public network access and VNet integration
  - KSI-IAM-SNU   # managed identity
  - KSI-SVC-EIS   # declared runtime versions — the supported-runtime control
  - KSI-CNA-RNT   # access restrictions on the main and SCM sites
  - KSI-CNA-ULN   # VNet-scoped access-restriction rules and VNet integration
  - KSI-MLA-LET   # per-app diagnostic settings: which log categories are exported

  # No SVC-VCM: client certificate mode is mTLS-adjacent, but this reports the
  # setting, not automated validation of communications. Left an honest gap.

evidence_set:
  reference_id: EVD-AZURE-APPSVC-CONFIG
  name: Azure App Service Configuration
  instructions: >
    Script: fetcher.py. Azure SDK calls: resource.providers.get("Microsoft.Web"), then
    azure-mgmt-web WebSiteManagementClient web_apps.list(), get_configuration() and
    get_auth_settings_v2_without_secrets() per web app (access restrictions come from
    get_configuration()), and azure-mgmt-monitor MonitorManagementClient
    diagnostic_settings.list(resource_uri) per web app. Reader is sufficient — all GETs.
