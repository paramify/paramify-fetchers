name: azure_sentinel_analytics_rules
version: 0.2.0
description: >
  For every Microsoft Sentinel workspace in the subscription: each analytics
  (detection) rule with its kind, enabled state, severity, MITRE tactics and
  techniques, source template, schedule and threshold, KQL query, suppression
  settings, and whether it creates incidents. Each rule lists the log tables it
  reads and which of them received no data in the ingestion window. Per
  workspace: enabled-rule counts by kind, whether the Fusion multistage
  correlation rule is present and enabled, how many rule templates are in use,
  the ingesting tables no enabled rule reads, and the enabled rules reading a
  table with no data. Rules are listed at the stable and the preview
  api-version and merged by id, because the stable schema has no NRT kind.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_analytics_rules.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  ingestion_window_days:
    type: integer
    required: false
    default: 14
    env: SENTINEL_INGESTION_WINDOW_DAYS
    description: >
      How far back a table's latest record may be for the table to count as
      receiving data. The default of 14 matches Sentinel's own rule for showing
      a connector as connected.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-MLA-OSM      # Operating SIEM capability — the detections the SIEM runs
  - KSI-MLA-RVL      # Reviewing logs — which ingesting tables enabled rules read, and which they don't
  - KSI-IAM-SUS      # Responding to suspicious activity — the queries that flag suspicious sign-ins and activity
  - KSI-MLA-ALA      # Authorizing log access — the rules watching log access, with their queries and suppression

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-ANALYTICS-RULES
  name: Azure Sentinel Analytics Rules
  instructions: >
    Script: fetcher.py. ARM REST per Sentinel workspace: alertRules at
    2025-09-01 and 2025-10-01-preview merged by id, alertRuleTemplates, and
    workspace tables. tables_read: table names in the query, else the
    template's requiredDataConnectors; incident-creation rules read
    SecurityAlert from their product. Log Analytics: max(TimeGenerated) per
    table over the window. Fusion is kind Fusion or template
    f71aba3d-28fb-450b-b192-4e76a83015c8, disabled by design on workspaces
    onboarded to the Defender portal. Roles: Microsoft Sentinel Reader and Log
    Analytics Reader.
