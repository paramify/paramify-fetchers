name: azure_backup_recovery_status
version: 0.4.1
description: >-
  Shows each Recovery Services vault's backup policies, retention, protected items and own protections, and the restore jobs run over a window, with their duration and recovery point age.
category: azure

config_schema:
  restore_window_days:
    type: integer
    required: false
    default: 365
    env: AZURE_BACKUP_RESTORE_WINDOW_DAYS
    description: >
      How many days back restore jobs are read, ending at the run, from 1 to 365. A
      value above 365 is capped with a warning; one that isn't a whole number from 1
      up fails the run as bad_config, and 365 is read. The number asked for is kept in
      the evidence as restore_job_window_days_requested (null when the value isn't a
      whole number). A vault keeps job history for
      a limited time, so older restores may be gone whatever the window.
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Recovery Services vault is listed under excluded with
      the pattern and left out of every count and verdict; its backup policies,
      protected items and restore jobs are not read. In an in-scope vault, a protected item is
      listed under excluded when an id: pattern matches it, or when an rg: or
      id: pattern matches the resource it protects (whose region isn't read),
      with that resource's id in its entry; a vault
      whose protected items all leave stays in scope and counts as protecting
      nothing. A restore job of an excluded protected item (matched by the item's
      friendly name in the same vault) is listed under excluded too, and its
      details are not read, unless an in-scope item in that vault has the same
      friendly name; a job whose item is no longer listed (protection stopped and
      its data deleted) stays in scope. A pattern without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a pattern, or a pattern with a reason.
      Empty: every resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_backup_recovery_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-RPL-ABO
  - KSI-RPL-RRO   # restore duration and recovery point age, to compare with the RTO and RPO
  - KSI-RPL-TRC   # restore jobs, test restores included

evidence_set:
  reference_id: EVD-AZURE-BACKUP-RECOVERY
  name: Azure Backup and Recovery Status
  instructions: |
    Script: azure/backup_recovery_status/fetcher.py

    Access: Reader on the subscription, or Backup Reader on the vaults. A refused vault list leaves every vault, policy, item and restore count null. A refused policy or protected-item list for one vault fails the run and counts that vault as having none.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.RecoveryServices") — tells "no vaults in use" from "no vaults"
    - vaults.list_by_subscription_id() — every vault with its soft delete, immutability, multi-user authorization, cross-region restore and storage redundancy
    - backup_policies.list() (per in-scope vault) — each policy's schedule and full retention
    - backup_protected_items.list() (per in-scope vault) — each protected item, its policy, protection state and last backup
    - backup_jobs.list() (per in-scope vault) — restore jobs only, read in slices of 30 days across the restore window
    - job_details.get() (per in-scope restore job) — its recovery point time and restore target

    Output: azure_backup_recovery_status_<subscription>.json — each vault's policies, protected items, own protections and restore jobs (keeping Azure's own free text, such as a restore destination path, with URL query strings dropped), plus the vaults, items and jobs left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no Recovery Services vault, protected item or protected resource, such as a mistyped name; null when the vault list, a vault's protected-item list or a vault's restore jobs could not be read
    - excluded_recovery_services_vaults — Number of Recovery Services vaults left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, no other count includes it, and its policies and protected items are never read; null when the vault list could not be read
    - excluded_protected_items — Number of protected items in in-scope vaults left out of scope because a pattern matched the item's id, or the protected resource by resource group or id (the entry's id is then that resource's); each is listed under excluded. An excluded vault's items are never read, so they are not counted here; null when the vault list could not be read
    - excluded_restore_jobs — Number of restore jobs in in-scope vaults left out of scope because they restored an excluded protected item, matched by the item's friendly name in the same vault (a job names its item no other way); each is listed under excluded and gets no details read. A job stays in scope when an in-scope item in that vault has the same friendly name, or when its item is no longer listed; null when a vault's restore jobs could not be read
    - in_scope_recovery_services_vaults — Number of Recovery Services vaults read and in scope; null when the vault list could not be read; 0 means the subscription has none or the patterns took out every vault, which a check can catch by requiring more than 0
    - in_scope_protected_items — Number of protected items read and in scope; null when the vault list could not be read
    - in_scope_restore_jobs — Number of restore jobs read and in scope; null when a vault's restore jobs could not be read

    Which vaults, policies and protected items exist?
    - total_recovery_services_vaults — Number of in-scope Recovery Services vaults; null when the vault list could not be read
    - provider_registration_status — Whether the Recovery Services provider (Microsoft.RecoveryServices) is registered on the subscription: registered, not_registered or unknown. A subscription where it is not registered lists no vaults and reads 0
    - vaults_with_protected_items — Number of in-scope vaults protecting at least one in-scope item; null when the vault list could not be read
    - vaults_without_protected_items — Number of in-scope vaults protecting no in-scope item, including those whose items all left scope; null when the vault list could not be read
    - total_backup_policies — Number of backup policies defined across the in-scope vaults; null when the vault list could not be read
    - total_protected_items — Number of in-scope protected items across the in-scope vaults; null when the vault list could not be read
    - protected_items_by_workload_type — Number of protected items for each workload type Azure reports (such as VM, AzureFileShare or SQLDataBase), or unknown when it reports none; null when the vault list could not be read

    Are the vaults protected against loss of the backups themselves?
    - soft_delete_enabled_vaults — Number of in-scope vaults with soft delete Enabled or AlwaysON (soft delete that cannot be turned off); null when the vault list could not be read
    - immutability_enabled_vaults — Number of in-scope vaults with immutability Unlocked or Locked; null when the vault list could not be read
    - cross_region_restore_vaults — Number of in-scope vaults with cross-region restore enabled; null when the vault list could not be read

    Are items backed up, and do policies keep backups long enough?
    - protected_items_with_policy — Number of protected items that name a backup policy; null when the vault list could not be read
    - protected_items_in_protected_state — Number of protected items whose protection state is Protected; null when the vault list could not be read
    - protected_items_with_healthy_last_backup — Number of protected items whose last backup status is Completed, Success, Succeeded or Healthy; null when the vault list could not be read
    - retention_threshold_days — Number of days a policy must keep backups to count as adequate (30); always set, even when the vault list could not be read
    - policies_meeting_retention_threshold — Number of backup policies whose longest retention across daily, weekly, monthly and yearly schedules, and any per-database sub-policies (SAP HANA, SQL in a VM), is at least retention_threshold_days; a month counts as 30 days and a year as 365; null when the vault list could not be read
    - policies_without_readable_retention — Number of backup policies whose retention could not be read at all; null when the vault list could not be read
    - protected_items_meeting_retention_threshold — Number of protected items whose policy meets the retention threshold; an item with no policy is not counted; null when the vault list could not be read
    - retention_threshold_percentage — Percentage of protected items whose policy meets the retention threshold = protected_items_meeting_retention_threshold / total_protected_items × 100 (a whole number, rounded down; reads 0 when total_protected_items is 0); null when the vault list could not be read

    Were restores run, and how did they go?
    - restore_job_window_days — Number of days back restore jobs were read, ending at the run (365 unless AZURE_BACKUP_RESTORE_WINDOW_DAYS sets it, and at most 365; the evidence's restore_job_window_days_requested keeps the number asked for, null if it wasn't one); a vault keeps job history for a limited time, so the oldest days may hold nothing
    - restore_jobs_read — True if the vault list and every in-scope vault's restore jobs were read; false if not, and then every restore field below is null
    - total_restore_jobs — Number of restore jobs in the window across in-scope vaults, whatever their result; null when restore_jobs_read is false
    - succeeded_restore_jobs — Number of those whose status is Completed (CompletedWithWarnings, a partial restore, is not counted); null when restore_jobs_read is false
    - failed_restore_jobs — Number of those whose status is Failed; null when restore_jobs_read is false
    - restore_jobs_by_status — Number of restore jobs for each status, as Azure Backup names it (a job with no status reads unknown); null when restore_jobs_read is false:
      - Completed (the restore finished)
      - CompletedWithWarnings (the restore finished but left some data out)
      - Failed (the restore stopped with an error)
      - InProgress (still running when the fetcher ran)
      - Cancelled (stopped by someone before it finished)
    - vaults_with_succeeded_restore — Number of in-scope vaults with at least one succeeded restore in the window; null when restore_jobs_read is false
    - latest_succeeded_restore_time — End time of the newest succeeded restore, in UTC; null if there was none or restore_jobs_read is false
    - days_since_latest_succeeded_restore — Days from that restore's end to the run, to one decimal; null if there was none or restore_jobs_read is false

    How long did restores take, and how old was the data they restored?
    - longest_succeeded_restore_minutes — Minutes the longest succeeded restore took, to compare with the recovery time objective; null if there was none or restore_jobs_read is false
    - max_recovery_point_age_hours — Hours: the largest recovery point age among succeeded restores, which is how old the restored data was when the restore started. It is the point the person restoring chose, so restoring an older point raises it; it is not the recovery point objective a restore could achieve. A succeeded restore with no readable recovery point time is left out rather than making it null, and may have been older, so a check against the objective should also require succeeded_restores_without_recovery_point_time to be 0. Null if none had a readable time, a succeeded restore's details couldn't be read, or restore_jobs_read is false
    - succeeded_restores_without_recovery_point_time — Number of succeeded restores left out of max_recovery_point_age_hours: their details name no recovery point time the fetcher can read, the time is after the restore's start, or the details couldn't be read; null when restore_jobs_read is false. ISO 8601 reads for any job; otherwise the form is chosen by the job's workload_type, or its backup_management_type when it has none, never guessed from the text: day/month/year in 24-hour form for SQL in a VM (SQLDataBase), month/day/year with AM/PM in UTC for Azure VM (AzureIaasVM) and Azure Files (AzureStorage). Other jobs, such as SAP HANA restores, read no other form until a real sample shows which they write; each keeps the text as recovery_point_time_text
