name: azure_sentinel_data_sources
version: 0.2.0
description: >-
  Shows which log sources and data connectors sent data to each Sentinel
  workspace in the ingestion window (14 days by default), with each
  connector's last data received.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_data_sources.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  ingestion_window_days:
    type: integer
    required: false
    default: 14
    env: SENTINEL_INGESTION_WINDOW_DAYS
    description: >
      How far back a table's latest record may be for the table to count as
      ingesting. The default of 14 matches Sentinel's own rule for showing a
      connector as connected.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-MLA-OSM      # Operating SIEM capability — which sources actually feed the SIEM
  - KSI-MLA-LET      # Logging event types — the event sources being collected

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-DATA-SOURCES
  name: Azure Sentinel Data Sources
  instructions: |
    Script: azure/sentinel_data_sources/fetcher.py

    Access: Microsoft Sentinel Reader and Log Analytics Reader.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - GET Microsoft.OperationalInsights/workspaces and onboardingStates (per workspace) — finds the Sentinel workspaces
    - GET Microsoft.SecurityInsights/dataConnectors (stable and preview APIs) — connections and their states, and the connector definitions installed from Content Hub
    - GET Microsoft.SecurityInsights/dataConnectorDefinitions — codeless connector definitions
    - GET Microsoft.OperationalInsights/workspaces/tables — each table's plan, since the query API can't read tables on the Basic or Auxiliary plan
    - KQL union * summarized by table — each table's last ingestion time and record count
    - KQL on SecurityAlert by product — which alert products feed the workspace
    - KQL union of each connector data type's lastDataReceivedQuery — last data received per connector data type, as the Sentinel portal measures it
    - KQL on SentinelHealth — each connector's latest health status (only when health monitoring sends data)

    Output: azure_sentinel_data_sources_<subscription>.json — for each Sentinel workspace, its connectors with when each last received data and whether it sends only alerts, every table with when it last received data, and the Basic and Auxiliary tables that weren't measured.

    Summary fields:

    Which workspaces were checked?
    - workspaces_collected — Number of Sentinel workspaces read
    - workspaces_without_sentinel — Number of workspaces skipped because Sentinel isn't turned on

    Is Sentinel receiving data from enough sources?
    - min_sources_ingesting — Number of data sources sending data to the Sentinel workspace with the fewest, in the window (default 14 days); null if no workspace's ingestion could be read. A source is a table that received data, other than workspace and Sentinel telemetry (Usage, Operation, LAQueryLogs, SentinelHealth, SentinelAudit, SecurityIncident, watchlists, UEBA tables and Heartbeat), or a product other than Sentinel sending alerts to SecurityAlert. Tables on the Basic or Auxiliary plan aren't counted
    - workspaces_with_2plus_sources — Number of Sentinel workspaces receiving data from at least two sources
    - workspaces_with_no_sources — Number of Sentinel workspaces receiving data from no source
    - data_connectors_total — Number of configured data connections across all Sentinel workspaces, including kinds only the preview API lists, such as Defender XDR; null if no workspace's connections could all be listed

    Is each connector actually delivering data?
    - connectors_connected — Number of connectors, across all Sentinel workspaces, that are connected. A connector is every connector definition installed in the workspace plus each built-in connection kind with no installed definition; it is connected when at least one of its data types received data in the window, measured with the definition's own last-data query. Null if no workspace's connectors could all be listed and measured
    - connectors_not_connected — Number of connectors, across all Sentinel workspaces, none of whose data types received data in the window. This includes an alert-only connector with no linked connection sending alerts (never connected, or its alerts turned off); a quiet one is counted under connectors_quiet instead. Connectors whose data couldn't be measured (such as a table on the Basic or Auxiliary plan), or that define no data types, aren't counted. Null if no workspace's connectors could all be listed and measured
    - connectors_quiet — Number of alert-only connectors, across all Sentinel workspaces, that received no alert in the window although a linked connection (their own, or Defender XDR's) has alerts enabled, which is normal for them. A quiet connector still reads connected: false. A connector is alert-only when all its data types are SecurityAlert queries: Defender for Endpoint, Defender for Office 365, Defender for Identity, Defender for Cloud, Defender for Cloud Apps (whose Cloud Discovery logs count only when its connection turns them on), Defender for IoT, Entra ID Protection and Insider Risk Management. Null if no workspace's connectors could all be listed and measured
    - connectors_configured_without_data — Number of connectors, across all Sentinel workspaces, that have at least one connection (their own, or a linked one such as Defender XDR) but none of whose data types received data in the window, not counting quiet ones. An alert-only connector whose connection has alerts turned off is counted; a connector installed from Content Hub with no connection, which connectors_not_connected counts, isn't. Connectors whose data couldn't be measured, or that define no data types, aren't counted. Null if any workspace's connectors couldn't all be listed and measured
    - workspaces_with_health_monitoring — Number of Sentinel workspaces where Sentinel health monitoring sent data to the SentinelHealth table in the window
    - connectors_unhealthy — Number of data connections, across all Sentinel workspaces, whose latest SentinelHealth status isn't Success; null if no workspace's SentinelHealth data could be read
