name: azure_sentinel_data_sources
version: 0.4.0
description: >-
  Shows which log sources and data connectors sent data to each Sentinel
  workspace in the ingestion window (14 days by default), with each
  connector's last data received.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_data_sources.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  ingestion_window_days:
    type: integer
    required: false
    default: 14
    env: SENTINEL_INGESTION_WINDOW_DAYS
    description: >
      How far back a table's latest record may be for the table to count as
      ingesting. The default of 14 matches Sentinel's own rule for showing a
      connector as connected.
  basic_logs_lookback_hours:
    type: integer
    required: false
    default: 0
    env: BASIC_LOGS_LOOKBACK_HOURS
    description: >
      Hours of Basic and Auxiliary plan tables to search, one table at a time,
      through the /search endpoint, the only way to read them. Off (0) by
      default, because Log Analytics bills these searches per GB scanned. At 0
      those tables are not measured, which is not unknown: they are listed in
      tables_not_measured, never counted as sources, and a connector that reads
      only them is unmeasured. The hours are capped at the ingestion window and
      at the 720 (30 days) /search reaches. With fewer hours than the window, a
      table with no record in them stays not measured, since it may have
      received data earlier in the window; set ingestion_window_days × 24 to
      measure every such table. A value of 0 or less leaves the search off, and
      so does one that isn't a whole number, with a warning. For a few days
      after a table is created on, or switched to, the Auxiliary plan, a search
      spanning the date its lake data starts may be partial; such a table is
      searched again in two parts, before and from that date, at the cost of one
      more search over the window.

  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Log Analytics workspace is listed under excluded
      with the pattern and left out of every count, workspaces_without_sentinel
      included; its data connectors, connector definitions, tables, ingestion
      and health are not read. An excluded workspace gets no reads, not even its Sentinel onboarding state;
      a SENTINEL_WORKSPACES filter applies first, and a workspace it names that a
      pattern takes out fails the run as bad_config. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every resource is in scope.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-MLA-OSM      # Operating SIEM capability — which sources actually feed the SIEM
  - KSI-MLA-LET      # Logging event types — the event sources being collected

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-DATA-SOURCES
  name: Azure Sentinel Data Sources
  instructions: |
    Script: azure/sentinel_data_sources/fetcher.py

    Access: Microsoft Sentinel Reader and Log Analytics Reader.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - GET Microsoft.OperationalInsights/workspaces and onboardingStates (per workspace) — finds the Sentinel workspaces
    - GET Microsoft.SecurityInsights/dataConnectors (stable and preview APIs) — connections and their states, and the connector definitions installed from Content Hub
    - GET Microsoft.SecurityInsights/dataConnectorDefinitions — codeless connector definitions
    - GET Microsoft.OperationalInsights/workspaces/tables — each table's plan, since the query API can't read tables on the Basic or Auxiliary plan
    - KQL union * summarized by table — each table's last ingestion time and record count
    - KQL through the /search endpoint, one Basic or Auxiliary table at a time, only when basic_logs_lookback_hours is above 0 — the table's last ingestion time and record count over that many hours, the only way to read these tables. Off by default because Log Analytics bills these searches per GB scanned, so the query asks for nothing else, and a connector query filtering a Basic or Auxiliary table that received data isn't run. When Log Analytics warns that the window spans the date the table's Auxiliary (lake) data starts, which it does for a time after the table is created on or switched to that plan, the table is searched again in two parts cut exactly at that date, and the two answers are combined (newest record time, summed count). If a part still warns, the first answer's newest record time stands, its count is unknown, and a table with nothing found isn't measured. Any other error fails the search, and a failed search fails the run
    - KQL on SecurityAlert by product — which alert products feed the workspace
    - KQL union of each connector data type's lastDataReceivedQuery, with any that starts with let run on its own — last data received per connector data type, as the Sentinel portal measures it
    - KQL on SentinelHealth, Data fetch status change events only — each connector's latest health status, Success or Failure, which the hourly Informational failure summary written after polling errors can't hide (only when health monitoring sends data)

    Output: azure_sentinel_data_sources_<subscription>.json — for each Sentinel workspace, its connectors with when each last received data and whether it sends only alerts, every table with its plan, when it last received data and, when its search was split, the date its lake data starts, the Basic and Auxiliary tables read through /search (tables_searched), those whose search failed (tables_search_failed), and those not measured (tables_not_measured). Workspaces the resource_exclusions patterns take out are listed under excluded instead, each with the pattern that matched.

    Summary fields:

    Which workspaces were checked?
    - workspaces_collected — Number of Sentinel workspaces read
    - workspaces_without_sentinel — Number of workspaces skipped because Sentinel isn't turned on

    Which workspaces are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every workspace is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no workspace, such as a mistyped name
    - excluded_workspaces — Number of workspaces left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern and isn't read, and no other count includes them; null if the workspace list couldn't be read
    - in_scope_workspaces — Number of workspaces found and in scope, Sentinel or not; 0 means none was found or the patterns took out every workspace, which a check can catch by requiring more than 0; null if the workspace list couldn't be read

    Is Sentinel receiving data from enough sources?
    - basic_logs_lookback_hours — Number of hours over which each Basic and Auxiliary plan table is searched: the basic_logs_lookback_hours setting, capped at the ingestion window and at 720; 0, the default, means the search is off, so no Basic or Auxiliary table counts as a source
    - min_sources_ingesting — Number of data sources sending data to the Sentinel workspace with the fewest, in the window (default 14 days); null if no Sentinel workspace's source count is known. A source is a table that received data, other than workspace and Sentinel telemetry (Usage, Operation, LAQueryLogs, SentinelHealth, SentinelAudit, SecurityIncident, watchlists, UEBA tables and Heartbeat), or a product other than Sentinel sending alerts to SecurityAlert. A table on the Basic or Auxiliary plan counts only when basic_logs_lookback_hours is above 0 and its search found data. With the search on, a workspace whose table plans couldn't be read, or with a Basic or Auxiliary table whose search failed, has an unknown count and is left out
    - workspaces_with_2plus_sources — Number of Sentinel workspaces receiving data from at least two sources; a Sentinel workspace whose source count is unknown (its ingestion couldn't be read or, with the search on, its table plans couldn't be read or a search failed) is left out
    - workspaces_with_no_sources — Number of Sentinel workspaces receiving data from no source; a Sentinel workspace whose source count is unknown (its ingestion couldn't be read or, with the search on, its table plans couldn't be read or a search failed) is left out
    - data_connectors_total — Number of configured data connections across all Sentinel workspaces, including kinds only the preview API lists, such as Defender XDR; null if no workspace's connections could all be listed

    Is each connector actually delivering data?
    - connectors_connected — Number of connectors, across all Sentinel workspaces, that are connected. A connector is every connector definition installed in the workspace plus each built-in connection kind with no installed definition; it is connected when at least one of its data types received data in the window, measured with the definition's own last-data query. Null if no workspace's connectors could all be listed and measured
    - connectors_not_connected — Number of connectors, across all Sentinel workspaces, none of whose data types received data in the window. This includes an alert-only connector with no linked connection sending alerts (never connected, or its alerts turned off); a quiet one is counted under connectors_quiet instead. Connectors whose data couldn't be measured (a table on the Basic or Auxiliary plan that wasn't searched or whose search failed, or a filtered query on one that received data), or that define no data types, aren't counted. Null if no workspace's connectors could all be listed and measured
    - connectors_quiet — Number of alert-only connectors, across all Sentinel workspaces, that received no alert in the window although a linked connection (their own, or Defender XDR's for the products whose alerts it carries, which leaves out Defender for Cloud and Defender for IoT) has alerts enabled, which is normal for them. A quiet connector still reads connected: false. A connector is alert-only when all its data types are SecurityAlert queries: Defender for Endpoint, Defender for Office 365, Defender for Identity, Defender for Cloud, Defender for Cloud Apps (whose Cloud Discovery logs count only when its connection turns them on), Defender for IoT, Entra ID Protection and Insider Risk Management. Null if no workspace's connectors could all be listed and measured
    - connectors_configured_without_data — Number of connectors, across all Sentinel workspaces, that have at least one connection (their own, or a linked one such as Defender XDR) but none of whose data types received data in the window, not counting quiet ones. An alert-only connector whose connection has alerts turned off is counted; a connector installed from Content Hub with no connection, which connectors_not_connected counts, isn't. Connectors whose data couldn't be measured, or that define no data types, aren't counted. Null if any workspace's connectors couldn't all be listed and measured
    - workspaces_with_health_monitoring — Number of Sentinel workspaces where Sentinel health monitoring sent data to the SentinelHealth table in the window
    - connectors_unhealthy — Number of data connections, across all Sentinel workspaces, whose latest SentinelHealth Data fetch status change is Failure or Warning; null if no workspace's SentinelHealth data could be read
