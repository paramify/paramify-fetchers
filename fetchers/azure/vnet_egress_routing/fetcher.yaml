name: azure_vnet_egress_routing
version: 0.3.1
description: >-
  Shows where each subnet's and network interface's Internet-bound traffic goes: through a firewall or appliance, a gateway, a NAT gateway, a black hole or Azure's default outbound access.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_vnet_egress_routing.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

config_schema:
  virtual_hub_search_max_subscriptions:
    type: integer
    required: false
    default: 50
    env: VIRTUAL_HUB_SEARCH_MAX_SUBSCRIPTIONS
    description: >
      How many other subscriptions to search for the Virtual WAN hub of a spoke whose
      hub is not in this subscription. Only used when such a spoke exists.
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching virtual network, subnet, route table, network
      interface, Azure Firewall or Virtual WAN hub is listed under excluded with
      the pattern and left out of every count and verdict; a subnet leaves with its
      virtual network, and a network interface with its subnet. Egress paths and
      appliance owners are still worked out against every record, so an in-scope
      subnet routed through an excluded firewall, route table or hub keeps its
      egress path. A firewall's routed_workload_subnets, a route table's
      associated and a virtual network's subnet_count count only in-scope
      subnets; a route table's subnet_ids still lists every subnet it is attached
      to. Peerings are still read for every virtual network, excluded ones too,
      so a failed read on one still fails the run. A pattern without one of these
      prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-RNT   # every subnet's Internet egress path, and what bypasses the appliance
  - KSI-CNA-ULN   # forced tunnelling through an Azure Firewall or appliance via route tables
  - KSI-CNA-DFP   # route tables and default-outbound settings define what traffic may leave

evidence_set:
  reference_id: EVD-AZURE-VNET-EGRESS
  name: Azure VNet Egress Routing
  instructions: |
    Script: azure/vnet_egress_routing/fetcher.py

    Access: Reader on the subscription. Optional: Reader on the other subscriptions a Virtual WAN hub may sit in; without it, spokes whose hub is there read virtual_hub_unresolved. Reader does not grant effective route table reads, so the evidence is the configured routing, not the effective routes, and gateway-learned BGP routes are not visible.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set, and lists other subscriptions to search for a spoke's Virtual WAN hub (at most 50, in the order listed)
    - providers.get("Microsoft.Network") — tells "networking not in use" from "nothing there"
    - virtual_networks.list_all() — every virtual network with its subnets, route table links, NAT gateway, default outbound setting and service endpoints
    - virtual_network_peerings.list() (per virtual network) — the peerings, to find peers' address ranges and hub spokes
    - route_tables.list_all() — every route table with its routes
    - network_interfaces.list_all() — every network interface, with IP forwarding and public IPs
    - azure_firewalls.list_all() — every Azure Firewall with its tier, threat-intelligence mode and policy
    - firewall_policies.list_all() — the policies, to resolve each firewall's effective threat-intelligence mode
    - virtual_hubs.list() — every Virtual WAN hub in the subscription
    - routing_intent.list() (per hub) — the hub's Internet routing-intent policy
    - hub_virtual_network_connections.list() (per hub) — the spokes connected and whether they propagate the default route
    - hub_route_tables.list() (per hub) — the hub route table's 0.0.0.0/0 route when there is no routing intent

    Output: azure_vnet_egress_routing_<subscription>.json — each subnet with its egress path, default route, bypass routes and unrouted prefixes, each network interface's path, the route tables, firewalls and hubs, plus the resources left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no virtual network, subnet, route table, network interface, Azure Firewall or Virtual WAN hub, such as a mistyped name; null when a list could not be read
    - excluded_virtual_networks — Number of virtual networks left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes it
    - excluded_subnets — Number of subnets left out of scope the same way, which takes every subnet of an excluded virtual network
    - excluded_route_tables — Number of route tables left out of scope the same way
    - excluded_network_interfaces — Number of network interfaces left out of scope the same way, or because a pattern matched one of their subnets; each names that subnet in matched_id
    - excluded_azure_firewalls — Number of Azure Firewalls left out of scope the same way
    - excluded_virtual_hubs — Number of Virtual WAN hubs left out of scope the same way
    - in_scope_virtual_networks — Number of virtual networks read and in scope; 0 means none was read or the patterns took out every one
    - in_scope_subnets — Number of subnets read and in scope, platform subnets included
    - in_scope_route_tables — Number of route tables read and in scope
    - in_scope_network_interfaces — Number of network interfaces read and in scope
    - in_scope_azure_firewalls — Number of Azure Firewalls read and in scope
    - in_scope_virtual_hubs — Number of Virtual WAN hubs read and in scope, from this subscription or found for one of its spokes
    - provider_registration_status — Whether the networking provider (Microsoft.Network) is registered on the subscription: registered, not_registered or unknown

    Which subnets were checked?
    - total_virtual_networks — Number of in-scope virtual networks
    - total_subnets — Number of in-scope subnets
    - workload_subnets — Number of in-scope subnets other than the platform subnets
    - platform_subnets — Number of in-scope subnets named GatewaySubnet, AzureBastionSubnet, AzureFirewallSubnet, AzureFirewallManagementSubnet or RouteServerSubnet, whose routing Azure sets; every count below is about workload subnets unless it says otherwise

    Where does each subnet's Internet traffic go?
    - workload_subnets_by_egress_path — Number of workload subnets for each egress path, worked out from the route table for IPv4; a default route is a user-defined 0.0.0.0/0 route or routes of one next-hop kind that together cover it, such as 0.0.0.0/1 and 128.0.0.0/1:
      - appliance (default route to a virtual appliance, or through a Virtual WAN hub that propagates its default route)
      - blackhole (default route to None, so Internet traffic is dropped)
      - gateway (default route to a virtual network gateway)
      - nat_gateway (no default route, or one to Internet, and a NAT gateway on the subnet or the network's default public NAT gateway)
      - default_outbound (no default route and default outbound access is on or unset, so Azure's implicit public IP is used)
      - none (no default route and default outbound access is off, so there is no outbound path)
      - other (default route to any other non-Internet next hop)
      - virtual_hub_unresolved (the spoke's hub was not found, so the hub's default route cannot be ruled in or out)
    - workload_subnets_default_outbound_effective — Number of workload subnets with default outbound access on; an unset value counts as on
    - workload_subnets_appliance_with_default_outbound_fallback — Number of workload subnets routed to an appliance that also have default outbound access on
    - workload_subnets_with_internet_bypass_routes — Number of workload subnets whose path is appliance, blackhole, gateway or other and that have a route with next hop Internet (a CIDR or a service tag such as AzureCloud), so that traffic skips the appliance; on a private subnet with no explicit outbound method such routes fail rather than leave
    - workload_subnets_with_service_endpoints — Number of workload subnets with service endpoints, whose system routes no route table can override
    - workload_subnets_with_unrouted_internal_prefixes — Number of workload subnets whose own network's address ranges the route table does not send to an appliance, which Azure's more specific system routes then send directly
    - workload_subnets_with_unrouted_peered_prefixes — Number of workload subnets with the same gap for the address ranges of the Connected peer networks

    Who owns the appliance?
    - workload_subnets_appliance_azure_firewall — Number of workload subnets whose appliance next hop is an Azure Firewall
    - workload_subnets_appliance_not_in_subscription — Number of workload subnets whose appliance next hop IP nothing here holds, such as another subscription or a load balancer frontend
    - workload_subnets_via_virtual_hub — Number of workload subnets whose default route comes from a Virtual WAN hub; it applies only while the subnet's route table allows gateway route propagation and no user-defined 0.0.0.0/0 beats it
    - total_virtual_hubs — Number of in-scope Virtual WAN hubs, including those found in other subscriptions for this subscription's spokes
    - virtual_hub_spokes — Number of in-scope virtual networks recognised as hub spokes from their peering to a Microsoft-managed HV_<hub>_<guid> network
    - virtual_hub_spokes_unresolved — Number of hub spokes whose hub was found in no readable subscription

    Do the route tables and firewalls enforce the path?
    - total_route_tables — Number of in-scope route tables
    - unassociated_route_tables — Number of in-scope route tables that no in-scope subnet uses
    - total_azure_firewalls — Number of in-scope Azure Firewalls
    - azure_firewalls_by_effective_threat_intel_mode — Number of Azure Firewalls for each effective threat-intelligence mode, which is the strictest mode along the firewall's policy and its base policies when it has a policy, else its own mode; a firewall whose policy is in another subscription has none unless a policy read already says Deny, and is counted under none of these:
      - Deny (blocks traffic to and from known malicious addresses)
      - Alert (logs it but lets it through)
      - Off (no threat intelligence filtering)
    - azure_firewalls_with_no_routed_subnet — Number of in-scope Azure Firewalls that no in-scope workload subnet's default route resolves to

    Where does each network interface's traffic go?
    - total_network_interfaces — Number of in-scope network interfaces
    - network_interfaces_by_egress_path — Number of network interfaces for each egress path, which is the subnet's path except that an interface with a public IP on a default_outbound or none subnet is public_ip, and mixed covers an interface in subnets with different paths:
      - appliance (as for subnets)
      - blackhole (as for subnets)
      - gateway (as for subnets)
      - nat_gateway (as for subnets)
      - default_outbound (as for subnets)
      - none (as for subnets)
      - other (as for subnets)
      - virtual_hub_unresolved (as for subnets)
      - platform_managed (in a platform subnet)
      - public_ip (its own public IP, on a default_outbound or none subnet)
      - mixed (its subnets have different paths)
    - network_interfaces_default_outbound_connectivity_enabled — Number of network interfaces whose default outbound connectivity flag is true
