name: azure_policy_compliance
version: 0.3.0
description: >
  Reads what Azure Policy found on the subscription: the service's counts of
  non-compliant resources and policies, overall and per assignment, and a bounded
  list of non-compliant (resource, policy) records with the expressions Azure
  evaluated; a resource whose read Azure refuses is marked not_authorized rather
  than failing the run. It also lists remediation tasks with their per-resource
  deployments, each checked against the resource's latest state, and counts from
  30 days of history which pairs were non-compliant throughout or only some of the
  time. A subscription that never registered Microsoft.PolicyInsights reports
  provider_registration_status: not_registered, which is valid evidence rather than
  a collection failure.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py
  # Hundreds of serial queries at the default limits, plus 429 backoff; a production
  # run took ~8 minutes.
  timeout: 3600

output:
  type: json
  path: azure_policy_compliance.json
  aggregation: per_target

config_schema:
  max_non_compliant_resources:
    type: integer
    required: false
    default: 1000
    env: AZURE_POLICY_MAX_NON_COMPLIANT
    description: >
      How many non-compliant (resource, policy) records to itemize. The summary
      counts are complete regardless; this bounds only the list, and
      non_compliant_states_truncated says when it was reached. 0 skips the list.
      With resource_exclusions set, excluded states don't count toward it, and the
      non-compliant counts are recounted from this list, so they are null when it
      is truncated or skipped.
  max_evaluation_detail_resources:
    type: integer
    required: false
    default: 100
    env: AZURE_POLICY_MAX_EVALUATION_DETAIL_RESOURCES
    description: >
      How many of the listed non-compliant resources to read evaluation details
      for, one query each (the service refuses them at subscription scope); the
      resources with the most listed states go first. evaluation_details_truncated
      says when there were more. 0 skips them. A refused read (403 or
      AuthorizationFailed) is retried once, at most 3 times a run and not after a
      retry is refused again; still refused, it marks that resource's states
      not_authorized and does not fail the run. Any other error does.
  max_recurrence_pairs:
    type: integer
    required: false
    default: 100
    env: AZURE_POLICY_MAX_RECURRENCE_PAIRS
    description: >
      How many intermittently non-compliant (resource, policy) pairs to read the
      30-day history of, one query each, to count their separate non-compliant
      episodes. The pair counts are complete regardless; recurrence_pairs_truncated
      says when there were more. 0 reads none.
  max_remediation_deployments:
    type: integer
    required: false
    default: 1000
    env: AZURE_POLICY_MAX_REMEDIATION_DEPLOYMENTS
    description: >
      How many remediation deployments to itemize across all remediation tasks;
      remediation_deployments_truncated says when there were more. 0 skips them.
      Deployments the resource_exclusions patterns take out don't count toward it.
      With patterns set, remediation_failed_deployments and
      remediation_successful_deployments are counted from this list, so they are
      null when it is truncated or skipped.
      Azure deletes a task 60 days after its last change, so older ones are gone.
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a record with no region
      never matches one) or id:<resource id> (also matches that resource's child
      resources). * matches any run of characters and ? one character. A
      non-compliant state or remediation deployment follows the resource it is
      about, matched by that resource's id, group and region; a policy assignment
      or remediation task follows the scope it was made at, so one made at the
      subscription or a management group stays. Each match is listed under
      excluded with the pattern and left out of every itemized count; an excluded
      state is not read for evaluation details, an excluded task is not read for
      its deployments, and an excluded deployment's resource is not read for its
      latest state. 30-day history pairs follow their resource too, by its id,
      group and region, and are dropped before recurrence is read. The service's
      counts cannot be split by resource, so with patterns set the non-compliant
      side (the non-compliant resource and policy counts, their by-state entries,
      each assignment's non-compliant counts, is_compliant and failing members) is
      recounted from the in-scope listed states, and the failed and successful
      deployment totals from the in-scope listed deployments; each is null when its
      list is truncated. The compliant side (compliant_resources,
      resources_evaluated, the percentages and the other by-state entries) and
      remediation_tasks_by_provisioning_state still come from the service and
      include excluded resources. A pattern without one of these prefixes
      fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Can be ${env:VAR}. Empty: every resource is in scope.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-ACM      # configuration is continuously checked against the assigned policy baseline
  - KSI-CNA-EIS      # drift from intended state, per resource, and the remediation tasks that correct it
  - KSI-MLA-EVC      # the evaluation results themselves
  - KSI-SVC-EIS      # remediation deployments that took, and non-compliance that keeps coming back

evidence_set:
  reference_id: EVD-AZURE-POLICY-COMPLIANCE
  name: Azure Policy Compliance State
  instructions: >
    Script: azure/policy_compliance/fetcher.py. Azure SDK calls (azure-mgmt-policyinsights
    PolicyInsightsClient): resource.providers.get("Microsoft.PolicyInsights"), then
    policy_states.summarize_for_subscription("latest", <subscription_id>),
    policy_states.list_query_results_for_subscription("latest", <subscription_id>,
    query_options=QueryOptions(filter="complianceState eq 'NonCompliant'", top=N+1);
    no top when resource_exclusions is set, the limit then counting in-scope states only),
    per listed resource policy_states.list_query_results_for_resource("latest",
    <resource_id>, query_options=QueryOptions(filter="ComplianceState eq
    'NonCompliant'", expand="PolicyEvaluationDetails")),
    policy_states.list_query_results_for_subscription("default", ...) over the last 30
    days grouped per (resource, region, policy, compliance state) and a count of those groups,
    and per intermittent pair the same query filtered to that pair and ordered by
    time, remediations.list_for_subscription(), and per task
    remediations.list_deployments_at_subscription / _at_resource_group /
    _at_management_group / _at_resource, then latest-state queries (resource, state,
    time) for the task's policy, filtered to its remediated resources 20 at a time.
    Reader on the subscription. A per-resource details read refused with a 403 or an
    AuthorizationFailed error code is retried once (at most 3 retries a run), then
    marks that resource's states not_authorized instead of failing the run.
    Assignments, non-compliant states, remediation tasks and remediation
    deployments the resource_exclusions patterns take out are listed under
    results.excluded instead (a state's or deployment's entry carries its
    resource's id); the summary gives resource_exclusion_patterns (the configured
    patterns, empty when none are set), resource_exclusion_patterns_unmatched
    (patterns that matched nothing, such as a mistyped name),
    excluded_policy_assignments, excluded_policy_states, excluded_remediation_tasks
    and excluded_remediation_deployments (how many the patterns took out; no
    itemized count includes them), and in_scope_policy_assignments,
    in_scope_policy_states, in_scope_remediation_tasks and
    in_scope_remediation_deployments (how many stayed). With patterns set,
    non_compliant_resources (distinct resources), non_compliant_policies (distinct
    assignment and policy pairs), the NonCompliant entries of
    resources_by_compliance_state and policies_by_compliance_state,
    non_compliant_assignments, compliant_assignments, the same figures in
    results.subscription_compliance and results.assignment_compliance, and
    remediation_failed_deployments and remediation_successful_deployments are
    recounted over the in-scope itemized records, and are null when the list they
    come from is truncated or skipped. A failing member the service did not list
    takes the effect its evaluation ran under. service_counts_include_excluded_resources
    is true when any pattern is set: compliant_resources, resources_evaluated,
    resource_compliance_percentage, each assignment's compliant_resources and
    compliance_percentage, the other by-state entries, policy_group_details and
    remediation_tasks_by_provisioning_state are still the service's and include
    excluded resources. Without patterns every count is the service's own.
