name: azure_policy_compliance
version: 0.2.0
description: >
  Azure Policy compliance state on the subscription — the result of evaluating the
  assigned policies, not the assignments themselves. The service's own
  subscription-wide counts of non-compliant resources and policies, the same per
  policy assignment with its non-compliant member policies itemized, a bounded list
  of the non-compliant (resource, policy) records, and every policy remediation task
  with its deployment counts. Reads the latest policy states over the service's
  default evaluation window, which is recorded. For the listed non-compliant states,
  the expressions Azure Policy evaluated (field path, operator, actual and target
  value), read per resource for a bounded number of resources. Each remediation
  task's per-resource deployments (status, error, times), checked against the
  resource's latest compliance state. And, from 30 days of history, how many
  (resource, policy) pairs were non-compliant throughout or only some of the time,
  with the separate non-compliant episodes counted for a bounded number of the
  intermittent ones. Every bounded list says when it was cut short. A subscription
  that never registered Microsoft.PolicyInsights reports
  provider_registration_status: not_registered, which is valid evidence rather than
  a collection failure.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_policy_compliance.json
  aggregation: per_target

config_schema:
  max_non_compliant_resources:
    type: integer
    required: false
    default: 1000
    env: AZURE_POLICY_MAX_NON_COMPLIANT
    description: >
      How many non-compliant (resource, policy) records to itemize. The summary
      counts are complete regardless; this bounds only the list, and
      non_compliant_states_truncated says when it was reached. 0 skips the list.
  max_evaluation_detail_resources:
    type: integer
    required: false
    default: 100
    env: AZURE_POLICY_MAX_EVALUATION_DETAIL_RESOURCES
    description: >
      How many of the listed non-compliant resources to read evaluation details
      for, one query each (the service refuses them at subscription scope); the
      resources with the most listed states go first. evaluation_details_truncated
      says when there were more. 0 skips them.
  max_recurrence_pairs:
    type: integer
    required: false
    default: 100
    env: AZURE_POLICY_MAX_RECURRENCE_PAIRS
    description: >
      How many intermittently non-compliant (resource, policy) pairs to read the
      30-day history of, one query each, to count their separate non-compliant
      episodes. The pair counts are complete regardless; recurrence_pairs_truncated
      says when there were more. 0 reads none.
  max_remediation_deployments:
    type: integer
    required: false
    default: 1000
    env: AZURE_POLICY_MAX_REMEDIATION_DEPLOYMENTS
    description: >
      How many remediation deployments to itemize across all remediation tasks;
      remediation_deployments_truncated says when there were more. 0 skips them.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-ACM      # configuration is continuously checked against the assigned policy baseline
  - KSI-CNA-EIS      # drift from intended state, per resource, and the remediation tasks that correct it
  - KSI-MLA-EVC      # the evaluation results themselves
  - KSI-SVC-EIS      # remediation deployments that took, and non-compliance that keeps coming back

evidence_set:
  reference_id: EVD-AZURE-POLICY-COMPLIANCE
  name: Azure Policy Compliance State
  instructions: >
    Script: fetcher.py. Azure SDK calls (azure-mgmt-policyinsights
    PolicyInsightsClient): resource.providers.get("Microsoft.PolicyInsights"), then
    policy_states.summarize_for_subscription("latest", <subscription_id>),
    policy_states.list_query_results_for_subscription("latest", <subscription_id>,
    query_options=QueryOptions(filter="complianceState eq 'NonCompliant'", top=N+1)),
    per listed resource policy_states.list_query_results_for_resource("latest",
    <resource_id>, query_options=QueryOptions(expand="PolicyEvaluationDetails")),
    policy_states.list_query_results_for_subscription("default", ...) over the last 30
    days grouped per (resource, policy, compliance state), and per intermittent pair
    the same query filtered to that pair and ordered by time,
    remediations.list_for_subscription(), and per task
    remediations.list_deployments_at_subscription / _at_resource_group / _at_resource
    with one grouped latest-state query for the task's policy. Reader on the
    subscription.
