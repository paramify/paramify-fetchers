name: azure_vm_hardening_status
version: 0.3.1
description: >
  For every virtual machine and virtual machine scale set in the subscription,
  reports the hardening configuration: Trusted Launch (security type plus the UEFI
  secure-boot and vTPM settings) and encryption at host, managed vs unmanaged
  (page-blob) OS and data disks, whether Linux VMs enforce SSH-key authentication
  (disable_password_authentication), the source image the VM was built from
  (marketplace publisher/offer/sku or gallery image id), the guest extensions
  installed on it, each scale set's load balancer backend pools and instance
  ids, and the OS patch settings of every VM and scale set: patch mode
  (AutomaticByPlatform, AutomaticByOS, Manual or ImageDefault), assessment mode,
  and whether platform safety checks are bypassed on a user schedule, read as
  automatic_patching (AutomaticByPlatform, where Azure orchestrates updates, or
  AutomaticByOS, where Windows Update installs them in the guest; patch_modes
  tells the two apart) and assessment_automatic. A VM whose OS returns no
  patch settings reads null (unknown), never Manual, and the summary counts
  unknown apart. Scale-set members are cross-referenced to their scale set.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope,
      as case-insensitive glob patterns listed in the manifest, each with
      a prefix: rg:<resource group> (read from the resource id),
      location:<region> (the region's name without spaces, such as
      eastus2; a resource with no location never matches one) or
      id:<resource id> (also matches that resource's child resources). *
      matches any run of characters and ? one character. A matching
      virtual machine or virtual machine scale set is listed under
      excluded with the pattern and left out of every count and verdict;
      it gets no extension or instance reads. A virtual machine also
      leaves with its scale set (reason scale_set_matched, with
      matched_id), wherever its own id and group are. A pattern without one of
      these prefixes fails the run. Set it once under
      platforms.azure.config for every Azure fetcher that has this field;
      fetchers without it ignore it. Each item is a pattern, or a pattern with a reason. Empty: every resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_vm_hardening_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-MAT   # minimal attack surface — the hardening posture overall
  - KSI-SVC-VRI   # Trusted Launch: UEFI secure boot + vTPM are cryptographic integrity validation
  - KSI-IAM-APM   # disable_password_authentication — Linux VMs enforcing SSH-key-only auth
  - KSI-SVC-SIN   # encryption at host

evidence_set:
  reference_id: EVD-AZURE-VM-HARDENING
  name: Azure Virtual Machine Hardening
  instructions: >
    Script: azure/vm_hardening_status/fetcher.py. Azure SDK calls: azure-mgmt-compute
    ComputeManagementClient.virtual_machines.list_all(),
    virtual_machine_extensions.list(resource_group, vm_name) per VM,
    virtual_machine_scale_sets.list_all(), and
    virtual_machine_scale_set_vms.list(resource_group, scale_set_name) per scale set;
    preceded by ResourceManagementClient.providers.get("Microsoft.Compute").
    Virtual machines and scale sets the resource_exclusions patterns take out are listed under
    results.excluded instead, each with the pattern that matched; the summary gives
    resource_exclusion_patterns (the configured patterns, empty when none are set),
    resource_exclusion_patterns_unmatched (patterns that matched no virtual machine or scale
    set, such as a mistyped name, or null when the virtual machine or scale set list could not be read), excluded_virtual_machines and excluded_scale_sets (how many
    the patterns took out, null if the list couldn't be read; no other count includes them) and in_scope_virtual_machines and
    in_scope_scale_sets (how many stayed; null if the list couldn't be read, and 0 means there are none or the patterns took out every
    one).
