name: azure_vm_hardening_status
version: 0.1.0
description: >
  For every virtual machine and virtual machine scale set in the subscription,
  reports the hardening configuration: Trusted Launch (security type plus the UEFI
  secure-boot and vTPM settings) and encryption at host, managed vs unmanaged
  (page-blob) OS and data disks, whether Linux VMs enforce SSH-key authentication
  (disable_password_authentication), the source image the VM was built from
  (marketplace publisher/offer/sku or gallery image id), the guest extensions
  installed on it, and each scale set's load balancer backend pools and instance
  ids. Scale-set members are cross-referenced to their scale set.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_vm_hardening_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-MAT   # minimal attack surface — the hardening posture overall
  - KSI-SVC-VRI   # Trusted Launch: UEFI secure boot + vTPM are cryptographic integrity validation
  - KSI-IAM-APM   # disable_password_authentication — Linux VMs enforcing SSH-key-only auth
  - KSI-SVC-SIN   # encryption at host

evidence_set:
  reference_id: EVD-AZURE-VM-HARDENING
  name: Azure Virtual Machine Hardening
  instructions: >
    Script: azure/vm_hardening_status/fetcher.py. Azure SDK calls: azure-mgmt-compute
    ComputeManagementClient.virtual_machines.list_all(),
    virtual_machine_extensions.list(resource_group, vm_name) per VM,
    virtual_machine_scale_sets.list_all(), and
    virtual_machine_scale_set_vms.list(resource_group, scale_set_name) per scale set;
    preceded by ResourceManagementClient.providers.get("Microsoft.Compute").
