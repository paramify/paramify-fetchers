name: azure_log_storage_immutability
version: 0.2.1
description: >-
  Shows whether the storage containers holding Azure Monitor logs are protected from change or deletion by a locked retention policy or a legal hold.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_log_storage_immutability.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching storage account is listed under excluded with the pattern and
      left out of every count; its containers and blob service are not read. An
      id: pattern naming a log container (the account's id, then
      /blobServices/default/containers/<name>) takes just that container out of
      an in-scope account, and an account left with no in-scope log container is
      not listed. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every resource is in scope.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-MLA-OSM      # Operating SIEM capability — tamper-resistant log storage

evidence_set:
  reference_id: EVD-AZURE-LOG-STORAGE-IMMUTABILITY
  name: Azure Log Storage Immutability
  instructions: |
    Script: azure/log_storage_immutability/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - GET /subscriptions — picks a subscription when none is set
    - GET Microsoft.Storage/storageAccounts — every storage account in the subscription
    - GET <account>/blobServices/default/containers (per account, except FileStorage accounts) — Azure Monitor log containers (names starting insights-logs-, insights-activity-logs, insights-metrics- or am-) and their immutability policies and legal holds
    - GET <account>/blobServices/default (per account with log containers) — blob soft delete and versioning

    Output: azure_log_storage_immutability_<subscription>.json — each storage account holding logs with its soft-delete window, versioning and default immutability policy, and each log container's policy state, retention, legal hold and version-level immutability, plus the resources left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no storage account or log container, such as a mistyped name; null when the storage account list could not be read
    - excluded_storage_accounts — Number of storage accounts left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and its containers and blob service are not read; null when the storage account list could not be read
    - excluded_containers — Number of log containers left out of scope because a pattern matched their resource group, id (an id: pattern naming the container takes just that container out of an in-scope account) or their account's region; each is listed under excluded with the pattern; null when the storage account list could not be read
    - in_scope_storage_accounts — Number of storage accounts read and in scope; 0 means none was found or the patterns took out every account, which a check can catch by requiring more than 0; null when the storage account list could not be read
    - in_scope_containers — Number of in-scope Azure Monitor log containers found; null when the storage account list could not be read

    Which log storage was checked?
    - storage_accounts_scanned — Number of in-scope storage accounts checked
    - accounts_with_log_containers — Number of in-scope storage accounts with at least one in-scope Azure Monitor log container
    - log_containers — Number of in-scope Azure Monitor log containers found

    Can stored logs be changed or deleted?
    - locked_policy — Number of log containers with a locked time-based retention policy, their own or the account's default, which nobody can shorten or remove
    - unlocked_policy_only — Number of log containers with an unlocked retention policy and no legal hold, which an admin can still shorten or remove
    - legal_hold — Number of log containers under a legal hold
    - unprotected — Number of log containers with neither a locked retention policy nor a legal hold, a container with only an unlocked policy included
    - min_retention_days — Shortest retention period, in days, among log containers that have a retention policy, locked or not; null when none has one
