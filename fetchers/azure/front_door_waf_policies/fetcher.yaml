name: azure_front_door_waf_policies
version: 0.2.1
description: >-
  Shows each Front Door Standard and Premium WAF policy's mode and managed rules, whether it blocks attacks and why not, and whether a Front Door security policy uses it.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Standard or Premium WAF policy is listed under
      excluded with the pattern and left out of every count and verdict. A WAF
      policy is global, so location: matches one only as location:global. A
      policy still reads associated when the Front Door profile its security
      policy belongs to is excluded, and classic policies are counted in
      skipped_policies_by_sku whatever the patterns. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_front_door_waf_policies.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-RVP   # WAF mode, managed rule sets and rate-limit rules: protection against DoS and unwanted activity
  - KSI-CNA-RNT   # the policy that limits what traffic reaches the system through Front Door
  - KSI-CNA-MAT   # disabled rules, exclusions and exceptions show what the WAF lets through

evidence_set:
  reference_id: EVD-AZURE-FRONTDOOR-WAF
  name: Azure Front Door WAF Policies
  instructions: |
    Script: azure/front_door_waf_policies/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Network") — notes an unregistered provider
    - policies.list_by_subscription() — every Front Door WAF policy with its settings, managed rule sets, overrides, exclusions, custom rules and security policy links; classic Front Door policies are counted by SKU and not assessed
    - managed_rule_sets.list() — Microsoft's managed rule set definitions, to work out which rules are on and the newest version of each

    Output: azure_front_door_waf_policies_<subscription>.json — each Standard or Premium WAF policy with its mode, managed rule sets, the rules switched off or set to log or allow, its custom rules, whether it blocks attacks and why not, and whether a Front Door security policy uses it, plus the policies left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no Standard or Premium WAF policy, such as a mistyped name; null when the WAF policy list could not be read
    - excluded_waf_policies — Number of WAF policies left out of scope because a pattern matched; each is listed under excluded with the pattern, and no other count includes it; a policy linked from an excluded profile's security policy still reads as associated; null when the WAF policy list could not be read
    - in_scope_waf_policies — Number of WAF policies read and in scope; 0 means there are none or the patterns took out every policy; null when the WAF policy list could not be read

    What was checked?
    - total_waf_policies — Number of in-scope Front Door Standard and Premium WAF policies
    - premium_waf_policies — Number of in-scope Front Door Premium WAF policies
    - standard_waf_policies — Number of in-scope Front Door Standard WAF policies
    - skipped_policies_by_sku — Number of other WAF policies skipped (classic Front Door), for each SKU Azure reports
    - provider_registration_status — Whether the networking provider (Microsoft.Network), which holds Front Door WAF policies, is registered on the subscription: registered, not_registered or unknown

    Is each WAF policy used by a Front Door?
    - associated_waf_policies — Number of WAF policies that at least one Front Door security policy references; which endpoints and domains it covers is evidenced by the Front Door WAF coverage fetcher
    - unassociated_waf_policies — Number of WAF policies that no Front Door security policy references

    Does each policy block attacks?
    - blocking_waf_policies — Number of WAF policies that block attacks: enabled (no state set counts as enabled), in Prevention mode, with a Default Rule Set (DefaultRuleSet or Microsoft_DefaultRuleSet) whose action is Block or Redirect (no action set counts as Block) and whose definition was found, where every rule group that blocks by default still has an enabled rule that blocks (action Block, Redirect or AnomalyScoring), and with no enabled custom rule that allows every request. Groups Microsoft ships with no rule blocking by default, such as the threat-intelligence groups, do not count against a policy while left off
    - waf_policies_not_blocking — Number of WAF policies that do not block attacks
    - associated_waf_policies_not_blocking — Number of associated WAF policies that do not block attacks

    Why does a policy not block attacks?
    - policies_disabled — Number of WAF policies that are turned off
    - policies_in_detection_mode — Number of WAF policies in Detection mode, which logs attacks but does not block them
    - policies_mode_unset — Number of WAF policies with no mode set, counted as not blocking because Azure documents no default mode
    - policies_without_default_rule_set — Number of WAF policies with no Default Rule Set
    - policies_default_rule_set_log_only — Number of WAF policies whose Default Rule Set action is neither Block nor Redirect, such as Log, so matches are logged and not blocked
    - policies_rule_groups_not_blocking — Number of WAF policies whose Default Rule Set has a rule group that blocks by default but no longer has an enabled blocking rule, because overrides switch the group or its rules off or set them to Log or Allow
    - policies_rule_definition_not_found — Number of WAF policies whose Default Rule Set type and version has no definition in Microsoft's list, so the rules that are on cannot be counted
    - policies_with_allow_all_custom_rule — Number of WAF policies with an enabled custom match rule that allows every request (every condition matches any request, or any address through 0.0.0.0/0 or ::/0); custom rules run before managed rules, so it lets every request past them

    How much of the managed rule set is switched off, and is it current?
    - total_disabled_managed_rules — Number of managed rules switched off one by one through a rule override (an override with no state counts as off), across all policies and rule sets; rules in a group switched off as a whole are not included
    - total_disabled_managed_rule_groups — Number of managed rule groups switched off as a whole (a group override that lists no rules), across all policies and rule sets
    - policies_with_fully_disabled_rule_groups — Number of WAF policies whose Default Rule Set has a rule group that blocks by default with no rule enabled now
    - associated_policies_with_fully_disabled_rule_groups — Number of associated WAF policies whose Default Rule Set has a rule group that blocks by default with no rule enabled now
    - policies_on_older_default_rule_set — Number of WAF policies whose Default Rule Set version is older than the newest version Microsoft publishes for that rule set type

    Do policies limit request rates?
    - waf_policies_with_rate_limit_rules — Number of WAF policies with at least one enabled rate-limit custom rule
