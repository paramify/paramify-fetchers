name: azure_change_provenance
version: 0.3.0
description: >
  Every control-plane change to the subscription's resources, resource groups and
  the subscription itself over the last 14 days (Azure Resource Graph change
  history), each attributed to an ARM deployment run by a pipeline or an
  application, to a deployment a person ran by hand or through the Portal's create
  wizards, to a change made by a named pipeline identity, or to a direct edit made
  outside any of them, such as from the portal or the CLI. Each change carries who
  made it, the client it came from, the change type and the properties it touched,
  and for direct edits and manual deployments each property's value before and
  after, for security settings and tags only, with anything that looks like a
  secret withheld.
  The summary gives the share of changes that were redeployments, a conservative
  share that counts changes with no recorded caller against it, and breaks the
  direct edits down by client, by caller and by resource type. This is evidence
  that changes are made by redeploying version-controlled templates rather than by
  modifying resources in place.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_change_provenance.json
  aggregation: per_target

config_schema:
  lookback_days:
    type: integer
    required: false
    default: 14
    env: AZURE_CHANGE_LOOKBACK_DAYS
    description: >
      How many days of change history to collect, from 1 to 14. Resource Graph keeps
      change history for 14 days, so a larger value is clamped to 14 with a warning.
      Schedule the fetcher at least every 14 days, or changes in between are never
      seen.

  pipeline_principals:
    type: string
    required: false
    env: AZURE_PIPELINE_PRINCIPALS
    description: >
      Comma-separated application (client) ids or UPNs of the identities your
      deployment pipelines run as. Changes those identities make are counted as
      redeployments (`origin: pipeline`) even when they don't go through an ARM
      deployment, which is how Terraform and other tools that call ARM directly
      apply changes, and ARM deployments they run count as redeployments even when
      the identity is a user. Leave empty and only ARM deployments run by an
      application count; deployments run by a person are `manual_deployment`.

  value_paths:
    type: patterns
    prefixes: [path]
    bare: false
    exclusion: false
    required: false
    env: AZURE_CHANGE_VALUE_PATHS
    description: >
      Property paths whose before and after values to keep, added to the built-in
      list of security settings and tags, listed in the manifest on this fetcher's
      entry (paramify manifest set-config; manifest exclude never edits this list)
      as path:<glob> patterns, such as path:properties.siteConfig.* (case
      insensitive; * matches any run of characters and ? one character; an array
      index such as [0] matches any index; path:* allows every path). Values are
      kept only for direct edits and manual deployments. A path or value that looks
      like a secret (a password, key, token, connection string, header, body, app
      setting or environment variable, or a value shaped like a key, password
      assignment, SAS signature, JWT or URL with credentials) is withheld whatever
      this lists. The check can't catch a short password with nothing marking it,
      such as one alone in a tag, or a secret in free-form content under generic
      names, so path:* shows whatever such content holds: it is your risk.
      A pattern without path: fails the run and keeps no values. Each item is a
      pattern, or a pattern with a reason. Empty: only the built-in list.

  max_value_changes:
    type: integer
    required: false
    default: 500
    env: AZURE_CHANGE_MAX_VALUE_CHANGES
    description: >
      How many direct and manual-deployment changes keep their property values,
      newest first. The older ones keep their property names only and are counted
      in changes_property_values_capped. 0 keeps no values. A value that isn't a
      whole number from 0 fails the run as bad_config and keeps no values.

  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A change to a matching resource or resource group is listed
      under excluded with the pattern and left out of every count and breakdown;
      changes to the subscription itself stay. A change carries no region, so
      only rg: and id: patterns reach it. Every change is still attributed
      against every other change and deployment first, so an in-scope change
      keeps an origin it took from an excluded one, and the deployment history
      (deployments_in_history, results.deployments) is still every deployment
      read. A pattern without one of these prefixes fails the run. Set it once
      under platforms.azure.config for every Azure fetcher that has this field;
      fetchers without it ignore it. Each item is a pattern, or a pattern with a
      reason. Empty: every resource is in scope.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CMT-RMV      # Redeploying vs modifying — changes made through deployments, not direct edits

evidence_set:
  reference_id: EVD-AZURE-CHANGE-PROVENANCE
  name: Azure Change Provenance
  instructions: >
    Script: azure/change_provenance/fetcher.py. Reader on the subscription is sufficient. Changes come from
    two Azure Resource Graph queries (azure-mgmt-resourcegraph
    ResourceGraphClient.resources, subscriptions=[<subscription_id>], paged with
    $skipToken to the end, failing the run if Resource Graph returns fewer rows than
    it counted or reports the result truncated). The `resourcechanges` table covers
    resources and `resourcecontainerchanges` covers resource groups and the
    subscription. Both are filtered to the last `lookback_days` days and projected
    from properties: targetResourceId, targetResourceType, changeType (Create /
    Update / Delete), and from changeAttributes: timestamp, changedBy, changedByType,
    clientType, operation, correlationId, changesCount, plus the keys of `changes` as
    changed_properties and `changes` itself for the values. The deployment history comes from
    azure-mgmt-resource-deployments DeploymentsMgmtClient.deployments:
    list_at_subscription_scope() and list_by_resource_group(<rg>) for every resource
    group from ResourceManagementClient.resource_groups.list(). Each deployment gives
    its correlationId, timestamp, duration, provisioningState, templateHash,
    templateLink and outputResources.
    A change that names its caller (changedBy is neither empty nor "System" or
    "Unspecified") is matched to a deployment when its correlationId equals the
    deployment's correlationId; every change a deployment makes carries it
    (`via_deployment: true`, `attribution: correlation_id`). A matched change is
    `origin: manual_deployment` when the deployment was run by a person: changedByType
    is "User", clientType is "Azure Portal", or the deployment is named the way the
    Portal's create wizards name theirs (Microsoft.<type>-…, such as
    Microsoft.Web-WebApp-Portal-… or Microsoft.Template-…, CreateVm-…, or containing
    -Portal-). It is `origin: deployment` otherwise, which is a deployment run by an
    application or managed identity, and whenever the caller is one of the
    configured `pipeline_principals`, which take precedence over every other signal. A missing templateLink is not used as a
    signal, because CLI and pipeline runs of a local template have none either.
    An unmatched named change is `origin: pipeline` when changedBy is one of the
    `pipeline_principals`, and `origin: direct` in every other case, an edit made
    outside any deployment or pipeline. A named change with a different
    correlationId is a separate request even when it lands during a deployment.
    Azure records some changes with changedBy "System" or "Unspecified", often the
    Create of a resource whose named write follows seconds later, and these rows
    reuse correlationIds from unrelated requests. Each takes the origin of the
    nearest named change to the same resource within 10 minutes
    (`attribution: same_resource`). Failing that, it is attributed to a deployment
    when its target is one of the deployment's output resources and its timestamp
    falls within that deployment's run, between timestamp minus duration and
    timestamp, with 10 minutes of slack either side (`attribution:
    deployment_window`); its origin is manual_deployment when the deployment's
    matched changes were, or when nothing matched and the deployment is
    Portal-named, and deployment otherwise. Failing both, it is `origin: platform`
    when changedBy or changedByType is "System", meaning a background change by
    Azure itself, and `origin: unattributed` otherwise, a change Azure records no
    caller for. Resource Graph keeps restamping a change's timestamp for hours after
    the operation (measured: 10 minutes later within 12 hours), so a callerless row
    whose named partner has drifted past the window falls back to platform or
    unattributed. Changes that name their caller are unaffected, since they match
    deployments by correlationId alone. Each entry in results.deployments also
    carries run_by, the callers of the changes it matched, and origin, deployment or
    manual_deployment (null when no change matched it).
    Values: each direct and manual_deployment change carries property_changes, one
    entry per changed property. A shown value has path, previous_value, new_value
    (Resource Graph's previousValue and newValue; null when the property didn't
    exist), truncated and withheld null. A withheld one has only its path and
    withheld, the reason: never the value or anything derived from it. The secret
    check runs first, on every path, whatever the allowlist or value_paths says: a
    value is withheld as "secret" when any segment of its path names a secret or
    free-form content, compared without case, _ or -, such as password,
    passphrase, passcode, any name ending in pass (but not bypass), secret, token,
    any name ending in key, keys or key<n>, pwd, pw, pin, uri or url, sas…, key
    data, key value, pfx, psk, connection string, credential, signature, cookie,
    an authorization or authentication segment, headers, queries, body, env,
    secrets, environment variables, app settings, args, command, custom data,
    protected settings, and properties.value; or when a value, as written or
    URL-decoded, looks like one: one of those secret words anywhere in its text
    (so "name: DB_PASSWORD" or "Password123!" is withheld), a name such as
    password, secret, token, key, sig, code, pin or pw followed by = or :, a
    --flag naming one, a Basic, Bearer, Digest or Negotiate credential, a URL with
    a user, a JWT, a PEM private key or certificate, a short random-looking
    string, a long key-like string, or an object with a secret-named key. Key
    Vault access-policy permission names and true or false are never secrets.
    The check can't catch two things: a short password with nothing marking it,
    such as one written alone in a tag, and under path:* free-form content whose
    names don't mark a secret, such as a generic parameter, setting or variable
    value or a script. path:* shows whatever such content holds, so widening the
    allowlist with it is the operator's risk. A value that passes is shown only
    when its path is on the allowlist: the built-in list of specific paths (TLS versions,
    public network access, network ACLs and NSG rules, Key Vault access policies,
    soft delete and purge protection, local auth, encryption, retention, the
    resource's own state, status and provisioning state, SKU, location, tags and
    similar settings, each at its own path)
    plus the value_paths patterns; any other path is withheld as
    "not_allowlisted". Shown values are cut at 200 characters, and truncated is
    true when a value was cut or Resource Graph marked it truncated. A change lists
    at most 25 entries, shown values first, and property_changes_truncated is true
    when it had more; property_value_counts counts its values shown,
    not_allowlisted and secret over every changed property, listed or not. When a
    change names changed properties but its values can't be read, all three are
    null (unknown). Only the newest max_value_changes such changes keep values; the
    older ones have property_changes and property_value_counts null and
    property_changes_truncated true. Every other origin has all three null, and
    excluded changes carry no values. summary.changes_with_property_values counts
    the direct and manual_deployment changes whose values were read and kept,
    summary.changes_property_values_capped the ones past max_value_changes,
    summary.changes_property_values_unknown the ones whose values couldn't be read,
    summary.property_values_shown the values that passed (shown, or past a
    change's 25-entry listing), and summary.property_values_withheld_by_reason the
    values withheld, by reason (not_allowlisted, secret); shown and withheld are
    null when any change's values couldn't be read, and all five are null when a
    change table couldn't be read. results.property_value_paths_added and
    results.max_property_value_changes echo the settings.
    summary.percent_redeployed is deployment plus pipeline changes over deployment,
    pipeline, manual_deployment and direct changes; platform and unattributed
    changes are excluded. summary.percent_redeployed_conservative also counts
    unattributed changes in the denominator, as if each were a direct edit.
    Limits: ARM keeps at most 800 deployments per resource group and prunes older
    ones, so a change made by a pruned deployment reads as direct; resource groups
    at that limit are listed in summary.resource_groups_at_deployment_history_cap.
    Deleting a resource group deletes its deployment history with it, so every
    change in a resource group deleted since, including the deletes themselves,
    reads as direct; summary.direct_changes_in_deleted_resource_groups counts the
    direct changes whose resource group no longer exists. Resource Graph keeps 14
    days of changes, so the fetcher must run at least every 14 days to see every
    change. Changes the resource_exclusions patterns take out (by their target
    resource or its resource group) are listed under results.excluded instead,
    each with the pattern that matched and the target in target_id; every summary
    count, percentage and breakdown covers only the changes left, while
    deployments_in_history, resource_groups_at_deployment_history_cap and
    results.change_sources still describe everything read. The summary gives
    resource_exclusion_patterns (the configured patterns, empty when none are
    set), resource_exclusion_patterns_unmatched (patterns that matched no
    change's target, such as a mistyped name), excluded_changes (how many the
    patterns took out; no other count includes them) and in_scope_changes (how
    many stayed, the same as total_changes); both are null when a change table
    couldn't be read.
