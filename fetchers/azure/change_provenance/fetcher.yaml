name: azure_change_provenance
version: 0.1.0
description: >
  Every control-plane change to the subscription's resources, resource groups and
  the subscription itself over the last 14 days (Azure Resource Graph change
  history), each attributed either to an ARM deployment in the subscription's
  deployment history or to a direct edit made outside one, such as from the portal
  or the CLI. Each change carries who made it, the client it came from, the change
  type and the properties it touched. The summary counts changes made through
  deployments against direct edits, and breaks the direct edits down by client, by
  caller and by resource type, and changes made by named pipeline
  identities count as redeployments. This is evidence that changes are made by redeploying
  version-controlled templates rather than by modifying resources in place.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_change_provenance.json
  aggregation: per_target

config_schema:
  lookback_days:
    type: integer
    required: false
    default: 14
    env: AZURE_CHANGE_LOOKBACK_DAYS
    description: >
      How many days of change history to collect, from 1 to 14. Resource Graph keeps
      change history for 14 days, so a larger value is clamped to 14. Schedule the
      fetcher at least every 14 days, or changes in between are never seen.

  pipeline_principals:
    type: string
    required: false
    env: AZURE_PIPELINE_PRINCIPALS
    description: >
      Comma-separated application (client) ids or UPNs of the identities your
      deployment pipelines run as. Changes those identities make are counted as
      redeployments (`origin: pipeline`) even when they don't go through an ARM
      deployment, which is how Terraform and other tools that call ARM directly
      apply changes. Leave empty and only ARM deployments count.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CMT-RMV      # Redeploying vs modifying — changes made through deployments, not direct edits

evidence_set:
  reference_id: EVD-AZURE-CHANGE-PROVENANCE
  name: Azure Change Provenance
  instructions: >
    Script: fetcher.py. Reader on the subscription is sufficient. Changes come from
    two Azure Resource Graph queries (azure-mgmt-resourcegraph
    ResourceGraphClient.resources, subscriptions=[<subscription_id>], paged with
    $skipToken to the end, failing the run if Resource Graph returns fewer rows than
    it counted). The `resourcechanges` table covers resources and
    `resourcecontainerchanges` covers resource groups and the subscription. Both are
    filtered to the last `lookback_days` days and projected from properties:
    targetResourceId, targetResourceType, changeType (Create / Update / Delete), and
    from changeAttributes: timestamp, changedBy, changedByType, clientType,
    operation, correlationId, changesCount, plus the keys of `changes` as
    changed_properties. The deployment history comes from azure-mgmt-resource-deployments
    DeploymentsMgmtClient.deployments: list_at_subscription_scope() and
    list_by_resource_group(<rg>) for every resource group from
    ResourceManagementClient.resource_groups.list(). Each deployment gives its
    correlationId, timestamp, duration, provisioningState, templateHash,
    templateLink and outputResources. A change is `origin: deployment`
    (`via_deployment: true`) when its correlationId equals a deployment's
    correlationId (`attribution: correlation_id`), or when its target is one of a
    deployment's output resources and its timestamp falls within that deployment's
    run, between timestamp minus duration and timestamp, with 2 minutes of slack
    either side (`attribution: deployment_window`). It is `origin: platform` when
    changedBy or changedByType is "System", meaning a background change by Azure
    itself. It is `origin: pipeline` when changedBy is one of the configured
    `pipeline_principals`. It is `origin: unattributed` when changedBy or
    changedByType is "Unspecified": Azure records no caller for these, and they are
    side effects that share the correlationId of a change that does name its
    caller. Otherwise it is `origin: direct`, an edit made outside any deployment or
    pipeline. summary.percent_redeployed is deployment plus pipeline changes over
    deployment, pipeline and direct changes. Platform and unattributed changes are
    excluded. Two limits apply. ARM keeps at most 800
    deployments per resource group and prunes older ones, so a change made by a
    pruned deployment reads as direct; resource groups at that limit are listed in
    summary.resource_groups_at_deployment_history_cap. Resource Graph keeps 14 days
    of changes, so the fetcher must run at least every 14 days to see every change.
