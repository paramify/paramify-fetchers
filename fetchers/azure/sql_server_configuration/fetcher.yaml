name: azure_sql_server_configuration
version: 0.2.1
description: >-
  Shows whether each Azure SQL server is closed to the public internet, requires TLS 1.2, uses Entra ID sign-in, audits activity, and runs Defender for SQL and vulnerability scans.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching SQL logical server is listed under excluded with the
      pattern and left out of every count and verdict; its firewall
      rules, auditing settings and Defender settings leave with it and
      are not read. An in-scope server that audits to an excluded
      destination keeps its verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sql_server_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # minimum TLS version
  - KSI-CNA-MAT   # public network access
  - KSI-CNA-RNT   # firewall rules, with allow-all-Azure and whole-internet rules flagged
  - KSI-IAM-APM   # Entra ID administrator and whether Entra-only auth is enforced
  - KSI-MLA-LET   # server blob auditing policies and their retention
  - KSI-SVC-EIS   # vulnerability assessment recurring scans, Defender for SQL

evidence_set:
  reference_id: EVD-AZURE-SQL-CONFIG
  name: Azure SQL Server Configuration
  instructions: |
    Script: azure/sql_server_configuration/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Sql") — tells "not registered" apart from "no servers"
    - servers.list() — every logical server with its public access, minimum TLS version and Entra administrator
    - firewall_rules.list_by_server() (per in-scope server) — the IP ranges allowed to connect
    - server_blob_auditing_policies.list_by_server() (per in-scope server) — whether auditing is on and how long records are kept
    - server_security_alert_policies.get() (per in-scope server) — whether Microsoft Defender for SQL threat detection is on
    - server_vulnerability_assessments.get() (per in-scope server) — where scan results go, and whether recurring scans run and email admins

    Output: azure_sql_server_configuration_<subscription>.json — each Azure SQL logical server with its network exposure, firewall rules, Entra administrator, auditing policies, Defender for SQL alert policy and vulnerability assessment settings, plus the servers left out of scope with the pattern that matched.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every server is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no SQL server, such as a mistyped name; null if the server list couldn't be read
    - excluded_sql_servers — Number of SQL servers left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, its firewall rules and audit settings are never read, and no other count includes it; null if the server list couldn't be read. An audit destination isn't a resource this fetcher reads, so excluding one doesn't change an in-scope server's auditing verdict
    - in_scope_sql_servers — Number of SQL servers read and in scope; null if the server list couldn't be read, and 0 means there are none or the patterns took out every server, which a check can catch by requiring more than 0

    What was checked?
    - total_sql_servers — Number of in-scope Azure SQL logical servers (SQL Managed Instances aren't included); every count below is out of this total
    - provider_registration_status — Whether the SQL provider (Microsoft.Sql) is registered on the subscription: registered, not_registered or unknown

    Is the server closed to the public internet?
    - public_network_access_disabled_servers — Number of servers with public network access Disabled, so they're reached only through private endpoints, or SecuredByPerimeter, where a Network Security Perimeter's inbound access rules decide who connects and can still admit public IP ranges
    - servers_allowing_all_azure_services — Number of servers with the 0.0.0.0–0.0.0.0 firewall rule ("allow Azure services and resources to access this server"), which admits compute in any Azure customer's subscription, not only the organization's own
    - servers_allowing_entire_internet — Number of servers with a firewall rule for every IPv4 address (exactly 0.0.0.0–255.255.255.255; split or overlapping rules that add up to it aren't detected)
    - total_firewall_rules — Number of server-level firewall rules across in-scope servers (database-level rules aren't read); a server whose rules couldn't be read adds 0

    Do connections use TLS 1.2 or later?
    - recommended_minimal_tls_servers — Number of servers whose minimum TLS version is 1.2 or 1.3 (None, 1.0, 1.1 or no setting doesn't count)

    Who can sign in, and how?
    - entra_administrator_servers — Number of servers with a Microsoft Entra ID administrator set
    - entra_only_authentication_servers — Number of servers that accept only Entra ID sign-in (Entra-only authentication on, so SQL logins with passwords are refused)

    Is activity audited and kept long enough?
    - auditing_enabled_servers — Number of servers with at least one server auditing policy Enabled; a server whose policies couldn't be read counts as off
    - auditing_percentage — Percentage of servers with auditing on = auditing_enabled_servers / total_sql_servers × 100 (a whole number, 0–100; reads 0 when total_sql_servers is 0)
    - auditing_retention_over_90_days_servers — Number of servers with an enabled auditing policy that keeps records more than 90 days, or whose retention is 0, which Azure reads as keep forever (exactly 90 days doesn't count). Retention is the storage account setting, so a policy that sends only to Log Analytics or an event hub and is left at 0 also counts

    Are threats and vulnerabilities watched?
    - defender_for_sql_enabled_servers — Number of servers whose security alert policy (Microsoft Defender for SQL threat detection) is Enabled; a server with no policy, or whose policy couldn't be read, counts as off
    - vulnerability_assessment_enabled_servers — Number of servers with vulnerability assessment set up, counted only when a storage container for scan results is set
    - vulnerability_assessment_recurring_scan_servers — Number of servers with recurring (weekly) vulnerability scans on, counted whether or not a storage container is set
    - vulnerability_assessment_admin_notification_servers — Number of servers whose recurring scan results are emailed to the subscription admins, counted whether or not recurring scans are on
