name: azure_entra_pim_assignments
version: 0.1.0
description: >-
  Shows who can activate each Entra ID admin role on demand, who holds one permanently, and whether activating a privileged role needs MFA, a reason, approval and a time limit.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_entra_pim_assignments.json
  aggregation: per_target

target_schema:
  # Microsoft Graph data is TENANT-scoped: one target per Entra tenant.
  tenant_id:
    type: string
    required: false
    env: AZURE_TENANT_ID
    description: >
      Entra tenant id to collect from, and the discriminator for this fetcher's
      output filename. Optional — omit to use whichever tenant the ambient
      credential authenticates into.
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id. Optional and NOT used to scope collection — Graph data
      is tenant-wide; it is recorded in the payload metadata for correlation only.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

# Microsoft Graph application permission (admin consent): RoleManagement.Read.Directory
# (role definitions, eligibility and assignment schedule instances, role management
# policies). Organization.Read.All is optional, for the tenant name. The tenant needs
# Entra ID P2 or ID Governance; without it PIM is reported unavailable and the run
# still succeeds. A denied read is recorded and the run exits non-zero (not_authorized).

ksis:
  - KSI-IAM-JIT
  - KSI-IAM-ELP
  - KSI-MLA-ALA

evidence_set:
  reference_id: EVD-AZURE-ENTRA-PIM-ASSIGNMENTS
  name: Microsoft Entra ID PIM Role Assignments
  instructions: |
    Script: azure/entra_pim_assignments/fetcher.py

    Access: Microsoft Graph RoleManagement.Read.Directory, in a tenant with Entra ID P2 or ID Governance. Optional: Organization.Read.All; without it, the tenant name reads null.

    Commands Executed:
    - Microsoft Graph GET /organization — the tenant's name and domain
    - Microsoft Graph GET /roleManagement/directory/roleDefinitions — the name of each directory role
    - Microsoft Graph GET /roleManagement/directory/roleEligibilityScheduleInstances, expanding the principal — who is eligible to activate each role, and until when
    - Microsoft Graph GET /roleManagement/directory/roleAssignmentScheduleInstances, expanding the principal — who holds each role now, and whether it was assigned or activated
    - Microsoft Graph GET /policies/roleManagementPolicyAssignments, expanding each policy's rules — each role's activation and assignment rules

    Output: azure_entra_pim_assignments_<tenant>.json — every eligible and active directory role assignment with its user, group or app, how long it lasts, and each privileged or assigned role's activation rules.

    Summary fields:

    What was checked?
    - pim_available — True if the tenant has Privileged Identity Management; false if Graph refused because the tenant has no Entra ID P2 or ID Governance licence, and every other field is left out; null if a read failed
    - collection_complete — True if role names, eligible and active assignments and role policies were all read; false if any read failed, and every other field except pim_available is left out
    - privileged_role_policies — Number of privileged roles whose PIM policy was read (privileged means one of the tenant-wide admin roles azure_entra_privileged_roles flags, such as Global Administrator or Privileged Role Administrator)

    Who can activate a privileged role on demand?
    - eligible_assignments — Number of eligible assignments (a user, group or app that can activate a role when needed) across all directory roles
    - eligible_privileged_assignments — Number of eligible assignments to privileged roles
    - permanently_eligible_privileged_assignments — Number of eligible assignments to privileged roles with no end date
    - principals_eligible_for_privileged_roles — Number of distinct users, groups and apps eligible for at least one privileged role
    - privileged_roles_with_eligible_holders — List of privileged role names with at least one eligible assignment
    - global_administrator_eligible — Number of eligible assignments to Global Administrator

    Who holds a privileged role right now, and for how long?
    - active_assignments — Number of active assignments (a role held now) across all directory roles, including activations of an eligible assignment
    - active_privileged_assignments — Number of active assignments to privileged roles
    - active_privileged_by_standing — Number of active privileged-role assignments of each kind: permanent (assigned with no end date, so standing access), pim_activated (an eligible holder activated it, so it ends after the activation time) and time_bound (assigned directly with an end date)
    - permanent_active_privileged_assignments — Number of active privileged-role assignments with no end date that were not activated through PIM
    - permanent_active_privileged_user_assignments — Number of permanent active privileged-role assignments held by users (not groups or apps)
    - principals_with_permanent_privileged_access — Number of distinct users, groups and apps holding a privileged role permanently
    - privileged_roles_with_permanent_active_holders — List of privileged role names held permanently by at least one user, group or app
    - global_administrator_permanent_active — Number of permanent active Global Administrator assignments

    Does activating a privileged role require MFA, a reason, approval and a time limit?
    - privileged_roles_activation_without_mfa_or_auth_context — List of privileged role names whose activation needs neither MFA nor a Conditional Access authentication context
    - privileged_roles_activation_without_justification — List of privileged role names whose activation doesn't ask for a reason
    - privileged_roles_activation_without_approval — List of privileged role names whose activation doesn't need someone's approval
    - max_privileged_activation_hours — Hours: the longest maximum activation time set on any privileged role; null if no privileged role sets one
    - privileged_roles_allowing_permanent_active_assignment — List of privileged role names whose policy lets an admin assign the role permanently as active, with no end date
    - privileged_roles_allowing_permanent_eligible_assignment — List of privileged role names whose policy lets an admin make someone permanently eligible, with no end date
