name: azure_key_vault_configuration
version: 0.3.0
description: >
  Every key vault in the subscription with the configuration that governs access to
  the keys and secrets it holds: which authorization model is in force
  (enable_rbac_authorization — Azure RBAC or the legacy vault access policies, with
  the access policy entries and their permission verbs alongside it), whether the
  vault is recoverable (soft delete plus purge protection, and the soft-delete
  retention window), how it is exposed to the network (public network access, the
  network ACL default action with its IP and virtual-network rules, private endpoint
  connections), the SKU, and which platform integrations may read it (deployment,
  disk encryption, template deployment). Also each vault's diagnostic settings:
  whether the AuditEvent category (the data-plane record of every key, secret and
  certificate operation) is exported, and to which storage account, Log Analytics
  workspace, event hub or partner solution — without such a setting those
  operations are not logged anywhere. Management plane only — no key material or
  secret value is read.
category: azure

config_schema:
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching key vault is listed under excluded with the pattern
      and left out of every count and verdict. A pattern without one of these
      prefixes fails the run. Set it once for every Azure fetcher under
      platforms.azure.config. Can be ${env:VAR}. Empty: every resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_key_vault_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-IAM-ELP      # Least privilege — the authorization model and access policy verbs
  - KSI-CNA-MAT      # Minimizing attack surface — public network access, private endpoints
  - KSI-CNA-RNT      # Restricting network traffic — the network ACL default action and rules
  - KSI-SVC-SIN      # Securing information — recoverability and the HSM-backed (Premium) SKU
  - KSI-MLA-LET      # Logging event types — whether AuditEvent is exported, and where

evidence_set:
  reference_id: EVD-AZURE-KEYVAULT-CFG
  name: Azure Key Vault Configuration
  instructions: |
    Script: azure/key_vault_configuration/fetcher.py. Azure SDK calls (azure-mgmt-keyvault KeyVaultManagementClient): vaults.list_by_subscription(). Then per vault (azure-mgmt-monitor<7 MonitorManagementClient): diagnostic_settings.list(resource_uri=<vault resource id without the leading slash>). Reader is sufficient — both are GETs. Management plane only.

    Key vaults the resource_exclusions patterns take out are listed under excluded instead of key_vaults.

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no key vault, such as a mistyped name
    - excluded_key_vaults — Number of key vaults left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them
    - in_scope_key_vaults — Number of key vaults read and in scope; 0 means none was read or the patterns took out every vault, which a check can catch by requiring more than 0