name: azure_policy_assignments
version: 0.4.1
description: >-
  Lists every Azure Policy assignment and exemption in effect on the subscription, showing which assignments actually enforce, which only audit, and what each exemption waives and until when.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_policy_assignments.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group>, location:<region> or id:<resource id> (also
      matches that resource's child resources). * matches any run of characters and
      ? one character. Only policy exemptions follow them: an exemption follows the
      scope it was made at, matched through its own id, so rg: takes out one made in
      that resource group or on a resource in it and id: one made on that resource
      (or the exemption itself); one made at the subscription or a management group
      stays. Exemptions carry no region, so a location: pattern never matches one
      and they stay in scope. Each match is listed under excluded with the pattern
      and left out of every exemption count and each assignment's exemption_count.
      Policy assignments are not affected. A pattern without one of these prefixes
      fails the run. Each item is a pattern, or a pattern with a reason.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-ACM
  - KSI-CNA-EIS
  - KSI-CNA-IBP      # which best-practice policies are assigned, and whether they deny or only audit
  - KSI-MLA-EVC      # configuration is evaluated against policy, with the effect that evaluation has

evidence_set:
  reference_id: EVD-AZURE-POLICY-ASSIGN
  name: Azure Policy Assignments
  instructions: |
    Script: azure/policy_assignments/fetcher.py

    Access: Reader on the subscription. Optional: Reader on the management groups that hold custom policy definitions; without it, those definitions and their effects read as unavailable.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get() for Microsoft.Authorization — tells "no policy assigned" from an unregistered provider
    - policy_assignments.list() — every assignment on the subscription and those inherited from management groups; a failure fails the run
    - policy_definitions and policy_set_definitions get_built_in(), get() or get_at_management_group() (per distinct definition) — display name, built-in or custom, and the policy effect, taken from the assignment's parameter value, else the initiative's default, else the definition's default; a definition that can't be read is reported as unavailable and doesn't fail the run
    - policy_definitions.list_built_in() (once, when an initiative is assigned) — the effect of each built-in member policy; on failure the members are read one at a time
    - GET Microsoft.Authorization/policyExemptions (a preview API version, the only kind Azure offers) — every exemption on the subscription, inherited from management groups, or on its resource groups and resources, Defender for Cloud recommendation exemptions included, expired ones too; a failure fails the run

    Output: azure_policy_assignments_<subscription>.json — each policy assignment with its scope, excluded scopes, parameters, enforcement mode and policy definition, the effect of each policy it applies and whether it actually enforces, and each policy exemption with what it exempts (each named member flagged in_initiative), the scope it was made at, its category, description, metadata, who created and last changed it, and its expiry; an effect value the fetcher doesn't recognise reads unresolved with that value in its reason; exemptions the resource_exclusions patterns take out are listed under excluded instead.

    Summary fields:

    Which exemptions are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every exemption is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no exemption, such as a mistyped name or any location: pattern, since exemptions carry no region, or null when the exemptions could not be read
    - excluded_policy_exemptions — Number of exemptions left out of scope because a pattern matched the resource group or id of the scope they were made at (a resource group, or a resource and its group); exemptions made at the subscription or a management group stay, and each excluded one is listed under excluded with the pattern; null when the exemptions could not be read. Policy assignments are never left out
    - in_scope_policy_exemptions — Number of exemptions read and in scope; null when the exemptions could not be read

    What policy assignments exist?
    - total_policy_assignments — Number of policy assignments in effect on the subscription, its own and inherited; null when the assignment list fails, and then every assignment and effect field in this summary is null too and the run fails
    - initiative_assignments — Number of assignments of an initiative (a policy set bundling many policies)
    - single_definition_assignments — Number of assignments of a single policy definition
    - built_in_definition_assignments — Number of assignments whose definition or initiative is built in by Microsoft
    - custom_definition_assignments — Number of assignments whose definition or initiative is custom
    - unresolved_definition_assignments — Number of assignments whose definition or initiative could not be read
    - provider_registration_status — Whether the policy provider (Microsoft.Authorization) is registered on the subscription: registered, not_registered or unknown

    Where do the assignments apply?
    - subscription_scoped_assignments — Number of assignments made on the subscription itself
    - resource_group_scoped_assignments — Number of assignments made on one resource group
    - inherited_assignments — Number of assignments made on a management group above the subscription
    - assignments_with_excluded_scopes — Number of assignments that exclude at least one scope (notScopes)
    - assignments_with_parameters — Number of assignments that set at least one parameter

    Is enforcement switched on?
    - enforced_assignments — Number of assignments with enforcement mode Default, where the policy's effect is applied
    - audit_only_assignments — Number of assignments with enforcement mode DoNotEnforce (the portal's "Disabled"), which are evaluated but change nothing
    - enforced_percentage — Percentage of assignments with enforcement on = enforced_assignments / total_policy_assignments × 100 (a whole number, 0–100); 0 when total_policy_assignments is 0
    - security_center_builtin_assigned — True if Defender for Cloud's own assignment (SecurityCenterBuiltIn) is present; false if not
    - security_center_builtin_enforced — True if the SecurityCenterBuiltIn assignment is present with enforcement mode Default; false if not

    Do the assignments actually enforce, or only audit?
    - actually_enforcing_assignments — Number of assignments that actually enforce: at least one policy with an enforcing effect (deny, denyAction, modify, deployIfNotExists, append, mutate, addToNetworkGroup or enforceSetting, which block, change or remediate a resource) under enforcement mode Default
    - actually_enforcing_percentage — Percentage of assignments that actually enforce = actually_enforcing_assignments / total_policy_assignments × 100 (a whole number, 0–100); 0 when total_policy_assignments is 0. Assignments whose effects could not be resolved count in the total but not as enforcing, so they lower it
    - audit_effect_only_assignments — Number of assignments whose policies only report (audit, auditAction, auditIfNotExists or manual), or whose enforcing effects are held back by enforcement mode DoNotEnforce
    - disabled_effect_assignments — Number of assignments whose every policy has the disabled effect
    - unresolved_effect_assignments — Number of assignments in the unresolved effect class: no policy's effect could be resolved (the definition could not be read, the effect is an expression, or its value isn't a known effect), or only the disabled effect resolved while other policies didn't
    - assignments_by_effect_class — Number of assignments in each effect class:
      - enforcing (actually enforces)
      - audit_only (only reports, or held back by DoNotEnforce)
      - disabled (every policy disabled)
      - unresolved (no effect resolved, or only disabled resolved with some policies unresolved)
    - enforcing_effects_not_enforced_assignments — Number of assignments with enforcement mode DoNotEnforce that contain at least one policy with an enforcing effect

    Was every policy's effect resolved?
    - member_policy_effect_counts — Number of policies with each effect across every assignment, counting each policy of an initiative (an initiative assigned twice counts twice); every effect is listed, 0 when none, and the object is empty when there are no assignments:
      - deny (blocks a non-compliant request)
      - denyAction (blocks a named action on a resource)
      - modify (changes a resource's properties)
      - deployIfNotExists (deploys a missing related resource)
      - append (adds fields to a request)
      - mutate (changes a resource's configuration)
      - addToNetworkGroup (adds a resource to a network group)
      - enforceSetting (enforces a setting)
      - audit (reports non-compliance)
      - auditAction (reports a named action)
      - auditIfNotExists (reports a missing related resource)
      - manual (attestation only)
      - disabled (switched off)
      - unresolved (the effect could not be resolved)
    - unresolved_member_policies — Number of policies across every assignment whose effect could not be resolved, counting the unresolved policies inside partly resolved initiatives, which are classed by their resolved policies alone
    - unresolved_member_policies_not_enforced — Number of policies whose effect could not be resolved inside assignments with enforcement mode DoNotEnforce, where an enforcing effect may be held back unseen

    Were the exemptions read?
    - exemptions_read_status — Whether the exemptions were read: read, failed (the list call failed), api_version_unavailable (Azure refused the pinned preview version with InvalidApiVersionParameter, NoRegisteredProviderFound or InvalidResourceType) or not_read (no subscription or credential); both failures fail the run, and every exemption count below is null unless the status is read
    - exemptions_api_version — What the fetcher pins the exemptions API to: the preview version 2024-12-01-preview, set in its code
    - total_policy_exemptions — Number of in-scope exemptions in effect on the subscription, its own, inherited from a management group, or on a resource group or resource inside it, expired ones included

    What do the exemptions waive?
    - waiver_exemptions — Number of in-scope exemptions in category Waiver (the resource is accepted as non-compliant), matched without regard to case
    - mitigated_exemptions — Number of in-scope exemptions in category Mitigated (the policy's intent is met another way), matched without regard to case
    - whole_assignment_exemptions — Number of in-scope exemptions that exempt every policy of an assignment rather than named members of an initiative
    - defender_benchmark_exemptions — Number of in-scope exemptions on Defender for Cloud's own assignment (SecurityCenterBuiltIn), which is how Defender recommendation exemptions are stored
    - active_exemptions_lifting_enforcement — Number of unexpired in-scope exemptions that lift enforcement: they exempt a policy with an enforcing effect (deny, modify, deployIfNotExists and the others listed above) on an assignment with enforcement mode Default; null when the exemptions were not read, or when the assignment list failed and there is at least one in-scope exemption (0 when there are none)
    - exemptions_lifting_enforcement_unknown — Number of in-scope exemptions where that can't be told; each one's lifts_enforcement_unknown_reason says why: assignment_not_listed (the exempted assignment isn't listed), assignments_unread (the assignments could not be read), initiative_members_unread (the initiative's members could not be read), member_not_in_initiative (an exempted policy isn't in the initiative's current definition) or effect_unresolved (an exempted policy's effect could not be resolved)
    - exemptions_naming_members_not_in_initiative — Number of in-scope exemptions naming at least one initiative member that the initiative's current definition doesn't have: a policy since removed from the initiative, or one in an older version the assignment still uses
    - assignments_with_exemptions — Number of listed assignments with at least one in-scope exemption; null when the exemptions were not read, or when the assignment list failed and there is at least one in-scope exemption (0 when there are none)
    - exemptions_of_unlisted_assignments — Number of in-scope exemptions whose assignment isn't among the assignments listed for the subscription, usually an assignment since deleted, whose exemptions Azure leaves in place; null when the exemptions were not read, or when the assignment list failed and there is at least one in-scope exemption (0 when there are none)
    - unlisted_assignments_with_exemptions — Number of distinct assignments that in-scope exemptions point at but that aren't among the listed assignments; null when the exemptions were not read, or when the assignment list failed and there is at least one in-scope exemption (0 when there are none)

    Where were the exemptions made?
    - exemptions_by_scope_kind — Number of in-scope exemptions made at each kind of scope:
      - management_group (a management group above the subscription)
      - subscription (the subscription itself)
      - resource_group (one resource group)
      - resource (one resource)
      - unknown (a scope the fetcher can't classify)
    - inherited_exemptions — Number of in-scope exemptions made at a management group above the subscription

    Do the exemptions expire?
    - active_exemptions — Number of in-scope exemptions that are unexpired, including those with no expiry date
    - expired_exemptions — Number of in-scope exemptions whose expiry date has passed; Azure keeps them but no longer applies them
    - exemptions_without_expiry — Number of in-scope exemptions with no expiry date, which apply until someone deletes them
    - exemptions_expiring_within_30_days — Number of unexpired in-scope exemptions that expire in under 30 days
    - exemptions_with_unreadable_expiry — Number of in-scope exemptions whose expiry date could not be parsed, so whether they expired is unknown
