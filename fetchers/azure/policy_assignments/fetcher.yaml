name: azure_policy_assignments
version: 0.4.0
description: >
  Every Azure Policy assignment in effect on the subscription — its own and the ones
  inherited from a management group: display name, the referenced policy definition
  or initiative, the assignment scope and any excluded (notScopes) scopes, the
  assignment parameters, and whether the assignment is ENFORCED (enforcementMode
  Default) or audit-only (DoNotEnforce). Each referenced definition is resolved to
  its display name and to BuiltIn vs Custom where the run's permissions allow;
  a definition that cannot be read is reported as unavailable rather than failing
  the collection. Each assignment's policy EFFECT is resolved too — deny, modify,
  deployIfNotExists, audit, disabled and the rest — for every member of an
  initiative, following parameterized effects through the assignment's value, then
  the initiative's default, then the definition's default; so the evidence says
  which assignments actually enforce (an enforcing effect under enforcementMode
  Default) and which only audit. An effect value it does not recognise is reported
  as unresolved with that value in its reason, and the summary counts unresolved
  member policies, overall and under DoNotEnforce. Every policy exemption in effect
  is listed too — the subscription's own, those inherited from a management group,
  and those on resource groups and resources inside it, Defender for Cloud
  recommendation exemptions included — with the assignment and initiative members
  it exempts, its scope, category (Waiver or Mitigated), description, metadata,
  creator and expiry, flagging expired ones, ones with no expiry, and ones that lift
  an enforcing effect. Exemptions come from a preview api-version
  (2024-12-01-preview), the only kind Azure offers for them.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_policy_assignments.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

config_schema:
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group>, location:<region> or id:<resource id> (also
      matches that resource's child resources). * matches any run of characters and
      ? one character. Only policy exemptions follow them: an exemption follows the
      scope it was made at, matched through its own id, so rg: takes out one made in
      that resource group or on a resource in it and id: one made on that resource
      (or the exemption itself); one made at the subscription or a management group
      stays. Exemptions carry no region, so a location: pattern never matches one
      and they stay in scope. Each match is listed under excluded with the pattern
      and left out of every exemption count and each assignment's exemption_count.
      Policy assignments are not affected. A pattern without one of these prefixes
      fails the run.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-ACM
  - KSI-CNA-EIS
  - KSI-CNA-IBP      # which best-practice policies are assigned, and whether they deny or only audit
  - KSI-MLA-EVC      # configuration is evaluated against policy, with the effect that evaluation has

evidence_set:
  reference_id: EVD-AZURE-POLICY-ASSIGN
  name: Azure Policy Assignments
  instructions: >
    Script: azure/policy_assignments/fetcher.py. Azure SDK calls: resource.providers.get("Microsoft.Authorization"),
    then azure-mgmt-resource-policy PolicyClient policy_assignments.list() and, per
    distinct definition, policy_definitions / policy_set_definitions get_built_in(), get()
    or get_at_management_group(). For initiatives, policy_definitions.list_built_in() once
    to read built-in member definitions, and the same getters for custom members; each
    effect is read from policyRule.then.effect and resolved through the assignment and
    definition parameters. Policy exemptions: one raw ARM GET of
    /subscriptions/<id>/providers/Microsoft.Authorization/policyExemptions at the preview
    api-version 2024-12-01-preview (no filter, so inherited, resource-group, resource and
    expired exemptions are all returned), following nextLink; ARM refusing that
    api-version (InvalidApiVersionParameter, NoRegisteredProviderFound or
    InvalidResourceType) reports the exemptions as unknown (null counts) without failing
    the run, and any other error fails it.
    Exemption categories are matched without regard to case and written as Waiver or
    Mitigated. lifts_enforcement is null, with lifts_enforcement_unknown_reason saying why,
    when the exempted assignment isn't listed (assignment_not_listed: usually an
    assignment since deleted, whose exemptions Azure leaves in place), the assignments
    weren't read (assignments_unread), the initiative's members couldn't be read
    (initiative_members_unread), an exempted reference id isn't a member of the
    initiative's current definition (member_not_in_initiative: a member since removed, or
    one in an older version the assignment still uses; flagged per member as
    in_initiative false), or an exempted member's effect couldn't be resolved
    (effect_unresolved). The summary counts exemptions on unlisted assignments and the
    distinct unlisted assignments they name.
    Reader, plus management-group read for MG-scoped custom definitions.
