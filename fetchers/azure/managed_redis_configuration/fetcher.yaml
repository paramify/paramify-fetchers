name: azure_managed_redis_configuration
version: 0.2.1
description: >-
  Shows each Azure Managed Redis cluster's transport and access posture: minimum TLS version, public network access, private endpoints, customer-managed-key encryption, and per database the client protocol and key authentication.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Redis Enterprise cluster is listed under excluded with the
      pattern and left out of every count and verdict; its databases
      are not read and leave with it, so they appear in no database
      count. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_managed_redis_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # minimum TLS version and encrypted client protocol; CMK encryption
  - KSI-IAM-SNU   # access-key authentication disabled so only Entra ID can be used
  - KSI-CNA-RNT   # public network access and private endpoint connections
  - KSI-CNA-OFA   # high availability, zones and geo-replication

evidence_set:
  reference_id: EVD-AZURE-MANAGED-REDIS-CONFIG
  name: Azure Managed Redis Configuration
  instructions: |
    Script: azure/managed_redis_configuration/fetcher.py

    Access: Reader on the subscription. Classic Azure Cache for Redis (Microsoft.Cache/redis) is not read. Access keys are never listed.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Cache") — tells "Redis not in use" from "no clusters"
    - redis_enterprise.list() — every Azure Managed Redis cluster in the subscription
    - databases.list_by_cluster() (per in-scope cluster) — each database's client protocol, access-key authentication, persistence and geo-replication

    Output: azure_managed_redis_configuration_<subscription>.json — each cluster with its databases and posture verdicts, plus the clusters left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every cluster is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no cluster, such as a mistyped name; null when the cluster list could not be read
    - excluded_redis_clusters — Number of clusters left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, gets no database read, and no other count includes it or its databases; null when the cluster list could not be read
    - in_scope_redis_clusters — Number of clusters read and in scope; null when the cluster list could not be read; 0 means there are none or the patterns took out every cluster, which a check can catch by requiring more than 0

    Which clusters and databases exist?
    - total_clusters — Number of in-scope clusters; every cluster count below is out of this total
    - total_databases — Number of databases read across the in-scope clusters; clusters whose database list could not be read add none
    - provider_registration_status — Whether the Redis provider (Microsoft.Cache) is registered on the subscription: registered, not_registered or unknown
    - databases_unread_clusters — Number of clusters whose database list could not be read, so both per-cluster verdicts are null: tls_only (minimum TLS 1.2 or higher, at least one database, and every database Encrypted) and entra_only (at least one database, and every database with access-key authentication Disabled)

    Is traffic encrypted?
    - tls_only_clusters — Number of clusters with a minimum TLS version of 1.2 or higher, at least one database, and every database accepting only encrypted client connections; clusters whose database list could not be read are not counted
    - tls_only_percentage — Percentage of clusters that are TLS-only = tls_only_clusters / total_clusters × 100 (a whole number, rounded down; reads 0 when total_clusters is 0); clusters whose database list could not be read count in the total but never as TLS-only
    - recommended_minimum_tls_clusters — Number of clusters whose minimum TLS version is 1.2 or 1.3; a cluster with no minimum version is not counted
    - encrypted_protocol_databases — Number of databases whose client protocol is Encrypted (TLS only)
    - plaintext_protocol_databases — Number of databases that do not require an encrypted client protocol (Plaintext, which accepts non-TLS connections, or no protocol reported)
    - customer_managed_key_clusters — Number of clusters encrypted with a customer-managed key

    Who can reach the clusters?
    - public_network_access_disabled_clusters — Number of clusters with public network access set to Disabled; a cluster that reports none is not counted
    - public_network_access_unset_clusters — Number of clusters that report no public network access setting (older clusters from before Azure returned it), which count as not disabled
    - private_only_clusters — Number of clusters with public network access Disabled and at least one Approved private endpoint connection

    How do clients authenticate?
    - access_keys_disabled_databases — Number of databases with access-key authentication Disabled, so only Microsoft Entra ID can be used
    - access_keys_enabled_databases — Number of databases not reporting access-key authentication Disabled, including those reporting nothing, which are treated as Enabled (the service default before 2024)
