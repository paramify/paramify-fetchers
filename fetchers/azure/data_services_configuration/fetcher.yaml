name: azure_data_services_configuration
version: 0.3.0
description: >-
  Shows whether MongoDB vCore clusters, Data Explorer clusters and Event Hubs namespaces limit network access, avoid shared keys, restrict admin rights, use customer-managed keys and export audit logs.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Mongo vCore cluster, Data Explorer cluster or Event Hubs
      namespace is listed under excluded with the pattern and left out
      of every count and verdict; its firewall rules, databases,
      principals, event hubs and authorization rules leave with it and
      are not read. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_data_services_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # minimum TLS, disk and double encryption, customer-managed keys
  - KSI-CNA-MAT   # public access, allow-all firewall rules and private endpoints
  - KSI-IAM-SNU   # shared keys and native authentication versus Entra ID
  - KSI-IAM-ELP   # Data Explorer principal assignments, admin roles flagged
  - KSI-CNA-OFA   # high availability and zone redundancy
  - KSI-MLA-LET   # audit logs exported from each service

evidence_set:
  reference_id: EVD-AZURE-DATA-SERVICES-CONFIG
  name: Azure Data Services Configuration
  instructions: |
    Script: azure/data_services_configuration/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get() for Microsoft.DocumentDB, Microsoft.Kusto and Microsoft.EventHub — tells "not registered" from "none there", for each provider
    - mongo_clusters.list() — MongoDB vCore clusters with their public access, authentication, high availability, encryption and private endpoint settings
    - firewall_rules.list_by_mongo_cluster() (per cluster) — the IP ranges each cluster's firewall admits
    - clusters.list() — Data Explorer clusters with their network, encryption, tenant trust and callout policy settings
    - cluster_principal_assignments.list() (per cluster) — who holds which role on the cluster
    - databases.list_by_cluster() and database_principal_assignments.list() (per cluster and database) — databases, their retention and who holds which role on each
    - namespaces.list() — Event Hubs namespaces with their TLS, local authentication, redundancy and encryption settings
    - namespaces.get_network_rule_set() (per namespace) — the namespace's default network action and IP and virtual network rules
    - namespaces.list_authorization_rules() (per namespace) — shared access policies and their rights
    - event_hubs.list_by_namespace() and event_hubs.list_authorization_rules() (per namespace and event hub) — event hubs with their retention and capture, and each hub's shared access policies
    - diagnostic_settings.list() (per cluster and namespace) — whether audit logs are exported

    Output: azure_data_services_configuration_<subscription>.json — each MongoDB vCore cluster, Data Explorer cluster and Event Hubs namespace with its network access, authentication, access rights, encryption and audit log export, plus the resources left out and why; no key, connection string or administrator password is read, and a MongoDB cluster's tls_enforced_by_platform is always true, because the service accepts only TLS 1.2 or later and has no TLS setting to read.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no MongoDB vCore cluster, Data Explorer cluster or Event Hubs namespace, such as a mistyped name; null when any of the three lists could not be read
    - excluded_mongo_clusters — Number of MongoDB vCore clusters left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, their children are never read and no other count includes them; null when the MongoDB cluster list could not be read
    - excluded_data_explorer_clusters — Number of Data Explorer clusters left out of scope the same way; their databases and principals leave with them; null when the Data Explorer cluster list could not be read
    - excluded_event_hub_namespaces — Number of Event Hubs namespaces left out of scope the same way; their event hubs and authorization rules leave with them; null when the namespace list could not be read
    - in_scope_mongo_clusters — Number of MongoDB vCore clusters read and in scope; null when the MongoDB cluster list could not be read
    - in_scope_data_explorer_clusters — Number of Data Explorer clusters read and in scope; null when the Data Explorer cluster list could not be read
    - in_scope_event_hub_namespaces — Number of Event Hubs namespaces read and in scope; null when the namespace list could not be read; 0 for all three kinds means there are none or the patterns took out every one, which a check can catch by requiring more than 0

    What was checked?
    - total_mongo_clusters — Number of in-scope MongoDB vCore (Azure DocumentDB) clusters; null when the MongoDB cluster list could not be read, as is every count built from that list
    - total_data_explorer_clusters — Number of in-scope Azure Data Explorer clusters; null when the Data Explorer cluster list could not be read, as is every count built from that list
    - total_event_hub_namespaces — Number of in-scope Event Hubs namespaces; null when the namespace list could not be read, as is every count built from that list, including the event hub counts
    - total_event_hubs — Number of event hubs across all in-scope namespaces whose event hubs could be read; null when the namespace list could not be read; a namespace whose event hub list couldn't be read adds none, and no count shows it (the run fails)
    - provider_registration_status_mongo_clusters — Whether Microsoft.DocumentDB is registered on the subscription: registered, not_registered or unknown
    - provider_registration_status_data_explorer — Whether Microsoft.Kusto is registered on the subscription: registered, not_registered or unknown
    - provider_registration_status_event_hubs — Whether Microsoft.EventHub is registered on the subscription: registered, not_registered or unknown

    Can MongoDB clusters be reached from the internet?
    - mongo_clusters_public_access_disabled — Number of MongoDB clusters whose public network access is Disabled, even when their firewall rules couldn't be read; otherwise public access is judged on the distinct IPv4 addresses all firewall rules admit together (overlaps merged, the allow Azure services rule 0.0.0.0-0.0.0.0 left out), and a cluster with no rules at all (nothing public can connect) is in none of the counts below
    - mongo_clusters_firewall_allow_all — Number of MongoDB clusters whose firewall rules together admit every IPv4 address, even when split across several ranges
    - mongo_clusters_firewall_broad — Number of MongoDB clusters whose firewall rules together admit more addresses than a /8 (16,777,216) but not every IPv4 address, or that have the allow Azure services rule, which admits every Azure-hosted client from any tenant
    - mongo_clusters_firewall_restricted — Number of MongoDB clusters whose firewall rules together admit a /8 or fewer addresses and have no allow Azure services rule
    - mongo_clusters_public_access_unknown — Number of MongoDB clusters whose firewall rules couldn't be read and whose public network access isn't Disabled
    - mongo_clusters_with_private_endpoints — Number of MongoDB clusters with at least one private endpoint connection

    Are MongoDB clusters configured securely?
    - mongo_clusters_native_auth_enabled — Number of MongoDB clusters that allow native username and password sign-in
    - mongo_clusters_entra_auth_enabled — Number of MongoDB clusters that allow Microsoft Entra ID sign-in
    - mongo_clusters_high_availability_enabled — Number of MongoDB clusters with a high availability target mode other than Disabled
    - mongo_clusters_customer_managed_key — Number of MongoDB clusters encrypted with a customer-managed key
    - mongo_clusters_data_api_enabled — Number of MongoDB clusters with the Data API (HTTP access to the cluster) turned on
    - mongo_clusters_audit_logs_exported — Number of MongoDB clusters with audit logs exported: a diagnostic setting that sends to a destination (storage account, Log Analytics, event hub or partner solution) enables vCoreMongoRequests or the audit or allLogs category group
    - mongo_clusters_audit_logs_unknown — Number of MongoDB clusters whose diagnostic settings couldn't be read

    Can Data Explorer clusters be reached, and what can they reach?
    - data_explorer_clusters_open_to_all_networks — Number of Data Explorer clusters whose network exposure is open: public network access is on and the allowed IP ranges are empty or admit every IPv4 address, such as 0.0.0.0/0
    - data_explorer_clusters_network_restricted — Number of Data Explorer clusters whose network exposure is restricted: public network access is on but allowed IP ranges limit who can connect
    - data_explorer_clusters_private_only — Number of Data Explorer clusters whose network exposure is private: public network access is Disabled
    - data_explorer_clusters_vnet_injected — Number of Data Explorer clusters deployed into a virtual network (a VNet configuration whose state isn't Disabled)
    - data_explorer_clusters_outbound_restricted — Number of Data Explorer clusters with outbound network access restricted (restrictOutboundNetworkAccess Enabled)
    - data_explorer_callout_policies_allowed — Number of callout policies, across all in-scope Data Explorer clusters, that allow queries to call out to an external service (SQL, web APIs, storage); an empty list means none is set
    - data_explorer_clusters_callout_policies_unknown — Number of Data Explorer clusters whose callout policies couldn't be read

    Is Data Explorer data protected?
    - data_explorer_clusters_disk_encryption_enabled — Number of Data Explorer clusters with disk encryption turned on
    - data_explorer_clusters_double_encryption_enabled — Number of Data Explorer clusters with double encryption turned on
    - data_explorer_clusters_customer_managed_key — Number of Data Explorer clusters encrypted with a customer-managed key (Key Vault properties set)
    - data_explorer_clusters_purge_enabled — Number of Data Explorer clusters that allow purge (hard deletion of records)
    - data_explorer_clusters_audit_logs_exported — Number of Data Explorer clusters with audit logs exported: a diagnostic setting that sends to a destination enables Command, Query, Journal or the audit or allLogs category group
    - data_explorer_clusters_audit_logs_unknown — Number of Data Explorer clusters whose diagnostic settings couldn't be read

    Who has access to Data Explorer?
    - data_explorer_clusters_trusting_any_tenant — Number of Data Explorer clusters whose trusted external tenants include "*", so users, groups or apps from any Entra tenant can be granted access
    - data_explorer_principal_assignments — Number of role assignments to users, groups or apps on in-scope Data Explorer clusters and their databases
    - data_explorer_admin_assignments — Number of Data Explorer role assignments with an admin role (AllDatabasesAdmin or Admin), which can change data or grant access
    - data_explorer_admin_user_assignments — Number of Data Explorer admin role assignments held by individual users rather than groups or apps
    - data_explorer_clusters_principals_unknown — Number of Data Explorer clusters whose cluster role assignments, or the role assignments of any database that was listed, couldn't be read; a cluster whose database list couldn't be read isn't counted here (the run fails)

    Can Event Hubs namespaces be reached from the internet?
    - event_hub_namespaces_open_to_all_networks — Number of Event Hubs namespaces whose network exposure is open: public network access is on and the network rule set's default action is Allow (or unset), or Deny with an IP rule that admits every IPv4 address
    - event_hub_namespaces_network_restricted — Number of Event Hubs namespaces whose network exposure is restricted: public network access is on but the network rule set's default action is Deny, so only its IP and virtual network rules get in
    - event_hub_namespaces_private_only — Number of Event Hubs namespaces whose network exposure is private: the namespace or its network rule set sets public network access to Disabled
    - event_hub_namespaces_network_exposure_unknown — Number of Event Hubs namespaces whose network rule set couldn't be read and that don't disable public network access themselves

    Are Event Hubs namespaces configured securely?
    - event_hub_namespaces_tls_below_1_2 — Number of Event Hubs namespaces whose minimum TLS version is below 1.2 (1.0 or 1.1)
    - event_hub_namespaces_local_auth_enabled — Number of Event Hubs namespaces where shared access keys still work (disableLocalAuth isn't true; it defaults to false)
    - event_hub_namespaces_shared_key_full_control — Number of Event Hubs namespaces where one shared key gives full control: local authentication is on and a namespace shared access policy has Manage rights; a namespace whose shared access policies couldn't be read isn't counted, and no count shows it (the run fails)
    - event_hub_namespaces_customer_managed_key — Number of Event Hubs namespaces encrypted with a customer-managed key (key source Microsoft.KeyVault)
    - event_hub_namespaces_zone_redundant — Number of Event Hubs namespaces spread across availability zones
    - event_hub_namespaces_geo_replicated — Number of Event Hubs namespaces replicated to at least one region besides the primary
    - event_hub_namespaces_audit_logs_exported — Number of Event Hubs namespaces with audit logs exported: a diagnostic setting that sends to a destination enables RuntimeAuditLogs or the audit or allLogs category group
    - event_hub_namespaces_audit_logs_unknown — Number of Event Hubs namespaces whose diagnostic settings couldn't be read

    Are individual event hubs protected and retained?
    - event_hubs_with_capture — Number of event hubs with Capture turned on (events copied to storage)
    - event_hubs_with_manage_rights_rules — Number of event hubs with at least one of their own shared access policies granting Manage rights
    - event_hubs_authorization_rules_unknown — Number of event hubs whose shared access policies couldn't be read
    - event_hubs_minimum_retention_days — Number of days of message retention on the event hub with the shortest retention; null when no event hub reports a retention in days
