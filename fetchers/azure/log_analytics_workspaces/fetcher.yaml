name: azure_log_analytics_workspaces
version: 0.2.0
description: >
  Every Log Analytics workspace in the subscription with the configuration that
  decides how long log data is kept and who can read it: the pricing SKU, the
  workspace retention (retention_in_days) and daily ingestion cap, public network
  access for ingestion and for query, the access control mode
  (enableLogAccessUsingOnlyResourcePermissions — resource-or-workspace permissions
  versus workspace permissions only), whether shared-key (local) authentication is
  disabled, and any dedicated cluster link. Per-table retention is summarized rather
  than dumped — a workspace carries hundreds of built-in tables — as counts by plan
  and by interactive / total retention, the minimum retention across tables, and the
  tables whose retention differs from the workspace default or that are custom
  tables, listed by name. Also each workspace's data export rules and whether
  Microsoft Sentinel is onboarded (the SecurityInsights solution is enabled).
category: azure

config_schema:
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that resource's
      child resources). * matches any run of characters and ? one character. A
      matching workspace is listed under excluded with the pattern and left out of
      every count and verdict, with its tables, data exports and solutions. A
      pattern without one of these prefixes fails the run. Set it once for every
      Azure fetcher under platforms.azure.config. Can be ${env:VAR}. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_log_analytics_workspaces.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-MLA-OSM      # Operating SIEM capability — the log store, its retention, and Sentinel onboarding
  - KSI-MLA-ALA      # Authorizing log access — the access control mode, local-auth, and public query access

evidence_set:
  reference_id: EVD-AZURE-LOG-ANALYTICS
  name: Azure Log Analytics Workspaces
  instructions: >
    Script: azure/log_analytics_workspaces/fetcher.py. Azure SDK calls (azure-mgmt-loganalytics
    LogAnalyticsManagementClient): workspaces.list(), then per workspace
    tables.list_by_workspace(resource_group, workspace),
    data_exports.list_by_workspace(resource_group, workspace) and
    intelligence_packs.list(resource_group, workspace). Reader is sufficient — all
    GETs, and no log data is queried.
    Resources the resource_exclusions patterns take out are listed under `excluded`
    instead, each with the pattern that matched, and every count covers only the
    workspaces in scope. The summary echoes `resource_exclusion_patterns`, lists
    `resource_exclusion_patterns_unmatched` (patterns that matched no workspace,
    such as a mistyped name), and counts `excluded_workspaces` and
    `in_scope_workspaces` (0 when none was read or the patterns took out every
    workspace, which a check can catch by requiring more than 0).
