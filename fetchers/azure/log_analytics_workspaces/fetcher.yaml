name: azure_log_analytics_workspaces
version: 0.3.1
description: >-
  Shows how long each Log Analytics workspace keeps its logs, who can reach and read them, where they are exported, and whether Microsoft Sentinel is onboarded.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that resource's
      child resources). * matches any run of characters and ? one character. A
      matching workspace is listed under excluded with the pattern and left out of
      every count and verdict; its tables, data exports and solutions are not read. A
      pattern without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_log_analytics_workspaces.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-MLA-OSM      # Operating SIEM capability — the log store, its retention, and Sentinel onboarding
  - KSI-MLA-ALA      # Authorizing log access — the access control mode, local-auth, and public query access

evidence_set:
  reference_id: EVD-AZURE-LOG-ANALYTICS
  name: Azure Log Analytics Workspaces
  instructions: |
    Script: azure/log_analytics_workspaces/fetcher.py

    Access: Reader on the subscription. No log data is queried.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.OperationalInsights") — tells "not in use" from "no workspaces"
    - workspaces.list() — every workspace with its SKU, retention, daily cap, network access and access settings
    - tables.list_by_workspace() (per in-scope workspace) — each table's plan and retention
    - data_exports.list_by_workspace() (per in-scope workspace) — data export rules and their destinations
    - intelligence_packs.list() (per in-scope workspace) — the solutions switched on, including Sentinel (SecurityInsights)

    Output: azure_log_analytics_workspaces_<subscription>.json — each in-scope workspace with its SKU, retention, daily cap, network access, access control mode, shared-key setting, table counts by plan and retention and the shortest table retention, the tables with non-default retention or custom, its dedicated cluster link, its data export rules and whether Sentinel is onboarded, plus the workspaces left out and why.

    Summary fields:

    What was checked?
    - total_workspaces — Number of in-scope Log Analytics workspaces read
    - total_tables — Number of tables, built-in and custom, across the in-scope workspaces whose tables were read
    - provider_registration_status — Whether the Log Analytics provider (Microsoft.OperationalInsights) is registered on the subscription: registered, not_registered or unknown

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no workspace, such as a mistyped name; null when the workspace list could not be read
    - excluded_workspaces — Number of workspaces left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, no other count includes it, and its tables, data exports and solutions are never read; 0 when the workspace list could not be read
    - in_scope_workspaces — Number of workspaces read and in scope; 0 means none was read or the patterns took out every workspace, which a check can catch by requiring more than 0

    How long are logs kept, and can ingestion stop?
    - min_workspace_retention_in_days — Days of the shortest workspace retention (how long a workspace keeps data available to query by default) across in-scope workspaces; null when none reports one
    - max_workspace_retention_in_days — Days of the longest workspace retention across in-scope workspaces; null when none reports one
    - min_table_total_retention_in_days — Days of the shortest total retention (query retention plus long-term retention) of any table, across in-scope workspaces whose tables were read; null when no table reports one. A table's retention can be set apart from its workspace's
    - workspaces_with_daily_cap — Number of workspaces with a daily ingestion cap (a daily quota other than -1, which means no cap); data arriving after the cap is reached is dropped for the rest of that day

    Who can reach and read the logs?
    - workspaces_public_ingestion_enabled — Number of workspaces that accept data from the public internet (public network access for ingestion is Enabled, or not set, which means Enabled)
    - workspaces_public_query_enabled — Number of workspaces that can be queried from the public internet (public network access for query is Enabled, or not set, which means Enabled)
    - workspaces_resource_or_workspace_access_mode — Number of workspaces in the "resource or workspace permissions" mode, where someone with read access to an Azure resource can read that resource's logs without any right on the workspace (the enableLogAccessUsingOnlyResourcePermissions setting is true, despite its name)
    - workspaces_workspace_only_access_mode — Number of workspaces in the "workspace permissions" mode, where reading logs needs a right on the workspace itself (the setting is false or not set)
    - workspaces_local_auth_disabled — Number of workspaces with shared-key (local) authentication turned off, so callers must sign in with Entra ID; not set means shared keys still work

    Are logs exported?
    - workspaces_with_data_exports — Number of workspaces with at least one data export rule, enabled or not
    - total_data_exports — Number of data export rules across in-scope workspaces, enabled or not

    Is Microsoft Sentinel onboarded?
    - sentinel_onboarded_workspaces — Number of workspaces with Sentinel onboarded, meaning the SecurityInsights solution is switched on in the workspace
    - sentinel_onboarded — True if at least one in-scope workspace has Sentinel onboarded; false if none does or none was read, including when a resource_exclusions pattern takes out the workspace Sentinel is onboarded to, and when the solutions couldn't be read (the run then fails); never null
