name: azure_databricks_workspace_configuration
version: 0.2.0
description: >
  For each Azure Databricks workspace in the subscription, reports the network
  isolation and encryption posture: whether the control plane allows public network
  access, whether secure cluster connectivity (no public IP) is enabled, whether the
  workspace is injected into a customer-managed VNet, whether managed-disk encryption
  uses a customer-managed key from Key Vault (with the key name, version, vault URI
  and rotation flag), and the workspace SKU — the tier gates the isolation features.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Databricks workspace is listed under excluded with the
      pattern and left out of every count and verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_databricks_workspace_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-MAT
  - KSI-CNA-ULN
  - KSI-SVC-SIN
  - KSI-SVC-ASM

evidence_set:
  reference_id: EVD-AZURE-DBRICKS-CONFIG
  name: Azure Databricks Workspace Configuration
  instructions: >
    Script: azure/databricks_workspace_configuration/fetcher.py. Azure SDK calls: resource.providers.get("Microsoft.Databricks"),
    then azure-mgmt-databricks AzureDatabricksManagementClient
    workspaces.list_by_subscription(). Reader is sufficient — both are GETs, and no
    Databricks workspace-API call is made.

    Workspaces the resource_exclusions patterns take out are listed under results.excluded instead,
    each with the pattern that matched; every count and percentage covers only the workspaces that
    stayed.

    Which resources are left out of scope?
      - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every workspace is in scope
      - resource_exclusion_patterns_unmatched — List of configured patterns that matched no workspace, such as a mistyped name
      - excluded_databricks_workspaces — Number of workspaces left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them
      - in_scope_databricks_workspaces — Number of workspaces read and in scope; 0 means none was read or the patterns took out every workspace, which a check can catch by requiring more than 0
