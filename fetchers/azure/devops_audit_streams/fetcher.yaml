name: azure_devops_audit_streams
version: 0.1.0
description: >
  For one Azure DevOps organization: whether auditing is on (from the Log
  Audit Events policy when the token can read it, else from the audit log's
  newest change to that policy or its newest event), every audit stream with
  its target type, status and reason, and last update, and the newest event in
  the 90-day audit log. For an Azure Monitor Logs stream, whether the
  workspace's AzureDevOpsAuditing table received this organization's rows in
  the window. Stream tokens and keys are never written.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_devops_audit_streams.json
  aggregation: per_target

target_schema:
  organization_url:
    type: string
    required: true
    env: AZURE_DEVOPS_ORG_URL
    description: >
      Azure DevOps organization URL, e.g. https://dev.azure.com/contoso (a
      legacy https://contoso.visualstudio.com URL also works).

config_schema:
  audit_window_days:
    type: integer
    required: false
    default: 7
    env: AZURE_DEVOPS_AUDIT_WINDOW_DAYS
    description: >
      How many days back an Azure Monitor Logs stream's AzureDevOpsAuditing
      rows are counted, and how recent the newest audit event must be to show
      auditing is on when neither the policy nor a logged change to it can be
      read (a scoped PAT cannot read the policy).

secrets:
  - name: pat
    env: AZURE_DEVOPS_PAT
    per_target: true
    required: false
    description: >
      Read-only personal access token with the Read Audit Log scope
      (vso.auditlog), from a user with the View audit log permission. A scoped
      PAT cannot read the Log Audit Events policy (401 with vso.auditlog and
      every other scope tried), so auditing is judged from the audit log (its
      newest change to that policy, else its newest event) and the run notes
      the 401. Optional: without it the fetcher signs in as the ambient Entra
      identity (az login, managed or workload identity, or the category's
      service principal added to the organization), which needs View audit log
      and reads the policy itself. The Azure Monitor ingestion check always
      uses the ambient Azure credential (see _categories/azure.yaml) and needs
      Log Analytics Reader on the stream's workspace.

ksis:
  - KSI-MLA-LET      # Logging event types — ADO audit events are logged and exported past ADO's 90 days

evidence_set:
  reference_id: EVD-AZURE-DEVOPS-AUDIT-STREAMS
  name: Azure DevOps Audit Streams
  instructions: >
    Script: azure/devops_audit_streams/fetcher.py. Azure DevOps REST: OrganizationPolicy
    Policy.LogAuditEvents (an Entra login reads it, a PAT gets 401; then its
    newest logged change, else any event in the window; see auditing.source),
    auditservice _apis/audit/streams and _apis/audit/auditlog, ignoring
    audit-log reads. consumerInputs keep only URL, host, workspace and tenant
    identifiers. Azure Monitor Logs streams: this organization's
    organization-level AzureDevOpsAuditing rows over the window (project rows:
    project_rows_unattributed), expected only after an organization-level
    event newer than the stream.
    Needs: View audit log (PAT: vso.auditlog); Log Analytics Reader.
