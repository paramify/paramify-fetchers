name: azure_devops_audit_streams
version: 0.1.1
description: >-
  Shows whether an Azure DevOps organization records audit events and streams them to a destination that keeps them beyond Azure DevOps' 90 days.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_devops_audit_streams.json
  aggregation: per_target

target_schema:
  organization_url:
    type: string
    required: true
    env: AZURE_DEVOPS_ORG_URL
    description: >
      Azure DevOps organization URL, e.g. https://dev.azure.com/contoso (a
      legacy https://contoso.visualstudio.com URL also works).

config_schema:
  audit_window_days:
    type: integer
    required: false
    default: 7
    env: AZURE_DEVOPS_AUDIT_WINDOW_DAYS
    description: >
      How many days back an Azure Monitor Logs stream's AzureDevOpsAuditing
      rows are counted, and how recent the newest audit event must be to show
      auditing is on when neither the policy nor a logged change to it can be
      read (a scoped PAT cannot read the policy).

secrets:
  - name: pat
    env: AZURE_DEVOPS_PAT
    per_target: true
    required: false
    description: >
      Read-only personal access token with the Read Audit Log scope
      (vso.auditlog, which Microsoft's REST reference gives for listing streams;
      vso.auditstreams_manage is only for changing them), from a user with the
      View audit log and Manage audit
      streams permissions; listing streams needs Manage audit streams, as no
      read-only permission exists, and without it the stream fields are null
      and the run is not_authorized. A scoped
      PAT cannot read the Log Audit Events policy (401 with vso.auditlog and
      every other scope tried), so auditing is judged from the audit log (its
      newest change to that policy, else its newest event) and the run notes
      the 401. Optional: without it the fetcher signs in as the ambient Entra
      identity (az login, managed or workload identity, or the category's
      service principal added to the organization), which needs the same two
      permissions and reads the policy itself. The Azure Monitor ingestion
      check always uses the ambient Azure credential (see _categories/azure.yaml) and needs
      Log Analytics Reader on the stream's workspace.

ksis:
  - KSI-MLA-LET      # Logging event types — ADO audit events are logged and exported past ADO's 90 days

evidence_set:
  reference_id: EVD-AZURE-DEVOPS-AUDIT-STREAMS
  name: Azure DevOps Audit Streams
  instructions: |
    Script: azure/devops_audit_streams/fetcher.py

    Access: A user with the View audit log and Manage audit streams permissions, signed in with a personal access token that has Read Audit Log (vso.auditlog), or with Entra ID when no token is set. Listing audit streams needs Manage audit streams, as Azure DevOps has no read-only permission for it; without it, the stream fields are null and the run is not_authorized. Only the Entra sign-in can read the Log Audit Events policy; with a token, auditing is judged from the audit log. Optional: Log Analytics Reader on an Azure Monitor Logs stream's workspace, for the ingestion check.

    Commands Executed:
    - GET _apis/connectionData — identifies the signed-in user (token or Entra ID)
    - GET _apis/OrganizationPolicy/Policies/Policy.LogAuditEvents — whether auditing is on (best effort; a token gets 401)
    - GET _apis/audit/streams — every audit stream and its status
    - GET _apis/audit/auditlog (last 90 days, paged) — the newest audit events, and the newest logged change to the Log Audit Events policy; reads of the audit log itself are ignored
    - GET Microsoft.OperationalInsights/workspaces/{name} (per Azure Monitor Logs stream whose workspace is named by resource id) — its workspace id
    - KQL on AzureDevOpsAuditing (per workspace) — whether this organization's events arrived in the window

    Output: azure_devops_audit_streams_<organization>.json — whether auditing is on, each audit stream with its destination (endpoint identifiers only, never tokens or keys) and status, for Azure Monitor Logs streams whether this organization's events are arriving, and the newest audit log events.

    Summary fields:

    Is auditing on?
    - auditing_enabled — True if auditing is on; false if it is off; null if none of the sources below shows it. Read from the Log Audit Events policy when the sign-in can (Entra ID); otherwise from the newest logged change to that policy; with no logged change, true if the audit log shows an event other than a read of the log within the audit window (default 7 days)
    - newest_audit_event — Time of the newest audit event in the last 90 days, ignoring reads of the audit log; null if the audit log couldn't be read or holds none

    Are audit events streamed somewhere that keeps them?
    - streams — Number of audit streams; null if the streams couldn't be listed
    - streams_delivering — Number of audit streams that are enabled or backfilling; null if the streams couldn't be listed
    - streams_not_delivering — List of audit streams (by name, or id) that are disabled, deleted or otherwise not delivering; null if the streams couldn't be listed
    - streams_by_target — Number of audit streams for each destination type (Azure Monitor Logs, Splunk, Azure Event Grid, or the type Azure DevOps reports for any other, unknown when it reports none); null if the streams couldn't be listed

    Are the streamed events actually arriving?
    - azure_monitor_streams_with_rows — Number of Azure Monitor Logs streams whose workspace has received this organization's audit events in the audit window; null if the streams couldn't be listed or such a stream's workspace couldn't be checked
    - azure_monitor_streams_missing_rows — Number of delivering Azure Monitor Logs streams whose workspace has none of this organization's events in the audit window, although an organization-level event newer than the stream and more than an hour old should have arrived; null if the streams couldn't be listed or such a stream's workspace couldn't be checked
