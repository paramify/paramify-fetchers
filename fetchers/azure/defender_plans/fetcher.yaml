name: azure_defender_plans
version: 0.2.0
description: >
  Every Microsoft Defender for Cloud pricing plan on the subscription (Servers,
  Storage Accounts, Containers, SQL, Key Vault, App Services, …) with its pricing
  tier, sub-plan (for example Servers P1 or P2, DefenderForStorageV2), when it was
  last set to Standard (enablement_time, null when Azure does not report it, which
  can be the case for every plan, so it is not a reliable signal for a validator),
  remaining free trial, resource coverage status, whether it is enforced on child
  resources, whether it is deprecated and what replaces it,
  whether it is inherited and from which scope, and which per-plan extensions
  (agentless VM scanning, vulnerability assessment, file integrity monitoring, …)
  are enabled — the evidence that vulnerability detection and host/container
  hardening are switched on, not merely available. The summary lists the enabled
  plans with their sub-plans and enablement times (the enablement times can all be
  null), the plans not enabled, enabled
  plans that do not cover every resource (an enabled plan Azure reports no
  coverage status for is listed there as unknown, never read as covered), and
  deprecated and inherited plans; it
  makes no judgement about which plans a system needs. A subscription that never
  registered the Microsoft.Security resource provider reports
  provider_registration_status: not_registered, which is valid evidence ("not in
  use") rather than a collection failure. Needs Reader (or Security Reader).
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_defender_plans.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.
secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-EIS      # Automated services persistently assess resource security — which Defender plans are enabled
  - KSI-SVC-EIS      # Evaluate and improve security — the per-plan vulnerability-scanning extensions

evidence_set:
  reference_id: EVD-AZURE-DEFENDER
  name: Microsoft Defender for Cloud Plans
  instructions: >
    Script: azure/defender_plans/fetcher.py. Azure SDK call (azure-mgmt-security SecurityCenter):
    pricings.list(scope_id="subscriptions/<subscription_id>") (api-version
    2024-01-01) for every Defender for Cloud plan, with its tier, sub-plan,
    enablement time, coverage status, enforcement, deprecation and inheritance.