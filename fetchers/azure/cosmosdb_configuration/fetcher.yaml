name: azure_cosmosdb_configuration
version: 0.2.1
description: >
  For each Azure Cosmos DB database account in the subscription, reports the API kind
  and the posture around it: whether the data is encrypted with a customer-managed Key
  Vault key (key_vault_key_uri), whether key-based local auth is disabled so only
  Entra ID + RBAC can be used, whether the virtual-network firewall is on and the
  virtual-network / IP allow-lists behind it, public network access, the minimum TLS
  version, private endpoint connections, automatic failover and multi-region writes,
  and the backup policy mode (Continuous ⇒ point-in-time restore). Cosmos DB is always
  encrypted at rest, so the evidence that varies is CMK vs platform-managed, not
  "encrypted: true/false".
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Cosmos DB database account is listed under excluded with
      the pattern and left out of every count and verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_cosmosdb_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # customer-managed Key Vault key, minimum TLS version
  - KSI-IAM-SNU   # key-based local auth disabled so only Entra ID + RBAC can be used
  - KSI-CNA-RNT   # virtual-network firewall and the VNet / IP allow-lists
  - KSI-CNA-OFA   # automatic failover and multi-region writes
  - KSI-RPL-ABO   # backup policy mode — Continuous implies point-in-time restore

evidence_set:
  reference_id: EVD-AZURE-COSMOSDB-CONFIG
  name: Azure Cosmos DB Account Configuration
  instructions: >
    Script: azure/cosmosdb_configuration/fetcher.py. Azure SDK call (azure-mgmt-cosmosdb CosmosDBManagementClient):
    database_accounts.list(). Records each account's encryption key source,
    authentication, network exposure, failover and backup policy.

    Cosmos DB accounts the resource_exclusions patterns take out are listed under results.excluded
    instead, each with the pattern that matched; every count and percentage covers only the accounts
    that stayed.

    Which resources are left out of scope?
      - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every account is in scope
      - resource_exclusion_patterns_unmatched — List of configured patterns that matched no Cosmos DB account, such as a mistyped name, or null when the list could not be read
      - excluded_cosmosdb_accounts — Number of accounts left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them; null if the list couldn't be read
      - in_scope_cosmosdb_accounts — Number of accounts read and in scope; null if the list couldn't be read, and 0 means there are none or the patterns took out every account, which a check can catch by requiring more than 0
