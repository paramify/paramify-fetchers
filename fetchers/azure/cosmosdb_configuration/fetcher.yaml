name: azure_cosmosdb_configuration
version: 0.2.1
description: >-
  Shows whether each Cosmos DB account uses a customer-managed key, Entra-only sign-in, private network access and TLS 1.2, and can fail over and restore to a point in time.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Cosmos DB database account is listed under excluded with
      the pattern and left out of every count and verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_cosmosdb_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # customer-managed Key Vault key, minimum TLS version
  - KSI-IAM-SNU   # key-based local auth disabled so only Entra ID + RBAC can be used
  - KSI-CNA-RNT   # virtual-network firewall and the VNet / IP allow-lists
  - KSI-CNA-OFA   # automatic failover and multi-region writes
  - KSI-RPL-ABO   # backup policy mode — Continuous implies point-in-time restore

evidence_set:
  reference_id: EVD-AZURE-COSMOSDB-CONFIG
  name: Azure Cosmos DB Account Configuration
  instructions: |
    Script: azure/cosmosdb_configuration/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.DocumentDB") — tells "not registered" from "no accounts"
    - database_accounts.list() — every Cosmos DB account with its encryption key, sign-in, network, TLS, failover and backup settings; account keys are never requested

    Output: azure_cosmosdb_configuration_<subscription>.json — each Cosmos DB account with its API kind, encryption key, sign-in setting, network exposure (virtual network and IP allow-lists, private endpoints), minimum TLS version, failover settings and backup policy, plus the accounts left out and why.

    Summary fields:

    Which accounts are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every account is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no Cosmos DB account, such as a mistyped name; null when the account list could not be read
    - excluded_cosmosdb_accounts — Number of accounts left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them; null when the account list could not be read
    - in_scope_cosmosdb_accounts — Number of accounts read and in scope; null when the account list could not be read; 0 means there are none or the patterns took out every account, which a check can catch by requiring more than 0

    Which accounts were checked?
    - total_cosmosdb_accounts — Number of in-scope Cosmos DB accounts; every count and percentage below covers only these; reads 0, not null, when the account list could not be read, so read it together with in_scope_cosmosdb_accounts
    - accounts_by_kind — Number of accounts of each API kind Azure reports; a kind with no accounts is left out, and another kind Azure reports gets its own entry:
      - GlobalDocumentDB (the NoSQL API; Table, Cassandra and Gremlin accounts also report this kind)
      - MongoDB (the API for MongoDB)
      - Parse (the Parse Server kind)
      - unknown (no kind returned)
    - provider_registration_status — Whether Microsoft.DocumentDB is registered on the subscription: registered, not_registered or unknown

    Is data encrypted with a customer-managed key?
    - customer_managed_key_accounts — Number of accounts encrypted with a customer-managed key (a Key Vault key URI is set); Cosmos DB always encrypts data at rest, so what varies is whose key
    - platform_managed_key_accounts — Number of accounts encrypted with the Microsoft-managed key (no Key Vault key URI)
    - cmk_percentage — Percentage of accounts encrypted with a customer-managed key = customer_managed_key_accounts / total_cosmosdb_accounts × 100 (a whole number, rounded down; reads 0 when total_cosmosdb_accounts is 0)

    Is sign-in limited to Entra ID?
    - local_auth_disabled_accounts — Number of accounts with key-based (local) authentication disabled, so data can be reached only with Microsoft Entra ID sign-in and role assignments; a setting Azure didn't return counts as enabled

    Is the account kept off the public internet?
    - public_network_access_disabled_accounts — Number of accounts with public network access Disabled or SecuredByPerimeter (behind a Network Security Perimeter)
    - virtual_network_filter_accounts — Number of accounts with the virtual network firewall on, so only the listed virtual networks and IP ranges can connect; a setting Azure didn't return counts as off
    - private_endpoint_accounts — Number of accounts with at least one private endpoint connection, in any state

    Do connections use TLS 1.2 or later?
    - recommended_minimal_tls_accounts — Number of accounts whose minimum TLS version is 1.2 or 1.3 (no setting means TLS 1.0 is accepted, so it doesn't count)

    Will the account survive a region loss and restore to a point in time?
    - automatic_failover_accounts — Number of accounts with automatic (service-managed) failover to another region on; a setting Azure didn't return counts as off
    - multiple_write_location_accounts — Number of accounts that accept writes in more than one region; a setting Azure didn't return counts as off
    - continuous_backup_accounts — Number of accounts on the Continuous backup policy, which can restore to any point in time; accounts on Periodic backup (scheduled snapshots) or with no policy returned don't count
