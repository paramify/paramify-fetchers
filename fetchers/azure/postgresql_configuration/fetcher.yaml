name: azure_postgresql_configuration
version: 0.2.1
description: >
  For each Azure Database for PostgreSQL flexible server in the subscription,
  reports the settings that show transport encryption, authentication, audit logging
  and durability are configured: require_secure_transport, Entra ID (Azure AD)
  authentication with the administrators assigned to it, the log_checkpoints /
  log_connections / log_disconnections / connection_throttling / log_retention_days
  server parameters, every firewall rule with the 0.0.0.0-0.0.0.0 "allow all Azure
  services" pseudo-rule flagged, geo-redundant backup, and the high-availability
  mode. Server parameters are read by name rather than dumped, because a flexible
  server exposes several hundred of them and the rest are engine tunables.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching PostgreSQL flexible server is listed under excluded with
      the pattern and left out of every count and verdict; its
      parameters, firewall rules and Entra administrators are not
      read. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_postgresql_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # require_secure_transport
  - KSI-CNA-RNT   # firewall rules, allow-all-Azure pseudo-rule flagged
  - KSI-IAM-APM   # Entra ID authentication and its assigned administrators
  - KSI-MLA-LET   # log_checkpoints / log_connections / log_disconnections / log_retention_days
  - KSI-RPL-ABO   # geo-redundant backup
  - KSI-CNA-OFA   # high-availability mode

evidence_set:
  reference_id: EVD-AZURE-POSTGRESQL-CONFIG
  name: Azure PostgreSQL Flexible Server Configuration
  instructions: >
    Script: azure/postgresql_configuration/fetcher.py. Azure SDK calls (azure-mgmt-postgresqlflexibleservers
    PostgreSQLManagementClient): servers.list_by_subscription(), configurations.get()
    for six named server parameters, firewall_rules.list_by_server(),
    administrators_microsoft_entra.list_by_server().

    Servers the resource_exclusions patterns take out are listed under results.excluded instead,
    each with the pattern that matched; they get no per-server reads and every count, percentage and
    firewall-rule or administrator total covers only the servers that stayed.

    Which resources are left out of scope?
      - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every server is in scope
      - resource_exclusion_patterns_unmatched — List of configured patterns that matched no PostgreSQL server, such as a mistyped name, or null when the list could not be read
      - excluded_postgresql_servers — Number of servers left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them; null if the list couldn't be read
      - in_scope_postgresql_servers — Number of servers read and in scope; null if the list couldn't be read, and 0 means there are none or the patterns took out every server, which a check can catch by requiring more than 0
