name: azure_postgresql_configuration
version: 0.1.0
description: >
  For each Azure Database for PostgreSQL flexible server in the subscription,
  reports the settings that show transport encryption, authentication, audit logging
  and durability are configured: require_secure_transport, Entra ID (Azure AD)
  authentication with the administrators assigned to it, the log_checkpoints /
  log_connections / log_disconnections / connection_throttling / log_retention_days
  server parameters, every firewall rule with the 0.0.0.0-0.0.0.0 "allow all Azure
  services" pseudo-rule flagged, geo-redundant backup, and the high-availability
  mode. Server parameters are read by name rather than dumped, because a flexible
  server exposes several hundred of them and the rest are engine tunables.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_postgresql_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # require_secure_transport
  - KSI-CNA-RNT   # firewall rules, allow-all-Azure pseudo-rule flagged
  - KSI-IAM-APM   # Entra ID authentication and its assigned administrators
  - KSI-MLA-LET   # log_checkpoints / log_connections / log_disconnections / log_retention_days
  - KSI-RPL-ABO   # geo-redundant backup
  - KSI-CNA-OFA   # high-availability mode

evidence_set:
  reference_id: EVD-AZURE-POSTGRESQL-CONFIG
  name: Azure PostgreSQL Flexible Server Configuration
  instructions: >
    Script: azure/postgresql_configuration/fetcher.py. Azure SDK calls (azure-mgmt-postgresqlflexibleservers
    PostgreSQLManagementClient): servers.list_by_subscription(), configurations.get()
    for six named server parameters, firewall_rules.list_by_server(),
    administrators_microsoft_entra.list_by_server().
