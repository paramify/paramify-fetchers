name: azure_entra_privileged_roles
version: 0.3.0
description: >-
  Lists every activated directory role and who holds it, counting Global Administrators, the users, groups and apps holding privileged admin roles, and any holder not on an approved list.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_entra_privileged_roles.json
  aggregation: per_target

target_schema:
  # Microsoft Graph data is TENANT-scoped, so the fanout unit here is the tenant,
  # not the subscription: one target per Entra tenant. Two targets differing only
  # by subscription_id would collect byte-identical evidence.
  tenant_id:
    type: string
    required: false
    env: AZURE_TENANT_ID
    description: >
      Entra tenant id to collect from, and the discriminator for this fetcher's
      output filename. Optional — omit to use whichever tenant the ambient
      credential authenticates into, in which case the tenant is read back from
      Microsoft Graph's organization endpoint.
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id. Optional and NOT used to scope collection — Graph data
      is tenant-wide. Set it only to correlate this tenant's evidence with the
      subscription-scoped Azure evidence from the same manifest; it is recorded in
      the payload metadata and nowhere else.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-tenant runs.

config_schema:
  approved_principal_ids:
    type: string
    required: false
    env: AZURE_ENTRA_APPROVED_PRINCIPAL_IDS
    description: >
      Object ids of the users, groups and service principals approved to hold a
      privileged directory role, separated by commas, spaces or newlines (case
      doesn't matter). A group's id approves the group, not its members; a
      service principal's is its object id, not its app id. Unset or empty: no
      list, and unapproved_privileged_principals reads null. An entry that isn't
      an object id fails the run.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-IAM-ELP

evidence_set:
  reference_id: EVD-AZURE-ENTRA-PRIV-ROLES
  name: Microsoft Entra ID Privileged Directory Roles
  instructions: |
    Script: azure/entra_privileged_roles/fetcher.py

    Access: Microsoft Graph application permission RoleManagement.Read.Directory (Directory.Read.All also covers it). Optional: Organization.Read.All; without it, the tenant's name and domain read null, and a target must name its tenant_id or the run fails.

    Commands Executed:
    - GET /organization — the tenant's name and domain
    - GET /directoryRoles — the directory roles activated in the tenant
    - GET /directoryRoles/{id}/members (per role) — who holds each role
    - GET /directoryRoles/{id}/members/microsoft.graph.servicePrincipal (per role) — the service principals holding each role, which the members list can leave out

    Output: azure_entra_privileged_roles_<tenant>.json — each activated directory role, whether it is privileged or Global Administrator, whether its reads succeeded, and the users, groups and apps holding it, plus the list of role names counted as privileged and, when an approved list is set, its object ids and each privileged-role holder not on it.

    Summary fields:

    What was checked?
    - total_directory_roles_activated — Number of directory roles activated in the tenant (a role is activated the first time anyone is assigned it; a role never assigned isn't listed and has no holders); null if the role list couldn't be read
    - roles_with_no_members — Number of activated roles nobody holds now (assigned once, then removed); null if the role list or any role's members or service principals couldn't be read
    - total_role_assignments — Number of active role assignments across all activated roles, one per role per holder (user, group, app or other account); PIM-eligible holders who haven't activated aren't listed; null if the role list or any role's members or service principals couldn't be read
    - distinct_principals_with_a_directory_role — Number of distinct users, groups, apps and other accounts holding at least one directory role; null if the role list or any role's members or service principals couldn't be read

    How many Global Administrators are there?
    - global_administrator_count — Number of users, groups and apps holding Global Administrator directly; a group counts once, not its members; null if the role list or the Global Administrator role's members or service principals couldn't be read
    - global_administrator_role_activated — True if the Global Administrator role is activated in the tenant; false if not, and global_administrator_count is 0; null if the role list couldn't be read

    Who holds privileged roles?
    - privileged_roles_activated — Number of activated privileged roles: the 24 built-in roles treated as tenant-wide admin power, such as Global Administrator, Privileged Role Administrator, User Administrator, Security Administrator and Global Reader (the full list is in the output); null if the role list couldn't be read
    - privileged_roles_with_members — Number of privileged roles at least one user, group or app holds; null if the role list or any privileged role's members or service principals couldn't be read
    - privileged_role_names_assigned — List of the privileged role names at least one user, group or app holds; null if the role list or any privileged role's members or service principals couldn't be read
    - privileged_role_assignments — Number of assignments to privileged roles, one per role per holder; null if the role list or any privileged role's members or service principals couldn't be read
    - distinct_privileged_principals — Number of distinct users, groups, apps and other accounts holding at least one privileged role; null if the role list or any privileged role's members or service principals couldn't be read
    - privileged_assignment_percentage — Percentage of role assignments that are to privileged roles = privileged_role_assignments / total_role_assignments × 100 (a whole number, 0–100); 0 when total_role_assignments is 0; null if the role list or any role's members or service principals couldn't be read

    What kind of account holds privileged power?
    - users_in_privileged_roles — Number of privileged-role assignments held by users; a user holding two privileged roles counts twice; null if the role list or any privileged role's members couldn't be read
    - groups_in_privileged_roles — Number of privileged-role assignments held by groups; members of the group aren't counted; null if the role list or any privileged role's members couldn't be read
    - service_principals_in_privileged_roles — Number of privileged-role assignments held by service principals (apps and managed identities); null if the role list or any privileged role's service principals couldn't be read

    Is every privileged role held by an approved user, group or app?
    - approved_principals_configured — True if the approved_principal_ids setting holds at least one entry; false if it is unset or empty
    - unapproved_privileged_principals — Number of distinct users, groups, apps and other accounts holding at least one privileged role whose object id isn't in approved_principal_ids (a group is matched by its own id and its members aren't read; only active holders are listed, so a PIM-eligible holder who hasn't activated isn't checked); null if no list is set, an entry isn't an object id, or the role list or any privileged role's members or service principals couldn't be read
