name: azure_entra_groups
version: 0.1.0
description: >
  Every Microsoft Entra ID group with its members and owners, its kind (security,
  Microsoft 365, mail-enabled security, distribution), whether it can hold
  directory roles, whether its membership is set by a rule (dynamic) or by hand
  (assigned), and whether it is synced from on-premises Active Directory.
  Summarizes role-assignable groups, paused membership rules, groups with no
  owner, and groups holding guests, disabled users, nested groups or service
  principals.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_entra_groups.json
  aggregation: per_target

target_schema:
  # Microsoft Graph data is TENANT-scoped, so the fanout unit here is the tenant,
  # not the subscription: one target per Entra tenant.
  tenant_id:
    type: string
    required: false
    env: AZURE_TENANT_ID
    description: >
      Entra tenant id to collect from, and the discriminator for this fetcher's
      output filename. Optional — omit to use whichever tenant the ambient
      credential authenticates into, in which case the tenant is read back from
      Microsoft Graph's organization endpoint.
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id. Optional and NOT used to scope collection — Graph data
      is tenant-wide. Set it only to correlate this tenant's evidence with the
      subscription-scoped Azure evidence from the same manifest; it is recorded in
      the payload metadata and nowhere else.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-tenant runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

# Microsoft Graph permissions (application permission, admin consent):
#   GroupMember.Read.All   — /groups with members and owners.
#   User.Read.All          — the members' and owners' sign-in names, account state and
#                            guest status; without it Graph returns users as an id
#                            only and the guest and disabled-user figures read null.
#   Member.Read.Hidden     — optional; members of groups with hidden membership.
#   Organization.Read.All  — optional; the tenant name/domain recorded as provenance.
# Directory.Read.All, or the Directory Readers role, covers all but Member.Read.Hidden.
# A denied read is recorded as an API failure and the run exits non-zero.

ksis:
  - KSI-IAM-AAM

evidence_set:
  reference_id: EVD-AZURE-ENTRA-GROUPS
  name: Microsoft Entra ID Groups, Members and Owners
  instructions: >
    Script: fetcher.py. Microsoft Graph calls (permissions: GroupMember.Read.All and
    User.Read.All, or Directory.Read.All): GET /groups with
    $select=id,displayName,description,groupTypes,securityEnabled,mailEnabled,isAssignableToRole,membershipRule,membershipRuleProcessingState,onPremisesSyncEnabled,visibility,createdDateTime
    and $expand=members; GET /groups with $expand=owners (Graph allows one $expand
    per request); GET /organization. $expand returns at most 20 members or owners,
    so a group at 20 is re-read via /groups/{id}/owners, or for members via the beta
    /groups/{id}/members, because v1.0 /members leaves out service principals. All
    collections paged via @odata.nextLink. A group's kind comes from groupTypes
    (Unified is Microsoft 365) and the securityEnabled and mailEnabled flags;
    DynamicMembership in groupTypes means membership is set by membershipRule.
