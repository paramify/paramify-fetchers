name: azure_devops_work_items
version: 0.3.0
description: >-
  Shows Azure DevOps change and security work items with state, owner, planned
  date and approval: the share of changes approved, self-approvals, linked
  changes, and open, overdue or unassigned security work.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py
  timeout: 3600

output:
  type: json
  path: azure_devops_work_items.json
  aggregation: per_target

target_schema:
  organization_url:
    type: string
    required: true
    env: AZURE_DEVOPS_ORG_URL
    description: >
      The Azure DevOps organization, as https://dev.azure.com/<org>,
      https://<org>.visualstudio.com or just <org>. One target per organization.
  projects:
    type: string
    required: false
    env: AZURE_DEVOPS_PROJECTS
    description: >
      Comma-separated project names or ids to limit collection to. Optional:
      omit to collect every project the identity can read. A named project that is
      missing fails the run.

config_schema:
  work_item_types:
    type: string
    required: false
    default: Change Request
    env: AZURE_DEVOPS_WORK_ITEM_TYPES
    description: >
      Comma-separated work item types that record changes, such as
      "Change Request" or "Change Request,Release". Their approval and linked changes are
      checked. "none" selects no type, leaving only tagged items.
  work_item_tags:
    type: string
    required: false
    default: Security
    env: AZURE_DEVOPS_WORK_ITEM_TAGS
    description: >
      Comma-separated tags that mark security work, of any type. Their owner,
      priority and planned date are checked. "none" selects no tag.
  lookback_days:
    type: integer
    required: false
    default: 90
    env: AZURE_DEVOPS_LOOKBACK_DAYS
    description: >
      Selected items changed in this many days are collected, along with every
      selected item still open however old.
  approval_states:
    type: string
    required: false
    default: Approved
    env: AZURE_DEVOPS_APPROVAL_STATES
    description: >
      Comma-separated states whose entry counts as approval, from each item's
      state history. Only these count: an item that reached a state such as
      "Awaiting Approval" but never one of these reads as unapproved. A later
      move back to a state before these (in the type's workflow order), or to a
      state or with a reason naming Rejected, withdraws every approval before it.
      "none" leaves approval to comments alone.
  approval_pattern:
    type: string
    required: false
    default: '^\W*approved\b[^?\n]*$'
    env: AZURE_DEVOPS_APPROVAL_PATTERN
    description: >
      A regular expression, matched without regard to case against each line of
      a comment's text, with quoted text (a blockquote or a line starting ">")
      left out; a matching comment counts as approval by its author. The
      default matches a line that starts with "Approved" and has no question
      mark, so "Approved?" doesn't count. With approval_mentions on, the
      mentions a line starts with are dropped before matching. The text itself
      is never written.
  approval_mentions:
    type: boolean
    required: false
    default: false
    env: AZURE_DEVOPS_APPROVAL_MENTIONS
    description: >
      true to let a comment line that starts with one or more @mentions count
      as approval, by matching approval_pattern against the rest of the line:
      with the default pattern, "@Jane Doe approved", "@A @B approved" and
      "@Jane Doe, approved" count, while "@Jane Doe not approved", "@Jane Doe
      approved?" and "@Jane Doe please approve" don't. Every mention then reads
      as the word @mention, so a pattern never sees the names: one made with
      the mention picker (or a markdown comment's @<id>) whatever the name's
      length, and an @word typed as plain text, which is one word long. Quoted
      text and a later move back or rejection still don't count. Off (false)
      by default, as an @mention may only ask someone to approve; off, comments
      are read as in 0.1.0, where a markdown comment's "@<id> approved" already
      counted. azure_change_work_items reads each item's approval from this
      evidence, so with this on, a mention approval counts there too.
  approval_types:
    type: string
    required: false
    env: AZURE_DEVOPS_APPROVAL_TYPES
    description: >
      Comma-separated work item types, from work_item_types, whose items need
      an approval, matched without regard to case; the approved percentage
      counts only finished change items of these types. Items of the other selected
      types are still collected and their approval recorded. Leave empty for
      every type in work_item_types to need one. A name that isn't in
      work_item_types is bad_config, since the type meant would need no
      approval.
  approval_field:
    type: string
    required: false
    env: AZURE_DEVOPS_APPROVAL_FIELD
    description: >
      The reference name of a person (identity) field that records who
      approved an item, such as Custom.ChangeApprover, not its display name. Set,
      it is read from each item and its updates, and the item records whom it
      names and when it was filled; it counts as approval only when
      approval_source is field or both. A filled field approves the item, by
      the person it names, from the first update that filled it since it was
      last cleared; clearing it withdraws the approval, while a move back or a
      rejection doesn't. Empty, as by default, reads no field. A name that
      isn't a reference name (a dotted name without spaces) is bad_config.
  approval_source:
    type: string
    required: false
    default: states_and_comments
    env: AZURE_DEVOPS_APPROVAL_SOURCE
    description: >
      Where an item's approval comes from: states_and_comments (a move into
      approval_states or a comment matching approval_pattern, as before this
      setting), field (a filled approval_field only), or both (whichever came
      first). field and both need approval_field, or the run is bad_config.
      Items created before approval_field_from are judged by
      approval_before_field instead.
  approval_field_from:
    type: string
    required: false
    env: AZURE_DEVOPS_APPROVAL_FIELD_FROM
    description: >
      The date (YYYY-MM-DD, UTC) from which approval_source judges items, for
      an approval field brought in after older items were approved another
      way: an item created before it is judged by approval_before_field.
      Empty, as by default, judges every item by approval_source. Set while
      approval_source is states_and_comments, it is bad_config, since the
      field would never count.
  approval_before_field:
    type: string
    required: false
    default: states_and_comments
    env: AZURE_DEVOPS_APPROVAL_BEFORE_FIELD
    description: >
      How an item created before approval_field_from is judged:
      states_and_comments (approval states and comments only, as before the
      field), both (those or a filled approval_field, whichever came first),
      or exclude (no approval is read, and the item is left out of every
      approval figure). Used only when approval_field_from is set: both or
      exclude without it is bad_config.
  emergency_types:
    type: string
    required: false
    env: AZURE_DEVOPS_EMERGENCY_TYPES
    description: >
      Comma-separated work item types, from work_item_types, whose approval
      may come after the change, such as an emergency change approved once
      deployed; matched without regard to case. They still need an approval,
      but a linked changeset made before it is listed in
      emergency_items_approved_after_change instead of
      change_items_changed_before_approval. Empty or "none", as by default,
      names no type. azure_change_work_items has a setting of the same name
      for its own check, set on its own entry. A name that isn't in
      work_item_types is bad_config.

secrets:
  - name: pat
    env: AZURE_DEVOPS_PAT
    per_target: true
    required: false
    description: >
      Read-only personal access token for the organization with Work Items
      (Read), Code (Read) for linked TFVC changesets, and Project and Team
      (Read). Optional: without it the fetcher signs in as the ambient Entra
      identity (az login, managed or workload identity, or the category's
      service principal added to the organization), which needs to be a reader
      in each project. Collection covers what the signed-in identity can see,
      recorded as metadata.collecting_identity.

ksis:
  - KSI-CMT-LMC      # change records: approval, planned date, status and the changes linked to them
  - KSI-PIY-RES      # security backlog: owner, priority, due date and status

evidence_set:
  reference_id: EVD-AZURE-DEVOPS-WORK-ITEMS
  name: Azure DevOps Work Items
  instructions: |
    Script: azure/devops_work_items/fetcher.py

    Access: A personal access token for the organization with Work Items, Code, and Project and Team (all Read), or an Entra identity that is a reader in each project.

    Commands Executed:
    - GET _apis/connectionData — identifies the signed-in user
    - GET _apis/projects — lists projects
    - GET {project}/_apis/wit/workitemtypes (per project) — the project's work item types, their states and which states are finished, and which types define approval_field
    - POST {project}/_apis/wit/wiql (per project) — a read-only query for the selected types or tags, changed in the window or still open
    - POST {project}/_apis/wit/workitemsbatch (200 at a time) — each item's fields, approval_field among them, and links; an item the query listed but this doesn't return is a failure
    - GET {project}/_apis/wit/workItems/{id}/updates (per item) — its state history and when approval_field was filled or cleared, to see when and by whom it was approved and whether that approval was withdrawn
    - GET {project}/_apis/wit/workItems/{id}/comments (per item) — who commented when, and whether a comment, quoted text left out (and leading @mentions, if approval_mentions is on), matches the approval pattern; the text is not kept
    - GET _apis/tfvc/changesets/{id} (per linked changeset) — when the change was made and by whom

    Output: azure_devops_work_items_<organization>.json — every selected work item with its title, type, state and reason, priority, severity, tags, area and iteration paths, who created, last changed, is assigned, resolved and closed it, its created, changed, activated, resolved, closed and planned dates, state history with each move's reason, whether it needs an approval and whether its type may be approved after the change, the person approval_field names and when it was filled, which route judged its approval, the approval in effect (state, comment or field, with who and when) and whether its creator gave it, and its linked changesets, commits, pull requests and builds; plus each project's states for the types collected, and the linked changesets' dates and authors.

    Summary fields:

    What was collected?
    - lookback_days — Number of days back that changed items are collected; open items are collected however old
    - work_item_types — List of work item types that record changes, as configured
    - work_item_tags — List of tags that mark security work, as configured
    - approval_types — List of configured work item types whose items need an approval: the approval_types setting, or every type in work_item_types when it's empty
    - approval_mentions — True if a comment line that starts with @mentions counts as approval when the rest of the line matches the approval pattern (the approval_mentions setting); false if such a line counts only when the whole line matches
    - approval_source — One of states_and_comments (approval is a move into an approval state or a matching comment), field (approval is a filled approval_field) or both (either, whichever came first): the approval_source setting, which judges every item created on or after approval_field_from
    - approval_field — The configured reference name of the person field that records an approver (the approval_field setting); null if none is set
    - approval_field_from — Time of the approval_field_from setting (midnight UTC on that date), from which approval_source judges items; items created before it follow approval_before_field; null if it isn't set, so approval_source judges every item
    - approval_before_field — One of states_and_comments, both or exclude: how items created before approval_field_from are judged (the approval_before_field setting), exclude leaving them out of every approval figure; null if approval_field_from isn't set
    - emergency_types — List of configured work item types whose approval may come after the change (the emergency_types setting)
    - projects_collected — Number of projects whose work items were read
    - work_item_types_missing — List of configured types that at least one collected project doesn't define; null if the project list or a project's items couldn't be read
    - work_items_total — Number of work items collected; null if the project list or a project's items couldn't be read
    - work_items_by_type — Number of work items of each type; null if the project list or a project's items couldn't be read
    - work_items_by_state_category — Number of work items in each state category (Proposed, InProgress, Resolved, Completed, Removed, or unknown for a state its type no longer defines); null if the project list or a project's items couldn't be read
    - work_item_states_undefined — List of item states, as type: state, that the item's type no longer defines (as after a process change); an item in such a state has an unknown state category and counts as neither open nor finished; null if the project list or a project's items couldn't be read
    - work_items_open — Number of work items in a state whose category isn't Completed or Removed; null if the project list or a project's items couldn't be read
    - approval_history_collected — True if every item's state history and comments were read; false if not, or if the project list or a project's items couldn't be read

    Are changes approved and linked to what they changed?
    - change_items — Number of items of a configured change type; null if the project list or a project's items couldn't be read
    - change_items_finished — Number of change items in a Completed state; a Removed (cancelled) item isn't finished; null if the project list or a project's items couldn't be read
    - change_items_approved — Number of change items approved by the route that judges them (approval_source, or approval_before_field for items created before approval_field_from): moved into one of the configured approval states (a state such as Awaiting Approval doesn't count), or given a comment matching the approval pattern (after any leading @mentions when approval_mentions is on), and not withdrawn since by a move back to a state before the approval states or to a state or with a reason naming Rejected; or, where the field counts, approval_field filled and not cleared since; null if the project list, a project's items or a change item's history or comments couldn't be read
    - change_items_approved_by_field — Number of change items whose approval in effect is a filled approval_field, as approval_source or approval_before_field allows; null if the project list, a project's items or a change item's history or comments couldn't be read
    - change_items_left_out_of_approval — Number of change items created before approval_field_from while approval_before_field is exclude, so no approval is read for them and every approval figure leaves them out; null if the project list or a project's items couldn't be read
    - approval_field_types_missing — List of approval_types that a project defines without approval_field, such as after a misspelt reference name, so their items can't be approved by the field; null if approval_field isn't set, the project list or a project's items couldn't be read, or a project's type listing didn't name its fields
    - finished_change_items_needing_approval — Number of finished change items (in a Completed state) of a type in approval_types, other than refused ones and change_items_left_out_of_approval; open items are left out, as they may still be waiting on their approval, and so are refused items (whose state or reason names Rejected, or whose state is named Removed), which were turned down rather than left unapproved; null if the project list or a project's items couldn't be read
    - finished_change_items_needing_approval_approved — Number of finished change items of a type in approval_types, other than refused ones, that are approved, as change_items_approved counts approval; null if the project list, a project's items or a change item's history or comments couldn't be read
    - finished_change_items_approved_percentage — Percentage of finished change items needing an approval (refused ones left out) that are approved = finished_change_items_needing_approval_approved / finished_change_items_needing_approval × 100 (a whole number, 0–100); 0 when finished_change_items_needing_approval is 0; null if the project list, a project's items or a change item's history or comments couldn't be read. A finished item whose approval was withdrawn and not given again counts in the denominator only
    - finished_change_items_without_approval — List of finished change items (by id) never approved, or whose approval was withdrawn and not given again, of every change type and including refused ones (but not change_items_left_out_of_approval), so it doesn't line up with finished_change_items_approved_percentage, which counts only the approval types and leaves refused items out; null if the project list, a project's items or a change item's history or comments couldn't be read
    - change_items_approved_by_requester — List of change items (by id) whose approval in effect (the first since any withdrawal) was given by the person who created the item; null if the project list, a project's items or a change item's history or comments couldn't be read
    - change_items_with_linked_changes — Number of change items linked to a TFVC changeset, Git commit or pull request; null if the project list or a project's items couldn't be read
    - finished_change_items_without_linked_change — List of finished change items (by id) linked to no changeset, commit or pull request; null if the project list or a project's items couldn't be read
    - change_items_linked_changes_checked — Number of approved change items with linked changes that the three checks below cover: every linked change is a TFVC changeset that was read, and the approval's time is known. An item linked to a Git commit or pull request isn't covered, as their dates and authors aren't read; null if the project list, a project's items or a change item's history or comments couldn't be read
    - change_items_changed_before_approval — List of change items (by id), other than those of emergency_types, with a linked changeset made before the item's approval in effect; null if the project list, a project's items or a change item's history or comments couldn't be read, or if any approved change item with linked changes isn't covered by change_items_linked_changes_checked
    - emergency_items_approved_after_change — List of change items (by id) of emergency_types with a linked changeset made before the item's approval in effect, which these types allow; null if the project list, a project's items or a change item's history or comments couldn't be read, or if any approved change item with linked changes isn't covered by change_items_linked_changes_checked
    - change_items_approved_by_change_author — List of change items (by id) approved by the person who made or checked in a linked changeset; null if the project list, a project's items or a change item's history or comments couldn't be read, or if any approved change item with linked changes isn't covered by change_items_linked_changes_checked

    Is security work owned and on time?
    - tagged_items_open — Number of open items with a configured tag; null if the project list or a project's items couldn't be read
    - tagged_items_open_by_priority — Number of open tagged items at each priority (1 highest), with unset for none; null if the project list or a project's items couldn't be read
    - tagged_items_overdue — List of open tagged items (by id) whose planned date (due, target or finish date, the first one set) has passed; null if the project list or a project's items couldn't be read
    - tagged_items_overdue_high_priority — List of overdue tagged items (by id) at priority 1 or 2, or severity 1 or 2; null if the project list or a project's items couldn't be read
    - tagged_items_open_unassigned — List of open tagged items (by id) assigned to no one; null if the project list or a project's items couldn't be read
    - tagged_items_open_without_planned_date — Number of open tagged items with no due, target or finish date; null if the project list or a project's items couldn't be read

    What isn't collected?
    - not_collected — What the fetcher deliberately doesn't collect, by area: descriptions, comment text and attachments; the dates and authors of linked Git commits and pull requests; items outside the selection; and projects the identity can't see
