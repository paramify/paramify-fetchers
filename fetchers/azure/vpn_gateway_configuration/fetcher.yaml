name: azure_vpn_gateway_configuration
version: 0.2.1
description: >
  For every Azure VPN Gateway (Microsoft.Network/virtualNetworkGateways) in the subscription,
  reports its type, SKU, generation, active-active and BGP settings and its point-to-site
  configuration (tunnel protocols and authentication types). For every gateway connection
  (site-to-site IPsec, VNet-to-VNet) it reports the IKE version, any custom IPsec/IKE policy
  with its encryption, integrity, DH and PFS groups and SA lifetimes, flags weak algorithms, and
  for every local network gateway its peer address and address space. Pre-shared keys, RADIUS
  secrets and authorization keys are never requested or recorded.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching virtual network gateway, connection or local network
      gateway is listed under excluded with the pattern and left out of
      every count and verdict. A connection also leaves with the gateway
      it belongs to (reason gateway_matched); a connection to an
      excluded second gateway or local network gateway stays in scope
      with its verdict unchanged.
      A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_vpn_gateway_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN   # IPsec/IKE encryption of site-to-site and remote-access links
  - KSI-CNA-RNT   # which peers and address spaces the gateways accept traffic from
  - KSI-CNA-OFA   # active-active gateways

evidence_set:
  reference_id: EVD-AZURE-VPN-GATEWAY-CONFIG
  name: Azure VPN Gateway and Connection Configuration
  instructions: >
    Script: azure/vpn_gateway_configuration/fetcher.py. Azure SDK calls: azure-mgmt-resource resource_groups.list(), then per resource
    group azure-mgmt-network virtual_network_gateways.list(rg), virtual_network_gateway_connections.list(rg)
    and local_network_gateways.list(rg) (these operations have no subscription-wide list), then
    virtual_network_gateway_connections.get(rg, name) per connection, because connection_status is only
    populated on a GET. Fields are
    projected from an allow-list, so shared_key, authorization_key and radius_server_secret never enter
    the evidence. An IPsec or Vnet2Vnet connection is ikev2 when connection_protocol is IKEv2, false when IKEv1, and null
    (counted in summary.ike_version_unknown_connections) when Azure returns no protocol.
    explicit_ipsec_policy is true when the connection carries a custom ipsecPolicies entry;
    ipsec_policy_source is "custom" or "azure_default". weak_ipsec_algorithms lists any DES, 3DES, MD5,
    SHA1, DH group 1/2 or PFS None in a custom policy; with no custom policy it lists the weak proposals
    of Azure's default policy, whose IKEv2 main mode uses only DH Group 2
    (learn.microsoft.com/azure/vpn-gateway/vpn-gateway-about-compliance-crypto), suffixed
    "(azure_default)". p2s_enabled is true only when the gateway has a client address pool: the list call
    returns a placeholder point-to-site block on gateways that never configured it.
    summary.ikev2_connections over summary.ipsec_connections is the IKEv2 coverage.
    provider_registration_status is for Microsoft.Network.
    Virtual network gateways, connections and local network gateways the
    patterns take out are listed under results.excluded, each with the
    pattern that matched; a connection removed with its gateway also names
    matched_id. A connection to an excluded local network gateway keeps
    its verdict. Summary fields: resource_exclusion_patterns (the
    configured patterns, empty when none are set),
    resource_exclusion_patterns_unmatched (patterns that matched nothing,
    such as a mistyped name, or null when a resource list couldn't be read), excluded_virtual_network_gateways,
    excluded_connections, excluded_local_network_gateways (how many the
    patterns took out) and in_scope_virtual_network_gateways,
    in_scope_connections, in_scope_local_network_gateways (how many
    stayed); all of them are null when the resource group list couldn't be
    read. results.excluded is always present, empty when nothing is
    excluded.
