name: azure_network_security_groups
version: 0.4.0
description: >
  Every network security group in the subscription with its inline security rules
  (destination port range, protocol, source address prefix, access, direction) —
  enough to show whether an admin port such as SSH (22) or RDP (3389) is reachable
  from the Internet — plus every virtual network with its subnets' NSG association
  and DDoS protection state, which shows whether segmentation is actually enforced
  rather than merely defined. Each NSG also carries its default (platform) rules, so
  the effective outbound posture is visible: an NSG whose first catch-all Internet
  rule is the default AllowInternetOutBound permits all egress. Every network
  interface is listed with its effective NSG coverage, on the NIC itself or
  inherited from its subnet; a NIC with neither is unfiltered. Each workload subnet
  says which other subnets in its VNet can reach it on every port (east-west
  segmentation), through both subnets' NSGs.
category: azure

config_schema:
  resource_exclusions:
    type: string
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns separated by commas or spaces, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching network security group, virtual network (with its
      subnets) or network interface is listed under excluded with the pattern and
      left out of every count and verdict; a network interface also leaves with
      the virtual network its subnets sit in. NIC coverage and east-west
      segmentation are still worked out against every NSG and virtual network, so
      an in-scope subnet or NIC whose NSG is excluded keeps its verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Can be ${env:VAR}. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_network_security_groups.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-RNT
  - KSI-CNA-MAT   # admin ports open to the Internet, and east-west reach between subnets (lateral movement)
  - KSI-CNA-ULN   # subnet and NIC NSG association: which workloads sit behind a filter
  - KSI-CNA-DFP   # inbound and outbound rules, default rules included, define what traffic is allowed

evidence_set:
  reference_id: EVD-AZURE-NSG
  name: Azure Network Security Groups
  instructions: >
    Script: azure/network_security_groups/fetcher.py. Azure SDK calls (azure-mgmt-network NetworkManagementClient):
    network_security_groups.list_all() (security_rules and default_security_rules),
    virtual_networks.list_all(), network_interfaces.list_all(). Reader is
    sufficient — all GETs. East-west segmentation, per workload subnet in
    virtual_networks[].subnets: for every other workload subnet in the same VNet
    (GatewaySubnet, AzureBastionSubnet, AzureFirewallSubnet,
    AzureFirewallManagementSubnet and RouteServerSubnet are left out on both ends),
    the source subnet's NSG outbound rules and this subnet's NSG inbound rules,
    custom and default, are each walked in priority order. An Allow decides once it
    covers every port (protocol any or TCP; a rule's port ranges are merged, so
    0-1023 plus 1024-65535 counts, and port 0 is not needed) and touches both
    address ranges; a Deny
    decides only once it covers every port and protocol and all of both ranges
    (the VirtualNetwork tag, * and 0.0.0.0/0 cover any subnet of the VNet; CIDRs
    are matched, adjacent ones merged). A subnet with no NSG does not filter. The
    pair is "segmented" when either side reaches a Deny first, "open" when both
    allow, and "undetermined" when the deciding Allow is scoped to an application
    security group or an NSG is in another subscription. Narrower allows (one port,
    one protocol) do not make a pair open: segmentation here means no other tier
    reaches the subnet on every port. east_west_segmentation is "segmented" (open
    from none), "partial" (open from some), "unsegmented" (open from all),
    "undetermined", or "no_peer_subnets"; open_from_subnets,
    segmented_from_subnets and undetermined_from_subnets name the other subnets.
    Not considered: NIC-level NSGs (they can only narrow a pair this calls open),
    traffic within one subnet, and peered VNets. Maps to KSI-CNA-RNT / KSI-CNA-MAT /
    KSI-CNA-ULN / KSI-CNA-DFP.

    Resources the resource_exclusions patterns take out are listed under excluded
    instead, each with the pattern that matched; a network interface taken out with
    its virtual network names that network in matched_id.

    Which resources are left out of scope?
      - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
      - resource_exclusion_patterns_unmatched — List of configured patterns that matched no network security group, virtual network or network interface, such as a mistyped name
      - excluded_network_security_groups — Number of network security groups left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes them
      - excluded_virtual_networks — Number of virtual networks left out of scope the same way; their subnets leave with them and no subnet count includes them
      - excluded_network_interfaces — Number of network interfaces left out of scope the same way, or because a pattern matched the virtual network their subnets sit in
      - in_scope_network_security_groups — Number of network security groups read and in scope; 0 means none was read or the patterns took out every one, which a check can catch by requiring more than 0
      - in_scope_virtual_networks — Number of virtual networks read and in scope
      - in_scope_network_interfaces — Number of network interfaces read and in scope
