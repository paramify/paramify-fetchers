name: azure_network_security_groups
version: 0.5.2
description: >-
  Shows which security group rules expose admin ports or allow Internet egress, which subnets and network interfaces sit behind a group, and whether subnets are separated from each other.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching network security group, virtual network (with its
      subnets) or network interface is listed under excluded with the pattern and
      left out of every count and verdict; a network interface also leaves with
      the virtual network its subnets sit in, or with a subnet an id: pattern
      names (the subnet itself still counts with its virtual network). NIC
      coverage and east-west segmentation are still worked out against every NSG
      and virtual network, so an in-scope subnet or NIC whose NSG is excluded
      keeps its verdict. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_network_security_groups.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-RNT
  - KSI-CNA-MAT   # admin ports open to the Internet, and east-west reach between subnets (lateral movement)
  - KSI-CNA-ULN   # subnet and NIC NSG association: which workloads sit behind a filter
  - KSI-CNA-DFP   # inbound and outbound rules, default rules included, define what traffic is allowed

evidence_set:
  reference_id: EVD-AZURE-NSG
  name: Azure Network Security Groups
  instructions: |
    Script: azure/network_security_groups/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Network") — tells "networking not in use" from "nothing there"
    - network_security_groups.list_all() — every group with its custom and default security rules
    - virtual_networks.list_all() — every virtual network with its subnets, their NSG association and its DDoS protection setting
    - network_interfaces.list_all() — every network interface with its own NSG and the subnets it sits in

    Output: azure_network_security_groups_<subscription>.json — each network security group with its rules, each virtual network with its subnets and east-west verdicts, each network interface with its NSG coverage, plus the resources left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no network security group, virtual network, network interface or subnet a network interface sits in, such as a mistyped name; null when a list could not be read
    - excluded_network_security_groups — Number of network security groups left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes it
    - excluded_virtual_networks — Number of virtual networks left out of scope the same way; their subnets leave with them and no subnet count includes them
    - excluded_network_interfaces — Number of network interfaces left out of scope the same way, or because a pattern matched the virtual network their subnets sit in or one of those subnets; each names that network or subnet in matched_id
    - in_scope_network_security_groups — Number of network security groups read and in scope; 0 means none was read or the patterns took out every group
    - in_scope_virtual_networks — Number of virtual networks read and in scope
    - in_scope_network_interfaces — Number of network interfaces read and in scope

    Which groups and rules were checked?
    - total_network_security_groups — Number of in-scope network security groups
    - total_security_rules — Number of custom security rules across those groups; the platform's default rules are not counted
    - inbound_allow_rules — Number of custom inbound rules whose access is Allow
    - provider_registration_status — Whether the networking provider (Microsoft.Network) is registered on the subscription: registered, not_registered or unknown

    Is any admin port reachable from the Internet?
    - internet_sourced_allow_rules — Number of custom inbound Allow rules whose source is Internet, * or 0.0.0.0/0
    - ssh_open_to_internet_groups — Number of groups with a custom inbound Allow rule over TCP or any protocol that covers port 22 from the Internet, *, or 0.0.0.0/0
    - rdp_open_to_internet_groups — Number of groups with a custom inbound Allow rule over TCP or any protocol that covers port 3389 from the Internet, *, or 0.0.0.0/0

    Is Internet egress restricted?
    - outbound_allow_rules — Number of custom outbound rules whose access is Allow
    - outbound_deny_rules — Number of custom outbound rules whose access is Deny
    - internet_destined_allow_rules — Number of custom outbound Allow rules whose destination includes Internet, * or 0.0.0.0/0
    - unrestricted_internet_outbound_groups — Number of groups that allow all-port Internet egress: the first catch-all rule toward the Internet (outbound, protocol *, port * or 0-65535, destination Internet, * or 0.0.0.0/0), custom and default rules in priority order, is an Allow, which an untouched group's default AllowInternetOutBound is; a Deny on fewer ports or protocols, or one limited to some sources (its source is not *, 0.0.0.0/0, Internet or VirtualNetwork), does not count as an override, and the walk goes on to the next rule
    - restricted_internet_outbound_groups — Number of groups that are not in unrestricted_internet_outbound_groups: a catch-all Deny toward the Internet whose source covers everything (*, 0.0.0.0/0, Internet or VirtualNetwork) comes first, or no catch-all rule toward it is found

    Which virtual networks and subnets sit behind a group?
    - total_virtual_networks — Number of in-scope virtual networks
    - ddos_protected_virtual_networks — Number of in-scope virtual networks with DDoS protection turned on
    - total_subnets — Number of subnets on in-scope virtual networks
    - subnets_with_nsg — Number of subnets with a network security group attached
    - subnets_without_nsg — Number of subnets with no network security group attached
    - subnet_nsg_coverage_percentage — Percentage of subnets with a group attached = subnets_with_nsg / total_subnets × 100 (rounded down to a whole number); 0 when total_subnets is 0

    Is every network interface filtered?
    - total_network_interfaces — Number of in-scope network interfaces
    - nics_with_nic_nsg — Number of network interfaces with a group attached to the interface itself
    - nics_protected_by_subnet_nsg_only — Number of network interfaces with no group of their own that sit in a subnet with one; a subnet in another subscription is not read and gives no protection
    - nics_without_any_nsg — Number of network interfaces with neither their own group nor a subnet group, so nothing filters their traffic
    - nic_nsg_coverage_percentage — Percentage of network interfaces filtered by a group on the interface or its subnet = (total_network_interfaces - nics_without_any_nsg) / total_network_interfaces × 100 (rounded down to a whole number); 0 when total_network_interfaces is 0

    Can workload subnets reach each other on every port?
    - workload_subnets_by_east_west_segmentation — Number of workload subnets for each east-west result; GatewaySubnet, AzureBastionSubnet, AzureFirewallSubnet, AzureFirewallManagementSubnet and RouteServerSubnet are left out. Each side of a pair, the source subnet's outbound rules and the destination's inbound rules, custom and default in priority order, is decided by its first Allow over TCP or any protocol on every port that touches both subnets, or Deny on every port and protocol that covers both; the pair is open when both sides allow (a subnet with no group allows) and segmented when either denies. Network interface groups (which can only narrow a pair), traffic within one subnet and peered networks are not considered:
      - segmented (no other workload subnet in its network reaches it on every port)
      - partial (some other subnets reach it on every port)
      - unsegmented (every other workload subnet reaches it on every port)
      - undetermined (no subnet is open, but one pair cannot be decided, because the deciding Allow names an application security group or a group lives in another subscription)
      - no_peer_subnets (it is the only workload subnet in its network)
    - east_west_subnet_pairs — Number of source and destination subnet pairs judged, across all workload subnets
    - open_east_west_subnet_pairs — Number of those pairs where the source reaches the destination on every port
