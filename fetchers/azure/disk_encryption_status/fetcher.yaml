name: azure_disk_encryption_status
version: 0.2.1
description: >-
  Shows which key encrypts each managed disk at rest, whether Azure Disk Encryption is on, whether the disk is attached, and how exposed its export path is.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope,
      as case-insensitive glob patterns listed in the manifest, each with
      a prefix: rg:<resource group> (read from the resource id),
      location:<region> (the region's name without spaces, such as
      eastus2; a resource with no location never matches one) or
      id:<resource id> (also matches that resource's child resources). *
      matches any run of characters and ? one character. A matching
      managed disk is listed under excluded with the pattern and left out
      of every count and verdict. A disk encryption set in an excluded
      group is only a reference: it does not change an in-scope disk's
      verdict. A pattern without one of these prefixes fails the run. Set
      it once under platforms.azure.config for every Azure fetcher that
      has this field; fetchers without it ignore it. Each item is a pattern, or a pattern with a reason. Empty: every resource
      is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_disk_encryption_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-SIN

evidence_set:
  reference_id: EVD-AZURE-DISK-ENC
  name: Azure Managed Disk Encryption
  instructions: |
    Script: azure/disk_encryption_status/fetcher.py

    Access: Reader on the subscription. Key material is never read: only the Key Vault that holds a disk's Azure Disk Encryption keys is recorded, not the key or secret addresses.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Compute") — tells "no managed disks in use" from "no disks"
    - disks.list() — every managed disk with its encryption, attachment, size, SKU and export settings

    Output: azure_disk_encryption_status_<subscription>.json — every managed disk's encryption at rest, Azure Disk Encryption state, attachment and export exposure, plus the disks left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every disk is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no disk, such as a mistyped name; null when the disk list could not be read
    - excluded_disks — Number of disks left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, and no other count includes it; null when the disk list could not be read
    - in_scope_disks — Number of disks read and in scope; null when the disk list could not be read; 0 means there are none or the patterns took out every disk, which a check can catch by requiring more than 0

    Which disks exist?
    - total_disks — Number of in-scope managed disks, attached or not; reads 0, not null, when the disk list could not be read, so read it together with in_scope_disks
    - attached_total_disks — Number of disks attached to a virtual machine (the disk names an owner or a shared-disk owner list)
    - unattached_total_disks — Number of disks attached to no virtual machine; they still hold the data of the machine they were detached from
    - provider_registration_status — Whether the Compute provider (Microsoft.Compute) is registered on the subscription: registered, not_registered or unknown
    - os_disks — Number of disks that report an operating system type
    - data_disks — Number of disks that report no operating system type

    Which key encrypts the disks at rest?
    - customer_managed_key_disks — Number of disks encrypted with a customer-managed key (an encryption type other than the platform key, held in a disk encryption set). Managed disks are always encrypted at rest, so this is what varies
    - platform_managed_key_disks — Number of disks encrypted with Microsoft's platform-managed key (the default), or reporting no encryption type
    - cmk_percentage — Percentage of disks using a customer-managed key = customer_managed_key_disks / total_disks × 100 (a whole number, rounded down; reads 0 when total_disks is 0)
    - attached_customer_managed_key_disks — Number of attached disks encrypted with a customer-managed key
    - attached_platform_managed_key_disks — Number of attached disks encrypted with the platform-managed key
    - attached_cmk_percentage — Percentage of attached disks using a customer-managed key = attached_customer_managed_key_disks / attached_total_disks × 100 (a whole number, rounded down; reads 0 when attached_total_disks is 0)
    - unattached_customer_managed_key_disks — Number of unattached disks encrypted with a customer-managed key
    - unattached_platform_managed_key_disks — Number of unattached disks encrypted with the platform-managed key
    - unattached_cmk_percentage — Percentage of unattached disks using a customer-managed key = unattached_customer_managed_key_disks / unattached_total_disks × 100 (a whole number, rounded down; reads 0 when unattached_total_disks is 0)
    - double_encryption_disks — Number of disks with double encryption (platform and customer-managed keys together)
    - disk_encryption_set_disks — Number of disks that name a disk encryption set
    - azure_disk_encryption_disks — Number of disks with Azure Disk Encryption (BitLocker or dm-crypt on the guest volume) turned on

    Is the disks' export path restricted?
    - network_access_restricted_disks — Number of disks whose network access policy is DenyAll or AllowPrivate, which keeps a download link off the Internet; AllowAll, the default, is not restricted
