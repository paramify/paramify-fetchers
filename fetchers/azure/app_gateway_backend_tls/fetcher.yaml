name: azure_app_gateway_backend_tls
version: 0.2.1
description: >-
  Shows whether each Application Gateway backend setting encrypts traffic to its backend, validates the backend's certificate and server name, and is used by a routing rule.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching application gateway is listed under excluded with the
      pattern and left out of every count and verdict; its backend
      settings leave with it. The gateway count check against Resource
      Graph still covers every gateway.
      A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_app_gateway_backend_tls.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-SVC-VCM   # gateway-to-backend connections are TLS and the backend certificate is validated
  - KSI-SVC-SIN   # traffic to backends is encrypted in transit

evidence_set:
  reference_id: EVD-AZURE-APPGW-BACKEND-TLS
  name: Azure Application Gateway Backend TLS
  instructions: |
    Script: azure/app_gateway_backend_tls/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Network") — tells "networking not in use" from "no gateways"
    - application_gateways.list_all() — every gateway with its backend settings, probes, trusted root certificates and routing rules
    - Resource Graph count of microsoft.network/applicationgateways — confirms the gateway list is complete; a mismatch is counted again after 30 seconds, and the run fails if it persists

    Output: azure_app_gateway_backend_tls_<subscription>.json — each backend setting (layer 7 HTTP/HTTPS and layer 4 TCP/TLS) with its protocol, certificate validation, pinned roots, probe protocol and the routing rules that use it, plus the gateways left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no application gateway, such as a mistyped name; null when the gateway list could not be read
    - excluded_application_gateways — Number of application gateways left out of scope because a pattern matched; each is listed under excluded with the pattern, its backend settings leave with it, and no other count includes it; null when the gateway list could not be read

    Which gateways and backend settings were checked?
    - in_scope_application_gateways — Number of application gateways read and in scope; null when the gateway list could not be read
    - in_scope_backend_settings — Number of backend settings (how a gateway connects to its backend servers) on in-scope gateways; null when the gateway list could not be read
    - total_application_gateways — Number of in-scope application gateways assessed
    - total_backend_settings — Number of backend settings on in-scope gateways, layer 7 (HTTP/HTTPS) and layer 4 (TCP/TLS)
    - in_use_backend_settings — Number of backend settings that at least one routing rule, URL path map default or path rule references; every count below is out of these in-use settings
    - completeness_match — True if the gateway count matches Resource Graph's count, which still covers every gateway including excluded ones; false if not; null if either count could not be read
    - provider_registration_status — Whether the networking provider (Microsoft.Network) is registered on the subscription: registered, not_registered or unknown

    Is traffic to the backends encrypted?
    - encrypted_in_use — Number of in-use backend settings that connect over HTTPS or TLS
    - plaintext_in_use — Number of in-use backend settings that connect unencrypted (HTTP or TCP)
    - plaintext_probes_in_use — Number of in-use backend settings whose health probe uses HTTP or TCP

    Does the gateway verify backend certificates?
    - certificate_validation_disabled_in_use — Number of in-use encrypted backend settings with the certificate chain and expiry check turned off; layer 4 TLS settings have no such toggle and are never counted
    - sni_validation_disabled_in_use — Number of in-use backend settings with validate_sni set to false, so the backend's server name is not checked
    - insecure_backend_settings_in_use — Number of in-use backend settings that are insecure: not HTTPS or TLS, or certificate validation turned off, or the server name check turned off
