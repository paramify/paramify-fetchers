name: azure_sentinel_incidents
version: 0.2.0
description: >-
  Shows each Sentinel workspace's recent and open incidents with their response
  timeline, entities and owner, plus monthly detection, acknowledgement and
  close times and the open backlog.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_incidents.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  incident_lookback_days:
    type: integer
    required: false
    default: 90
    env: SENTINEL_INCIDENT_LOOKBACK_DAYS
    description: >
      Incidents created within this many days are collected; open incidents are
      collected whatever their age.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-INR-RPI      # Reviewing past incidents — the incident history, monthly metrics and recurrence
  - KSI-MLA-RVL      # Reviewing logs — alerts are triaged, classified and closed
  - KSI-INR-AAR      # After action reports — detection, acknowledgement and close times, tasks and classification comment
  - KSI-IAM-SUS      # Responding to suspicious activity — escalation (owner and severity changes) and close times
  - KSI-CNA-ULN      # Using logical networking — each incident's analytic rules and the hosts and IPs involved

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-INCIDENTS
  name: Azure Sentinel Incidents
  instructions: |
    Script: azure/sentinel_incidents/fetcher.py

    Access: Microsoft Sentinel Reader and Log Analytics Reader on each Sentinel workspace.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - GET Microsoft.OperationalInsights/workspaces — the subscription's Log Analytics workspaces
    - GET Microsoft.SecurityInsights/onboardingStates (per workspace) — finds the Sentinel workspaces
    - GET Microsoft.SecurityInsights/incidents (per workspace) — every incident, with its Defender XDR id and link when it came from there
    - KQL on SecurityIncident, latest row per incident (per workspace) — close times and tasks, which the incident list lacks
    - KQL on SecurityIncident, every row in the lookback (per workspace) — status, owner and severity changes and who made them
    - KQL on SecurityIncident joined to SecurityAlert (per workspace) — the entities on each incident's alerts, up to 25 of each kind, with processes as image name and process id and URLs as scheme and host only
    - GET Microsoft.OperationalInsights/workspaces/tables/SecurityIncident (per workspace) — the table's retention

    Output: azure_sentinel_incidents_<subscription>.json — for each Sentinel workspace, every incident created in the lookback (default 90 days) plus older ones still open, with its severity, status, owner, response timeline and entities, and per month the mean time to detect (first activity, the earliest alert's event, to creation), acknowledge and close, and the open backlog at month end, which is null for month ends older than the SecurityIncident table's retention.

    Summary fields:

    Which workspaces were checked?
    - workspaces_collected — Number of Sentinel workspaces read
    - workspaces_without_sentinel — Number of workspaces skipped because Sentinel isn't turned on

    Are incidents being worked and closed?
    - incidents_in_scope — Number of incidents created in the lookback, plus older incidents still open
    - open_incidents — Number of incidents still open (New or Active)
    - closed_incidents — Number of in-scope incidents that are closed
    - acknowledged_incidents — Number of in-scope incidents with a known acknowledgement time; null if any workspace's SecurityIncident history couldn't be read. An incident is acknowledged at the first update by a person that moves it to Active or Closed or changes its owner, up to its first close, so a reopen never counts. Changes by automation rules or the Defender XDR sync don't count, so incidents worked only in the Defender portal show none; Microsoft doesn't document what a playbook or Logic App writes as the modifier, so their updates count as a person's. Only an incident whose every update was read (created in the lookback and within the SecurityIncident table's retention) can have a known time
    - open_unacknowledged — Number of open incidents whose every update was read and that no person has acknowledged; null if any workspace's SecurityIncident history couldn't be read. Older open incidents aren't counted, since their acknowledgement can't be known
    - recurring_titles — Number of incident titles shared by two or more incidents created in the lookback, counted per workspace and summed, so a title recurring in two workspaces counts twice

    Can every close time be shown?
    - closed_missing_close_time — Number of closed incidents whose close time wasn't found in the SecurityIncident table, even though it should still be within the table's retention; null if any workspace's close times couldn't be read
    - closed_close_time_not_retained — Number of closed incidents whose close record is older than the SecurityIncident table's retention, so the close time is gone; null if any workspace's close times couldn't be read
