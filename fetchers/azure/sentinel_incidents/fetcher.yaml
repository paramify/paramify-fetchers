name: azure_sentinel_incidents
version: 0.1.0
description: >
  For every Microsoft Sentinel workspace in the subscription: the incidents
  created inside the lookback, plus every incident still open however old it
  is. Each carries its severity, status, classification and reason, owner,
  created time, and close time, with hours to close. Per workspace: open
  incidents by severity, the oldest open incident's age, closed incidents left
  Undetermined, and median and maximum time to close. Also a count cross-check
  between the incidents API and the SecurityIncident table.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_incidents.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  incident_lookback_days:
    type: integer
    required: false
    default: 90
    env: SENTINEL_INCIDENT_LOOKBACK_DAYS
    description: >
      Incidents created within this many days are collected; open incidents are
      collected whatever their age.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-INR-RPI      # Reviewing past incidents — the system-of-record incident history
  - KSI-MLA-RVL      # Reviewing logs — alerts are triaged, classified and closed

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-INCIDENTS
  name: Azure Sentinel Incidents
  instructions: >
    Script: fetcher.py. ARM REST per Sentinel workspace: incidents at api-version
    2025-09-01, every nextLink followed. ARM has no close time, so it comes from
    SecurityIncident (arg_max by IncidentName). A closed incident last updated
    before that table's retention is close_time_status not_retained, not
    missing. completeness compares both sources' counts over the span both still
    hold. Descriptions, comments and entities are not collected. Roles: Microsoft
    Sentinel Reader and Log Analytics Reader.
