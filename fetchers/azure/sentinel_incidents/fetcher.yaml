name: azure_sentinel_incidents
version: 0.2.0
description: >-
  Shows each Sentinel workspace's recent and open incidents with their response
  timeline, entities and owner, plus monthly detection, acknowledgement and
  close times and the open backlog.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_incidents.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  incident_lookback_days:
    type: integer
    required: false
    default: 90
    env: SENTINEL_INCIDENT_LOOKBACK_DAYS
    description: >
      Incidents created within this many days are collected; open incidents are
      collected whatever their age.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-INR-RPI      # Reviewing past incidents — the incident history, monthly metrics and recurrence
  - KSI-MLA-RVL      # Reviewing logs — alerts are triaged, classified and closed
  - KSI-INR-AAR      # After action reports — detection, acknowledgement and close times, tasks and classification comment
  - KSI-IAM-SUS      # Responding to suspicious activity — escalation (owner and severity changes) and close times
  - KSI-CNA-ULN      # Using logical networking — each incident's analytic rules and the hosts and IPs involved
  - KSI-PIY-RES      # Reviewing executive support — open backlog per month by severity and owner

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-INCIDENTS
  name: Azure Sentinel Incidents
  instructions: |
    Script: azure/sentinel_incidents/fetcher.py

    Access: Microsoft Sentinel Reader and Log Analytics Reader.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - GET Microsoft.OperationalInsights/workspaces and onboardingStates (per workspace) — finds the Sentinel workspaces
    - GET Microsoft.SecurityInsights/incidents — every incident, with its Defender XDR id and link when it came from there
    - KQL on SecurityIncident — every update row: close times, status, owner and severity changes, and tasks, which the incident list lacks
    - KQL on SecurityIncident joined to SecurityAlert — the entities on each incident's alerts
    - GET Microsoft.OperationalInsights/workspaces/tables/SecurityIncident — the table's retention

    Output: azure_sentinel_incidents_<subscription>.json — for each Sentinel workspace, every incident in the window with its severity, status, owner, response timeline and entities, and detection, acknowledgement and close times per month.

    Summary fields:

    Which workspaces were checked?
    - workspaces_collected — Number of Sentinel workspaces read
    - workspaces_without_sentinel — Number of workspaces skipped because Sentinel isn't turned on

    Are incidents being worked and closed?
    - incidents_in_scope — Number of incidents created in the lookback period (default 90 days), plus older incidents still open
    - open_incidents — Number of incidents still open (New or Active)
    - closed_incidents — Number of in-scope incidents that are closed
    - acknowledged_incidents — Number of in-scope incidents with a known acknowledgement time. An incident is acknowledged at its first update that moves it to Active or gives it an owner; one already acknowledged before the incident log's oldest retained update has no known time
    - open_unacknowledged — Number of open incidents still New with no owner
    - recurring_titles — Number of incident titles shared by two or more in-scope incidents, up to 25 per workspace

    Can every close time be shown?
    - closed_missing_close_time — Number of closed incidents whose close time wasn't found, even though it should still be within retention
    - closed_close_time_not_retained — Number of closed incidents whose close record is older than the incident log's retention, so the close time is gone
