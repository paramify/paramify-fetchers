name: azure_sentinel_incidents
version: 0.3.1
description: >-
  Shows each Sentinel workspace's recent and open incidents with their response
  timeline, entities and owner, plus monthly detection, acknowledgement and
  close times and the open backlog.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_incidents.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  incident_lookback_days:
    type: integer
    required: false
    default: 90
    env: SENTINEL_INCIDENT_LOOKBACK_DAYS
    description: >
      Incidents created within this many days are collected; open incidents are
      collected whatever their age.

  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching Log Analytics workspace is listed under excluded
      with the pattern and left out of every count, workspaces_without_sentinel
      included; its incidents are not listed and its SecurityIncident and
      SecurityAlert tables are not queried. Incidents in an in-scope workspace
      are never dropped by the entities they name. An excluded workspace gets no reads, not even its Sentinel onboarding state;
      a SENTINEL_WORKSPACES filter applies first, and a workspace it names that a
      pattern takes out fails the run as bad_config, and every incident count
      reads null, as when a named workspace isn't found. A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every resource is in scope.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-INR-RPI      # Reviewing past incidents — the incident history, monthly metrics and recurrence
  - KSI-MLA-RVL      # Reviewing logs — alerts are triaged, classified and closed
  - KSI-INR-AAR      # After action reports — detection, acknowledgement and close times, tasks and classification comment
  - KSI-IAM-SUS      # Responding to suspicious activity — escalation (owner and severity changes) and close times
  - KSI-CNA-ULN      # Using logical networking — each incident's analytic rules and the hosts and IPs involved

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-INCIDENTS
  name: Azure Sentinel Incidents
  instructions: |
    Script: azure/sentinel_incidents/fetcher.py

    Access: Microsoft Sentinel Reader and Log Analytics Reader on each Sentinel workspace.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - GET Microsoft.OperationalInsights/workspaces — the subscription's Log Analytics workspaces
    - GET Microsoft.SecurityInsights/onboardingStates (per workspace) — finds the Sentinel workspaces
    - GET Microsoft.SecurityInsights/incidents (per workspace) — every incident, with its Defender XDR id and link when it came from there
    - KQL on SecurityIncident, latest row per incident (per workspace) — close times and tasks, which the incident list lacks
    - KQL on SecurityIncident, every row in the lookback (per workspace) — status, owner and severity changes and who made them
    - KQL on SecurityAlert for the alert ids SecurityIncident lists (per workspace) — the entities on each incident's alerts, up to 25 of each kind, with processes as image name and process id and URLs as scheme and host only
    - GET Microsoft.OperationalInsights/workspaces/tables/SecurityIncident (per workspace) — whether the table exists, and its retention

    Output: azure_sentinel_incidents_<subscription>.json — for each Sentinel workspace, every incident created in the lookback (default 90 days) plus older ones still open, with its severity, status, owner, response timeline and entities, and per month the mean time to detect (first activity, the earliest alert's event, to creation), acknowledge and close, and the open backlog at month end, which is null for month ends older than the SecurityIncident table's retention. Monthly detection, acknowledgement and close times cover the in-scope incidents only, while the backlog covers every incident, so an older incident closed in the lookback leaves the backlog without counting in that month's close time, and monthly MTTR may read low. In a workspace connected to Microsoft Defender XDR, analysts usually work incidents in the Defender portal, and SecurityIncident then shows mostly the XDR sync's updates, which aren't a person's, so those incidents read as not acknowledged, time to acknowledge has few or no values, and an open one can count in open_unacknowledged while someone works it. Their acknowledgement times would need Defender XDR's incident activity history, which neither SecurityIncident nor Graph's security/incidents (its current state and comments, but not when an incident was first activated or assigned) provides. Workspaces the resource_exclusions patterns take out are listed under excluded instead, each with the pattern that matched.

    Summary fields:

    Which workspaces were checked?
    - workspaces_collected — Number of Sentinel workspaces read. If the workspace list or a check for Sentinel fails, or a workspace named in SENTINEL_WORKSPACES isn't found or is taken out by a resource exclusion pattern, every incident count below is null rather than 0
    - workspaces_without_sentinel — Number of workspaces skipped because Sentinel isn't turned on

    Which workspaces are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every workspace is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no workspace, such as a mistyped name; null if the workspace list couldn't be read
    - excluded_workspaces — Number of workspaces left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern and isn't read, and no other count includes them; null if the workspace list couldn't be read
    - in_scope_workspaces — Number of workspaces found and in scope, Sentinel or not; 0 means none was found or the patterns took out every workspace, which a check can catch by requiring more than 0; null if the workspace list couldn't be read

    Are incidents being worked and closed?
    - incidents_in_scope — Number of incidents created in the lookback, plus older incidents still open; null if any workspace's incidents couldn't be read
    - open_incidents — Number of incidents still open (New or Active); null if any workspace's incidents couldn't be read
    - closed_incidents — Number of in-scope incidents that are closed; null if any workspace's incidents couldn't be read
    - acknowledged_incidents — Number of in-scope incidents with a known acknowledgement time; null if any workspace's incidents or SecurityIncident history couldn't be read. An incident is acknowledged at the first update by a person that moves it to Active or Closed or gives it an owner or a different one (by object id when both updates have one), up to its first close, so a reopen never counts; a person creating it already Active or owned acknowledges it at creation. Updates with no modifier, or by automation rules, playbooks, alert grouping, Fusion, incident creation or the Defender XDR sync, don't count, so incidents worked only in the Defender portal show none; any other modifier counts as a person. Only incidents with a creation row read in the lookback can have a known time
    - open_unacknowledged — Number of open incidents whose every update was read and that no person has acknowledged; null if any workspace's incidents or SecurityIncident history couldn't be read. Every update was read when the incident was created in the lookback and within the SecurityIncident table's retention, its creation row was read, and its latest row matches its current status, owner and severity (allowing for a change made in the last hour). Open incidents whose updates weren't all read aren't counted; open_new_unowned_history_incomplete counts the ones still New with no owner. Only updates up to the first close count, so an incident automation closed and a person then reopened and worked counts as unacknowledged
    - open_new_unowned_history_incomplete — Number of open incidents still New with no owner whose updates weren't all read: created before the SecurityIncident history read starts (the lookback or the table's retention, whichever is later), an update missing from it, its creation row not ingested yet, or its SecurityIncident history unreadable; null if any workspace's incidents couldn't be read. Taken from the incident list, and never overlapping open_unacknowledged, which counts only incidents whose every update was read
    - recurring_titles — Number of incident titles shared by two or more incidents created in the lookback, counted per workspace and summed, so a title recurring in two workspaces counts twice; null if any workspace's incidents couldn't be read

    Can every close time be shown?
    - closed_missing_close_time — Number of closed incidents whose close time wasn't found in the SecurityIncident table, even though it should still be within the table's retention; null if any workspace's incidents or close times couldn't be read
    - closed_close_time_not_retained — Number of closed incidents whose close record is older than the SecurityIncident table's retention, so the close time is gone; null if any workspace's incidents or close times couldn't be read
