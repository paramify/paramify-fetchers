name: azure_sentinel_incidents
version: 0.2.0
description: >
  For every Microsoft Sentinel workspace in the subscription: the incidents
  created inside the lookback, plus every incident still open however old it
  is. Each carries its severity, status, classification, reason and comment,
  owner, created time, and close time, with hours to close. Its response
  timeline, from every retained update, gives when it was acknowledged and each
  status, owner and severity change with who made it, plus its tasks, comment
  count, related analytic rules, and the entities on its alerts. Per workspace:
  open incidents by severity, the oldest open incident's age, closed incidents
  left Undetermined, median and maximum time to close, MTTD, MTTA and MTTR per
  month of the lookback, the open backlog at each month end by severity and
  owner, and the titles and rules behind recurring incidents. Also a count
  cross-check between the incidents API and the SecurityIncident table.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_sentinel_incidents.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see; set one target per
      subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.
  workspaces:
    type: string
    required: false
    env: SENTINEL_WORKSPACES
    description: >
      Comma-separated workspace names or resource ids to limit collection to.
      Optional — omit to collect every Sentinel-onboarded workspace in the
      subscription.

config_schema:
  incident_lookback_days:
    type: integer
    required: false
    default: 90
    env: SENTINEL_INCIDENT_LOOKBACK_DAYS
    description: >
      Incidents created within this many days are collected; open incidents are
      collected whatever their age.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

ksis:
  - KSI-INR-RPI      # Reviewing past incidents — the incident history, monthly metrics and recurrence
  - KSI-MLA-RVL      # Reviewing logs — alerts are triaged, classified and closed
  - KSI-INR-AAR      # After action reports — detection, acknowledgement and close times, tasks and classification comment
  - KSI-IAM-SUS      # Responding to suspicious activity — escalation (owner and severity changes) and close times
  - KSI-CNA-ULN      # Using logical networking — each incident's analytic rules and the hosts and IPs involved
  - KSI-PIY-RES      # Reviewing executive support — open backlog per month by severity and owner

evidence_set:
  reference_id: EVD-AZURE-SENTINEL-INCIDENTS
  name: Azure Sentinel Incidents
  instructions: >
    Script: fetcher.py. ARM REST per Sentinel workspace: incidents
    (2025-09-01). Log Analytics: each SecurityIncident update row (close time,
    status, owner and severity changes, tasks) and SecurityAlert entities joined
    on AlertIds. Acknowledged is the first update to Active or with an owner.
    MTTD is created minus first activity; MTTA and MTTR are by month
    acknowledged and closed. Updates older than SecurityIncident's retention are
    gone; their close times read not_retained and month-end backlogs null.
    Roles: Microsoft Sentinel Reader and Log Analytics Reader.
