name: azure_front_door_origins
version: 0.3.0
description: >
  The back ends behind Azure Front Door Standard/Premium. Every origin group with its
  origins, their priority, weight and region, health probe and load-balancing
  settings, and whether more than one region actually serves traffic (active-active)
  or stands by for failover. For each group, how Front Door connects to its origins:
  the protocol each serving route forwards with, certificate name checking, private
  link and managed-identity origin authentication, so an origin reached over plain
  HTTP or the public internet without authentication is visible. For each App
  Service origin, whether the app accepts traffic only through its own Front Door
  profile (public access off, or access restrictions admitting only the profile's
  X-Azure-FDID), and for each app in the subscription, whether a serving origin
  group reaches it and holds an enabled twin in another region with enough plan
  capacity. From Azure Monitor metrics over a lookback window, each origin's
  measured health and request count per hour, rolled up per group and region, so
  it shows whether every region is healthy and serving and when traffic moved
  between regions.
category: azure

config_schema:
  production_tag:
    type: string
    required: false
    env: AZURE_PRODUCTION_APP_TAG
    description: >
      Tag that marks production App Service apps, as `key=value` or just `key`
      (case-insensitive). Only apps carrying it are listed in production_apps and
      checked for a regional twin. Leave empty and every app in the subscription is
      checked.
  metrics_lookback_days:
    type: integer
    required: false
    default: 7
    env: AZURE_FRONT_DOOR_METRICS_LOOKBACK_DAYS
    description: >
      How many days of hourly origin health and request metrics to read, from 1 to
      30; a larger value is clamped to 30 with a warning. The window ends at the
      last whole hour.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_front_door_origins.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-OFA   # a second region serves traffic (active-active) or stands by (failover), with health probes; each app has a regional twin with capacity
  - KSI-CNA-RNT   # each App Service origin accepts traffic only through its own Front Door profile
  - KSI-RPL-TRC   # measured origin health and traffic per region show when traffic failed over between regions
  - KSI-SVC-VCM   # Front Door reaches each origin over HTTPS with a checked certificate, via private link or managed-identity auth

evidence_set:
  reference_id: EVD-AZURE-FRONTDOOR-ORIGINS
  name: Azure Front Door Origins
  instructions: >
    Script: fetcher.py. Azure SDK calls (azure-mgmt-cdn CdnManagementClient):
    profiles.list() kept to sku Standard_AzureFrontDoor / Premium_AzureFrontDoor
    (other CDN SKUs counted in skipped_profiles_by_sku); per profile
    afd_origin_groups.list_by_profile and per group afd_origins.list_by_origin_group on
    a client pinned to api-version 2026-07-01 (certificateNameCheckValidationMode,
    customCertificateSubjects and tokenDestinationHeader are read by wire key);
    afd_endpoints.list_by_profile, routes.list_by_endpoint, rule_sets.list_by_profile
    and rules.list_by_rule_set; azure-mgmt-resourcegraph ResourceGraphClient.resources
    for origin regions. Reader is sufficient — all reads. Region: an origin has no
    region field, so it is the Resource Graph location of its azureOrigin resource,
    else of its private-link target, else of the App Service site (enabledHostNames)
    or storage account (primaryEndpoints) whose host name it uses; otherwise null
    (region_source null). The query spans every subscription the credential can read;
    an origin elsewhere stays unresolved. private_link.private_endpoint_location is
    Front Door's private endpoint region, not the origin's, and is not used as one.
    enabledState absent reads as Enabled and enforceCertificateNameCheck absent as
    true (documented defaults). Active origins are the enabled ones at the best
    (lowest) priority, plus any with no priority; multi_region_active_active = active
    origins span two or more resolved regions; multi_region_failover = enabled
    origins do. Paths: each route reaches its originGroup, and each
    RouteConfigurationOverride action in a rule set attached to it reaches the
    override's group (the route's own when unset), with forwarding_protocol from the
    route or the override (absent = MatchRequest). protocols_to_origin is Https for
    HttpsOnly, Http for HttpOnly, and for MatchRequest Https when the route accepts
    only HTTPS (as in azure_front_door_tls) else both. serving = an enabled route on
    an enabled endpoint reaches the group. unprotected_reasons: no_enabled_origin
    (every origin in the group is disabled), http_to_origin (a serving path can
    forward HTTP), certificate_name_check_disabled (an enabled
    origin skips it), no_private_link_or_origin_auth (not every enabled origin uses
    private link and the group has no managed-identity authentication);
    connection_protected = serving and none apply. Private link status is reported
    as returned; measured null on approved, working links, so it is not used.
    App Service origins: per profile cdn profiles.get for properties.frontDoorId,
    the value Front Door sends as X-Azure-FDID. An origin's app is its azureOrigin
    when that is a Microsoft.Web site or slot, else its private-link target (group id
    sites-<slot> means that slot), else the app or slot whose enabledHostNames holds
    its host name. Resource Graph lists every microsoft.web/sites in the subscription
    and each origin's app or slot in any readable subscription (kind, location,
    state, serverFarmId, publicNetworkAccess, tags), and each app's
    microsoft.web/serverfarms (sku, properties.zoneRedundant); an app it does not
    return is site_not_found in the target subscription (deleted) and
    site_not_visible elsewhere. azure-mgmt-web WebSiteManagementClient
    web_apps.get_configuration (get_configuration_slot for a slot) reads config/web:
    publicNetworkAccess (else the Resource Graph value) and the access restrictions.
    locked_to_front_door: publicNetworkAccess Disabled, or the public rules (lowest
    priority first, up to the first rule matching every caller, whose action decides
    unmatched callers; with none, an unset default action allows all when there are
    no rules and denies otherwise) leave unmatched callers denied and every allow rule
    is a ServiceTag AzureFrontDoor.Backend rule carrying X-Azure-FDID values that are
    the profile's frontDoorId or another collected profile's, and a public (non
    private-link) origin's rules admit its own profile's id. Access restrictions are
    not evaluated on private-endpoint traffic, so a private-link origin needs no
    rule. lockdown_gaps: public_access_unrestricted, non_front_door_allow_rule,
    front_door_rule_without_fdid, unknown_front_door_id_allowed,
    profile_front_door_id_not_allowed, profile_front_door_id_unknown,
    access_restrictions_unread, site_not_found, site_not_visible. publicNetworkAccess
    unset counts as enabled. production_apps: every app (not slot) in the
    subscription, or only those with the production_tag tag; app_type function_app
    when kind contains functionapp. behind_front_door = an enabled origin in a
    serving group reaches it. A regional twin is another enabled origin in such a
    group, on a different app, whose resolved region differs from the app's location;
    capacity_covers = the twin's plan is platform-scaled (Dynamic, FlexConsumption,
    ElasticPremium) or has at least as many instances (sku.capacity) as the app's;
    unknown when either plan is unknown. twin_gaps: not_behind_front_door,
    no_regional_twin, twin_region_unresolved, twin_capacity_short,
    twin_capacity_unknown; regional_twin_ready = none. Summary counts are over
    serving App Service origins. Origin health and traffic: azure-mgmt-monitor
    MonitorManagementClient metrics.list per profile at interval PT1H over
    metrics_lookback_days ending at the last whole hour, with top 1000 (the API
    returns 10 series otherwise): OriginHealthPercentage (Average, Minimum; filter
    Origin eq '*' and OriginGroup eq '*') and OriginRequestCount (Total; filter
    Origin eq '*'). The Origin dimension is lower-cased with any ":port" dropped; a
    health series matches the origin with that host_name in the named group, and a
    request series (which has no group dimension and names the origin by the Host
    header sent to it) every origin whose originHostHeader or host_name it equals,
    listed in requests_shared_with_groups when that spans groups. Series matching no
    origin are listed in unmatched_origin_metrics. Healthy hour = the hourly
    average health is at least successfulSamplesRequired / sampleSize × 100 of the
    group's load-balancing settings (defaults 3 of 4, so 75); a region is healthy in
    an hour when any of its origins is, and serving when its origins received
    requests. The last hour is the newest hour with data. traffic_shifts lists each
    hour the set of serving regions changed from the previous hour with traffic
    (newest 100; traffic_shift_count is the total). hourly_by_region is kept for
    groups whose enabled origins span two or more regions. Maps to KSI-CNA-OFA /
    KSI-CNA-RNT / KSI-RPL-TRC / KSI-SVC-VCM.
