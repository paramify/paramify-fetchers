name: azure_aks_cluster_configuration
version: 0.3.1
description: >-
  Shows whether each AKS cluster's API server is private or IP-restricted, who can sign in, and whether it has network policy, auto-upgrade, Defender and Azure Monitor.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope,
      as case-insensitive glob patterns listed in the manifest, each with
      a prefix: rg:<resource group> (read from the resource id),
      location:<region> (the region's name without spaces, such as
      eastus2; a resource with no location never matches one) or
      id:<resource id> (also matches that resource's child resources). *
      matches any run of characters and ? one character. A matching AKS
      managed cluster is listed under excluded with the pattern and left
      out of every count and verdict; its agent pools leave with it. A
      pattern without one of these prefixes fails the run. Set it once
      under platforms.azure.config for every Azure fetcher that has this
      field; fetchers without it ignore it. Each item is a pattern, or a pattern with a reason. Empty: every resource is in
      scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_aks_cluster_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-MAT   # private cluster, private API server, no public IPs on nodes
  - KSI-CNA-RNT   # API server authorized IP ranges
  - KSI-CNA-ULN   # network policy and plugin
  - KSI-IAM-ELP   # Kubernetes RBAC + Entra-integrated Azure RBAC, local admin accounts disabled
  - KSI-IAM-SNU   # workload identity and the OIDC issuer
  - KSI-SVC-EIS   # cluster and node-OS auto-upgrade channels

evidence_set:
  reference_id: EVD-AZURE-AKS-CONFIG
  name: Azure Kubernetes Service Cluster Configuration
  instructions: |
    Script: azure/aks_cluster_configuration/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.ContainerService") — tells "AKS not in use" from "no clusters"
    - managed_clusters.list() — every AKS cluster with its API server, sign-in, network, upgrade, monitoring and node pool settings

    Output: azure_aks_cluster_configuration_<subscription>.json — each AKS cluster's public and private API server names, access settings, authorization, network policy and plugin, requested and running Kubernetes versions, upgrade channels, Defender and Azure Monitor settings and node pools (size, OS, node image, public IPs, FIPS, Trusted Launch, SSH), plus the clusters left out and why.

    Summary fields:

    Which clusters are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every cluster is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no cluster, such as a mistyped name; null when the cluster list could not be read
    - excluded_clusters — Number of clusters left out of scope because a pattern matched their resource group, region or id; each is listed under excluded with the pattern, no other count includes it and its node pools leave with it; null when the cluster list could not be read
    - in_scope_clusters — Number of clusters read and in scope; 0 means there are none or the patterns took out every cluster; null when the cluster list could not be read

    Which clusters and node pools were checked?
    - total_clusters — Number of in-scope AKS clusters, including clusters still provisioning or in a failed state; every count below about clusters is out of this total
    - total_agent_pools — Number of node pools (agent pools) across the in-scope clusters
    - kubernetes_versions — List of the distinct Kubernetes versions the clusters are set to run (the requested version, which an upgrade in progress may not have reached yet), sorted
    - provider_registration_status — Whether the AKS provider (Microsoft.ContainerService) is registered on the subscription: registered, not_registered or unknown

    Is the API server kept off the internet?
    - private_clusters — Number of private clusters, whose API server has only a private address inside the virtual network
    - private_cluster_percentage — Percentage of clusters that are private = private_clusters / total_clusters × 100 (a whole number, rounded down; reads 0 when total_clusters is 0)
    - clusters_with_authorized_ip_ranges — Number of clusters whose API server accepts connections only from a list of authorized IP ranges
    - api_server_access_restricted_clusters — Number of clusters with restricted API server access: a private cluster, or a public one with authorized IP ranges set
    - api_server_access_restricted_percentage — Percentage of clusters with restricted API server access = api_server_access_restricted_clusters / total_clusters × 100 (a whole number, rounded down; reads 0 when total_clusters is 0)
    - clusters_with_public_node_ips — Number of clusters with at least one node pool that gives its nodes public IP addresses

    Who can sign in, and what can they do?
    - rbac_enabled_clusters — Number of clusters with Kubernetes role-based access control (RBAC) turned on
    - azure_rbac_enabled_clusters — Number of clusters that authorize Kubernetes actions with Azure RBAC (Entra ID role assignments) instead of in-cluster role bindings alone
    - local_accounts_disabled_clusters — Number of clusters with local accounts turned off, so the shared certificate-based admin credential can't be downloaded and every sign-in goes through Entra ID
    - workload_identity_clusters — Number of clusters with workload identity turned on, so pods sign in to Azure as an Entra ID app or managed identity instead of with stored secrets

    Is traffic between pods restricted?
    - network_policy_clusters — Number of clusters with a network policy engine set (azure, calico or cilium); any non-empty value counts

    Are clusters kept up to date?
    - auto_upgrade_clusters — Number of clusters with an automatic upgrade channel set (patch, stable, rapid or node-image); none or no channel doesn't count

    Are clusters monitored?
    - defender_enabled_clusters — Number of clusters with Microsoft Defender for Containers security monitoring turned on in the cluster's security profile
    - azure_monitor_enabled_clusters — Number of clusters sending metrics to Azure Monitor managed Prometheus; Container Insights logging isn't checked

    Are node pools hardened?
    - fips_enabled_agent_pools — Number of node pools running the FIPS-enabled node image
    - fips_disabled_agent_pools — Number of node pools Azure reports as not running the FIPS-enabled node image
    - fips_unknown_agent_pools — Number of node pools whose FIPS setting Azure did not return; counted apart, never as FIPS-disabled
    - all_agent_pools_fips — True if every node pool runs the FIPS image; false if any pool is FIPS-disabled and none is unknown; null if any pool's FIPS setting is unknown, or there are no node pools
    - secure_boot_enabled_agent_pools — Number of node pools with Trusted Launch secure boot turned on
    - vtpm_enabled_agent_pools — Number of node pools with a virtual TPM (vTPM) turned on
    - trusted_launch_unknown_agent_pools — Number of node pools for which Azure returned neither the secure boot nor the vTPM setting
    - ssh_disabled_agent_pools — Number of node pools with SSH access to the nodes disabled
    - ssh_local_user_agent_pools — Number of node pools whose nodes allow SSH as a local user
    - ssh_access_unknown_agent_pools — Number of node pools whose SSH access setting Azure did not return
    - node_image_versions — List of the distinct node image builds across all node pools, sorted; several builds mean some pools run older images
