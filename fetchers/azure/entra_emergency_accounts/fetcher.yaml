name: azure_entra_emergency_accounts
version: 0.1.0
description: >-
  Shows which users Conditional Access leaves without MFA through an exclusion, and for each emergency account its sign-in methods, last use and the alert rules that name it.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_entra_emergency_accounts.json
  aggregation: per_target

config_schema:
  emergency_accounts:
    type: string
    required: false
    env: ENTRA_EMERGENCY_ACCOUNTS
    description: >
      Comma-separated user principal names or object ids of the tenant's approved
      emergency (break-glass) accounts. Without it, the enabled users excluded from
      every enforced MFA policy that includes all users are reported as candidates,
      and none is treated as approved.

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription whose Microsoft Sentinel analytics rules and Azure Monitor log
      search alert rules are checked for rules that name the emergency accounts.
      Optional — omit to use the first enabled subscription the ambient credential can
      see; set one target per subscription that holds alert rules. Users, groups and
      Conditional Access come from the subscription's Entra tenant.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: Deployment environment label (e.g. prod) written into the evidence metadata.

secrets: []          # DefaultAzureCredential only — see _categories/azure.yaml

# Microsoft Graph permissions (application permission, admin consent):
#   Policy.Read.All     — Conditional Access policies.
#   Directory.Read.All  — /organization, users, group members, directory roles and their
#                         members. Organization.Read.All, User.Read.All, GroupMember.Read.All
#                         and RoleManagement.Read.Directory together cover the same reads.
#   AuditLog.Read.All   — users' signInActivity and userRegistrationDetails; both also
#                         need Entra ID P1 or P2.
# Azure: Reader on the subscription (Microsoft Sentinel Reader on the workspaces is the
# narrower alternative for the analytics rules).
# A denied read is recorded as an API failure and the run exits non-zero.

ksis:
  - KSI-IAM-APM

evidence_set:
  reference_id: EVD-AZURE-ENTRA-EMERGENCY-ACCOUNTS
  name: Microsoft Entra ID Emergency Accounts and MFA Exclusions
  instructions: |
    Script: azure/entra_emergency_accounts/fetcher.py

    Access: Microsoft Graph Policy.Read.All, Directory.Read.All (or Organization.Read.All, User.Read.All, GroupMember.Read.All and RoleManagement.Read.Directory) and AuditLog.Read.All, and Reader on the subscription. Conditional Access, sign-in activity and the registration report need Entra ID P1 or P2. The credential must sign in to the subscription's own tenant; if Microsoft Graph answers for another tenant, the run fails without reading the directory. Emergency accounts are named in ENTRA_EMERGENCY_ACCOUNTS; without it, the enabled users excluded from every enforced MFA policy that includes all users are reported as candidates and none counts as approved.

    Commands Executed:
    - GET /subscriptions/{id} — the subscription's tenant
    - Microsoft Graph GET /organization — the tenant Microsoft Graph is signed in to, which must be the subscription's
    - Microsoft Graph GET /identity/conditionalAccess/policies — the enforced policies that require MFA or an authentication strength, who each one includes and excludes, the apps it targets and its other conditions
    - Microsoft Graph GET /users/{id} (per directly excluded user) — the excluded user's sign-in name, type and enabled state
    - Microsoft Graph GET /groups/{id}/transitiveMembers/microsoft.graph.user (per excluded group, and per included group of a policy that counts for coverage) — the group's users, nested groups included
    - Microsoft Graph GET /directoryRoles and GET /directoryRoles/{id}/members (per excluded role, and per included role of a policy that counts for coverage) — the users holding the role now, directly or through a role-assignable group; PIM-eligible holders aren't read
    - Microsoft Graph GET /users with a userType eq 'Guest' filter (only when a policy excludes guests or external users) — every guest user, all treated as excluded by that policy
    - Microsoft Graph GET /users/{id or user principal name} (per named emergency account) — the account, or that the directory has no such user
    - Microsoft Graph GET /users/{id} with signInActivity (per emergency account) — when it last signed in
    - Microsoft Graph GET /reports/authenticationMethods/userRegistrationDetails/{id} (per emergency account) — the sign-in methods it has registered
    - GET Microsoft.OperationalInsights/workspaces and Microsoft.SecurityInsights/onboardingStates — the subscription's Microsoft Sentinel workspaces
    - GET Microsoft.SecurityInsights/alertRules (per Sentinel workspace, at the stable and preview API versions) — analytics rules and their queries; a failed preview read is logged, and near-real-time rules may then be missed
    - GET Microsoft.Insights/scheduledQueryRules — Azure Monitor log search alert rules and their queries

    Output: azure_entra_emergency_accounts_<subscription>.json — each emergency account (or candidate) with its MFA policy exclusions, whether another MFA policy still covers it, last sign-in, registered methods and the enabled alert rules whose query names it, each other user excluded from an MFA policy, each enforced MFA policy with its includes, excludes and conditions, and any named account the directory doesn't have.

    Summary fields:

    What was checked?
    - emergency_accounts_source — Whether the emergency accounts were named or are candidates:
      - configured (named in ENTRA_EMERGENCY_ACCOUNTS)
      - candidates (none named: the enabled users excluded from every enforced MFA policy that includes all users)
    - emergency_accounts_named — Number of accounts named in ENTRA_EMERGENCY_ACCOUNTS; 0 when none are
    - conditional_access_readable — True if the Conditional Access policies were read; false if not, and the exclusion figures read null
    - exclusions_readable — True if every user, group and role an MFA policy excludes, and every named account, was read; false if any read failed, and the exclusion figures read null
    - coverage_readable — True if every group and role that a policy counting for coverage includes was read; false if any read failed, and a user whose coverage rests on that read reads null
    - alert_rules_readable — True if every Sentinel workspace's analytics rules and the subscription's log search alert rules were read; false if not, and the monitoring figures read null
    - user_sign_in_activity — Whether the emergency accounts' sign-in activity was read: read, not_licensed (the tenant has no Entra ID P1 or P2) or not_read (refused, failed, or the accounts themselves weren't read)
    - registration_details — Whether the emergency accounts' registered methods were read: read, not_licensed or not_read, as for user_sign_in_activity
    - enforced_mfa_policies — Number of enabled (not report-only) Conditional Access policies that require MFA or an authentication strength; null if the policies weren't read
    - enforced_mfa_policies_for_all_users — Number of enforced MFA policies that include all users; null if the policies weren't read
    - mfa_policies_counting_for_coverage — Number of enforced MFA policies that count for coverage: they target all cloud apps (app exclusions aren't judged), apply to browsers or to mobile and desktop apps (the two modern client app types), and have no other condition that limits when they apply (sign-in, user, insider or service principal risk, platforms, locations, a device filter or authentication flows); null if the policies weren't read
    - legacy_authentication_blocked_for_all_users — True if an enforced policy blocks Exchange ActiveSync and other legacy clients for all users on all cloud apps, with no risk, platform, location, device filter or authentication flow condition (excluded users, groups, roles and apps aren't checked); false if none does; null if the policies weren't read
    - sentinel_workspaces_checked — Number of Microsoft Sentinel workspaces whose analytics rules were read; null if the rules weren't all read
    - alert_rules_checked — Number of Sentinel analytics rules and log search alert rules read; null if they weren't all read

    Which emergency accounts are there?
    - emergency_accounts — Number of emergency accounts found (or candidates); null if a named account couldn't be read or, with none named, if the exclusions weren't read
    - emergency_accounts_not_found — Number of named accounts the directory has no user for; null if a named account couldn't be read or, with none named, if the exclusions weren't read
    - emergency_accounts_enabled — Number of emergency accounts whose account is enabled; null if a named account couldn't be read or, with none named, if the exclusions weren't read
    - emergency_accounts_excluded_from_every_all_users_mfa_policy — Number of emergency accounts excluded from every enforced MFA policy that includes all users (0 when no enforced MFA policy includes all users); null if the exclusions weren't read
    - emergency_accounts_with_phishing_resistant_method — Number of emergency accounts with a FIDO2 security key, passkey, Windows Hello for Business or macOS platform credential registered; null if the registration report or the accounts weren't read
    - emergency_accounts_monitored — Number of emergency accounts named, by whole sign-in name or object id, in the query of at least one enabled Sentinel analytics rule or log search alert rule; a rule that finds the accounts through a watchlist, a group or a display name doesn't count, and whether the rule notifies anyone isn't checked; null if the rules or the accounts weren't read

    Is anyone left without MFA who shouldn't be?
    - users_excluded_from_an_mfa_policy — Number of enabled users at least one enforced MFA policy excludes, directly, through a group or role, or as a guest, whether or not another policy covers them; a policy that excludes guests or external users counts every guest user (userType Guest), whatever guest types or tenants it names, and external users who are members aren't counted; null if the exclusions weren't read
    - users_excluded_from_mfa — Number of enabled users an enforced MFA policy excludes that policies counting for coverage don't cover. A user is covered when browsers and mobile and desktop apps are each covered by a policy counting for coverage that applies to that client app type, includes the user (all users, the user, one of their groups or roles, or every guest when the user is a guest) and doesn't exclude them; one policy can cover both, or two policies one each. Legacy clients (Exchange ActiveSync and other) can't present MFA, so they aren't part of coverage; legacy_authentication_blocked_for_all_users shows whether they're blocked. Null if the exclusions weren't read or any such user's coverage rests on a read that failed
    - excluded_users_not_emergency_accounts — Number of enabled users excluded from MFA (as in users_excluded_from_mfa) who aren't named in ENTRA_EMERGENCY_ACCOUNTS; with no accounts named, every enabled user excluded from MFA; null as for users_excluded_from_mfa
    - emergency_accounts_excluded_without_alert — Number of enabled emergency accounts (or candidates) excluded from MFA (as in users_excluded_from_mfa) that no enabled alert rule names; candidates are already counted in excluded_users_not_emergency_accounts; null as for users_excluded_from_mfa, or if the rules weren't read
    - excluded_users_not_monitored_emergency_accounts — Number of enabled users excluded from MFA (as in users_excluded_from_mfa) that aren't both named in ENTRA_EMERGENCY_ACCOUNTS and named by an enabled alert rule: excluded_users_not_emergency_accounts plus, when accounts are named, emergency_accounts_excluded_without_alert. 0 means every user left without MFA by an exclusion is an approved, monitored emergency account; null as for users_excluded_from_mfa, or if the rules weren't read
