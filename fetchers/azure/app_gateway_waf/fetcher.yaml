name: azure_app_gateway_waf
version: 0.2.2
description: >-
  Shows which web application firewall policy protects each Application Gateway web listener, whether it blocks attacks in Prevention mode, and how each WAF policy is configured.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching application gateway (its listeners leave with it) or
      WAF policy is listed under excluded with the pattern and left out
      of every count and verdict. A listener's WAF verdict is still
      worked out against every policy, so an in-scope listener whose
      policy is excluded keeps its verdict; only the policy leaves the
      policy list and its counts. The gateway count check against
      Resource Graph still covers every gateway.
      A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_app_gateway_waf.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-RVP   # rate-limit rules and L7 filtering against DoS and other unwanted activity
  - KSI-CNA-MAT   # si-10 / sc-7: L7 filtering in front of the application
  - KSI-CNA-RNT   # inbound web traffic is filtered by policy

evidence_set:
  reference_id: EVD-AZURE-APPGW-WAF
  name: Azure Application Gateway WAF
  instructions: |
    Script: azure/app_gateway_waf/fetcher.py

    Access: Reader on the subscription. Optional: Reader on another subscription that holds a WAF policy a gateway uses; without it, that policy reads as unreadable and its listeners' enforcement as unknown.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Network") — tells "networking not in use" from "no gateways"
    - application_gateways.list_all() — every gateway with its listeners, path rules, WAF policy associations and legacy WAF configuration
    - Resource Graph count of microsoft.network/applicationgateways — confirms the gateway list is complete; a mismatch is counted again after 30 seconds, and the run fails if it persists
    - web_application_firewall_policies.list_all() — every WAF policy in the subscription; when it fails, total_waf_policies is null and the other policy counts cover only the policies gateways reference
    - web_application_firewall_policies.get() (per referenced policy list_all did not return) — policies held in another subscription; a refusal (401, 403) or a missing policy (404) is recorded as unreadable, and any other error fails the run

    Output: azure_app_gateway_waf_<subscription>.json — each web listener with the WAF that applies, its state, mode and enforcement, plus each WAF policy's mode, rule overrides, exclusions, custom and rate-limit rules, and the resources left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no application gateway or WAF policy, such as a mistyped name; null when the gateway list or the WAF policy list could not be read
    - excluded_application_gateways — Number of application gateways left out of scope because a pattern matched; each is listed under excluded with the pattern, its listeners leave with it, and no other count includes it; null when the gateway list could not be read
    - excluded_waf_policies — Number of WAF policies left out of scope because a pattern matched; each is listed under excluded with the pattern. An in-scope listener that uses an excluded policy keeps its WAF verdict, and only the policy list and the policy counts omit it; null when the WAF policy list could not be read

    Which gateways and listeners were checked?
    - in_scope_application_gateways — Number of application gateways read and in scope; null when the gateway list could not be read
    - in_scope_listeners — Number of web listeners on in-scope gateways; null when the gateway list could not be read
    - in_scope_waf_policies — Number of WAF policies in scope, including linked policies read or recorded as unreadable from another subscription; null when the WAF policy list could not be read
    - total_application_gateways — Number of in-scope application gateways assessed
    - waf_tier_gateways — Number of in-scope application gateways whose SKU tier is a WAF tier
    - total_http_listeners — Number of in-scope web listeners (HTTP or HTTPS); WAF does not apply to layer 4 (TCP or TLS) listeners, so they are not listed
    - completeness_match — True if the gateway count matches Resource Graph's count, which still covers every gateway including excluded ones; false if not; null if either count could not be read
    - provider_registration_status — Whether the networking provider (Microsoft.Network) is registered on the subscription: registered, not_registered or unknown

    Is every web listener protected by a WAF that blocks attacks?
    - listeners_waf_enforcing — Number of web listeners whose effective WAF and every path-rule WAF are Enabled in Prevention mode; a listener's WAF is its own policy, else the gateway's policy, else the legacy WAF configuration
    - listeners_waf_detection_only — Number of web listeners whose effective WAF is Enabled in Detection mode, so it logs attacks but does not block them
    - listeners_waf_disabled — Number of web listeners whose effective WAF state is Disabled; a legacy WAF configuration whose enabled flag the API omits has no state and is not read as Disabled
    - listeners_without_waf — Number of web listeners with no WAF policy or legacy WAF configuration at all
    - public_listeners_not_enforcing — Number of web listeners on a public frontend IP whose WAF is not confirmed enforcing: it is not Enabled in Prevention mode, or it could not be read

    How are the WAF policies configured?
    - total_waf_policies — Number of WAF policies in the policy list, including policies a gateway references that are held in another subscription; null if the policy list could not be read
    - unresolved_waf_policies — Number of referenced WAF policies that could not be read, for any reason
    - unreadable_waf_policies — Number of referenced WAF policies that could not be read because access was refused (401, 403) or the policy no longer exists (404); a listener that uses one has an unknown enforcement
    - policies_prevention — Number of WAF policies Enabled in Prevention mode
    - policies_detection — Number of WAF policies Enabled in Detection mode
    - policies_disabled — Number of WAF policies whose state is Disabled
    - disabled_managed_rules — Number of managed rules switched off by a rule override with state Disabled, across all readable policies
    - rate_limit_rules — Number of enabled rate-limit custom rules, across all readable policies
