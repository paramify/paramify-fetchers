name: azure_ddos_protection
version: 0.2.1
description: >-
  Shows whether each Internet-facing public IP address is covered by Azure DDoS Protection, through its virtual network's DDoS plan or its own IP Protection.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching public IP, DDoS protection plan or virtual network is
      listed under excluded with the pattern and left out of every count
      and verdict. Protection is still worked out against every plan and
      virtual network, so an in-scope public IP protected through an
      excluded virtual network or plan keeps its verdict; a virtual
      network's attached-IP counts cover only in-scope IPs.
      A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_ddos_protection.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-RVP   # DoS protection on every public entry point

evidence_set:
  reference_id: EVD-AZURE-DDOS
  name: Azure DDoS Protection
  instructions: |
    Script: azure/ddos_protection/fetcher.py

    Access: Reader on the subscription.

    Commands Executed:
    - subscriptions.list() — picks a subscription when none is set
    - providers.get("Microsoft.Network") — tells "networking not in use" from "nothing there"
    - ddos_protection_plans.list() — the DDoS protection plans
    - virtual_networks.list_all() — each virtual network's DDoS setting, plan and subnet back-references
    - public_ip_addresses.list_all() — each public IP's attachment and protection setting
    - network_interfaces.list_all() — which virtual network an IP attached to a network interface belongs to
    - load_balancers.list_all() — which virtual network an IP on a load balancer frontend belongs to, through its backend pools

    Output: azure_ddos_protection_<subscription>.json — each public IP with what it is attached to and its effective DDoS protection, plus the DDoS plans, the virtual networks and the resources left out and why.

    Summary fields:

    Which resources are left out of scope?
    - resource_exclusion_patterns — List of the configured resource_exclusions patterns (rg:, location: or id:); empty when none are set, so every resource is in scope
    - resource_exclusion_patterns_unmatched — List of configured patterns that matched no DDoS protection plan, virtual network or public IP, such as a mistyped name; null when any of those lists could not be read
    - excluded_ddos_protection_plans — Number of DDoS protection plans left out of scope because a pattern matched; each is listed under excluded with the pattern; null when the plan list could not be read
    - excluded_virtual_networks — Number of virtual networks left out of scope because a pattern matched; null when the virtual network list could not be read
    - excluded_public_ips — Number of public IPs left out of scope because a pattern matched; null when the public IP list could not be read. An in-scope public IP whose protection comes from an excluded virtual network or plan keeps its verdict, and a virtual network's attached-IP counts cover only in-scope IPs

    Which plans, virtual networks and public IPs were checked?
    - in_scope_ddos_protection_plans — Number of DDoS protection plans read and in scope; null when the plan list could not be read
    - in_scope_virtual_networks — Number of virtual networks read and in scope; null when the virtual network list could not be read
    - in_scope_public_ips — Number of public IPs read and in scope; null when the public IP list could not be read
    - total_ddos_protection_plans — Number of in-scope DDoS protection plans
    - total_virtual_networks — Number of in-scope virtual networks
    - total_public_ips — Number of in-scope public IPs, attached or not
    - provider_registration_status — Whether the networking provider (Microsoft.Network) is registered on the subscription: registered, not_registered or unknown

    Which virtual networks have a DDoS plan?
    - virtual_networks_with_ddos_plan — Number of virtual networks with DDoS protection turned on and a plan linked
    - virtual_networks_with_attached_public_ips — Number of virtual networks with at least one in-scope public IP attached to a resource in them
    - virtual_networks_with_attached_public_ips_without_plan — Number of virtual networks with at least one attached public IP but no DDoS plan

    Is every Internet-facing public IP protected?
    - attached_public_ips — Number of public IPs attached to a resource, which makes them reachable from the Internet; protection here is configuration only and does not show that DDoS alerts or mitigation reports are reviewed
    - attached_public_ips_by_effective_protection — Number of attached public IPs for each protection result:
      - network_protection (covered by its virtual network's DDoS plan, with DDoS protection turned on)
      - ip_protection (covered by its own DDoS IP Protection, mode Enabled)
      - none (the IP inherits protection but its virtual network has no plan, or the IP is unattached)
      - disabled (protection turned off on the IP)
      - not_supported (held by a NAT gateway, which DDoS Protection cannot protect)
      - unknown (no single virtual network could be found for it, such as a load balancer with empty backend pools or backends in several networks)
    - attached_public_ips_unprotected — Number of attached public IPs whose protection is none or disabled; not_supported and unknown are not counted
