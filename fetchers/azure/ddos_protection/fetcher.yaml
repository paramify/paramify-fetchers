name: azure_ddos_protection
version: 0.2.0
description: >
  Whether every public IP address — the subscription's Internet entry points — is
  covered by Azure DDoS Protection, either through a DDoS protection plan on its
  virtual network (Network Protection) or its own IP Protection, with what each IP is
  attached to. Also every DDoS protection plan and which virtual networks use one.
category: azure

config_schema:
  resource_exclusions:
    type: patterns
    prefixes: [rg, location, id]
    bare: false
    required: false
    env: AZURE_RESOURCE_EXCLUSIONS
    description: >
      Resources outside the authorization boundary, to leave out of scope, as
      case-insensitive glob patterns listed in the manifest, each with a
      prefix: rg:<resource group> (read from the resource id), location:<region>
      (the region's name without spaces, such as eastus2; a resource with no
      location never matches one) or id:<resource id> (also matches that
      resource's child resources). * matches any run of characters and ? one
      character. A matching public IP, DDoS protection plan or virtual network is
      listed under excluded with the pattern and left out of every count
      and verdict. Protection is still worked out against every plan and
      virtual network, so an in-scope public IP protected through an
      excluded virtual network or plan keeps its verdict; a virtual
      network's attached-IP counts cover only in-scope IPs.
      A pattern
      without one of these prefixes fails the run. Set it once under platforms.azure.config for every Azure
      fetcher that has this field; fetchers without it ignore it. Each item is a
      pattern, or a pattern with a reason. Empty: every
      resource is in scope.

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_ddos_protection.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

ksis:
  - KSI-CNA-RVP   # DoS protection on every public entry point

evidence_set:
  reference_id: EVD-AZURE-DDOS
  name: Azure DDoS Protection
  instructions: >
    Script: azure/ddos_protection/fetcher.py. Azure SDK calls (azure-mgmt-network NetworkManagementClient),
    all reads, Reader is sufficient: ddos_protection_plans.list(),
    virtual_networks.list_all(), public_ip_addresses.list_all(),
    network_interfaces.list_all(), load_balancers.list_all(); plus the
    Microsoft.Network registration state.
    attached_to_type is read from the public IP's ipConfiguration id
    (network_interface, load_balancer, bastion_host, azure_firewall,
    virtual_network_gateway, application_gateway, other), or nat_gateway when a NAT
    gateway holds it, or unattached; internet_facing is any attached IP. The IP's
    virtual network is found by matching the attached resource against the subnets'
    ipConfigurations and applicationGatewayIPConfigurations back-references, then
    against network interfaces' subnets. A public load balancer frontend takes the
    VNet of its backend pools — each pool's backendIPConfigurations (VM or scale-set
    NIC IP configurations, matched the same way) and, for pools configured by IP
    address, the pool's virtualNetwork and each backend address's virtualNetwork or
    subnet — when they all sit in one VNet, since its protection follows that VNet.
    effective_protection: "not_supported" for an IP held by a NAT gateway, which
    Microsoft documents DDoS Protection cannot protect (counted apart from the
    unprotected ones); "ip_protection" when the IP's ddosSettings.protectionMode is
    Enabled; "disabled" when Disabled;
    otherwise (VirtualNetworkInherited, which is also what an unset mode means)
    "network_protection" when its virtual network has enableDdosProtection true and a
    ddosProtectionPlan, "none" when that network has no plan or the IP is
    unattached, and "unknown" when no single virtual network could be found for it —
    a load balancer with empty backend pools or backends in several VNets, or a
    resource type not listed above. This is configuration only: it does not show that
    protection is reviewed for effectiveness (DDoS alerts, mitigation reports), and
    Front Door / Application Gateway WAF policy is collected elsewhere. Maps to
    KSI-CNA-RVP.
    Public IPs, DDoS protection plans and virtual networks the patterns
    take out are listed under results.excluded, each with the pattern that
    matched. An in-scope public IP whose protection comes from an excluded
    virtual network or plan keeps its verdict; a virtual network's
    attached-IP counts cover only in-scope IPs. Summary fields:
    resource_exclusion_patterns (the configured patterns, empty when none
    are set), resource_exclusion_patterns_unmatched (patterns that matched
    nothing, such as a mistyped name), excluded_ddos_protection_plans,
    excluded_virtual_networks, excluded_public_ips (how many the patterns
    took out) and in_scope_ddos_protection_plans,
    in_scope_virtual_networks, in_scope_public_ips (how many stayed); a
    kind's two counts are null when its list couldn't be read.
    results.excluded is always present, empty when nothing is excluded.
