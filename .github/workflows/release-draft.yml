name: release-draft

# Thursday 15:00 UTC, and on demand. Builds or rebuilds release/next and its
# pull request (tools/release.py draft). See docs/releasing_guide.md.

on:
  schedule:
    - cron: "0 15 * * 4"
  workflow_dispatch:
    inputs:
      version:
        description: "Force this version (X.Y.Z or X.Y.Z-beta). Leave empty to pick it from the changes."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The App token, not GITHUB_TOKEN, so the pushes and the release PR start
      # CI. ci-ok must report on the release PR. fetch-depth 0 with the default
      # refspec brings every tag and origin/release/next, which the push lease needs.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: git identity is the release App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - name: draft the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RELEASE_REVIEWER: 21tmccauley
          RELEASE_REMINDER: ${{ github.event_name == 'schedule' && '1' || '' }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            python tools/release.py draft --version "$VERSION"
          else
            python tools/release.py draft
          fi
      - name: DM that the job failed
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RELEASE_REVIEWER: 21tmccauley
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/release.py notify-failure --url "$RUN_URL"
