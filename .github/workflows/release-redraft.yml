name: release-redraft

# A push to main while a release PR is open: rebuild release/next on the new
# main. With no open release PR, do nothing.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  redraft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The App token, not GITHUB_TOKEN, so the pushes and the release PR start
      # CI. ci-ok must report on the release PR. fetch-depth 0 with the default
      # refspec brings every tag and origin/release/next, which the push lease needs.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: git identity is the release App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - name: is a release PR open
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          n=$(gh pr list --head release/next --state open --json number --jq length)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: rebuild the release
        if: steps.open.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RELEASE_REVIEWER: 21tmccauley
        run: python tools/release.py draft
      - name: DM that the job failed
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RELEASE_REVIEWER: 21tmccauley
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/release.py notify-failure --url "$RUN_URL"
