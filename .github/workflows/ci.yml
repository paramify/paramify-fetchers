name: CI

# The public API surface — schemas + manifest + envelope + the `paramify` CLI —
# is the contract (CLAUDE.md). These jobs gate it:
#   test      — every fetcher.yaml / category file validates against its JSON Schema
#   azure-sdk — the Azure SDK operation groups the fetchers read still exist
#   smoke     — the CLI discovery surface works across all fetchers, and the
#               demo run / validate / upload --dry-run output matches its goldens
#   tui       — the terminal UI on the lowest and latest textual 8: pilot tests,
#               SVG snapshots, the end-to-end demo flow, and a real pty launch
#   lint      — the framework's own code passes ruff + mypy
#   secrets   — no credentials in the tree or its full git history
# Fetchers can't be integration-tested here (no live tenants); that signal comes
# from recorded fixtures + the scheduled dogfood run (SEC-38).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Framework's own code only. Ported v0.x fetchers under fetchers/ are held
      # to the schema contract (the test job), not lint rules. `ruff format` is
      # intentionally not gated yet.
      - name: ruff (lint + import order)
        run: ruff check framework/
      # Core framework. The TUI is suppressed via a pyproject override until it
      # gets its own typing pass (see [tool.mypy] in pyproject.toml).
      - name: mypy (core framework)
        run: mypy framework/

  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is here because deploy/Dockerfile runs it and the dev venvs are
        # on it — without this row the interpreter we actually use day to day is
        # the one nothing gates. Keep it in step with the Dockerfile's FROM.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # tui extra: the CLI/TUI parity test reads the TUI source, and importing
      # the CLI must stay clean with textual installed.
      - run: python -m pip install -e ".[dev,tui]"
      # Includes tests/test_contracts.py — the schema contract gate over every
      # fetcher.yaml and _categories/*.yaml.
      - name: pytest
        run: pytest -q

  azure-sdk:
    name: azure-sdk (surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The only job that installs the azure extra. The `test` matrix
      # deliberately does not (23 packages, heavier than everything else here
      # combined), which left azure dependency bumps ungated: PR #59 relaxed the
      # load-bearing azure-mgmt-monitor<7 and passed all twelve checks, because
      # nothing in the suite had ever imported an Azure SDK.
      - run: python -m pip install -e ".[dev,azure]"
      # A guard, not a formality. tests/test_azure_sdk_surface.py opens with
      # `pytest.importorskip`, so if the extra failed to resolve the module would
      # SKIP and this job would go green having verified nothing — reinstating
      # the exact false confidence it exists to remove. Fail loudly instead.
      - name: assert the azure extra actually installed
        run: python -c "import azure.mgmt.monitor, azure.mgmt.network, msgraph"
      # No credentials and no network: azure-mgmt clients build their operation
      # groups at construction, so a fake credential is enough to introspect the
      # surface the fetchers read. Runs unconditionally rather than behind a path
      # filter — a gate that only sometimes runs is not a gate.
      - name: pytest (azure SDK surface)
        run: pytest -q tests/test_azure_sdk_surface.py

  smoke:
    name: smoke (CLI discovery)
    runs-on: ubuntu-latest
    # The goldens step runs real commands; a hang should not hold a runner for 6h.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: paramify list / catalog / ksi + describe every fetcher
        run: |
          set -euo pipefail
          paramify list --json > /dev/null
          paramify catalog --json > /dev/null
          paramify ksi --json > /dev/null
          for f in $(paramify list --json | python -c "import sys, json; [print(x['name']) for x in json.load(sys.stdin)]"); do
            paramify describe "$f" --json > /dev/null
          done
          echo "smoke ok: described all discovered fetchers"
      # The headless path a new user takes first, end to end and offline: run the
      # credential-free demo manifest, validate it, dry-run its upload. Output is
      # compared with tests/goldens/cli/ after the repo path, run ids and
      # timestamps are normalised out. Refresh: python tools/cli_goldens.py --update
      - name: paramify run / validate / upload --dry-run on the demo (goldens)
        run: python tools/cli_goldens.py

  tui:
    name: tui (textual ${{ matrix.textual }})
    runs-on: ubuntu-latest
    # A wedged app or pty would otherwise hold the runner for the 6h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lowest textual the tui extra allows and the newest it resolves to,
        # so a textual release that breaks the console fails here first.
        include:
          - textual: lowest
            pin: "textual==8.0.0"
            # SVGs are compared on latest only, since a textual minor can render
            # differently. --deselect, not --ignore: an ignore does not drop a
            # file named on the command line, and a skip would trip --fail-on-skip.
            pytest-args: "--deselect tests/test_tui_snapshots.py"
          - textual: latest
            pin: "textual>=8,<9"
            pytest-args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # snapshots extra: pytest-textual-snapshot, kept out of dev because it caps
      # pytest below 9 (see pyproject.toml).
      - run: python -m pip install -e ".[dev,tui,snapshots]" "${{ matrix.pin }}"
      # Same guard as azure-sdk: every TUI module opens with importorskip, so a
      # failed install would otherwise pass as a page of skips.
      - name: assert textual and the snapshot plugin actually installed
        run: python -c "import textual, pytest_textual_snapshot; from importlib.metadata import version; print('textual', version('textual'))"
      # Pilot suites, SVG snapshots, the end-to-end demo flow and the pty launch.
      # --fail-on-skip (tests/conftest.py) fails the job if any of them skipped.
      - name: pytest (TUI)
        run: >-
          pytest -q -rs --fail-on-skip --snapshot-report snapshot_report.html
          ${{ matrix.pytest-args }}
          tests/test_tui_*.py tests/test_manifest_autosave.py tests/test_target_editor.py
      # Side-by-side SVG diff of every mismatched snapshot. Refresh after an
      # intended UI change: pytest tests/test_tui_snapshots.py --snapshot-update
      - name: upload the snapshot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-report-textual-${{ matrix.textual }}
          path: snapshot_report.html
          if-no-files-found: ignore

  secrets:
    name: secrets (gitleaks full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history — scanning it is the whole point
      # The OSS binary, not the marketplace action (which requires an org
      # license). `gitleaks git` scans the full commit history and exits 1 on
      # any finding.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks (full history)
        run: gitleaks git --verbose --redact
