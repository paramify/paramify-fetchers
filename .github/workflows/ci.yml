name: CI

# The public API surface — schemas + manifest + envelope + the `paramify` CLI —
# is the contract (CLAUDE.md). These jobs gate it:
#   changes   — reads the diff and picks the scope (tools/ci_plan.py). A pull
#               request that only touches fetchers, their tests and docs runs
#               `test` on the oldest and the deployed Python, `tui` on the latest
#               textual, and azure-sdk / oci only if their side changed. Anything
#               else, and every push to main, runs everything.
#   test      — every fetcher.yaml / category file validates against its JSON Schema
#   azure-sdk — the Azure SDK operation groups the fetchers read still exist
#   oci-sdk   — the OCI fetchers run against recorded responses (needs the oci extra)
#   release-check — only on the release PR (branch release/next): the release
#               file is complete and consistent (tools/release.py check)
#   smoke     — the CLI discovery surface works across all fetchers, and the
#               demo run / validate / upload --dry-run output matches its goldens
#   tui       — the terminal UI on the lowest textual 8 with the oldest Python and
#               the latest textual 8 with the deployed Python: pilot tests, SVG
#               snapshots, the end-to-end demo flow, a 160x50 layout check, and a
#               real pty launch. The only job that runs the TUI suite. Each
#               textual row runs as three shards.
#   lint      — the framework's own code passes ruff + mypy
#   secrets   — no credentials in the tree or its full git history
#   ci-ok     — passes only if every job above passed or was skipped by `changes`.
#               The one check to require in branch protection: the matrix rows
#               come and go with the scope, so their names cannot be required.
# Fetchers can't be integration-tested here (no live tenants); that signal comes
# from recorded fixtures + the scheduled dogfood run (SEC-38).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces the run before it. Runs on main are
  # never cancelled: with `true` here, merges landing close together cancelled
  # each other and main went days without one finished run. They queue instead
  # (a group holds one running and one pending), so the newest merge always runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes (what to run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      azure: ${{ steps.plan.outputs.azure }}
      oci: ${{ steps.plan.outputs.oci }}
      release: ${{ steps.plan.outputs.release }}
      pythons: ${{ steps.matrix.outputs.pythons }}
      tui: ${{ steps.matrix.outputs.tui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents: the planner diffs HEAD^1..HEAD.
          fetch-depth: 2
      # The runner's own python3; the planner is stdlib-only, so no setup or
      # install. It prints what it decided and which paths forced `full`.
      - name: plan
        id: plan
        run: python3 tools/ci_plan.py --event "${{ github.event_name }}"
      # The version lists live here, not in the planner, so the workflow still
      # says what runs. 3.11 is the oldest Python that pyproject's
      # requires-python allows. 3.14 is the one deploy/Dockerfile and the dev
      # venvs run, so keep it in step with the Dockerfile's FROM.
      #
      # tui rows: the lowest textual the tui extra allows and the newest it
      # resolves to, so a textual release that breaks the console fails here
      # first. Each is paired with one end of the Python range, since no other
      # job runs the TUI suite. SVGs are compared on latest only, since a textual
      # minor can render differently. --deselect, not --ignore: an ignore does
      # not drop a file named on the command line, and a skip would trip
      # --fail-on-skip.
      #
      # Each textual row runs as TUI_SHARDS jobs, each with every Nth test
      # (--shard in tests/conftest.py). Whole, the suite took 7 to 8.5 minutes on
      # latest and set the wall time of the workflow: no test is slow, there are
      # just 360 app starts for 4 cores.
      - name: matrices for the scope
        id: matrix
        env:
          SCOPE: ${{ steps.plan.outputs.scope }}
          TUI_SHARDS: 3
        run: |
          set -euo pipefail
          lowest='"textual":"lowest","python-version":"3.11","pin":"textual==8.0.0","pytest-args":"--deselect tests/test_tui_snapshots.py"'
          latest='"textual":"latest","python-version":"3.14","pin":"textual>=8,<9","pytest-args":""'
          if [ "$SCOPE" = fetchers ]; then
            echo 'pythons=["3.11","3.14"]' >> "$GITHUB_OUTPUT"
            textuals=("$latest")
          else
            echo 'pythons=["3.11","3.12","3.13","3.14","3.15"]' >> "$GITHUB_OUTPUT"
            textuals=("$lowest" "$latest")
          fi
          rows=()
          for row in "${textuals[@]}"; do
            for i in $(seq 1 "$TUI_SHARDS"); do
              rows+=("{$row,\"shard\":\"$i\",\"shards\":\"$TUI_SHARDS\"}")
            done
          done
          (IFS=,; echo "tui=[${rows[*]}]") >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Framework's own code only. Ported v0.x fetchers under fetchers/ are held
      # to the schema contract (the test job), not lint rules. `ruff format` is
      # intentionally not gated yet.
      - name: ruff (lint + import order)
        run: ruff check framework/
      # Core framework. The TUI is suppressed via a pyproject override until it
      # gets its own typing pass (see [tool.mypy] in pyproject.toml).
      - name: mypy (core framework)
        run: mypy framework/

  test:
    name: test (py ${{ matrix.python-version }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Five Pythons, or the oldest and the deployed one for a fetcher-only
        # pull request. The lists are in the `changes` job.
        python-version: ${{ fromJSON(needs.changes.outputs.pythons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # tui extra: the CLI/TUI parity test reads the TUI source, and importing
      # the CLI must stay clean with textual installed.
      - run: python -m pip install -e ".[dev,tui]"
      # Includes tests/test_contracts.py — the schema contract gate over every
      # fetcher.yaml and _categories/*.yaml. `-n auto` (pytest-xdist) spreads the
      # suite over the runner's cores: serial it took over 4 minutes. A test that
      # fails here but passes alone shares state with another test; fix the test.
      #
      # The TUI suite is left to the `tui` job, which runs it on the oldest and
      # the deployed Python. Here it ran five more times and took about half of
      # each row. Keep these three in step with that job's pytest step.
      - name: pytest
        run: >-
          pytest -q -n auto
          --ignore-glob='tests/test_tui_*.py'
          --ignore=tests/test_manifest_autosave.py --ignore=tests/test_target_editor.py

  azure-sdk:
    name: azure-sdk (surface)
    needs: changes
    # Skipped only for a pull request that touches no Azure fetcher, test or doc,
    # no shared fetcher code, and nothing outside the fetcher scope. A dependency
    # change is outside it by construction (tools/ci_plan.py), so a bump like
    # PR #59 below always runs this job.
    if: needs.changes.outputs.azure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The only job that installs the azure extra. The `test` matrix
      # deliberately does not (23 packages, heavier than everything else here
      # combined), which left azure dependency bumps ungated: PR #59 relaxed the
      # load-bearing azure-mgmt-monitor<7 and passed all twelve checks, because
      # nothing in the suite had ever imported an Azure SDK.
      - run: python -m pip install -e ".[dev,azure]"
      # A guard, not a formality. tests/test_azure_sdk_surface.py opens with
      # `pytest.importorskip`, so if the extra failed to resolve the module would
      # SKIP and this job would go green having verified nothing — reinstating
      # the exact false confidence it exists to remove. Fail loudly instead.
      - name: assert the azure extra actually installed
        run: python -c "import azure.mgmt.monitor, azure.mgmt.network, msgraph"
      # No credentials and no network: azure-mgmt clients build their operation
      # groups at construction, so a fake credential is enough to introspect the
      # surface the fetchers read.
      - name: pytest (azure SDK surface and read boundaries)
        run: >-
          pytest -q tests/test_azure_sdk_surface.py tests/test_azure_entra_conditional_access_policies.py
          tests/test_azure_sdk_arm_read_boundary.py tests/test_entra_graph_source_boundary.py
          tests/test_azure_rest_read_boundary.py tests/test_azure_entra_mixed_strict_boundary.py
          tests/test_azure_network_source_boundary.py

  oci-sdk:
    name: oci (fetchers + SDK surface)
    needs: changes
    # Same rule as azure-sdk, for the OCI side of the tree.
    if: needs.changes.outputs.oci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The only job that installs the oci extra. The `test` matrix deliberately
      # does not, which means every tests/test_oci_*.py SKIPS there: each opens
      # with pytest.importorskip("oci"), so the whole OCI suite would go green in
      # CI having run nothing at all — the same false confidence the azure-sdk
      # job above exists to remove.
      - run: python -m pip install -e ".[dev,oci]"
      - name: assert the oci extra actually installed
        run: python -c "import oci, oci._vendor.requests"
      # No credentials and no network: the fetchers run as subprocesses against
      # recorded HTTP responses (fetchers/oci/tests/cassettes), replayed through
      # the real SDK, so deserialization, pagination and the SDK's error classes
      # all still run. ~11s for all seventeen.
      - name: pytest (OCI fetchers, cross-check, SDK surface)
        # A glob, not a list: two SDK-dependent test files added later were in no
        # list, so they skipped in `test` and ran nowhere.
        run: pytest -q tests/test_oci_*.py
      # The field-name check against the SDK's generated models. Exits non-zero on
      # a finding; a companion test (above) fails if a record function goes
      # unregistered, so this cannot pass by having nothing left to check.
      - name: oci schema check
        run: python tools/oci_schema_check.py

  smoke:
    name: smoke (CLI discovery)
    runs-on: ubuntu-latest
    # The goldens step runs real commands; a hang should not hold a runner for 6h.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: paramify list / catalog / ksi
        run: |
          set -euo pipefail
          paramify list --json > "$RUNNER_TEMP/fetchers.json"
          paramify catalog --json > /dev/null
          paramify ksi --json > /dev/null
      # One process for every describe. A `paramify` process per fetcher took
      # over 2 minutes, nearly all of it Python start-up. CliRunner drives the
      # same Typer app as the `paramify` entry point, which the step above
      # already proves works.
      - name: paramify describe every fetcher
        run: |
          python - "$RUNNER_TEMP/fetchers.json" <<'EOF'
          import json, sys
          from typer.testing import CliRunner
          from framework.cli import app

          runner = CliRunner()
          with open(sys.argv[1]) as fh:
              names = [f["name"] for f in json.load(fh)]
          failed = []
          for name in names:
              result = runner.invoke(app, ["describe", name, "--json"])
              try:
                  assert result.exit_code == 0, f"exit {result.exit_code}: {result.output}"
                  assert json.loads(result.stdout)["name"] == name, "described another fetcher"
              except (AssertionError, ValueError) as exc:
                  failed.append(f"{name}: {exc}")
          for line in failed:
              print(line, file=sys.stderr)
          if failed:
              sys.exit(f"smoke FAILED: {len(failed)} of {len(names)} fetchers did not describe")
          print(f"smoke ok: described all {len(names)} discovered fetchers")
          EOF
      # The headless path a new user takes first, end to end and offline: run the
      # credential-free demo manifest, validate it, dry-run its upload; then
      # set-stack and set-owner on a copy, and the dry run's note that they
      # changed after the run. Output is
      # compared with tests/goldens/cli/ after the repo path, run ids and
      # timestamps are normalised out. Refresh: python tools/cli_goldens.py --update
      - name: paramify run / validate / upload --dry-run on the demo (goldens)
        run: python tools/cli_goldens.py

  tui:
    name: tui (textual ${{ matrix.textual }}, py ${{ matrix.python-version }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    runs-on: ubuntu-latest
    # A wedged app or pty would otherwise hold the runner for the 6h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both textual rows, or only `latest` for a fetcher-only pull request: the
        # TUI boots against the real catalog, so a fetcher can still break it.
        # Each row is split into shards. The rows are in the `changes` job.
        include: ${{ fromJSON(needs.changes.outputs.tui) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # snapshots extra: pytest-textual-snapshot, kept out of dev because it caps
      # pytest below 9 (see pyproject.toml).
      - run: python -m pip install -e ".[dev,tui,snapshots]" "${{ matrix.pin }}"
      # Same guard as azure-sdk: every TUI module opens with importorskip, so a
      # failed install would otherwise pass as a page of skips.
      - name: assert textual and the snapshot plugin actually installed
        run: python -c "import textual, pytest_textual_snapshot; from importlib.metadata import version; print('textual', version('textual'))"
      # Pilot suites, SVG snapshots, the end-to-end demo flow, the 160x50 layout
      # check and the pty launch.
      # --fail-on-skip (tests/conftest.py) fails the job if any of them skipped.
      # `-n auto` as in the `test` job: serial, this step took 8 to 11 minutes and
      # set the wall time of the whole workflow. --shard keeps a snapshot module
      # whole in one shard, and reports the other shards' tests as deselected.
      - name: pytest (TUI)
        run: >-
          pytest -q -rsx -n auto --fail-on-skip --snapshot-report snapshot_report.html
          --shard ${{ matrix.shard }}/${{ matrix.shards }}
          ${{ matrix.pytest-args }}
          tests/test_tui_*.py tests/test_manifest_autosave.py tests/test_target_editor.py
      # Side-by-side SVG diff of every mismatched snapshot. Refresh after an
      # intended UI change: pytest tests/test_tui_snapshots.py --snapshot-update
      - name: upload the snapshot report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-report-textual-${{ matrix.textual }}-shard-${{ matrix.shard }}
          path: snapshot_report.html
          if-no-files-found: ignore

  install:
    name: install (install.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 3.11: the oldest Python the installer accepts, so a newer-only feature
      # in the install fails here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: shellcheck
        run: shellcheck install.sh
      # The path users take, piped into bash as `curl ... | bash` runs it, but
      # cloning this checkout instead of GitHub's main. Headless extras keep it
      # quick; the demo then runs through the linked `paramify`.
      - name: install.sh into a fresh directory, then the demo
        env:
          PARAMIFY_REPO_URL: ${{ github.workspace }}
          PARAMIFY_DIR: ${{ runner.temp }}/pf
          PARAMIFY_EXTRAS: ""
        run: |
          set -euo pipefail
          bash < install.sh
          cd "$PARAMIFY_DIR"
          "$HOME/.local/bin/paramify" run examples/demo.yaml

  secrets:
    name: secrets (gitleaks full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history — scanning it is the whole point
      # The OSS binary, not the marketplace action (which requires an org
      # license). `gitleaks git` scans the full commit history and exits 1 on
      # any finding.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks (full history)
        run: gitleaks git --verbose --redact

  release-check:
    name: release-check (release PR)
    needs: changes
    # Only the release PR, which always comes from release/next. Skipped on every
    # other pull request, and ci-ok allows that.
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check reads the tags and the history since the last release.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      # On a pull request the checkout is the merge commit; its second parent is
      # the PR head, which is the release branch itself.
      - name: check the release file
        run: |
          ref=HEAD
          if git rev-parse --verify -q HEAD^2 > /dev/null; then ref=HEAD^2; fi
          python tools/release.py check --ref "$ref"

  ci-ok:
    name: ci-ok
    # always(): a failed or cancelled job above would otherwise skip this one,
    # and a skipped required check counts as passing.
    if: always()
    needs: [changes, lint, test, azure-sdk, oci-sdk, release-check, smoke, tui, install, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed, or was skipped by the planner
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          # Only the two SDK jobs and release-check may be skipped, and only when `changes` itself
          # passed: if it failed, everything after it is skipped, not cleared.
          jq -e '
            .changes.result == "success"
            and ([to_entries[]
                  | select(.key != "azure-sdk" and .key != "oci-sdk" and .key != "release-check")
                  | .value.result] | all(. == "success"))
            and ([."azure-sdk".result, ."oci-sdk".result, ."release-check".result] | all(. == "success" or . == "skipped"))
          ' <<<"$NEEDS" > /dev/null || { echo "::error::a job failed, was cancelled, or did not run"; exit 1; }
