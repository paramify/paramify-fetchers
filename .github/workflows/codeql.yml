name: CodeQL

# Static analysis (SAST) for the Python code and the workflow files. Results go
# to the repository Security tab. OpenSSF Scorecard's SAST check looks for this
# workflow.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new CodeQL queries also run on code that does not change.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
