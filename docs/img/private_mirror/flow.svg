<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-skill { fill: #eef4ff; stroke: #9ec0ff; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .you { fill: #fff8e5; stroke: #d4a72c; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .sub { fill: #59636e; font-size: 12px; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .c { fill: #1f2328; font-size: 12px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .n { fill: #0969da; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .key { fill: #59636e; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #30363d; }
      .lane-skill { fill: #121d2f; stroke: #1f6feb; }
      .box { fill: #0d1117; stroke: #30363d; }
      .you { fill: #2b2111; stroke: #9e6a03; }
      .h, .t, .c { fill: #e6edf3; }
      .sub, .key { fill: #9198a1; }
      .n { fill: #58a6ff; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="470" rx="12"/>

  <!-- Lane 1: once -->
  <rect class="lane" x="16" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="32" y="44">1 · Once: set up</text>
  <text class="sub" x="32" y="62">Your org, your access controls</text>

  <rect class="box" x="32" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="124">Create a private copy</text>
  <text class="sub" x="46" y="146">GitHub's importer, full history</text>
  <text class="sub" x="46" y="164">clone it, check the log</text>
  <text class="sub" x="46" y="182">invite your Paramify contact</text>

  <rect class="box" x="32" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="260">Point it at Paramify's repo</text>
  <text class="sub" x="46" y="282">an upstream remote, not a fork</text>
  <text class="sub" x="46" y="300">pushing to it disabled</text>
  <text class="sub" x="46" y="318">its tags under paramify/</text>

  <path class="arrow" d="M148 196 V230" marker-end="url(#a)"/>

  <!-- Lane 2: each release -->
  <rect class="lane-skill" x="304" y="16" width="352" height="400" rx="10"/>
  <text class="h" x="320" y="44">2 · Each Paramify release</text>
  <text class="sub" x="320" y="62">In your working clone</text>

  <rect class="box" x="320" y="86" width="320" height="50" rx="8"/>
  <text class="n" x="334" y="116">1</text><text class="c" x="354" y="116">git fetch upstream</text>

  <rect class="you" x="320" y="148" width="320" height="50" rx="8"/>
  <text class="n" x="334" y="178">2</text><text class="t" x="354" y="178">Pick a release tag, not upstream/main</text>

  <rect class="box" x="320" y="210" width="320" height="50" rx="8"/>
  <text class="n" x="334" y="240">3</text><text class="c" x="354" y="240">git merge refs/tags/paramify/…</text>

  <rect class="box" x="320" y="272" width="320" height="50" rx="8"/>
  <text class="n" x="334" y="302">4</text><text class="t" x="354" y="302">Resolve, test, push to your main</text>

  <rect class="box" x="320" y="334" width="320" height="50" rx="8"/>
  <text class="n" x="334" y="364">5</text><text class="t" x="354" y="364">Your fetchers: feat/* → main</text>

  <!-- Lane 3: send back -->
  <rect class="lane" x="680" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="696" y="44">3 · Send something back</text>
  <text class="sub" x="696" y="62">Optional; most teams never do</text>

  <rect class="you" x="696" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="124">Hand it to your contact</text>
  <text class="sub" x="710" y="146">they pull from your repo</text>
  <text class="sub" x="710" y="164">and land it upstream</text>
  <text class="sub" x="710" y="182">no public fork needed</text>

  <rect class="you" x="696" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="260">Or open the PR yourself</text>
  <text class="sub" x="710" y="282">branch from a release tag</text>
  <text class="sub" x="710" y="300">cherry-pick general commits</text>
  <text class="sub" x="710" y="318">push only that to a fork</text>

  <text class="sub" x="812" y="218" text-anchor="middle">or</text>

  <!-- cross-lane arrows -->
  <path class="arrow" d="M264 282 H284 V111 H318" marker-end="url(#a)"/>
  <path class="arrow" d="M640 359 H660 V146 H694" marker-end="url(#a)"/>
  <path class="arrow" d="M660 282 H694" marker-end="url(#a)"/>

  <!-- key -->
  <rect class="you" x="16" y="434" width="16" height="16" rx="3"/>
  <text class="key" x="40" y="447">= a decision you make</text>
</svg>
