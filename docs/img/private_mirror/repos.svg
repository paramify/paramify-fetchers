<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .mine { fill: #eef4ff; stroke: #9ec0ff; stroke-width: 1.5; }
    .opt { fill: #ffffff; stroke: #afb8c1; stroke-dasharray: 6 4; }
    .name { fill: #1f2328; font-size: 14px; font-weight: 700; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .sub { fill: #59636e; font-size: 12.5px; }
    .li { fill: #1f2328; font-size: 13px; }
    .dot { fill: #8c959f; }
    .lbl { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .code { fill: #1f2328; font-size: 12px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .note { fill: #59636e; font-size: 12px; }
    .warn { fill: #cf222e; font-size: 12px; font-weight: 600; }
    .pub-p { fill: #fff8e5; stroke: #d4a72c; } .pub-t { fill: #9a6700; }
    .priv-p { fill: #dafbe1; stroke: #4ac26b; } .priv-t { fill: #1a7f37; }
    .opt-p { fill: #f6f8fa; stroke: #d0d7de; } .opt-t { fill: #59636e; }
    .pt { font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .mine { fill: #121d2f; stroke: #1f6feb; }
      .opt { fill: #0d1117; stroke: #484f58; }
      .name, .li, .lbl, .code { fill: #e6edf3; }
      .sub, .note { fill: #9198a1; }
      .dot { fill: #6e7681; }
      .warn { fill: #ff7b72; }
      .pub-p { fill: #2b2111; stroke: #9e6a03; } .pub-t { fill: #d29922; }
      .priv-p { fill: #0f2d1a; stroke: #238636; } .priv-t { fill: #3fb950; }
      .opt-p { fill: #161b22; stroke: #30363d; } .opt-t { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="460" rx="12"/>

  <!-- Paramify's public repo -->
  <rect class="card" x="290" y="20" width="380" height="118" rx="10"/>
  <rect class="pub-p" x="306" y="34" width="62" height="20" rx="10"/>
  <text class="pt pub-t" x="337" y="48" text-anchor="middle">PUBLIC</text>
  <text class="name" x="306" y="80">paramify/paramify-fetchers</text>
  <text class="sub" x="306" y="102">Paramify's repo: the source of releases</text>
  <text class="code" x="306" y="124">v0.5.0-beta · v0.5.1-beta · …</text>

  <!-- Your private copy -->
  <rect class="mine" x="24" y="250" width="440" height="190" rx="10"/>
  <rect class="priv-p" x="40" y="264" width="70" height="20" rx="10"/>
  <text class="pt priv-t" x="75" y="278" text-anchor="middle">PRIVATE</text>
  <text class="name" x="40" y="310">your-org/paramify-fetchers</text>
  <text class="sub" x="40" y="332">Where all your work happens</text>
  <circle class="dot" cx="46" cy="358" r="2.5"/><text class="li" x="56" y="362">your own main: your fetchers, manifests, config</text>
  <circle class="dot" cx="46" cy="382" r="2.5"/><text class="li" x="56" y="386">plus each Paramify release you've merged</text>
  <circle class="dot" cx="46" cy="406" r="2.5"/><text class="li" x="56" y="410">your Paramify contact as a collaborator, if invited</text>

  <!-- Optional public fork -->
  <rect class="opt" x="600" y="250" width="336" height="190" rx="10"/>
  <rect class="opt-p" x="616" y="264" width="178" height="20" rx="10"/>
  <text class="pt opt-t" x="705" y="278" text-anchor="middle">PUBLIC FORK · OPTIONAL</text>
  <text class="name" x="616" y="310">your-org/…-contrib</text>
  <text class="sub" x="616" y="332">Most teams never create one</text>
  <circle class="dot" cx="622" cy="358" r="2.5"/><text class="li" x="632" y="362">only branches you choose to send</text>
  <circle class="dot" cx="622" cy="382" r="2.5"/><text class="li" x="632" y="386">each cut from a release tag</text>
  <circle class="dot" cx="622" cy="406" r="2.5"/><text class="li" x="632" y="410">nothing else, ever</text>

  <!-- fetch: Paramify -> private -->
  <path class="arrow" d="M340 138 V248" marker-end="url(#h)"/>
  <text class="code" x="328" y="184" text-anchor="end">git fetch upstream</text>
  <text class="note" x="328" y="203" text-anchor="end">a read-only remote, push disabled</text>

  <!-- pull request: fork -> Paramify -->
  <path class="arrow dash" d="M640 248 V140" marker-end="url(#h)"/>
  <text class="lbl" x="652" y="184">pull request</text>
  <text class="note" x="652" y="203">reviewed and merged by Paramify</text>

  <!-- branch: private -> fork -->
  <path class="arrow dash" d="M466 330 H598" marker-end="url(#h)"/>
  <text class="lbl" x="532" y="316" text-anchor="middle">one branch</text>
  <text class="warn" x="532" y="352" text-anchor="middle">never main</text>
</svg>
