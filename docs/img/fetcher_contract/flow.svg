<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-skill { fill: #eef4ff; stroke: #9ec0ff; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .you { fill: #fff8e5; stroke: #d4a72c; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .sub { fill: #59636e; font-size: 12px; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .c { fill: #59636e; font-size: 11.5px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .n { fill: #0969da; font-size: 12px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .key { fill: #59636e; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #30363d; }
      .lane-skill { fill: #121d2f; stroke: #1f6feb; }
      .box { fill: #0d1117; stroke: #30363d; }
      .you { fill: #2b2111; stroke: #9e6a03; }
      .h, .t { fill: #e6edf3; }
      .sub, .c, .key { fill: #9198a1; }
      .n { fill: #58a6ff; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="470" rx="12"/>

  <!-- Lane 1: runner sets up -->
  <rect class="lane" x="16" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="32" y="44">1 · The runner sets up</text>
  <text class="sub" x="32" y="62">Before the fetcher starts</text>

  <rect class="box" x="32" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="124">Discovery</text><text class="n" x="250" y="124" text-anchor="end">step 1</text>
  <text class="sub" x="46" y="146">every fetcher.yaml checked</text>
  <text class="sub" x="46" y="164">against the schema by list,</text>
  <text class="sub" x="46" y="182">describe, validate and run</text>

  <rect class="box" x="32" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="260">A clean environment</text><text class="n" x="250" y="260" text-anchor="end">step 2</text>
  <text class="sub" x="46" y="282">declared secrets, target fields</text>
  <text class="sub" x="46" y="300">EVIDENCE_DIR, the status file</text>
  <text class="sub" x="46" y="318">PATH, HOME, locale; nothing else</text>

  <path class="arrow" d="M148 196 V230" marker-end="url(#a)"/>

  <!-- Lane 2: the fetcher -->
  <rect class="lane-skill" x="304" y="16" width="352" height="400" rx="10"/>
  <text class="h" x="320" y="44">2 · The fetcher runs</text>
  <text class="sub" x="320" y="62">One process per target</text>

  <rect class="box" x="320" y="78" width="320" height="44" rx="8"/>
  <text class="t" x="334" y="105">Reads only the env it declared</text><text class="n" x="626" y="105" text-anchor="end">step 2</text>

  <rect class="box" x="320" y="130" width="320" height="44" rx="8"/>
  <text class="t" x="334" y="157">Collects, paginating itself</text>

  <rect class="box" x="320" y="182" width="320" height="44" rx="8"/>
  <text class="t" x="334" y="209">Writes its payload to EVIDENCE_DIR</text><text class="n" x="626" y="209" text-anchor="end">step 3</text>

  <rect class="box" x="320" y="234" width="320" height="44" rx="8"/>
  <text class="t" x="334" y="261">Lists failed calls in the payload</text><text class="n" x="626" y="261" text-anchor="end">step 5</text>

  <rect class="box" x="320" y="286" width="320" height="44" rx="8"/>
  <text class="t" x="334" y="313">On failure: report_failure()</text><text class="n" x="626" y="313" text-anchor="end">step 6</text>

  <rect class="box" x="320" y="338" width="320" height="44" rx="8"/>
  <text class="t" x="334" y="365">Exits 0, or non-zero if anything failed</text><text class="n" x="626" y="365" text-anchor="end">step 3</text>

  <!-- Lane 3: runner records -->
  <rect class="lane" x="680" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="696" y="44">3 · The runner records</text>
  <text class="sub" x="696" y="62">After the process exits</text>

  <rect class="box" x="696" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="124">Envelope per output file</text><text class="n" x="914" y="124" text-anchor="end">step 4</text>
  <text class="sub" x="710" y="146">status ← exit code only</text>
  <text class="sub" x="710" y="164">error, error_code ← status file</text>
  <text class="sub" x="710" y="182">payload left as written</text>

  <rect class="box" x="696" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="260">_run_metadata.json</text>
  <text class="sub" x="710" y="282">one row per invocation</text>
  <text class="sub" x="710" y="300">exit code + stderr tail</text>
  <text class="sub" x="710" y="318">no error or error_code (interim)</text>

  <path class="arrow" d="M812 196 V230" marker-end="url(#a)"/>

  <!-- cross-lane arrows -->
  <path class="arrow" d="M264 282 H284 V100 H318" marker-end="url(#a)"/>
  <path class="arrow" d="M640 360 H660 V146 H694" marker-end="url(#a)"/>

  <!-- key -->
  <text class="n" x="16" y="447">step N</text>
  <text class="key" x="66" y="447">= where this guide checks that clause</text>
</svg>
