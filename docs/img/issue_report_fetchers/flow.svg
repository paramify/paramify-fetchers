<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-skill { fill: #eef4ff; stroke: #9ec0ff; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .you { fill: #fff8e5; stroke: #d4a72c; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .sub { fill: #59636e; font-size: 12px; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .c { fill: #59636e; font-size: 11.5px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .n { fill: #0969da; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .key { fill: #59636e; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #30363d; }
      .lane-skill { fill: #121d2f; stroke: #1f6feb; }
      .box { fill: #0d1117; stroke: #30363d; }
      .you { fill: #2b2111; stroke: #9e6a03; }
      .h, .t { fill: #e6edf3; }
      .sub, .c, .key { fill: #9198a1; }
      .n { fill: #58a6ff; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="470" rx="12"/>

  <!-- Lane 1: build -->
  <rect class="lane" x="16" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="32" y="44">1 · Build the fetcher</text>
  <text class="sub" x="32" y="62">In your copy of the repo</text>

  <rect class="box" x="32" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="124">Copy the template</text>
  <text class="c" x="46" y="146">_template_issue_report/</text>
  <text class="sub" x="46" y="164">into fetchers/&lt;category&gt;/</text>
  <text class="sub" x="46" y="182">not the evidence template</text>

  <rect class="you" x="32" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="260">Declare it in fetcher.yaml</text>
  <text class="c" x="46" y="282">kind: issue_report</text>
  <text class="sub" x="46" y="300">the format the tool emits</text>
  <text class="sub" x="46" y="318">vulnerability or configuration</text>

  <path class="arrow" d="M148 196 V230" marker-end="url(#a)"/>

  <!-- Lane 2: collect -->
  <rect class="lane-skill" x="304" y="16" width="352" height="400" rx="10"/>
  <text class="h" x="320" y="44">2 · Collect with paramify run</text>
  <text class="sub" x="320" y="62">No Paramify connection needed</text>

  <rect class="box" x="320" y="86" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="113">1</text><text class="t" x="354" y="113">Request the export, poll until ready</text>

  <rect class="box" x="320" y="146" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="173">2</text><text class="t" x="354" y="173">Stream the tool's bytes to disk</text>

  <rect class="box" x="320" y="206" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="233">3</text><text class="t" x="354" y="233">One filename per target</text>

  <rect class="box" x="320" y="266" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="293">4</text><text class="t" x="354" y="293">Runner indexes each report</text>

  <rect class="you" x="320" y="326" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="353">5</text><text class="t" x="354" y="353">Check: same bytes as the tool's export</text>

  <!-- Lane 3: send -->
  <rect class="lane" x="680" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="696" y="44">3 · Send to an assessment</text>
  <text class="sub" x="696" y="62">Covered in the pipelines guide</text>

  <rect class="you" x="696" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="124">Pick the assessment</text>
  <text class="c" x="710" y="146">paramify assessments select</text>
  <text class="sub" x="710" y="164">and how its cycle closes</text>
  <text class="sub" x="710" y="182">saved in the manifest</text>

  <rect class="box" x="696" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="260">Send and process</text>
  <text class="c" x="710" y="282">paramify issues upload</text>
  <text class="sub" x="710" y="300">the file goes in untouched</text>
  <text class="sub" x="710" y="318">Paramify turns it into issues</text>

  <path class="arrow" d="M812 196 V230" marker-end="url(#a)"/>

  <!-- cross-lane arrows -->
  <path class="arrow" d="M264 282 H284 V108 H318" marker-end="url(#a)"/>
  <path class="arrow" d="M640 348 H660 V146 H694" marker-end="url(#a)"/>

  <!-- key -->
  <rect class="you" x="16" y="434" width="16" height="16" rx="3"/>
  <text class="key" x="40" y="447">= a decision or check that is yours</text>
</svg>
