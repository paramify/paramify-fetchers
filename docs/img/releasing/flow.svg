<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-skill { fill: #eef4ff; stroke: #9ec0ff; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .you { fill: #fff8e5; stroke: #d4a72c; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .sub { fill: #59636e; font-size: 12px; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .c { fill: #1f2328; font-size: 12px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .n { fill: #0969da; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .key { fill: #59636e; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #30363d; }
      .lane-skill { fill: #121d2f; stroke: #1f6feb; }
      .box { fill: #0d1117; stroke: #30363d; }
      .you { fill: #2b2111; stroke: #9e6a03; }
      .h, .t, .c { fill: #e6edf3; }
      .sub, .key { fill: #9198a1; }
      .n { fill: #58a6ff; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="470" rx="12"/>

  <!-- Lane 1: prepare -->
  <rect class="lane" x="16" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="32" y="44">1 · Prepare</text>
  <text class="sub" x="32" y="62">From a clean, current main</text>

  <rect class="you" x="32" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="124">Choose the version</text>
  <text class="sub" x="46" y="146">by the bump policy</text>
  <text class="sub" x="46" y="164">pre-1.0: a break bumps minor</text>
  <text class="sub" x="46" y="182">files say X.Y.Z, the tag vX.Y.Z</text>

  <rect class="box" x="32" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="260">Changelog and version</text>
  <text class="sub" x="46" y="282">[Unreleased] → [X.Y.Z] - date</text>
  <text class="sub" x="46" y="300">a fresh [Unreleased] above it</text>
  <text class="sub" x="46" y="318">version in pyproject.toml</text>

  <path class="arrow" d="M148 196 V230" marker-end="url(#a)"/>

  <!-- Lane 2: PR, merge, tag -->
  <rect class="lane-skill" x="304" y="16" width="352" height="400" rx="10"/>
  <text class="h" x="320" y="44">2 · Release PR, then the tag</text>
  <text class="sub" x="320" y="62">Reviewed like any other change</text>

  <rect class="box" x="320" y="78" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="105">1</text><text class="c" x="354" y="105">git checkout -b release/vX.Y.Z</text>

  <rect class="box" x="320" y="130" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="157">2</text><text class="c" x="354" y="157">git commit -am "chore(release)…"</text>

  <rect class="box" x="320" y="182" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="209">3</text><text class="c" x="354" y="209">gh pr create --fill</text>

  <rect class="you" x="320" y="234" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="261">4</text><text class="t" x="354" y="261">CI and review pass → you merge</text>

  <rect class="box" x="320" y="286" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="313">5</text><text class="t" x="354" y="313">Pull main, tag the merge commit</text>

  <rect class="box" x="320" y="338" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="365">6</text><text class="c" x="354" y="365">git push origin vX.Y.Z</text>

  <!-- Lane 3: publish -->
  <rect class="lane" x="680" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="696" y="44">3 · Publish &amp; verify</text>
  <text class="sub" x="696" y="62">On GitHub, from the tag</text>

  <rect class="you" x="696" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="124">gh release create vX.Y.Z</text>
  <text class="sub" x="710" y="146">notes: the changelog section</text>
  <text class="sub" x="710" y="164">source .zip and .tar.gz attached</text>
  <text class="sub" x="710" y="182">a pre-release adds --prerelease</text>

  <rect class="box" x="696" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="260">gh release view vX.Y.Z</text>
  <text class="sub" x="710" y="282">the title and tag</text>
  <text class="sub" x="710" y="300">the notes</text>
  <text class="sub" x="710" y="318">pre-release or not</text>

  <path class="arrow" d="M812 196 V230" marker-end="url(#a)"/>

  <!-- cross-lane arrows -->
  <path class="arrow" d="M264 282 H284 V100 H318" marker-end="url(#a)"/>
  <path class="arrow" d="M640 360 H660 V146 H694" marker-end="url(#a)"/>

  <!-- key -->
  <rect class="you" x="16" y="434" width="16" height="16" rx="3"/>
  <text class="key" x="40" y="447">= a decision you make</text>
</svg>
