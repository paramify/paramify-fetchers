<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-label="How a fetcher works: a fetcher reads your tools read-only and writes JSON evidence files to your disk; a separate uploader sends those files to Paramify. Fetchers never contact Paramify.">
