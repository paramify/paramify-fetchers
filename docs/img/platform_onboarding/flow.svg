<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="960" height="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-skill { fill: #eef4ff; stroke: #9ec0ff; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .you { fill: #fff8e5; stroke: #d4a72c; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .sub { fill: #59636e; font-size: 12px; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .c { fill: #59636e; font-size: 11.5px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .n { fill: #0969da; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .key { fill: #59636e; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #30363d; }
      .lane-skill { fill: #121d2f; stroke: #1f6feb; }
      .box { fill: #0d1117; stroke: #30363d; }
      .you { fill: #2b2111; stroke: #9e6a03; }
      .h, .t { fill: #e6edf3; }
      .sub, .c, .key { fill: #9198a1; }
      .n { fill: #58a6ff; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="536" rx="12"/>

  <!-- Lane 1: before -->
  <rect class="lane" x="16" y="16" width="264" height="466" rx="10"/>
  <text class="h" x="32" y="44">1 · Before you start</text>
  <text class="sub" x="32" y="62">One-time setup</text>

  <rect class="box" x="32" y="96" width="232" height="110" rx="8"/>
  <text class="t" x="46" y="124">Paramify API key</text>
  <text class="sub" x="46" y="146">with View Solution Capabilities,</text>
  <text class="sub" x="46" y="164">so the agent can read the claim</text>
  <text class="sub" x="46" y="182">(or you paste it)</text>

  <rect class="box" x="32" y="250" width="232" height="110" rx="8"/>
  <text class="t" x="46" y="278">Room for a sandbox</text>
  <text class="sub" x="46" y="300">an account to borrow, a trial,</text>
  <text class="sub" x="46" y="318">or a budget to build one</text>
  <text class="sub" x="46" y="336">that holds real data</text>

  <path class="arrow" d="M148 206 V248" marker-end="url(#a)"/>

  <!-- Lane 2: the skill -->
  <rect class="lane-skill" x="304" y="16" width="352" height="466" rx="10"/>
  <text class="h" x="320" y="44">2 · /onboard-platform in your agent</text>
  <text class="sub" x="320" y="62">State kept in .onboarding/&lt;platform&gt;/</text>

  <rect class="you" x="320" y="78" width="320" height="46" rx="8"/>
  <text class="n" x="334" y="106">1</text><text class="t" x="354" y="106">The claim: what to prove</text>

  <rect class="box" x="320" y="134" width="320" height="46" rx="8"/>
  <text class="n" x="334" y="162">2</text><text class="t" x="354" y="162">Research the API · subagent</text>

  <rect class="you" x="320" y="190" width="320" height="46" rx="8"/>
  <text class="n" x="334" y="218">3</text><text class="t" x="354" y="218">Sandbox and teardown · Gate 2</text>

  <rect class="you" x="320" y="246" width="320" height="46" rx="8"/>
  <text class="n" x="334" y="274">4</text><text class="t" x="354" y="274">The slate, in build order · Gate 1</text>

  <rect class="you" x="320" y="302" width="320" height="46" rx="8"/>
  <text class="n" x="334" y="330">5</text><text class="t" x="354" y="330">Fetcher #1, proven · Gate 3</text>

  <rect class="box" x="320" y="358" width="320" height="46" rx="8"/>
  <text class="n" x="334" y="386">6</text><text class="t" x="354" y="386">The rest, one by one · subagents</text>

  <rect class="you" x="320" y="414" width="320" height="46" rx="8"/>
  <text class="n" x="334" y="442">7</text><text class="t" x="354" y="442">Close-out: sandbox fate · Gate 4</text>

  <!-- Lane 3: after -->
  <rect class="lane" x="680" y="16" width="264" height="466" rx="10"/>
  <text class="h" x="696" y="44">3 · Commit &amp; publish</text>
  <text class="sub" x="696" y="62">Your branch, then your workspace</text>

  <rect class="you" x="696" y="96" width="232" height="110" rx="8"/>
  <text class="t" x="710" y="124">Commit the fetchers</text>
  <text class="sub" x="710" y="146">fetchers/&lt;platform&gt;/ and its</text>
  <text class="sub" x="710" y="164">category file, by explicit path;</text>
  <text class="sub" x="710" y="182">validators stay off the branch</text>

  <rect class="box" x="696" y="250" width="232" height="110" rx="8"/>
  <text class="t" x="710" y="278">Upload, sync, verify</text>
  <text class="sub" x="710" y="300">evidence first, then validators;</text>
  <text class="sub" x="710" y="318">check each new evidence set</text>
  <text class="sub" x="710" y="336">in Paramify</text>

  <path class="arrow" d="M812 206 V248" marker-end="url(#a)"/>

  <!-- cross-lane arrows -->
  <path class="arrow" d="M264 305 H284 V101 H318" marker-end="url(#a)"/>
  <path class="arrow" d="M640 437 H660 V151 H694" marker-end="url(#a)"/>

  <!-- key -->
  <rect class="you" x="16" y="500" width="16" height="16" rx="3"/>
  <text class="key" x="40" y="513">= a decision the skill leaves to you</text>
</svg>
