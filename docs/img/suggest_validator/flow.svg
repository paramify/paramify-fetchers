<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .lane-skill { fill: #eef4ff; stroke: #9ec0ff; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .you { fill: #fff8e5; stroke: #d4a72c; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 700; }
    .sub { fill: #59636e; font-size: 12px; }
    .t { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .c { fill: #59636e; font-size: 11.5px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .n { fill: #0969da; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .key { fill: #59636e; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #30363d; }
      .lane-skill { fill: #121d2f; stroke: #1f6feb; }
      .box { fill: #0d1117; stroke: #30363d; }
      .you { fill: #2b2111; stroke: #9e6a03; }
      .h, .t { fill: #e6edf3; }
      .sub, .c, .key { fill: #9198a1; }
      .n { fill: #58a6ff; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="470" rx="12"/>

  <!-- Lane 1: before -->
  <rect class="lane" x="16" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="32" y="44">1 · Before you start</text>
  <text class="sub" x="32" y="62">One-time setup</text>

  <rect class="box" x="32" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="124">Paramify API key</text>
  <text class="sub" x="46" y="146">Settings → API Keys</text>
  <text class="sub" x="46" y="164">saved in .env</text>
  <text class="sub" x="46" y="182">app.paramify.com</text>

  <rect class="box" x="32" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="46" y="260">Real, populated evidence</text>
  <text class="sub" x="46" y="282">a fetcher run against a real</text>
  <text class="sub" x="46" y="300">tenant, or an artifact already</text>
  <text class="sub" x="46" y="318">in the workspace</text>

  <path class="arrow" d="M148 196 V230" marker-end="url(#a)"/>

  <!-- Lane 2: the skill -->
  <rect class="lane-skill" x="304" y="16" width="352" height="400" rx="10"/>
  <text class="h" x="320" y="44">2 · /suggest-validator in your AI agent</text>
  <text class="sub" x="320" y="62">Phases 1–3 are an interview; 4–6 are mechanical</text>

  <rect class="box" x="320" y="78" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="105">1</text><text class="t" x="354" y="105">Find the evidence file</text>

  <rect class="box" x="320" y="130" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="157">2</text><text class="t" x="354" y="157">Read the capability narrative + control</text>

  <rect class="you" x="320" y="182" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="209">3</text><text class="t" x="354" y="209">Propose assertions → you pick</text>

  <rect class="box" x="320" y="234" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="261">4</text><text class="t" x="354" y="261">Build the validator set</text>

  <rect class="box" x="320" y="286" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="313">5</text><text class="t" x="354" y="313">Prove it can fail, then score real evidence</text>

  <rect class="box" x="320" y="338" width="320" height="44" rx="8"/>
  <text class="n" x="334" y="365">6</text><text class="t" x="354" y="365">Write validators/&lt;category&gt;/&lt;key&gt;.yaml</text>

  <!-- Lane 3: after -->
  <rect class="lane" x="680" y="16" width="264" height="400" rx="10"/>
  <text class="h" x="696" y="44">3 · Publish &amp; verify</text>
  <text class="sub" x="696" y="62">Writes to a live workspace</text>

  <rect class="you" x="696" y="96" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="124">Upload + sync</text>
  <text class="sub" x="710" y="146">evidence first, then validators</text>
  <text class="sub" x="710" y="164">ask the agent to do it,</text>
  <text class="sub" x="710" y="182">or run one command yourself</text>

  <rect class="box" x="696" y="232" width="232" height="100" rx="8"/>
  <text class="t" x="710" y="260">Verify in Paramify</text>
  <text class="sub" x="710" y="282">validators exist</text>
  <text class="sub" x="710" y="300">attached to the evidence set</text>
  <text class="sub" x="710" y="318">PASS / FAIL on each artifact</text>

  <path class="arrow" d="M812 196 V230" marker-end="url(#a)"/>

  <!-- cross-lane arrows -->
  <path class="arrow" d="M264 282 H284 V100 H318" marker-end="url(#a)"/>
  <path class="arrow" d="M640 360 H660 V146 H694" marker-end="url(#a)"/>

  <!-- key -->
  <rect class="you" x="16" y="434" width="16" height="16" rx="3"/>
  <text class="key" x="40" y="447">= a decision the skill leaves to you</text>
</svg>
