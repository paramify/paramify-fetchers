name: paramify_issues
version: 0.2.0
description: >
  Sends raw issue reports (vulnerability scans, CSPM findings) from a run
  directory into Paramify pipelines. Reads issue-reports/_issue_reports.json,
  uploads each report byte-for-byte to POST /pipelines/{assessmentId}/intake,
  then queues one process job per assessment over exactly those artifacts and
  waits for it. Closes the cycle only for close_cycle: after_run on a complete
  run. Idempotent per run via a local intake log.

runtime:
  type: python
  entry: uploader.py

# Source-agnostic: the token can come from .env, a secret manager, CI vars, etc.
# The same token the evidence uploader uses; it needs PIPELINE_INTAKE, plus
# PIPELINE_PROCESS to process, plus PIPELINE_CLOSE to close.
secrets:
  - name: api_token
    env: PARAMIFY_UPLOAD_API_TOKEN

config_schema:
  base_url:
    type: string
    default: https://app.paramify.com/api/v0
    env: PARAMIFY_API_BASE_URL
    description: Paramify REST API v0 base URL.
  skip_failed:
    type: boolean
    default: true
    description: >
      Skip reports whose collection failed. Defaults to true, unlike the evidence
      uploader — a partial scan file is parsed into issues, and findings missing
      from it read as resolved, which silently closes real vulnerabilities.
  wait_timeout_sec:
    type: number
    default: 900
    description: >
      How long to wait for each assessment's process job before reporting it as
      still running and exiting non-zero. `--wait-timeout` overrides it.
