# gitleaks configuration for paramify-fetchers.
#
# CI runs `gitleaks git` over the full repo history (see .github/workflows/ci.yml,
# the `secrets` job). gitleaks auto-detects this file at the repo root.
#
# We keep gitleaks' full default ruleset and add narrowly-scoped allowlists for
# known false positives only. Each allowlist below documents *why* the match is
# not a secret; prefer adding a tightly-scoped entry over broadening an existing
# one.

[extend]
useDefault = true

# --- False positive: validator registry `key:` field ------------------------ #
# Every validator lives in validators/<category>/<id>.yaml and begins with
#   key: <validator-id>        e.g. `key: s3_replication_kms_encryption`
# gitleaks' generic-api-key rule reads that YAML field name as a credential
# assignment (`key: <value>`) and, when the identifier is long enough to clear
# its entropy threshold, reports it as a leak. The value is a declarative
# validator identifier, not a secret.
#
# Scoped with condition = "AND" so it suppresses a finding ONLY when all three
# hold: the generic-api-key rule, a file under validators/, and the leading
# `key: <snake_id>` line. A real credential elsewhere in a validator file — or a
# different rule — is still reported.
[[allowlists]]
description = "Validator registry `key: <id>` field is an identifier, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''validators/.*\.ya?ml$''']
regexes = ['''^key:\s+[a-z0-9_]+\s*$''']
regexTarget = "line"

# --- False positive: Microsoft first-party application ID -------------------- #
# `797f4846-ba00-4fd7-ba43-dac1f8f63013` is Microsoft's PUBLISHED application id
# for the "Windows Azure Service Management API". It is the same value in every
# Entra tenant on earth — Microsoft documents it, and naming it is the supported
# way to scope a Conditional Access policy to the ARM control plane. The Azure
# Conditional Access fetcher needs the literal to answer "is MFA required for
# Azure management?"; upstream Prowler carries the same constant in
# prowler/providers/azure/config.py.
#
# generic-api-key fires because the constant's name ends in `_API` and a UUID
# clears the rule's entropy threshold — name-plus-entropy, not an actual leak.
#
# Scoped with condition = "AND" and the exact known-public GUID in the regex, so
# assigning any OTHER value to this constant is still reported.
#
# The `(?m)` is required, not stylistic. For this finding gitleaks hands the
# allowlist a `line` that is not exactly one line, so a bare `^`-anchored regex
# never matches and the entry silently does nothing. Verified against gitleaks
# 8.30.1 (the version ci.yml installs): every `^...`/`^...$`/`^...\s*$` form
# fails, `(?m)^...\s*$` suppresses. If you add an entry here, prove it works —
# a broken allowlist looks identical to a passing scan until the leak is real.
[[allowlists]]
description = "Microsoft-published Windows Azure Service Management API app id is a public constant"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''fetchers/azure/entra_conditional_access_policies/fetcher\.py$''']
regexes = ['''(?m)^WINDOWS_AZURE_SERVICE_MANAGEMENT_API = "797f4846-ba00-4fd7-ba43-dac1f8f63013"\s*$''']
regexTarget = "line"

# --- False positive: GCP key-algorithm enum in deleted test fixtures --------- #
# `KEY_ALG_RSA_2048` is the GCP IAM enum NAME for an RSA-2048 service-account
# key algorithm — the literal string the API returns in a key's `keyAlgorithm`
# field. It names an algorithm; it is not key material. The fetcher that reads
# that field (gcp_iam_service_accounts) never collects key material at all.
#
# generic-api-key fires because the field name pairs "key" with "algorithm" and
# the enum clears the rule's entropy threshold (3.58) — name-plus-entropy, the
# same shape as the entry above, not an actual leak.
#
# The three matches are in synthetic fixtures in a file deleted in 9744a37, when
# the GCP fetcher unit tests came out the way the Azure ones did in 65d59f3. The
# value never appeared anywhere else, in any commit, so scoping to that path and
# that exact literal means this entry cannot suppress a finding in live code —
# it exists purely because `gitleaks git` still walks the deleted blob.
#
# `(?m)` is required for the reason documented on the entry above; both the
# snake_case and camelCase fixture spellings are matched.
[[allowlists]]
description = "GCP KEY_ALG_RSA_2048 is an algorithm enum name in deleted synthetic fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''tests/test_gcp_platform_fetchers\.py$''']
regexes = ['''(?m)^\s*"(?:key_algorithm|keyAlgorithm)": "KEY_ALG_RSA_2048",\s*$''']
regexTarget = "line"

# --- False positive: Entra "Password Rule Settings" directory template id ---- #
# `5cf42378-d67d-4f36-ba46-e8b86229381d` is Microsoft's PUBLISHED id for the
# "Password Rule Settings" directory setting template — the same value in every
# Entra tenant (Microsoft Graph documents it; it is how a tenant's password
# protection / smart lockout settings object is found). The Entra authentication
# policy fetcher needs the literal to locate that settings object, and to report
# the template's defaults when a tenant never created one.
#
# generic-api-key fires because the constant's name ends in `_ID` and a UUID
# clears the rule's entropy threshold — name-plus-entropy, the same shape as the
# service-management app id entry above, not an actual leak.
#
# Scoped with condition = "AND", the one file, and the exact known-public GUID,
# so assigning any OTHER value to this constant is still reported. `(?m)` is
# required for the reason documented on the service-management entry.
[[allowlists]]
description = "Microsoft-published Entra Password Rule Settings template id is a public constant"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''fetchers/azure/entra_authentication_policy/fetcher\.py$''']
regexes = ['''(?m)^PASSWORD_RULE_TEMPLATE_ID = "5cf42378-d67d-4f36-ba46-e8b86229381d"\s*$''']
regexTarget = "line"
