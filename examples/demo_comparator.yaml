# Zero-credential comparator demo. Run it as-is:
#
#     paramify run examples/demo_comparator.yaml
#     paramify evidence evidence/run-*/demo_policy_check.json
#
# demo_policy_check is listed first on purpose: the runner moves a comparator
# after the fetchers it reads, so demo_hello still runs first.

run:
  output_dir: ./evidence

  fetchers:
    - use: demo_policy_check
    - use: demo_hello
