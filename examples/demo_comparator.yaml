# Zero-credential comparator demo. Run it as-is:
#
#     paramify run examples/demo_comparator.yaml
#     paramify evidence evidence/run-*/demo_policy_check.json
#
# demo_policy_check is listed first on purpose: a run takes every fetcher
# before any comparator, so demo_hello still runs first.

run:
  output_dir: ./evidence

  fetchers:
    - use: demo_policy_check
    - use: demo_hello
