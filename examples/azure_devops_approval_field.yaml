# Example: Azure DevOps change records approved through a person field, brought in partway.
# The organization, project, type and field names below are synthetic.
#
# Set before running:
#   export AZURE_DEVOPS_PAT=<token with Work Items, Code, and Project and Team (all Read)>
#
# The change types carry a person (identity) field, Custom.ChangeApprover, whose filling
# is the approval: approval_source field ignores approval states and comments. Items
# finished before 2026-01-15, when the field was added, are judged as before by
# approval_before_field (states_and_comments), or by either route (both), or left out
# of every approval figure (exclude); open items are judged by the field. A filled field approves from the last update that
# set it to the person it names now. Find a field's reference name with
# GET https://dev.azure.com/<org>/_apis/wit/fields.
#
# Emergency Change items may be approved after their change: a changeset made before
# their approval is listed in emergency_items_approved_after_change, not in
# change_items_changed_before_approval.

run:
  output_dir: ./evidence

  fetchers:
    - use: azure_devops_work_items
      config:
        work_item_types: Normal Change,Emergency Change,Standard Change
        approval_types: Normal Change,Emergency Change
        approval_field: Custom.ChangeApprover
        approval_source: field
        approval_field_from: "2026-01-15"
        approval_before_field: both
        emergency_types: Emergency Change
      targets:
        - organization_url: https://dev.azure.com/contoso
          projects: Web
          secrets:
            pat: ${env:AZURE_DEVOPS_PAT}
