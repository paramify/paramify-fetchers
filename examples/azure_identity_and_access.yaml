# Azure identity and access evidence — who can sign in and how (Microsoft Entra ID),
# and who can do what once they are in (Azure RBAC).
#
# Auth is azure-identity's DefaultAzureCredential — there is no secret to set.
#   - Local:      az login          (cached CLI token under $HOME)
#   - In-cluster: AKS workload identity (AZURE_TENANT_ID + AZURE_CLIENT_ID +
#                 AZURE_FEDERATED_TOKEN_FILE; no stored secret)
#   - Azure VM / App Service: managed identity via IMDS (nothing to wire)
# See fetchers/_categories/azure.yaml for the full resolution order.
#
# TWO DIFFERENT SCOPES, and this is the thing to get right in this manifest:
#
#   * The five `azure_entra_*` fetchers read MICROSOFT GRAPH, which is TENANT-scoped.
#     Their fanout unit is the tenant — one target per Entra tenant, keyed by
#     `tenant_id`. Listing two subscriptions from the same tenant would collect
#     byte-identical evidence twice under one filename.
#   * The two `azure_rbac_*` fetchers read ARM, which is SUBSCRIPTION-scoped. Their
#     fanout unit is the subscription — one target per subscription, as the rest of
#     the Azure category does.
#
# ACCESS NEEDED — the two halves need different grants, and the Graph half is the one
# that usually is not set up yet:
#
#   ARM (both azure_rbac_* fetchers):
#     - the built-in **Reader** role on each subscription in `targets`.
#
#   Microsoft Graph (all five azure_entra_* fetchers) — APPLICATION permissions on the
#   app registration or managed identity the credential resolves to, each needing
#   admin consent. Delegated permissions from an `az login` session are NOT enough
#   for the reports endpoints.
#     - Directory.Read.All   — users, directory roles and their members, app registrations
#     - Application.Read.All — service principals and federated identity credentials
#                              (azure_entra_service_principals; Directory.Read.All
#                              also covers it)
#     - AuditLog.Read.All    — signInActivity on users (silently null without it)
#     - Reports.Read.All     — the authentication-methods registration report (MFA capability)
#     - Policy.Read.All      — Conditional Access policies
#     - Organization.Read.All— the tenant id / verified domain recorded as provenance
#   A denied Organization.Read.All degrades gracefully: the tenant identity falls back
#   to AZURE_TENANT_ID and the run still succeeds. The others do not — a denied
#   read is recorded as an API failure and the fetcher exits non-zero, by design, so a
#   permission gap can never be mistaken for an empty tenant.
#
# LICENSING: azure_entra_conditional_access_policies returns an empty list on a tenant
# without Entra ID P1/P2, because such a tenant cannot create Conditional Access
# policies at all — Graph answers with `[]` rather than an error. `total_policies: 0`
# therefore means either "no policies configured" or "not licensed", and this fetcher
# does not read the tenant's license state to tell them apart.
#
# Replace the tenant and subscription ids below with your own.
run:
  output_dir: ./evidence

  platforms:
    azure:
      # Optional: let the ambient credential-chain selectors through the runner's
      # env whitelist. They only take effect if actually set, and none is a secret
      # on the workload-identity / managed-identity paths. The category file
      # already declares this set; repeating it here documents the run's auth path.
      #
      # AZURE_AUTHORITY_HOST is worth calling out for the Graph fetchers: they derive
      # which Graph cloud to talk to from it (Azure Government, China), because
      # pointing only the OAuth scope at a sovereign cloud while the HTTP transport
      # stays on graph.microsoft.com is the classic way to get empty Graph evidence
      # that looks valid. Leave it unset for the public cloud.
      auth:
        passthrough_env:
          - AZURE_TENANT_ID
          - AZURE_CLIENT_ID
          - AZURE_FEDERATED_TOKEN_FILE
          - AZURE_AUTHORITY_HOST

  fetchers:
    # --- Microsoft Entra ID: tenant-scoped. One target per TENANT. ---
    - use: azure_entra_mfa_status
      targets:
        - tenant_id: 11111111-1111-1111-1111-111111111111
          environment: preprod

    - use: azure_entra_privileged_roles
      targets:
        - tenant_id: 11111111-1111-1111-1111-111111111111
          environment: preprod

    - use: azure_entra_conditional_access_policies
      targets:
        - tenant_id: 11111111-1111-1111-1111-111111111111
          environment: preprod

    - use: azure_entra_app_registrations
      targets:
        - tenant_id: 11111111-1111-1111-1111-111111111111
          environment: preprod

    - use: azure_entra_service_principals
      targets:
        - tenant_id: 11111111-1111-1111-1111-111111111111
          environment: preprod

    # --- Azure RBAC: subscription-scoped. One target per SUBSCRIPTION. ---
    - use: azure_rbac_role_assignments
      targets:
        - subscription_id: 00000000-0000-0000-0000-000000000000
          environment: preprod

    - use: azure_rbac_custom_roles
      targets:
        - subscription_id: 00000000-0000-0000-0000-000000000000
          environment: preprod
